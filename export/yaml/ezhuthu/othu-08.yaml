# இக்கோப்பு data_v2-இலிருந்து உருவானது. 'moolam' (சூத்திரம்) திருத்தக் கூடாது (பொருள். 652).
- id: ezhu.296
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 296
  moolam: |-
    ஞகாரை ஒற்றிய தொழிற்பெயர் முன்னர்
    அல்லது கிளப்பினும் வேற்றுமைக் கண்ணும்
    வல்லெழுத் தியையின் அவ்வெழுத்து மிகுமே
    உகரம் வருதல் ஆவயி னான
  kaandigai:
    porul: ஞகார ஈற்றுத் தொழிற்பெயர் முன், அல்வழியிலும் வேற்றுமையிலும் வல்லெழுத்து வந்தால் அவ்வெழுத்து மிகும்; அவ்விடத்து உகரமும் வரும்.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: மெய்யீற்றுப் புணர்ச்சி எழு. 78-இன் வரிசையில் ஞகரத்திலிருந்து தொடங்குகிறது ("ஞ ண ந ம ன ய ர ல வ ழ ள"). ஞ ஈறு அருகியதால் உகரம் வந்து புணர்கிறது; வருமொழி ஞ ந ம வ ஆயினும் அவ்வுகரம் நிலைக்கும் — "ஞநமவ இயையினும் உகரம் நிலையும்" (எழு. 297).
    eduthukkaattu:
    - text: ஞ ண ந ம ன ய ர ல வ ழ ள
      from: ezhu.78
    - text: ஞநமவ இயையினும் உகரம் நிலையும்
      from: ezhu.297
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ஞ_தொழிற்பெயர்
    context:
    - அல்வழி
    - வேற்றுமை
    ops:
    - வல்லின_மிகு
    - உகர_வரவு
  links:
  - ezhu.297
  - ezhu.306
  urai:
    iyaipu:
    - ezhu.297
    - ezhu.298
    text: 'இயைபு (649): எழு. 297, 298 · புள்ளிமயங்கியலின் நுதலியது. ஓத்தின் வரிசை: ஞ (296), ந (298), ண (302), ம (310), ன (332), ய (357), ர (362), ல (366), வ (378), ழ (383), ள (396) — எழு. 78-இன் புள்ளியிறுதிப் பட்டியல் (ஞ ண ந ம ன ய ர ல வ ழ ள) வரிசையே; ந மட்டும் ணவுக்கு முன் — "நகர இறுதியும் அதனோ ரற்றே" (298) என ஞவோடு மாட்டேறு பெறுவதால் என்பது ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.297
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 297
  moolam: |-
    ஞநமவ இயையினும் உகரம் நிலையும்
  kaandigai:
    porul: ஞ, ந, ம, வ வந்தாலும் உகரம் நிலைபெறும்.
    ethu: 296 ஞ-ஒற்றுத் தொழிற்பெயருக்கு வல்லின மிகுதி என்றது; ஞ, ந, ம, வ வரும்போது உகரம் நிலையும் — வல்லெழுத்து மிகுதல் இல்லை.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ஞ_தொழிற்பெயர்
    context:
    - ஞ
    - ந
    - ம
    - வ
    property: உகர_நிலை
  links: []
  urai:
    iyaipu:
    - ezhu.296
    - ezhu.298
    text: 'இயைபு (649): 296 பொது. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விலக்கு
    thunivu: நூலில் நேரடியாக
    vilakkukkuriyathu:
    - ezhu.296
- id: ezhu.298
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 298
  moolam: |-
    நகர இறுதியும் அதனோ ரற்றே
  kaandigai:
    porul: நகர ஈறும் அவ்வாறே (296, 297).
    ethu: 296 ஞ-ஒற்றுக்குச் சொன்னது; நகர இறுதிக்கும் அவ்வியல்பே.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ந_ஈறு
    analogy: ezhu.296
  links: []
  urai:
    iyaipu:
    - ezhu.296
    - ezhu.297
    text: 'இயைபு (649): 296 ஞ, 298 ந — ஒரே இயல். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.299
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 299
  moolam: |-
    வேற்றுமைக்கு உக்கெட அகரம் நிலையும்
  kaandigai:
    porul: (நகர ஈற்றுக்கு) வேற்றுமையில் உகரம் கெட்டு அகரம் நிலைபெறும்.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 297 ஞ, ந, ம, வ வரின் உகரம் நிலையும் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ந_ஈறு
    context: வேற்றுமை
    ops:
    - உ_கெடு
    - அ_நிலை
  links: []
  urai:
    iyaipu:
    - ezhu.297
    - ezhu.298
    text: 'இயைபு (649): 308 வேற்றுமை இயற்கை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.300
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 300
  moolam: |-
    வெரிந்என் இறுதி முழுதுங் கெடுவழி
    வருமிடன் உடைத்தே மெல்லெழுத் தியற்கை
  kaandigai:
    porul: '"வெரிந்" என்பதன் இறுதி முழுதும் கெடும்போது மெல்லெழுத்து வரும் இடமும் உண்டு.'
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 296 வல்லின மிகுதி சொன்னது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: வெரிந்
    ops:
    - இறுதி_முழு_கெடு
    - மெல்லின_வரவு
  links: []
  urai:
    iyaipu:
    - ezhu.296
    - ezhu.299
    text: 'இயைபு (649): 296 ஞ, 300 வெரிந் — இவை மாற்று வழிகள். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.301
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 301
  moolam: |-
    ஆவயின் வல்லெழுத்து மிகுதலும் உரித்தே
  kaandigai:
    porul: அவ்விடத்து வல்லெழுத்து மிகுதலும் உரியது.
    ethu: 300 வெரிந் இறுதி கெடும் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: வெரிந்
    op: வல்லின_மிகு
  links: []
  urai:
    iyaipu:
    - ezhu.300
    - ezhu.299
    text: 'இயைபு (649): 300 மெல்லினம்; 301 வல்லினம் — இரு வழி. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: அதிகார முறை
    saanru: ஆவயின்
  - peyar: ஒருதலை அன்மை
    saanru: உரித்தே
- id: ezhu.302
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 302
  moolam: |-
    ணகார இறுதி வல்லெழுத் தியையின்
    டகார மாகும் வேற்றுமைப் பொருட்கே
  kaandigai:
    porul: ணகார ஈறு வல்லெழுத்தோடு இயைந்தால் வேற்றுமைப் பொருளில் டகாரமாகும்.
    ethu: 296–301 ஞ/ந-ஈற்றுக்கு வல்லின/மெல்லின மிகுதி சொன்னது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ண_ஈறு
    context: வேற்றுமை
    transform: ண→ட
  links:
  - ezhu.303
  - ezhu.309
  urai:
    iyaipu:
    - ezhu.296
    - ezhu.303
    - ezhu.332
    - ezhu.396
    text: 'இயைபு (649): 332 ன → ற; 396 ளகாரம் ணகார இயற்று — மூன்று இனம். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.303
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 303
  moolam: |-
    ஆணும் பெண்ணும் அஃறிணை இயற்கை
  kaandigai:
    porul: '"ஆண்", "பெண்" அஃறிணைப் பெயரின் இயல்பின.'
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 302 ண → ட சொன்னது; ஆண், பெண் ஆகிய இரு பெயரும் அஃறிணை இயற்கைய.
    eduthukkaattu:
    - text: ஆண்பாற் பெயர்
      from: porul.546
    - text: பெண்பால்
      from: porul.595
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    items:
    - ஆண்
    - பெண்
    class: அஃறிணை_இயல்பு
  links: []
  urai:
    iyaipu:
    - ezhu.302
    - ezhu.304
    - sol.165
    text: 'இயைபு (649): சொல். 165 ஆண்/பெண் பெயர் வரிசை. எடுத்துக்காட்டு: “ஆண்பாற் பெயர்” (பொருள். 546), “பெண்பால்” (பொருள். 595) — ஆண், பெண் வல்லெழுத்தின் முன் டகரம் ஆகவில்லை (302-இன் திரிபு இல்லை).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.304
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 304
  moolam: |-
    ஆண்மரக் கிளவி அரைமர இயற்றே
  kaandigai:
    porul: '"ஆண்" மரப்பெயர் அரைமரத்தின் இயல்பினது (உயிர்மயங்கியல் 283-இன் மாட்டேறு).'
    ethu: 303 ஆண், பெண் அஃறிணை இயல்பு என்றது; ஆண் என்னும் மரப்பெயர் அரைமரம் (எழு. 283) போல அம் சாரியையோடு சிவணும் — "அரைமர இயற்றே".
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: ஆண்_மரம்
    analogy: அரை_மரம்
  links: []
  urai:
    iyaipu:
    - ezhu.283
    - ezhu.303
    text: 'இயைபு (649): 283 அரைமரம்; 303 ஆண், பெண். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒப்பக் கூறல்
    saanru: இயற்றே
- id: ezhu.305
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 305
  moolam: |-
    விண்ணென வரூஉங் காயப் பெயர்வயின்
    உண்மையு முரித்தே அத்தென் சாரியை
    செய்யுள் மருங்கின் தொழில்வரு காலை
  kaandigai:
    porul: '"விண்" என வரும் காயப் (வான்) பெயருக்கு, செய்யுளில் தொழில் வரும்போது அத்துச் சாரியை வருதலும் உண்டு.'
    ethu: 302–304 ணகாரம் → ட/ண சொன்னது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: விண்
    suffix: அத்து
    context:
    - செய்யுள்
    - தொழில்
  links: []
  urai:
    iyaipu:
    - ezhu.302
    - ezhu.306
    - ezhu.307
    text: 'இயைபு (649): 306 தொழிற்பெயர், 307 கிளைப்பெயர் — விண்-வகை வரிசை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.306
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 306
  moolam: |-
    தொழிற்பெய ரெல்லாந் தொழிற்பெய ரியல
  kaandigai:
    porul: தொழிற்பெயர் எல்லாம் தொழிற்பெயர் இயல்பின (296).
    ethu: 305 விண்-க்கு அத்து சொன்னது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: தொழிற்பெயர்
    analogy: ezhu.296
  links: []
  urai:
    iyaipu:
    - ezhu.305
    - ezhu.327
    - ezhu.376
    - ezhu.401
    text: 'இயைபு (649): 327, 376, 401 இதே வாக்கியத்தைத் திரும்பச் சொல்கின்றன. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.307
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 307
  moolam: |-
    கிளைப்பெய ரெல்லாங் கொளத்திரி பிலவே
  kaandigai:
    porul: கிளைப்பெயர் எல்லாம் திரிபு இல்லாதவை.
    ethu: 305 விண், 306 தொழிற்பெயர் என்றது; கிளைப்பெயர் எல்லாம் கொளத்திரிபிலவே (வேற்றுமையில் திரிபின்றி நிற்கும்).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: கிளைப்பெயர்
    property: திரிபு_இல
  links: []
  urai:
    iyaipu:
    - ezhu.305
    - ezhu.338
    text: 'இயைபு (649): 338 கிளைப்பெயர் வரிசை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.308
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 308
  moolam: |-
    வேற்றுமை யல்வழி எண்ணென் உணவுப்பெயர்
    வேற்றுமை யியற்கை நிலையலு முரித்தே
  kaandigai:
    porul: அல்வழியில் "எண்" என்ற உணவுப்பெயர் வேற்றுமை இயல்பில் நிற்றலும் உண்டு.
    ethu: 302–307 பெயரியல் திரிபுகள் சொன்னது; எண், உணவுப் பெயர் வேற்றுமை அல்வழியில் வேற்றுமை இயற்கையை நிலைபெறும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: எண்_உணவுப்பெயர்
    context: அல்வழி
    property: வேற்றுமை_இயல்பு
  links: []
  urai:
    iyaipu:
    - ezhu.299
    - ezhu.309
    text: 'இயைபு (649): 299 உகர-அகரம்; 309 முரண் தொழிற்பெயர். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.309
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 309
  moolam: |-
    முரணென் தொழிற்பெயர் முதலியல் நிலையும்
  kaandigai:
    porul: '"முரண்" தொழிற்பெயர் முதலியலில் (302) நிற்கும்.'
    ethu: 308 எண்/உணவுப் பெயருக்கு இயற்கை நிலை சொன்னது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: முரண்
    analogy: ezhu.302
  links: []
  urai:
    iyaipu:
    - ezhu.308
    - ezhu.310
    text: 'இயைபு (649): 308, 310 — வேற்றுமை இயற்கைத் தொடர். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.310
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 310
  moolam: |-
    மகர இறுதி வேற்றுமை யாயின்
    துவரக் கெட்டு வல்லெழுத்து மிகுமே
  kaandigai:
    porul: மகர ஈறு வேற்றுமையானால் (மகரம்) முழுதும் கெட்டு வல்லெழுத்து மிகும்.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: ண இறுதி 302–309-இல் முடிந்தது; மகர இறுதி வேற்றுமையாயின் மகரம் முழுதும் கெட்டு வல்லெழுத்து மிகும்.
    eduthukkaattu:
    - text: மரப்பெயர்க் கிளவி
      from: ezhu.181
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ம_ஈறு
    context: வேற்றுமை
    ops:
    - மகர_கெடு
    - வல்லின_மிகு
  links:
  - ezhu.311
  - ezhu.314
  urai:
    iyaipu:
    - ezhu.308
    - ezhu.309
    text: 'இயைபு (649): 308–309 இயற்கை; 310 மகரம் கெடும் வழி. எடுத்துக்காட்டு: “மரப்பெயர்க் கிளவி” (எழு. 181) — மரம் + பெயர் — மகரம் கெட்டு வல்லெழுத்து மிகுந்தது.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.311
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 311
  moolam: |-
    அகர ஆகாரம் வரூஉங் காலை
    ஈற்றுமிசை அகரம் நீடலு முரித்தே
  kaandigai:
    porul: அகர ஆகாரம் வந்தால் ஈற்றின் மேல் அகரம் நீளுதலும் உண்டு.
    ethu: 310 மகரம் கெடும் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ம_ஈறு
    context:
    - அ
    - ஆ
    op: அகர_நீட்சி
  links: []
  urai:
    iyaipu:
    - ezhu.310
    - ezhu.312
    - ezhu.313
    text: 'இயைபு (649): 310 மகரம்; 311 அகர நீடல். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.312
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 312
  moolam: |-
    மெல்லெழுத் துறழும் மொழியுமா ருளவே
    செல்வழி அறிதல் வழக்கத் தான
  kaandigai:
    porul: மெல்லெழுத்தோடு உறழும் மொழிகளும் உள; அவை வழக்கால் அறிக.
    ethu: 311 அகர நீடல் என்றது; இது அதன் தொடர்ச்சி.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    class: ம_ஈறு
    property: மெல்லின_உறழ்
    evidence: வழக்கு
  links: []
  urai:
    iyaipu:
    - ezhu.311
    - ezhu.314
    text: 'இயைபு (649): 314 “மெல்லெழுத்தாகும்” பொது; 312 “உளவே” — எவை என நூல் பெயரிடவில்லை — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; எவை என ஒருதலை அன்மை
- id: ezhu.313
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 313
  moolam: |-
    இல்ல மரப்பெயர் விசைமர இயற்றே
  kaandigai:
    porul: '"இல்லம்" மரப்பெயர் விசைமரத்தின் இயல்பினது (உயிர்மயங்கியல் 282).'
    ethu: மகர ஈற்று மரப்பெயர் இல்லம் என்பது விசைமரம் (எழு. 282) போல முடியும் — "விசைமர இயற்றே".
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: இல்லம்
    analogy: விசை_மரம்
  links: []
  urai:
    iyaipu:
    - ezhu.282
    text: 'இயைபு (649): 243 உதிமரம், 262 ஒடுமரம், 313 இல்லம் — மரப்பெயர் வரிசை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒப்பக் கூறல்
    saanru: இயற்றே
- id: ezhu.314
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 314
  moolam: |-
    அல்வழி யெல்லாம் மெல்லெழுத் தாகும்
  kaandigai:
    porul: (மகர ஈற்றுக்கு) அல்வழி எல்லாம் மெல்லெழுத்தாகும்.
    ethu: 311–313 மரம்/இல்லம் என்ற மெல்லெழுத்து மிகுதி; அல்வழி எல்லாம் மெல்லெழுத்தாகும் (பொது).
    eduthukkaattu:
    - text: நெல்லுஞ் செல்லுங் கொல்லுஞ் சொல்லும்
      from: ezhu.371
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ம_ஈறு
    context: அல்வழி
    op: மெல்லின_ஆதல்
  links: []
  urai:
    iyaipu:
    - ezhu.311
    - ezhu.312
    - ezhu.361
    - ezhu.368
    - ezhu.398
    text: 'இயைபு (649): 361, 368, 398 இதே «அல்வழி எல்லாம்» தொடர். எடுத்துக்காட்டு: “நெல்லுஞ் செல்லுங் கொல்லுஞ் சொல்லும்” (எழு. 371) — உம் + ச/க — அல்வழியில் மகரம் மெல்லெழுத்தானது.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.315
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 315
  moolam: |-
    அகமென் கிளவிக்குக் கைமுன் வரினே
    முதனிலை யொழிய முன்னவை கெடுதலும்
    வரைநிலை யின்றே ஆசிரி யர்க்க
    மெல்லெழுத்து மிகுத லாவயி னான
  kaandigai:
    porul: '"அகம்" முன் "கை" வந்தால் முதல் நிலை ஒழிய முன்னவை கெடுதலும் விலக்கில்லை; அவ்வழி மெல்லெழுத்து மிகும். எடுத்துக்காட்டு நூலில் இல்லை.'
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 313 இல்லம் (மரப்பெயர்) என்றது; அகம் — கை முன் வரும்போது முதனிலை ஒழிந்து முன்னவை கெடும், மெல்லெழுத்து மிகும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    items:
    - அகம்
    - கை
    ops:
    - முதனிலை_ஒழி
    - மெல்லின_மிகு
  links: []
  urai:
    iyaipu:
    - ezhu.313
    - ezhu.316
    - ezhu.317
    text: 'இயைபு (649): 313 இல்லம்; 315 அகம் — இரு மரப்பெயர். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.316
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 316
  moolam: |-
    இலமென் கிளவிக்குப் படுவரு காலை
    நிலையலு முரித்தே செய்யு ளான
  kaandigai:
    porul: '"இலம்" முன் "படு" வந்தால் செய்யுளில் (மகரம்) நிற்றலும் உண்டு.'
    ethu: 315 அகம்-க்குச் சொன்னது; இலம் — படு வரும்போது நிலையலும் உரித்து.
    eduthukkaattu:
    - text: இலம்பாடு
      from: sol.360
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    items:
    - இலம்
    - படு
    property: மகர_நிலை
    sphere: செய்யுள்
  links: []
  urai:
    iyaipu:
    - ezhu.315
    - ezhu.317
    text: 'இயைபு (649): 315 அகம்; 316 இலம் — இணை. எடுத்துக்காட்டு: “இலம்பாடு” (சொல். 360) — இலம் + பாடு — மகரம் திரியாது நின்றது.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.317
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 317
  moolam: |-
    அத்தொடு சிவணும் ஆயிரத் திறுதி
    ஒத்த எண்ணு முன்வரு காலை
  kaandigai:
    porul: '"ஆயிரம்" ஈறு ஒத்த எண் முன் வந்தால் அத்தொடு பொருந்தும்.'
    ethu: 315–316 மரப்பெயர் திரிபு சொன்னது; ஆயிரம் இறுதி அத்தொடு சிவணும் (ஒத்த எண் முன் வரும்போது).
    eduthukkaattu:
    - text: ஆயிரத்து ஆறு
      from: porul.406
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: ஆயிரம்
    suffix: அத்து
    context: ஒத்த_எண்
  links: []
  urai:
    iyaipu:
    - ezhu.315
    - ezhu.318
    - ezhu.391
    text: 'இயைபு (649): 318 அதனோ ரற்றே; 391 ஆயிரம் உகரம் கெடும். எடுத்துக்காட்டு: “ஆயிரத்து ஆறு” (பொருள். 406) — ஆயிரம் + ஆறு — அத்துச் சாரியை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.318
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 318
  moolam: |-
    அடையொடு தோன்றினும் அதனோ ரற்றே
  kaandigai:
    porul: அடையொடு தோன்றினாலும் அவ்வாறே.
    ethu: 317 ஆயிரம் அத்தொடு சிவணும் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    analogy: ezhu.317
    context: அடை
  links: []
  urai:
    iyaipu:
    - ezhu.317
    - ezhu.319
    text: 'இயைபு (649): 317 ஆயிரம்; 319 அளவு/நிறை — இணை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.319
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 319
  moolam: |-
    அளவும் நிறையும் வேற்றுமை யியல
  kaandigai:
    porul: (ஆயிரத்தின் முன்) அளவும் நிறையும் வேற்றுமை இயல்பின.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 317–318 எண்/மரம் சொன்னது; அளவு/நிறை வேற்றுமை இயலும் அவ்வாறே.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: ஆயிரம்
    classes:
    - அளவு
    - நிறை
    property: வேற்றுமை_இயல்பு
  links: []
  urai:
    iyaipu:
    - ezhu.308
    - ezhu.318
    text: 'இயைபு (649): 308 எண்/உணவுப் பெயர்; 319 அளவு/நிறை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.320
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 320
  moolam: |-
    படர்க்கைப் பெயரும் முன்னிலைப் பெயரும்
    தொடக்கங் குறுகும் பெயர்நிலைக் கிளவியும்
    வேற்றுமை யாயின் உருபியல் நிலையும்
    மெல்லெழுத்து மிகுத லாவயி னான
  kaandigai:
    porul: படர்க்கை, முன்னிலைப் பெயரும் தொடக்கம் குறுகும் பெயரும் வேற்றுமையானால் உருபியல் நிலையில் நிற்கும்; அவ்விடத்து மெல்லெழுத்து மிகும். எவை என்பது இங்கே பெயரிடப்படவில்லை (ஒருதலை அன்மை; உருபியல் ஒப்பு).
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: 315–319 தனிப் பெயர் இயல்கள் சொன்னது; இது அதன் தொடர்ச்சி.
    eduthukkaattu:
    - text: தத்தங் கிளவி
      from: ezhu.164
  nilai: ஒருதலை அன்மை
  kanini:
    kind: enumeration
    class: ம_ஈறு_உருபியல்
    count: 3
    items:
    - படர்க்கை_பெயர்
    - முன்னிலை_பெயர்
    - தொடக்க_குறுகு_பெயர்
  links: []
  urai:
    iyaipu:
    - ezhu.321
    - ezhu.322
    - ezhu.323
    - ezhu.324
    - ezhu.325
    text: 'இயைபு (649): 321, 322 இதற்கு விலக்கு; 323, 324, 325 விரிவு. எடுத்துக்காட்டு: “தத்தங் கிளவி” (எழு. 164) — தம் + கிளவி — வேற்றுமையில் மெல்லெழுத்து.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக; காண்டிகை சுட்டிய ஐயம் ஒருதலை அன்மை
- id: ezhu.321
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 321
  moolam: |-
    அல்லது கிளப்பின் இயற்கை யாகும்
  kaandigai:
    porul: அல்வழியானால் இயல்பாகும்.
    ethu: 320 படர்க்கை/முன்னிலை பெயருக்கு மெல்லெழுத்து மிகும் என்றது; அல்லது கிளப்பின் (வேற்றுமை அல்லாது) இயற்கையாகும் (விலக்கு).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ம_ஈறு
    context: அல்வழி
    property: இயல்பு
  links: []
  urai:
    iyaipu:
    - ezhu.320
    - ezhu.322
    text: 'இயைபு (649): 320 மெல்லினம்; 321 அல்வழி இயற்கை — விலக்கு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விலக்கு
    vilakkukkuriyathu:
    - ezhu.320
    thunivu: நூலில் நேரடியாக
- id: ezhu.322
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 322
  moolam: |-
    அல்லது கிளப்பினும் வேற்றுமைக் கண்ணும்
    எல்லா மெனும்பெயர் உருபியல் நிலையும்
    வேற்றுமை யல்வழிச் சாரியை நிலையாது
  kaandigai:
    porul: '"எல்லாம்" அல்வழியிலும் வேற்றுமையிலும் உருபியல் நிலையில் நிற்கும்; அல்வழியில் சாரியை நில்லாது.'
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 321 அல்வழி இயற்கை என்றது; அல்லது கிளப்பினும் வேற்றுமையிலும் எல்லாம் எனும்பெயர் உருபியல் நிலை — சாரியை நிலையாது (விதி-விலக்கு).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: எல்லாம்
    contexts:
    - அல்வழி
    - வேற்றுமை
    ops:
    - உருபியல்_நிலை
    - சாரியை_விலக்கு
  links: []
  urai:
    iyaipu:
    - ezhu.320
    - ezhu.321
    - ezhu.323
    - sol.188
    text: 'இயைபு (649): சொல். 188 “எல்லாம்” — இவ்விதிக்கு உட்படும் பெயர். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி-விலக்கு
    vilakkukkuriyathu:
    - ezhu.320
    - ezhu.321
    thunivu: நூலில் நேரடியாக
- id: ezhu.323
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 323
  moolam: |-
    மெல்லெழுத்து மிகினும் மான மில்லை
  kaandigai:
    porul: (மகர ஈற்றுப் பகுதி) அண்மை நூற்பா 322 ("எல்லாம்"); அப்பெயருக்கு மெல்லெழுத்து மிகினும் குற்றமில்லை எனக் கொள்வது சுட்டுப் பெயரிடப்படாததால் ஒருதலை அன்மை. இதே நூற்பா 341-இலும் வருகிறது.
    ethu: 322 எல்லாம் எனும்பெயர் சாரியை நிலையாது என்றது; மெல்லெழுத்து மிகினும் மானம் இல்லை (வரைநிலை விலக்கு).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: எல்லாம்
    property: மெல்லின_மிகுதல்_குற்றமில்லை
  links: []
  urai:
    iyaipu:
    - ezhu.322
    - ezhu.341
    - ezhu.246
    - ezhu.230
    text: 'இயைபு (649): 341 இதே «மானம் இல்லை» — இ-ஈற்றுப் பகுதி; 246, 230 பிற பகுதிகளில். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி-விலக்கு
    vilakkukkuriyathu:
    - ezhu.322
    thunivu: நூலில் நேரடியாக
- id: ezhu.324
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 324
  moolam: |-
    உயர்திணை யாயின் உருபியல் நிலையும்
  kaandigai:
    porul: ("எல்லாம்") உயர்திணையானால் உருபியல் நிலையில் நிற்கும்.
    ethu: 320–323 படர்க்கை/முன்னிலை பெயர் சொன்னது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: எல்லாம்
    context: உயர்திணை
    property: உருபியல்_நிலை
  links: []
  urai:
    iyaipu:
    - ezhu.320
    - ezhu.325
    text: 'இயைபு (649): 320 பொது; 324 உயர்திணை விரிவு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.325
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 325
  moolam: |-
    நும்மெ னொருபெயர் மெல்லெழுத்து மிகுமே
  kaandigai:
    porul: '"நும்" என்ற ஒரு பெயர் மெல்லெழுத்து மிகும்.'
    ethu: 324 உயர்திணை உருபியல் நிலை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: நும்
    op: மெல்லின_மிகு
  links: []
  urai:
    iyaipu:
    - ezhu.324
    - ezhu.320
    text: 'இயைபு (649): 324 உயர்திணை; 325 நும் — இணை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.326
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 326
  moolam: |-
    அல்லதன் மருங்கிற் சொல்லுங் காலை
    உக்கெட நின்ற மெய்வயின் ஈவர
    இஇடை நிலைஇ ஈறுகெட ரகரம்
    நிற்றல் வேண்டும் புள்ளியொடு புணர்ந்தே
    அப்பான் மொழிவயின் இயற்கை யாகும்
  kaandigai:
    porul: அல்வழியில், உ கெட்டு நின்ற மெய்யின் மேல் ஈ வர, இ இடை நின்று ஈறு கெட, ரகரம் புள்ளியொடு நிற்கும்; அப்பால் மொழியில் இயல்பாகும். விளைவு வடிவம் நூலில் எழுதப்படவில்லை (ஒருதலை அன்மை).
    en:
      kooruvathu: 5
      enniyathu: 5
    ethu: 320–325 மெல்லெழுத்து மிகுதி சொன்னது; அல்லதன் மருங்கில் சொல்லுங்காலை உகரம் கெட்டு நின்ற மெய்வயின் ஈவர — இ, ஈ நிலைத்து, ஈறுகெட்டு ரகரம் புள்ளியொடு நிற்கும் (இயற்கை).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ம_ஈறு_அல்வழி
    steps: 5
    steps_desc:
    - உ_கெடு
    - ஈ_வரவு
    - இ_இடைநிலை
    - ஈறு_கெடு
    - ரகர_புள்ளி
  links: []
  urai:
    iyaipu:
    - ezhu.320
    - ezhu.327
    - ezhu.328
    text: 'இயைபு (649): 320 மெல்லினம்; 326 உ-கரம்-ரகாரம் மாற்று. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஆணை கூறல்
    saanru: வேண்டும்
- id: ezhu.327
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 327
  moolam: |-
    தொழிற்பெய ரெல்லாந் தொழிற்பெய ரியல
  kaandigai:
    porul: (மகர ஈற்றுப் பகுதி) மகர ஈற்றுத் தொழிற்பெயர் எல்லாம் தொழிற்பெயர் இயல்பின. தொழிற்பெயர்ப் புணர்ச்சிக்கு முதல் விதி ஞகார ஈற்றில் வருகிறது (296-297; காண்க). இதே நூற்பா 376, 401-இலும் வருகிறது.
    ethu: ணகர ஈற்றில் (எழு. 306) சொன்னவாறே மகர ஈற்றிலும் தொழிற்பெயர் எல்லாம் தொழிற்பெயர் இயல்பின — ஒவ்வோர் ஈற்றிலும் இவ்வரி மீண்டும் வருகிறது (எழு. 376, 401).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ம_தொழிற்பெயர்
    analogy: ezhu.296
  links: []
  urai:
    iyaipu:
    - ezhu.306
    - ezhu.376
    - ezhu.401
    text: 'இயைபு (649): 306, 376, 401 — ஒரே வாக்கியம் மூன்று இடத்தில்; இது முன் விதிகளின் தொகுப்பு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.328
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 328
  moolam: |-
    ஈமுங் கம்மும் உருமென் கிளவியும்
    ஆமுப் பெயரு மவற்றோ ரன்ன
  kaandigai:
    porul: '"ஈம்", "கம்", "உரும்" — மூன்றும் அவற்றின் (தொழிற்பெயர்) இயல்பின.'
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: 326 உ/ர இயற்கை சொன்னது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: ம_தொழிற்பெயர்
    count: 3
    items:
    - ஈம்
    - கம்
    - உரும்
  links: []
  urai:
    iyaipu:
    - ezhu.326
    - ezhu.329
    text: 'இயைபு (649): 329 வேற்றுமையில் ஏனை இரண்டு (ஈ, கம்) — 328 விரிவு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.329
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 329
  moolam: |-
    வேற்றுமை யாயின் ஏனை யிரண்டும்
    தோற்றம் வேண்டும் அக்கென் சாரியை
  kaandigai:
    porul: வேற்றுமையானால் ஏனை இரண்டுக்கும் அக்குச் சாரியை வேண்டும். "ஏனை இரண்டு" எவை என்பது நூலில் குறிப்பிடப்படவில்லை (ஒருதலை அன்மை).
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 328 ஈ/கம்/உரும் சொன்னது; வேற்றுமையாயின் ஏனை இரண்டும் அக்கு சாரியை பெறும்.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    class: ம_ஈறு
    context: வேற்றுமை
    suffix: அக்கு
    items: not_named
  links: []
  urai:
    iyaipu:
    - ezhu.328
    - ezhu.119
    text: 'இயைபு (649): 119 அக்கு சாரியை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக; காண்டிகை சுட்டிய ஐயம் ஒருதலை அன்மை
  utthi:
  - peyar: ஆணை கூறல்
    saanru: வேண்டும்
- id: ezhu.330
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 330
  moolam: |-
    வகார மிசையும் மகாரங் குறுகும்
  kaandigai:
    porul: வகரத்தின் மேல் மகரம் குறுகும் (மகரக் குறுக்கம், எழு. 13 உடன் ஒப்பு).
    ethu: 329 மகர ஈற்று வேற்றுமை முடிபு சொன்னது; இது அதன் தொடர்ச்சி.
    eduthukkaattu:
    - text: நீட்டம் வேண்டின்
      from: ezhu.6
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: வ_மேல்
    op: மகர_குறுக்கம்
  links: []
  urai:
    iyaipu:
    - ezhu.13
    - ezhu.329
    text: 'இயைபு (649): 13 மகரக் குறுக்கம்; 329 மகர ஈறு. எடுத்துக்காட்டு: “நீட்டம் வேண்டின்” (எழு. 6) — மகர ஈற்றின் முன் வகரம் — மகரம் குறுகும் இடம்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.331
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 331
  moolam: |-
    நாட்பெயர்க் கிளவி மேற்கிளந் தன்ன
    அத்தும் ஆன்மிசை வரைநிலை யின்றே
    ஒற்றுமெய் கெடுதல் என்மனார் புலவர்
  kaandigai:
    porul: நாள்பெயர் முன் கூறியபடி (247); அத்தும் ஆனும் வருதல் விலக்கில்லை; ஒற்று கெடும்.
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: 330 மகரம் குறுகும் என்றது; நாட்பெயர் அத்தும் ஆன்மிசை வரைநிலை இன்றே (ஒற்றுமெய் கெடுதல்).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: நாள்_பெயர்
    ops:
    - அத்து_வரவு
    - ஆன்_வரவு
    - ஒற்று_கெடு
  links: []
  urai:
    iyaipu:
    - ezhu.330
    - ezhu.332
    - ezhu.247
    text: 'இயைபு (649): 247 நாள்முன் — நாள்-தொடர்பு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்மனார்
  - peyar: முடிந்தது காட்டல்
    saanru: மேற்கிளந் தன்ன
- id: ezhu.332
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 332
  moolam: |-
    னகார இறுதி வல்லெழுத் தியையின்
    றகார மாகும் வேற்றுமைப் பொருட்கே
  kaandigai:
    porul: னகார ஈறு வல்லெழுத்தோடு இயைந்தால் வேற்றுமைப் பொருளில் றகாரமாகும் (302-இன் இணை).
    ethu: ணகார இறுதி வேற்றுமைக்கண் டகாரமாகும் (எழு. 302) என்றது போல, னகார இறுதி வல்லெழுத்து இயையின் றகாரமாகும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ன_ஈறு
    context: வேற்றுமை
    transform: ன→ற
  links:
  - ezhu.302
  - ezhu.333
  - ezhu.340
  urai:
    iyaipu:
    - ezhu.302
    - ezhu.396
    text: 'இயைபு (649): 302 ண → ட; 332 ன → ற; 396 ளகாரம் ணகார இயற்று — மூன்று இனம். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.333
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 333
  moolam: |-
    மன்னுஞ் சின்னும் ஆனும் ஈனும்
    பின்னும் முன்னும் வினையெஞ்சு கிளவியும்
    அன்ன இயல என்மனார் புலவர்
  kaandigai:
    porul: '"மன்", "சின்", "ஆன்", "ஈன்", "பின்", "முன்", வினையெஞ்சு கிளவி — அவ்வியல்பின.'
    en:
      kooruvathu: 7
      enniyathu: 7
    ethu: 332 னகர ஈறு வல்லெழுத்து முன் றகரமாகும் என்றது; மன், சின், ஆன், ஈன், பின், முன் என்பனவும் வினையெஞ்சு கிளவியும் அவ்வியல்பின — "அன்ன இயல".
    eduthukkaattu:
    - text: முற்படக் கிளந்த
      from: ezhu.378
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: ன_ஈறு_வினையெச்ச_இயல்பு
    count: 7
    items:
    - மன்
    - சின்
    - ஆன்
    - ஈன்
    - பின்
    - முன்
    - வினையெஞ்சு
  links: []
  urai:
    iyaipu:
    - ezhu.332
    text: 'இயைபு (649): 332 னகர ஈற்றுப் பொது விதி. எடுத்துக்காட்டு: “முற்படக் கிளந்த” (எழு. 378) — முன் + பட — னகரம் றகரமானது.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்மனார்
- id: ezhu.334
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 334
  moolam: |-
    சுட்டுமுதல் வயினும் எகரமுதல் வயினும்
    அப்பண்பு நிலையும் இயற்கைய என்ப
  kaandigai:
    porul: சுட்டு முதலிலும் எகர முதலிலும் அப்பண்பு நிலைக்கும்.
    ethu: 333 வினையெஞ்சு என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ன_ஈறு
    contexts:
    - சுட்டு_முதல்
    - எகர_முதல்
    property: 333_இயல்பு
  links: []
  urai:
    iyaipu:
    - ezhu.333
    - ezhu.159
    text: 'இயைபு (649): 159 எகரமுதல் வானா — இதன் விரிவு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: ezhu.335
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 335
  moolam: |-
    குயினென் கிளவி இயற்கை யாகும்
  kaandigai:
    porul: '"குயின்" இயல்பாகும்.'
    ethu: 333–334 வினையெஞ்சு இயல்பு சொன்னது; குயின் என்னும் கிளவி இயற்கையாகும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: குயின்
    property: இயல்பு
  links: []
  urai:
    iyaipu:
    - ezhu.336
    - ezhu.337
    text: 'இயைபு (649): 336, 337 எகின் — இணை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விலக்கு
    thunivu: நூலில் நேரடியாக
    vilakkukkuriyathu:
    - ezhu.332
- id: ezhu.336
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 336
  moolam: |-
    எகின்மர மாயின் ஆண்மர இயற்றே
  kaandigai:
    porul: '"எகின்" மரமானால் ஆண்மர இயல்பினது (304).'
    ethu: 335 குயின் இயற்கை என்றது; எகின் (மரம்) ஆயின் ஆண்மர இயற்றே (ஆண்-மரம் போல).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: எகின்_மரம்
    analogy: ezhu.304
  links: []
  urai:
    iyaipu:
    - ezhu.304
    - ezhu.335
    text: 'இயைபு (649): 304 ஆண்மரம்; 337 ஏனை எகின். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒப்பக் கூறல்
    saanru: இயற்றே
- id: ezhu.337
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 337
  moolam: |-
    ஏனை எகினே யகரம் வருமே
    வல்லெழுத் தியற்கை மிகுதல் வேண்டும்
  kaandigai:
    porul: ஏனை "எகின்" (பறவை) அகரம் வரும்; வல்லெழுத்து மிகும்.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 336 எகின் (ஆண்-மரம்) என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: எகின்_பறவை
    ops:
    - அகர_வரவு
    - வல்லின_மிகு
  links: []
  urai:
    iyaipu:
    - ezhu.335
    - ezhu.336
    - ezhu.346
    text: 'இயைபு (649): 346 கன்னென் கிளவி — இதே போக்கு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஆணை கூறல்
    saanru: வேண்டும்
- id: ezhu.338
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 338
  moolam: |-
    கிளைப்பெய ரெல்லாங் கிளைப்பெய ரியல
  kaandigai:
    porul: கிளைப்பெயர் எல்லாம் கிளைப்பெயர் இயல்பின (307).
    ethu: 335–337 எகின் இயல்பு சொன்னது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: கிளைப்பெயர்
    analogy: ezhu.307
  links: []
  urai:
    iyaipu:
    - ezhu.307
    - ezhu.339
    text: 'இயைபு (649): 307 கிளைப்பெயர் பொது. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.339
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 339
  moolam: |-
    மீனென் கிளவி வல்லெழுத் துறழ்வே
  kaandigai:
    porul: '"மீன்" வல்லெழுத்தோடு உறழும்.'
    ethu: 338 கிளைப்பெயர் என்றது; மீன் கிளவி வல்லெழுத்து உறழ்வே (வல்லினம் மாறி வரும்).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: மீன்
    property: வல்லின_உறழ்
  links: []
  urai:
    iyaipu:
    - ezhu.338
    - ezhu.340
    text: 'இயைபு (649): 340 தேன் — இணை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.340
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 340
  moolam: |-
    தேனென் கிளவி வல்லெழுத் தியையின்
    மேனிலை ஒத்தலும் வல்லெழுத்து மிகுதலும்
    ஆமுறை யிரண்டும் உரிமையு முடைத்தே
    வல்லெழுத்து மிகுவழி இறுதி யில்லை
  kaandigai:
    porul: '"தேன்" வல்லெழுத்தோடு இயைந்தால் மேல்நிலை ஒத்தலும், வல்லெழுத்து மிகுதலும் இரண்டும் உரியன; மிகும் இடத்து இறுதி (னகரம்) இல்லை.'
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 339 மீன் சொன்னது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: தேன்
    ops:
    - மேல்நிலை_ஒப்பு
    - வல்லின_மிகு
    property: இறுதி_இல்லை
  links: []
  urai:
    iyaipu:
    - ezhu.339
    - ezhu.341
    text: 'இயைபு (649): 339 மீன்; 341 மெல்லினம் — விரிவு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.341
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 341
  moolam: |-
    மெல்லெழுத்து மிகினும் மான மில்லை
  kaandigai:
    porul: (னகார ஈற்றுப் பகுதி) அண்மை நூற்பா 340 ("தேன்"); அச்சொல்லுக்கு மெல்லெழுத்து மிகினும் குற்றமில்லை எனக் கொள்வது சுட்டுப் பெயரிடப்படாததால் ஒருதலை அன்மை. இதே நூற்பா 323-இலும் வருகிறது.
    ethu: 340 தேன் வல்லின மிகுதி சொன்னது; மெல்லெழுத்து மிகினும் மானம் இல்லை (வரைநிலை விலக்கு).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: தேன்
    property: மெல்லின_மிகுதல்_குற்றமில்லை
  links: []
  urai:
    iyaipu:
    - ezhu.340
    - ezhu.323
    text: 'இயைபு (649): 323 இதே “மானம் இல்லை” — எ-ஈற்றுப் பகுதி; 341 தேன். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி-விலக்கு
    vilakkukkuriyathu:
    - ezhu.340
    thunivu: நூலில் நேரடியாக
- id: ezhu.342
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 342
  moolam: |-
    மெல்லெழுத் தியையின் இறுதியொ டுறழும்
  kaandigai:
    porul: மெல்லெழுத்து இயைந்தால் இறுதியோடு உறழும்.
    ethu: 340–341 வல்லின/மெல்லின மிகுதி சொன்னது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ன_ஈறு
    context: மெல்லினம்
    op: இறுதி_உறழ்
  links: []
  urai:
    iyaipu:
    - ezhu.340
    - ezhu.341
    - ezhu.343
    text: 'இயைபு (649): 343 இறாஅல் — மறு இனம். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.343
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 343
  moolam: |-
    இறாஅல் தோற்றம் இயற்கை யாகும்
  kaandigai:
    porul: '"இறாஅல்" வந்தால் இயல்பாகும்.'
    ethu: 342 மெல்லின உறழ்வு சொன்னது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: இறாஅல்
    property: இயல்பு
  links: []
  urai:
    iyaipu:
    - ezhu.342
    - ezhu.344
    text: 'இயைபு (649): 344 ஒற்றுமிகு தகரம். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.344
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 344
  moolam: |-
    ஒற்றுமிகு தகரமொடு நிற்றலு முரித்தே
  kaandigai:
    porul: ஒற்று மிகுந்த தகரத்தோடு நிற்றலும் உண்டு.
    ethu: 343 இறாஅல் இயற்கை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ன_ஈறு
    context: ஒற்று_தகரம்
    property: நிற்றல்
  links: []
  urai:
    iyaipu:
    - ezhu.343
    - ezhu.345
    text: 'இயைபு (649): 345 மின்/பின்/பன்/கன் — இணை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.345
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 345
  moolam: |-
    மின்னும் பின்னும் பன்னும் கன்னும்
    அந்நாற் சொல்லுந் தொழிற்பெய ரியல
  kaandigai:
    porul: '"மின்", "பின்", "பன்", "கன்" — நான்கும் தொழிற்பெயர் இயல்பின.'
    en:
      kooruvathu: 4
      enniyathu: 4
    ethu: 344 ஒற்றுமிகு தகரம் சொன்னது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: ன_ஈறு_தொழிற்பெயர்
    count: 4
    items:
    - மின்
    - பின்
    - பன்
    - கன்
  links: []
  urai:
    iyaipu:
    - ezhu.344
    - ezhu.346
    - ezhu.306
    text: 'இயைபு (649): 306 தொழிற்பெயர் பொது. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.346
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 346
  moolam: |-
    வேற்றுமை யாயின் ஏனை யெகினொடு
    தோற்ற மொக்குங் கன்னென் கிளவி
  kaandigai:
    porul: வேற்றுமையானால் "கன்" ஏனை எகினோடு (337) ஒக்கும்.
    ethu: 345 தொழிற்பெயர் சொன்னது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: கன்
    context: வேற்றுமை
    analogy: ezhu.337
  links: []
  urai:
    iyaipu:
    - ezhu.345
    - ezhu.337
    text: 'இயைபு (649): 337 ஏனை எகின் — இணை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.347
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 347
  moolam: |-
    இயற்பெயர் முன்னர்த் தந்தை முறைவரின்
    முதற்கண் மெய்கெட அகரம் நிலையும்
    மெய்யொழித் தன்கெடும் அவ்வியற் பெயரே
  kaandigai:
    porul: இயற்பெயர் முன் "தந்தை" முறைப்பெயர் வந்தால், (தந்தையின்) முதல் மெய் கெட்டு அகரம் நிற்கும்; இயற்பெயர் மெய்யொழித்து "அன்" கெடும். எடுத்துக்காட்டு நூலில் இல்லை.
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: இயற்பெயர் (அன் ஈறு) முன் தந்தை என்னும் முறைப்பெயர் வரின், தந்தையின் முதல் மெய் (த்) கெட்டு அகரம் நிற்கும்; இயற்பெயரின் அன் — மெய் ஒழிய — கெடும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: தந்தை_முறைப்பெயர்
    steps: 3
    steps_desc:
    - முதன்மெய்_கெடு
    - அகர_நிலை
    - அன்_கெடு
  links: []
  urai:
    iyaipu:
    - ezhu.332
    - ezhu.348
    - ezhu.350
    text: 'இயைபு (649): 332 னகர ஈற்றுப் பொது விதி; 347 இயற்பெயர் + தந்தை; 348 ஆதன், பூதன்; 349 சிறப்பொடு வரின் இயற்கை; 350 அம் சாரியை. புணர்ந்த வடிவம் நூலுள் இல்லை — எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.348
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 348
  moolam: |-
    ஆதனும் பூதனும் கூறிய இயல்பொடு
    பெயரொற் றகரம் துவரக் கெடுமே
  kaandigai:
    porul: '"ஆதன்", "பூதன்" அவ்வியல்போடு பெயர் ஒற்றும் அகரமும் முழுதும் கெடும். "பெயரொற் றகரம்" — "ஒற்று அகரம்" எனவும் "ஒற்று தகரம்" எனவும் பிரிக்கலாம் (ஒருதலை அன்மை).'
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 347 இயற்பெயர் + தந்தை முடிபு சொன்னது; ஆதன், பூதன் என்னும் பெயர்கள் அவ்வியல்போடு பெயரின் ஒற்றும் அகரமும் முழுதும் கெடும் — "துவரக் கெடுமே".
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    items:
    - ஆதன்
    - பூதன்
    ops:
    - ஒற்று_கெடு
    - அகர_கெடு
    note: ambiguous_split
  links: []
  urai:
    iyaipu:
    - ezhu.347
    - ezhu.349
    text: 'இயைபு (649): 347 பொது; 349 சிறப்பு விலக்கு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக; காண்டிகை சுட்டிய ஐயம் ஒருதலை அன்மை
  utthi:
  - peyar: கூறிற்று என்றல்
    saanru: கூறிய
- id: ezhu.349
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 349
  moolam: |-
    சிறப்பொடு வருவழி யியற்கை யாகும்
  kaandigai:
    porul: சிறப்போடு (அடையொடு) வரும்போது இயல்பாகும்.
    ethu: 347–348 தந்தை/ஆதன்/பூதன் தகரம் கெடும் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: தந்தை_முறைப்பெயர்
    context: சிறப்பு_அடை
    property: இயல்பு
  links: []
  urai:
    iyaipu:
    - ezhu.347
    - ezhu.348
    text: 'இயைபு (649): 347, 348 தகரக்கேடு; 349 சிறப்பில் இயற்கை — விலக்கு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விலக்கு
    vilakkukkuriyathu:
    - ezhu.347
    - ezhu.348
    thunivu: நூலில் நேரடியாக
- id: ezhu.350
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 350
  moolam: |-
    அப்பெயர் மெய்யொழித் தன்கெடு வழியும்
    நிற்றலு முரித்தே அம்என் சாரியை
    மக்கள் முறைதொ கூஉம் மருங்கி னான
  kaandigai:
    porul: அப்பெயர் மெய்யொழித்து "அன்" கெடும் வழி, மக்கள் முறைப்பெயர் தொகும் இடத்து அம் சாரியை நிற்றலும் உண்டு.
    ethu: 349 சிறப்பில் இயற்கை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: தந்தை_முறைப்பெயர்
    context: மக்கள்_முறை
    suffix: அம்
  links: []
  urai:
    iyaipu:
    - ezhu.347
    - ezhu.404
    - porul.145
    text: 'இயைபு (649): 347 இயற்பெயர் + தந்தை; 350 மக்கள் முறை தொகும் இடத்து அம் சாரியை; 404 மக்கள் இறுதி. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.351
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 351
  moolam: |-
    தானும் பேனுங் கோனு மென்னும்
    ஆமுறை யியற்பெயர் திரிபிட னிலவே
  kaandigai:
    porul: '"தான்", "பேன்", "கோன்" — முறைவழி வரும் இயற்பெயர் திரிபில்லை.'
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: 347 இயற்பெயர் + தந்தை திரியும் என்றது; தான், பேன், கோன் என்னும் இயற்பெயர்களுக்கு அம்முறையில் திரிபு இல்லை — "திரிபிட னிலவே".
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: முறைவழி_இயற்பெயர்
    count: 3
    items:
    - தான்
    - பேன்
    - கோன்
    property: திரிபு_இல
  links: []
  urai:
    iyaipu:
    - ezhu.347
    - ezhu.350
    text: 'இயைபு (649): 347 பொது முடிபு; 351 அதற்கு விலக்கு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விலக்கு
    thunivu: நூலில் நேரடியாக
    vilakkukkuriyathu:
    - ezhu.347
- id: ezhu.352
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 352
  moolam: |-
    தான்யா னெனும்பெயர் உருபியல் நிலையும்
  kaandigai:
    porul: '"தான்", "யான்" உருபியல் நிலையில் நிற்கும் (உருபியல் ஒப்பு).'
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 351 தான்/பேன்/கோன் சொன்னது; இது அதன் தொடர்ச்சி.
    eduthukkaattu:
    - text: தன் கோள் கூறல்
      from: porul.656
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    items:
    - தான்
    - யான்
    property: உருபியல்_நிலை
  links: []
  urai:
    iyaipu:
    - ezhu.351
    - ezhu.353
    text: 'இயைபு (649): 351 பொது; 353 வேற்றுமை அல்வழி. எடுத்துக்காட்டு: “தன் கோள் கூறல்” (பொருள். 656) — தான் → தன் — உருபியல் நிலை (குறுகல்).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.353
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 353
  moolam: |-
    வேற்றுமை யல்வழிக் குறுகலுந் திரிதலுந்
    தோற்ற மில்லை யென்மனார் புலவர்
  kaandigai:
    porul: அல்வழியில் குறுகலும் திரிதலும் இல்லை.
    ethu: 351–352 தான்/பேன்/கோன் உருபியல் சொன்னது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    context: அல்வழி
    property: குறுகல்_திரிதல்_இல
  links: []
  urai:
    iyaipu:
    - ezhu.351
    - ezhu.352
    text: 'இயைபு (649): 351, 352 — இரண்டின் தொடர்ச்சி. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: புலவர்
- id: ezhu.354
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 354
  moolam: |-
    அழன்என் இறுதிகெட வல்லெழுத்து மிகுமே
  kaandigai:
    porul: '"அழன்" இறுதி கெட வல்லெழுத்து மிகும்.'
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 347–353 தந்தை/தான்/பேன்/கோன் சொன்னது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: அழன்
    ops:
    - ஈறு_கெடு
    - வல்லின_மிகு
  links: []
  urai:
    iyaipu:
    - ezhu.355
    - ezhu.357
    text: 'இயைபு (649): 355 முன்/இல். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.355
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 355
  moolam: |-
    முன்னென் கிளவி முன்னர்த் தோன்றும்
    இல்லென் கிளவிமிசை றகர மொற்றல்
    தொல்லியல் மருங்கின் மரீஇய மரபே
  kaandigai:
    porul: '"முன்" முன் "இல்" வந்தால் றகரம் ஒற்றுதல் தொன்று தொட்டு வந்த மரபு.'
    ethu: முன் என்னும் சொல்லின் முன் இல் என்னும் சொல் வரின், இடையில் றகர ஒற்று தோன்றும் — தொல் வழக்கில் மருவிய மரபு.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    items:
    - முன்
    - இல்
    op: ற_ஒற்று
    basis: தொல்லியல்_மரபு
  links: []
  urai:
    iyaipu:
    - ezhu.354
    - ezhu.356
    text: 'இயைபு (649): 354 அழன்; 356 பொன் — னகர ஈற்றுத் தனிச் சொற்கள். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: மொழிவாம் என்றல்
    saanru: முன்னர்த் தோன்றும்
- id: ezhu.356
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 356
  moolam: |-
    பொன்னென் கிளவி யீறுகெட முறையின்
    முன்னர்த் தோன்றும் லகார மகாரம்
    செய்யுள் மருங்கில் தொடரிய லான
  kaandigai:
    porul: '"பொன்" ஈறு கெட, செய்யுளில் முறையே லகாரமும் மகாரமும் தோன்றும். விளைவு வடிவம் நூலில் எழுதப்படவில்லை (நூலில் இல்லை).'
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: 355 முன்/இல் சொன்னது; பொன் ஈறு கெட்டு முறையின் முன்னர் ல/ம தோன்றும் — னகர ஈறு கெட்டு முறையே ல், ம் தோன்றும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: பொன்
    ops:
    - ஈறு_கெடு
    - ல_வரவு
    - ம_வரவு
    sphere: செய்யுள்
  links: []
  urai:
    iyaipu:
    - ezhu.355
    - ezhu.357
    text: 'இயைபு (649): 355 முன்/இல்; 357 யகரம் — மூன்றாம் இறுதி. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: முறை பிறழாமை
    saanru: முறையின்
  - peyar: மொழிவாம் என்றல்
    saanru: முன்னர்த் தோன்றும்
- id: ezhu.357
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 357
  moolam: |-
    யகர இறுதி வேற்றுமைப் பொருள்வயின்
    வல்லெழுத் தியையின் அவ்வெழுத்து மிகுமே
  kaandigai:
    porul: யகர ஈறு வேற்றுமையில் வல்லெழுத்தோடு இயைந்தால் அவ்வெழுத்து மிகும்.
    ethu: 'யகர இறுதியின் பொது விதி: வேற்றுமைப் பொருளில் வல்லெழுத்து வரின் அவ்வெழுத்தே மிகும்; 358–361 அதன் விலக்கும் சிறப்பும்.'
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ய_ஈறு
    context: வேற்றுமை
    op: வல்லின_மிகு
  links:
  - ezhu.358
  - ezhu.359
  - ezhu.362
  urai:
    iyaipu:
    - ezhu.358
    - ezhu.362
    - ezhu.383
    text: 'இயைபு (649): 358–361 இதன் விலக்கும் சிறப்பும்; 362 ரகாரம், 383 ழகாரம் இதன் இயல்பின. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.358
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 358
  moolam: |-
    தாயென் கிளவி யியற்கை யாகும்
  kaandigai:
    porul: '"தாய்" இயல்பாகும்.'
    ethu: 357 யகர ஈற்றுக்கு வேற்றுமையில் வல்லெழுத்து மிகும் என்றது; தாய் என்னும் சொல் அதற்கு விலக்காக இயல்பாகும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: தாய்
    property: இயல்பு
  links: []
  urai:
    iyaipu:
    - ezhu.359
    - ezhu.360
    - ezhu.361
    text: 'இயைபு (649): 357 யகர ஈற்றுப் பொது விதி; 359 மகன் வினை; 360 மெல்லினம்; 361 அல்வழி. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விலக்கு
    thunivu: நூலில் நேரடியாக
    vilakkukkuriyathu:
    - ezhu.357
- id: ezhu.359
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 359
  moolam: |-
    மகன்வினை கிளப்பின் முதனிலை யியற்றே
  kaandigai:
    porul: (தாய் முன்) மகன் வினை கூறினால் முதல் நிலை (357) இயல்பினது.
    ethu: 358 தாய் இயற்கை என்றது; மகன் வினை கிளப்பின் முதனிலை இயற்றே (வினையில் மகன் முதல்-நிலை இயற்கை).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: தாய்
    context: மகன்_வினை
    property: முதனிலை_இயல்பு
  links: []
  urai:
    iyaipu:
    - ezhu.358
    - ezhu.361
    text: 'இயைபு (649): 358 தாய்; 359 மகன் வினை கிளப்பின் — தாய் என்னும் சொல்லின் தொடர். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.360
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 360
  moolam: |-
    மெல்லெழுத் துறழும் மொழியுமா ருளவே
  kaandigai:
    porul: மெல்லெழுத்தோடு உறழும் மொழிகளும் உள.
    ethu: 358–359 தாய்/மகன் சொன்னது; இது அதன் தொடர்ச்சி.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    class: ய_ஈறு
    property: மெல்லின_உறழ்
  links: []
  urai:
    iyaipu:
    - ezhu.358
    - ezhu.359
    text: 'இயைபு (649): 358, 359 பொது; 360 “உளவே” — எவை என நூல் பெயரிடவில்லை — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; எவை என ஒருதலை அன்மை
- id: ezhu.361
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 361
  moolam: |-
    அல்வழி யெல்லாம் இயல்பென மொழிப
  kaandigai:
    porul: அல்வழி எல்லாம் இயல்பு.
    ethu: 358–360 மெல்லினம் சொன்னது; இது அதன் தொடர்ச்சி.
    eduthukkaattu:
    - text: முதற்கண் மெய்கெட
      from: ezhu.347
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ய_ஈறு
    context: அல்வழி
    property: இயல்பு
  links: []
  urai:
    iyaipu:
    - ezhu.357
    - ezhu.314
    text: 'இயைபு (649): 357 யகர ஈற்று வேற்றுமை முடிபு; அல்வழிக்கு இயல்பு — 314 மகர ஈற்றிலும் "அல்வழி யெல்லாம்" வரி வருகிறது; ஈறுதோறும் முடிபு வேறு (361 இயல்பு, 368, 398 உறழ்). எடுத்துக்காட்டு: “முதற்கண் மெய்கெட” (எழு. 347) — மெய் + கெட — அல்வழியில் வல்லெழுத்து மிகவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
- id: ezhu.362
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 362
  moolam: |-
    ரகார இறுதி யகார இயற்றே
  kaandigai:
    porul: ரகார ஈறு யகார ஈற்றின் இயல்பினது (357–361).
    ethu: 357–361 யகர இறுதி; ரகார இறுதி யகர ஈற்றின் இயல்பைப் பெறும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ர_ஈறு
    inherits: ய_ஈறு_இயல்பு
  links: []
  urai:
    iyaipu:
    - ezhu.357
    - ezhu.363
    - ezhu.383
    text: 'இயைபு (649): 357 யகர இறுதி; 363 ஆர், வெதிர், சார், பீர்; 383 ழகாரம் ரகார இயற்று. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒப்பக் கூறல்
    saanru: இயற்றே
- id: ezhu.363
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 363
  moolam: |-
    ஆரும் வெதிருஞ் சாரும் பீரும்
    மெல்லெழுத்து மிகுதல் மெய்பெறத் தோன்றும்
  kaandigai:
    porul: '"ஆர்", "வெதிர்", "சார்", "பீர்" — மெல்லெழுத்து மிகுதல் தோன்றும்.'
    en:
      kooruvathu: 4
      enniyathu: 4
    ethu: 362 ரகார இறுதி யகர இயல் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: ர_ஈறு_மெல்லின_மிகு
    count: 4
    items:
    - ஆர்
    - வெதிர்
    - சார்
    - பீர்
    op: மெல்லின_மிகு
  links: []
  urai:
    iyaipu:
    - ezhu.362
    - ezhu.364
    - ezhu.365
    text: 'இயைபு (649): 364 சார், 365 பீர் — இவற்றின் விரிவு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.364
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 364
  moolam: |-
    சாரென் கிளவி காழ்வயின் வலிக்கும்
  kaandigai:
    porul: '"சார்" காழ் (வயிரம்) வரும் இடத்து வல்லெழுத்து மிகும்.'
    ethu: 363 ஆர்/சார் மெல்லினம் என்றது; சாரென் கிளவி காழ்வயின் வலிக்கும் (காழ்-உடன் சேரும்போது வல்லினம்).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: சார்
    context: காழ்
    op: வல்லின_மிகு
  links: []
  urai:
    iyaipu:
    - ezhu.363
    - ezhu.365
    text: 'இயைபு (649): 363 சார்; 365 பீர் — இணை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விலக்கு
    thunivu: நூலில் நேரடியாக
    vilakkukkuriyathu:
    - ezhu.363
- id: ezhu.365
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 365
  moolam: |-
    பீரென் கிளவி அம்மொடுஞ் சிவணும்
  kaandigai:
    porul: '"பீர்" அம்மோடும் பொருந்தும்.'
    ethu: 364 சார் சொன்னது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: பீர்
    suffix: அம்
  links: []
  urai:
    iyaipu:
    - ezhu.363
    - ezhu.364
    - ezhu.386
    text: 'இயைபு (649): 386 குமிழ் — பீர் சாரியைப் பெறும் இடம். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.366
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 366
  moolam: |-
    லகார இறுதி னகார இயற்றே
  kaandigai:
    porul: லகார ஈறு னகார ஈற்றின் இயல்பினது (332).
    ethu: னகார இறுதி (எழு. 332) சொன்னது; லகார இறுதி அதன் இயல்பினது — "னகார இயற்றே".
    eduthukkaattu:
    - text: தொழிற்பெயர்
      from: ezhu.296
    - text: பாற்சொல்
      from: sol.2
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ல_ஈறு
    inherits: ன_ஈறு_இயல்பு
  links: []
  urai:
    iyaipu:
    - ezhu.332
    text: 'இயைபு (649): 362 ரகார இறுதி; 367 னகாரம்; 368 அல்வழி. எடுத்துக்காட்டு: “தொழிற்பெயர்” (எழு. 296), “பாற்சொல்” (சொல். 2) — தொழில் + பெயர், பால் + சொல் — லகரம் றகரமானது.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒப்பக் கூறல்
    saanru: இயற்றே
- id: ezhu.367
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 367
  moolam: |-
    மெல்லெழுத் தியையின் னகார மாகும்
  kaandigai:
    porul: மெல்லெழுத்தோடு இயைந்தால் னகாரமாகும்.
    ethu: 366 லகார இறுதி னகார இயல் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ல_ஈறு
    context: மெல்லினம்
    transform: ல→ன
  links: []
  urai:
    iyaipu:
    - ezhu.366
    - ezhu.368
    text: 'இயைபு (649): 366 லகரம்; 367 மெல்லினத்தில் ன. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.368
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 368
  moolam: |-
    அல்வழி யெல்லாம் உறழென மொழிப
  kaandigai:
    porul: அல்வழி எல்லாம் உறழ்ச்சி.
    ethu: 366–367 லகார இறுதி சொன்னது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ல_ஈறு
    context: அல்வழி
    property: உறழ்
  links: []
  urai:
    iyaipu:
    - ezhu.366
    - ezhu.398
    text: 'இயைபு (649): 366 லகாரம் னகார இயற்று; லகார ஈற்று அல்வழி உறழ் — 398 ளகாரத்திலும் அவ்வாறே; 361 யகாரத்தில் இயல்பு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
  - peyar: ஒருதலை அன்மை
    saanru: உறழென
- id: ezhu.369
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 369
  moolam: |-
    தகரம் வருவழி ஆய்தம் நிலையலும்
    புகரின் றென்மனார் புலமை யோரே
  kaandigai:
    porul: தகரம் வரும் இடத்து ஆய்தம் நிற்றலும் குற்றமில்லை.
    ethu: 366–368 லகார இறுதி சொன்னது; தகரம் வருவழி ஆய்தம் நிலையலும் உண்டு (விதி-விலக்கு).
    eduthukkaattu:
    - text: அஃறிணை
      from: sol.1
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ல_ஈறு
    context: தகரம்
    property: ஆய்த_நிலை_குற்றமில்லை
  links: []
  urai:
    iyaipu:
    - ezhu.366
    - ezhu.399
    - ezhu.344
    text: 'இயைபு (649): 399 இதே “ஆய்தம் நிலையலும்” — ளகார பகுதி; 344 ஒற்றுமிகு தகரம். எடுத்துக்காட்டு: “அஃறிணை” (சொல். 1) — அல் + திணை — தகரம் வருவழி ஆய்தம் நின்றது.'
    vagai: விதி-விலக்கு
    vilakkukkuriyathu:
    - ezhu.368
    thunivu: நூலில் நேரடியாக
- id: ezhu.370
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 370
  moolam: |-
    நெடியதன் இறுதி இயல்புமா ருளவே
  kaandigai:
    porul: நெடில் ஈற்றுக்கு இயல்பும் உண்டு.
    ethu: 366–369 லகார இறுதி சொன்னது; நெடிலை அடுத்து வரும் லகார இறுதியில் இயல்பாவனவும் உள.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    class: ல_ஈறு
    context: நெடில்
    property: இயல்பு
  links: []
  urai:
    iyaipu:
    - ezhu.366
    - ezhu.400
    text: 'இயைபு (649): 371 நெல்/செல்/கொல்/சொல்; 372 இல்; 374 நாய். “உளவே” — எவை என நூல் பெயரிடவில்லை — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; எவை என ஒருதலை அன்மை
- id: ezhu.371
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 371
  moolam: |-
    நெல்லுஞ் செல்லுங் கொல்லுஞ் சொல்லும்
    அல்லது கிளப்பினும் வேற்றுமை யியல
  kaandigai:
    porul: '"நெல்", "செல்", "கொல்", "சொல்" அல்வழியிலும் வேற்றுமை இயல்பின.'
    en:
      kooruvathu: 4
      enniyathu: 4
    ethu: 370 நெடியதன் இறுதி இயல்பு என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: ல_ஈறு_வேற்றுமை_இயல்பு
    count: 4
    items:
    - நெல்
    - செல்
    - கொல்
    - சொல்
    property: வேற்றுமை_இயல்பு
  links: []
  urai:
    iyaipu:
    - ezhu.370
    - ezhu.373
    text: 'இயைபு (649): 370 பொது; 373 வல் — இணை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.372
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 372
  moolam: |-
    இல்லென் கிளவி இன்மை செப்பின்
    வல்லெழுத்து மிகுதலும் ஐயிடை வருதலும்
    இயற்கை யாதலும் ஆகாரம் வருதலும்
    கொளத்தகு மரபின் ஆகிட னுடைத்தே
  kaandigai:
    porul: '"இல்" இன்மை குறித்தால் — வல்லெழுத்து மிகுதல், ஐ இடை வருதல், இயல்பாதல், ஆகாரம் வருதல் — நான்கும் உரியன (எண்ணிச் சரிபார்த்தது).'
    en:
      kooruvathu: 4
      enniyathu: 4
    ethu: 370–371 நெடியதன் இறுதி சொன்னது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: இல்_இன்மை
    count: 4
    items:
    - வல்லின_மிகு
    - ஐ_இடைவரவு
    - இயல்பு
    - ஆகார_வரவு
  links: []
  urai:
    iyaipu:
    - ezhu.371
    text: 'இயைபு (649): 371 நெல், செல், கொல், சொல்; 372 இல் — லகர ஈற்றுத் தனிச் சொற்கள். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.373
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 373
  moolam: |-
    வல்லென் கிளவி தொழிற்பெய ரியற்றே
  kaandigai:
    porul: '"வல்" தொழிற்பெயர் இயல்பினது.'
    ethu: 371 நெல்/செல்/கொல்/சொல் சொன்னது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: வல்
    analogy: தொழிற்பெயர்
  links: []
  urai:
    iyaipu:
    - ezhu.376
    text: 'இயைபு (649): லகர ஈற்றுத் தொழிற்பெயர் முடிபு 376; வல் என்னும் சொல் அம்முடிபைப் பெறும். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.374
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 374
  moolam: |-
    நாயும் பலகையும் வரூஉங் காலை
    ஆவயின் உகரங் கெடுதலு முரித்தே
    உகரங் கெடுவழி அகரம் நிலையும்
  kaandigai:
    porul: '"நாய்", "பலகை" வந்தால் உகரம் கெடுதலும் உண்டு; கெடும் இடத்து அகரம் நிற்கும்.'
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 370–373 நெடியதன் இறுதி சொன்னது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    items:
    - நாய்
    - பலகை
    ops:
    - உகர_கெடு
    - அகர_நிலை
  links: []
  urai:
    iyaipu:
    - ezhu.370
    - ezhu.375
    - porul.610
    text: 'இயைபு (649): 375 பூல், வேல் — இணை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.375
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 375
  moolam: |-
    பூல்வே லென்றா ஆலென் கிளவியொடு
    ஆமுப் பெயர்க்கும் அம்இடை வருமே
  kaandigai:
    porul: '"பூல்", "வேல்", "ஆல்" — மூன்றுக்கும் அம் இடை வரும்.'
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: 374 நாய்/பலகை சொன்னது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    items:
    - பூல்
    - வேல்
    - ஆல்
    insert: அம்
  links: []
  urai:
    iyaipu:
    - ezhu.374
    - ezhu.119
    text: 'இயைபு (649): 119 அம் சாரியைப் பட்டியல். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.376
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 376
  moolam: |-
    தொழிற்பெய ரெல்லாந் தொழிற்பெய ரியல
  kaandigai:
    porul: (லகார ஈற்றுப் பகுதி) லகார ஈற்றுத் தொழிற்பெயர் எல்லாம் தொழிற்பெயர் இயல்பின (327, 401 உடன் ஒரே நூற்பா; முதல் விதி 296-297 — காண்க).
    ethu: 373 வல் சொன்னது; தொழிற்பெயர் எல்லாம் தொழிற்பெயர் இயல (மீள் வலியுறுத்தல்).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ல_தொழிற்பெயர்
    analogy: ezhu.296
  links: []
  urai:
    iyaipu:
    - ezhu.306
    - ezhu.327
    - ezhu.401
    text: 'இயைபு (649): 306, 327, 401 இதே வாக்கியம் — மூன்றாவது முறை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.377
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 377
  moolam: |-
    வெயிலென் கிளவி மழையியல் நிலையும்
  kaandigai:
    porul: '"வெயில்" மழையின் இயல்பில் (உயிர்மயங்கியல் 287) நிற்கும்.'
    ethu: 287 மழை வளியியல் நிலை என்றது; வெயில் கிளவி மழையியல் நிலையும் (மழை → வெயில்).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: வெயில்
    analogy: ezhu.287
  links: []
  urai:
    iyaipu:
    - ezhu.287
    - ezhu.402
    text: 'இயைபு (649): 287 மழை/வளி; 402 இருள்/வெயில் — இணை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.378
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 378
  moolam: |-
    சுட்டுமுத லாகிய வகர இறுதி
    முற்படக் கிளந்த உருபியல் நிலையும்
  kaandigai:
    porul: சுட்டு முதலான வகர ஈறு முன் கூறிய உருபியல் நிலையில் நிற்கும்.
    ethu: சுட்டுமுதல் வகர இறுதி (அவ், இவ், உவ்) முற்பட உருபியலில் (எழு. 183) கிளந்தவாறே நிலையும்.
    eduthukkaattu:
    - text: அவற்றுள்
      from: ezhu.3
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: சுட்டு_வகர_ஈறு
    property: உருபியல்_நிலை
  links: []
  urai:
    iyaipu:
    - ezhu.183
    text: 'இயைபு (649): 379 ஆய்தம்; 380 மெல்லினம்; 381 இயல்பு; 382 ஏனை வகரம். எடுத்துக்காட்டு: “அவற்றுள்” (எழு. 3) — அவ் + உள் — உருபியல் நிலை (அற்றுச் சாரியை).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: கூறிற்று என்றல்
    saanru: கிளந்த
- id: ezhu.379
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 379
  moolam: |-
    வேற்றுமை யல்வழி ஆய்த மாகும்
  kaandigai:
    porul: அல்வழியில் ஆய்தமாகும்.
    ethu: 378 சுட்டுமுதல் வகரம் உருபியல் நிலை என்றது; வேற்றுமை அல்வழி ஆய்தமாகும் (வகரம் → ஆய்தம்).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: வகர_ஈறு
    context: அல்வழி
    transform: →ஆய்தம்
  links: []
  urai:
    iyaipu:
    - ezhu.378
    - ezhu.380
    text: 'இயைபு (649): 378 பொது; 380 மெல்லினம். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.380
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 380
  moolam: |-
    மெல்லெழுத் தியையின் அவ்வெழுத் தாகும்
  kaandigai:
    porul: மெல்லெழுத்து இயைந்தால் அவ்வெழுத்தாகும்.
    ethu: 378–379 வகரம் சொன்னது; இது அதன் தொடர்ச்சி.
    eduthukkaattu:
    - text: அம்மூ வாறும்
      from: ezhu.22
    - text: அந்நாற் சொல்லுந்
      from: ezhu.345
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: வகர_ஈறு
    context: மெல்லினம்
    op: →மெல்லினம்
  links: []
  urai:
    iyaipu:
    - ezhu.378
    - ezhu.379
    text: 'இயைபு (649): 378 பொது; 379 ஆய்தம்; 380 மெல்லினம். எடுத்துக்காட்டு: “அம்மூ வாறும்” (எழு. 22), “அந்நாற் சொல்லுந்” (எழு. 345) — அவ் + மூ / நால் — வகரம் வந்த மெல்லெழுத்தானது.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.381
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 381
  moolam: |-
    ஏனவை புணரின் இயல்பென மொழிப
  kaandigai:
    porul: ஏனையவை புணர்ந்தால் இயல்பு.
    ethu: 378–380 சுட்டுமுதல் வகரம் சொன்னது; ஏனவை (சுட்டு அல்லாத) புணரின் இயல்பு.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: வகர_ஈறு
    property: இயல்பு
  links: []
  urai:
    iyaipu:
    - ezhu.378
    - ezhu.382
    text: 'இயைபு (649): 378 சுட்டு; 382 ஏனை வகரம். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
- id: ezhu.382
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 382
  moolam: |-
    ஏனை வகரந் தொழிற்பெய ரியற்றே
  kaandigai:
    porul: ஏனை வகரம் தொழிற்பெயர் இயல்பினது.
    ethu: 381 ஏனவை இயல்பு என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ஏனை_வகரம்
    analogy: தொழிற்பெயர்
  links: []
  urai:
    iyaipu:
    - ezhu.378
    - ezhu.376
    text: 'இயைபு (649): 378 சுட்டுமுதல் வகரம் உருபியல் நிலை; ஏனை வகர இறுதிகள் தொழிற்பெயர் இயல்பின (306, 327, 376, 401 போல). எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.383
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 383
  moolam: |-
    ழகார இறுதி ரகார இயற்றே
  kaandigai:
    porul: ழகார ஈறு ரகார ஈற்றின் இயல்பினது (362).
    ethu: ரகார இறுதி (எழு. 362) யகார இயல்பினது என்றது; ழகார இறுதி ரகார இயல்பினது — அதனால் அதுவும் யகர ஈற்று முடிபைப் பெறும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ழ_ஈறு
    inherits: ர_ஈறு_இயல்பு
  links: []
  urai:
    iyaipu:
    - ezhu.362
    - ezhu.357
    text: 'இயைபு (649): 384 தாழ், 385 தமிழ் — இணை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒப்பக் கூறல்
    saanru: இயற்றே
- id: ezhu.384
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 384
  moolam: |-
    தாழென் கிளவி கோலொடு புணரின்
    அக்கிடை வருதல் உரித்து மாகும்
  kaandigai:
    porul: '"தாழ்" "கோல்"லோடு புணர்ந்தால் அக்கு இடை வருதலும் உரியது.'
    ethu: 383 ழகார இறுதி ரகார இயல் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    items:
    - தாழ்
    - கோல்
    insert: அக்கு
  links: []
  urai:
    iyaipu:
    - ezhu.383
    - ezhu.385
    text: 'இயைபு (649): 385 தமிழ் — இணை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: உரித்து
- id: ezhu.385
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 385
  moolam: |-
    தமிழென் கிளவியும் அதனோ ரற்றே
  kaandigai:
    porul: '"தமிழ்" என்ற சொல்லும் அவ்வாறே (அக்கு இடை வருதல்). நூல் தமிழ் என்ற சொல்லைத் தானே புணர்ச்சி எடுத்துக்காட்டாகப் பெயரிடுகிறது — நூலில் நேரடியாக.'
    ethu: 384 தாழ்-கோல் சொன்னது; தமிழ் கிளவியும் அதனோ ரற்றே.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: தமிழ்
    analogy: ezhu.384
    self_example: true
  links: []
  urai:
    iyaipu:
    - ezhu.383
    - ezhu.384
    text: 'இயைபு (649): 384 தாழ்; 385 தமிழ். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.386
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 386
  moolam: |-
    குமிழென் கிளவி மரப்பெய ராயின்
    பீரென் கிளவியொ டோரியற் றாகும்
  kaandigai:
    porul: '"குமிழ்" மரப்பெயரானால் "பீர்"ரோடு ஒரே இயல்பினது (363, 365).'
    ethu: 365 பீர் அம் சிவணும் என்றது; குமிழ் மரப்பெயராயின் பீரொடு ஓரியற்றாகும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: குமிழ்_மரம்
    analogy: ezhu.363
  links: []
  urai:
    iyaipu:
    - ezhu.365
    - ezhu.387
    - ezhu.388
    text: 'இயைபு (649): 365 பீர்; 387 பாழ்; 388 ஏழ் — வரிசை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.387
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 387
  moolam: |-
    பாழென் கிளவி மெல்லெழுத் துறழ்வே
  kaandigai:
    porul: '"பாழ்" மெல்லெழுத்தோடு உறழும்.'
    ethu: 386 குமிழ் சொன்னது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: பாழ்
    property: மெல்லின_உறழ்
  links: []
  urai:
    iyaipu:
    - ezhu.386
    - ezhu.388
    text: 'இயைபு (649): 386 குமிழ்; 388 ஏழ் — இணை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.388
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 388
  moolam: |-
    ஏழென் கிளவி யுருபிய னிலையும்
  kaandigai:
    porul: '"ஏழ்" உருபியல் நிலையில் நிற்கும்.'
    ethu: 386–387 ழகர இறுதி சொன்னது; ஏழ் கிளவி உருபியல் நிலையும் (பெயரியலில் வந்தது போன்றே).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: ஏழ்
    property: உருபியல்_நிலை
  links: []
  urai:
    iyaipu:
    - ezhu.386
    - ezhu.389
    text: 'இயைபு (649): 386, 387 பொது; 389 அளவு/நிறை/எண். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.389
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 389
  moolam: |-
    அளவு நிறையு மெண்ணும் வருவழி
    நெடுமுதல் குறுகலு முகரம் வருதலுங்
    கடிநிலை யின்றே யாசிரி யர்க்க
  kaandigai:
    porul: அளவு, நிறை, எண் வரும்போது நெடுமுதல் குறுகலும் உகரம் வருதலும் விலக்கில்லை.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 388 ஏழ் உருபியல் நிலை என்றது; இது அதன் தொடர்ச்சி.
    eduthukkaattu:
    - text: எழுபது
      from: porul.357
    - text: எழுநூற்று
      from: porul.406
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ழ_ஈறு
    contexts:
    - அளவு
    - நிறை
    - எண்
    ops:
    - நெடுமுதல்_குறுகு
    - உகர_வரவு
  links: []
  urai:
    iyaipu:
    - ezhu.388
    - ezhu.319
    - ezhu.308
    text: 'இயைபு (649): 308 எண்/உணவுப் பெயர்; 319 அளவு/நிறை; 389 அவற்றின் தொகுப்பு. எடுத்துக்காட்டு: “எழுபது” (பொருள். 357), “எழுநூற்று” (பொருள். 406) — ஏழ் + எண் — நெடுமுதல் குறுகி உகரம் வந்தது.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: கடிநிலை
- id: ezhu.390
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 390
  moolam: |-
    பத்தென் கிளவி யொற்றிடை கெடுவழி
    நிற்றல் வேண்டு மாய்தப் புள்ளி
  kaandigai:
    porul: '"பத்து" ஒற்று இடைகெடும் வழி ஆய்தப் புள்ளி நிற்க வேண்டும்.'
    ethu: 389 அளவு/நிறை/எண் சொன்னது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: பத்து
    op: ஆய்த_நிலை
    context: ஒற்று_கெடு
  links: []
  urai:
    iyaipu:
    - ezhu.389
    - ezhu.391
    - ezhu.392
    text: 'இயைபு (649): 391 ஆயிரம்; 392 நூறூர்ந்து. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.391
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 391
  moolam: |-
    ஆயிரம் வருவழி யுகரங் கெடுமே
  kaandigai:
    porul: ஆயிரம் வரும்போது உகரம் கெடும்.
    ethu: 390 பத்து சொன்னது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: ஆயிரம்
    op: உகர_கெடு
  links: []
  urai:
    iyaipu:
    - ezhu.390
    - ezhu.392
    text: 'இயைபு (649): 392 நூறூர்ந்து. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.392
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 392
  moolam: |-
    நூறூர்ந்து வரூஉம் ஆயிரக் கிளவிக்குக்
    கூறிய நெடுமுதல் குறுக்க மின்றே
  kaandigai:
    porul: நூறு ஊர்ந்து வரும் ஆயிரத்துக்கு (ஏழின்) நெடுமுதல் குறுக்கம் இல்லை.
    ethu: 389 நெடுமுதல் குறுகும் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: ஆயிரம்
    context: நூறு_ஊர்தி
    property: நெடுமுதல்_குறுக்கம்_இல
  links: []
  urai:
    iyaipu:
    - ezhu.389
    - ezhu.391
    text: 'இயைபு (649): 389 நெடுமுதல் குறுக்கம்; 391 ஆயிரம்; 392 விலக்கு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விலக்கு
    vilakkukkuriyathu:
    - ezhu.389
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: கூறிற்று என்றல்
    saanru: கூறிய
- id: ezhu.393
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 393
  moolam: |-
    ஐஅம் பல்லென வரூஉ மிறுதி
    அல்பெய ரெண்ணினும் ஆயியல் நிலையும்
  kaandigai:
    porul: '"ஐ", "அம்", "பல்" என வரும் இறுதியை உடைய அல்பெயர் எண்ணிலும் அவ்வியல்பு நிற்கும். இவை எவ்வெண் என்பது நூலில் விரிக்கப்படவில்லை (ஒருதலை அன்மை).'
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: 391–392 ஆயிரம் சொன்னது; ஐ, அம், பல் என்னும் இறுதி அல்பெயர் எண்ணிலும் ஆயியல் நிலையும்.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: enumeration
    class: அல்பெயர்_எண்
    count: 3
    items:
    - ஐ_ஈறு
    - அம்_ஈறு
    - பல்_ஈறு
    items_unspecified: true
  links: []
  urai:
    iyaipu:
    - ezhu.391
    - ezhu.394
    - ezhu.395
    text: 'இயைபு (649): 394 உயிர்முன்; 395 கீழ். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக; காண்டிகை சுட்டிய ஐயம் ஒருதலை அன்மை
  utthi:
  - peyar: ஒப்பக் கூறல்
    saanru: ஆயியல்
- id: ezhu.394
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 394
  moolam: |-
    உயிர்முன் வரினும் ஆயியல் திரியாது
  kaandigai:
    porul: '(ழகார ஈற்றுப் பகுதி) உயிர் முன் வந்தாலும் அவ்வியல்பு (393: ஐ, அம், பல் ஈற்று அல்பெயர் எண்ணின் இயல்பு) திரியாது. அண்மை நூற்பா 393; சுட்டுவது அதுவே என நூல் பெயரிடவில்லை (ஒருதலை அன்மை); இதே நூற்பா 207-இலும் வருகிறது.'
    ethu: 393 அல்பெயர் எண் சொன்னது; உயிர்முன் வரினும் ஆயியல் திரியாது.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    refs:
    - ezhu.393
    - ezhu.207
    property: உயிர்_முன்_திரியா
  links: []
  urai:
    iyaipu:
    - ezhu.393
    text: 'இயைபு (649): 393 அல்பெயர் எண். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக; காண்டிகை சுட்டிய ஐயம் ஒருதலை அன்மை
  utthi:
  - peyar: ஒப்பக் கூறல்
    saanru: ஆயியல்
- id: ezhu.395
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 395
  moolam: |-
    கீழென் கிளவி உறழத் தோன்றும்
  kaandigai:
    porul: '"கீழ்" உறழ்ந்து தோன்றும்.'
    ethu: 393–394 அல்பெயர் எண் சொன்னது; கீழ் என்னும் கிளவி உறழத் தோன்றும் (எண்ணில் மாறி வரும்).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: கீழ்
    property: உறழ்
  links: []
  urai:
    iyaipu:
    - ezhu.393
    - ezhu.394
    text: 'இயைபு (649): 393, 394 பொது. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: உறழத்
- id: ezhu.396
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 396
  moolam: |-
    ளகார இறுதி ணகார இயற்றே
  kaandigai:
    porul: ளகார ஈறு ணகார ஈற்றின் இயல்பினது (302).
    ethu: 302 ண→ட, 332 ன→ற சொன்னது; ளகார இறுதி ணகார இயற்றே.
    eduthukkaattu:
    - text: நாட்பெயர்க் கிளவி
      from: ezhu.331
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ள_ஈறு
    inherits: ண_ஈறு_இயல்பு
  links: []
  urai:
    iyaipu:
    - ezhu.302
    - ezhu.332
    - ezhu.397
    - ezhu.398
    text: 'இயைபு (649): 302 ண→ட; 332 ன→ற; 396 ளகாரம் ணகார இயற்று — ஆகவே வேற்றுமைக்கண் டகாரமாகும். எடுத்துக்காட்டு: “நாட்பெயர்க் கிளவி” (எழு. 331) — நாள் + பெயர் — ளகரம் டகரமானது (ணகர இயல்).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒப்பக் கூறல்
    saanru: இயற்றே
- id: ezhu.397
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 397
  moolam: |-
    மெல்லெழுத் தியையின் ணகார மாகும்
  kaandigai:
    porul: மெல்லெழுத்து இயைந்தால் ணகாரமாகும் (367-இன் இணை).
    ethu: 396 ளகார இறுதி ணகார இயல் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ள_ஈறு
    context: மெல்லினம்
    transform: ள→ண
  links: []
  urai:
    iyaipu:
    - ezhu.396
    text: 'இயைபு (649): 396 பொது; 397 மெல்லினம். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.398
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 398
  moolam: |-
    அல்வழி யெல்லாம் உறழென மொழிப
  kaandigai:
    porul: அல்வழி எல்லாம் உறழ்ச்சி (368-இன் இணை).
    ethu: 396–397 ளகார இறுதி சொன்னது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ள_ஈறு
    context: அல்வழி
    property: உறழ்
  links: []
  urai:
    iyaipu:
    - ezhu.396
    - ezhu.368
    text: 'இயைபு (649): 396 ளகாரம் ணகார இயற்று; ளகார ஈற்று அல்வழி உறழ் — 368 லகாரம் போல. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
  - peyar: ஒருதலை அன்மை
    saanru: உறழென
- id: ezhu.399
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 399
  moolam: |-
    ஆய்த நிலையலும் வரைநிலை யின்றே
    தகரம் வரூஉங் காலை யான
  kaandigai:
    porul: தகரம் வரும்போது ஆய்தம் நிற்றல் விலக்கில்லை (369-இன் இணை).
    ethu: 396–398 ளகார இறுதி சொன்னது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ள_ஈறு
    context: தகரம்
    property: ஆய்த_நிலை_விலக்கில்லை
  links: []
  urai:
    iyaipu:
    - ezhu.369
    - ezhu.396
    text: 'இயைபு (649): 369 இதே “தகரம் வருவழி ஆய்தம்” — லகார பகுதி. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.400
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 400
  moolam: |-
    நெடியத னிறுதி இயல்பா குநவும்
    வேற்றுமை யல்வழி வேற்றுமை நிலையலும்
    போற்றல் வேண்டும் மொழியுமா ருளவே
  kaandigai:
    porul: 'நெடில் ஈற்றுக்கு இயல்பாவனவும், அல்வழியில் வேற்றுமை நிலை கொள்வனவும் போற்றி அறிய வேண்டிய மொழிகள் உள. காண்க: 366–370, 396–400 (லகர, ளகர விதிகள்).'
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 396–399 ளகார இறுதி சொன்னது; நெடியதன் இறுதி இயல்பாகுநவும் வேற்றுமை அல்வழி நிலையலும் போற்ற வேண்டும் (விதி-விலக்கு).
  nilai: ஒருதலை அன்மை
  kanini:
    kind: enumeration
    class: ள_ஈறு_நெடில்
    count: 2
    items:
    - நெடில்_இயல்பு
    - அல்வழி_வேற்றுமை_நிலை
  links: []
  urai:
    iyaipu:
    - ezhu.366
    - ezhu.396
    - ezhu.399
    text: 'இயைபு (649): 366, 396-இன் தொடர்ச்சி. “மொழியுமார் உளவே” — எவை என நூல் பெயரிடவில்லை — ஒருதலை அன்மை.'
    vagai: விதி-விலக்கு
    vilakkukkuriyathu:
    - ezhu.396
    thunivu: விதி நூலில் நேரடியாக; “மொழியுமார் உளவே” ஒருதலை அன்மை
  utthi:
  - peyar: ஆணை கூறல்
    saanru: வேண்டும்
- id: ezhu.401
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 401
  moolam: |-
    தொழிற்பெய ரெல்லாந் தொழிற்பெய ரியல
  kaandigai:
    porul: (ளகார ஈற்றுப் பகுதி) ளகார ஈற்றுத் தொழிற்பெயர் எல்லாம் தொழிற்பெயர் இயல்பின (327, 376 உடன் ஒரே நூற்பா; முதல் விதி 296-297 — காண்க).
    ethu: ண (306), ம (327), ல (376) ஈறுகளில் சொன்னவாறே ளகர ஈற்றிலும் தொழிற்பெயர் தொழிற்பெயர் இயல்பின.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ள_தொழிற்பெயர்
    analogy: ezhu.296
  links: []
  urai:
    iyaipu:
    - ezhu.306
    - ezhu.327
    - ezhu.376
    text: 'இயைபு (649): 306, 327, 376 — ஒரே வாக்கியம். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.402
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 402
  moolam: |-
    இருளென் கிளவி வெயிலியல் நிலையும்
  kaandigai:
    porul: '"இருள்" வெயிலின் இயல்பில் (377) நிற்கும்.'
    ethu: 377 வெயில் சொன்னது; இருள் கிளவி வெயிலியல் நிலையும் (வெயில் → இருள்).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: இருள்
    analogy: ezhu.377
  links: []
  urai:
    iyaipu:
    - ezhu.377
    text: 'இயைபு (649): 377 வெயில்/மழை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.403
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 403
  moolam: |-
    புள்ளும் வள்ளுந் தொழிற்பெய ரியல
  kaandigai:
    porul: '"புள்", "வள்" தொழிற்பெயர் இயல்பின.'
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 401 தொழிற்பெயர் சொன்னது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    items:
    - புள்
    - வள்
    analogy: தொழிற்பெயர்
  links: []
  urai:
    iyaipu:
    - ezhu.401
    - ezhu.306
    text: 'இயைபு (649): 306, 401 தொழிற்பெயர் பொது. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.404
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 404
  moolam: |-
    மக்க ளென்னும் பெயர்ச்சொ லிறுதி
    தக்கவழி அறிந்து வலித்தலு முரித்தே
  kaandigai:
    porul: '"மக்கள்" பெயர் இறுதி தக்க இடம் அறிந்து வலித்தலும் உண்டு.'
    ethu: 350 மக்கள் முறைதொகும் மருங்கு சொன்னது; இது அதன் தொடர்ச்சி.
    eduthukkaattu:
    - text: மக்கட் சுட்டே
      from: sol.1
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    entity: மக்கள்
    op: வலித்தல்
    context: தக்க_இடம்
  links: []
  urai:
    iyaipu:
    - ezhu.350
    - ezhu.396
    text: 'இயைபு (649): 350 மக்கள் முறை. "தக்கவழி அறிந்து" — எவ்விடம் என நூல் பெயரிடவில்லை — ஒருதலை அன்மை. எடுத்துக்காட்டு: “மக்கட் சுட்டே” (சொல். 1) — மக்கள் + சுட்டு — வலித்தல்.'
    vagai: விதி
    thunivu: ஒருதலை அன்மை
- id: ezhu.405
  pindam: 1
  padalam: ezhuthu
  othu: 8
  sutra: 405
  moolam: |-
    உணரக் கூறிய புணரியல் மருங்கிற்
    கண்டுசெயற் குரியவை கண்ணினர் கொளலே
  kaandigai:
    porul: 'புறனடை: உணரக் கூறிய புணர்ச்சி இயலில், கூறாது விட்டவற்றைக் கண்டு செய்ய உரியவற்றை அறிவுடையோர் கொள்க. நூல் தன் எல்லையைத் தானே வரையறுக்கிறது.'
    ethu: 'நூல் எல்லாப் புணர்ச்சியையும் பட்டியலிடவில்லை; கூறியவற்றைக் கொண்டு கூறாதவற்றை அறிய வழி தருகிறது — "வந்தது கொண்டு வாராதது உணர்த்தல்" (பொருள். 656). அதிகார இறுதிப் புறனடையும் இதே நெறி: "வழங்கியல் மருங்கின்" (எழு. 483).'
    eduthukkaattu:
    - text: வந்தது கொண்டு வாராதது உணர்த்தல்
      from: porul.656
    - text: வழங்கியல் மருங்கின்
      from: ezhu.483
  nilai: ஒருதலை அன்மை
  kanini:
    kind: exception
    principle: கூறாதவற்றைக் கூறியவற்றின்_இயல்பால்_உணர்க
    fallback: analogical_inference
    othu_end: true
  links:
  - ezhu.296
  - ezhu.483
  urai:
    iyaipu:
    - porul.654
    text: 'புள்ளிமயங்கியலின் புறனடை: கூறாதவற்றை "கண்டுசெயற்கு உரியவை கண்ணினர் கொளலே". விதி காணாத இணைக்கு நூல் தரும் வழி இதுவே; தானாக ஒரு வடிவத்தை நூலின் விதியாகச் சேர்ப்பது இதற்குள் அடங்காது (பொருள். 654 — "தன்னான் ஒரு பொருள் கருதிக் கூறல்").'
    vagai: விதி
    thunivu: ஒருதலை அன்மை
  utthi:
  - peyar: கூறிற்று என்றல்
    saanru: கூறிய
