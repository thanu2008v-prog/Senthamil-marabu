  - ezhu.94
  - ezhu.95
  - ezhu.96
  - ezhu.97
  - ezhu.98
  urai:
    iyaipu:
    - ezhu.20
    - ezhu.83
    - ezhu.25
    - ezhu.26
    text: 'இயைபு (649): 83-இன் எட்டு நிலையுள் "மூக்கும்" (எழு. 83) இங்கே பயன்படுகிறது. இனம் ஒத்த இடத்தில் மெல்லினம் வல்லினத்தோடு கூடுவது (எழு. 25) — இனம் ஒத்த மெல்லின–வல்லினக் கூட்டு நூலுள் 1,993 இடம் (ங்க 376, ஞ்ச 96, ண்ட 211, ந்த 541, ம்ப 89, ன்ற 680); இனமல்லாக் கூட்டுகளுள் ன்க, ன்ப, ண்ப, ன்ச, ண்ச எழு. 26 அனுமதிப்பவை; ம்த, ன்த, ண்த — ஆய்வு 21-இன் ஐயம்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: கூறிற்று என்றல்
    saanru: சொல்லிய
- id: ezhu.101
  pindam: 1
  padalam: ezhuthu
  othu: 3
  sutra: 101
  moolam: |-
    சார்ந்துவரி னல்லது தமக்கியல் பிலவெனத்
    தேர்ந்துவெளிப் படுத்த வேனை மூன்றுந்
    தத்தஞ் சார்பிற் பிறப்பொடு சிவணி
    யொத்த காட்சியிற் றம்மியல் பியலும்
  kaandigai:
    porul: சார்ந்து வருதல் அல்லாமல் தமக்கு இயல்பில்லாத மூன்றும் (சார்பெழுத்து, எழு. 2) தத்தம் சார்பின் பிறப்போடு பொருந்தி ஒலிக்கும்.
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: சார்பெழுத்து மூன்றும் (எழு. 2) தமக்கெனத் தனிப் பிறப்பின்றி, சார்ந்த எழுத்தின் பிறப்போடு ஒலிக்கும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: சார்பெழுத்து
    count: 3
    depends_on: உயிர்/மெய்
  links:
  - ezhu.2
  urai:
    iyaipu:
    - ezhu.2
    - ezhu.12
    - ezhu.34
    - ezhu.36
    - ezhu.38
    text: 'இயைபு (649): சார்பு எதுவென நூலே கூறுகிறது — குற்றியலிகரம் "மகரம் ஊர்ந்தே" (எழு. 34); குற்றியலுகரம் "வல்லா றூர்ந்தே" (எழு. 36); ஆய்தம் "உயிரொடு புணர்ந்தவல் லாறன் மிசைத்தே" (எழு. 38). அளவு அரை (எழு. 12).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: மூன்றுந்
- id: ezhu.102
  pindam: 1
  padalam: ezhuthu
  othu: 3
  sutra: 102
  moolam: |-
    எல்லா வெழுத்தும் வெளிப்படக் கிளந்து
    சொல்லிய பள்ளி யெழுதரு வளியிற்
    பிறப்பொடு விடுவழி யுறழ்ச்சி வாரத்
    தகத்தெழு வளியிசை யரிறப நாடி
    யளபிற் கோட லந்தணர் மறைத்தே
    யஃதிவ ணுவலா தெழுந்துபுறத் திசைக்கு
    மெய்தெரி வளியிசை யளவுநுவன் றிசினே
  kaandigai:
    porul: எல்லா எழுத்தையும் வெளிப்படக் கூறிய இடத்தில் எழும் வளியால் பிறப்பைக் கூறினோம்; அகத்தெழு வளியிசையை அளவால் கொள்ளுதல் அந்தணர் மறையது — அதை இங்கே கூறாமல், புறத்து இசைக்கும் மெய்தெரி வளியிசையின் அளவே கூறினோம். நூல் தன் எல்லையைத் தானே வரையறுக்கிறது; அம்மறையின் விவரம் நூலில் இல்லை.
    ethu: எழு. 83–101 புறத்து இசைக்கும் வளியால் பிறப்பைக் கூறின; அகத்தெழு வளியின் அளவு வேறு நூலது — "கோட லந்தணர் மறைத்தே". இது "நரம்பின் மறைய" (எழு. 33) என்று இசையளவைப் பிற நூலுக்கு விட்டதோடு ஒப்பது.
    eduthukkaattu:
    - text: கோட லந்தணர் மறைத்தே
      from: ezhu.102
    - text: நரம்பின் மறைய
      from: ezhu.33
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    scope_excluded: அந்தணர்_மறை
    included: புற_வளி_இசை
    othu_end: true
  links:
  - ezhu.83
  - ezhu.483
  urai:
    iyaipu:
    - ezhu.7
    text: 'பிறப்பியலின் புறனடை. 83 தொடங்கியதை 102 வரையறுக்கிறது: அகத்தெழு வளியிசையின் அளவு "அந்தணர் மறைத்தே" — அதை இங்கே நுவலாது, புறத்து இசைக்கும் மெய்தெரி வளியிசையின் அளவே கூறப்பட்டது. மாத்திரை (எழு. 7) இப்புறத்திசையின் அளவு. நூல் தன் எல்லையைத் தானே சுட்டும் இடம்; அம்மறையின் விவரம் நூலில் இல்லை.'
    vagai: விலக்கு
    vilakkukkuriyathu:
    - ezhu.83
    thunivu: ஒருதலை அன்மை
  utthi:
  - peyar: கூறிற்று என்றல்
    saanru: கிளந்து
