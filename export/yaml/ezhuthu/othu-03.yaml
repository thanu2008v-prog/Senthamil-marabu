  - ezhu.89
  - ezhu.99
  urai:
    iyaipu:
    - ezhu.84
    - ezhu.9
    - ezhu.27
    - ezhu.65
    - ezhu.140
    text: 'இயைபு (649): "மிடற்றுப் பிறந்த வளியின்" (எழு. 84) — மிடறு உயிர் பிறக்கும் இடம் — மெய்யுள் மிடற்று வளியைச் சுட்டுவது யகரம் ஒன்றே. யகரம் உடம்படுமெய்யாக உயிர்களிடை வருவது — "உடம்படு மெய்யின் உருவுகொளல் வரையார்" (எழு. 140). எண்: 89–99 — 2 + 2 + 2 + 2 + 2 + 2 + 2 + 2 + 1 + 1 = 18 = மெய் பதினெட்டு (எழு. 9).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.100
  pindam: 1
  padalam: ezhuthu
  othu: 3
  sutra: 100
  moolam: |-
    மெல்லெழுத் தாறும் பிறப்பி னாக்கஞ்
    சொல்லிய பள்ளி நிலையின வாயினு
    மூக்கின் வளியிசை யாப்புறத் தோன்றும்
  kaandigai:
    porul: மெல்லெழுத்து ஆறும் கூறிய இடத்தில் பிறந்தாலும் மூக்கின் வளியிசையோடு தோன்றும்.
    en:
      kooruvathu: 6
      enniyathu: 6
    ethu: மெல்லினம் வல்லினத்தோடு அதே இடத்தில் பிறக்கின்றன — "ககார ஙகாரம் முதல்நா அண்ணம்" (எழு. 89), "இதழியைந்து பிறக்கும் பகார மகாரம்" (எழு. 97). இரண்டையும் பிரிப்பது மூக்கின் வளியிசை; இவ்விணையே மெய்ம்மயக்கத்திலும் வருகிறது — "தத்தம் இசைகள் ஒத்தன நிலையே" (எழு. 25).
    eduthukkaattu:
    - text: ககார ஙகாரம் முதல்நா அண்ணம்
      from: ezhu.89
    - text: இதழியைந்து பிறக்கும் பகார மகாரம்
      from: ezhu.97
    - text: தத்தம் இசைகள் ஒத்தன நிலையே
      from: ezhu.25
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: மெல்லினம்
    count: 6
    extra_organ: மூக்கு
    mode: வளி_இசை
  links:
