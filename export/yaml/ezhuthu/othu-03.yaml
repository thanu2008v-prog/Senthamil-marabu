# இக்கோப்பு data_v2-இலிருந்து உருவானது. 'moolam' (சூத்திரம்) திருத்தக் கூடாது (பொருள். 652).
- id: ezhu.83
  pindam: 1
  padalam: ezhuthu
  othu: 3
  sutra: 83
  moolam: |-
    உந்தி முதலா முந்துவளி தோன்றித்
    தலையினும் மிடற்றினும் நெஞ்சினும் நிலைஇப்
    பல்லும் இதழும் நாவும் மூக்கும்
    அண்ணமும் உளப்பட எண்முறை நிலையான்
    உறுப்புற் றமைய நெறிப்பட நாடி
    எல்லா எழுத்தும் சொல்லுங் காலைப்
    பிறப்பின் ஆக்கம் வேறுவே றியல
    திறப்படத் தெரியுங் காட்சி யான
  kaandigai:
    porul: உந்தியிலிருந்து எழும் வளி, தலை, மிடறு, நெஞ்சு ஆகியவற்றில் நிலைபெற்று, பல், இதழ், நா, மூக்கு, அண்ணம் உட்பட எட்டு நிலையில் உறுப்புகள் பொருந்த, எல்லா எழுத்தும் வேறுவேறு பிறப்புடையன. "எண்முறை" நூற்பாவிலேயே; தலை, மிடறு, நெஞ்சு, பல், இதழ், நா, மூக்கு, அண்ணம் என எண்ணிப் பார்க்க எட்டு.
    en:
      kooruvathu: 8
      enniyathu: 8
    ethu: எழுத்தின் தொகையும் அளவும் வடிவும் மொழிநிலையும் கூறிய பின் (எழு. 1–82), அவை பிறக்கும் வழியை நூல் தொடங்குகிறது; எட்டு உறுப்பும் இந்நூற்பாவின் சொல்லிலேயே. எ.கா. உயிர் "மிடற்றுப் பிறந்த வளியின் இசைக்கும்" (எழு. 84); "அ ஆ ஆயிரண் டங்காந் தியலும்" (எழு. 85).
    eduthukkaattu:
    - text: மிடற்றுப் பிறந்த வளியின் இசைக்கும்
      from: ezhu.84
    - text: அ ஆ ஆயிரண் டங்காந் தியலும்
      from: ezhu.85
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: பிறப்பு_நிலை
    count: 8
    items:
    - தலை
    - மிடறு
    - நெஞ்சு
    - பல்
    - இதழ்
    - நா
    - மூக்கு
    - அண்ணம்
    source: உந்தி
  links:
  - ezhu.84
  - ezhu.89
  - ezhu.93
  - ezhu.97
  - ezhu.99
  urai:
    iyaipu:
    - ezhu.84
    - ezhu.85
    - ezhu.102
    text: 'இயைபு (649): எழு. 84, 85, 102 — பிறப்பியலின் நுதலியது. "எண்முறை நிலை" — தலை, மிடறு, நெஞ்சு, பல், இதழ், நா, மூக்கு, அண்ணம் — எட்டு (நூலின் எண்ணால் சான்று). உயிர் மிடற்றுப் பிறக்கும் (84); மெய் 85 முதல். எல்லை: புறத்து இசைக்கும் வளியிசை மட்டும் (102). கடாஅ (650): "உந்தி" எட்டனுள் இல்லையே? — விடை: உந்தி வளி தோன்றும் இடம் ("உந்தி முதலா முந்துவளி தோன்றி"); எட்டு, அவ்வளி நிலைபெறும் இடம் — சூத்திரச் சொல் வரிசையாலே.'
    maruthalai:
    - kadaa: '"உந்தி" எட்டனுள் இல்லையே?'
      maattram: '— விடை: உந்தி வளி தோன்றும் இடம் ("உந்தி முதலா முந்துவளி தோன்றி"); எட்டு, அவ்வளி நிலைபெறும் இடம் — சூத்திரச் சொல் வரிசையாலே.'
      saanru:
      - text: உந்தி
        from: ezhu.83
      - text: உந்தி முதலா முந்துவளி தோன்றி
        from: ezhu.83
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.84
  pindam: 1
  padalam: ezhuthu
  othu: 3
  sutra: 84
  moolam: |-
    அவ்வழிப்
    பன்னீ ருயிரும் தந்நிலை திரியா
    மிடற்றுப் பிறந்த வளியின் இசைக்கும்
  kaandigai:
    porul: அவ்வழி, பன்னிரண்டு உயிரும் தம் நிலை திரியாமல் மிடற்றில் பிறந்த வளியால் ஒலிக்கும்.
    en:
      kooruvathu: 12
      enniyathu: 12
    ethu: உயிர் பன்னிரண்டும் (எழு. 8) ஒரே இடமாகிய மிடற்றில் பிறப்பதால் "தந்நிலை திரியா"; அவற்றுக்குள் வேறுபாடு 85–87 கூறும் வாய் நிலையால்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: உயிர்
    origin: மிடறு
    count: 12
    links_to: ezhu.8
  links:
  - ezhu.8
  - ezhu.85
  - ezhu.86
  - ezhu.87
  urai:
    iyaipu:
    - ezhu.8
    - ezhu.83
    - ezhu.85
    - ezhu.86
    - ezhu.87
    text: 'இயைபு (649): உயிர் பன்னிரண்டு (எழு. 8); 83-இன் எட்டு நிலையுள் "மிடற்றினும்" (எழு. 83). எண்: 85, 86, 87 — 2 + 5 + 5 = 12 — பன்னிரண்டு (நூற்பா) = பன்னிரண்டு (எண்ணியது).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: அதிகார முறை
    saanru: அவ்வழிப்
- id: ezhu.85
  pindam: 1
  padalam: ezhuthu
  othu: 3
  sutra: 85
  moolam: |-
    அவற்றுள்
    அ ஆ ஆயிரண் டங்காந் தியலும்
  kaandigai:
    porul: அவற்றுள் அ, ஆ இரண்டும் (வாய்) அங்காந்து பிறக்கும்.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: அ, ஆ — குறிலும் நெடிலும் ஒரே பிறப்பு; வேறுபாடு அளவால் (எழு. 3, 4).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    op: பிறப்பு
    class: உயிர்
    items:
    - அ
    - ஆ
    mode: அங்காந்து
  links:
  - ezhu.84
  urai:
    iyaipu:
    - ezhu.3
    - ezhu.4
    - ezhu.84
    - ezhu.88
    text: 'இயைபு (649): குறில்–நெடில் இணை ஒரே பிறப்பு; வேறுபாடு மாத்திரையால் (எழு. 3, 4) — அதுவே "தத்தம் திரிபே சிறிய" (எழு. 88). 85, 86, 87 மூன்றும் உயிரை வாய் நிலையால் மூன்றாகப் பகுக்கின்றன.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: அதிகார முறை
    saanru: அவற்றுள்
- id: ezhu.86
  pindam: 1
  padalam: ezhuthu
  othu: 3
  sutra: 86
  moolam: |-
    இ ஈ எ ஏ ஐயென இசைக்கும்
    அப்பால் ஐந்தும் அவற்றோ ரன்ன
    அவைதாம்
    அண்பல் முதல்நா விளிம்புறல் உடைய
  kaandigai:
    porul: இ, ஈ, எ, ஏ, ஐ — ஐந்தும் அவ்வாறே (அங்காப்போடு), அண்பல் முதலில் நாவிளிம்பு உறுதலும் உடையன.
    en:
      kooruvathu: 5
      enniyathu: 5
    ethu: '"அவற்றோ ரன்ன" — 85-இன் அங்காப்பு இவற்றுக்கும்; கூடுதலாக நாவிளிம்பு அண்பல் முதலை உறுதல்.'
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    op: பிறப்பு
    class: உயிர்
    items:
    - இ
    - ஈ
    - எ
    - ஏ
    - ஐ
    mode: அங்காப்பு+நாவிளிம்பு
    contact: பல்
  links:
  - ezhu.84
  - ezhu.85
  urai:
    iyaipu:
    - ezhu.85
    - ezhu.96
    - ezhu.54
    text: 'இயைபு (649): "அண்பல் முதல்" என்ற இடம் லகர ளகரப் பிறப்பிலும் வருகிறது — "நாவிளிம்பு வீங்கி யண்பன் முதலுற" (எழு. 96). ஐ இவ்வைந்துள் வருவதும் "அகர இகரம் ஐகார மாகும்" (எழு. 54) என்பதும் இயைகின்றன: அகரம் 85, இகரம் 86. எண்: ஐந்து (நூற்பா) = ஐந்து (பட்டியல்).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: ஐந்தும்
- id: ezhu.87
  pindam: 1
  padalam: ezhuthu
  othu: 3
  sutra: 87
  moolam: |-
    உ ஊ ஒ ஓ ஔ என இசைக்கும்
    அப்பால் ஐந்தும் இதழ்குவிந் தியலும்
  kaandigai:
    porul: 'உ, ஊ, ஒ, ஓ, ஔ — ஐந்தும் இதழ் குவிந்து பிறக்கும். 85, 86, 87: 2 + 5 + 5 = 12 உயிர் (84) — எண்ணிச் சரிபார்த்தது.'
    en:
      kooruvathu: 5
      enniyathu: 5
    ethu: 'உ ஊ ஒ ஓ ஔ — இதழ் குவிதல்; 85, 86, 87: 2 + 5 + 5 = 12.'
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    op: பிறப்பு
    class: உயிர்
    items:
    - உ
    - ஊ
    - ஒ
    - ஓ
    - ஔ
    mode: இதழ்_குவிந்து
  links:
  - ezhu.84
  - ezhu.85
  - ezhu.86
  urai:
    iyaipu:
    - ezhu.55
    - ezhu.84
    - ezhu.97
    - ezhu.98
    - ezhu.63
    text: 'இயைபு (649): "அகர உகரம் ஔகார மாகும்" (எழு. 55) — ஔ இதழ் குவியும் கூட்டத்தில்; மெய்யுள் இதழால் பிறப்பன ப, ம (எழு. 97), வ (எழு. 98) — "இதழ்" உயிர்க்கும் மெய்க்கும் பொது இடம். மறுதலைக் கடாஅ (650): வகரம் உ ஊ ஒ ஓ-வோடு மொழிமுதலாகாமை (எழு. 63) இப்பிறப்பால் அன்றோ? — விடை: 63 விலக்கும் நான்கும் இக்கூட்டத்தவை; ஆனால் அதே கூட்டத்து ஔ 63-இல் இல்லை; காரணத்தை நூல் கூறவில்லை.'
    vagai: விதி
    maruthalai:
    - kadaa: வகரம் உ, ஊ, ஒ, ஓ-வோடு மொழிமுதலாகாமை (எழு. 63) இதழ் குவியும் உயிர்ப் பிறப்பால் அன்றோ?
      maattram: எழு. 63 விலக்கும் நான்கும் இவ்வோத்தின் இதழ் குவியும் கூட்டத்தவை; ஆனால் அதே கூட்டத்து ஔ 63-இல் இல்லை; காரணத்தை நூல் கூறவில்லை.
      saanru:
      - text: உஊ ஒஓ என்னும் நான்குயிர்
        from: ezhu.63
      - text: இதழ்குவிந் தியலும்
        from: ezhu.87
    thunivu: விதி நூலில் நேரடியாக; 63 உடனான தொடர்பு ஒருதலை அன்மை
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: ஐந்தும்
- id: ezhu.88
  pindam: 1
  padalam: ezhuthu
  othu: 3
  sutra: 88
  moolam: |-
    தத்தம் திரிபே சிறிய என்ப
  kaandigai:
    porul: தத்தம் திரிபு (வேறுபாடு) சிறியவை என்பர்.
    ethu: 85–87-இன் ஒவ்வொரு கூட்டத்துள்ளும் எழுத்துகளுக்கிடையிலான வேறுபாடு சிறிது.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    op: திரிபு_சிறுமை
  links: []
  urai:
    iyaipu:
    - ezhu.85
    - ezhu.86
    - ezhu.87
    - ezhu.3
    - ezhu.4
    text: 'இயைபு (649): 85–87-இன் மூவகைப் பிறப்புக்கு விலக்கு — ஒரு கூட்டத்துள் வேறுபாடு உண்டு, ஆனால் சிறிது. மறுதலைக் கடாஅ (650): ஒரே பிறப்பென்றால் அ, ஆ எவ்வாறு வேறு? — விடை: அளவால் — "ஓரள பிசைக்குங் குற்றெழுத் தென்ப" (எழு. 3); நெடில் ஈரளபு (எழு. 4).'
    vagai: விலக்கு
    vilakkukkuriyathu:
    - ezhu.85
    - ezhu.86
    - ezhu.87
    maruthalai:
    - kadaa: ஒரே பிறப்பென்றால் அ, ஆ எவ்வாறு வேறு?
      maattram: 'அளவால்: குறில் ஓரளபு (எழு. 3), நெடில் ஈரளபு (எழு. 4).'
      saanru:
      - text: ஓரள பிசைக்குங் குற்றெழுத் தென்ப
        from: ezhu.3
    thunivu: விதி நூலில் நேரடியாக; "திரிபு" எவை எனப் பெயரிடவில்லை — ஒருதலை அன்மை
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: ezhu.89
  pindam: 1
  padalam: ezhuthu
  othu: 3
  sutra: 89
  moolam: |-
    ககார ஙகாரம் முதல்நா அண்ணம்
  kaandigai:
    porul: க, ங — முதல்நாவும் அண்ணமும் (பொருந்தப் பிறக்கும்).
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 'க (வல்லினம், எழு. 19), ங (மெல்லினம், எழு. 20) — ஒரே இடம்: முதல்நா + அண்ணம். இனக் கூட்டு: "வழங்கியல்" (எழு. 22).'
    eduthukkaattu:
    - text: வழங்கியல்
      from: ezhu.22
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    op: பிறப்பு
    class: மெய்
    items:
    - க
    - ங
    contact:
    - முதல்நா
    - அண்ணம்
  links:
  - ezhu.92
  urai:
    iyaipu:
    - ezhu.19
    - ezhu.20
    - ezhu.25
    - ezhu.92
    text: 'இயைபு (649): "ஙஞண நமன எனும்புள்ளி முன்னர்த் / தத்தம் இசைகள் ஒத்தன நிலையே" (எழு. 25) — மெல்லினத்தின் முன் அதன் இனமான வல்லினம். பிறப்பியல் தரும் இணைகள் — க ங (89), ச ஞ (90), ட ண (91), த ந (93), ற ன (94), ப ம (97) — 25-இன் இணைகளோடு முழுதும் ஒக்கின்றன. எண் (நூலுள்): இனம் ஒத்த மெல்லின–வல்லினக் கூட்டு நூலுள் 1,993 இடம் (ங்க 376, ஞ்ச 96, ண்ட 211, ந்த 541, ம்ப 89, ன்ற 680).'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 25-இன் "ஒத்தன" இப்பிறப்பே என்பது ஒருதலை அன்மை — நூலின் இணையால் சான்று
- id: ezhu.90
  pindam: 1
  padalam: ezhuthu
  othu: 3
  sutra: 90
  moolam: |-
    சகார ஞகாரம் இடைநா அண்ணம்
  kaandigai:
    porul: ச, ஞ — இடைநாவும் அண்ணமும்.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 'ச, ஞ — இடைநா + அண்ணம். இனக் கூட்டு: "நெடுஞ்சினை" (எழு. 56).'
    eduthukkaattu:
    - text: நெடுஞ்சினை
      from: ezhu.56
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    op: பிறப்பு
    items:
    - ச
    - ஞ
    contact:
    - இடைநா
    - அண்ணம்
  links:
  - ezhu.92
  urai:
    iyaipu:
    - ezhu.19
    - ezhu.20
    - ezhu.25
    - ezhu.89
    - ezhu.92
    text: 'இயைபு (649): 89-இன் முதல்நா, இங்கு இடைநா, 91-இல் நுனிநா — நாவின் மூன்று இடம் வரிசையாக. எழு. 25-இன் இணை ஞ்ச. எண் (நூலுள்): ஞ்ச 96 இடம்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.91
  pindam: 1
  padalam: ezhuthu
  othu: 3
  sutra: 91
  moolam: |-
    டகார ணகாரம் நுனிநா அண்ணம்
  kaandigai:
    porul: ட, ண — நுனிநாவும் அண்ணமும்.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 'ட, ண — நுனிநா + அண்ணம். இனக் கூட்டு: "வேண்டின்" (எழு. 6).'
    eduthukkaattu:
    - text: வேண்டின்
      from: ezhu.6
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    op: பிறப்பு
    items:
    - ட
    - ண
    contact:
    - நுனிநா
    - அண்ணம்
  links:
  - ezhu.92
  urai:
    iyaipu:
    - ezhu.19
    - ezhu.20
    - ezhu.25
    - ezhu.90
    - ezhu.92
    text: 'இயைபு (649): நாவின் மூன்றாம் இடம்; 92 இம்மூன்றையும் தொகுக்கிறது. எழு. 25-இன் இணை ண்ட. எண் (நூலுள்): ண்ட 211 இடம்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.92
  pindam: 1
  padalam: ezhuthu
  othu: 3
  sutra: 92
  moolam: |-
    அவ்வா றெழுத்தும் மூவகைப் பிறப்பின
  kaandigai:
    porul: 'அவ்வாறு எழுத்தும் மூவகைப் பிறப்பின (89–91: 3 × 2 = 6).'
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: '89–91: நாவின் மூன்று இடம் (முதல், இடை, நுனி) × அண்ணம்; ஒவ்வோர் இடத்திலும் ஒரு வல்லினம், ஒரு மெல்லினம்.'
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: மெய்_பிறப்பு_வகை
    count: 3
    items:
    - (க,ங)
    - (ச,ஞ)
    - (ட,ண)
    letters_count: 6
  links:
  - ezhu.89
  - ezhu.90
  - ezhu.91
  urai:
    iyaipu:
    - ezhu.89
    - ezhu.90
    - ezhu.91
    - ezhu.19
    - ezhu.20
    text: 'இயைபு (649): 89–91-இன் தொகை. எண்: மூன்று இடம் × இரண்டு எழுத்து = ஆறு — "அவ்வா றெழுத்தும் மூவகைப் பிறப்பின" — நூற்பாவின் "மூவகை" (மூன்று) பட்டியலோடு ஒத்தது.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: மூவகைப்
- id: ezhu.93
  pindam: 1
  padalam: ezhuthu
  othu: 3
  sutra: 93
  moolam: |-
    அண்ணம் நண்ணிய பல்முதல் மருங்கின்
    நாநுனி பரந்து மெய்யுற ஒற்றத்
    தாம் இனிது பிறக்குந் தகார நகாரம்
  kaandigai:
    porul: அண்ணத்தை அடுத்த பல்முதலில் நாநுனி பரந்து பொருந்த ஒற்ற, த, ந பிறக்கும்.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 'த, ந — நாநுனி பரந்து அண்ணம் நண்ணிய பல்முதலில் ஒற்ற. இனக் கூட்டு: "சார்ந்துவரல்" (எழு. 1).'
    eduthukkaattu:
    - text: சார்ந்துவரல்
      from: ezhu.1
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    op: பிறப்பு
    items:
    - த
    - ந
    contact:
    - பல்_முதல்
    - நாநுனி_பரப்பு
  links:
  - ezhu.100
  urai:
    iyaipu:
    - ezhu.19
    - ezhu.20
    - ezhu.25
    - ezhu.91
    text: 'இயைபு (649): 89–91-இன் அண்ணத்துக்கு மாறாக இங்கு பல்முதல் — நாநுனி இடம் 91 (ட ண), 93 (த ந), 94 (ற ன), 95 (ர ழ) என்ற நான்கிலும் வருகிறது. எழு. 25-இன் இணை ந்த. எண் (நூலுள்): ந்த 541 இடம்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.94
  pindam: 1
  padalam: ezhuthu
  othu: 3
  sutra: 94
  moolam: |-
    அணரி நுனிநா அண்ணம் ஒற்ற
    றஃகான் னஃகான் ஆயிரண்டும் பிறக்கும்
  kaandigai:
    porul: நுனிநா அண்ணத்தை அணரி (மேல்நோக்கி) ஒற்ற, ற, ன பிறக்கும்.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 'ற, ன — நுனிநா அணரி அண்ணம் ஒற்ற. இனக் கூட்டு: "மூன்றலங்" (எழு. 1).'
    eduthukkaattu:
    - text: மூன்றலங்
      from: ezhu.1
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    op: பிறப்பு
    items:
    - ற
    - ன
    contact:
    - நுனிநா
    - அண்ணம்
    direction: மேல்நோக்கி
  links:
  - ezhu.100
  urai:
    iyaipu:
    - ezhu.1
    - ezhu.19
    - ezhu.20
    - ezhu.25
    text: 'இயைபு (649): ற, ன வல்லின மெல்லினப் பட்டியல்களின் இறுதி (எழு. 19, 20); ன எழுத்து முழுவதன் இறுதி — "அகரமுதல் னகர இறுவாய்" (எழு. 1). எழு. 25-இன் இணை ன்ற. எண் (நூலுள்): ன்ற 680 இடம் — இனக் கூட்டுகளுள் மிகுதி.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.95
  pindam: 1
  padalam: ezhuthu
  othu: 3
  sutra: 95
  moolam: |-
    நுனிநா அணரி அண்ணம் வருட
    ரகாரம் ழகாரம் ஆயிரண்டும் பிறக்கும்
  kaandigai:
    porul: நுனிநா அணரி அண்ணத்தை வருட, ர, ழ பிறக்கும்.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: ர, ழ — நுனிநா அணரி அண்ணம் வருட; 94-இன் "ஒற்ற" (எழு. 94) இங்கு "வருட".
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    op: பிறப்பு
    items:
    - ர
    - ழ
    contact:
    - நுனிநா
    - அண்ணம்
    mode: வருடல்
  links:
  - ezhu.100
  urai:
    iyaipu:
    - ezhu.94
    - ezhu.30
    - ezhu.49
    - ezhu.21
    text: 'இயைபு (649): ஒரே பிறப்புடைய ர, ழ இரண்டும் இரு விதியிலும் இணைந்தே வருகின்றன — உடனிலை விலக்கு "ரழவலங் கடையே" (எழு. 30); "ரகார ழகாரங் குற்றொற் றாகா" (எழு. 49). எண் (நூலுள்): ர்ர 0, ழ்ழ 0 — 30-ஓடு ஒத்தது.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; பிறப்புக்கும் 30, 49-க்கும் உள்ள தொடர்பு ஒருதலை அன்மை
- id: ezhu.96
  pindam: 1
  padalam: ezhuthu
  othu: 3
  sutra: 96
  moolam: |-
    நாவிளிம்பு வீங்கி யண்பன் முதலுற
    வாவயி னண்ண மொற்றவும் வருடவும்
    லகார ளகார மா யிரண்டும் பிறக்கும்
  kaandigai:
    porul: நாவிளிம்பு வீங்கி அண்பல்முதலை உற, அவ்விடத்து அண்ணத்தை ஒற்றவும் வருடவும் ல, ள பிறக்கும்.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 'பிறப்பியல் மெய்களை இனம் இனமாக இடத்தால் வகுக்கிறது: முன் சூத்திரம் ர, ழ — "நுனிநா அணரி அண்ணம் வருட" (எழு. 95); இது ல, ள. இவை மெய்ம்மயக்கத்திலும் இணையாகவே வருகின்றன — "லள ஃகான் முன்னர் ய வ வுந் தோன்றும்" (எழு. 24).'
    eduthukkaattu:
    - text: நுனிநா அணரி அண்ணம் வருட
      from: ezhu.95
    - text: லள ஃகான் முன்னர் ய வ வுந் தோன்றும்
      from: ezhu.24
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    op: பிறப்பு
    items:
    - ல
    - ள
    contact:
    - நாவிளிம்பு
    - பல்
    - அண்ணம்
    mode:
    - ஒற்றல்
    - வருடல்
  links:
  - ezhu.100
  urai:
    iyaipu:
    - ezhu.86
    - ezhu.23
    - ezhu.24
    - ezhu.30
    - ezhu.21
    text: 'இயைபு (649): "அண்பல் முதல்நா" (எழு. 86) — அண்பல் முதல் உயிர்ப் பிறப்பிலும். மயக்க விதிகளிலும் ல, ள இணை — "ட ற ல ள என்னும் புள்ளி" (எழு. 23), "லள ஃகான் முன்னர் ய வ வுந் தோன்றும்" (எழு. 24). உடனிலை (எழு. 30): ல்ல 463, ள்ள 130 இடம்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.97
  pindam: 1
  padalam: ezhuthu
  othu: 3
  sutra: 97
  moolam: |-
    இதழியைந்து பிறக்கும் பகார மகாரம்
  kaandigai:
    porul: இதழ் இயைந்து ப, ம பிறக்கும்.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 'ப, ம — இதழ் இயைந்து. இனக் கூட்டு: "எனும்புள்ளி" (எழு. 25).'
    eduthukkaattu:
    - text: எனும்புள்ளி
      from: ezhu.25
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    op: பிறப்பு
    items:
    - ப
    - ம
    contact:
    - இதழ்_இயைதல்
  links:
  - ezhu.100
  urai:
    iyaipu:
    - ezhu.87
    - ezhu.98
    - ezhu.19
    - ezhu.20
    - ezhu.25
    text: 'இயைபு (649): இதழ் — உயிருள் இதழ் குவியும் கூட்டம் (எழு. 87); மெய்யுள் ப, ம, வ (எழு. 98). எழு. 25-இன் இணை ம்ப. எண் (நூலுள்): ம்ப 89 இடம்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.98
  pindam: 1
  padalam: ezhuthu
  othu: 3
  sutra: 98
  moolam: |-
    பல்லித ழியைய வகாரம் பிறக்கும்
  kaandigai:
    porul: பல்லும் இதழும் இயைய வகரம் பிறக்கும்.
    ethu: வ — பல்லும் இதழும் இயைய; இணையின்றித் தனி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    op: பிறப்பு
    items:
    - வ
    contact:
    - பல்
    - இதழ்_இயைதல்
  links:
  - ezhu.100
  urai:
    iyaipu:
    - ezhu.97
    - ezhu.28
    - ezhu.63
    - ezhu.21
    text: 'இயைபு (649): இடையினத்துள் (எழு. 21) வ, ய இரண்டும் இணையின்றித் தனிப் பிறப்புடையன (98, 99); ர ழ, ல ள இணைகள் (95, 96). மயக்கம்: "மஃகான் புள்ளிமுன் வவ்வுந் தோன்றும்" (எழு. 28); மொழிமுதல் விலக்கு எழு. 63.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.99
  pindam: 1
  padalam: ezhuthu
  othu: 3
  sutra: 99
  moolam: |-
    அண்ணஞ் சேர்ந்த மிடற்றெழு வளியிசை
    கண்ணுற் றடைய யகாரம் பிறக்கும்
  kaandigai:
    porul: அண்ணம் சேர்ந்த மிடற்றெழு வளியின் இசை கண்ணுற்று அடைய யகரம் பிறக்கும். 89–99-இல் பதினெட்டு மெய்யும் இடம் பெறுகின்றன (எண்ணிச் சரிபார்த்தது).
    en:
      kooruvathu: 18
      enniyathu: 18
    ethu: இடையினம் ஆறனுள் ய இறுதியாக வருகிறது; இதன் பிறப்பில் "மிடற்றெழு வளியிசை" உண்டு; உயிரும் "மிடற்றுப் பிறந்த வளியின் இசைக்கும்" (எழு. 84). யகரம் புணர்ச்சியில் உடம்படுமெய்யாகவும் வருகிறது (எழு. 140). எழு. 89–99 கூறும் இடங்களில் பதினெட்டு மெய்யும் அடங்குகின்றன.
    eduthukkaattu:
    - text: மிடற்றெழு வளியிசை
      from: ezhu.99
    - text: மிடற்றுப் பிறந்த வளியின் இசைக்கும்
      from: ezhu.84
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    op: பிறப்பு
    items:
    - ய
    contact:
    - அண்ணம்
    - மிடறு
    mode: வளி_இசை
  links:
