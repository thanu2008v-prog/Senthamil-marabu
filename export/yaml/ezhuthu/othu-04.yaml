    - sol.157
    - sol.200
    text: 'இயைபு (649): "பெயரொடு பெயரைப் புணர்க்குங் காலும்" … "தொழிலொடு தொழிலைப் புணர்க்குங் காலும்" — பெயர், வினை இரண்டே சொல் என்பது சொல்லதிகாரத்தோடு இயைகிறது (பெயரியல் சொல். 157; வினையியல் சொல். 200). எண்: பெயர்/தொழில் இணைவு நான்கு; "மூன்றே திரிபிடன் ஒன்றே இயல்பென / ஆங்கந் நான்கே" — 3 + 1 = 4 — நூலின் எண்ணோடு ஒத்தது.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: அதிகார முறை
    saanru: அவற்றுள்
  - peyar: தொகுத்துக் கூறல்
    saanru: மூன்றே
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிபுணர்
- id: ezhu.109
  pindam: 1
  padalam: ezhuthu
  othu: 4
  sutra: 109
  moolam: |-
    அவைதாம்
    மெய்ப்பிறி தாதல் மிகுதல் குன்றலென்று
    இவ்வென மொழிப திரியு மாறே
  kaandigai:
    porul: 'திரிபு மூன்று: மெய் பிறிதாதல், மிகுதல், குன்றல்.'
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: 'நூலின் சொந்தப் புணர்ச்சிகளில் மூன்று திரிபும் இயல்பும்: மெய் பிறிதாதல் — "நான்கனுரு பிற்கு" (எழு. 123: இன் → இற்); மிகுதல் — "கிளவிக்கு" (எழு. 244: க் மிகுதல்); குன்றல் — "எழுத்தெனப்" (எழு. 1: உகரம் குன்றல்); இயல்பு — "அவைதாம்" (எழு. 2).'
    eduthukkaattu:
    - text: நான்கனுரு பிற்கு
      from: ezhu.123
    - text: கிளவிக்கு
      from: ezhu.244
    - text: எழுத்தெனப்
      from: ezhu.1
    - text: அவைதாம்
      from: ezhu.2
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: திரிபு
    count: 3
    items:
    - மெய்ப்பிறிதாதல்
    - மிகுதல்
    - குன்றல்
  links:
  - ezhu.108
  urai:
    iyaipu:
    - ezhu.108
    - ezhu.112
    - ezhu.123
    - ezhu.114
    - ezhu.105
    text: 'இயைபு (649): திரிபு மூன்றும் பின்வரும் ஓத்துகளில் விரிகின்றன — பிறிதாதல் (எ.கா. எழு. 123, 129), மிகுதல் (எழு. 114, 133), குன்றல் (எழு. 115, 120, 128). எண்: மூன்று (நூற்பா) = மூன்று (பட்டியல்).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: அதிகார முறை
    saanru: அவைதாம்
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
- id: ezhu.110
  pindam: 1
  padalam: ezhuthu
  othu: 4
  sutra: 110
  moolam: |-
    நிறுத்த சொல்லுங் குறித்துவரு கிளவியும்
    அடையொடு தோன்றினும் புணர்நிலைக் குரிய
  kaandigai:
    porul: நிலைமொழியும் வருமொழியும் அடையொடு தோன்றினாலும் புணர்ச்சிக்கு உரியன.
    ethu: நிலைமொழியோ வருமொழியோ அடை பெற்று நின்றாலும் புணர்ச்சி விதி அதன் ஈற்றுக்கும் முதலுக்குமே பொருந்தும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    context: அடையொடு_தோன்றினும்
    property: புணர்ச்சி_உரியது
  links:
  - ezhu.107
  - ezhu.318
  urai:
    iyaipu:
    - ezhu.107
    - ezhu.108
    text: 'இயைபு (649): 107-இன் "நிறுத்த சொல்", "குறித்துவரு கிளவி" என்ற இரு பெயருக்கு விரிவு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.111
  pindam: 1
  padalam: ezhuthu
  othu: 4
  sutra: 111
  moolam: |-
    மருவின் தொகுதி மயங்கியல் மொழியும்
    உரியவை உளவே புணர்நிலைச் சுட்டே
  kaandigai:
    porul: மருவின் தொகுதியும் மயங்கியல் மொழியும் புணர்ச்சிக்கு உரியவை உள.
    ethu: புணர்ச்சி விதிகள் எல்லாம் எழுத்தின் இயைபால் அமைவன (எழு. 108); ஆயினும் வழக்கில் மருவிய வடிவங்களும் புணர்ச்சிக்கு உரியவை என முன்னே எல்லை வகுக்கிறது. அதன் இறுதிப் புறனடை — "வழங்கியல் மருங்கின் மருவொடு திரிநவும்" (எழு. 483).
    eduthukkaattu:
    - text: வழங்கியல் மருங்கின் மருவொடு திரிநவும்
      from: ezhu.483
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    exceptions:
    - மருவு_தொகுதி
    - மயங்கியல்_மொழி
  links: []
  urai:
    iyaipu:
    - ezhu.172
    - ezhu.483
    text: 'இயைபு (649): "மருவின் பாத்தியின் திரியுமன் பயின்றே" (எழு. 172); எழுத்ததிகாரப் புறனடை எழு. 483 — வழக்கே சான்று. "உரியவை உளவே" — எல்லாம் அன்று; எவை என நூல் பெயரிடவில்லை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; எல்லை ஒருதலை அன்மை
- id: ezhu.112
  pindam: 1
  padalam: ezhuthu
  othu: 4
  sutra: 112
  moolam: |-
    வேற்றுமை குறித்த புணர்மொழி நிலையும்
    வேற்றுமை அல்வழிப் புணர்மொழி நிலையும்
    எழுத்தே சாரியை ஆயிரு பண்பின்
    ஒழுக்கல் வலிய புணருங் காலை
  kaandigai:
    porul: வேற்றுமைப் புணர்ச்சியும் அல்வழிப் புணர்ச்சியும் எழுத்து, சாரியை என்ற இருபண்பால் புணரும்.
    en:
      kooruvathu: 4
      enniyathu: 4
    ethu: புணர்ச்சி இருவகைப் பொருளில் — வேற்றுமை, அல்வழி; இருவகைக் கருவியால் — எழுத்து, சாரியை.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: classification
    dimensions:
    - வேற்றுமை
    - அல்வழி
    modes:
    - எழுத்து
    - சாரியை
  links:
  - ezhu.113
  - ezhu.118
  - ezhu.119
  urai:
    iyaipu:
    - ezhu.113
    - ezhu.118
    - ezhu.119
    - ezhu.204
    text: 'இயைபு (649): "வேற்றுமை யல்வழி" (எழு. 379) என்ற இணை உயிர்மயங்கியலும் புள்ளிமயங்கியலும் முழுதும் ஆள்கின்றன (எ.கா. எழு. 204). எழுத்தால் புணர்தல் 109-இன் திரிபு; சாரியையால் புணர்தல் 118–133. எண்: 2 × 2 = 4 (காண்டிகை).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.113
  pindam: 1
  padalam: ezhuthu
  othu: 4
  sutra: 113
  moolam: |-
    ஐஒடு குஇன் அதுகண் என்னும்
    அவ்வா றென்ப வேற்றுமை யுருபே
  kaandigai:
    porul: 'வேற்றுமை உருபு ஆறு: ஐ, ஒடு, கு, இன், அது, கண். "அவ்வாறு" நூற்பாவிலேயே; எண்ணிப் பார்க்க ஒத்தது. விரிவு: சொல். 63–84.'
    en:
      kooruvathu: 6
      enniyathu: 6
    ethu: 'உருபு ஆறு: ஐ, ஒடு, கு, இன், அது, கண். நூலே இவற்றை ஆள்கிறது: "பெயர் ஐ ஒடு கு / இன் அது கண் விளி" (சொல். 65).'
    eduthukkaattu:
    - text: பெயர் ஐ ஒடு கு
      from: sol.65
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: வேற்றுமை_உருபு
    count: 6
    items:
    - ஐ
    - ஒடு
    - கு
    - இன்
    - அது
    - கண்
  links:
  - sol.65
  urai:
    iyaipu:
    - sol.63
    - sol.64
    - sol.65
    - sol.66
    text: 'இயைபு (649): சொல். 65 எட்டுப் பெயர் தருகிறது — பெயர், ஐ, ஒடு, கு, இன், அது, கண், விளி. மறுதலைக் கடாஅ (650): இங்கு ஆறு, சொல்லதிகாரத்தில் ஏழு (சொல். 63), எட்டு (சொல். 64) — மாறா? விடை: உருபு உடையவை ஆறு; முதல் வேற்றுமை "பெயர் தோன்று நிலையே" (சொல். 66) — உருபு இல்லை; ஆகவே 6 + 1 = 7; விளியொடு 8. எண்: ஆறு (நூற்பா) = ஆறு (பட்டியல்).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
    maruthalai:
    - kadaa: இங்கு உருபு ஆறு; சொல்லதிகாரத்தில் வேற்றுமை ஏழு, விளியொடு எட்டு — மாறா?
      maattram: உருபு உடையவை ஆறு; முதல் வேற்றுமை உருபில்லாப் பெயர் (சொல். 66); 6 + 1 = 7; விளியொடு 8.
      saanru:
      - text: பெயர் ஐ ஒடு கு
        from: sol.65
- id: ezhu.114
  pindam: 1
  padalam: ezhuthu
  othu: 4
  sutra: 114
  moolam: |-
    வல்லெழுத்து முதலிய வேற்றுமை யுருபிற்
    கொல்வழி ஒற்றிடை மிகுதல் வேண்டும்
  kaandigai:
    porul: வல்லெழுத்து முதலிய உருபுகளுக்கு (கு, கண்) ஒற்று இடைமிகுதல் வேண்டும்.
    ethu: 'வல்லெழுத்தில் தொடங்கும் உருபுகள் கு, கண் — அவற்றின் முன் ஒற்று மிகும்: "கிளவிக்கு" (எழு. 244), "தொகைநிலைக்கண்ணும்" (பொருள். 72).'
    eduthukkaattu:
    - text: கிளவிக்கு
      from: ezhu.244
    - text: தொகைநிலைக்கண்ணும்
      from: porul.72
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    op: ஒற்று_இடைமிகுதல்
    context: வல்லெழுத்து_முதல்_உருபு
  links: []
  urai:
    iyaipu:
    - ezhu.113
    - ezhu.109
    - ezhu.19
    text: 'இயைபு (649): 113-இன் ஆறு உருபுள் வல்லெழுத்து (எழு. 19) முதலியவை கு, கண் இரண்டே; மிகுதல் — 109-இன் இரண்டாம் திரிபு. எண் (நூலுள்): "-க்கு" ஈற்றுச் சொல் 141, "-க்கண்" 23 (ஏறக்குறைய).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஆணை கூறல்
    saanru: வேண்டும்
- id: ezhu.115
  pindam: 1
  padalam: ezhuthu
  othu: 4
  sutra: 115
  moolam: |-
    ஆறன் உருபின் அகரக் கிளவி
    ஈறா ககரமுனைக் கெடுதல் வேண்டும்
  kaandigai:
    porul: ஆறாம் உருபின் (அது) அகரம், ஈறாகிய ககரத்தின் முன் கெடுதல் வேண்டும்.
    ethu: ஆறாம் உருபு "அது"-வின் அகரம், ககர ஈற்றின் முன் கெடும் — குன்றல் (எழு. 109).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    op: அகர_கெடுதல்
    entity: அது
    context: ககர_ஈறு
  links: []
  urai:
    iyaipu:
    - ezhu.113
    - ezhu.109
    text: 'இயைபு (649): குன்றல் — 109-இன் மூன்றாம் திரிபு. எடுத்துக்காட்டு வடிவம் நூலுள் காணவில்லை — நூலில் இல்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஆணை கூறல்
    saanru: வேண்டும்
- id: ezhu.116
  pindam: 1
  padalam: ezhuthu
  othu: 4
  sutra: 116
  moolam: |-
    வேற்றுமை வழிய பெயர்புணர் நிலையே
  kaandigai:
    porul: பெயர் புணர்நிலை வேற்றுமை வழியது.
    ethu: பெயர் புணர்நிலை வேற்றுமை வழியது — பெயருக்கு உருபு ஏறுவதால்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: பெயர்_புணர்ச்சி
    base: வேற்றுமை
  links: []
  urai:
    iyaipu:
    - ezhu.112
    - ezhu.113
    - sol.70
    text: 'இயைபு (649): 112-இன் வேற்றுமை/அல்வழிப் பகுப்பில், பெயர் உருபொடு புணர்வது வேற்றுமை வழி. வினைக்கு வேற்றுமை இல்லை — "வேற்றுமை கொள்ளாது" (சொல். 200).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.117
  pindam: 1
  padalam: ezhuthu
  othu: 4
  sutra: 117
  moolam: |-
    உயர்திணைப் பெயரே அஃறிணைப் பெயரென்
    றாயிரண் டென்ப பெயர்நிலைச் சுட்டே
  kaandigai:
    porul: 'பெயர் இருவகை: உயர்திணைப் பெயர், அஃறிணைப் பெயர். சொல். 1 உடன் ஒப்பு.'
    ethu: 'பெயர் இருவகை: உயர்திணை, அஃறிணை.'
  nilai: நூலில் நேரடியாக
  kanini:
    kind: classification
    class: பெயர்
    subclasses:
    - உயர்திணை
    - அஃறிணை
  links:
  - sol.1
  urai:
    iyaipu:
    - sol.1
    - sol.2
    - sol.3
    text: 'இயைபு (649): "உயர்திணை என்மனார் மக்கட் சுட்டே / அஃறிணை என்மனார் அவர் அல பிறவே" (சொல். 1) — எழுத்ததிகாரமும் சொல்லதிகாரமும் ஒரே பகுப்பை ஆள்கின்றன. எண்: இரண்டு (நூற்பா) = இரண்டு (பட்டியல்).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.118
  pindam: 1
  padalam: ezhuthu
  othu: 4
  sutra: 118
  moolam: |-
    அவற்றுவழி மருங்கிற் சாரியை வருமே
  kaandigai:
    porul: அவை (உருபோடு) புணருமிடத்துச் சாரியை வரும்.
    ethu: பெயர் உருபொடு புணரும் வழியில் இடையே சாரியை வரும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    op: சாரியை_வருதல்
  links:
  - ezhu.119
  urai:
    iyaipu:
    - ezhu.112
    - ezhu.119
    - ezhu.131
    - ezhu.132
    - sol.252
    text: 'இயைபு (649): சாரியை எழுத்ததிகாரத்தில் புணர்ச்சிக் கருவி; சொல்லதிகாரத்தில் இடைச்சொல்லின் முதல் வகை — "புணரியல் நிலையிடைப் பொருள் நிலைக்கு உதவுநவும்" (சொல். 252). விலக்கு: எழு. 131, 132.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.119
  pindam: 1
  padalam: ezhuthu
  othu: 4
  sutra: 119
  moolam: |-
    அவைதாம்
    இன்னே வற்றே அத்தே அம்மே
    ஒன்னே ஆனே அக்கே இக்கே
    அன்னென் கிளவி உளப்படப் பிறவும்
    அன்ன என்ப சாரியை மொழியே
  kaandigai:
    porul: 'சாரியை: இன், வற்று, அத்து, அம், ஒன், ஆன், அக்கு, இக்கு, அன் — பிறவும். பட்டியல் ஒன்பது; "பிறவும்" என்பதால் இது முடிந்த பட்டியலன்று.'
    en:
      kooruvathu: 9
      enniyathu: 9
    ethu: 'சாரியை ஒன்பது பெயரிடப்படுகின்றன: இன், வற்று, அத்து, அம், ஒன், ஆன், அக்கு, இக்கு, அன்; "பிறவும்" — முடிந்த பட்டியலன்று. நூலே பெயர் சொல்லி ஆள்கிறது: "அத்தும் இன்னும் உறழத் தோன்றல்" (எழு. 193), "வற்றென் சாரியை" (எழு. 189).'
    eduthukkaattu:
    - text: அத்தும் இன்னும் உறழத் தோன்றல்
      from: ezhu.193
    - text: வற்றென் சாரியை
      from: ezhu.189
  nilai: ஒருதலை அன்மை
  kanini:
    kind: enumeration
    class: சாரியை
    count: 9
    items:
    - இன்
    - வற்று
    - அத்து
    - அம்
    - ஒன்
    - ஆன்
    - அக்கு
    - இக்கு
    - அன்
    closed: false
  links:
  - ezhu.118
  - ezhu.132
  urai:
    iyaipu:
    - ezhu.118
    - ezhu.120
    - ezhu.121
    - ezhu.122
    - ezhu.123
    - ezhu.124
    - ezhu.125
    - ezhu.126
    - ezhu.128
    - ezhu.129
    - ezhu.133
    text: 'இயைபு (649): பின்வரும் நூற்பாக்கள் இச்சாரியைகளை ஒவ்வொன்றாகப் பேசுகின்றன — இன் (120, 121, 123, 131), வற்று (122, 133), ஆன் (124), அத்து (125, 133), இக்கு (126), அக்கு (128), அம் (129, 130). ஒன், அன் இவ்வோத்தில் தனி விதி பெறவில்லை. எண்: ஒன்பது (பட்டியல்); நூற்பா தொகை எண் கூறவில்லை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; "பிறவும்" எவை — ஒருதலை அன்மை
  utthi:
  - peyar: அதிகார முறை
    saanru: அவைதாம்
  - peyar: வந்தது கொண்டு வாராதது உணர்த்தல்
    saanru: பிறவும்
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: ezhu.120
  pindam: 1
  padalam: ezhuthu
  othu: 4
  sutra: 120
  moolam: |-
    அவற்றுள்
    இன்னின் இகரம் ஆவின் இறுதி
    முன்னர்க் கெடுதல் உரித்து மாகும்
  kaandigai:
    porul: அவற்றுள் இன்னின் இகரம் ஆவின் இறுதியின் முன் கெடுதலும் உரியது.
    ethu: இன் சாரியையின் இகரம், ஆ ஈற்றின் முன் கெடுதலும் உண்டு — குன்றல்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: இன்
    transform: இகர_கெடுதல்
    context: ஆ_ஈறு
  links: []
  urai:
    iyaipu:
    - ezhu.119
    - ezhu.109
    text: 'இயைபு (649): 119-இன் இன் சாரியைக்கு விலக்கு; "உரித்து மாகும்" — கட்டாயம் அன்று. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விலக்கு
    thunivu: நூலில் நேரடியாக
    vilakkukkuriyathu:
    - ezhu.119
  utthi:
  - peyar: அதிகார முறை
    saanru: அவற்றுள்
  - peyar: ஒருதலை அன்மை
    saanru: உரித்து
- id: ezhu.121
  pindam: 1
  padalam: ezhuthu
  othu: 4
  sutra: 121
  moolam: |-
    அளவாகும் மொழிமுதல் நிலைஇய உயிர்மிசை
    னஃகான் றஃகா னாகிய நிலைத்தே
  kaandigai:
    porul: அளவுப் பெயரின் முதல் உயிர்மேல் (இன்னின்) னகரம் றகரம் ஆகும்.
    ethu: அளவுப் பெயர் உயிர்முதல் மொழியாக வரும்போது இன்னின் னகரம் றகரம் ஆகும் — மெய் பிறிதாதல்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: இன்
    transform: ன→ற
    context: அளவுப்பெயர்_உயிர்
  links: []
  urai:
    iyaipu:
    - ezhu.119
    - ezhu.123
    - ezhu.109
    - ezhu.170
    text: 'இயைபு (649): 123-உம் இதே திரிபு (ன → ற) — நான்கன் உருபுக்கு. நூலுள் "அளவிற்கும் நிறையிற்கும்" (எழு. 170) — அளவு, நிறைப் பெயருக்கு இற்கு வடிவம்.'
    vagai: விலக்கு
    thunivu: நூலில் நேரடியாக
    vilakkukkuriyathu:
    - ezhu.119
- id: ezhu.122
  pindam: 1
  padalam: ezhuthu
  othu: 4
  sutra: 122
  moolam: |-
    வஃகான் மெய்கெடச் சுட்டுமுதல் ஐம்முன்
    அஃகான் நிற்றல் ஆகிய பண்பே
  kaandigai:
    porul: (வற்றின்) வகரமெய் கெட, சுட்டுமுதல் ஐயின் முன் அகரம் நிற்றல் பண்பு.
    ethu: சாரியைகளுள் வற்று ஒன்று (எழு. 119); சுட்டுமுதல் ஐகார ஈற்றுச் சொல்லோடு அது புணரும்போது வகரம் கெடுகிறது. அத்தோடு வற்றுக்கும் ஒற்றுக் கெடுதல் பொது — "அத்தே வற்றே ஆயிரு மொழிமேல் / ஒற்றுமெய் கெடுதல்" (எழு. 133).
    eduthukkaattu:
    - text: அத்தே வற்றே ஆயிரு மொழிமேல் / ஒற்றுமெய் கெடுதல்
      from: ezhu.133
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: வற்று
    transform: வ_கெடுதல்
    context: சுட்டு_ஐ
  links: []
  urai:
    iyaipu:
    - ezhu.119
    - ezhu.133
    - ezhu.31
    text: 'இயைபு (649): "சுட்டுமுதல் ஐ" — சுட்டு அ இ உ (எழு. 31) முதலான ஐ ஈற்றுப் பெயர். எடுத்துக்காட்டு வடிவம் நூல் தரவில்லை.'
    vagai: விலக்கு
    thunivu: நூலில் நேரடியாக
    vilakkukkuriyathu:
    - ezhu.119
- id: ezhu.123
  pindam: 1
  padalam: ezhuthu
  othu: 4
  sutra: 123
  moolam: |-
    னஃகான் றஃகான் நான்கனுரு பிற்கு
  kaandigai:
    porul: நான்காம் உருபுக்கு (இன்னின்) னகரம் றகரம் ஆகும்.
    ethu: 'நான்காம் உருபு (கு) வர, இன்னின் னகரம் றகரம் ஆகும். இந்நூற்பாவே அதன் எடுத்துக்காட்டு: "நான்கனுரு பிற்கு" (உருபின் + கு → உருபிற்கு).'
    eduthukkaattu:
    - text: நான்கனுரு பிற்கு
      from: ezhu.123
    - text: னுருபிற்குத்
      from: ezhu.201
    - text: சொல்லிற்கு
      from: sol.133
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: இன்
    transform: ன→ற
    context: நான்காம்_உருபு
  links: []
  urai:
    iyaipu:
    - ezhu.119
    - ezhu.121
    - ezhu.113
    - ezhu.109
    text: 'இயைபு (649): 121-இன் அதே திரிபு; மெய் பிறிதாதல் (109). எண் (நூலுள்): "-இற்கு" வடிவம் 20 இடம் (ஏறக்குறைய).'
    vagai: விலக்கு
    thunivu: நூலில் நேரடியாக
    vilakkukkuriyathu:
    - ezhu.119
- id: ezhu.124
  pindam: 1
  padalam: ezhuthu
  othu: 4
  sutra: 124
  moolam: |-
    ஆனின் னகரமும் அதனோ ரற்றே
    நாள்முன் வரூஉம் வன்முதற் றொழிற்கே
  kaandigai:
    porul: ஆனின் னகரமும் அவ்வாறே — நாள் முன் வரும் வல்லின முதல் தொழிலுக்கு.
    ethu: ஆன் சாரியை (எழு. 119) நாள்முன் தொழிற்சொல்லுக்கு வருவது — "நாள்முன் தோன்றுந் தொழில்நிலைக் கிளவிக்கு / ஆன் இடை வருதல்" (எழு. 247). அதன் னகரம் றகரமாதல் முன் சூத்திரத்தின் "னஃகான் றஃகான்" (எழு. 123) விதியோடு ஒத்தது — "அதனோ ரற்றே".
    eduthukkaattu:
    - text: நாள்முன் தோன்றுந் தொழில்நிலைக் கிளவிக்கு / ஆன் இடை வருதல்
      from: ezhu.247
    - text: னஃகான் றஃகான்
      from: ezhu.123
    - text: அதனோ ரற்றே
      from: ezhu.124
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: ஆன்
    transform: ன→ற
    context: நாள்_வல்லின_தொழில்
  links: []
  urai:
    iyaipu:
    - ezhu.119
    - ezhu.123
    - ezhu.247
    text: 'இயைபு (649): "அதனோ ரற்றே" — 123-க்கு மாட்டேறு. "நாள்முன்" — நாள்ப் பெயர் புணர்ச்சி உயிர்மயங்கியலிலும் (எழு. 247).'
    vagai: விலக்கு
    thunivu: நூலில் நேரடியாக
    vilakkukkuriyathu:
    - ezhu.119
- id: ezhu.125
  pindam: 1
  padalam: ezhuthu
  othu: 4
  sutra: 125
  moolam: |-
    அத்தின் அகரம் அகரமுனை யில்லை
  kaandigai:
    porul: அத்தின் அகரம் அகரத்தின் முன் இல்லை (கெடும்).
    ethu: அத்துச் சாரியையின் அகரம், அகர ஈற்றின் முன் கெடும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: அத்து
    transform: அகர_கெடுதல்
    context: அகர_முன்
  links: []
  urai:
    iyaipu:
    - ezhu.119
    - ezhu.126
    - ezhu.127
    text: 'இயைபு (649): 125, 126, 127 ஒரு தொகுதி — சாரியையின் முதல் உயிர் அதே உயிர் ஈற்றின் முன் கெடுதல் (அ முன் அ, இ முன் இ, ஐ முன் இ).'
    vagai: விலக்கு
    thunivu: நூலில் நேரடியாக
    vilakkukkuriyathu:
    - ezhu.119
- id: ezhu.126
  pindam: 1
  padalam: ezhuthu
  othu: 4
  sutra: 126
  moolam: |-
    இக்கின் இகரம் இகரமுனை யற்றே
  kaandigai:
    porul: இக்கின் இகரம் இகரத்தின் முன் அவ்வாறே.
    ethu: இக்குச் சாரியையின் இகரம், இகர ஈற்றின் முன் அவ்வாறே கெடும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: இக்கு
    transform: இகர_கெடுதல்
    context: இகர_முன்
  links: []
  urai:
    iyaipu:
    - ezhu.125
    - ezhu.127
    text: 'இயைபு (649): "யற்றே" — 125-க்கு மாட்டேறு.'
    vagai: விலக்கு
    thunivu: நூலில் நேரடியாக
    vilakkukkuriyathu:
    - ezhu.119
- id: ezhu.127
  pindam: 1
  padalam: ezhuthu
  othu: 4
  sutra: 127
  moolam: |-
    ஐயின் முன்னரும் அவ்வியல் நிலையும்
  kaandigai:
    porul: ஐயின் முன்னும் அவ்வியல்பு நிற்கும்.
    ethu: ஐ ஈற்றின் முன்னும் (இக்கின் இகரம்) அவ்வாறே கெடும்.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    context: ஐ_முன்
    refs:
    - ezhu.125
    - ezhu.126
  links: []
  urai:
    iyaipu:
    - ezhu.126
    - ezhu.54
    text: 'இயைபு (649): ஐ-யின் முன் இகரம் கெடுவது, ஐ = அ + இ ("அகர இகரம் ஐகார மாகும்", எழு. 54) என்பதோடு இயைகிறது — 126-இன் இ முன் இ. இவ்விணைப்பு நூலின் சொல் அன்று — ஒருதலை அன்மை.'
    vagai: விலக்கு
    thunivu: விதி நூலில் நேரடியாக; 54 உடனான தொடர்பு ஒருதலை அன்மை
    vilakkukkuriyathu:
    - ezhu.126
  utthi:
  - peyar: இறந்தது காத்தல்
    saanru: அவ்வியல்
- id: ezhu.128
  pindam: 1
  padalam: ezhuthu
  othu: 4
  sutra: 128
  moolam: |-
    எப்பெயர் முன்னரும் வல்லெழுத்து வருவழி
    அக்கின் இறுதிமெய்ம் மிசையொடுங் கெடுமே
    குற்றிய லுகரம் முற்றத் தோன்றாது
  kaandigai:
    porul: எப்பெயர் முன்னும் வல்லெழுத்து வருமிடத்து அக்கின் இறுதி மெய்யொடு கெடும்; குற்றியலுகரம் முழுமையாகத் தோன்றாது.
    ethu: எப்பெயர் முன்னும் வல்லெழுத்து வர, அக்குச் சாரியையின் இறுதி (குகரம்) மெய்யொடு கெடும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: அக்கு
    transform: இறுதி_மெய்_கெடுதல்
    context: வல்லெழுத்து
  links: []
  urai:
    iyaipu:
    - ezhu.119
    - ezhu.36
    - ezhu.105
    text: 'இயைபு (649): "குற்றிய லுகரம் முற்றத் தோன்றாது" — அக்குவின் ஈற்று உகரம் குற்றியலுகரம் (எழு. 36: வல்லாறு ஊர்ந்த).'
    vagai: விலக்கு
    thunivu: நூலில் நேரடியாக
    vilakkukkuriyathu:
    - ezhu.119
- id: ezhu.129
  pindam: 1
  padalam: ezhuthu
  othu: 4
  sutra: 129
  moolam: |-
    அம்மின் இறுதி கசதக் காலைத்
    தன் மெய் திரிந்து ஙஞந ஆகும்
  kaandigai:
    porul: அம்மின் இறுதி (ம்) க, ச, த வரும்போது தன் மெய் திரிந்து ங, ஞ, ந ஆகும்.
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: அம் சாரியையின் மகரம், க ச த வர ங ஞ ந ஆகும் — வருமொழியின் இனமான மெல்லினம் (எழு. 25-இன் இணைகள்).
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    entity: அம்
    transform: ம்→ங/ஞ/ந
    context:
    - க
    - ச
    - த
  links: []
  urai:
    iyaipu:
    - ezhu.119
    - ezhu.25
    - ezhu.89
    - ezhu.90
    - ezhu.93
    - ezhu.130
    text: 'இயைபு (649): க → ங, ச → ஞ, த → ந — இவை "தத்தம் இசைகள் ஒத்தன" (எழு. 25) இணைகளும், ஒரே பிறப்புடைய இணைகளும் (எழு. 89, 90, 93). ப இங்கு இல்லை — ம் ப-வின் இனமே (எழு. 97); ஆகவே திரிபு தேவையில்லை என்பது ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; ப விடுபட்டதன் காரணம் ஒருதலை அன்மை
- id: ezhu.130
  pindam: 1
  padalam: ezhuthu
  othu: 4
  sutra: 130
  moolam: |-
    மென்மையும் இடைமையும் வரூஉம் காலை
    இன்மை வேண்டும் என்மனார் புலவர்
  kaandigai:
    porul: மெல்லினமும் இடையினமும் வரும்போது (அம்மின் ம்) இல்லாமல் போதல் வேண்டும் என்பர்.
    ethu: அம்மின் மகரம், மெல்லினமும் இடையினமும் வர இல்லாமல் போகும் — குன்றல்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: அம்
    transform: ம்_நீக்கம்
    context:
    - மெல்லினம்
    - இடையினம்
  links: []
  urai:
    iyaipu:
    - ezhu.129
    - ezhu.20
    - ezhu.21
    text: 'இயைபு (649): 129-க்கு விலக்கு — வல்லினம் வர திரிபு (129), மெல்லினம் இடையினம் வர இன்மை (130). இரண்டும் சேர்ந்து மூவினத்தையும் (எழு. 19–21) அடக்குகின்றன.'
    vagai: விலக்கு
    thunivu: நூலில் நேரடியாக
    vilakkukkuriyathu:
    - ezhu.129
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்மனார்
  - peyar: ஆணை கூறல்
    saanru: வேண்டும்
- id: ezhu.131
  pindam: 1
  padalam: ezhuthu
  othu: 4
  sutra: 131
  moolam: |-
    இன்னென வரூஉம் வேற்றுமை யுருபிற்
    கின்னென் சாரியை இன்மை வேண்டும்
  kaandigai:
    porul: இன் என்ற வேற்றுமை உருபுக்கு இன் சாரியை இல்லாமை வேண்டும்.
    ethu: இன் உருபுக்கு இன் சாரியை வேண்டா — ஒரே வடிவம் இருமுறை வாராமை.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: இன்
    transform: சாரியை_விலக்கு
  links: []
  urai:
    iyaipu:
    - ezhu.113
    - ezhu.118
    - ezhu.119
    text: 'இயைபு (649): "சாரியை வருமே" (எழு. 118) என்பதற்கு விலக்கு: உருபும் சாரியையும் "இன்" என ஒரே வடிவம்.'
    vagai: விலக்கு
    thunivu: நூலில் நேரடியாக
    vilakkukkuriyathu:
    - ezhu.118
  utthi:
  - peyar: ஆணை கூறல்
    saanru: வேண்டும்
- id: ezhu.132
  pindam: 1
  padalam: ezhuthu
  othu: 4
  sutra: 132
  moolam: |-
    பெயருந் தொழிலும் பிரிந்தொருங் கிசைப்ப
    வேற்றுமை உருபு நிலைபெறு வழியுந்
    தோற்றம் வேண்டாத் தொகுதிக் கண்ணும்
    ஒட்டுதற் கொழுகிய வழக்கொடு சிவணிச்
    சொற்சிதர் மருங்கின் வழிவந்து விளங்கா
    திடைநின் றியலுஞ் சாரியை இயற்கை
    உடைமையும் இன்மையும் ஒடுவயின் ஒக்கும்
  kaandigai:
    porul: பெயரும் தொழிலும் பிரிந்தும் ஒருங்கும் ஒலிக்க, உருபு நிலைபெறுமிடத்தும் தோன்றாத தொகையிலும், வழக்கோடு பொருந்தி இடைநின்று இயலும் சாரியை — உடைமையும் இன்மையும் ஒடுவிடத்து ஒக்கும்.
    ethu: ஒடு உருபின் இடத்து, இடைநின்று இயலும் சாரியை வருதலும் வாராமையும் ஒக்கும் — வழக்கொடு சிவணி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    op: சாரியை_பங்கு
    applicable_in:
    - உருபு_நிலை
    - தொகை
    - இடைநிலை
  links:
  - ezhu.119
  - ezhu.120
  - ezhu.128
  - ezhu.129
  - ezhu.130
  urai:
    iyaipu:
    - ezhu.118
    - ezhu.113
    - ezhu.111
    text: 'இயைபு (649): "ஒட்டுதற் கொழுகிய வழக்கொடு சிவணி" — வழக்கே சான்று (எழு. 111, 483). உடைமையும் இன்மையும் ஒக்கும் — 118-க்கு விலக்காகவும் விதியாகவும்.'
    vagai: விதி-விலக்கு
    thunivu: நூலில் நேரடியாக
    vilakkukkuriyathu:
    - ezhu.118
  utthi:
  - peyar: ஒப்பக் கூறல்
    saanru: ஒக்கும்
- id: ezhu.133
  pindam: 1
  padalam: ezhuthu
  othu: 4
  sutra: 133
  moolam: |-
    அத்தே வற்றே ஆயிரு மொழிமேல்
    ஒற்றுமெய் கெடுதல் தெற்றென் றற்றே
    அவற்றுமுன் வரூஉம் வல்லெழுத்து மிகுமே
  kaandigai:
    porul: அத்து, வற்று இவற்றின் மேல் ஒற்றுமெய் கெடுதல் தெளிவு; அவற்றின் முன் வரும் வல்லெழுத்து மிகும்.
    ethu: சாரியைகளின் பட்டியலுள் அத்தும் வற்றும் உண்டு (எழு. 119). அவற்றின் மேல் ஒற்று கெடுதல் புணர்ச்சித் திரிபுகளுள் «குன்றல்» (எழு. 109); முன் வல்லெழுத்து மிகுதல் அதனுள் «மிகுதல்». சுட்டுமுதல் ஐ முன் வற்றின் வகரம் கெடுதல் (எழு. 122) இதன் ஒரு வடிவம்.
    eduthukkaattu: []
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entities:
    - அத்து
    - வற்று
    ops:
    - ஒற்றுமெய்_கெடுதல்
    - வல்லெழுத்து_மிகுதல்
  links: []
  urai:
    iyaipu:
    - ezhu.119
    - ezhu.109
    - ezhu.114
    text: 'இயைபு (649): ஒரே நூற்பாவில் இரு திரிபு — குன்றல் (ஒற்று கெடுதல்), மிகுதல் (வல்லெழுத்து மிகுதல்) (எழு. 109).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.134
  pindam: 1
  padalam: ezhuthu
  othu: 4
  sutra: 134
  moolam: |-
    காரமுங் கரமுங் கானொடு சிவணி
    நேரத் தோன்றும் எழுத்தின் சாரியை
  kaandigai:
    porul: காரம், கரம், கான் — எழுத்தின் சாரியை (எழுத்தின் பெயரைச் சொல்ல).
    ethu: 'எழுத்தின் பெயர்ச் சாரியை மூன்று: காரம், கரம், கான். நூலின் வழக்கு: "ஐகார மாகும்" (எழு. 54), "மகரம்" (எழு. 13), "னஃகான்" (எழு. 26).'
    eduthukkaattu:
    - text: ஐகார மாகும்
      from: ezhu.54
    - text: அரையளவு குறுகல் மகரம்
      from: ezhu.13
    - text: னஃகான்
      from: ezhu.26
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: எழுத்துப்பெயர்_சாரியை
    items:
    - காரம்
    - கரம்
    - கான்
  links:
  - ezhu.135
  - ezhu.136
  - ezhu.137
  urai:
    iyaipu:
    - ezhu.135
    - ezhu.136
    - ezhu.137
    - ezhu.66
    text: 'இயைபு (649): எழுத்தைத் தன் பெயரால் கூறல் (எழு. 66) இச்சாரியைகளாலே. எண் (நூலுள்): "-கரம்/-காரம்" ஏறக்குறைய 131; "கான்" எப்போதும் ஆய்தத்தொடு "ஃகான்" — 16 இடம் (னஃகான், அஃகான், மஃகான் …). எண்: மூன்று (பட்டியல்).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.135
  pindam: 1
  padalam: ezhuthu
  othu: 4
  sutra: 135
  moolam: |-
    அவற்றுள்
    கரமுங் கானும் நெட்டெழுத் திலவே
  kaandigai:
    porul: அவற்றுள் கரமும் கானும் நெட்டெழுத்துக்கு இல்லை.
    ethu: கரமும் கானும் நெட்டெழுத்துக்கு இல்லை; நெடிலுக்குக் காரம் மட்டும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    exclude:
    - கரம்
    - கான்
    context: நெட்டெழுத்து
  links: []
  urai:
    iyaipu:
    - ezhu.134
    - ezhu.4
    - ezhu.137
    text: 'இயைபு (649): நெட்டெழுத்து ஏழு (எழு. 4). எண் (நூலுள்): நெடில் + கரம் / கான் வடிவம் 0 — நூற்பாவோடு ஒத்தது. விலக்கின் விலக்கு எழு. 137.'
    vagai: விலக்கு
    thunivu: நூலில் நேரடியாக
    vilakkukkuriyathu:
    - ezhu.134
  utthi:
  - peyar: அதிகார முறை
    saanru: அவற்றுள்
- id: ezhu.136
  pindam: 1
  padalam: ezhuthu
  othu: 4
  sutra: 136
  moolam: |-
    வரன்முறை மூன்றுங் குற்றெழுத் துடைய
  kaandigai:
    porul: மூன்றும் குற்றெழுத்துக்கு உரியன.
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: எழுத்தின் சாரியை மூன்று — "காரமுங் கரமுங் கானொடு சிவணி" (எழு. 134). நெடிலுக்கு அவற்றுள் கரமும் கானும் இல்லை (எழு. 135); ஆகவே மூன்றும் வரன்முறையாக உரியது குறிலுக்கு — "ஓரள பிசைக்குங் குற்றெழுத் தென்ப" (எழு. 3). எ.கா. "அஃகான்" (எழு. 122), "றஃகான்" (எழு. 94).
    eduthukkaattu:
    - text: காரமுங் கரமுங் கானொடு சிவணி
      from: ezhu.134
    - text: ஓரள பிசைக்குங் குற்றெழுத் தென்ப
      from: ezhu.3
    - text: அஃகான்
      from: ezhu.122
    - text: றஃகான்
      from: ezhu.94
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    context: குற்றெழுத்து
    items:
    - காரம்
    - கரம்
    - கான்
  links: []
  urai:
    iyaipu:
    - ezhu.134
    - ezhu.3
    text: 'இயைபு (649): குற்றெழுத்து ஐந்து (எழு. 3). "வரன்முறை" — 134-இன் வரிசையில்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: மூன்றுங்
- id: ezhu.137
  pindam: 1
  padalam: ezhuthu
  othu: 4
  sutra: 137
  moolam: |-
    ஐகார ஔகாரங் கானொடுந் தோன்றும்
  kaandigai:
    porul: ஐகாரம், ஔகாரம் கானொடும் தோன்றும் (ஐகான், ஔகான்).
    ethu: நெடிலுக்குக் கரமும் கானும் இல்லை (எழு. 135); இது அதன் விலக்கு. ஐ, ஔ இரண்டும் இரு எழுத்தால் ஆவன — "அகர இகரம் ஐகார மாகும்" (எழு. 54), "அகர உகரம் ஔகார மாகும்" (எழு. 55) . இவ்விரு கூற்றும் இவ்விலக்கோடு இயைகின்றன; விலக்கின் காரணத்தை நூல் கூறவில்லை — ஒருதலை அன்மை.
    eduthukkaattu:
    - text: அகர இகரம் ஐகார மாகும்
      from: ezhu.54
    - text: அகர உகரம் ஔகார மாகும்
      from: ezhu.55
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    items:
    - ஐ
    - ஔ
    suffix: கான்
  links: []
  urai:
    iyaipu:
    - ezhu.135
    - ezhu.42
    - ezhu.54
    - ezhu.55
    text: 'இயைபு (649): 135-க்கு விலக்கு — நெடிலுள் ஐ, ஔ மட்டும். அவை அ + இ, அ + உ (எழு. 54, 55) என்பதும் இசைநிறை இ, உ (எழு. 42) என்பதும் இவ்விரண்டையும் தனித்துக் காட்டுகின்றன; காரணமாக நூல் கூறவில்லை. எடுத்துக்காட்டு: ஐகான், ஔகான் வடிவம் நூல் பாடத்தில் இல்லை — நூலில் இல்லை.'
    vagai: விலக்கு
    thunivu: விதி நூலில் நேரடியாக; காரணம் ஒருதலை அன்மை
    vilakkukkuriyathu:
    - ezhu.135
- id: ezhu.138
  pindam: 1
  padalam: ezhuthu
  othu: 4
  sutra: 138
  moolam: |-
    புள்ளி ஈற்றுமுன் உயிர்தனித் தியலாது
    மெய்யொடுஞ் சிவணும் அவ்வியல் கெடுத்தே
  kaandigai:
    porul: புள்ளியீற்றின் முன் உயிர் தனித்து நில்லாது; மெய்யோடு பொருந்தும் — அவ்வியல் கெட்டு (புள்ளி நீங்கி).
    ethu: 'புள்ளியீற்றின் முன் உயிர் வந்தால் தனித்து நில்லாது; மெய் புள்ளி நீங்கி உயிரோடு கூடும்: "எழுத்தோ ரன்ன" (எழு. 2 — ஓர் + அன்ன → ஓரன்ன).'
    eduthukkaattu:
    - text: எழுத்தோ ரன்ன
      from: ezhu.2
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    context: புள்ளியீறு
    transform: உயிர்_மெய்யொடு_சிவணல்
    op: புள்ளி_நீக்கம்
  links:
  - ezhu.104
  urai:
    iyaipu:
    - ezhu.104
    - ezhu.139
    - ezhu.17
    text: 'இயைபு (649): 104 (மெய்யீறு புள்ளியொடு) — 138 (உயிர் வர புள்ளி நீங்கும்) — 139 (உயிர் நீங்கப் புள்ளி மீளும்) — ஒன்றன் மறுதலை மற்றொன்று. எண் (நூலுள்): "ரன்ன" வடிவம் மட்டும் 16 இடம் (ஏறக்குறைய).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: இறந்தது காத்தல்
    saanru: அவ்வியல்
- id: ezhu.139
  pindam: 1
  padalam: ezhuthu
  othu: 4
  sutra: 139
  moolam: |-
    மெய்உயிர் நீங்கின் தன்னுரு வாகும்
  kaandigai:
    porul: மெய்யை விட்டு உயிர் நீங்கினால் (மெய்) தன் உருவாகும் (புள்ளி பெறும்).
    ethu: 'மெய்யிலிருந்து உயிர் நீங்கினால் மெய் தன் உருவை (புள்ளி) பெறும்: "எழுத்தெனப்" (எழு. 1) — எழுத்து-வின் குற்றியலுகரம் நீங்க த், பின் எ-யோடு கூடுகிறது (எழு. 105, 138).'
    eduthukkaattu:
    - text: எழுத்தெனப்
      from: ezhu.1
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    op: உயிர்_நீக்கம்
    effect: மெய்_தன்_உரு
  links: []
  urai:
    iyaipu:
    - ezhu.138
    - ezhu.105
    - ezhu.15
    text: 'இயைபு (649): 138-இன் மறுதலை; குற்றியலுகரப் புணர்ச்சியின் அடிப்படை (எழு. 105).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.140
  pindam: 1
  padalam: ezhuthu
  othu: 4
  sutra: 140
  moolam: |-
    எல்லா மொழிக்கும் உயிர்வரு வழியே
    உடம்படு மெய்யின் உருவுகொளல் வரையார்
  kaandigai:
    porul: எல்லா மொழிக்கும் உயிர் வருமிடத்து உடம்படுமெய் உருவு கொள்ளலை விலக்கார் (ய், வ்).
    ethu: 'உயிரீற்றின் முன் உயிர் வர இடையில் உடம்படுமெய் (ய், வ்) தோன்றலை விலக்கார்: "கூட்டி யெழூஉதல்" (எழு. 6), "யாவென் சினைமிசை யுரையசைக்" (எழு. 34), "ய வ வுந் தோன்றும்" (எழு. 24 — வ + உம்).'
    eduthukkaattu:
    - text: கூட்டி யெழூஉதல்
      from: ezhu.6
    - text: யுரையசைக்
      from: ezhu.34
    - text: ய வ வுந் தோன்றும்
      from: ezhu.24
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    op: உடம்படுமெய்
    letters:
    - ய்
    - வ்
    context: உயிர்_வரவு
  links: []
  urai:
    iyaipu:
    - ezhu.106
    - ezhu.107
    - ezhu.65
    - ezhu.99
    text: 'இயைபு (649): 107-இன் உயிர் + உயிர் வகை. எழுத்ததிகாரப் பாடத்தில் ய, வ முதலாகத் தோன்றும் துண்டுகள் ஏறக்குறைய 107 — எழுத்துப் பெயர்கள் (யகரம், யஃகான்) நீங்கலாக இவை உடம்படுமெய்; ஆகவே அவை மொழிமுதல் விதிக்கு (எழு. 65) மாறல்ல. யகரப் பிறப்பு எழு. 99. எந்த உயிர்க்குப் பின் ய், எதற்குப் பின் வ் என நூல் பகுக்கவில்லை — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; ய்/வ் பகுப்பு ஒருதலை அன்மை
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: வரையார்
- id: ezhu.141
  pindam: 1
  padalam: ezhuthu
  othu: 4
  sutra: 141
  moolam: |-
    எழுத்தோ ரன்ன பொருள்தெரி புணர்ச்சி
    இசையில் திரிதல் நிலைஇய பண்பே
  kaandigai:
    porul: எழுத்து ஒப்ப இருந்தும் பொருள் தெரியும் புணர்ச்சி இசையால் வேறுபடுதல் நிலைத்த பண்பு.
    ethu: எழுத்தில் ஒத்திருந்தும் பொருள் வேறுபடும் புணர்ச்சிகள் இசையால் (ஒலிப்பால்) வேறுபடும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    op: இசை_வேறுபாடு
    property: பொருள்_தெரிபு
  links: []
  urai:
    iyaipu:
    - ezhu.142
    - ezhu.53
    text: 'இயைபு (649): "மொழிப்படுத் திசைப்பினுந் தெரிந்துவே றிசைப்பினும் / எழுத்தியல் திரியா" (எழு. 53) — எழுத்து திரியாமல் இசையே வேறுபடுகிறது. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.142
  pindam: 1
  padalam: ezhuthu
  othu: 4
  sutra: 142
  moolam: |-
    அவைதாம்
    முன்னப் பொருள புணர்ச்சி வாயின்
    இன்ன என்னும் எழுத்துக்கடன் இலவே
  kaandigai:
    porul: அவை முன்னத்தால் பொருள் கொள்ளும் புணர்ச்சி; "இன்ன என்னும் எழுத்துக்கடன்" அவற்றுக்கு இல்லை.
    ethu: முன் சூத்திரம் கூறியது "எழுத்தோ ரன்ன பொருள்தெரி புணர்ச்சி" (எழு. 141) — இசையால் பொருள் தெரியும் புணர்ச்சி. அதற்கு எழுத்து விதி கட்டாயம் இல்லை; ஏனெனில் புணர்ச்சியின் நான்கு நிலையும் (எழு. 108) எழுத்தின் இயைபைக் கொண்டவை, இவை இசையைக் கொண்டவை.
    eduthukkaattu:
    - text: எழுத்தோ ரன்ன பொருள்தெரி புணர்ச்சி
      from: ezhu.141
  nilai: ஒருதலை அன்மை
  kanini:
    kind: exception
    op: முன்ன_பொருள்_புணர்ச்சி
    exclude: எழுத்துக்கடன்
    othu_end: true
  links:
  - ezhu.141
  urai:
    iyaipu:
    - ezhu.141
    - ezhu.108
    - ezhu.109
    text: 'இயைபு (649): 141-இன் புணர்ச்சிகளுக்கு எழுத்து விதி (108, 109) கட்டாயம் இல்லை — புணரியலின் இறுதிப் புறனடை. "முன்னப் பொருள" — முன்னம் எதனைக் குறிக்கும் என நூல் இங்கு விரிக்கவில்லை — ஒருதலை அன்மை.'
    vagai: விலக்கு
    thunivu: விதி நூலில் நேரடியாக; "முன்னம்" பொருள் ஒருதலை அன்மை
    vilakkukkuriyathu:
    - ezhu.108
    - ezhu.109
  utthi:
  - peyar: அதிகார முறை
    saanru: அவைதாம்
