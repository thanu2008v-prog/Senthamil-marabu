# இக்கோப்பு data_v2-இலிருந்து உருவானது. 'moolam' (சூத்திரம்) திருத்தக் கூடாது (பொருள். 652).
- id: ezhu.103
  pindam: 1
  padalam: ezhuthu
  othu: 4
  sutra: 103
  moolam: |-
    மூன்றுதலை யிட்ட முப்பதிற் றெழுத்தின்
    இரண்டுதலை யிட்ட முதலா கிருபஃது
    அறுநான் கீற்றொடு நெறிநின் றியலும்
    எல்லா மொழிக்கும் இறுதியும் முதலும்
    மெய்யே உயிரென்று ஆயீ ரியல
  kaandigai:
    porul: '"மூன்று தலையிட்ட முப்பது" எழுத்தில் (33), "இரண்டு தலையிட்ட இருபஃது" (22) மொழிமுதலாகும், "அறுநான்கு" (24) ஈறாகும்; எல்லா மொழிக்கும் முதலும் இறுதியும் மெய், உயிர் என இருவகை. 33 என்பது எழு. 1 + 2 கூட்டலோடு ஒத்தது. 22 = உயிர் 12 + மெய் 9 (61–65) + நுந்தையின் குற்றியலுகரம் (67); 24 = உயிர் 12 (69–70) + புள்ளி 11 (78) + குற்றியலுகரம் (105) — இவ்விரு பிரிப்பையும் நூல் தானே கூறவில்லை (ஒருதலை அன்மை).'
    en:
      kooruvathu: 33
      enniyathu: 33
    ethu: 'புணர்ச்சிக்கு முன் நிலைமொழி ஈறும் வருமொழி முதலும் எத்தனை என்று தொகுக்கிறது; ஏனெனில் புணர்ச்சி அவ்விரண்டின் இயைபே: "நிறுத்த சொல்லின் ஈறா கெழுத்தொடு / குறித்துவரு கிளவி முதலெழுத் தியையப்" (எழு. 108). "மூன்றுதலை யிட்ட முப்பதிற் றெழுத்தின்" — எழு. 1-இன் முப்பதும் எழு. 2-இன் மூன்றும்.'
    eduthukkaattu:
    - text: நிறுத்த சொல்லின் ஈறா கெழுத்தொடு / குறித்துவரு கிளவி முதலெழுத் தியையப்
      from: ezhu.108
    - text: மூன்றுதலை யிட்ட முப்பதிற் றெழுத்தின்
      from: ezhu.103
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    totals:
      all: 33
      head: 22
      tail: 24
    bifurcation: மெய்/உயிர்
  links:
  - ezhu.1
  - ezhu.2
  - ezhu.67
  - ezhu.78
  - ezhu.104
  - ezhu.105
  urai:
    iyaipu:
    - ezhu.1
    text: 'புணரியலின் நுதலியது. 33 = எழு. 1 (30) + 2 (3); 22 மொழிமுதல், 24 ஈறு. எல்லா மொழிக்கும் முதலும் இறுதியும் மெய், உயிர் என இரண்டே — இதுவே 107-இன் நான்கு வகைப் புணர்ச்சிக்கு அடிப்படை. ஐயம்: 22, 24 எவை என்ற பட்டியல் நூலில் இல்லை — ஒருதலை அன்மை — நூலின் எண்ணால் சான்று.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக; உரை சுட்டிய ஐயம் ஒருதலை அன்மை
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: மூன்றுதலை
- id: ezhu.104
  pindam: 1
  padalam: ezhuthu
  othu: 4
  sutra: 104
  moolam: |-
    அவற்றுள்
    மெய்யீ றெல்லாம் புள்ளியொடு நிலையல்
  kaandigai:
    porul: அவற்றுள் மெய்யீறு எல்லாம் புள்ளியோடு நிற்கும்.
    ethu: மெய்யீறு எழுதும்போதும் புணரும்போதும் புள்ளியொடு நிற்கும்; புள்ளியிறுதி பதினொன்று (எழு. 78).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: மெய்யீறு
    attribute: புள்ளி
  links: []
  urai:
    iyaipu:
    - ezhu.78
    - ezhu.15
    - ezhu.138
    - ezhu.139
    text: 'இயைபு (649): மெய்யின் புள்ளி — எழு. 15; புள்ளியிறுதி பதினொன்று (எழு. 78); புள்ளியீற்றின் முன் உயிர் வந்தால் "மெய்யொடுஞ் சிவணும் அவ்வியல் கெடுத்தே" (எழு. 138).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: அதிகார முறை
    saanru: அவற்றுள்
- id: ezhu.105
  pindam: 1
  padalam: ezhuthu
  othu: 4
  sutra: 105
  moolam: |-
    குற்றிய லுகரமும் அற்றென மொழிப
  kaandigai:
    porul: குற்றியலுகர ஈறும் அவ்வாறே (மெய்யீறு போல்) என்பர்.
    ethu: 'குற்றியலுகர ஈறு புணர்ச்சியில் மெய்யீறு போல் நடக்கும்: உயிர் வந்தால் உகரம் நீங்கி மெய் உயிரோடு கூடும். நூலின் முதல் நூற்பாவிலேயே: "முப்பஃ தென்ப" (எழு. 1) — முப்பஃது + என்ப.'
    eduthukkaattu:
    - text: முப்பஃ தென்ப
      from: ezhu.1
    - text: எழுத்தெனப்
      from: ezhu.1
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: குற்றியலுகரம்
    attribute: மெய்யீறு_இயல்பு
  links: []
  urai:
    iyaipu:
    - ezhu.104
    - ezhu.36
    - ezhu.139
    - ezhu.406
    text: 'இயைபு (649): குற்றியலுகரம் சார்பெழுத்து (எழு. 2, 36); இதன் புணர்ச்சி விரிவு குற்றியலுகரப் புணரியல் (எழு. 406–483). "அற்றென மொழிப" — 104-க்கு மாட்டேறு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
- id: ezhu.106
  pindam: 1
  padalam: ezhuthu
  othu: 4
  sutra: 106
  moolam: |-
    உயிர்மெய் ஈறும் உயிரீற் றியற்றே
  kaandigai:
    porul: உயிர்மெய் ஈறு உயிரீற்றின் இயல்பினது.
    ethu: 'உயிர்மெய் ஈறு, அதன் உயிரின் இயல்பையே புணர்ச்சியில் பெறும்; ஆகவே உயிர் வந்தால் உடம்படுமெய் (எழு. 140): "கூட்டி யெழூஉதல்" (எழு. 6) — கூட்டி + எழூஉதல்.'
    eduthukkaattu:
    - text: கூட்டி யெழூஉதல்
      from: ezhu.6
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: உயிர்மெய்யீறு
    inherits: உயிர்_இயல்பு
  links: []
  urai:
    iyaipu:
    - ezhu.10
    - ezhu.17
    - ezhu.140
    - ezhu.107
    text: 'இயைபு (649): உயிர்மெய்யின் அளவு உயிரின் அளவே — "மெய்யோ டியையினும் உயிரியல் திரியா" (எழு. 10); உயிர்மெய்யின் உருவு எழு. 17. உயிர்மெய் ஈறும் உயிரீறும் ஒரே வகை என்பதால், 107-இன் நான்கு வகைக்கு மேல் ஐந்தாம் வகை தேவையில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.107
  pindam: 1
  padalam: ezhuthu
  othu: 4
  sutra: 107
  moolam: |-
    உயிரிறு சொல்முன் உயிர்வரு வழியும்
    உயிரிறு சொல்முன் மெய்வரு வழியும்
    மெய்யிறு சொல்முன் உயிர்வரு வழியும்
    மெய்யிறு சொல்முன் மெய்வரு வழியுமென்று
    இவ்வென அறியக் கிளக்குங் காலை
    நிறுத்த சொல்லே குறித்துவரு கிளவியென்று
    ஆயீ ரியல புணர்நிலைச் சுட்டே
  kaandigai:
    porul: 'புணர்ச்சி நான்கு வகை: உயிரீற்றின் முன் உயிர், உயிரீற்றின் முன் மெய், மெய்யீற்றின் முன் உயிர், மெய்யீற்றின் முன் மெய். நிறுத்த சொல் (நிலைமொழி), குறித்துவரு கிளவி (வருமொழி) என இருவகை.'
    en:
      kooruvathu: 4
      enniyathu: 4
    ethu: 'நான்கு வகையும் நூலின் சொந்த வடிவங்களில்: உயிர் + உயிர் "கூட்டி யெழூஉதல்" (எழு. 6); உயிர் + மெய் "அவைதாம்" (எழு. 2); மெய் + உயிர் "எழுத்தோ ரன்ன" (எழு. 2 — ஓர் + அன்ன); மெய் + மெய் "எனும்புள்ளி" (எழு. 25 — எனும் + புள்ளி).'
    eduthukkaattu:
    - text: கூட்டி யெழூஉதல்
      from: ezhu.6
    - text: அவைதாம்
      from: ezhu.2
    - text: எழுத்தோ ரன்ன
      from: ezhu.2
    - text: எனும்புள்ளி
      from: ezhu.25
