  urai:
    iyaipu:
    - ezhu.103
    - ezhu.104
    - ezhu.105
    - ezhu.106
    - ezhu.108
    text: 'இயைபு (649): "மெய்யே உயிரென்று ஆயீ ரியல" (எழு. 103) — முதலும் இறுதியும் இரண்டு வகை என்பதால் 2 × 2 = 4 வகைப் புணர்ச்சி; குற்றியலுகர ஈறு மெய்யீற்றில் (105), உயிர்மெய் ஈறு உயிரீற்றில் (106) அடங்குவதால் நான்கே. "நிறுத்த சொல்லே குறித்துவரு கிளவி" — இரு சொல்; பின்வரும் எல்லா விதியும் இவ்விரு பெயராலேயே பேசுகின்றன (எழு. 108, 110). எண்: நான்கு (நூற்பா) = நான்கு (பட்டியல்).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: மொழிவாம் என்றல்
    saanru: கிளக்குங் காலை
- id: ezhu.108
  pindam: 1
  padalam: ezhuthu
  othu: 4
  sutra: 108
  moolam: |-
    அவற்றுள்
    நிறுத்த சொல்லின் ஈறா கெழுத்தொடு
    குறித்துவரு கிளவி முதலெழுத் தியையப்
    பெயரொடு பெயரைப் புணர்க்குங் காலும்
    பெயரொடு தொழிலைப் புணர்க்குங் காலும்
    தொழிலொடு பெயரைப் புணர்க்குங் காலும்
    தொழிலொடு தொழிலைப் புணர்க்குங் காலும்
    மூன்றே திரிபிடன் ஒன்றே இயல்பென
    ஆங்கந் நான்கே மொழிபுணர் இயல்பே
  kaandigai:
    porul: நிலைமொழி ஈற்றும் வருமொழி முதலும் இயைய — பெயரொடு பெயர், பெயரொடு தொழில், தொழிலொடு பெயர், தொழிலொடு தொழில் புணரும்போது — மூன்று திரிபும் ஒன்று இயல்பும் என நான்கே மொழிபுணர் இயல்பு.
    ethu: பெயர், தொழில் என்ற இருவகைச் சொல்லின் இணைவு நான்கு; ஒவ்வொன்றிலும் புணர்ச்சி திரிபு மூன்றும் இயல்பு ஒன்றுமாக நான்கு நிலை.
  nilai: நூலில் நேரடியாக
  kanini:
