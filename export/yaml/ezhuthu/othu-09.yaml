  kaandigai:
    porul: மூன்றின் ஒற்று வந்த எழுத்தோடு ஒக்கும்.
    ethu: 446 அளவு/நிறை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: மூன்று
    op: வந்ததொக்கும்
  links:
  - ezhu.441
  urai:
    iyaipu:
    - ezhu.446
    - ezhu.441
    text: 'இயைபு (649): 446 அளவு/நிறை; 441 மூன்றன் ஒற்று. "முக்கோல்" (பொருள். 615) அளவுப் பெயர் அன்று. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.448
  pindam: 1
