  sutra: 448
  moolam: |-
    ஐந்த னொற்றே மெல்லெழுத் தாகும்
  kaandigai:
    porul: ஐந்தின் ஒற்று மெல்லெழுத்தாகும்.
    ethu: 447 மூன்றன் ஒற்று என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
