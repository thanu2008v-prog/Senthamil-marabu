    text: 'இயைபு (649): 447 மூன்றன் ஒற்று; 443 ஐந்தன் ஒற்று → ம. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.449
  pindam: 1
  padalam: ezhuthu
