    - ezhu.469
    text: 'இயைபு (649): 457 மூன்று; 469 ஆறு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.459
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 459
  moolam: |-
    ஒன்பா னிறுதி உருபுநிலை திரியா
    தின்பெறல் வேண்டுஞ் சாரியை மொழியே
  kaandigai:
    porul: ஒன்பதின் இறுதி உருபு நிலை திரியாமல் இன் சாரியை பெற வேண்டும்.
    ethu: 458 ஆறு என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: ஒன்பது
    suffix: இன்
    property: உருபு_நிலை_திரியா
  links: []
  urai:
    iyaipu:
    - ezhu.458
    - ezhu.419
    - ezhu.470
    text: 'இயைபு (649): 458 ஆறு; 419 எண் உருபியல்; 470 ஒன்பான் இன். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.460
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 460
  moolam: |-
    நூறுமுன் வரினுங் கூறிய இயல்பே
  kaandigai:
    porul: நூறு முன் வந்தாலும் கூறிய இயல்பே.
    ethu: 433–459 எண் இயல்கள்; நூறு முன் வரினும் கூறிய இயல்பே (அவையே).
    eduthukkaattu:
    - text: அறுநூற்று
      from: porul.357
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    context: நூறு_முன்
    analogy: ezhu.459
  links: []
  urai:
    iyaipu:
    - ezhu.440
    - ezhu.461
    - ezhu.463
    text: 'இயைபு (649): 440 ஆறு நெடுமுதல் குறுகும் — நூறு முன்னும் அவ்வியல்பு; 461–463 விரிவு. எடுத்துக்காட்டு: “அறுநூற்று” (பொருள். 357) — ஆறு + நூறு → அறுநூறு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: கூறிற்று என்றல்
    saanru: கூறிய
- id: ezhu.461
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 461
  moolam: |-
    மூன்ற னொற்றே நகார மாகும்
  kaandigai:
    porul: (நூறின் முன்) மூன்றின் ஒற்று நகாரமாகும்.
    ethu: 460 நூறு என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: மூன்று
    context: நூறு
    transform: ஒற்று→ந
  links: []
  urai:
    iyaipu:
    - ezhu.460
    - ezhu.441
    - ezhu.462
    text: 'இயைபு (649): 460 நூறு முன்; 462 நான்கும் ஐந்தும் திரியா. "முந்நீர்" (பொருள். 37) நூறு முன் அன்று. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.462
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 462
  moolam: |-
    நான்கும் ஐந்தும் ஒற்றுமெய் திரியா
  kaandigai:
    porul: நான்கும் ஐந்தும் ஒற்று மெய் திரியா.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 461 மூன்றன் ஒற்று ந என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entities:
    - 4
    - 5
    property: ஒற்று_மெய்_திரியா
  links: []
  urai:
    iyaipu:
    - ezhu.461
    - ezhu.442
    - ezhu.443
    text: 'இயைபு (649): 461 மூன்று → ந; 442 நான்கு → ற; 443 ஐந்து → ம. 462 அவற்றுக்கு விலக்கு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விலக்கு
    vilakkukkuriyathu:
    - ezhu.461
    thunivu: நூலில் நேரடியாக
- id: ezhu.463
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 463
  moolam: |-
    ஒன்பான் முதனிலை முந்துகிளந் தற்றே
    முந்தை யொற்றே னகாரம் இரட்டும்
    நூறென் கிளவி நகார மெய்கெட
    ஊஆ வாகும் இயற்கைத் தென்ப
    ஆயிடை வருதல் இகார ரகாரம்
    ஈறுமெய் கெடுத்து மகர மொற்றும்
  kaandigai:
    porul: 'ஒன்பது நூறோடு: முதல் நிலை 445-இல் கூறியபடி; முந்தை ஒற்று னகாரம் இரட்டும்; நூறின் நகர மெய் கெட ஊ ஆ ஆகும்; இடையில் இகாரமும் ரகாரமும் வரும்; ஈற்று மெய் கெடுத்து மகரம் ஒற்றும். படிகள் நூலில் நேரடியாக; இறுதி வடிவம் நூலில் எழுதப்படவில்லை (ஒருதலை அன்மை: "னகாரம் இரட்டும்" என்பதற்கும் வழக்கு வடிவத்துக்கும் இடையிலான உறவு தீர்வில்லை).'
    en:
      kooruvathu: 6
      enniyathu: 6
    ethu: 461–462 எண்கள் என்றது; ஒன்பான் முதனிலை முந்துகிளந்தற்றே; முந்தை ஒற்றே னகாரம் இரட்டும்; நூறு நகாரமெய்கெட ஊஆவாகும்; ஆயிடை வருதல் இகார ரகாரம் ஈறுமெய் கெடுத்து மகரம் ஒற்றும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: ஒன்பது+நூறு
    steps: 6
    steps_desc:
    - முதனிலை_445
    - ண_இரட்டல்
    - நகர_கெடு
    - ஊ→ஆ
    - இகர_ரகர_இடை
    - மகர_ஒற்று
  links: []
  urai:
    iyaipu:
    - ezhu.461
    - ezhu.462
    - ezhu.445
    - ezhu.471
    text: 'இயைபு (649): 445 பத்து முன் ஒன்பான்; 461 மூன்று. புணர்ந்த வடிவம் நூலுள் காணவில்லை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.464
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 464
  moolam: |-
    ஆயிரக் கிளவி வரூஉங் காலை
    முதலீ ரெண்ணின் உகரங் கெடுமே
  kaandigai:
    porul: ஆயிரம் வரும்போது முதல் இரண்டு எண்ணின் உகரம் கெடும்.
    ethu: 463 நூறு என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: எண்_1_2
    context: ஆயிரம்
    op: உகர_கெடு
  links: []
  urai:
    iyaipu:
    - ezhu.463
    - ezhu.435
    - ezhu.465
    text: 'இயைபு (649): 463 நூறு; 435 ஆயிரம். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.465
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 465
  moolam: |-
    முதனிலை நீடினும் மான மில்லை
  kaandigai:
    porul: முதல் நிலை நீண்டாலும் குற்றமில்லை.
    ethu: 464 உகரம் கெடும் என்றது; முதனிலை நீடினும் மானம் (வரைநிலை) இல்லை.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    property: முதனிலை_நீடு_குற்றமில்லை
  links: []
  urai:
    iyaipu:
    - ezhu.464
    - ezhu.436
    text: 'இயைபு (649): 464 உகரம்; 436 இன் சாரியை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி-விலக்கு
    thunivu: நூலில் நேரடியாக
    vilakkukkuriyathu:
    - ezhu.464
- id: ezhu.466
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 466
  moolam: |-
    மூன்ற னொற்றே வகார மாகும்
  kaandigai:
    porul: (ஆயிரத்தின் முன்) மூன்றின் ஒற்று வகாரமாகும்.
    ethu: 464 ஆயிரம் வரும் முடிபு சொன்னது; ஆயிரம் வரும்போது மூன்றன் ஒற்று வகாரமாகும் (452-இல் அளவு/நிறை முன் வகரம் வருவழிச் சொன்னதன் வேறிடம்).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: மூன்று
    context: ஆயிரம்
    transform: ஒற்று→வ
  links: []
  urai:
    iyaipu:
    - ezhu.464
    - ezhu.452
    text: 'இயைபு (649): 456 வகர இயற்கை; 452 வகரம்; 461 மூன்று → ந. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.467
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 467
  moolam: |-
    நான்க னொற்றே லகார மாகும்
  kaandigai:
    porul: (ஆயிரம் வரும் இடத்து — 464 "ஆயிரக் கிளவி வரூஉங் காலை" தொடர்ச்சி) நான்கின் ஒற்று லகாரமாகும். இதே நூற்பா 453-இலும் வருகிறது.
    ethu: ஆயிரம் வரும்போது (464) நான்கன் ஒற்று லகாரமாகும் — அளவு/நிறை முன்னும் அவ்வாறே (453).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: நான்கு
    context: ஆயிரம்
    transform: ஒற்று→ல
  links: []
  urai:
    iyaipu:
    - ezhu.464
    - ezhu.453
    text: 'இயைபு (649): 453 நான்கு → ல; 442 நான்கு → ற. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.468
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 468
  moolam: |-
    ஐந்த னொற்றே யகார மாகும்
  kaandigai:
    porul: ஐந்தின் ஒற்று யகாரமாகும்.
    ethu: ஆயிரம் வரும்போது (464) ஐந்தன் ஒற்று யகாரமாகும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: ஐந்து
    transform: ஒற்று→ய
  links: []
  urai:
    iyaipu:
    - ezhu.464
    - ezhu.454
    text: 'இயைபு (649): 454 ஐந்து → முந்தை கெடும்; 466 மூன்று → வ; 467 நான்கு → ல. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.469
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 469
  moolam: |-
    ஆறன் மருங்கிற் குற்றிய லுகரம்
    ஈறுமெய் ஒழியக் கெடுதல் வேண்டும்
  kaandigai:
    porul: ஆறின் குற்றியலுகரம் ஈற்று மெய் ஒழியக் கெட வேண்டும்.
    ethu: ஆயிரம் வரும்போது (464) ஆறன் குற்றியலுகரம் ஈற்று மெய் ஒழியக் கெடும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: ஆறு
    op: குற்றியலுகர_கெடு
    exception: மெய்
  links: []
  urai:
    iyaipu:
    - ezhu.464
    - ezhu.458
    text: 'இயைபு (649): 458 ஆறு முதல்நீடும்; 468 ஐந்து. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஆணை கூறல்
    saanru: வேண்டும்
- id: ezhu.470
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 470
  moolam: |-
    ஒன்பா னிறுதி உருபுநிலை திரியா
    தின்பெறல் வேண்டுஞ் சாரியை மரபே
  kaandigai:
    porul: ஒன்பதின் இறுதி உருபு நிலை திரியாமல் இன் சாரியை பெறுதல் மரபு (459-இன் இணை).
    ethu: ஆயிரம் வரும்போது ஒன்பான் இறுதி உருபுநிலை திரியாது இன் சாரியை பெறும் — 459-இல் அளவு முன் சொன்னதே இங்கும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: ஒன்பது
    suffix: இன்
    analogy: ezhu.459
  links: []
  urai:
    iyaipu:
    - ezhu.459
    - ezhu.464
    text: 'இயைபு (649): 459 ஒன்பான்; 469 ஆறு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.471
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 471
  moolam: |-
    நூறா யிரமுன் வரூஉங் காலை
    நூற னியற்கை முதனிலைக் கிளவி
  kaandigai:
    porul: நூறாயிரம் முன் வரும்போது முதல் நிலைச் சொல் நூறின் இயல்பினது.
    ethu: 460 நூறு என்றது; நூறாயிரம் முன் வரூஉங்காலை நூறன் இயற்கை முதனிலைக் கிளவி (நூறு மாறாது).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    context: நூறாயிரம்
    property: நூறன்_இயல்பு
  links: []
  urai:
    iyaipu:
    - ezhu.460
    - ezhu.464
    text: 'இயைபு (649): 460 நூறு முன்; 464 ஆயிரம். "நூறா யிரமுன்" நூற்பாவின் சொல்லே. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.472
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 472
  moolam: |-
    நூறென் கிளவி ஒன்றுமுத லொன்பாற்
    கீறுசினை யொழிய இனவொற்று மிகுமே
  kaandigai:
    porul: '"நூறு" ஒன்று முதல் ஒன்பதோடு: ஈற்றுச் சினை ஒழிய இன ஒற்று மிகும்.'
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 471 நூறாயிரம் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: நூறு
    context: எண்_1_9
    ops:
    - ஈற்றுச்சினை_ஒழி
    - இன_ஒற்று_மிகு
  links: []
  urai:
    iyaipu:
    - ezhu.471
    - ezhu.433
    text: 'இயைபு (649): 471 நூறாயிரம்; 433 பத்தன் முன். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.473
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 473
  moolam: |-
    அவையூர் பத்தினும் அத்தொழிற் றாகும்
  kaandigai:
    porul: அவை ஊர்ந்த பத்திலும் அத்தொழிலதாகும்.
    ethu: 472 நூறு என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: நூறு
    context: பத்து
    property: அத்தொழில்
  links: []
  urai:
    iyaipu:
    - ezhu.472
    - ezhu.415
    text: 'இயைபு (649): 472 நூறு; 415 மரப்பெயர் அம். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.474
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 474
  moolam: |-
    அளவும் நிறையும் ஆயியல் திரியாது
    குற்றிய லுகரமும் வல்லெழுத் தியற்கையும்
    முற்கிளந் தன்ன என்மனார் புலவர்
  kaandigai:
    porul: அளவும் நிறையும் அவ்வியல் திரியா; குற்றியலுகரமும் வல்லெழுத்து இயல்பும் முன் கூறியபடி.
    ethu: 473 அவையூர் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    classes:
    - அளவு
    - நிறை
    - குற்றியலுகரம்
    - வல்லினம்
    analogy: ezhu.433
  links: []
  urai:
    iyaipu:
    - ezhu.473
    - ezhu.436
    - ezhu.477
    text: 'இயைபு (649): 473 அவையூர்; 436 இன் சாரியை; 477 மீள். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒப்பக் கூறல்
    saanru: ஆயியல்
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்மனார்
  - peyar: முடிந்தது காட்டல்
    saanru: முற்கிளந்
- id: ezhu.475
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 475
  moolam: |-
    ஒன்றுமுத லாகிய பத்தூர் கிளவி
    ஒன்றுமுத லொன்பாற் கொற்றிடை மிகுமே
    நின்ற ஆய்தங் கெடுதல் வேண்டும்
  kaandigai:
    porul: ஒன்று முதலான பத்து ஊர்ந்த சொல் ஒன்று முதல் ஒன்பதோடு ஒற்று இடை மிகும்; நின்ற ஆய்தம் கெட வேண்டும்.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 474 அளவு/நிறை என்றது; இது அதன் தொடர்ச்சி.
    eduthukkaattu:
    - text: முப்பத்திரு
      from: porul.644
    - text: இருபத்தைந்து
      from: porul.357
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: பத்து_ஊர்ந்த
    context: எண்_1_9
    ops:
    - ஒற்று_இடைமிகு
    - ஆய்த_கெடு
  links: []
  urai:
    iyaipu:
    - ezhu.474
    - ezhu.433
    text: 'இயைபு (649): 474 அளவு/நிறை; 433 பத்தன் முன். எடுத்துக்காட்டு: “முப்பத்திரு” (பொருள். 644), “இருபத்தைந்து” (பொருள். 357) — பத்தூர் கிளவி + இரண்டு/ஐந்து — ஆய்தம் கெட்டு ஒற்று மிகுந்தது.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஆணை கூறல்
    saanru: வேண்டும்
- id: ezhu.476
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 476
  moolam: |-
    ஆயிரம் வரினே இன்னென் சாரியை
    ஆவயி னொற்றிடை மிகுத லில்லை
  kaandigai:
    porul: ஆயிரம் வந்தால் இன் சாரியை; அவ்விடத்து ஒற்று இடை மிகுதல் இல்லை.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 475 பத்தூர் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: ஆயிரம்
    suffix: இன்
    property: ஒற்று_இடைமிகுதல்_இல்லை
  links: []
  urai:
    iyaipu:
    - ezhu.475
    - ezhu.436
    - ezhu.435
    text: 'இயைபு (649): 475 பத்தூர்; 436 இன் சாரியை; 435 ஆயிரம். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.477
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 477
  moolam: |-
    அளவும் நிறையும் ஆயியல் திரியா
  kaandigai:
    porul: அளவும் நிறையும் அவ்வியல் திரியா (474-இன் இணை).
    ethu: 476 இன் சாரியை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    classes:
    - அளவு
    - நிறை
    analogy: ezhu.474
  links: []
  urai:
    iyaipu:
    - ezhu.476
    - ezhu.474
    text: 'இயைபு (649): 476 இன் சாரியை; 474 மீள் விதி. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒப்பக் கூறல்
    saanru: ஆயியல்
- id: ezhu.478
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 478
  moolam: |-
    முதனிலை எண்ணின்முன் வல்லெழுத்து வரினும்
    ஞநமந் தோன்றினும் யவவந் தியையினும்
    முதனிலை யியற்கை என்மனார் புலவர்
  kaandigai:
    porul: முதல் நிலை எண் முன் வல்லெழுத்து, ஞ ந ம, ய வ வந்தாலும் முதல் நிலை இயல்பு.
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: 477 அளவு/நிறை என்றது; இது அதன் தொடர்ச்சி.
    eduthukkaattu:
    - text: ஒருபெயர்
      from: ezhu.179
    - text: இருபெயர்த்
      from: ezhu.223
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: முதனிலை_எண்
    contexts:
    - வல்லினம்
    - ஞ
    - ந
    - ம
    - ய
    - வ
    property: இயல்பு
  links: []
  urai:
    iyaipu:
    - ezhu.477
    - ezhu.427
    text: 'இயைபு (649): 477 அளவு/நிறை; 427 யாவினா. எடுத்துக்காட்டு: “ஒருபெயர்” (எழு. 179), “இருபெயர்த்” (எழு. 223) — முதனிலை எண் + வல்லெழுத்து — இயற்கை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்மனார்
- id: ezhu.479
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 479
  moolam: |-
    அதனிலை உயிர்க்கும் யாவரு காலை
    முதனிலை ஒகரம் ஓவா கும்மே
    ரகரத் துகரந் துவரக் கெடுமே
  kaandigai:
    porul: அதன் நிலை உயிர்க்கும் யா வரும்போதும், முதல் நிலை ஒகரம் ஓ ஆகும்; ரகரத்து உகரம் முழுதும் கெடும்.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 478 முதனிலை என்றது; இது அதன் தொடர்ச்சி.
    eduthukkaattu:
    - text: ஓரெழுத் தின்றே
      from: ezhu.5
    - text: ஈரெழுத்
      from: ezhu.45
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: முதனிலை_ஒகரம்
    context: யா
    ops:
    - ஒ→ஓ
    - ர_உகர_கெடு
  links: []
  urai:
    iyaipu:
    - ezhu.478
    - ezhu.464
    text: 'இயைபு (649): 478 முதனிலை; 464 உகரம். எடுத்துக்காட்டு: “ஓரெழுத் தின்றே” (எழு. 5), “ஈரெழுத்” (எழு. 45) — ஒரு/இரு + உயிர் — ஒகரம் ஓ ஆகி ரகரத்து உகரம் கெட்டது.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.480
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 480
  moolam: |-
    இரண்டுமுத லொன்பான் இறுதி முன்னர்
    வழங்கியல் மாவென் கிளவி தோன்றின்
    மகர அளவொடு நிகரலு முரித்தே
  kaandigai:
    porul: இரண்டு முதல் ஒன்பது ஈற்றின் முன் வழக்கிலுள்ள "மா" வந்தால் மகர அளவோடு ஒத்தலும் உண்டு.
    ethu: 479 உயிர்க்கும் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: மா
    context: எண்_2_9
    op: மகர_அளவு_ஒப்பு
    evidence: வழக்கு
  links: []
  urai:
    iyaipu:
    - ezhu.479
    - ezhu.440
    text: 'இயைபு (649): 479 உயிர்க்கும்; 440 மூன்று. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: இரண்டுமுத
- id: ezhu.481
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 481
  moolam: |-
    லனவென வரூஉம் புள்ளி யிறுதிமுன்
    உம்முங் கெழுவும் உளப்படப் பிறவும்
    அன்ன மரபின் மொழியிடைத் தோன்றிச்
    செய்யுட் டொடர்வயின் மெய்பெற நிலையும்
    வேற்றுமை குறித்த பொருள்வயி னான
  kaandigai:
    porul: ல, ன புள்ளி இறுதி முன் உம், கெழு முதலிய மொழிகள் இடையில் தோன்றி, வேற்றுமைப் பொருளில் செய்யுள் தொடரில் நிலைபெறும்.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 478–480 முதனிலை இயல்கள்; ல, ன புள்ளி இறுதிமுன் உம்மும் கெழுவும் உளப்படப் பிறவும் — செய்யுட் டொடர்வயின் மெய்பெற நிலையும் வேற்றுமை குறித்த பொருள்வயினான்.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    context:
    - ல
    - ன
    inserts:
    - உம்
    - கெழு
    property: வேற்றுமை_செய்யுள்_நிலை
  links: []
  urai:
    iyaipu:
    - ezhu.478
    - ezhu.480
    text: 'இயைபு (649): 478 முதனிலை; 480 மா. “உளப்படப் பிறவும்” — எவை என நூல் பெயரிடவில்லை — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; “உளப்படப் பிறவும்” ஒருதலை அன்மை
  utthi:
  - peyar: வந்தது கொண்டு வாராதது உணர்த்தல்
    saanru: பிறவும்
- id: ezhu.482
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 482
  moolam: |-
    உயிரும் புள்ளியும் இறுதி யாகிக்
    குறிப்பினும் பண்பினும் இசையினுந் தோன்றி
    நெறிப்பட வாராக் குறைச்சொற் கிளவியும்
    உயர்திணை அஃறிணை ஆயிரு மருங்கின்
    ஐம்பா லறியும் பண்புதொகு மொழியுஞ்
    செய்யுஞ் செய்த என்னுங் கிளவியின்
    மெய்யொருங் கியலுந் தொழில்தொகு மொழியும்
    தம்மியல் கிளப்பின் தம்முன் தாம்வரூஉம்
    எண்ணின் தொகுதி உளப்படப் பிறவும்
    அன்னவை யெல்லாம் மருவின் பாத்திய
    புணரியல் நிலையிடை உணரத் தோன்றா
  kaandigai:
    porul: 'புறனடை: குறைச்சொல், பண்புத்தொகை, தொழில்தொகை, எண்ணின் தொகுதி முதலியவை மருவின் பாற்பட்டவை; புணரியல் நிலையில் விரித்துக் கூறப்படாதவை. பட்டியல் "பிறவும்" எனத் திறந்தது.'
    ethu: 481 ல/ன இறுதி என்றது; உயிரும் புள்ளியும் இறுதியாகிக் குறிப்பினும் பண்பினும் இசையினும் தோன்றிக் குறைச்சொற் கிளவியும், ஐம்பால் அறியும் பண்புதொகு மொழியும், செய்யும்/செய்த என்னுங் கிளவியின் மெய்யொருங்கியலுந் தொழில்தொகு மொழியும், தம்மியல் கிளப்பின் எண்ணின் தொகுதியும் — மருவின் பாத்திய புணரியல் நிலையிடை உணரத் தோன்றா.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: exception
    excluded:
    - குறைச்சொல்
    - பண்புத்தொகை
    - தொழில்தொகை
    - எண்ணுத்தொகுதி
    property: விரிவில்லை
  links: []
  urai:
    iyaipu:
    - ezhu.481
    - ezhu.483
    text: 'இயைபு (649): 481 செய்யுட் டொடர்; 483 புறனடை. “உளப்படப் பிறவும்” — எவை என நூல் பெயரிடவில்லை — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; “உளப்படப் பிறவும்” ஒருதலை அன்மை
  utthi:
  - peyar: வந்தது கொண்டு வாராதது உணர்த்தல்
    saanru: பிறவும்
- id: ezhu.483
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 483
  moolam: |-
    கிளந்த அல்ல செய்யுளுள் திரிநவும்
    வழங்கியல் மருங்கின் மருவொடு திரிநவும்
    விளம்பிய இயற்கையின் வேறுபடத் தோன்றின்
    வழங்கியல் மருங்கி னுணர்ந்தனர் ஒழுக்கல்
    நன்மதி நாட்டத் தென்மனார் புலவர்
  kaandigai:
    porul: 'அதிகாரப் புறனடை: கூறாதவை, செய்யுளில் திரிவன, வழக்கில் மருவொடு திரிவன, கூறிய இயல்பிலிருந்து வேறுபட்டவை — வழக்கால் உணர்ந்து நன்மதியால் கொள்க. நூல் தன் எல்லையைத் தானே வரையறுக்கிறது; நூலில் இல்லாதவற்றுக்கு இதுவே வழி (பயன்பாட்டு நெறி).'
    ethu: எழுத்ததிகாரம் கூறியவற்றுக்குப் புறம்பாகச் செய்யுளிலும் வழக்கிலும் திரிவன உண்டு; அவற்றை வழக்கால் கொள்க. இதுவே எழு. 405-இன் "கண்டுசெயற் குரியவை கண்ணினர் கொளலே" என்ற புறனடையின் விரிவு; பொருளதிகாரத்திலும் "வழக்கு வழிப்படுதல் செய்யுட்குக் கடனே" (பொருள். 213).
    eduthukkaattu:
    - text: கண்டுசெயற் குரியவை கண்ணினர் கொளலே
      from: ezhu.405
    - text: வழக்கு வழிப்படுதல் செய்யுட்குக் கடனே
      from: porul.213
  nilai: ஒருதலை அன்மை
  kanini:
    kind: exception
    principle: கூறாதவற்றைக்_கூறியவற்றின்_இயல்பால்_உணர்க
    fallback: analogical_inference
    adhikaram_end: true
  links:
  - ezhu.405
  - sol.463
  - porul.544
  urai:
    iyaipu:
    - sol.463
    - porul.656
    text: 'எழுத்ததிகாரப் புறனடை. மூன்று வகை வேறுபாடு: கிளந்த அல்லன, செய்யுளுள் திரிவன, வழக்கில் மருவொடு திரிவன. தீர்வு: "வழங்கியல் மருங்கின் உணர்ந்தனர் ஒழுக்கல் / நன்மதி நாட்டத்து". ஆய்வு 27 கண்ட "முதனிலை", "வடசொல்" இதன்கீழும் 111, 171-இன்கீழும் அடங்கலாம் — ஒருதலை அன்மை. மூன்று அதிகாரமும் புறனடையால் முடிகின்றன: எழு. 483, சொல். 463, பொருள். 656.'
    vagai: விதி
    thunivu: ஒருதலை அன்மை
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: புலவர்
  - peyar: கூறிற்று என்றல்
    saanru: கிளந்த
