# இக்கோப்பு data_v2-இலிருந்து உருவானது. 'moolam' (சூத்திரம்) திருத்தக் கூடாது (பொருள். 652).
- id: ezhu.406
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 406
  moolam: |-
    ஈரெழுத் தொருமொழி உயிர்த்தொட ரிடைத்தொடர்
    ஆய்தத் தொடர்மொழி வன்றொடர் மென்றொடர்
    ஆயிரு மூன்றே உகரங் குறுகிடன்
  kaandigai:
    porul: 'உகரம் குறுகும் இடம் ஆறு: ஈரெழுத்து ஒருமொழி, உயிர்த்தொடர், இடைத்தொடர், ஆய்தத்தொடர், வன்றொடர், மென்றொடர். "ஆயிரு மூன்றே" = 6 — எண்ணிச் சரிபார்த்தது (எழு. 2, 36 உடன் ஒப்பு).'
    en:
      kooruvathu: 6
      enniyathu: 6
    ethu: குற்றியலுகரம் "நெட்டெழுத் திம்பருந் தொடர்மொழி யீற்றுங்" வரும் (எழு. 36); அத்தொடர்மொழி ஈற்றை இறுதிக்கு முன் நிற்கும் எழுத்தால் ஐந்தாகப் பகுத்து, நெட்டெழுத்து இம்பரை ஈரெழுத்து ஒருமொழியாகக் கொண்டு ஆறு. ஓத்தின் விதிகள் இவ்வாறு இடங்களின் வழியே விரிகின்றன (எழு. 407–414).
    eduthukkaattu:
    - text: நெட்டெழுத் திம்பருந் தொடர்மொழி யீற்றுங்
      from: ezhu.36
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: உகர_குறுகிடன்
    count: 6
    items:
    - ஈரெழுத்தொருமொழி
    - உயிர்த்தொடர்
    - இடைத்தொடர்
    - ஆய்தத்தொடர்
    - வன்றொடர்
    - மென்றொடர்
  links:
  - ezhu.407
  - ezhu.411
  - ezhu.414
  urai:
    iyaipu:
    - ezhu.36
    text: 'குற்றியலுகரப் புணரியலின் நுதலியது. "ஆயிரு மூன்றே" — ஆறு. எழு. 36 "நெட்டெழுத் திம்பருந் தொடர்மொழி யீற்றும்" — ஈரெழுத்து ஒருமொழி நெட்டெழுத்து இம்பர்; மற்ற ஐந்தும் தொடர்மொழி. 407 விலக்கு (ஈரொற்றுத் தொடர் இடைத்தொடர் ஆகாது). வகைக்கு வகை விதி: 411 (ஈரெழுத்து, உயிர்த்தொடர்), 413 (இடை, ஆய்தம்), 414 (வன், மென்).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: மூன்றே
- id: ezhu.407
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 407
  moolam: |-
    அவற்றுள்
    ஈரொற்றுத் தொடர்மொழி இடைத்தொட ராகா
  kaandigai:
    porul: அவற்றுள், ஈரொற்றுத் தொடர்மொழி இடைத்தொடர் ஆகாது.
    ethu: 406 இல் இடைத்தொடர் ஒரு வகையாகச் சொல்லப்பட்டது; ஈரொற்றுத் தொடர்மொழி (இரு ஒற்று கொண்ட தொடர்) இடைத்தொடராகா — விலக்கு.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ஈரொற்று_தொடர்
    property: இடைத்தொடர்_ஆகா
  links:
  - ezhu.406
  urai:
    iyaipu:
    - ezhu.406
    text: 'இயைபு (649): 406 இன் ஆறு வகைகளில் இடைத்தொடர் ஒன்று; 407 அதை விலக்குகிறது. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விலக்கு
    vilakkukkuriyathu:
    - ezhu.406
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: அதிகார முறை
    saanru: அவற்றுள்
- id: ezhu.408
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 408
  moolam: |-
    அல்லது கிளப்பினும் வேற்றுமைக் கண்ணும்
    எல்லா இறுதியும் உகர நிலையும்
  kaandigai:
    porul: அல்வழியிலும் வேற்றுமையிலும் எல்லா இறுதியிலும் உகரம் நிலைக்கும்.
    ethu: 406–407 அல்வழியில் சொன்ன குறுகல்; வேற்றுமை வரும்போதும் எல்லா இறுதியும் உகர நிலையும் (குறுகும்).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: உகரம்
    contexts:
    - அல்வழி
    - வேற்றுமை
    property: நிலை
  links: []
  urai:
    iyaipu:
    - ezhu.406
    - ezhu.425
    text: 'இயைபு (649): 406 குறுகும் ஆறு இடம்; 425 அல்வழி இயற்கை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.409
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 409
  moolam: |-
    வல்லொற்றுத் தொடர்மொழி வல்லெழுத்து வருவழித்
    தொல்லை இயற்கை நிலையலு முரித்தே
  kaandigai:
    porul: வல்லொற்றுத் தொடர்மொழி முன் வல்லெழுத்து வரும்போது பழைய இயல்பில் நிற்றலும் உண்டு.
    ethu: 406 இன் வல்லொற்றுத் தொடர் வகை; வல்லெழுத்து வரும்போது தொல்லை இயற்கை (உகரம் மிகாமல்) நிலைபெறலும் உரித்து.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: வல்லொற்று_தொடர்
    context: வல்லினம்
    property: தொல்லை_இயல்பு_நிலை
  links: []
  urai:
    iyaipu:
    - ezhu.406
    - ezhu.426
    text: 'இயைபு (649): 426 வல்லொற்றுத் தொடர்மொழி வல்லெழுத்து மிகும் என்னும் விதி; 409 தொல்லை இயற்கை நிலையலும் உரித்து — மிகாமலும் வரலாம் (விருப்பு). எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி-விலக்கு
    thunivu: நூலில் நேரடியாக
    vilakkukkuriyathu:
    - ezhu.426
- id: ezhu.410
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 410
  moolam: |-
    யகரம் வருவழி இகரங் குறுகும்
    உகரக் கிளவி துவரத் தோன்றாது
  kaandigai:
    porul: யகரம் வரும்போது (உகரம்) இகரமாகக் குறுகும்; உகரம் முழுதும் தோன்றாது (குற்றியலிகரம்; காண்க எழு. 2, 34). இது குற்றியலுகர ஈற்று மொழிக்கே ("உகரக் கிளவி"; ஓத்து எல்லை எழு. 406); நூலில் "யா" முன் வரும் இகரம் ஒன்பதும் இதனுள் அடங்கா (ஆய்வு 15).
    ethu: 409 வல்லொற்றுத் தொடர் என்றது; யகரம் வருவழி உகரக் கிளவியின் இகரம் குறுகும், உகரம் துவரத் தோன்றாது.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: உகரம்
    context: யகரம்
    transform: உ→இ
    mode: குறுகல்
  links: []
  urai:
    iyaipu:
    - ezhu.409
    - ezhu.436
    text: 'இயைபு (649): 409 வல்லினம்; 410 யகரம். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.411
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 411
  moolam: |-
    ஈரெழுத்து மொழியும் உயிர்த்தொடர் மொழியும்
    வேற்றுமை யாயின் ஒற்றிடை இனமிகத்
    தோற்றம் வேண்டும் வல்லெழுத்து மிகுதி
  kaandigai:
    porul: ஈரெழுத்து மொழியும் உயிர்த்தொடர் மொழியும் வேற்றுமையானால் இடை ஒற்று இனமாக மிகுந்து வல்லெழுத்து மிகும்.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 406 இன் ஈரெழுத்து மொழி/உயிர்த்தொடர் வகை; வேற்றுமையாயின் ஒற்றிடை இனமிக வல்லெழுத்து மிகுதி.
    eduthukkaattu:
    - text: மிடற்றுப் பிறந்த
      from: ezhu.84
    - text: ஆற்றுப்படை
      from: sol.462
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    classes:
    - ஈரெழுத்துமொழி
    - உயிர்த்தொடர்
    context: வேற்றுமை
    ops:
    - ஒற்று_இனமிகு
    - வல்லின_மிகு
  links: []
  urai:
    iyaipu:
    - ezhu.406
    - ezhu.412
    text: 'இயைபு (649): 406 ஈரெழுத்து மொழி, உயிர்த்தொடர் மொழி; 412 இனமிகா மொழிகள் — விலக்கு. எடுத்துக்காட்டு: “மிடற்றுப் பிறந்த” (எழு. 84), “ஆற்றுப்படை” (சொல். 462) — மிடறு, ஆறு — வேற்றுமையில் ஒற்று இரட்டி வல்லெழுத்து மிகுந்தது.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஆணை கூறல்
    saanru: வேண்டும்
- id: ezhu.412
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 412
  moolam: |-
    ஒற்றிடை இனமிகா மொழியுமா ருளவே
    அத்திறத் தில்லை வல்லெழுத்து மிகலே
  kaandigai:
    porul: இடை ஒற்று இனம் மிகாத மொழிகளும் உள; அவற்றுக்கு வல்லெழுத்து மிகுதல் இல்லை.
    ethu: 411 ஒற்றிடை இனமிக வல்லெழுத்து மிகுதி என்றது; இது அதன் தொடர்ச்சி.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    class: ஒற்று_இனமிகா_மொழி
    property: வல்லின_மிகுதல்_இல்லை
  links: []
  urai:
    iyaipu:
    - ezhu.411
    text: 'இயைபு (649): 411 பொது; 412 “ஒற்றிடை இனமிகா மொழியுமா ருளவே” — எவை என நூல் பெயரிடவில்லை — ஒருதலை அன்மை.'
    vagai: விலக்கு
    vilakkukkuriyathu:
    - ezhu.411
    thunivu: விதி நூலில் நேரடியாக; “உளவே” ஒருதலை அன்மை
- id: ezhu.413
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 413
  moolam: |-
    இடையொற்றுத் தொடரும் ஆய்தத் தொடரும்
    நடைஆ இயல என்மனார் புலவர்
  kaandigai:
    porul: இடையொற்றுத் தொடரும் ஆய்தத் தொடரும் (411-இன்) நடையின் இயல்பின.
    ethu: 406-இன் இடையொற்றுத் தொடர், ஆய்தத் தொடர் இரண்டுக்கும் முடிபு "நடைஆ இயல" — எந்த முன் நடையை என நூல் வெளிப்படச் சுட்டவில்லை; 411-இன் (ஈரெழுத்து, உயிர்த்தொடர்) நடை என்பது ஒரு வாசிப்பு.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    classes:
    - இடையொற்று_தொடர்
    - ஆய்தத்தொடர்
    analogy: ezhu.411
  links: []
  urai:
    iyaipu:
    - ezhu.406
    - ezhu.411
    text: 'இயைபு (649): 406 வகைகள்; 411 ஈரெழுத்து, உயிர்த்தொடர் வேற்றுமை முடிபு. "நடைஆ இயல" எதைச் சுட்டுகிறது என நூல் தீர்க்கவில்லை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: ஒருதலை அன்மை
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்மனார்
- id: ezhu.414
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 414
  moolam: |-
    வன்றொடர் மொழியும் மென்றொடர் மொழியும்
    வந்த வல்லெழுத் தொற்றிடை மிகுமே
    மெல்லொற்றுத் தொடர்மொழி மெல்லொற் றெல்லாம்
    வல்லொற் றிறுதி கிளையொற் றாகும்
  kaandigai:
    porul: வன்றொடர், மென்றொடர் மொழிகளுக்கு வந்த வல்லெழுத்து ஒற்றாக இடையில் மிகும்; மெல்லொற்றுத் தொடர்மொழியின் மெல்லொற்று எல்லாம் வல்லொற்றாகி, இறுதி கிளை (இன) ஒற்றாகும்.
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: உகரம் குறுகும் ஆறு இடங்களுள் (எழு. 406) வன்றொடரும் மென்றொடரும் இறுதி இரண்டு. இடைத்தொடர், ஆய்தத்தொடருக்கு மிகுதல் இல்லை — "நடைஆ இயல" (எழு. 413); இவற்றுக்கு வல்லெழுத்து மிகுகிறது. மெல்லொற்று வல்லொற்றாதல் "மெய்ப்பிறி தாதல்" (எழு. 109).
    eduthukkaattu:
    - text: நடைஆ இயல
      from: ezhu.413
    - text: மெய்ப்பிறி தாதல்
      from: ezhu.109
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    classes:
    - வன்றொடர்
    - மென்றொடர்
    ops:
    - வல்லின_ஒற்று_மிகு
    - மெல்லொற்று_வல்லொற்றாகு
    - இறுதி_கிளையொற்று
  links:
  - ezhu.406
  - ezhu.411
  urai:
    iyaipu:
    - ezhu.406
    - ezhu.413
    text: 'இயைபு (649): 406 இன் வகைகள்; 413 இடையொற்று. எடுத்துக்காட்டு: “எழுத்துக்கடன்” (எழு. 142) — எழுத்து (வன்றொடர்) + கடன் — வல்லெழுத்து மிகுந்தது.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.415
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 415
  moolam: |-
    மரப்பெயர்க் கிளவிக் கம்மே சாரியை
  kaandigai:
    porul: மரப்பெயருக்கு அம்மே சாரியை.
    ethu: 413–414 வல்லின/மெல்லின ஒற்று மிகுதி சொன்னது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: மரப்பெயர்
    suffix: அம்
  links: []
  urai:
    iyaipu:
    - ezhu.217
    - ezhu.283
    - ezhu.416
    text: 'இயைபு (649): 217 உயிர் ஈற்று மரப்பெயர் மெல்லெழுத்து மிகும்; 283 பனை, அரை, ஆவிரை அம்மொடு சிவணும்; 416 மெல்லொற்று வலியா மரப்பெயர். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.416
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 416
  moolam: |-
    மெல்லொற்று வலியா மரப்பெயரு முளவே
  kaandigai:
    porul: மெல்லொற்று வலிக்காத மரப்பெயர்களும் உள.
    ethu: 415 மரப்பெயர்க்கு அம் சாரியை என்றது; இது அதன் தொடர்ச்சி.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    class: மரப்பெயர்
    property: மெல்லொற்று_வலியா
  links: []
  urai:
    iyaipu:
    - ezhu.415
    text: 'இயைபு (649): 415 பொது; 416 “உளவே” — எவை என நூல் பெயரிடவில்லை — ஒருதலை அன்மை.'
    vagai: விலக்கு
    vilakkukkuriyathu:
    - ezhu.415
    thunivu: விதி நூலில் நேரடியாக; “உளவே” ஒருதலை அன்மை
- id: ezhu.417
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 417
  moolam: |-
    ஈரெழுத்து மொழியும் வல்லொற்றுத் தொடரும்
    அம்மிடை வரற்கு முரியவை உளவே
    அம்மர பொழுகும் மொழிவயி னான
  kaandigai:
    porul: ஈரெழுத்து மொழியிலும் வல்லொற்றுத் தொடரிலும் அம் இடை வருதற்கு உரியவை உள — அம்மரபு வழங்கும் மொழியில்.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 406 இன் ஈரெழுத்து மொழி/வல்லொற்றுத் தொடர் வகை; அம் இடை வரற்கு உரிய.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    classes:
    - ஈரெழுத்துமொழி
    - வல்லொற்றுத்_தொடர்
    insert: அம்
  links: []
  urai:
    iyaipu:
    - ezhu.406
    - ezhu.415
    - ezhu.416
    text: 'இயைபு (649): 406 வகை; 415 அம் சாரியை; 416 விலக்கு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.418
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 418
  moolam: |-
    ஒற்றுநிலை திரியா தக்கொடு வரூஉம்
    அக்கிளை மொழியு முளவென மொழிப
  kaandigai:
    porul: ஒற்று நிலை திரியாமல் அக்கொடு வரும் கிளைமொழிகளும் உள.
    ethu: 417 அம் இடை என்றது; இது அதன் தொடர்ச்சி.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    class: அக்கு_கிளைமொழி
    property: ஒற்று_நிலை_திரியா
  links: []
  urai:
    iyaipu:
    - ezhu.417
    text: 'இயைபு (649): 417 அம் இடை; 418 அக்கு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; “உளவென” ஒருதலை அன்மை
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
- id: ezhu.419
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 419
  moolam: |-
    எண்ணுப்பெயர்க் கிளவி உருபியல் நிலையும்
  kaandigai:
    porul: எண்ணுப்பெயர் உருபியல் நிலையில் நிற்கும்.
    ethu: 198 "எண்ணின் இறுதி அன்னொடு சிவணும்" என்று உருபியலில் சொன்னது; இது அதன் தொடர்ச்சி.
    eduthukkaattu:
    - text: ஒன்றன் படர்க்கை
      from: sol.219
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: எண்ணுப்பெயர்
    property: உருபியல்_நிலை
  links: []
  urai:
    iyaipu:
    - ezhu.198
    - ezhu.425
    text: 'இயைபு (649): 198 எண்ணின் இறுதி அன் சாரியை; 425 அல்வழியில் இயற்கை. எடுத்துக்காட்டு: “ஒன்றன் படர்க்கை” (சொல். 219) — ஒன்று + அன் → ஒன்றன் (அன் சாரியை, எழு. 198).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.420
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 420
  moolam: |-
    வண்டும் பெண்டும் இன்னொடு சிவணும்
  kaandigai:
    porul: '"வண்டு", "பெண்டு" இன்னொடு பொருந்தும்.'
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 419 எண்ணுப்பெயர் உருபியல் நிலை என்றது; வண்டு, பெண்டு என்னும் குற்றியலுகர ஈற்றுச் சொற்கள் இன் சாரியையோடு சிவணும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    items:
    - வண்டு
    - பெண்டு
    suffix: இன்
  links: []
  urai:
    iyaipu:
    - ezhu.419
    - ezhu.421
    text: 'இயைபு (649): 419 உருபியல் நிலை; 421 பெண்டுக்கு அன்னும் உண்டு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.421
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 421
  moolam: |-
    பெண்டென் கிளவிக் கன்னும் வரையார்
  kaandigai:
    porul: '"பெண்டு"க்கு அன்னும் (சாரியை) விலக்கில்லை.'
    ethu: 420 பெண்டு என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: பெண்டு
    suffix: அன்
    property: விலக்கில்லை
  links: []
  urai:
    iyaipu:
    - ezhu.420
    - ezhu.198
    text: 'இயைபு (649): 420 இன் சாரியை; 421 பெண்டுக்கு அன் சாரியையும் வரையார் (198 எண்ணின் அன் போல). எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: வரையார்
- id: ezhu.422
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 422
  moolam: |-
    யாதென் இறுதியுஞ் சுட்டுமுத லாகிய
    ஆய்த இறுதியும் உருபியல் நிலையும்
  kaandigai:
    porul: '"யாது" இறுதியும், சுட்டு முதலான ஆய்த இறுதியும் உருபியல் நிலையில் நிற்கும்.'
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 419 எண்ணுப்பெயர் என்றது; இது அதன் தொடர்ச்சி.
    eduthukkaattu:
    - text: யாதன் உருபின்
      from: sol.107
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    classes:
    - யாது_ஈறு
    - சுட்டு_ஆய்த_ஈறு
    property: உருபியல்_நிலை
  links: []
  urai:
    iyaipu:
    - ezhu.200
    - ezhu.419
    text: 'இயைபு (649): 200 யாது, சுட்டுமுதல் ஆய்த இறுதி அன்னொடு சிவணும் — ஆய்தம் கெடும். எடுத்துக்காட்டு: “யாதன் உருபின்” (சொல். 107) — யாது + அன் → யாதன் (அன் சாரியை).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.423
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 423
  moolam: |-
    முன்உயிர் வருமிடத் தாய்தப் புள்ளி
    மன்னல் வேண்டும் அல்வழி யான
  kaandigai:
    porul: அல்வழியில் முன் உயிர் வந்தால் ஆய்தப் புள்ளி நிலைக்க வேண்டும்.
    ethu: 422 சுட்டுமுதல் ஆய்த இறுதி என்றது; இது அதன் தொடர்ச்சி.
    eduthukkaattu:
    - text: அஃதென் கிளவி
      from: ezhu.199
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    context: அல்வழி
    property: ஆய்த_நிலை
  links: []
  urai:
    iyaipu:
    - ezhu.422
    - ezhu.200
    text: 'இயைபு (649): 422 ஆய்த இறுதி; 200 ஆய்த இயல்பு. எடுத்துக்காட்டு: “அஃதென் கிளவி” (எழு. 199) — அஃது + என் — உயிர் வருமிடத்து ஆய்தம் நின்றது.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஆணை கூறல்
    saanru: வேண்டும்
- id: ezhu.424
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 424
  moolam: |-
    ஏனைமுன் வரினே தானிலை இன்றே
  kaandigai:
    porul: ஏனையவை (மெய்) முன் வந்தால் அந்நிலை இல்லை.
    ethu: 423 முன்உயிர் என்றது; ஏனைமுன் வரினே தானிலை இன்றே (ஆய்தம் நிற்காது) — விலக்கு.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    context: மெய்_முன்
    property: ஆய்த_நிலை_இல்லை
  links: []
  urai:
    iyaipu:
    - ezhu.423
    text: 'இயைபு (649): 423 முன்உயிர்; 424 ஏனைமுன் (மெய்) — ஆய்தம் நிற்காது. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விலக்கு
    vilakkukkuriyathu:
    - ezhu.423
    thunivu: நூலில் நேரடியாக
- id: ezhu.425
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 425
  moolam: |-
    அல்லது கிளப்பின் எல்லா மொழியுஞ்
    சொல்லிய பண்பின் இயற்கை யாகும்
  kaandigai:
    porul: அல்வழியில் எல்லா மொழியும் கூறிய பண்பின்படி இயல்பாகும்.
    ethu: 419–422 வேற்றுமைக்கண் உருபியல் நிலை சொன்னது; வேற்றுமை அல்லாத இடத்தில் (அல்வழி) எல்லா மொழியும் முன் சொன்ன இயற்கையே.
    eduthukkaattu:
    - text: இரண்டுதலை
      from: ezhu.103
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    context: அல்வழி
    property: கூறிய_பண்பின்_இயல்பு
  links: []
  urai:
    iyaipu:
    - ezhu.419
    - ezhu.408
    text: 'இயைபு (649): 419–422 வேற்றுமை; 408 அல்வழியிலும் உகர நிலை. 425 அல்வழிக்கு விலக்கு. எடுத்துக்காட்டு: “இரண்டுதலை” (எழு. 103) — இரண்டு (மென்றொடர்) + தலை — அல்வழியில் இயல்பு.'
    vagai: விலக்கு
    thunivu: நூலில் நேரடியாக
    vilakkukkuriyathu:
    - ezhu.419
  utthi:
  - peyar: கூறிற்று என்றல்
    saanru: சொல்லிய
- id: ezhu.426
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 426
  moolam: |-
    வல்லொற்றுத் தொடர்மொழி வல்லெழுத்து மிகுமே
  kaandigai:
    porul: வல்லொற்றுத் தொடர்மொழி முன் வல்லெழுத்து மிகும்.
    ethu: 406 இன் வல்லொற்றுத் தொடர் வகை; வல்லெழுத்து வரினே வல்லெழுத்து மிகும்.
    eduthukkaattu:
    - text: பத்த னொற்றுக்கெட
      from: ezhu.437
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: வல்லொற்றுத்_தொடர்
    op: வல்லின_மிகு
  links: []
  urai:
    iyaipu:
    - ezhu.406
    - ezhu.409
    - ezhu.414
    text: 'இயைபு (649): 406 வகை; 409 வல்லினம்; 414 வந்த வல்லினம் மிகும். எடுத்துக்காட்டு: “பத்த னொற்றுக்கெட” (எழு. 437) — ஒற்று (வல்லொற்றுத் தொடர்) + கெட — அல்வழியிலும் வல்லெழுத்து மிகுந்தது.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.427
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 427
  moolam: |-
    சுட்டுச்சினை நீடிய மென்றொடர் மொழியும்
    யாவினா முதலிய மென்றொடர் மொழியும்
    ஆயியல் திரியா வல்லெழுத் தியற்கை
  kaandigai:
    porul: சுட்டுச்சினை நீண்ட மென்றொடர் மொழியும், யா வினா முதலான மென்றொடர் மொழியும் — அவ்வியல் திரியாது வல்லெழுத்து இயல்பில் நிற்கும்.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 426 வல்லின மிகுதி என்றது; சுட்டுச்சினை நீடிய மென்றொடர், யாவினா முதலிய மென்றொடர் — ஆயியல் திரியா வல்லெழுத்து இயற்கை.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    classes:
    - சுட்டுச்சினை_நீடிய_மென்றொடர்
    - யாவினா_மென்றொடர்
    property: வல்லின_இயல்பு
  links: []
  urai:
    iyaipu:
    - ezhu.426
    - ezhu.428
    - ezhu.429
    text: 'இயைபு (649): 426 வல்லொற்றுத் தொடர் வல்லெழுத்து மிகும்; 428 யாவினா இயல்பும் ஆகும்; 429 அந்நான்கும் திரியா. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒப்பக் கூறல்
    saanru: ஆயியல்
- id: ezhu.428
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 428
  moolam: |-
    யாவினா மொழியே இயல்பு மாகும்
  kaandigai:
    porul: யா வினா மொழி இயல்பாகவும் ஆகும்.
    ethu: 427 யாவினா என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: யாவினா
    property: இயல்பு
  links: []
  urai:
    iyaipu:
    - ezhu.427
    text: 'இயைபு (649): 427 யாவினா மென்றொடர் வல்லெழுத்து இயற்கை; 428 இயல்பாதலும் உண்டு — விருப்பு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி-விலக்கு
    thunivu: நூலில் நேரடியாக
    vilakkukkuriyathu:
    - ezhu.427
- id: ezhu.429
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 429
  moolam: |-
    அந்நான் மொழியுந் தந்நிலை திரியா
  kaandigai:
    porul: அந்நான்கு மொழியும் தம் நிலை திரியா. "அந்நான்கு" எவை என்பது நூலில் பெயரிடப்படவில்லை (ஒருதலை அன்மை).
    ethu: 427–428 யாவினா என்றது; அந்நான் மொழியும் தந்நிலை திரியா.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    class: நால்_மொழி
    count: 4
    items: not_named
    property: நிலை_திரியா
  links: []
  urai:
    iyaipu:
    - ezhu.427
    - ezhu.428
    text: 'இயைபு (649): 427–428 யாவினா. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக; காண்டிகை சுட்டிய ஐயம் ஒருதலை அன்மை
- id: ezhu.430
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 430
  moolam: |-
    உண்டென் கிளவி உண்மை செப்பின்
    முந்தை இறுதி மெய்யொடுங் கெடுதலும்
    மேனிலை யொற்றே ளகார மாதலும்
    ஆமுறை யிரண்டும் உரிமையு முடைத்தே
    வல்லெழுத்து வரூஉங் காலை யான
  kaandigai:
    porul: '"உண்டு" உண்மை குறித்தால், வல்லெழுத்து வரும்போது இறுதி (உகரம்) மெய்யொடும் கெடுதலும், மேல் நிலை ஒற்று ளகாரமாதலும் — இரண்டும் உரியன.'
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: குற்றியலுகரப் புணரியல் சில தனிச் சொற்களுக்குத் தனி விதி தருகிறது; இதுவும் அவற்றுள் ஒன்று. இறுதி கெடுதல் «குன்றல்», ணகரம் ளகரமாதல் "மெய்ப்பிறி தாதல்" (எழு. 109). இதன் பின் திசைப்பெயர்ப் புணர்ச்சி — "இருதிசை புணரின் ஏயிடை வருமே" (எழு. 431).
    eduthukkaattu:
    - text: மெய்ப்பிறி தாதல்
      from: ezhu.109
    - text: இருதிசை புணரின் ஏயிடை வருமே
      from: ezhu.431
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: உண்டு
    context: உண்மை
    ops:
    - இறுதி_மெய்யொடு_கெடு
    - ள்_ஒற்றாகு
  links: []
  urai:
    iyaipu:
    - ezhu.433
    text: 'இயைபு (649): 433 "குற்றிய லுகரம் மெய்யொடுங் கெடுமே" — இதே கேடு எண்ணிலும். புணர்ந்த வடிவம் நூலுள் காணவில்லை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.431
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 431
  moolam: |-
    இருதிசை புணரின் ஏயிடை வருமே
  kaandigai:
    porul: இரு திசைப் பெயர் புணர்ந்தால் ஏ இடை வரும்.
    ethu: இரு திசைப் பெயர்கள் தம்முள் புணரின் இடையே ஏ வரும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: இரு_திசைப்பெயர்
    insert: ஏ
  links: []
  urai:
    iyaipu:
    - ezhu.432
    text: 'இயைபு (649): 432 தெற்கு என்னும் திசைப்பெயர் புணரும் முடிபு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.432
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 432
  moolam: |-
    திரிபுவேறு கிளப்பின் ஒற்று முகரமுங்
    கெடுதல் வேண்டும் என்மனார் புலவர்
    ஒற்றுமெய் திரிந்து னகார மாகும்
    தெற்கொடு புணருங் காலை யான
  kaandigai:
    porul: திரிபு வேறு கூறினால் ஒற்றும் உகரமும் கெட வேண்டும்; "தெற்கு" புணரும்போது ஒற்று னகாரமாகும்.
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: 431 இருதிசை புணர்ச்சி சொன்னது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    items:
    - திரிபு_வேறு
    - தெற்கு
    ops:
    - ஒற்று_கெடு
    - உகர_கெடு
    - ன_ஒற்று
  links: []
  urai:
    iyaipu:
    - ezhu.431
    text: 'இயைபு (649): 431 இருதிசை. "தெற்கொடு" நூற்பாவின் சொல்லே — எடுத்துக்காட்டு அன்று. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்மனார்
  - peyar: ஆணை கூறல்
    saanru: வேண்டும்
- id: ezhu.433
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 433
  moolam: |-
    ஒன்றுமுத லாக எட்ட னிறுதி
    எல்லா வெண்ணும் பத்தன் முன்வரிற்
    குற்றிய லுகரம் மெய்யொடுங் கெடுமே
    முற்றஇன் வரூஉம் இரண்டலங் கடையே
  kaandigai:
    porul: ஒன்று முதல் எட்டு ஈறான எண்கள் பத்தின் முன் வந்தால் குற்றியலுகரம் மெய்யொடும் கெடும்; இரண்டு அல்லாதவிடத்து இன் வரும்.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 'எண்ணுப்பெயர் முன் பத்து வரும் முடிபு இங்குத் தொடங்குகிறது: ஒன்று முதல் எட்டு வரை எல்லா எண்ணின் குற்றியலுகரமும் மெய்யொடு கெடும் — இரண்டு, இன் வரும் இடம் அல்லாத இடத்தில்.'
    eduthukkaattu:
    - text: இருபத்தைந்து
      from: porul.357
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: எண்_1_8_பத்து
    ops:
    - குற்றியலுகர_மெய்யொடு_கெடு
    - இன்_சாரியை
    exception: 2
  links: []
  urai:
    iyaipu:
    - ezhu.437
    - ezhu.438
    - ezhu.443
    text: 'இயைபு (649): 437 பத்து → பஃது; 438 ஒன்று, இரண்டு → ஒரு, இரு; 443 ஐந்தன் ஒற்று மகரம். எடுத்துக்காட்டு: “இருபத்தைந்து” (பொருள். 357) — இரண்டு + பத்து: "ண்டு" கெட்டு இரு (438).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.434
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 434
  moolam: |-
    பத்தனொற் றுக்கெட னகாரம் இரட்டல்
    ஒத்த தென்ப இரண்டுவரு காலை
  kaandigai:
    porul: இரண்டு வரும்போது பத்தின் ஒற்று உகரத்தோடு கெட்டு னகாரம் இரட்டும். விளைவு வடிவம் நூலில் எழுதப்படவில்லை (ஒருதலை அன்மை).
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 433 பத்தன் முன் என்றது; இது அதன் தொடர்ச்சி.
    eduthukkaattu:
    - text: பன்னிரண்டு
      from: porul.101
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: இரண்டு
    context: பத்து
    ops:
    - ஒற்று_உகர_கெடு
    - ன_இரட்டல்
  links: []
  urai:
    iyaipu:
    - ezhu.433
    - ezhu.463
    text: 'இயைபு (649): 433 பத்தன் முன்; 463 ஒன்பானிலும் "னகாரம் இரட்டும்". எடுத்துக்காட்டு: “பன்னிரண்டு” (பொருள். 101) — பத்து + இரண்டு: பத்தன் ஒற்று கெட்டு னகாரம் இரட்டி.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.435
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 435
  moolam: |-
    ஆயிரம் வரினும் ஆயியல் திரியாது
  kaandigai:
    porul: ஆயிரம் வந்தாலும் அவ்வியல்பு திரியாது.
    ethu: 434 பன்னிரண்டு என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    refs:
    - ezhu.433
    property: ஆயிரம்_வரவிலும்_திரியா
  links: []
  urai:
    iyaipu:
    - ezhu.434
    - ezhu.391
    - ezhu.464
    text: 'இயைபு (649): 434 பத்து; 464 ஆயிரம் வரும்போது முதல் ஈர் எண். "ஆயிரம் வருவழி" (எழு. 391) விதிச் சொல் — எடுத்துக்காட்டு அன்று. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒப்பக் கூறல்
    saanru: ஆயியல்
- id: ezhu.436
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 436
  moolam: |-
    நிறையு மளவும் வரூஉங் காலையுங்
    குறையா தாகும் இன்னென் சாரியை
  kaandigai:
    porul: நிறையும் அளவும் வரும்போதும் இன் சாரியை குறையாது.
    ethu: 435 ஆயிரம் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    contexts:
    - நிறை
    - அளவு
    suffix: இன்
    property: குறையா
  links: []
  urai:
    iyaipu:
    - ezhu.435
    - ezhu.419
    - ezhu.476
    text: 'இயைபு (649): 435 ஆயிரம்; 419 எண் உருபியல்; 476 ஆயிரம் இன். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.437
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 437
  moolam: |-
    ஒன்றுமுத லொன்பான் இறுதி முன்னர்
    நின்ற பத்த னொற்றுக்கெட ஆய்தம்
    வந்திடை நிலையும் இயற்கைத் தென்ப
    கூறிய இயற்கை குற்றிய லுகரம்
    ஆற னிறுதி அல்வழி யான
  kaandigai:
    porul: ஒன்று முதல் ஒன்பது ஈறாக முன் நின்ற பத்தின் ஒற்று கெட்டு ஆய்தம் இடையில் நிற்கும் (பஃது); ஆறின் ஈற்றுக் குற்றியலுகரம் அல்வழியில் கூறிய இயல்பினது.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 433–436 எண் இயல்கள்; ஒன்று முதல் ஒன்பான் இறுதி முன்னர் நின்ற பத்தன் ஒற்றுக்கெட ஆய்தம் வந்து இடை நிலையும், குற்றியலுகரம் ஆறன் இறுதி அல்வழி.
    eduthukkaattu:
    - text: முப்பஃ
      from: ezhu.1
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: எண்_1_9_பத்து
    ops:
    - பத்து_ஒற்று_கெடு
    - ஆய்த_நிலை
    extra: ஆறு_குற்றியலுகரம்
  links: []
  urai:
    iyaipu:
    - ezhu.433
    - ezhu.445
    text: 'இயைபு (649): 433 பத்தன் முன்; 445 "பஃதென் கிளவி". எடுத்துக்காட்டு: “முப்பஃ” (எழு. 1) — பத்தன் ஒற்று (த்) கெட்டு ஆய்தம் இடை நிற்கும்: பத்து → பஃது (எழு. 103-இலும் "…கிருபஃது").'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: கூறிற்று என்றல்
    saanru: கூறிய
- id: ezhu.438
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 438
  moolam: |-
    முதலீ ரெண்ணினொற்று ரகர மாகும்
    உகரம் வருத லாவயி னான
  kaandigai:
    porul: முதல் இரண்டு எண்ணின் (ஒன்று, இரண்டு) ஒற்று ரகாரமாகும்; அவ்விடத்து உகரம் வரும். (விளைவு வடிவம் நூலில் எழுதப்படவில்லை.)
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 433–437 பத்தன் முன் என்றது; இது அதன் தொடர்ச்சி.
    eduthukkaattu:
    - text: இருபத்தைந்து
      from: porul.357
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: எண்_1_2
    ops:
    - ஒற்று→ர
    - உகர_வரவு
  links: []
  urai:
    iyaipu:
    - ezhu.433
    - ezhu.439
    - ezhu.455
    text: 'இயைபு (649): 433 குற்றியலுகரக் கேடு; 439 இரண்டுக்கு இடைநிலை ரகரம் இல்லை; 455 உயிர் முன். எடுத்துக்காட்டு: “இருபத்தைந்து” (பொருள். 357) — இரண்டு → இரு (ஒற்று ரகரமாகி உகரம் வருதல்).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.439
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 439
  moolam: |-
    இடைநிலை ரகரம் இரண்டென் எண்ணிற்கு
    நடைமருங் கின்றே பொருள்வயி னான
  kaandigai:
    porul: இரண்டு என்ற எண்ணுக்கு இடைநிலை ரகாரம் பொருள்வழியில் வழக்கில் இல்லை.
    ethu: 438 முதல் ஈர் எண் என்றது; இடைநிலை ரகரம் இரண்டென் எண்ணிற்கு நடைமருங்கின்றே — பொருள்வயினான்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: எண்_2
    property: இடைநிலை_ரகாரம்_இல்லை
  links: []
  urai:
    iyaipu:
    - ezhu.438
    - ezhu.442
    text: 'இயைபு (649): 438 ரகரம்; 442 நான்கு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.440
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 440
  moolam: |-
    மூன்று மாறும் நெடுமுதல் குறுகும்
  kaandigai:
    porul: மூன்றும் ஆறும் நெடுமுதல் குறுகும்.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 438–439 ஒற்று ரகரம் என்றது; இது அதன் தொடர்ச்சி.
    eduthukkaattu:
    - text: அறுபதிற்று
      from: porul.454
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    items:
    - 3
    - 6
    op: நெடுமுதல்_குறுகு
  links: []
  urai:
    iyaipu:
    - ezhu.441
    - ezhu.460
    text: 'இயைபு (649): 441 மூன்றன் ஒற்று; 460 நூறு முன்னும் இவ்வியல்பே. எடுத்துக்காட்டு: “அறுபதிற்று” (பொருள். 454) — ஆறு + பத்து → அறுபது (நெடுமுதல் ஆ குறுகி அ).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.441
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 441
  moolam: |-
    மூன்ற னொற்றே பகார மாகும்
  kaandigai:
    porul: மூன்றின் ஒற்று பகாரமாகும்.
    ethu: 440 மூன்று என்றது; இது அதன் தொடர்ச்சி.
    eduthukkaattu:
    - text: முப்பஃ தென்ப
      from: ezhu.1
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: மூன்று
    transform: ஒற்று→ப
  links: []
  urai:
    iyaipu:
    - ezhu.440
    - ezhu.437
    text: 'இயைபு (649): 440 நெடுமுதல் குறுக்கம்; 437 பஃது. எடுத்துக்காட்டு: “முப்பஃ தென்ப” (எழு. 1) — மூன்று + பஃது → முப்பஃது (மூன்றன் ஒற்று பகரமாகி, நெடுமுதல் குறுகி).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.442
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 442
  moolam: |-
    நான்க னொற்றே றகார மாகும்
  kaandigai:
    porul: நான்கின் ஒற்று றகாரமாகும்.
    ethu: 441 மூன்றன் ஒற்று என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: நான்கு
    transform: ஒற்று→ற
  links: []
  urai:
    iyaipu:
    - ezhu.441
    - ezhu.443
    - ezhu.453
    text: 'இயைபு (649): 441 மூன்று, 443 ஐந்து; 453 அளவு/நிறை முன் நான்கன் ஒற்று லகாரம். பத்து முன் புணர்ந்த வடிவம் நூலுள் காணவில்லை ("நாற் சொல்" பொருள். 385 பத்து முன் அன்று). எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.443
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 443
  moolam: |-
    ஐந்த னொற்றே மகார மாகும்
  kaandigai:
    porul: ஐந்தின் ஒற்று மகாரமாகும்.
    ethu: 442 நான்கு என்றது; இது அதன் தொடர்ச்சி.
    eduthukkaattu:
    - text: ஐம்பது
      from: porul.464
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: ஐந்து
    transform: ஒற்று→ம
  links: []
  urai:
    iyaipu:
    - ezhu.433
    - ezhu.448
    text: 'இயைபு (649): 433 குற்றியலுகரம் மெய்யொடு கெடும்; 448 அளவு/நிறை முன் மெல்லெழுத்து. எடுத்துக்காட்டு: “ஐம்பது” (பொருள். 464) — ஐந்து + பத்து: து கெட்டு, ஒற்று மகரமாகி.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.444
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 444
  moolam: |-
    எட்ட னொற்றே ணகார மாகும்
  kaandigai:
    porul: எட்டின் ஒற்று ணகாரமாகும். (விளைவு வடிவம் நூலில் எழுதப்படவில்லை.)
    ethu: 443 ஐந்து என்றது; எட்டன் ஒற்றே ணகாரமாகும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: எட்டு
    transform: ஒற்று→ண
  links: []
  urai:
    iyaipu:
    - ezhu.443
    - ezhu.445
    - ezhu.450
    text: 'இயைபு (649): 441–443 பிற எண்ணின் ஒற்று; 450 எட்டன் முன் இயல்பு. "எண் முறை" (எழு. 83) — எண் என்னும் பெயர், எட்டு அன்று. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.445
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 445
  moolam: |-
    ஒன்பான் ஒகரமிசைத் தகரம் ஒற்றும்
    முந்தை யொற்றே ணகாரம் இரட்டும்
    பஃதென் கிளவி ஆய்தபக ரங்கெட
    நிற்றல் வேண்டும் ஊகாரக் கிளவி
    ஒற்றிய தகரம் றகர மாகும்
  kaandigai:
    porul: 'ஒன்பது பத்தோடு: ஒகரத்தின் மேல் தகரம் ஒற்றும்; முந்தை ஒற்று ணகாரம் இரட்டும்; பஃது ஆய்தமும் பகரமும் கெட ஊகாரம் நிற்கும்; ஒற்றிய தகரம் றகரமாகும். ஐந்து படியும் நூலில் நேரடியாக; விளைவு வடிவம் நூலில் எழுதப்படவில்லை.'
    en:
      kooruvathu: 5
      enniyathu: 5
    ethu: 444 எட்டு என்றது; ஒன்பான் ஒகரமிசைத் தகரம் ஒற்றும், முந்தை ஒற்றே ணகாரம் இரட்டும்; பஃது என்னும் கிளவி ஆய்தபகரங்கெட நிற்றல் வேண்டும்; ஊகாரக் கிளவியின் ஒற்றிய தகரம் றகரமாகும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: ஒன்பது+பத்து
    steps: 5
    steps_desc:
    - தகர_ஒற்று
    - ண_இரட்டல்
    - ஆய்த_ப_கெடு
    - ஊ_நிலை
    - த→ற
  links: []
  urai:
    iyaipu:
    - ezhu.444
    - ezhu.461
    - ezhu.463
    text: 'இயைபு (649): 437 பஃது; 463 நூறு முன் ஒன்பான் முதனிலை. புணர்ந்த வடிவம் நூலுள் காணவில்லை ("ஒன்பஃது" எழு. 82 நிலைமொழியே). எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஆணை கூறல்
    saanru: வேண்டும்
- id: ezhu.446
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 446
  moolam: |-
    அளந்தறி கிளவியும் நிறையின் கிளவியுங்
    கிளந்த இயல தோன்றுங் காலை
  kaandigai:
    porul: அளவுப்பெயரும் நிறைப்பெயரும் தோன்றும்போது கூறிய இயல்பின.
    ethu: 440–445 எண் இயல்கள்; அளந்தறி கிளவியும் நிறையின் கிளவியும் கிளந்த இயல தோன்றுங்காலை.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    classes:
    - அளவுப்பெயர்
    - நிறைப்பெயர்
    analogy: ezhu.433
  links: []
  urai:
    iyaipu:
    - ezhu.436
    - ezhu.440
    - ezhu.447
    text: 'இயைபு (649): 436 இன் சாரியை; 440 மூன்று; 447 மூன்றன் ஒற்று தொக்கும். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: கூறிற்று என்றல்
    saanru: கிளந்த
- id: ezhu.447
  pindam: 1
