    - ezhu.448
  links: []
  urai:
    iyaipu:
    - ezhu.448
    - ezhu.19
    text: 'இயைபு (649): 448 ஐந்தன் ஒற்று; 19 வல்லெழுத்து. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.450
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 450
  moolam: |-
    நமவ என்னும் மூன்றோடு சிவணி
    யகரம் வரினும் எட்டன்மு னியல்பே
  kaandigai:
    porul: ந, ம, வ மூன்றோடு பொருந்தி யகரம் வந்தாலும் எட்டின் முன் இயல்பு.
    ethu: 449 கசதப என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: எட்டு
    contexts:
    - ந
    - ம
    - வ
    - ய
    property: இயல்பு
  links:
  - ezhu.444
  urai:
    iyaipu:
    - ezhu.449
    - ezhu.444
    text: 'இயைபு (649): 449 கசதப; 444 எட்டன். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.451
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 451
  moolam: |-
    ஐந்தும் மூன்றும் நமவரு காலை
    வந்த தொக்கும் ஒற்றியல் நிலையே
  kaandigai:
    porul: ஐந்தும் மூன்றும் ந, ம வரும்போது வந்த எழுத்தோடு ஒக்கும்; ஒற்று இயல் நிலை.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 450 நமவ என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entities:
    - 5
    - 3
    contexts:
    - ந
    - ம
    ops:
    - வந்தது_ஒப்பு
    - ஒற்று_இயல்நிலை
  links: []
  urai:
    iyaipu:
    - ezhu.450
    - ezhu.443
    - ezhu.441
    text: 'இயைபு (649): 450 நமவ; 443 ஐந்து; 441 மூன்று. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.452
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 452
  moolam: |-
    மூன்ற னொற்றே வகரம் வருவழித்
    தோன்றிய வகரத் துருவா கும்மே
  kaandigai:
    porul: மூன்றின் ஒற்று வகரம் வரும் இடத்து அவ்வகர உருவாகும்.
    ethu: 451 ஐந்தும் மூன்றும் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: மூன்று
    context: வ
    transform: ஒற்று→வ
  links: []
  urai:
    iyaipu:
    - ezhu.451
    - ezhu.456
    - ezhu.466
    text: 'இயைபு (649): 451 ஐந்தும் மூன்றும்; 456 வகர இயற்கை; 466 வகாரம். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.453
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 453
  moolam: |-
    நான்க னொற்றே லகார மாகும்
  kaandigai:
    porul: (அளவுப் பெயர், நிறைப் பெயர் முன் — 446-இலிருந்து தொடரும் பகுதி) நான்கின் ஒற்று லகாரமாகும் (எவ்விடம் என்பது அண்மை நூற்பாவால் மட்டும்; ஒருதலை அன்மை). இதே நூற்பா 467-இலும் வருகிறது.
    ethu: 452 மூன்றன் ஒற்று என்றது; நான்கன் ஒற்றே லகாரமாகும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: நான்கு
    transform: ஒற்று→ல
  links: []
  urai:
    iyaipu:
    - ezhu.452
    - ezhu.442
    - ezhu.467
    text: 'இயைபு (649): 452 மூன்று; 442 நான்கு → ற; 467 நான்கு → ல. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.454
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 454
  moolam: |-
    ஐந்த னொற்றே முந்தையது கெடுமே
  kaandigai:
    porul: ஐந்தின் ஒற்று முந்தையது கெடும்.
    ethu: 453 நான்கன் ஒற்று என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: ஐந்து
    op: முந்தையது_கெடு
  links:
  - ezhu.448
  urai:
    iyaipu:
    - ezhu.453
    - ezhu.443
    text: 'இயைபு (649): 453 நான்கு; 443 ஐந்து → ம. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.455
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 455
  moolam: |-
    முதலீ ரெண்ணின் முன் உயிர்வரு காலைத்
    தவலென மொழிப உகரக் கிளவி
    முதனிலை நீட லாவயி னான
  kaandigai:
    porul: முதல் இரண்டு எண் முன் உயிர் வந்தால் உகரம் கெடும்; அவ்விடத்து முதல் நிலை நீளும்.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 454 ஐந்தன் என்றது; முதல் ஈர் எண்ணின் முன் உயிர் வரு காலைத் தவல் என மொழிப உகரக் கிளவி — முதனிலை நீடலாவயினான்.
    eduthukkaattu:
    - text: ஓரள பிசைக்குங்
      from: ezhu.3
    - text: ஈரள பிசைக்கும்
      from: ezhu.4
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: எண்_1_2
    context: உயிர்
    ops:
    - உகர_கெடு
    - முதனிலை_நீடு
  links: []
  urai:
    iyaipu:
    - ezhu.454
    - ezhu.438
    text: 'இயைபு (649): 454 ஐந்து; 438 முதல் ஈர் எண். எடுத்துக்காட்டு: “ஓரள பிசைக்குங்” (எழு. 3), “ஈரள பிசைக்கும்” (எழு. 4) — ஒன்று/இரண்டு + அளபு — உகரம் கெட்டு முதனிலை நீண்டது.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
- id: ezhu.456
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 456
  moolam: |-
    மூன்றும் நான்கும் ஐந்தென் கிளவியுந்
    தோன்றிய வகரத் தியற்கை யாகும்
  kaandigai:
    porul: மூன்று, நான்கு, ஐந்து — வகரத்தின் (452–454) இயல்பினவாகும்.
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: 455 முதலீர் என்றது; மூன்றும் நான்கும் ஐந்தென் கிளவியும் தோன்றிய வகரத் தியற்கையாகும்.
    eduthukkaattu:
    - text: மூவள பிசைத்தல்
      from: ezhu.5
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entities:
    - 3
    - 4
    - 5
    analogy:
    - ezhu.452
    - ezhu.453
    - ezhu.454
  links: []
  urai:
    iyaipu:
    - ezhu.455
    - ezhu.452
    text: 'இயைபு (649): 455 முதலீர்; 452 வகரம். எடுத்துக்காட்டு: “மூவள பிசைத்தல்” (எழு. 5) — மூன்று + அளபு — வகரத்து இயற்கை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.457
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 457
  moolam: |-
    மூன்றன் முதனிலை நீடலு முரித்தே
    உழக்கென் கிளவி வழக்கத் தான
  kaandigai:
    porul: '"உழக்கு" வரும்போது மூன்றின் முதல் நிலை நீளுதலும் வழக்கில் உண்டு.'
    ethu: 456 மூன்று என்றது; மூன்றன் முதனிலை நீடலும் உரித்தே — உழக்கென் கிளவி வழக்கத்தான.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    entity: மூன்று
    context: உழக்கு
    op: முதனிலை_நீடு
    evidence: வழக்கு
  links: []
  urai:
    iyaipu:
    - ezhu.456
    - ezhu.440
    text: 'இயைபு (649): 456 வகரம்; 440 மூன்று. “உழக்கென் கிளவி வழக்கத்தான” — எது என வழக்கறிவு — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; “உழக்கென் கிளவி வழக்கத்தான” ஒருதலை அன்மை
- id: ezhu.458
  pindam: 1
  padalam: ezhuthu
  othu: 9
  sutra: 458
  moolam: |-
    ஆறென் கிளவி முதல்நீ டும்மே
  kaandigai:
    porul: ஆறு முதல் நீளும்.
    ethu: 457 மூன்றன் முதனிலை நீடல் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: ஆறு
    op: முதல்_நீடு
  links: []
  urai:
