    porul: (447, 448) க, ச, த, ப முதல் மொழி வரும் காலத்து.
    ethu: 448 ஐந்தன் ஒற்று என்றது; கசதப முதன்மொழி வரூஉங்காலை (வல்லினம் தொடங்கும் மொழி வரும்போது).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    context:
    - க
    - ச
    - த
    - ப
    refs:
