    text: 'இயைபு (649): 294 உருபியல் நிலை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.294
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 294
  moolam: |-
    உருபியல் நிலையும் மொழியுமா ருளவே
    ஆவயின் வல்லெழுத் தியற்கை யாகும்
  kaandigai:
    porul: உருபியல் நிலையும் மொழிகளும் உள (180); அவ்விடத்து வல்லெழுத்து இயல்பு.
    ethu: 289–293 ஓ-ஈற்றுக்குச் சொன்னவை; உருபியல் நிலையும் மொழியுமார் உளவே, வல்லெழுத்து இயற்கையாகும்.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    class: ஓகார_ஈறு
    refs:
    - ezhu.180
  links: []
  urai:
    iyaipu:
    - ezhu.289
    - ezhu.293
    - ezhu.250
    text: 'இயைபு (649): 250 வல்லெழுத்து இயற்கை; 293 இல்லொடு. “மொழியுமார் உளவே” — எவை என நூல் பெயரிடவில்லை — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; “மொழியுமார் உளவே” ஒருதலை அன்மை
- id: ezhu.295
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 295
  moolam: |-
    ஔகார இறுதிப் பெயர்நிலை முன்னர்
    அல்வழி யானும் வேற்றுமைக் கண்ணும்
    வல்லெழுத்து மிகுதல் வரைநிலை யின்றே
    அவ்விரு ஈற்றும் உகரம் வருதல்
    செவ்வி தென்ப சிறந்திசி னோரே
  kaandigai:
    porul: ஔகார ஈற்றுப் பெயர் முன் அல்வழியிலும் வேற்றுமையிலும் வல்லெழுத்து மிகுதல் விலக்கில்லை; இரு புணர்ச்சியிலும் உகரம் வருதல் செவ்விது (கௌவு).
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 70 'கவவோ டியையின் ஔவு மாகும்' என ஔ மொழியிறுதி ஆகும் என்றது; இது அதன் தொடர்ச்சி.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    class: ஔகார_ஈறு
    contexts:
    - அல்வழி
    - வேற்றுமை
    ops:
    - வல்லின_மிகுதல்
    - உகர_வரவு
    othu_end: true
  links:
  - ezhu.289
  urai:
    iyaipu:
    - ezhu.70
    - ezhu.112
    - ezhu.173
    - ezhu.296
    text: 'இயைபு (649): 70 ஔ மொழியிறுதி ஆதல்; 112 அல்வழி, வேற்றுமை என்ற இரு புணர்ச்சி; 173 ஔ ஈற்று நிலைமொழிக்கு உருபின் முன் இன் சாரியை; 296 ''உகரம் வருதல் ஆவயி னான'' — ஞகார ஈற்றுக்கும் அதே முடிபு. ''வரைநிலை யின்றே'' — இசைவு (வரையறை இன்மை). ''அவ்விரு ஈற்றும்'' அல்வழி, வேற்றுமை என்ற இரு புணர்ச்சியைச் சுட்டுவதாகக் கொள்வது முந்தைய இரு அடியின் வரிசையால் — ஒருதலை அன்மை. ஔகார ஈற்றுப் பெயர் உகரம் பெற்றுப் புணர்ந்த வடிவம் நூலுள் இல்லை — எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'அவ்விரு ஈற்றும்' ஒருதலை அன்மை
