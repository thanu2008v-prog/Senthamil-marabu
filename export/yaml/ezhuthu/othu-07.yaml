# இக்கோப்பு data_v2-இலிருந்து உருவானது. 'moolam' (சூத்திரம்) திருத்தக் கூடாது (பொருள். 652).
- id: ezhu.203
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 203
  moolam: |-
    அகர இறுதிப் பெயர்நிலை முன்னர்
    வேற்றுமை யல்வழிக் கசதபத் தோன்றின்
    தத்தம் ஒத்த ஒற்றிடை மிகுமே
  kaandigai:
    porul: அகர ஈற்றுப் பெயர் முன் அல்வழியில் க, ச, த, ப வந்தால் தத்தம் ஒத்த ஒற்று இடைமிகும்.
    en:
      kooruvathu: 4
      enniyathu: 4
    ethu: 'புணர்ச்சியில் "மிகுதல்" திரிபுகளுள் ஒன்று (எழு. 109: "மெய்ப்பிறி தாதல் மிகுதல் குன்றலென்று"); உயிரீற்றின் முன் வல்லெழுத்து மிகுதல் முதலில் அகர ஈற்றுக்குக் கூறப்படுகிறது. பிற உயிர்கள் இதனோடு மாட்டேற்றப்படுகின்றன — "ஆகார இறுதி அகர இயற்றே" (எழு. 221).'
    eduthukkaattu:
    - text: மெய்ப்பிறி தாதல் மிகுதல் குன்றலென்று
      from: ezhu.109
    - text: ஆகார இறுதி அகர இயற்றே
      from: ezhu.221
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: அகர_ஈறு
    context:
    - க
    - ச
    - த
    - ப
    op: ஒற்று_இடைமிகுதல்
    count: 4
  links:
  - ezhu.204
  - ezhu.215
  - ezhu.217
  urai:
    iyaipu:
    - ezhu.204
    - ezhu.210
    - ezhu.217
    text: 'இயைபு (649): எழு. 204, 210, 217 · உயிர்மயங்கியலின் நுதலியது. "வேற்றுமை யல்வழி" — அல்வழி (112-இலும் இதே பெயர்). பிற உயிர்கள் இதனோடு மாட்டேற்றால் இணைகின்றன: ஆ (221), உ (254) → அ; ஈ (249), ஊ (264) → ஆ; ஏ (274) → ஊ; ஓ (289) → ஏ. விலக்குகள்: 204 (மிகும்), 210 (இயல்பு), 217 (மரப்பெயர் — மெல்லெழுத்து).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.204
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 204
  moolam: |-
    வினையெஞ்சு கிளவியும் உவமக் கிளவியும்
    எனவென் எச்சமும் சுட்டின் இறுதியும்
    ஆங்க என்னும் உரையசைக் கிளவியும்
    ஞாங்கர்க் கிளந்த வல்லெழுத்து மிகுமே
  kaandigai:
    porul: வினையெச்சம், உவமச்சொல், "என" எச்சம், சுட்டின் ஈறு, "ஆங்க" என்ற உரையசை — இவற்றின் முன்னும் வல்லெழுத்து மிகும்.
    en:
      kooruvathu: 5
      enniyathu: 5
    ethu: 203 அகர ஈற்றுப் பெயருக்கே ஒற்றுமிகுதி சொன்னது; இது அதன் தொடர்ச்சி.
    eduthukkaattu:
    - text: எனச் சொல்லிய
      from: porul.5
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: வல்லெழுத்து_மிகு_சொற்கள்
    count: 5
    items:
    - வினையெச்சம்
    - உவமை
    - என_எச்சம்
    - சுட்டு_ஈறு
    - ஆங்க_உரையசை
  links:
  - ezhu.203
  urai:
    iyaipu:
    - ezhu.203
    - ezhu.205
    - ezhu.207
    - sol.210
    text: 'இயைபு (649): சொல். 210 “செய்த என்னும் பெயரெஞ்சுகிளவியும்” முதலியன இவ்வினங்களைக் காட்டுகின்றன. எடுத்துக்காட்டு: "எனச் சொல்லிய" (பொருள். 5) — என (எச்சம்) + சொல்லிய → ச் மிகுதல்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: கூறிற்று என்றல்
    saanru: கிளந்த
- id: ezhu.205
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 205
  moolam: |-
    சுட்டின் முன்னர் ஞநமத் தோன்றின்
    ஒட்டிய ஒற்றிடை மிகுதல் வேண்டும்
  kaandigai:
    porul: சுட்டின் முன் ஞ, ந, ம தோன்றினால் ஒட்டிய ஒற்று இடைமிகுதல் வேண்டும்.
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: 203 வல்லினத் தொடர்ச்சிக்கே ஒற்றுமிகுதி சொன்னது; சுட்டின் (அ/இ/உ) முன் ஞ/ந/ம வரும்போதும் ஒற்றிடை மிகும்.
    eduthukkaattu:
    - text: அம்முறை
      from: ezhu.156
    - text: அந்நிலை
      from: ezhu.162
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: சுட்டு_முன்
    context:
    - ஞ
    - ந
    - ம
    op: ஒற்று_இடைமிகுதல்
  links: []
  urai:
    iyaipu:
    - ezhu.204
    - ezhu.206
    - ezhu.238
    text: 'இயைபு (649): 204 "சுட்டின் இறுதி" வல்லெழுத்து மிகும் என்றது; 205 மெல்லெழுத்து ஞ ந ம வரினும் ஒற்று மிகும் என நீட்டுகிறது; 206, 207 ய வ, உயிர் வரும்போது. 238, 255 இ, உ சுட்டுக்கும் இதே. எடுத்துக்காட்டு: "அம்முறை" (எழு. 156) — அ + முறை; "அந்நிலை" (எழு. 162) — அ + நிலை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஆணை கூறல்
    saanru: வேண்டும்
- id: ezhu.206
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 206
  moolam: |-
    யவமுன் வரினே வகரம் ஒற்றும்
  kaandigai:
    porul: ய, வ முன் வந்தால் வகரம் ஒற்றும்.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 205 சுட்டு முன் ஞ ந ம வரின் ஒற்று மிகும் என்றது; இது அதன் தொடர்ச்சி.
    eduthukkaattu:
    - text: அவ்வயின்
      from: porul.656
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    context:
    - ய
    - வ
    insert: வ
    op: ஒற்று
  links: []
  urai:
    iyaipu:
    - ezhu.204
    - ezhu.205
    - ezhu.207
    text: 'இயைபு (649): 204–207 சுட்டின் இறுதித் தொகுதி. எடுத்துக்காட்டு: "ஒன்ற அவ்வயின்" (பொருள். 656) — அ + வயின் → அவ்வயின்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.207
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 207
  moolam: |-
    உயிர்முன் வரினும் ஆயியல் திரியாது
  kaandigai:
    porul: 'சுட்டின் முன் உயிர் வந்தாலும் அவ்வியல்பு (206: வகர ஒற்று) திரியாது. "ஆயியல்" எதைச் சுட்டுகிறது என நூற்பா பெயரிடவில்லை; அண்மை நூற்பா 206 (ஒருதலை அன்மை). இதே நூற்பா 394-இலும் வருகிறது; அங்கே சுட்டுவது வேறு.'
    ethu: 206 ய, வ முன் வகர ஒற்று என்றது; உயிர் வரினும் அவ்வியல்பு (வகர ஒற்று) திரியாது — "ஆயியல்" = 206-இன் இயல்பு.
    eduthukkaattu:
    - text: அவ்வியல்
      from: ezhu.222
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    refs:
    - ezhu.206
    - ezhu.394
    property: உயிர்_முன்_திரியா
  links: []
  urai:
    iyaipu:
    - ezhu.206
    - ezhu.205
    text: 'இயைபு (649): "ஆயியல் திரியாது" — 206-இன் வகர ஒற்று உயிர் முன்னும் நிற்கும் (மாட்டேறு). எடுத்துக்காட்டு: "அவ்வியல் திரியா" (எழு. 222) — அ + இயல் → அவ்வியல்; அதே வடிவம் எழு. 12, 127, 138, 242.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒப்பக் கூறல்
    saanru: ஆயியல்
- id: ezhu.208
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 208
  moolam: |-
    நீட வருதல் செய்யுளுள் ளுரித்தே
  kaandigai:
    porul: (சுட்டு) நீண்டு வருதல் செய்யுளில் உரியது.
    ethu: 204–207 அகர ஈற்றுச் சுட்டின் புணர்ச்சி கூறின; அச்சுட்டு செய்யுளில் நீண்டும் வரும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: சுட்டு_நீட்சி
    context: செய்யுள்
  links: []
  urai:
    iyaipu:
    - ezhu.204
    - ezhu.205
    text: 'இயைபு (649): 204–207 சுட்டுத் தொகுதியின் செய்யுள் வழி; 212, 234 செய்யுள் நீட்டத்தின் பிற இடங்கள். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.209
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 209
  moolam: |-
    சாவ என்னுஞ் செயவென் எச்சத்
    திறுதி வகரங் கெடுதலும் உரித்தே
  kaandigai:
    porul: '"சாவ" என்ற செயவெனெச்சத்தின் இறுதி வகரம் கெடுதலும் உரியது.'
    ethu: 204 வினையெஞ்சு வல்லெழுத்து மிகும் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: சாவ
    transform: வகர_கெடுதல்
  links: []
  urai:
    iyaipu:
    - ezhu.203
    - ezhu.205
    - ezhu.211
    text: 'இயைபு (649): 205 சுட்டு-முன் மிகுதி; 209 வகரக்கேடு (மிகுதி அன்று). எடுத்துக்காட்டு (“சாவ → சா”) நூலுள் காணவில்லை.'
    vagai: விலக்கு
    vilakkukkuriyathu:
    - ezhu.204
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: உரித்தே
- id: ezhu.210
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 210
  moolam: |-
    அன்ன வென்னும் உவமக் கிளவியும்
    அண்மை சுட்டிய விளிநிலைக் கிளவியுஞ்
    செய்ம்மன வென்னுந் தொழிலிறு சொல்லும்
    ஏவல்கண்ணிய வியங்கோட் கிளவியுஞ்
    செய்த என்னும் பெயரெஞ்சு கிளவியும்
    செய்யிய என்னும் வினையெஞ்சு கிளவியும்
    அம்ம என்னும் உரைப்பொருட் கிளவியும்
    பலவற் றிறுதிப் பெயர்க்கொடை உளப்பட
    அன்றி அனைத்தும் இயல்பென மொழிப
  kaandigai:
    porul: '"அன்ன" உவமச்சொல், அண்மை விளி, "செய்ம்மன" தொழிற்சொல், ஏவல் வியங்கோள், "செய்த" பெயரெச்சம், "செய்யிய" வினையெச்சம், "அம்ம" உரைப்பொருள், பலவற்றின் ஈற்றுப் பெயர் — இவற்றின் முன் வல்லெழுத்து மிகாது, இயல்பு (203–204 விதிக்கு விலக்கு). "அன்றி அனைத்தும்" என்பது "இவையும் இவைபோல்வன பிறவும்" என்ற பொருளா என்பது ஒருதலை அன்று.'
    en:
      kooruvathu: 8
      enniyathu: 8
    ethu: 203–205 ஒற்றுமிகுதி/வல்லின மிகுதி சொன்னன; அன்ன (உவமை), விளிநிலை, செய்ம்மன, வியங்கோள், செய்த/செய்யிய எச்சம், அம்ம (உரைப்பொருள்), பலவற்றிறுதி — இவை இயல்பாகவே (மாற்றமின்றி) நிற்கும்.
    eduthukkaattu:
    - text: அன்ன பிறவும்
      from: sol.75
  nilai: ஒருதலை அன்மை
  kanini:
    kind: enumeration
    class: இயல்பு_விலக்கு
    count: 8
    items:
    - அன்ன
    - அண்மை_விளி
    - செய்ம்மன
    - ஏவல்_வியங்கோள்
    - செய்த_பெயரெச்சம்
    - செய்யிய_வினையெச்சம்
    - அம்ம
    - பல_ஈற்றுப்பெயர்
  links:
  - ezhu.204
  urai:
    iyaipu:
    - ezhu.203
    - ezhu.211
    - ezhu.224
    text: 'இயைபு (649): 204 உவமக் கிளவியும் வினையெஞ்சும் மிகும் என்றது; 210 "அன்ன" உவமமும் "செய்யிய" வினையெஞ்சும் முதலியன இயல்பு என விலக்குகிறது. 211 இதற்கு விலக்கு; 224 ஆகார ஈற்றுக்கு இதே "அனைத்தும் இயல்பென". எடுத்துக்காட்டு: "அன்ன பிறவும்" (சொல். 75) — அன்ன + பிறவும், பகரம் மிகவில்லை.'
    vagai: விலக்கு
    vilakkukkuriyathu:
    - ezhu.203
    - ezhu.204
    thunivu: நூலில் நேரடியாக; காண்டிகை சுட்டிய ஐயம் ஒருதலை அன்மை
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
- id: ezhu.211
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 211
  moolam: |-
    வாழிய என்னுஞ் செயவென் கிளவி
    இறுதி அகரங் கெடுதலும் உரித்தே
  kaandigai:
    porul: '"வாழிய" என்ற செயவெனெச்சத்தின் இறுதி அகரம் கெடுதலும் உரியது (வாழி).'
    ethu: 210 அன்ன முதலியவை இயல்பெனச் சொன்னது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: வாழிய
    transform: அகர_கெடுதல்
  links: []
  urai:
    iyaipu:
    - ezhu.210
    - ezhu.209
    text: 'இயைபு (649): 209 வகரக்கேடு; 211 அகரக்கேடு (இரண்டும் இயல்புக்கு விலக்கு). எடுத்துக்காட்டு (“வாழிய→வாழி”) நூலுள் காணவில்லை.'
    vagai: விலக்கு
    vilakkukkuriyathu:
    - ezhu.210
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: உரித்தே
- id: ezhu.212
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 212
  moolam: |-
    உரைப்பொருட் கிளவி நீட்டமும் வரையார்
  kaandigai:
    porul: உரைப்பொருட் கிளவி நீளுதலும் விலக்கார்.
    ethu: 208 செய்யுளில் நீட்டம் அனுமதித்தது; உரைப்பொருட் கிளவிக்கும் நீட்டம் வரையார் (எல்லை இல்லை).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: உரைப்பொருட்_கிளவி
    op: நீட்சி_வரையார்
  links: []
  urai:
    iyaipu:
    - ezhu.208
    - ezhu.213
    text: 'இயைபு (649): 208 பொது; 213 இதன் விளைவு (நீடுமொழி உளவே). எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: வரையார்
- id: ezhu.213
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 213
  moolam: |-
    பலவற் றிறுதி நீடுமொழி உளவே
    செய்யுள் கண்ணிய தொடர்மொழி யான
  kaandigai:
    porul: பலவற்றின் ஈறு செய்யுள் தொடர்மொழியில் நீளுதலும் உண்டு.
    ethu: 212 நீட்டம் அனுமதித்தது; செய்யுள் கண்ணிய பலவற்றிறுதி நீடுமொழிகளும் உள.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: பல_ஈறு
    context: செய்யுள்_தொடர்மொழி
    op: நீட்சி
  links: []
  urai:
    iyaipu:
    - ezhu.210
    - ezhu.212
    - sol.218
    text: 'இயைபு (649): பலவற்றிறுதி — 210, 220; "பலவற்றுப் படர்க்கை" (சொல். 218). எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.214
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 214
  moolam: |-
    தொடரல் இறுதி தம்முன் தாம்வரின்
    லகரம் றகரவொற் றாகலு முரித்தே
  kaandigai:
    porul: '"தொடரல்" இறுதி தம்முன் தாம் வந்தால் லகரம் றகர ஒற்றாதலும் உரியது.'
    ethu: தம்முன் தாம் வருதல் உடனிலை (எழு. 30); லகரம் இரட்டும் இடத்து றகர ஒற்றாக மாறுதல் "மெய்ப்பிறி தாதல்" (எழு. 109) என்ற திரிபு. "உரித்தே" — மாறாமலும் நிற்கலாம்; அடுத்த சூத்திரம் "வல்லெழுத் தியற்கை உறழத் தோன்றும்" (எழு. 215).
    eduthukkaattu:
    - text: மெய்ப்பிறி தாதல்
      from: ezhu.109
    - text: வல்லெழுத் தியற்கை உறழத் தோன்றும்
      from: ezhu.215
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: தொடரல்
    transform: ல→ற
    context: தம்_முன்
  links: []
  urai:
    iyaipu:
    - ezhu.203
    - ezhu.215
    text: 'இயைபு (649): 203 அகர ஈற்று வல்லொற்று மிகுதி; 214 தம்முன் தாம் வரும் தொடரலின் லகரம் றகர ஒற்றாதல்; 215 அப்போது வல்லெழுத்து உறழ்தல். எடுத்துக்காட்டு (“பல + தம்” போன்ற வடிவம்) நூலுள் காணவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.215
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 215
  moolam: |-
    வல்லெழுத் தியற்கை உறழத் தோன்றும்
  kaandigai:
    porul: வல்லெழுத்து இயல்பு உறழ்ந்து தோன்றும்.
    ethu: 214 லகரம் றகர ஒற்றாகும் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: அகர_ஈறு
    property: வல்லெழுத்து_உறழ்
  links: []
  urai:
    iyaipu:
    - ezhu.214
    - ezhu.196
    - ezhu.197
    text: 'இயைபு (649): 196–197 நெட்டெழுத்து ஒற்றுமிகுதி இயற்கை/செயற்கை; 215 அதுபோல வல்லெழுத்து இயற்கை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: உறழத்
- id: ezhu.216
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 216
  moolam: |-
    வேற்றுமைக் கண்ணும் அதனோ ரற்றே
  kaandigai:
    porul: (அகர ஈற்றுப் பகுதி) வேற்றுமையிலும் அவ்வாறே — அண்மை நூற்பா 215 (வல்லெழுத்து உறழ்ச்சி); சுட்டுவது அதுவே என நூல் பெயரிடவில்லை (ஒருதலை அன்மை). இதே நூற்பா 225, 252, 259, 266, 276-இலும் வருகிறது; ஒவ்வோர் இடத்திலும் அந்த ஈற்றுப் பகுதியின் முன் விதியைச் சுட்டும்.
    ethu: 214–215 அல்வழியில் சொன்ன திரிபு; வேற்றுமைக் கண்ணும் அவ்வாறே.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    refs:
    - ezhu.215
    context: வேற்றுமை
    property: 215_விதி
  links: []
  urai:
    iyaipu:
    - ezhu.214
    - ezhu.225
    - ezhu.252
    - ezhu.259
    - ezhu.266
    - ezhu.276
    - ezhu.292
    text: 'இயைபு (649): 225, 252, 259, 266, 276, 292 — இதே “அதனோ ரற்றே” வேற்றுமைத் தொடர்ச்சி. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.217
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 217
  moolam: |-
    மரப்பெயர்க் கிளவி மெல்லெழுத்து மிகுமே
  kaandigai:
    porul: (அகர ஈற்று) மரப்பெயர் மெல்லெழுத்து மிகும்.
    ethu: 203 அகர ஈற்றுப் பெயர் முன் வல்லெழுத்து வரின் தத்தம் வல்லொற்று மிகும் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: அகர_மரப்பெயர்
    op: மெல்லினம்_மிகு
  links: []
  urai:
    iyaipu:
    - ezhu.214
    - ezhu.243
    - ezhu.245
    - ezhu.262
    - ezhu.278
    text: 'இயைபு (649): 243 உதிமரம், 245 ஏனைப் புளிப்பெயர், 262 ஒடுமரம், 278 சே மரம் — இவை மரப்பெயர் மெல்லெழுத்து மிகுதியின் வரிசை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விலக்கு
    thunivu: நூலில் நேரடியாக
    vilakkukkuriyathu:
    - ezhu.203
- id: ezhu.218
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 218
  moolam: |-
    மகப்பெயர்க் கிளவிக் கின்னே சாரியை
  kaandigai:
    porul: மகப்பெயருக்கு இன் சாரியை.
    ethu: 112 சாரியையால் புணர்தல் சொன்னது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: மகப்பெயர்
    suffix: இன்
  links: []
  urai:
    iyaipu:
    - ezhu.219
    - ezhu.220
    - ezhu.119
    text: 'இயைபு (649): 119 இன் சாரியைப் பட்டியலில் “இன்னே”; 219 அத்து வரினும் வரைநிலை இன்மை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.219
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 219
  moolam: |-
    அத்தவண் வரினும் வரைநிலை இன்றே
  kaandigai:
    porul: அத்து வந்தாலும் விலக்கில்லை.
    ethu: 218 மகப்பெயர்க்கு இன் சாரியை என்றது; அத்தும் அவ்விடத்து வரினும் வரைநிலை இல்லை (விலக்கு + விதி).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    context: அத்து_வரவு
    property: விலக்கில்லை
  links: []
  urai:
    iyaipu:
    - ezhu.218
    - ezhu.220
    - ezhu.119
    text: 'இயைபு (649): 119 அத்து, இன் இரண்டையும் பட்டியலிடுகிறது; 219 “வரைநிலை இன்றே” — கட்டுப்பாடு இல்லை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி-விலக்கு
    vilakkukkuriyathu:
    - ezhu.218
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: வரைநிலை இன்றே
- id: ezhu.220
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 220
  moolam: |-
    பலவற் றிறுதி உருபியல் நிலையும்
  kaandigai:
    porul: பலவற்றின் ஈறு உருபியல் நிலையும் (எழு. 174).
    ethu: 218–219 சாரியை விதிகளைச் சொன்னது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: பல_ஈறு
    context: உருபியல்
    refs:
    - ezhu.174
  links: []
  urai:
    iyaipu:
    - ezhu.219
    - ezhu.235
    - ezhu.281
    text: 'இயைபு (649): 235 இ-ஈறு, 281 ஐ-ஈறு — உருபியல் நிலைத் தொடர்ச்சி. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.221
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 221
  moolam: |-
    ஆகார இறுதி அகர இயற்றே
  kaandigai:
    porul: ஆகார ஈறு அகர ஈற்றின் இயல்பினது.
    ethu: 203–220 அகர ஈற்றின் விதிகள்; ஆகார ஈறும் அவற்றின் இயல்பையே பெறும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ஆகார_ஈறு
    inherits: அகர_ஈறு_இயல்பு
  links: []
  urai:
    iyaipu:
    - ezhu.203
    - ezhu.218
    - ezhu.234
    text: 'இயைபு (649): 203–220 அகர ஈறு விதிகளின் நீட்சி. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒப்பக் கூறல்
    saanru: இயற்றே
- id: ezhu.222
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 222
  moolam: |-
    செய்யா என்னும் வினையெஞ்சு கிளவியும்
    அவ்வியல் திரியா தென்மனார் புலவர்
  kaandigai:
    porul: '"செய்யா" என்ற வினையெச்சமும் அவ்வியல்பு திரியாது.'
    ethu: 203–221 அகர ஈற்று விதிகளைச் சொன்னது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: செய்யா
    property: இயல்பு_திரியா
  links: []
  urai:
    iyaipu:
    - ezhu.203
    - ezhu.205
    text: 'இயைபு (649): 205 சுட்டு-முன் மிகுதி; 222 வினையெஞ்சு-செய்யா இயல்பு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: புலவர்
  - peyar: இறந்தது காத்தல்
    saanru: அவ்வியல்
- id: ezhu.223
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 223
  moolam: |-
    உம்மை எஞ்சிய இருபெயர்த் தொகைமொழி
    மெய்ம்மை யாக அகரம் மிகுமே
  kaandigai:
    porul: உம்மைத் தொகையில் (இருபெயர்) அகரம் மிகும்.
    ethu: 203 அகர ஈற்றுப் பெயருக்கு ஒற்றுமிகுதி சொன்னது; உம்மை எஞ்சிய இருபெயர்த் தொகைமொழியில் அகரம் மெய்ம்மையாக மிகும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: உம்மைத்தொகை
    op: அகர_மிகுதல்
  links: []
  urai:
    iyaipu:
    - ezhu.203
    - ezhu.204
    - sol.417
    text: 'இயைபு (649): சொல். 417 உம்மைத்தொகை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.224
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 224
  moolam: |-
    ஆவும் மாவும் விளிப்பெயர்க் கிளவியும்
    யாவென் வினாவும் பலவற் றிறுதியும்
    ஏவல் குறித்த உரையசை மியாவுந்
    தன்தொழில் உரைக்கும் வினாவின் கிளவியோ
    டன்றி அனைத்தும் இயல்பென மொழிப
  kaandigai:
    porul: ஆ, மா, விளிப்பெயர், யா வினா, பலவற்றின் ஈறு, ஏவல் உரையசை "மியா", தன்தொழில் உரைக்கும் வினா — இவற்றின் முன் வல்லெழுத்து மிகாது, இயல்பு (210 போலவே).
    en:
      kooruvathu: 7
      enniyathu: 7
    ethu: 210 “இயல்பென மொழிப” என்ற பொது விதியின் நீட்சி; ஆ, மா, விளிப்பெயர், யா-வினா, பலவற்றிறுதி, ஏவல் உரையசை — எல்லாம் இயல்பு.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: enumeration
    class: இயல்பு_விலக்கு
    count: 7
    items:
    - ஆ
    - மா
    - விளிப்பெயர்
    - யா_வினா
    - பல_ஈறு
    - மியா_உரையசை
    - தன்தொழில்_வினா
  links:
  - ezhu.210
  - ezhu.221
  urai:
    iyaipu:
    - ezhu.210
    - ezhu.231
    text: 'இயைபு (649): 210 இயல்பு; 231 ஆ/மா மெல்லெழுத்துத் தொடர்ச்சி. “தன்தொழில் உரைக்கும் வினா” எது என நூல் பெயரிடவில்லை — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; “தன்தொழில் உரைக்கும் வினாவின் கிளவி” ஒருதலை அன்மை
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
- id: ezhu.225
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 225
  moolam: |-
    வேற்றுமைக் கண்ணும் அதனோ ரற்றே
  kaandigai:
    porul: (ஆகார ஈற்றுப் பகுதி) வேற்றுமையிலும் அவ்வாறே — அண்மை நூற்பா 224 (வல்லெழுத்து இயல்பு); சுட்டுவது அதுவே என நூல் பெயரிடவில்லை (ஒருதலை அன்மை).
    ethu: 214–224 அல்வழியில் சொன்ன திரிபுகள்; வேற்றுமைக் கண்ணும் அவ்வாறே.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    refs:
    - ezhu.224
    context: வேற்றுமை
  links: []
  urai:
    iyaipu:
    - ezhu.216
    - ezhu.224
    text: 'இயைபு (649): 216 முதல் வேற்றுமைத் தொடர்ச்சி; 224 இயல்பு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.226
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 226
  moolam: |-
    குறியதன் முன்னரும் ஓரெழுத்து மொழிக்கும்
    அறியத் தோன்றும் அகரக் கிளவி
  kaandigai:
    porul: குறிலின் முன்னும் ஓரெழுத்து மொழிக்கும் அகரம் தோன்றும்.
    ethu: 221 ஆகார ஈறு அகர இயல்பு என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    context:
    - குறில்
    - ஓரெழுத்துமொழி
    insert: அ
  links: []
  urai:
    iyaipu:
    - ezhu.221
    - ezhu.227
    - ezhu.228
    text: 'இயைபு (649): 227 இரா-வுக்கு விலக்கு; 228 நிலா-வுக்கு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.227
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 227
  moolam: |-
    இராவென் கிளவிக் ககரம் இல்லை
  kaandigai:
    porul: '"இரா" என்ற சொல்லுக்கு அகரம் இல்லை.'
    ethu: 226 குறில்/ஓரெழுத்துக்கு முன் அகரம் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: இரா
    property: அகர_இல்லை
  links: []
  urai:
    iyaipu:
    - ezhu.226
    - ezhu.228
    text: 'இயைபு (649): 226 பொது; 227 “ககரம் இல்லை” என்று விலக்குகிறது. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விலக்கு
    vilakkukkuriyathu:
    - ezhu.226
    thunivu: நூலில் நேரடியாக
- id: ezhu.228
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 228
  moolam: |-
    நிலாவென் கிளவி அத்தொடு சிவணும்
  kaandigai:
    porul: '"நிலா" அத்தோடு பொருந்தும் (நிலாத்து).'
    ethu: 226 அகரம் தோன்றும் என்றது; நிலா என்னும் கிளவி அத்து சாரியையோடு சிவணும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: நிலா
    suffix: அத்து
  links: []
  urai:
    iyaipu:
    - ezhu.226
    - ezhu.227
    - ezhu.119
    text: 'இயைபு (649): 119 அத்து சாரியை; 228 அதை நிலா-வுக்குப் பொருத்துகிறது. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.229
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 229
  moolam: |-
    யாமரக் கிளவியும் பிடாவுந் தளாவும்
    ஆமுப் பெயரும் மெல்லெழுத்து மிகுமே
  kaandigai:
    porul: யா மரம், பிடா, தளா — மூன்றும் மெல்லெழுத்து மிகும்.
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: 217 மரப்பெயர் மெல்லெழுத்து மிகும் என்பதன் கிளை; யாமரம், பிடா, தளா ஆகிய மூன்றும் மெல்லெழுத்து மிகும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: மரப்பெயர்
    count: 3
    items:
    - யாமரம்
    - பிடா
    - தளா
    op: மெல்லினம்_மிகு
  links: []
  urai:
    iyaipu:
    - ezhu.217
    - ezhu.230
    - ezhu.243
    - ezhu.245
    text: 'இயைபு (649): 217 மரப்பெயர்; 230 வல்லெழுத்து மிகினும் வரைநிலை இன்மை; 243/245 இதே போக்கு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.230
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 230
  moolam: |-
    வல்லெழுத்து மிகினும் மான மில்லை
  kaandigai:
    porul: வல்லெழுத்து மிகினும் குற்றமில்லை.
    ethu: 229 யாமரம்/பிடா/தளா மெல்லெழுத்து மிகும் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    property: வல்லெழுத்து_மிகுதல்_குற்றமில்லை
  links: []
  urai:
    iyaipu:
    - ezhu.229
    - ezhu.246
    text: 'இயைபு (649): 246 அதே “மானம் இல்லை” — இகரப் பகுதி. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி-விலக்கு
    vilakkukkuriyathu:
    - ezhu.229
    thunivu: நூலில் நேரடியாக
- id: ezhu.231
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 231
  moolam: |-
    மாமரக் கிளவியும் ஆவும் மாவும்
    ஆமுப் பெயரும் அவற்றோ ரன்ன
    அகரம் வல்லெழுத் தவையவண் நிலையா
    னகரம் ஒற்றும் ஆவும் மாவும்
  kaandigai:
    porul: மா மரம், ஆ, மா — மூன்றும் அவ்வாறே; அகரமும் வல்லெழுத்தும் அங்கு நில்லா; ஆவுக்கும் மாவுக்கும் னகரம் ஒற்றும் (ஆன், மான்).
    ethu: 217 மரப்பெயர் இறுதி மெல்லெழுத்து என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ஆ_மா_மாமரம்
    ops:
    - அகர_நில்லா
    - வல்லெழுத்து_நில்லா
    - ன_ஒற்று
  links:
  - ezhu.229
  - ezhu.230
  urai:
    iyaipu:
    - ezhu.217
    - ezhu.229
    - ezhu.232
    text: 'இயைபு (649): 229 மெல்லெழுத்துத் தொடர்ச்சி; 232 ஆன்-ஒற்று. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.232
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 232
  moolam: |-
    ஆனொற் றகரமொடு நிலையிடன் உடைத்தே
  kaandigai:
    porul: ஆன் ஒற்று அகரத்தோடு நிற்கும் இடமும் உண்டு.
    ethu: 231 ஆ, மா-வுக்கு னகர ஒற்று என்றது; இது அதன் தொடர்ச்சி.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    class: ஆன்_ஒற்று
    context: அகரம்
  links: []
  urai:
    iyaipu:
    - ezhu.231
    - ezhu.233
    text: 'இயைபு (649): 231 ஆன், மான்; 233 "ஆன்முன் வரூஉம்" — ஆன் வடிவம் நூலுள். "ஆனொற் றகரமொடு" — "ஒற்று அகரமொடு" எனவும் "ஒற்று தகரமொடு" எனவும் பிரிக்கலாம்; நூல் தீர்க்கவில்லை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; "ஆனொற் றகரமொடு" = ஆன் ஒற்று + அகரமொடு, அல்லது + தகரமொடு — பிரிப்பு ஒருதலை அன்மை
- id: ezhu.233
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 233
  moolam: |-
    ஆன்முன் வரூஉம் ஈகார பகரந்
    தான்மிகத் தோன்றிக் குறுகலும் உரித்தே
  kaandigai:
    porul: ஆன் முன் வரும் "ஈ" பகரம் மிகுந்து தோன்றிக் குறுகலும் உரியது.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 231–232 ஆன் வடிவமும் அதன் ஒற்றும் கூறின; ஆன்முன் ஈகாரம்/பகரம் மிகத் தோன்றிக் குறுகும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ஆன்_முன்_ஈ
    ops:
    - மிகுதல்
    - குறுகல்
  links: []
  urai:
    iyaipu:
    - ezhu.232
    - ezhu.234
    text: 'இயைபு (649): 232-இன் நீட்சி; 234 அகர ஈற்றுப் பகுதியின் இறுதி. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: உரித்தே
- id: ezhu.234
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 234
  moolam: |-
    குறியதன் இறுதிச் சினைகெட உகரம்
    அறிய வருதல் செய்யுளுள் உரித்தே
  kaandigai:
    porul: குறிலின் இறுதிச் சினை கெட உகரம் வருதல் செய்யுளில் உரியது.
    ethu: 221–233 ஆகார ஈறு; குறிலை அடுத்த ஆகார ஈற்றின் இறுதி கெட்டு உகரம் வருதல் செய்யுளில் உண்டு.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: குறில்_இறுதி
    insert: உ
    context: செய்யுள்
  links: []
  urai:
    iyaipu:
    - ezhu.226
    - ezhu.208
    text: 'இயைபு (649): 208 செய்யுள் விதி; 234 குறில்-உகரத் திரிபு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: உரித்தே
- id: ezhu.235
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 235
  moolam: |-
    இகர இறுதிப் பெயர்நிலை முன்னர்
    வேற்றுமை யாயின் வல்லெழுத்து மிகுமே
  kaandigai:
    porul: இகர ஈற்றுப் பெயர் முன் வேற்றுமையானால் வல்லெழுத்து மிகும்.
    ethu: 203 அல்வழியைக் கூறியது; இது அதன் தொடர்ச்சி.
    eduthukkaattu:
    - text: கிளவிக்கு
      from: ezhu.244
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: இகர_ஈறு
    context: வேற்றுமை
    op: வல்லெழுத்து_மிகு
  links:
  - ezhu.236
  - ezhu.237
  - ezhu.238
  urai:
    iyaipu:
    - ezhu.112
    - ezhu.280
    text: 'இயைபு (649): 280 ஐகார ஈற்றுக்கு இதே விதி. எடுத்துக்காட்டு: "கிளவிக்கு" (எழு. 244) — கிளவி + கு → க் மிகுதல்; அதே வடிவம் எழு. 165, 247, 265.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.236
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 236
  moolam: |-
    இனி அணி என்னுங் காலையும் இடனும்
    வினையெஞ்சு கிளவியுஞ் சுட்டு மன்ன
  kaandigai:
    porul: '"இனி", "அணி" என்ற காலம், இடம், வினையெச்சம் — சுட்டைப் போன்றவை.'
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: 235 வேற்றுமைக்கு வல்லெழுத்து மிகும் என்றது; இனி, அணி என்னும் காலம், இடம் குறிக்கும் சொல்லும், இகர ஈற்று வினையெஞ்சும், இகரச் சுட்டும் அதுபோல வல்லெழுத்து மிகும் ("அன்ன").
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: சுட்டு_போல்வை
    count: 3
    items:
    - இனி_காலம்
    - அணி_இடம்
    - வினையெச்சம்
  links: []
  urai:
    iyaipu:
    - ezhu.235
    - ezhu.238
    text: 'இயைபு (649): 238 சுட்டின் இயற்கை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.237
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 237
  moolam: |-
    இன்றி என்னும் வினையெஞ் சிறுதி
    நின்ற இகரம் உகர மாதல்
    தொன்றியல் மருங்கின் செய்யுளுள் உரித்தே
  kaandigai:
    porul: '"இன்றி" வினையெச்ச ஈற்று இகரம் உகரமாதல் (இன்று) பழைய செய்யுள் மரபில் உரியது.'
    ethu: 235 இகர ஈற்றுப் பொது விதியின் கிளை; இன்றி (வினையெஞ்சு) இறுதி நின்ற இகரம் உகரமாகும் (செய்யுள்).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: இன்றி
    transform: இ→உ
    context: செய்யுள்
  links: []
  urai:
    iyaipu:
    - ezhu.235
    - ezhu.240
    text: 'இயைபு (649): 240 நாழி-இகரம் கெடுதல் (இதே போக்கு). எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: உரித்தே
- id: ezhu.238
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 238
  moolam: |-
    சுட்டி னியற்கை முற்கிளந் தற்றே
  kaandigai:
    porul: சுட்டின் இயல்பு முன் கூறியபடியே (205–207).
    ethu: 205 சுட்டு-முன் ஒற்றுமிகுதி சொன்னது; இ-ஈற்றுச் சுட்டுக்கும் அவ்வியல்பே (முற்கிளந்தது).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    refs:
    - ezhu.205
    - ezhu.206
    - ezhu.207
  links: []
  urai:
    iyaipu:
    - ezhu.205
    - ezhu.236
    text: 'இயைபு (649): 205 அகர ஈற்றுச் சுட்டு; 238 இகர ஈற்றுச் சுட்டு — “முற்கிளந்தற்றே” என்பது மாட்டேறு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: முடிந்தது காட்டல்
    saanru: முற்கிளந்
- id: ezhu.239
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 239
  moolam: |-
    பதக்குமுன் வரினே தூணிக் கிளவி
    முதற்கிளந் தெடுத்த வேற்றுமை யியற்றே
  kaandigai:
    porul: '"பதக்கு" முன் வந்தால் "தூணி" முதற்கூறிய வேற்றுமை இயல்பினது.'
    ethu: 235 இகர ஈற்றுப் பொது விதியின் கிளை; பதக்கு முன் வரும் தூணிக் கிளவி முதற்கிளந்த வேற்றுமை இயல்பைப் பெறும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    items:
    - தூணி
    - பதக்கு
    property: வேற்றுமை_இயல்பு
  links: []
  urai:
    iyaipu:
    - ezhu.235
    - ezhu.216
    text: 'இயைபு (649): 216 வேற்றுமை அதனோ ரற்றே; 239 அதற்கு ஒரு குறிப்பிட்ட சொல். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.240
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 240
  moolam: |-
    உரிவரு காலை நாழிக் கிளவி
    இறுதி இகரம் மெய்யொடுங் கெடுமே
    டகர மொற்றும் ஆவயி னான
  kaandigai:
    porul: '"உரி" வரும்போது "நாழி"யின் இறுதி இகரம் மெய்யொடும் கெடும்; அவ்விடத்து டகரம் ஒற்றும் (நாடுரி).'
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 235 இகர ஈற்றுப் பொது விதியின் கிளை; நாழி (உரி வருங்கால்) இறுதி இகரம் மெய்யொடு கெடும், டகர ஒற்றும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: நாழி
    context: உரி
    ops:
    - இகர_கெடு
    - ட_ஒற்று
  links: []
  urai:
    iyaipu:
    - ezhu.235
    - ezhu.237
    text: 'இயைபு (649): 237 இன்றி இ→உ. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.241
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 241
  moolam: |-
    பனியென வரூஉங் கால வேற்றுமைக்
    கத்தும் இன்னுஞ் சாரியை யாகும்
  kaandigai:
    porul: '"பனி" என்ற காலப்பெயருக்கு வேற்றுமையில் அத்தும் இன்னும் சாரியை.'
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 235 இகர ஈற்றுப் பொது விதியின் கிளை; பனி — கால வேற்றுமைக்கு அத்தும் இன்னும் சாரியையாகும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: பனி
    suffixes:
    - அத்து
    - இன்
  links: []
  urai:
    iyaipu:
    - ezhu.235
    - ezhu.242
    - ezhu.247
    text: 'இயைபு (649): 242 வளி, 247 நாள் — இவை இதே போக்கு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.242
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 242
  moolam: |-
    வளியென வரூஉம் பூதக் கிளவியும்
    அவ்வியல் நிலையல் செவ்வி தென்ப
  kaandigai:
    porul: '"வளி" என்ற பூதப்பெயரும் அவ்வியல்பில் நிற்கும்.'
    ethu: 241 பனி-க்குச் சொன்ன விதியின் கிளை; வளி (பூதக் கிளவி) அவ்வியல்பே.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: வளி
    analogy: ezhu.241
  links: []
  urai:
    iyaipu:
    - ezhu.241
    - ezhu.287
    text: 'இயைபு (649): 287 மழை “வளியியல் நிலையும்” என்று இதைச் சுட்டுகிறது. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: இறந்தது காத்தல்
    saanru: அவ்வியல்
- id: ezhu.243
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 243
  moolam: |-
    உதிமரக் கிளவி மெல்லெழுத்து மிகுமே
  kaandigai:
    porul: உதி மரம் மெல்லெழுத்து மிகும்.
    ethu: 235 இகர ஈற்றுக்கு வல்லெழுத்து மிகும் என்றது; உதிமரம் அதற்கு விலக்காக மெல்லெழுத்து மிகும் — 217 அகர மரப்பெயரோடு ஒத்தது.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: உதி_மரம்
    op: மெல்லினம்_மிகு
  links: []
  urai:
    iyaipu:
    - ezhu.217
    - ezhu.244
    - ezhu.262
    text: 'இயைபு (649): 244 புளிமரம், 262 ஒடுமரம் — மரப்பெயர் வரிசை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விலக்கு
    thunivu: நூலில் நேரடியாக
    vilakkukkuriyathu:
    - ezhu.235
- id: ezhu.244
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 244
  moolam: |-
    புளிமரக் கிளவிக்கு அம்மே சாரியை
  kaandigai:
    porul: புளி மரத்துக்கு அம் சாரியை.
    ethu: 243 உதிமரம்-க்குச் சொன்ன விதியின் கிளை; புளிமரத்திற்கு அம் சாரியை.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: புளி_மரம்
    suffix: அம்
  links: []
  urai:
    iyaipu:
    - ezhu.243
    - ezhu.245
    - ezhu.119
    text: 'இயைபு (649): 245 ஏனைப் புளிப்பெயர்; 119 அம் சாரியைப் பட்டியல். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.245
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 245
  moolam: |-
    ஏனைப் புளிப்பெயர் மெல்லெழுத்து மிகுமே
  kaandigai:
    porul: மற்ற புளிப்பெயர் மெல்லெழுத்து மிகும்.
    ethu: 244 புளிமரம்-க்கு அம் சொன்னது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ஏனை_புளிப்பெயர்
    op: மெல்லினம்_மிகு
  links: []
  urai:
    iyaipu:
    - ezhu.244
    - ezhu.246
    - ezhu.217
    text: 'இயைபு (649): 246 “வல்லெழுத்து மிகினும் மானம் இல்லை” — இதற்கு விலக்காக. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விலக்கு
    thunivu: நூலில் நேரடியாக
    vilakkukkuriyathu:
    - ezhu.235
- id: ezhu.246
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 246
  moolam: |-
    வல்லெழுத்து மிகினும் மான மில்லை
    ஒல்வழி யறிதல் வழக்கத் தான
  kaandigai:
    porul: வல்லெழுத்து மிகினும் குற்றமில்லை; பொருந்துமிடம் வழக்கால் அறிக.
    ethu: 245 ஏனைப் புளிப்பெயர் மெல்லெழுத்து மிகும் என்றது; வல்லெழுத்து மிகினும் மானம் (வரைநிலை) இல்லை.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    property: வல்லெழுத்து_மிகுதல்_குற்றமில்லை
    evidence: வழக்கு
  links: []
  urai:
    iyaipu:
    - ezhu.245
    - ezhu.230
    text: 'இயைபு (649): 230 அதே “மானம் இல்லை” — அகர ஈற்றுப் பகுதி. “ஒல்வழி அறிதல் வழக்கத்தான” — எது எப்போது என்பது வழக்கறிவு — ஒருதலை அன்மை.'
    vagai: விதி-விலக்கு
    vilakkukkuriyathu:
    - ezhu.245
    thunivu: நூலில் நேரடியாக
- id: ezhu.247
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 247
  moolam: |-
    நாள்முன் தோன்றுந் தொழில்நிலைக் கிளவிக்கு
    ஆன் இடை வருதல் ஐய மின்றே
  kaandigai:
    porul: நாள் முன் தோன்றும் தொழிற்சொல்லுக்கு ஆன் இடை வருதல் ஐயமின்று.
    ethu: 241 பனி-க்குச் சொன்ன விதியின் கிளை; நாள் முன் வரும் தொழில்நிலைக் கிளவிக்கு ஆன் இடை வருதல் ஐயமின்றே.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: நாள்_தொழில்
    insert: ஆன்
  links: []
  urai:
    iyaipu:
    - ezhu.241
    - ezhu.286
    text: 'இயைபு (649): 286 “திங்களும் நாளும் முந்துகிளந்தன்ன” — இதை ஒத்தது. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.248
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 248
  moolam: |-
    திங்கள் முன்வரின் இக்கே சாரியை
  kaandigai:
    porul: திங்கள் முன் வந்தால் இக்கு சாரியை.
    ethu: 235 இகர ஈற்றுப் பொது விதியின் கிளை; திங்கள் முன் வரும்போது இக்கே சாரியை.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: திங்கள்
    suffix: இக்கு
  links:
  - ezhu.235
  - ezhu.247
  urai:
    iyaipu:
    - ezhu.235
    - ezhu.286
    - ezhu.119
    text: 'இயைபு (649): 119 இக்கு சாரியை; 286 திங்கள்-நாள் வரிசை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.249
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 249
  moolam: |-
    ஈகார இறுதி ஆகார இயற்றே
  kaandigai:
    porul: ஈகார ஈறு ஆகார ஈற்றின் இயல்பினது.
    ethu: 221 ஆகார ஈறு அகர இயல்பு என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ஈகார_ஈறு
    inherits: ஆகார_ஈறு_இயல்பு
  links: []
  urai:
    iyaipu:
    - ezhu.221
    - ezhu.203
    text: 'இயைபு (649): "ஆகார இயற்றே" — 221 வழியாக 203–220. 264 ஊகாரமும் ஆகார இயல்பு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒப்பக் கூறல்
    saanru: இயற்றே
- id: ezhu.250
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 250
  moolam: |-
    நீ என் பெயரும் இடக்கர்ப் பெயரும்
    மீஎன மரீஇய இடம்வரை கிளவியும்
    ஆவயின் வல்லெழுத் தியற்கை யாகும்
  kaandigai:
    porul: நீ, இடக்கர்ப் பெயர், "மீ" என்ற இடப்பெயர் — வல்லெழுத்து இயல்பாகும்.
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: 249 ஈகார ஈறு ஆகார இயல்பு — அதாவது வல்லெழுத்து மிகும் — என்றது; இது அதன் தொடர்ச்சி.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: enumeration
    class: ஈகார_ஈறு_வல்லின_இயல்பு
    count: 3
    items:
    - நீ
    - இடக்கர்ப்பெயர்
    - மீ_இடப்பெயர்
  links: []
  urai:
    iyaipu:
    - ezhu.249
    - ezhu.251
    - ezhu.253
    text: 'இயைபு (649): 253 நீ-ஒருபெயர் உருபியல்; 235 இகர ஈறு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விலக்கு
    thunivu: விதி நூலில் நேரடியாக; “ஆவயின் வல்லெழுத்து இயற்கையாகும்” எவை எப்போது என்பது ஒருதலை அன்மை
    vilakkukkuriyathu:
    - ezhu.249
- id: ezhu.251
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 251
  moolam: |-
    இடம்வரை கிளவிமுன் வல்லெழுத்து மிகூஉம்
    உடனிலை மொழியும் உளவென மொழிப
  kaandigai:
    porul: இடப்பெயர் முன் வல்லெழுத்து மிகும் உடனிலை மொழிகளும் உள.
    ethu: 250 வல்லெழுத்து இயற்கை என்றது; இது அதன் தொடர்ச்சி.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    class: இடப்பெயர்
    op: வல்லெழுத்து_மிகு
  links: []
  urai:
    iyaipu:
    - ezhu.250
    - ezhu.253
    text: 'இயைபு (649): 250 இயற்கை; 251 மிகுதி. “உடனிலை மொழியும் உளவென” — எவை என நூல் பெயரிடவில்லை — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; “உளவென மொழிப” — எவை என ஒருதலை அன்மை
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
- id: ezhu.252
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 252
  moolam: |-
    வேற்றுமைக் கண்ணும் அதனோ ரற்றே
  kaandigai:
    porul: (ஈகார ஈற்றுப் பகுதி) வேற்றுமையிலும் அவ்வாறே — அண்மை நூற்பா 251 (உடனிலை மொழி விதி); சுட்டுவது அதுவே என நூல் பெயரிடவில்லை (ஒருதலை அன்மை).
    ethu: 250–251 அல்வழியில் சொன்னவை; வேற்றுமைக் கண்ணும் அவ்வாறே.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    refs:
    - ezhu.251
    context: வேற்றுமை
  links: []
  urai:
    iyaipu:
    - ezhu.216
    - ezhu.250
    text: 'இயைபு (649): 216 முதலியவற்றின் "அதனோ ரற்றே" மாட்டேறு; இங்கு ஈகார ஈற்றுக்கு (249–253). எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.253
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 253
  moolam: |-
    நீஎன் ஒருபெயர் உருபியல் நிலையும்
    ஆவயின் வல்லெழுத் தியற்கை யாகும்
  kaandigai:
    porul: நீ என்ற பெயர் உருபியல் நிலையும் (எழு. 179); வல்லெழுத்து இயல்பாகும்.
    ethu: 250 நீ-க்கு வல்லெழுத்து இயற்கை என்றது; உருபியல் நிலையிலும் அவ்வியல்பே.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: நீ
    refs:
    - ezhu.179
    - ezhu.250
  links: []
  urai:
    iyaipu:
    - ezhu.250
    - ezhu.251
    text: 'இயைபு (649): 250 இயற்கை; 251 மிகுதி; 253 உருபியல் நிலை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.254
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 254
  moolam: |-
    உகர இறுதி அகர இயற்றே
  kaandigai:
    porul: உகர ஈறு அகர ஈற்றின் இயல்பினது.
    ethu: 203–220 அகர ஈறு; உகர ஈறும் அதன் இயல்பைப் பெறும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: உகர_ஈறு
    inherits: அகர_ஈறு_இயல்பு
  links: []
  urai:
    iyaipu:
    - ezhu.203
    text: 'இயைபு (649): "அகர இயற்றே" — 203–220-இன் விதிகள் உகர ஈற்றுக்கும். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒப்பக் கூறல்
    saanru: இயற்றே
- id: ezhu.255
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 255
  moolam: |-
    சுட்டின் முன்னரும் அத்தொழிற் றாகும்
  kaandigai:
    porul: சுட்டின் முன்னும் அத்தொழிலினது.
    ethu: 254 உகர ஈற்றுப் பொது விதியின் கிளை; சுட்டின் முன்னரும் அத்தொழிற்றாகும் (சுட்டுக்கு முன் வரும்போது அது போலவே).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: உகர_ஈறு
    context: சுட்டு_முன்
    property: அத்தொழில்
  links: []
  urai:
    iyaipu:
    - ezhu.254
    - ezhu.257
    text: 'இயைபு (649): 254 உகர ஈறு; 257 சுட்டுமுதல் இறுதி. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.256
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 256
  moolam: |-
    ஏனவை வரினே மேல்நிலை இயல
  kaandigai:
    porul: மற்றவை வந்தால் மேல்நிலையின் இயல்பின.
    ethu: 255 சுட்டுக்குச் சொன்னது; ஏனவை (சுட்டு அல்லாத) வரும்போது மேல்நிலை (250–253) இயல.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: உகர_ஈறு
    property: மேல்நிலை_இயல்பு
  links: []
  urai:
    iyaipu:
    - ezhu.250
    - ezhu.255
    - ezhu.257
    text: 'இயைபு (649): 250 முதல் உகர ஈற்று இயல்கள். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.257
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 257
  moolam: |-
    சுட்டுமுதல் இறுதி இயல்பா கும்மே
  kaandigai:
    porul: சுட்டுமுதல் ஈறு இயல்பாகும்.
    ethu: 255–256 ஈற்று நிலைகளைச் சொன்னது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: சுட்டு_உகர_ஈறு
    property: இயல்பு
  links: []
  urai:
    iyaipu:
    - ezhu.255
    - ezhu.256
    text: 'இயைபு (649): 255, 256 சுட்டு/ஏனை வேறுபாடு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விலக்கு
    thunivu: நூலில் நேரடியாக
    vilakkukkuriyathu:
    - ezhu.254
- id: ezhu.258
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 258
  moolam: |-
    அன்றுவரு காலை ஆவா குதலும்
    ஐவரு காலை மெய்வரைந்து கெடுதலும்
    செய்யுள் மருங்கின் உரித்தென மொழிப
  kaandigai:
    porul: '"அன்று" வரும்போது ஆ ஆதலும், ஐ வரும்போது மெய் வரைந்து கெடுதலும் செய்யுளில் உரியது.'
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 254–257 உகர ஈறு; உகர ஈற்றுச் சொல் முன் அன்று வரின் ஆ ஆதலும், ஐ வரின் மெய் வரைந்து கெடுதலும் செய்யுளில் உண்டு.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: உகர_ஈறு
    ops:
    - அன்று→ஆ
    - ஐ_மெய்யொடு_கெடு
    context: செய்யுள்
  links: []
  urai:
    iyaipu:
    - ezhu.254
    - ezhu.259
    text: 'இயைபு (649): இது உகர ஈற்றுத் தொகுதி (254–263) — எகர ஈறு அன்று; எகர ஈறு 272-இல் தொடங்குகிறது. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
  - peyar: ஒருதலை அன்மை
    saanru: உரித்தென
- id: ezhu.259
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 259
  moolam: |-
    வேற்றுமைக் கண்ணும் அதனோ ரற்றே
  kaandigai:
    porul: (உகர ஈற்றுப் பகுதி) வேற்றுமையிலும் அவ்வாறே. 257-ஐச் சுட்டுகிறதா 258-ஐச் சுட்டுகிறதா என்பது ஒருதலை அன்று. ஆனால் 263 வேற்றுமையில் சுட்டுமுதல் இறுதிக்கு "உருபியல் நிலையும்" என வேறு விதி தருவதால், 258-ஐச் சுட்டுவதற்கு அது சான்றாகலாம்; ஆயினும் நூல் பெயரிடாததால் ஒருதலை அன்மை.
    ethu: 254–258 உகர ஈற்றுக்கு அல்வழியில் கூறியவை வேற்றுமைக் கண்ணும் அவ்வாறே.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    refs:
    - ezhu.258
    context: வேற்றுமை
  links: []
  urai:
    iyaipu:
    - ezhu.216
    - ezhu.254
    text: 'இயைபு (649): 216, 225 முதலியவற்றின் "அதனோ ரற்றே" மாட்டேறு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.260
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 260
  moolam: |-
    எருவும் செருவும் அம்மொடு சிவணித்
    திரிபிட னுடைய தெரியுங் காலை
    அம்மின் மகரம் செருவயின் கெடுமே
    தம்மொற்று மிகூஉம் வல்லெழுத் தியற்கை
  kaandigai:
    porul: எரு, செரு அம்மொடு பொருந்தித் திரியும்; செருவில் அம்மின் மகரம் கெடும்; தம் ஒற்று மிகும்.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: உகர ஈற்றுப் பெயர்களுள் எரு, செரு அம் சாரியையோடு சிவணி, அம்மின் மகரம் செருவயின் கெடும், தம் ஒற்று மிகும் (வல்லெழுத்து இயற்கை).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    items:
    - எரு
    - செரு
    ops:
    - அம்_மகர_கெடு
    - தம்_ஒற்று_மிகு
  links: []
  urai:
    iyaipu:
    - ezhu.254
    - ezhu.119
    - ezhu.129
    text: 'இயைபு (649): 229 யாமரம், 231 மாமரம் — மெல்லெழுத்து மிகுதி. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.261
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 261
  moolam: |-
    ழகர உகரம் நீடிடன் உடைத்தே
    உகரம் வருதல் ஆவயி னான
  kaandigai:
    porul: ழகர உகரம் நீளும் இடம் உண்டு; அவ்விடத்து உகரம் வரும்.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: உகர ஈற்றுள் ழகர உகரம் நீட இடனுடைத்து, உகரம் வருதல் ஆவயினான.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ழ_உ
    ops:
    - நீட்சி
    - உ_வரவு
  links: []
  urai:
    iyaipu:
    - ezhu.254
    - ezhu.258
    text: 'இயைபு (649): 254 உகர ஈறு; 261 ழகர உகர நீட்சி. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.262
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 262
  moolam: |-
    ஒடுமரக் கிளவி உதிமர இயற்றே
  kaandigai:
    porul: ஒடு மரம் உதி மரத்தின் இயல்பினது (243).
    ethu: 243 உதிமரம்-க்குச் சொன்ன விதியின் கிளை; ஒடுமரம் உதிமர இயற்றே.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: ஒடு_மரம்
    analogy: ezhu.243
  links: []
  urai:
    iyaipu:
    - ezhu.243
    - ezhu.278
    text: 'இயைபு (649): 243 உதிமரம், 278 சே மரம் — மரப்பெயர் வரிசை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒப்பக் கூறல்
    saanru: இயற்றே
- id: ezhu.263
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 263
  moolam: |-
    சுட்டுமுதல் இறுதி உருபியல் நிலையும்
    ஒற்றிடை மிகாஅ வல்லெழுத் தியற்கை
  kaandigai:
    porul: சுட்டுமுதல் ஈறு உருபியல் நிலையும்; ஒற்று இடைமிகாது வல்லெழுத்து இயல்பு.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 216 வேற்றுமைத் திரிபுகளைச் சொன்னது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: சுட்டு_உகர_ஈறு
    ops:
    - உருபியல்_நிலை
    - ஒற்று_மிகா
    - வல்லின_இயல்பு
  links: []
  urai:
    iyaipu:
    - ezhu.216
    - ezhu.225
    - ezhu.257
    text: 'இயைபு (649): 257 சுட்டுமுதல் இறுதி இயல்பு; 216 வேற்றுமைத் தொடர். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.264
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 264
  moolam: |-
    ஊகார இறுதி ஆகார இயற்றே
  kaandigai:
    porul: ஊகார ஈறு ஆகார ஈற்றின் இயல்பினது.
    ethu: 221 ஆகார ஈறு அகர இயல்பு என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ஊகார_ஈறு
    inherits: ஆகார_ஈறு_இயல்பு
  links: []
  urai:
    iyaipu:
    - ezhu.221
    - ezhu.249
    text: 'இயைபு (649): 249 ஈகாரமும் இவ்வாறே ஆகார இயல்பு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒப்பக் கூறல்
    saanru: இயற்றே
- id: ezhu.265
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 265
  moolam: |-
    வினையெஞ்சு கிளவிக்கும் முன்னிலை மொழிக்கும்
    நினையுங் காலை அவ்வகை வரையார்
  kaandigai:
    porul: வினையெச்சத்துக்கும் முன்னிலை மொழிக்கும் அவ்வகையை விலக்கார்.
    ethu: உகர ஈற்றுள் (254–263) வினையெஞ்சுக்கும் முன்னிலை மொழிக்கும் அவ்வகை (வல்லெழுத்து மிகுதல்) வரையார்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    classes:
    - வினையெச்சம்
    - முன்னிலை_மொழி
    property: விலக்கில்லை
  links: []
  urai:
    iyaipu:
    - ezhu.254
    - ezhu.204
    text: 'இயைபு (649): 204 அகர ஈற்று வினையெஞ்சு வல்லெழுத்து மிகும் என்றது; 254 வழியாக உகர ஈற்றுக்கும் அதே. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: வரையார்
- id: ezhu.266
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 266
  moolam: |-
    வேற்றுமைக் கண்ணும் அதனோ ரற்றே
  kaandigai:
    porul: (ஊகார ஈற்றுப் பகுதி) வேற்றுமையிலும் அவ்வாறே — 264-இன் ஆகார ஈற்று இயல்பு. 265 வினையெச்சம், முன்னிலை மொழி பற்றியது (நூலில் நேரடியாக); சுட்டுவது 264 என நூல் பெயரிடவில்லை (ஒருதலை அன்மை).
    ethu: 265 வரை உகர ஈற்றுக்குக் கூறியவை வேற்றுமைக் கண்ணும் அவ்வாறே.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    refs:
    - ezhu.264
    context: வேற்றுமை
  links: []
  urai:
    iyaipu:
    - ezhu.216
    - ezhu.265
    text: 'இயைபு (649): "அதனோ ரற்றே" மாட்டேறு (216, 225, 252, 259). எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.267
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 267
  moolam: |-
    குற்றெழுத் திம்பரும் ஓரெழுத்து மொழிக்கும்
    நிற்றல் வேண்டும் உகரக் கிளவி
  kaandigai:
    porul: குறிலின் பின்னும் ஓரெழுத்து மொழிக்கும் உகரம் நிற்றல் வேண்டும்.
    ethu: 264 ஊகார ஈறு ஆகார இயல்பு என்றது; குறிலை அடுத்த ஊகார ஈற்றுக்கும் ஓரெழுத்து (ஊ) மொழிக்கும் உகரம் நிற்றல் வேண்டும் — ஆகார ஈற்றுக்கு 226 அகரம் போல.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    context:
    - குறில்
    - ஓரெழுத்துமொழி
    insert: உ
  links: []
  urai:
    iyaipu:
    - ezhu.264
    - ezhu.226
    text: 'இயைபு (649): 264 ஊகார ஈறு; 226 ஆகார ஈற்றுக்கு அகரம் — அதன் இணை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஆணை கூறல்
    saanru: வேண்டும்
- id: ezhu.268
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 268
  moolam: |-
    பூஎன் ஒருபெயர் ஆயியல் பின்றே
    ஆவயின் வல்லெழுத்து மிகுதலும் உரித்தே
  kaandigai:
    porul: '"பூ" என்ற பெயர் அவ்வியல்பின்று; வல்லெழுத்து மிகுதலும் உரியது.'
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 267 குறில்/ஓரெழுத்துக்கு உகரம் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: பூ
    ops:
    - 267_விலக்கு
    - வல்லின_மிகு
  links: []
  urai:
    iyaipu:
    - ezhu.267
    - ezhu.269
    text: 'இயைபு (649): 269 ஊ-ஒருபெயர். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒப்பக் கூறல்
    saanru: ஆயியல்
  - peyar: ஒருதலை அன்மை
    saanru: உரித்தே
- id: ezhu.269
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 269
  moolam: |-
    ஊஎன் ஒருபெயர் ஆவொடு சிவணும்
  kaandigai:
    porul: '"ஊ" என்ற பெயர் ஆவோடு பொருந்தும்.'
    ethu: 268 பூ-வுக்குச் சொன்ன விதியின் கிளை; ஊ (ஒருபெயர்) ஆவொடு சிவணும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: ஊ
    context: ஆ
  links: []
  urai:
    iyaipu:
    - ezhu.268
    - ezhu.267
    text: 'இயைபு (649): 268 பூ. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.270
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 270
  moolam: |-
    அக்கென் சாரியை பெறுதலும் உரித்தே
    தக்கவழி அறிதல் வழக்கத் தான
  kaandigai:
    porul: அக்கு சாரியை பெறுதலும் உரியது; தக்க இடம் வழக்கால் அறிக.
    ethu: 267 உகரக் கிளவி நிற்றல் என்றது; இது அதன் தொடர்ச்சி.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    suffix: அக்கு
    evidence: வழக்கு
  links: []
  urai:
    iyaipu:
    - ezhu.267
    - ezhu.119
    text: 'இயைபு (649): 119 அக்கு சாரியை. “தக்கவழி அறிதல் வழக்கத்தான” — எப்போது என்பது வழக்கறிவு — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; “தக்கவழி” ஒருதலை அன்மை
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: உரித்தே
- id: ezhu.271
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 271
  moolam: |-
    ஆடூஉ மகடூஉ ஆயிரு பெயர்க்கும்
    இன்இடை வரினும் மான மில்லை
  kaandigai:
    porul: ஆடூஉ, மகடூஉ — இரண்டுக்கும் இன் இடைவரினும் குற்றமில்லை.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 267 உகரக் கிளவி என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    items:
    - ஆடூஉ
    - மகடூஉ
    insert: இன்
  links: []
  urai:
    iyaipu:
    - ezhu.267
    - sol.165
    text: 'இயைபு (649): சொல். 165 ஆடூஉ/மகடூஉ பெயர் வரிசை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; “மானம் இல்லை” — வரைநிலை இன்மை
- id: ezhu.272
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 272
  moolam: |-
    எகர ஒகரம் பெயர்க்கீ றாகா
    முன்னிலை மொழிய என்மனார் புலவர்
    தேற்றமும் சிறப்பும் அல்வழி யான
  kaandigai:
    porul: எகரம், ஒகரம் பெயருக்கு ஈறாகா; முன்னிலை மொழிக்கு உரியன — தேற்றமும் சிறப்பும் அல்லாதவிடத்து. எழு. 71, 72 உடன் ஒப்பு.
    ethu: 'எகர, ஒகர ஈற்றின் தொடக்கம்: எகர/ஒகரம் பெயர்க்கு ஈறாகா (முன்னிலை மொழி தவிர) — தேற்றம், சிறப்பு அல்வழி.'
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    class:
    - எ
    - ஒ
    op: பெயர்_ஈறு_ஆகா
    context: முன்னிலை
  links: []
  urai:
    iyaipu:
    - ezhu.267
    - ezhu.273
    - sol.272
    text: 'இயைபு (649): 273 தேற்ற எகரம்; சொல். 272 முன்னிலை மொழி. “தேற்றமும் சிறப்பும் அல்வழி” — எந்தச் சொற்கள் என்பது நூலில் பெயரிடப்படவில்லை — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; “தேற்றமும் சிறப்பும் அல்வழி” ஒருதலை அன்மை
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்மனார்
- id: ezhu.273
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 273
  moolam: |-
    தேற்ற எகரமும் சிறப்பின் ஒவ்வும்
    மேற்கூ றியற்கை வல்லெழுத்து மிகா
  kaandigai:
    porul: தேற்ற எகரமும் சிறப்பு ஒகரமும் வல்லெழுத்து மிகா.
    ethu: 272 எகரம் ஈறாகா என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    items:
    - தேற்ற_எ
    - சிறப்பு_ஒ
    property: வல்லின_மிகா
  links: []
  urai:
    iyaipu:
    - ezhu.272
    - ezhu.265
    text: 'இயைபு (649): 272 விலக்கு; 273 தேற்ற எகரம் அவ்விலக்கிற்குள் வரும். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.274
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 274
  moolam: |-
    ஏகார இறுதி ஊகார இயற்றே
  kaandigai:
    porul: ஏகார ஈறு ஊகார ஈற்றின் இயல்பினது.
    ethu: 264 ஊகார ஈறு; ஏகார ஈறு ஊகார ஈற்றின் இயல்பைப் பெறும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ஏகார_ஈறு
    inherits: ஊகார_ஈறு_இயல்பு
  links: []
  urai:
    iyaipu:
    - ezhu.264
    - ezhu.275
    text: 'இயைபு (649): 264–271 ஊகார ஈறு; 274 அதன் இயல்பை ஏகாரத்துக்கு நீட்டுகிறது. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒப்பக் கூறல்
    saanru: இயற்றே
- id: ezhu.275
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 275
  moolam: |-
    மாறுகோள் எச்சமும் வினாவும் எண்ணும்
    கூறிய வல்லெழுத்து இயற்கை யாகும்
  kaandigai:
    porul: மாறுகோள் எச்சம், வினா, எண் — வல்லெழுத்து இயல்பாகும்.
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: 274 ஏ-ஈறு ஊ-ஈறு இயல என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: ஏகார_ஈறு_வல்லின_இயல்பு
    count: 3
    items:
    - மாறுகோள்_எச்சம்
    - வினா
    - எண்
  links: []
  urai:
    iyaipu:
    - ezhu.274
    - ezhu.290
    text: 'இயைபு (649): 290 ஓ-ஈறு அதே போக்கு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விலக்கு
    thunivu: நூலில் நேரடியாக
    vilakkukkuriyathu:
    - ezhu.274
  utthi:
  - peyar: கூறிற்று என்றல்
    saanru: கூறிய
- id: ezhu.276
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 276
  moolam: |-
    வேற்றுமைக் கண்ணும் அதனோ ரற்றே
  kaandigai:
    porul: (ஏகார ஈற்றுப் பகுதி) வேற்றுமையிலும் அவ்வாறே — 274-இன் ஊகார ஈற்று இயல்பு; 275 மாறுகோள் எச்சம், வினா, எண் பற்றியது (நூலில் நேரடியாக); சுட்டுவது 274 என நூல் பெயரிடவில்லை (ஒருதலை அன்மை).
    ethu: 274–275 அல்வழி ஏ-ஈற்றுக்குச் சொன்னவை; வேற்றுமைக் கண்ணும் அவ்வாறே.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    refs:
    - ezhu.274
    context: வேற்றுமை
  links: []
  urai:
    iyaipu:
    - ezhu.216
    - ezhu.274
    text: 'இயைபு (649): 216 வேற்றுமைத் தொடர். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.277
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 277
  moolam: |-
    ஏயென் இறுதிக்கு எகரம் வருமே
  kaandigai:
    porul: '"ஏ" ஈற்றுக்கு எகரம் வரும் (ஏஎ).'
    ethu: 274 ஏ-ஈறு என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: ஏ
    insert: எ
  links: []
  urai:
    iyaipu:
    - ezhu.274
    - ezhu.278
    text: 'இயைபு (649): 278 சே (மரப்பெயர்). எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.278
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 278
  moolam: |-
    சேஎன் மரப்பெயர் ஒடுமர இயற்றே
  kaandigai:
    porul: '"சே" மரப்பெயர் ஒடு மரத்தின் இயல்பினது.'
    ethu: 277 ஏ-ஈற்றிற்கு எகரம் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: சே_மரம்
    analogy: ezhu.262
  links: []
  urai:
    iyaipu:
    - ezhu.243
    - ezhu.262
    - ezhu.277
    text: 'இயைபு (649): 243 உதிமரம், 262 ஒடுமரம் — மரப்பெயர் வரிசை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒப்பக் கூறல்
    saanru: இயற்றே
- id: ezhu.279
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 279
  moolam: |-
    பெற்றம் ஆயின் முற்றஇன் வேண்டும்
  kaandigai:
    porul: பெற்றம் (பசு) பொருளானால் இன் முழுமையாக வேண்டும்.
    ethu: 277 ஏ என்னும் இறுதி; அது பெற்றம் (ஆனினம்) குறிக்கும் பெயராயின் இன் சாரியை முழுதும் வேண்டும்.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    entity: பெற்றம்
    suffix: இன்
    mode: முழுமை
  links: []
  urai:
    iyaipu:
    - ezhu.277
    - ezhu.278
    - ezhu.195
    text: 'இயைபு (649): ஏகார ஈற்றுத் தொகுதி (274–279); "முற்றஇன்" — 195 "முற்றத்தோன்றும் இன்னென் சாரியை" போல. "பெற்றம் ஆயின்" — பெற்றம் எதைக் குறிக்கும் என நூல் இங்கு விரிக்கவில்லை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; "பெற்றம் ஆயின்" என்பதன் பொருள் ஒருதலை அன்மை
  utthi:
  - peyar: ஆணை கூறல்
    saanru: வேண்டும்
- id: ezhu.280
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 280
  moolam: |-
    ஐகார இறுதிப் பெயர்நிலை முன்னர்
    வேற்றுமை யாயின் வல்லெழுத்து மிகுமே
  kaandigai:
    porul: ஐகார ஈற்றுப் பெயர் முன் வேற்றுமையானால் வல்லெழுத்து மிகும்.
    ethu: 235 இ-ஈற்றிற்கு வல்லெழுத்து மிகும் என்றது; இது அதன் தொடர்ச்சி.
    eduthukkaattu:
    - text: வினைக்கு ஒருங்கு இயலும்
      from: sol.38
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ஐகார_ஈறு
    context: வேற்றுமை
    op: வல்லின_மிகு
  links:
  - ezhu.281
  - ezhu.282
  - ezhu.283
  urai:
    iyaipu:
    - ezhu.112
    - ezhu.235
    - ezhu.279
    - ezhu.281
    text: 'இயைபு (649): “வினைக்கு ஒருங்கு இயலும்” (சொல். 38) — வினை + கு → க்கு. 235 இ-ஈறு, 280 ஐ-ஈறு — இரண்டும் பொது விதிகள்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.281
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 281
  moolam: |-
    சுட்டுமுதல் இறுதி உருபியல் நிலையும்
  kaandigai:
    porul: சுட்டுமுதல் ஈறு உருபியல் நிலையும் (177).
    ethu: 280 ஐ-ஈற்றுக்கு வேற்றுமையில் வல்லெழுத்து என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: சுட்டு_ஐகார_ஈறு
    refs:
    - ezhu.177
  links: []
  urai:
    iyaipu:
    - ezhu.280
    - ezhu.220
    text: 'இயைபு (649): 220 பலவற்றிறுதி உருபியல்; 281 சுட்டுமுதல். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.282
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 282
  moolam: |-
    விசைமரக் கிளவியும் ஞெமையும் நமையும்
    ஆமுப் பெயரும் சேமர இயல
  kaandigai:
    porul: விசை, ஞெமை, நமை — மூன்று மரப்பெயரும் சே மரத்தின் இயல்பின.
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: 278 சே (மரப்பெயர்) ஒடுமர இயல என்றது; விசைமரம், ஞெமை, நமை — இம்மூன்றும் அதுபோலவே.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: மரப்பெயர்
    count: 3
    items:
    - விசை
    - ஞெமை
    - நமை
    analogy: ezhu.278
  links: []
  urai:
    iyaipu:
    - ezhu.243
    - ezhu.262
    - ezhu.278
    text: 'இயைபு (649): 243 உதிமரம், 262 ஒடுமரம், 278 சே — இதே வரிசையில் 282. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.283
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 283
  moolam: |-
    பனையும் அரையும் ஆவிரைக் கிளவியும்
    நினையுங் காலை அம்மொடு சிவணும்
    ஐயென் இறுதி அரைவரைந்து கெடுமே
    மெய்அவண் ஒழிய என்மனார் புலவர்
  kaandigai:
    porul: 'பனை, அரை, ஆவிரை அம்மோடு பொருந்தும்; ஐ ஈறு கெடும்; மெய் நிற்கும் (பனம், ஆவிரம்); அரை இதற்கு விலக்கு என்பது நூற்பாவின் "அரைவரைந்து" (ஒருதலை அன்மை: அரை எவ்வாறு புணரும் என்பது இங்கே விரிக்கப்படவில்லை).'
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: 280 ஐ-ஈற்றுக்கு வேற்றுமையில் வல்லெழுத்து என்றது; பனை, அரை, ஆவிரை — அம் + ஐ இறுதி அரைவரைந்து கெடும், மெய் ஒழியும்.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    items:
    - பனை
    - அரை
    - ஆவிரை
    suffix: அம்
    op: ஐ_கெடு
    exception: அரை
  links:
  - ezhu.280
  urai:
    iyaipu:
    - ezhu.280
    - ezhu.284
    - ezhu.285
    text: 'இயைபு (649): 284 பனை + அட்டு; 285 கொடி-முன் விலக்கு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக; காண்டிகை சுட்டிய ஐயம் ஒருதலை அன்மை
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்மனார்
- id: ezhu.284
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 284
  moolam: |-
    பனையின் முன்னர் அட்டுவரு காலை
    நிலையின் றாகும் ஐயென் உயிரே
    ஆகாரம் வருதல் ஆவயி னான
  kaandigai:
    porul: பனையின் முன் "அட்டு" வரும்போது ஐ நில்லாது; ஆகாரம் வரும் (பனாட்டு).
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 283 பனைக்கு அம்+ஐ என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: பனை
    context: அட்டு
    ops:
    - ஐ_நில்லா
    - ஆ_வரவு
  links: []
  urai:
    iyaipu:
    - ezhu.283
    - ezhu.285
    text: 'இயைபு (649): 283 அம்; 285 கொடி-முன். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.285
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 285
  moolam: |-
    கொடிமுன் வரினே ஐயவண் நிற்பக்
    கடிநிலை யின்றே வல்லெழுத்து மிகுதி
  kaandigai:
    porul: '"கொடி" முன் வந்தால் ஐ நிற்க வல்லெழுத்து மிகுதி விலக்கில்லை.'
    ethu: 283 பனை/அரை/ஆவிரை ஐ கெடும் என்றது; கொடி முன் வரும்போது ஐ அவண் நிற்கும் — கடிநிலை இன்றே (விலக்கு).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: கொடி
    context: ஐ_நிற்றல்
    property: வல்லின_மிகுதல்_விலக்கில்லை
  links: []
  urai:
    iyaipu:
    - ezhu.283
    - ezhu.284
    - ezhu.280
    text: 'இயைபு (649): 283 பொது; 285 “கடிநிலை இன்றே” — கட்டுப்பாடு இல்லை, விலக்கு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விலக்கு
    vilakkukkuriyathu:
    - ezhu.283
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: கடிநிலை
- id: ezhu.286
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 286
  moolam: |-
    திங்களும் நாளும் முந்துகிளந் தன்ன
  kaandigai:
    porul: திங்களும் நாளும் முன் கூறியபடியே (247, 248).
    ethu: 247 நாள்-க்கும் 248 திங்கள்-க்கும் சொன்ன இயல்புகள்; திங்களும் நாளும் முந்துகிளந்தன்ன (அவ்விரண்டின் இயல்பு இவற்றுக்கும்).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    items:
    - திங்கள்
    - நாள்
    refs:
    - ezhu.247
    - ezhu.248
  links: []
  urai:
    iyaipu:
    - ezhu.247
    - ezhu.248
    text: 'இயைபு (649): 247 நாள்-ஆன், 248 திங்கள்-இக்கு — இவற்றின் நீட்சி. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: முடிந்தது காட்டல்
    saanru: முந்துகிளந் தன்ன
- id: ezhu.287
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 287
  moolam: |-
    மழையென் கிளவி வளியியல் நிலையும்
  kaandigai:
    porul: '"மழை" வளியின் இயல்பில் நிற்கும் (242).'
    ethu: 242 வளி-க்குச் சொன்ன விதியின் கிளை; மழை வளியியல் நிலையும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: மழை
    analogy: ezhu.242
  links: []
  urai:
    iyaipu:
    - ezhu.242
    - ezhu.278
    - ezhu.282
    text: 'இயைபு (649): 242 வளி — “அவ்வியல் நிலையல் செவ்விதென்ப” (242); 287 அதே. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.288
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 288
  moolam: |-
    செய்யுள் மருங்கின் வேட்கை என்னும்
    ஐயென் இறுதி அவாமுன் வரினே
    மெய்யொடுங் கெடுதல் என்மனார் புலவர்
    டகாரம் ணகார மாதல் வேண்டும்
  kaandigai:
    porul: செய்யுளில் "வேட்கை"யின் ஐ ஈறு "அவா" முன் மெய்யொடும் கெடும்; டகரம் ணகரம் ஆதல் வேண்டும் (வேணவா).
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 280 ஐ-ஈற்றுப் பொது விதியின் கிளை; வேட்கை (ஐ-ஈறு) அவா முன் வரும்போது மெய்யொடு கெடும், டகாரம் ணகாரமாகும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: வேட்கை
    context: அவா
    ops:
    - ஐ_கெடு
    - ட→ண
    sphere: செய்யுள்
  links: []
  urai:
    iyaipu:
    - ezhu.280
    - ezhu.283
    text: 'இயைபு (649): 283 அம்+ஐ; 288 அவா+ஐ. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்மனார்
  - peyar: ஆணை கூறல்
    saanru: வேண்டும்
- id: ezhu.289
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 289
  moolam: |-
    ஓகார இறுதி ஏகார இயற்றே
  kaandigai:
    porul: ஓகார ஈறு ஏகார ஈற்றின் இயல்பினது.
    ethu: 274–279 ஏகார ஈறு; ஓகார ஈறு ஏகார ஈற்றின் இயல்பைப் பெறும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ஓகார_ஈறு
    inherits: ஏகார_ஈறு_இயல்பு
  links: []
  urai:
    iyaipu:
    - ezhu.274
    - ezhu.275
    - ezhu.290
    text: 'இயைபு (649): 274 ஏ-ஈறு; 275 மாறுகோள் எச்சம்/வினா/எண். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒப்பக் கூறல்
    saanru: இயற்றே
- id: ezhu.290
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 290
  moolam: |-
    மாறுகொள் எச்சமும் வினாவும் ஐயமும்
    கூறிய வல்லெழுத் தியற்கை யாகும்
  kaandigai:
    porul: மாறுகொள் எச்சம், வினா, ஐயம் — வல்லெழுத்து இயல்பாகும்.
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: 289 ஓ-ஈறு ஏ-ஈறு இயல என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: ஓகார_ஈறு_வல்லின_இயல்பு
    count: 3
    items:
    - மாறுகொள்_எச்சம்
    - வினா
    - ஐயம்
  links: []
  urai:
    iyaipu:
    - ezhu.289
    - ezhu.275
    text: 'இயைபு (649): 275 ஏ-ஈறு அதே; 290 ஓ-ஈறு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விலக்கு
    thunivu: நூலில் நேரடியாக
    vilakkukkuriyathu:
    - ezhu.289
  utthi:
  - peyar: கூறிற்று என்றல்
    saanru: கூறிய
- id: ezhu.291
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 291
  moolam: |-
    ஒழிந்ததன் நிலையும் மொழிந்தவற் றியற்றே
  kaandigai:
    porul: ஒழிந்தவற்றின் நிலையும் கூறியவற்றின் இயல்பினது.
    ethu: 289–290 ஓ-ஈற்றுக்குச் சொன்னவை; ஒழிந்ததன் (மீதமான) நிலையும் மொழிந்தவற்றியற்றே (சொன்னவற்றின் இயல்பே).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ஓகார_ஈறு
    property: கூறிய_இயல்பு
  links: []
  urai:
    iyaipu:
    - ezhu.289
    - ezhu.290
    text: 'இயைபு (649): 289–290 ஓ-ஈறு விதிகள். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: கூறிற்று என்றல்
    saanru: மொழிந்தவற்
- id: ezhu.292
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 292
  moolam: |-
    வேற்றுமைக் கண்ணும் அதனோ ரற்றே
    ஓகரம் வருதல் ஆவயி னான
  kaandigai:
    porul: வேற்றுமையிலும் அவ்வாறே; அவ்விடத்து ஓகரம் வரும்.
    ethu: 289–291 அல்வழி ஓ-ஈற்றுக்குச் சொன்னவை; வேற்றுமைக் கண்ணும் அவ்வாறே, ஓகாரம் வருதல் ஆவயினான.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    refs:
    - ezhu.289
    context: வேற்றுமை
    insert: ஓ
  links: []
  urai:
    iyaipu:
    - ezhu.216
    - ezhu.289
    text: 'இயைபு (649): 216 வேற்றுமைத் தொடர்; 289 ஓ-ஈறு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: ezhu.293
  pindam: 1
  padalam: ezhuthu
  othu: 7
  sutra: 293
  moolam: |-
    இல்லொடு கிளப்பின் இயற்கை யாகும்
  kaandigai:
    porul: '"இல்"லொடு கூறினால் இயல்பாகும்.'
    ethu: 289 ஓ-ஈறு என்றது; இல்லொடு கிளப்பின் (இல் உடன் சேரும்போது) இயற்கையாகும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
