    saanru: அவற்றுள்
- id: sol.30
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 30
  moolam: |-
    ஏனை இரண்டும் ஏனை இடத்த
  kaandigai:
    porul: ஏனை இரண்டும் (செல், கொடு) ஏனை இடத்தன (படர்க்கை).
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 28–29 தரு/வரு எல்லை சொன்னது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
