    text: 'இயைபு (649): 3 ஒன்று அறி சொல்; 219 ஒன்றன் படர்க்கை வினையும் அதே ஈறு. எடுத்துக்காட்டு: “அது இது உது” (சொல். 169) — த ஊர்ந்த குற்றியலுகர ஈறு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: ஒன்று
- id: sol.9
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 9
  moolam: |-
    அ ஆ வ என வரூஉம் இறுதி
    அப் பால் மூன்றே பல அறி சொல்லே
  kaandigai:
    porul: அ, ஆ, வ என வரும் இறுதி மூன்றும் பலவின்பால் ஈறு.
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: 3 அஃறிணையை இரண்டாகப் பிரித்தது; 9 பல-அறிக்கு ஈற்றுச் சோதனை — அ/ஆ/வ.
    eduthukkaattu:
    - text: பல்ல பல சில
      from: sol.170
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: பலவின்பால்_ஈறு
    count: 3
    items:
    - அ
    - ஆ
    - வ
  links:
  - sol.3
  - sol.10
  urai:
    iyaipu:
    - sol.3
    - sol.8
    - sol.170
    text: 'இயைபு (649): 3 பல அறி சொல்; 8 ஒன்று அறி. எடுத்துக்காட்டு: “பல்ல பல சில” (சொல். 170) — அகர ஈறு. எண்: மூன்று (நூற்பா) = மூன்று (அ, ஆ, வ).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: மூன்றே
- id: sol.10
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 10
  moolam: |-
    இரு திணை மருங்கின் ஐம் பால் அறிய
    ஈற்றின் நின்று இசைக்கும் பதினோர் எழுத்தும்
    தோற்றம்தாமே வினையொடு வருமே
  kaandigai:
    porul: 'இரு திணை ஐம்பாலும் அறிய ஈற்றில் நின்று இசைக்கும் பதினோர் எழுத்தும் வினையொடு வரும். 5–9 எண்ணிக்கை: ன், ள், ர், ப, மார், து, று, டு (த ற ட), அ, ஆ, வ = 1+1+3+3+3 = 11 — எண்ணிச் சரிபார்த்தது.'
    en:
      kooruvathu: 11
      enniyathu: 11
    ethu: 5–9 ஈற்றெழுத்தால் ஐம்பால் அறிதலைச் சொன்னன; அப் "பதினோர் எழுத்தும்" தோன்றுவது வினையோடு — பெயரில் அன்று என்பது 11 கூறும் வேறுபாடு.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: enumeration
    class: ஐம்பால்_ஈறு
    count: 11
    items:
    - ன்
    - ள்
    - ர்
    - ப
    - மார்
    - து
    - று
    - டு
    - அ
    - ஆ
    - வ
    context: வினையொடு
  links:
  - sol.5
  - sol.6
  - sol.7
  - sol.8
  - sol.9
  urai:
    iyaipu:
    - sol.5
    - sol.6
    - sol.7
    - sol.8
    - sol.9
    - sol.11
    text: 'இயைபு (649): 5 ன், 6 ள், 7 ர், ப, மார், 8 த, ற, ட ஊர்ந்த உ, 9 அ, ஆ, வ — எண்ணினால் பதினொன்று (மார் ஒன்றாக, த ற ட மூன்றாக எண்ணின்); 11 வினையின், பெயரின் பால் அறி கிளவி மயங்கா.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; பதினொன்றின் எண்ணிக்கை ஒருதலை அன்மை — நூலின் எண்ணால் சான்று
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: ஐம் பால்
- id: sol.11
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 11
  moolam: |-
    வினையின் தோன்றும் பால் அறி கிளவியும்
    பெயரின் தோன்றும் பால் அறி கிளவியும்
    மயங்கல் கூடா தம் மரபினவே
  kaandigai:
    porul: வினையால் தோன்றும் பால் அறி சொல்லும் பெயரால் தோன்றும் பால் அறி சொல்லும் மயங்கக் கூடா; தம் மரபின.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 10 ஈற்றெழுத்து "வினையொடு வருமே" என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    classes:
    - வினை_பால்
    - பெயர்_பால்
    property: மயங்கா_தம்_மரபின
  links: []
  urai:
    iyaipu:
    - sol.4
    - sol.10
    text: 'இயைபு (649): 10 ஈற்றெழுத்து வினையொடு; 4 பெயரால் பால் அறியாப் பெயர்கள். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஆணை கூறல்
    saanru: கூடா
- id: sol.12
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 12
  moolam: |-
    ஆண்மை திரிந்த பெயர் நிலைக் கிளவி
    ஆண்மை அறி சொற்கு ஆகு இடன் இன்றே
  kaandigai:
    porul: ஆண்மை திரிந்த பெயருக்கு ஆண்பால் அறி சொல் (வினை) வருதற்கு இடமில்லை (4-இன் தொடர்ச்சி).
    ethu: 5 னகர ஒற்றால் ஆடூஉ-அறி அறியப்பட்டது; ஆனால் 4 இல் சொன்ன பெண்மை-சுட்டி-ஆண்மை-திரிந்த பெயர் அதற்கு ஆகா.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ஆண்மை_திரிந்த_பெயர்
    property: ஆண்பால்_வினை_இல்லை
  links:
  - sol.4
  urai:
    iyaipu:
    - sol.4
    - sol.5
    - sol.182
    - sol.183
    text: 'இயைபு (649): 4 அந்தப் பெயரின் இயல்பு; 182/183 பால்-பிரிவின்மை. 5 ஆண்மை-அறிக்கு ன-ஒற்று — 12 அதற்கு இடம் இல்லை.'
    vagai: விலக்கு
    vilakkukkuriyathu:
    - sol.5
    thunivu: நூலில் நேரடியாக
- id: sol.13
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 13
  moolam: |-
    செப்பும் வினாவும் வழாஅல் ஓம்பல்
  kaandigai:
    porul: செப்பும் (விடை) வினாவும் வழுவாமல் காக்க. கேள்வி-விடை நெறியின் அடிப்படை நூற்பா (பயன்பாட்டு நெறி).
    ethu: 1–12 சொற்கள் வகைப்படுத்தப்பட்டன; இனி அவற்றைப் பயன்படுத்தும் முறை. செப்பு, வினா, வழாஅல் — மூன்றையும் ஓம்பல் (காத்தல்) வேண்டும்.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    ops:
    - செப்பு_வழா
    - வினா_வழா
    role: கேள்வி_விடை_நெறி
  links:
  - sol.14
  - sol.15
  urai:
    iyaipu:
    - sol.14
    - sol.15
    - sol.16
    text: 'இயைபு (649): 14 வினா எதிர் வரின் வினாவும் செப்பு; 15 செப்பு வழுவினும் வரைநிலை இல்லாத இடம்; 16 இரண்டிலும் சினை-முதல். "வழாஅல்" எது என நூல் விரிக்கவில்லை — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'வழாஅல் ஓம்பல்' பொருள் ஒருதலை அன்மை
  utthi:
  - peyar: ஆணை கூறல்
    saanru: வழாஅல்
- id: sol.14
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 14
  moolam: |-
    வினாவும் செப்பே வினா எதிர் வரினே
  kaandigai:
    porul: வினா எதிரே வந்தால் வினாவும் விடையாகும்.
    ethu: 13 மூன்றை ஓம்பல் என்றது; அவற்றுள் வினா, மற்றொரு வினா எதிர் வரும்போது செப்பாக மாறும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    op: வினா→விடை
    context: வினா_எதிர்
  links: []
  urai:
    iyaipu:
    - sol.13
    - sol.15
    text: 'இயைபு (649): 13 செப்பும் வினாவும் வழாஅல்; 15 செப்பு வழுவும் இடம். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.15
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 15
  moolam: |-
    செப்பே வழீஇயினும் வரை நிலை இன்றே
    அப் பொருள் புணர்ந்த கிளவியான
  kaandigai:
    porul: விடை வழுவினாலும் அப்பொருள் பொருந்திய சொல்லானால் விலக்கில்லை.
    ethu: 13 செப்பு வழாஅல் ஓம்பல் என்றது; வினவிய பொருளொடு புணர்ந்த கிளவியால் செப்பு வழுவினும் அது விலக்கப்படாது.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    context: பொருள்_புணர்வு
    property: வழு_விலக்கில்லை
  links: []
  urai:
    iyaipu:
    - sol.13
    - sol.14
    text: 'இயைபு (649): 13 பொது; 14 வினா எதிர் வினா; 15 அதற்கு விலக்கு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விலக்கு
    vilakkukkuriyathu:
    - sol.13
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: வரை நிலை இன்றே
- id: sol.16
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 16
  moolam: |-
    செப்பினும் வினாவினும் சினை முதல் கிளவிக்கு
    அப் பொருள் ஆகும் உறழ் துணைப் பொருளே
  kaandigai:
    porul: செப்பிலும் வினாவிலும் சினைக்கும் முதலுக்கும் உறழ்ந்து வரும் துணைப்பொருள் அப்பொருளாகும்.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 13–15 செப்பு/வினா பற்றிச் சொன்னது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    contexts:
    - செப்பு
    - வினா
    classes:
    - சினை
    - முதல்
    property: உறழ்_துணை_பொருள்
  links: []
  urai:
    iyaipu:
    - sol.13
    - sol.14
    text: 'இயைபு (649): 13, 14 செப்பும் வினாவும்; 16 அவற்றுள் சினையும் முதலும் உறழும் இடம். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: உறழ்
- id: sol.17
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 17
  moolam: |-
    தகுதியும் வழக்கும் தழீஇயின ஒழுகும்
    பகுதிக் கிளவி வரை நிலை இலவே
  kaandigai:
    porul: தகுதியும் வழக்கும் தழுவி நடக்கும் பகுதிச் சொற்கள் விலக்கில்லை.
    ethu: 16 உறழ்-துணைப் பொருள் என்றது; இது அதன் தொடர்ச்சி.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    classes:
    - தகுதி
    - வழக்கு
    property: வரை_நிலை_இல
  links: []
  urai:
    iyaipu:
    - sol.18
    - sol.27
    text: 'இயைபு (649): 18 பண்புகொள் பெயர்க்கொடை செய்யுள் ஆறு; 27 வழக்கின் உயர்சொல். "பகுதிக் கிளவி" எவை என நூல் பெயரிடவில்லை — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'பகுதிக் கிளவி' எவை என ஒருதலை அன்மை
- id: sol.18
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 18
  moolam: |-
    இனச் சுட்டு இல்லாப் பண்பு கொள் பெயர்க்கொடை
    வழக்கு ஆறு அல்ல செய்யுள் ஆறே
  kaandigai:
    porul: இனச் சுட்டு இல்லாத பண்பு கொள் பெயர்க்கொடை வழக்கு நெறியல்ல; செய்யுள் நெறி.
    ethu: 17 தகுதியும் வழக்கும் தழீஇயின பகுதிக் கிளவி என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
