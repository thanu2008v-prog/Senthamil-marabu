    - sol.29
    text: 'இயைபு (649): 28 பொது; 29 தரு, வரு. எண்: இரண்டு (நூற்பா) = இரண்டு (செலவு, கொடை).'
    vagai: விலக்கு
    vilakkukkuriyathu:
