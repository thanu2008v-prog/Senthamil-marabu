    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.53
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 53
  moolam: |-
    அவற்றுள்
    வினை வேறுபடூஉம் பல பொருள் ஒரு சொல்
    வேறுபடு வினையினும் இனத்தினும் சார்பினும்
    தேறத் தோன்றும் பொருள் தெரி நிலையே
  kaandigai:
    porul: வினை வேறுபடும் பல பொருள் ஒரு சொல்லின் பொருள், வேறுபடும் வினை, இனம், சார்பு ஆகியவற்றால் தெளிவாகும்.
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: 52 வினை-வேறுபடூஉம் வகை என்றது; அது வினை, இனம், சார்பு வேறுபாட்டால் அறியப்படும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    contexts:
    - வினை
    - இனம்
    - சார்பு
    property: பொருள்_தெளிவு
  links: []
  urai:
    iyaipu:
