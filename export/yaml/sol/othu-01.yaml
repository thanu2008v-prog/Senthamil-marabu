    saanru: கிளந்தாங்கு
- id: sol.56
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 56
  moolam: |-
    குறித்தோன் கூற்றம் தெரித்து மொழி கிளவி
  kaandigai:
    porul: (அவ்விடத்து) குறித்தவன் கருத்தைத் தெரிவிக்கும் மொழியால் கூறுக.
    ethu: 52–55 பல பொருள் ஒரு சொல் என்றது; குறித்தோன் கூற்றம் தெரித்து மொழி கிளவி — அதன் ஒரு பயன்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    context: குறித்தோன்_கருத்து
    op: தெரித்து_மொழி
  links: []
  urai:
    iyaipu:
    - sol.13
    - sol.55
    - sol.57
    text: 'இயைபு (649): 13 செப்பு/வினா; 55 பல பொருள் ஒரு சொல்; 57 குடிமை/ஆண்மை வகை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.57
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 57
  moolam: |-
    குடிமை ஆண்மை இளமை மூப்பே
    அடிமை வன்மை விருந்தே குழுவே
    பெண்மை அரசே மகவே குழவி
    தன்மை திரி பெயர் உறுப்பின் கிளவி
    காதல் சிறப்பே செறற்சொல் விறற்சொல் என்று
    ஆவறு மூன்றும் உளப்படத் தொகைஇ
    அன்ன பிறவும் அவற்றொடு சிவணி
    முன்னத்தின் உணரும் கிளவி எல்லாம்
    உயர்திணை மருங்கின் நிலையின ஆயினும்
    அஃறிணை மருங்கின் கிளந்தாங்கு இயலும்
  kaandigai:
    porul: குடிமை, ஆண்மை, இளமை, மூப்பு, அடிமை, வன்மை, விருந்து, குழு, பெண்மை, அரசு, மகவு, குழவி, தன்மை திரி பெயர், உறுப்பின் கிளவி, காதல், சிறப்பு, செறற்சொல், விறற்சொல் — "ஆவறு மூன்றும்" (6×3 = 18; எண்ணிச் சரிபார்த்தது) — உயர்திணைக்கு உரியன ஆயினும் அஃறிணை முடிபு கொள்ளும்.
    en:
      kooruvathu: 18
      enniyathu: 18
    ethu: 1 இரு திணை என்றது; ஆனால் குடிமை, ஆண்மை, இளமை, மூப்பு முதலிய முன்னத்தின் உணரும் கிளவி உயர்திணை நிலையினாயினும் அஃறிணை மருங்கின் கிளந்தாங்கு இயலும்.
    eduthukkaattu:
    - text: குழவியொடு
      from: porul.545
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: முன்னம்_உணர்_கிளவி
    count: 18
    items:
    - குடிமை
    - ஆண்மை
    - இளமை
    - மூப்பு
    - அடிமை
    - வன்மை
    - விருந்து
    - குழு
    - பெண்மை
    - அரசு
    - மகவு
    - குழவி
    - தன்மை_திரி_பெயர்
    - உறுப்பின்_கிளவி
    - காதல்
    - சிறப்பு
    - செறற்சொல்
    - விறற்சொல்
    contexts:
    - உயர்திணை
    - அஃறிணை_முடிபு
  links:
  - sol.58
  urai:
    iyaipu:
    - sol.1
    - sol.51
    - sol.58
    - sol.198
    text: 'இயைபு (649): ''குழவியொடு'' (பொருள். 545) — குழவி (57-இன் பட்டியலில்) இளமைப் பெயராக இயங்குகிறது. 58 இதன் விரிவு; 198 ''இறைச்சிப் பொருள்வயின்''. மறுதலைக் கடாஅ (650): 1 எதிர் 57 — விடை: வகைப்பாடு மாறவில்லை, பயன்பாடு மாறுகிறது.'
    vagai: விதி-விலக்கு
    vilakkukkuriyathu:
    - sol.1
    - sol.2
    maruthalai:
    - kadaa: 1 'உயர்திணை... அஃறிணை' — இரு திணை நிலைத்தது. 57 'அஃறிணை மருங்கின் இயலும்' — மாறா?
      maattram: 1 இனப்பாகுபாடு; 57 வழக்கில் (முன்னத்தில்) அஃறிணை-போல் இயங்கும் — வகைப்பாடு மாறவில்லை.
      saanru:
      - text: உயர்திணை என்மனார் மக்கட் சுட்டே
        from: sol.1
      - text: அஃறிணை மருங்கின் கிளந்தாங்கு இயலும்
        from: sol.57
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: மூன்றும்
  - peyar: வந்தது கொண்டு வாராதது உணர்த்தல்
    saanru: பிறவும்
  - peyar: கூறிற்று என்றல்
    saanru: கிளந்தாங்கு
- id: sol.58
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 58
  moolam: |-
    காலம் உலகம் உயிரே உடம்பே
    பால் வரை தெய்வம் வினையே பூதம்
    ஞாயிறு திங்கள் சொல் என வரூஉம்
    ஆயீர் ஐந்தொடு பிறவும் அன்ன
    ஆவயின் வரூஉம் கிளவி எல்லாம்
    பால் பிரிந்து இசையா உயர்திணை மேன
  kaandigai:
    porul: காலம், உலகம், உயிர், உடம்பு, பால்வரை தெய்வம், வினை, பூதம், ஞாயிறு, திங்கள், சொல் — "ஆயீர் ஐந்து" (2×5 = 10; எண்ணிச் சரிபார்த்தது) — பிறவும்; இவை பால் பிரிந்து இசைக்காத உயர்திணைமேலன. ("பால் வரை தெய்வம்" ஒன்றாக எண்ணினால் மட்டுமே பத்து; அதை நூல் பிரித்துக் கூறவில்லை — ஒருதலை அன்மை.)
    en:
      kooruvathu: 10
      enniyathu: 10
    ethu: 57 உயர்திணை→அஃறிணை இயலும் என்றது; காலம், உலகம், உயிர், உடம்பு, பால்-வரை, தெய்வம், வினை, பூதம், ஞாயிறு, திங்கள் — இவை பால் பிரியாமல் உயர்திணையாகும்.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: enumeration
    class: பால்_பிரியா_உயர்திணை
    count: 10
    items:
    - காலம்
    - உலகம்
    - உயிர்
    - உடம்பு
    - பால்வரை_தெய்வம்
    - வினை
    - பூதம்
    - ஞாயிறு
    - திங்கள்
    - சொல்
    items_unspecified: true
  links:
  - sol.57
  urai:
    iyaipu:
    - sol.57
    - sol.59
    - sol.60
    text: 'இயைபு (649): 57 பொது; 59–60 இதன் வழக்கு எல்லை. எண்: ''ஆயீர் ஐந்தொடு'' — 5 × 2 = 10 (பட்டியல்); நூற்பா எண் கூறவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக; காண்டிகை சுட்டிய ஐயம் ஒருதலை அன்மை
  utthi:
  - peyar: வந்தது கொண்டு வாராதது உணர்த்தல்
    saanru: பிறவும்
- id: sol.59
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 59
  moolam: |-
    நின்றாங்கு இசைத்தல் இவண் இயல்பு இன்றே
  kaandigai:
    porul: (அவை) நின்றபடியே இசைத்தல் இங்கே இயல்பு இல்லை.
    ethu: 58 பத்து வகையும் பால்-பிரியா உயர்திணை என்றது; நின்றாங்கு இசைத்தல் (பால்-பிரிவின்றி நிற்றல்) இவண் இயல்பு இன்று — விலக்கு.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    property: நின்றபடி_இசைத்தல்_இயல்பில்லை
  links: []
  urai:
    iyaipu:
    - sol.58
    - sol.60
    text: 'இயைபு (649): 58 பட்டியல்; 59 விலக்கு; 60 வேறிடம். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விலக்கு
    vilakkukkuriyathu:
    - sol.58
    thunivu: நூலில் நேரடியாக
- id: sol.60
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 60
  moolam: |-
    இசைத்தலும் உரிய வேறிடத்தான
  kaandigai:
    porul: வேறிடத்து இசைத்தலும் உரியன.
    ethu: 59 இவண் இயல்பு இன்று என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    property: வேறிடத்து_இசைத்தல்_உரியது
  links: []
  urai:
    iyaipu:
    - sol.58
    - sol.59
    - sol.61
    text: 'இயைபு (649): 58 பட்டியல்; 59 இவண் இயல்பு இன்று; 60 வேறிடத்தில் இசைத்தலும் உரித்து — விலக்கு; 61 எடுத்த மொழி இனம். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விலக்கு
    thunivu: நூலில் நேரடியாக
    vilakkukkuriyathu:
    - sol.59
- id: sol.61
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 61
  moolam: |-
    எடுத்த மொழி இனம் செப்பலும் உரித்தே
  kaandigai:
    porul: எடுத்த மொழி அதன் இனத்தையும் செப்புதல் உண்டு.
    ethu: 60 வேறிடத்தில் இசைத்தல் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    context: எடுத்த_மொழி
    property: இனம்_செப்பல்
  links: []
  urai:
    iyaipu:
    - sol.60
    - sol.62
    text: 'இயைபு (649): 60 வேறிடம்; 62 பன்மை-சுட்டிய சினை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: உரித்தே
- id: sol.62
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 62
  moolam: |-
    கண்ணும் தோளும் முலையும் பிறவும்
    பன்மை சுட்டிய சினை நிலைக் கிளவி
    பன்மை கூறும் கடப்பாடு இலவே
    தம் வினைக்கு இயலும் எழுத்து அலங்கடையே
  kaandigai:
    porul: கண், தோள், முலை முதலிய பன்மை சுட்டிய சினைச்சொல் பன்மை கூறும் கட்டாயம் இல்லை — தம் வினைக்கு இயலும் எழுத்து அல்லாதவிடத்து.
    ethu: 61 எடுத்த மொழியின் இனம் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: பன்மை_சினைச்சொல்
    property: பன்மை_கூறல்_கட்டாயமில்லை
    othu_end: true
  links:
  - sol.49
  urai:
    iyaipu:
    - sol.16
    - sol.61
    text: 'இயைபு (649): 16 சினை முதல் கிளவி; 61 எடுத்த மொழி இனம். "எழுத்து அலங்கடையே" — உள்ளேயே விலக்கு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: வந்தது கொண்டு வாராதது உணர்த்தல்
    saanru: பிறவும்
