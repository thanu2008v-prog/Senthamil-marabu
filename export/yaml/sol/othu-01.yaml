    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.24
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 24
  moolam: |-
    உருபு என மொழியினும் அஃறிணைப் பிரிப்பினும்
    இரு வீற்றும் உரித்தே சுட்டும் காலை
  kaandigai:
    porul: உருபு எனக் கூறினும் அஃறிணையைப் பிரித்தாலும், சுட்டும்போது இரு திணையும் உரியன.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 23 பால்-மயக்கத்தைச் சொன்னது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    contexts:
    - உருபு
    - அஃறிணை_பிரிப்பு
    property: இரு_திணை_உரிமை
  links: []
  urai:
    iyaipu:
    - sol.23
    - sol.169
    text: 'இயைபு (649): 169 ''அது இது உது'' — அஃறிணைப் பிரிப்பு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: உரித்தே
- id: sol.25
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 25
  moolam: |-
    தன்மை சுட்டலும் உரித்து என மொழிப
    அன்மைக் கிளவி வேறு இடத்தான
  kaandigai:
    porul: '"அன்மை"ச் சொல் வேறிடத்துத் தன்மை சுட்டுதலும் உரியது.'
    ethu: 24 இரு வீறு என்றது; தன்மை சுட்டலும் உரித்து — அன்மைக் கிளவி வேறு இடத்தது.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: அன்மை_கிளவி
    property: தன்மை_சுட்டல்
  links: []
  urai:
    iyaipu:
