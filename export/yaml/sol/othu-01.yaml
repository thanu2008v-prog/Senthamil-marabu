    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.6
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 6
  moolam: |-
    ளஃகான் ஒற்றே மகடூஉ அறி சொல்
  kaandigai:
    porul: ளகர ஒற்று (ள்) பெண்பால் ஈறு.
    ethu: 5 னகர ஒற்றால் ஆடூஉ-அறி அறியப்பட்டது; 6 ளகர ஒற்றால் மகடூஉ-அறி.
    eduthukkaattu:
    - text: மகள்
      from: sol.165
  nilai: நூலில் நேரடியாக
  kanini:
