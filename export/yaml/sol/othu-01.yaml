    - sol.54
    text: 'இயைபு (649): 52 இரு வகை; 54 ஒன்று வினை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: அதிகார முறை
    saanru: அவற்றுள்
- id: sol.54
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 54
  moolam: |-
    ஒன்று வினை மருங்கின் ஒன்றித் தோன்றும்
  kaandigai:
    porul: ஒரு வினையிடத்து ஒன்றித் தோன்றும்.
    ethu: 53 முதல் வகை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
