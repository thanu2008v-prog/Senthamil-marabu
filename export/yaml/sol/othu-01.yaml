    - sol.50
    - sol.172
    text: 'இயைபு (649): 49, 50 பொதுச்சொல்; 172 அஃறிணை மருங்கின் பன்மையும் ஒருமையும் பால் அறி வந்த பெயர். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.52
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 52
  moolam: |-
    வினை வேறுபடூஉம் பல பொருள் ஒரு சொல்
    வினை வேறுபடாஅப் பல பொருள் ஒரு சொல் என்று
    ஆயிரு வகைய பல பொருள் ஒரு சொல்
  kaandigai:
    porul: 'பல பொருள் ஒரு சொல் இருவகை: வினை வேறுபடுவது, வினை வேறுபடாதது.'
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 49–51 பொதுச்சொல் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
