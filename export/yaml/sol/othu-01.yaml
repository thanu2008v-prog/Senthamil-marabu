    - sol.24
    text: 'இயைபு (649): 23 ஐயக் கிளவி; 24 இரு வீற்றும் உரித்து; 25 தன்மை சுட்டலும் உரித்து. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
  - peyar: தான் குறியிடுதல்
    saanru: என மொழிப
  - peyar: ஒருதலை அன்மை
    saanru: உரித்து
- id: sol.26
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 26
  moolam: |-
    அடை சினை முதல் என முறை மூன்றும் மயங்காமை
    நடை பெற்று இயலும் வண்ணச் சினைச் சொல்
  kaandigai:
    porul: நிறப் பண்பு குறிக்கும் சினைச்சொல், அடை-சினை-முதல் என்ற முறை மூன்றும் மயங்காமல் நடக்கும்.
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: வண்ணச் சினைச் சொல் (நிறம், சினை, முதல் சேர்ந்த தொடர்) அடை, சினை, முதல் என்னும் முறை மயங்காமல் வரும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: வண்ண_சினைச்சொல்
    count: 3
    items:
    - அடை
    - சினை
    - முதல்
    property: மயங்கா
  links: []
  urai:
    iyaipu:
    - sol.16
    - sol.416
    text: 'இயைபு (649): 16 சினை முதல் கிளவி; 416 வண்ணம் முதலியன பண்பின் தொகை. எடுத்துக்காட்டு நூல் தரவில்லை ("வண்ணம் வடிவே" சொல். 79 பட்டியலே).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: மூன்றும்
- id: sol.27
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 27
  moolam: |-
    ஒருவரைக் கூறும் பன்மைக் கிளவியும்
    ஒன்றனைக் கூறும் பன்மைக் கிளவியும்
    வழக்கின் ஆகிய உயர் சொல் கிளவி
    இலக்கண மருங்கின் சொல் ஆறு அல்ல
  kaandigai:
    porul: ஒருவரைக் கூறும் பன்மையும் ஒன்றனைக் கூறும் பன்மையும் வழக்கில் வந்த உயர்சொல்; இலக்கண நெறியின் சொல்லல்ல (வழுவமைதி). நூல் வழக்கையும் இலக்கணத்தையும் வேறுபடுத்திக் காட்டும் இடம்.
    ethu: 2, 3 ஐம்பால் சொல்லை வகுத்தன; ஒருவரைக் கூறும் பன்மையும் ஒன்றனைக் கூறும் பன்மையும் வழக்கில் வரும் உயர்சொல் — இலக்கணச் சொல் நெறி அல்ல.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class:
    - ஒருவர்_பன்மை
    - ஒன்றன்_பன்மை
    property: இலக்கண_சொல்_அல்ல
  links: []
  urai:
    iyaipu:
    - sol.2
    - sol.3
    - sol.17
    text: 'இயைபு (649): 2, 3 ஐம்பால்; 17 தகுதியும் வழக்கும் தழீஇய பகுதிக் கிளவி. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: ஆறு
- id: sol.28
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 28
  moolam: |-
    செலவினும் வரவினும் தரவினும் கொடையினும்
    நிலை பெறத் தோன்றும் அந் நாற் சொல்லும்
    தன்மை முன்னிலை படர்க்கை என்னும்
    அம் மூ இடத்தும் உரிய என்ப
  kaandigai:
    porul: செலவு, வரவு, தரவு, கொடை — நான்கு சொல்லும் தன்மை, முன்னிலை, படர்க்கை என்ற மூவிடத்துக்கும் உரியன.
    en:
      kooruvathu: 4
      enniyathu: 4
    ethu: 17 பகுதிக் கிளவி என்றது; செலவு, வரவு, தரவு, கொடை — நான்கும் மூன்று இடத்திலும் நிற்கும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: நால்_சொல்
    count: 4
    items:
    - செலவு
    - வரவு
    - தரவு
    - கொடை
    contexts:
    - தன்மை
    - முன்னிலை
    - படர்க்கை
  links:
  - sol.29
  - sol.30
