- id: sol.23
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 23
  moolam: |-
    பால் மயக்கு உற்ற ஐயக் கிளவி
    தான் அறி பொருள்வயின் பன்மை கூறல்
  kaandigai:
    porul: பால் மயங்கிய ஐயச் சொல்லில், அறிந்த பொருளிடத்துப் பன்மை கூறுக.
    ethu: 10–11 பால்-அறி சொல் என்றது; இது அதன் தொடர்ச்சி.
    eduthukkaattu:
    - text: யாவன் யாவள் யாவர்
      from: sol.164
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
