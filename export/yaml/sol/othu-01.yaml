    iyaipu:
    - sol.29
    - sol.30
    text: 'இயைபு (649): 29 தரு, வரு — தன்மை, முன்னிலை; 30 ஏனை இரண்டு — படர்க்கை. எண்: நான்கு (நூற்பா) = நான்கு (செலவு, வரவு, தரவு, கொடை); மூன்று (இடம்).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: sol.29
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 29
  moolam: |-
    அவற்றுள்
    தரு சொல் வரு சொல் ஆயிரு கிளவியும்
    தன்மை முன்னிலை ஆயீர் இடத்த
  kaandigai:
    porul: அவற்றுள் "தரு", "வரு" இரண்டும் தன்மை, முன்னிலை இடத்தன.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 28 நான்கும் மூன்று இடத்திலும் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    items:
    - தரு
    - வரு
    contexts:
    - தன்மை
    - முன்னிலை
  links: []
  urai:
    iyaipu:
    - sol.28
    - sol.30
    text: 'இயைபு (649): 28 பொது; 29 தரு, வரு — தன்மை, முன்னிலை; 30 ஏனை இரண்டு. எண்: இரண்டு (நூற்பா) = இரண்டு (தரு, வரு).'
    vagai: விலக்கு
    vilakkukkuriyathu:
    - sol.28
    thunivu: நூலில் நேரடியாக
  utthi:
