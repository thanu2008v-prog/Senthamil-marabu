    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.7
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 7
  moolam: |-
    ரஃகான் ஒற்றும் பகர இறுதியும்
    மாரைக் கிளவி உளப்பட மூன்றும்
    நேரத் தோன்றும் பலர் அறி சொல்லே
  kaandigai:
    porul: ரகர ஒற்று (ர்), பகர இறுதி (ப), "மார்" — மூன்றும் பலர்பால் ஈறு.
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: 5–6 இரண்டு வகைக்கு ஒற்று வைத்தன; 7 மூன்றாம் வகைக்கு (பல்லோர் அறி) மூன்று அளவுகோல் — ரகர ஒற்று, பகர இறுதி, மாரை-வகை.
    eduthukkaattu:
    - text: அவர்
      from: sol.164
  nilai: நூலில் நேரடியாக
