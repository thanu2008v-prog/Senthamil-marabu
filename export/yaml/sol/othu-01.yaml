- id: sol.31
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 31
  moolam: |-
    யாது எவன் என்னும் ஆயிரு கிளவியும்
    அறியாப் பொருள்வயின் செறியத் தோன்றும்
  kaandigai:
    porul: '"யாது", "எவன்" இரண்டும் அறியாத பொருளிடத்துத் தோன்றும்.'
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 28–30 செலவு/வரவு/தரவு/கொடை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    items:
    - யாது
    - எவன்
    context: அறியாப்_பொருள்
  links: []
  urai:
    iyaipu:
    - sol.32
    text: 'இயைபு (649): 32 யாது வினா அறிந்த பொருளிலும் ஐயம் தீர்க்க. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.32
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 32
  moolam: |-
    அவற்றுள்
    யாது என வரூஉம் வினாவின் கிளவி
    அறிந்த பொருள்வயின் ஐயம் தீர்தற்குத்
    தெரிந்த கிளவி ஆதலும் உரித்தே
  kaandigai:
    porul: அவற்றுள் "யாது" அறிந்த பொருளில் ஐயம் தீர்தற்குத் தெரிந்த சொல்லாதலும் உண்டு.
    ethu: 31 யாது/எவன் அறியாப் பொருளுக்கு என்றது; 'யாது' வினா அறிந்த பொருள்வயினும் ஐயம் தீர்த்தற்கு உரியது — விலக்கு.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: யாது
    context: அறிந்த_பொருள்
    property: ஐயம்_தீர்க்கும்
  links: []
  urai:
    iyaipu:
    - sol.31
    text: 'இயைபு (649): 31 பொது; 32 ''ஐயம் தீர்தற்கு'' — விலக்கு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விலக்கு
    vilakkukkuriyathu:
    - sol.31
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: அதிகார முறை
    saanru: அவற்றுள்
  - peyar: ஒருதலை அன்மை
    saanru: ஆதலும்
- id: sol.33
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 33
  moolam: |-
    இனைத்து என அறிந்த சினை முதல் கிளவிக்கு
    வினைப்படு தொகுதியின் உம்மை வேண்டும்
  kaandigai:
    porul: இத்தனை என அறிந்த சினைக்கும் முதலுக்கும் வினைப்படு தொகுதியில் உம்மை வேண்டும்.
    ethu: எண்ணப்பட்ட சினையும் முதலும் எல்லாம் வினைக்கு உட்படுமாயின் அதனை உம்மை காட்டுகிறது. நிலையில்லாப் பொருளுக்கும் அதுவே — "மன்னாப் பொருளும் அன்ன இயற்றே" (சொல். 34). எ.கா. நூலின் தொகைச் சொற்களிலேயே — "அப்பால் ஐந்தும்" (எழு. 3), "அப்பால் ஏழும்" (எழு. 4).
    eduthukkaattu:
    - text: மன்னாப் பொருளும் அன்ன இயற்றே
      from: sol.34
    - text: அப்பால் ஐந்தும்
      from: ezhu.3
    - text: அப்பால் ஏழும்
      from: ezhu.4
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    context: வினைப்படு_தொகுதி
    insert: உம்மை
  links: []
  urai:
    iyaipu:
    - sol.34
    - sol.170
    text: 'இயைபு (649): 34 மன்னாப் பொருளும் அவ்வியற்று; 170 இனைத்து எனக் கிளக்கும் எண்ணுக்குறிப் பெயர். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஆணை கூறல்
    saanru: வேண்டும்
- id: sol.34
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 34
  moolam: |-
    மன்னாப் பொருளும் அன்ன இயற்றே
  kaandigai:
    porul: நிலைபெறாப் பொருளும் அவ்வியல்பினது.
    ethu: 33 இனைத்து-வகைக்கு உம்மை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: மன்னாப்_பொருள்
    analogy: sol.33
  links: []
  urai:
    iyaipu:
    - sol.33
    text: 'இயைபு (649): 33 இனைத்து-வகை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒப்பக் கூறல்
    saanru: இயற்றே
- id: sol.35
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 35
  moolam: |-
    எப் பொருள் ஆயினும் அல்லது இல் எனின்
    அப் பொருள் அல்லாப் பிறிது பொருள் கூறல்
  kaandigai:
    porul: எப்பொருளாயினும் "இல்லை" எனக் கூறுவதாயின், அப்பொருள் அல்லாத பிறிது பொருளைக் கூறுக.
    ethu: 33–34 உம்மை-விதி முடிந்தது; எப்பொருளாயினும் 'அல்லது இல்' எனின் அப்பொருள் அல்லாப் பிறிது பொருள் கூறல்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    op: இன்மை_கூற்று
    effect: பிறிது_பொருள்_கூறு
  links: []
  urai:
    iyaipu:
    - sol.36
    - sol.37
    text: 'இயைபு (649): 36 சுட்டிக் கூறல்; 37 பொருள் வேறுபடாமை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.36
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 36
  moolam: |-
    அப் பொருள் கூறின் சுட்டிக் கூறல்
  kaandigai:
    porul: அப்பொருளைக் கூறினால் சுட்டிக் கூறுக.
    ethu: 35 பிறிது பொருள் கூறல் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    op: சுட்டி_கூறல்
  links: []
  urai:
    iyaipu:
    - sol.35
    - sol.37
    text: 'இயைபு (649): 35 பிறிது பொருள்; 37 சுட்டுப்பெயர். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.37
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 37
  moolam: |-
    பொருளொடு புணராச் சுட்டுப்பெயர் ஆயினும்
    பொருள் வேறுபடாஅது ஒன்று ஆகும்மே
  kaandigai:
    porul: பொருளோடு புணராத சுட்டுப்பெயர் ஆயினும் பொருள் வேறுபடாமல் ஒன்றாகும்.
    ethu: 35–36 பிறிது பொருள்/சுட்டிக் கூறல் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: சுட்டுப்பெயர்
    property: ஒன்றாகும்
  links: []
  urai:
    iyaipu:
    - sol.36
    - sol.40
    text: 'இயைபு (649): 36 சுட்டு; 40 காரணக் கிளவி. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: ஒன்று
- id: sol.38
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 38
  moolam: |-
    இயற்பெயர்க் கிளவியும் சுட்டுப்பெயர்க் கிளவியும்
    வினைக்கு ஒருங்கு இயலும் காலம் தோன்றின்
    சுட்டுப்பெயர்க் கிளவி முற்படக் கிளவார்
    இயற்பெயர் வழிய என்மனார் புலவர்
  kaandigai:
    porul: இயற்பெயரும் சுட்டுப்பெயரும் ஒரே வினைக்கு வரும்போது சுட்டுப்பெயரை முன் வைக்கார்; இயற்பெயர் வழியே (பின்) வைப்பர்.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 'சுட்டுப்பெயர் தானே பொருள் உணர்த்தாது; முன் வந்த பெயரைச் சுட்டுவது (சொல். 37: "பொருளொடு புணராச் சுட்டுப்பெயர் ஆயினும்"). ஆகவே இயற்பெயர் முன் வர வேண்டும். செய்யுளில் மட்டும் விலக்கு — "முற்படக் கிளத்தல் செய்யுளுள் உரித்தே" (சொல். 39).'
    eduthukkaattu:
    - text: பொருளொடு புணராச் சுட்டுப்பெயர் ஆயினும்
      from: sol.37
    - text: முற்படக் கிளத்தல் செய்யுளுள் உரித்தே
      from: sol.39
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    classes:
    - இயற்பெயர்
    - சுட்டுப்பெயர்
    order: இயற்பெயர்_முதல்
  links: []
  urai:
    iyaipu:
    - sol.37
    - sol.39
    - sol.41
    text: 'இயைபு (649): 37 சுட்டுப்பெயர்; 39 செய்யுளில் முற்படக் கிளத்தலும் உரித்து — விலக்கு; 41 சிறப்புப்பெயருக்கும் இயற்பெயர் முற்படக் கிளவார். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்மனார்
- id: sol.39
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 39
  moolam: |-
    முற்படக் கிளத்தல் செய்யுளுள் உரித்தே
  kaandigai:
    porul: செய்யுளில் (சுட்டுப்பெயரை) முன் வைத்தலும் உரியது.
    ethu: 38 சுட்டுப்பெயரை முற்படக் கிளவார் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    context: செய்யுள்
    property: முன்_வைப்பு_உரித்து
  links: []
  urai:
    iyaipu:
    - sol.38
    text: 'இயைபு (649): 38 வழக்கு நெறி; 39 செய்யுளுக்கு விலக்கு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விலக்கு
    thunivu: நூலில் நேரடியாக
    vilakkukkuriyathu:
    - sol.38
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: உரித்தே
- id: sol.40
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 40
  moolam: |-
    சுட்டு முதல் ஆகிய காரணக் கிளவியும்
    சுட்டுப்பெயர் இயற்கையின் செறியத் தோன்றும்
  kaandigai:
    porul: சுட்டு முதலான காரணச் சொல்லும் சுட்டுப்பெயர் இயல்பில் நிற்கும்.
    ethu: 21 காரணம் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: காரண_கிளவி
    analogy: சுட்டுப்பெயர்
  links: []
  urai:
    iyaipu:
    - sol.21
    - sol.37
    - sol.41
    text: 'இயைபு (649): 21 காரணம்; 37 சுட்டுப்பெயர்; 41 சிறப்புப் பெயர். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.41
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 41
  moolam: |-
    சிறப்பின் ஆகிய பெயர்நிலைக் கிளவிக்கும்
    இயற்பெயர்க் கிளவி முற்படக் கிளவார்
  kaandigai:
    porul: சிறப்புப் பெயருக்கும் இயற்பெயரை முன் வைக்கார்.
    ethu: 38 சுட்டுப்பெயருக்கு முன் இயற்பெயர் என்றது போல, சிறப்புப்பெயர்க்கும் இயற்பெயரை முன் கூறார் — சிறப்புப்பெயரே முன் வரும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    classes:
    - சிறப்புப்பெயர்
    - இயற்பெயர்
    property: முன்_வைப்பு_இல்லை
  links: []
  urai:
    iyaipu:
    - sol.38
    - sol.40
    text: 'இயைபு (649): 38 சுட்டுப்பெயர் இயற்பெயர் வழியது; 40 காரணக் கிளவி. மறுதலைக் கடாஅ (650): 38-இல் இயற்பெயர் முன், 41-இல் பின் — மாறா? விடை: இணையும் பெயர் வேறு (சுட்டுப்பெயர் / சிறப்புப்பெயர்).'
    vagai: விதி
    maruthalai:
    - kadaa: 38 இயற்பெயர் முன்; 41 இயற்பெயர் முன் அன்று — மாறா?
      maattram: 38 சுட்டுப்பெயரொடு இணையும் இடம்; 41 சிறப்புப்பெயரொடு இணையும் இடம் — இணையும் பெயர் வேறு.
      saanru:
      - text: சுட்டுப்பெயர்க் கிளவி முற்படக் கிளவார்
        from: sol.38
      - text: சிறப்பின் ஆகிய பெயர்நிலைக் கிளவிக்கும்
        from: sol.41
    thunivu: நூலில் நேரடியாக
- id: sol.42
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 42
  moolam: |-
    ஒரு பொருள் குறித்த வேறு பெயர்க் கிளவி
    தொழில் வேறு கிளப்பின் ஒன்று இடன் இலவே
  kaandigai:
    porul: ஒரு பொருளைக் குறித்த வேறு பெயர்கள் தொழில் வேறாகக் கூறினால் ஒன்றுபடா.
    ethu: 41 சிறப்புப் பெயர் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    context: வேறு_தொழில்
    property: ஒன்றுபடா
  links: []
  urai:
    iyaipu:
    - sol.41
    - sol.52
    text: 'இயைபு (649): 41 சிறப்புப்பெயர்; 52 பல பொருள் ஒரு சொல் — இதன் எதிர்நிலை (ஒரு பொருள் பல பெயர்). எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: ஒன்று
- id: sol.43
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 43
  moolam: |-
    தன்மைச் சொல்லே அஃறிணைக் கிளவி என்று
    எண்ணு வழி மருங்கின் விரவுதல் வரையார்
  kaandigai:
    porul: எண்ணும் இடத்து தன்மைச் சொல்லும் அஃறிணைச் சொல்லும் விரவுதல் விலக்கில்லை.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: தன்மைச் சொல்லையும் அஃறிணைக் கிளவியையும் எண்ணி உடன் கூறும் இடத்தில் அவை விரவுதலை விலக்கார்.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    context: எண்ணிடம்
    classes:
    - தன்மை
    - அஃறிணை
    property: விரவு_விலக்கில்லை
  links: []
  urai:
    iyaipu:
    - sol.44
    - sol.45
    text: 'இயைபு (649): 44 ஒருமை எண்ணின் பொதுப் பிரி பாற்சொல்; 45 வியங்கோள் திணை விரவு. "விரவுதல் வரையார்" — எந்த அளவு என நூல் வரையவில்லை — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'விரவுதல் வரையார்' ஒருதலை அன்மை
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: வரையார்
- id: sol.44
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 44
  moolam: |-
    ஒருமை எண்ணின் பொதுப் பிரி பாற்சொல்
    ஒருமைக்கு அல்லது எண்ணு முறை நில்லாது
  kaandigai:
    porul: ஒருமை எண்ணில் பொதுப் பிரி பால்சொல் ஒருமைக்கு அல்லாமல் எண்ணு முறையில் நில்லாது.
    ethu: 43 தன்மை/அஃறிணை விரவு என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    context: ஒருமை_எண்
    property: எண்ணுமுறை_நில்லா
  links: []
  urai:
    iyaipu:
    - sol.43
    - sol.184
    text: 'இயைபு (649): 43 எண்ணுவழி விரவு; 184 பன்மை சுட்டிய பெயர் ஒன்றே பலவே ஒருவர் என்னும் பாற்கும் ஓரன்ன. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.45
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 45
  moolam: |-
    வியங்கோள் எண்ணுப்பெயர் திணை விரவு வரையார்
  kaandigai:
    porul: வியங்கோளில் எண்ணுப்பெயர் திணை விரவுதல் விலக்கில்லை.
    ethu: 44 ஒருமைப் பொது என்றது; இது அதன் தொடர்ச்சி.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    context: வியங்கோள்
    class: எண்ணுப்பெயர்
    property: திணை_விரவு_விலக்கில்லை
  links: []
  urai:
    iyaipu:
    - sol.44
    - sol.228
    text: 'இயைபு (649): 44 எண்ணு முறை; 228 வியங்கோள் முன்னிலை தன்மையொடு மன்னாது. "விரவு வரையார்" — எல்லை வரையவில்லை — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; விரவு எல்லை ஒருதலை அன்மை
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: வரையார்
- id: sol.46
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 46
  moolam: |-
    வேறு வினைப் பொதுச் சொல் ஒரு வினை கிளவார்
  kaandigai:
    porul: வேறு வினைப் பொதுச்சொல்லை ஒரு வினையால் கூறார்.
    ethu: 45 வியங்கோள் விரவு என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: பொதுச்சொல்
    property: ஒரு_வினை_கிளவார்
  links: []
  urai:
    iyaipu:
    - sol.47
    - sol.54
    text: 'இயைபு (649): 47 எண்ணுங்காலும்; 54 ஒன்று வினை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.47
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 47
  moolam: |-
    எண்ணுங்காலும் அது அதன் மரபே
  kaandigai:
    porul: எண்ணும்போதும் அதுவே மரபு.
    ethu: 46 வேறு வினைப் பொதுச் சொல் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    analogy: sol.46
    property: மரபு
  links: []
  urai:
    iyaipu:
    - sol.46
    - sol.48
    text: 'இயைபு (649): 46 பொதுச்சொல்; 48 இரட்டை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.48
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 48
  moolam: |-
    இரட்டைக்கிளவி இரட்டின் பிரிந்து இசையா
  kaandigai:
    porul: இரட்டைக் கிளவி பிரிந்து இசைக்காது.
    ethu: 47 எண்ணுங்காலும் மரபு என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: இரட்டைக்கிளவி
    property: பிரிந்து_இசையா
  links: []
  urai:
    iyaipu:
    - sol.47
    - sol.411
    text: 'இயைபு (649): 411 ''ஒரு சொல் அடுக்கே'' — இரட்டை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.49
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 49
  moolam: |-
    ஒரு பெயர்ப் பொதுச் சொல் உள் பொருள் ஒழியத்
    தெரிபு வேறு கிளத்தல் தலைமையும் பன்மையும்
    உயர்திணை மருங்கினும் அஃறிணை மருங்கினும்
  kaandigai:
    porul: ஒரு பெயர்ப் பொதுச்சொல் உள்பொருள் ஒழியத் தெரிந்து வேறு கூறுதல் தலைமையாலும் பன்மையாலும் இரு திணையிலும் உண்டு.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 48 இரட்டை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: பொதுச்சொல்
    contexts:
    - உயர்திணை
    - அஃறிணை
    modes:
    - தலைமை
    - பன்மை
  links: []
  urai:
    iyaipu:
    - sol.50
    - sol.51
    - sol.52
    text: 'இயைபு (649): 50 பெயர்/தொழில் பிரிபவை; 51 திணை-விரவு; 52 பல பொருள் ஒரு சொல். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.50
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 50
  moolam: |-
    பெயரினும் தொழிலினும் பிரிபவை எல்லாம்
    மயங்கல் கூடா வழக்குவழிப் பட்டன
  kaandigai:
    porul: பெயராலும் தொழிலாலும் பிரிபவை எல்லாம் மயங்கக் கூடா; வழக்கு வழிப்பட்டன.
    ethu: 49 பொதுச்சொல் தெரிபு வேறு கிளத்தல் என்றது; பெயர்/தொழில் பிரிபவை வழக்குவழிப் பட்டன — மயங்கக் கூடா.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    contexts:
    - பெயர்
    - தொழில்
    property: மயங்கா_வழக்கு_வழி
  links: []
  urai:
    iyaipu:
    - sol.49
    - sol.51
    text: 'இயைபு (649): 49 பொதுச்சொல்; 51 திணை-விரவு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஆணை கூறல்
    saanru: கூடா
- id: sol.51
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 51
  moolam: |-
    பலவயினானும் எண்ணுத் திணை விரவுப்பெயர்
    அஃறிணை முடிபின செய்யுளுள்ளே
  kaandigai:
    porul: பல இடத்தும் எண்ணில் திணை விரவும் பெயர் செய்யுளில் அஃறிணை முடிபின.
    ethu: 50 வழக்குவழிப் பட்டன என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: திணை_விரவு_பெயர்
    context: செய்யுள்
    property: அஃறிணை_முடிபு
  links: []
  urai:
