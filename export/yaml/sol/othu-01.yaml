    thunivu: நூலில் நேரடியாக
- id: sol.22
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 22
  moolam: |-
    ஆக்கக் கிளவி காரணம் இன்றியும்
    போக்கு இன்று என்ப வழக்கினுள்ளே
  kaandigai:
    porul: காரணம் இல்லாமலும் ஆக்கச் சொல் வழக்கில் நீக்கப்படாது.
    ethu: 21 ஆக்கத்திற்குக் காரணம் முதல் என்றது; இது அதன் தொடர்ச்சி.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    class: ஆக்கக்கிளவி
    property: காரண_இல்லாமலும்_நீக்கப்படா
