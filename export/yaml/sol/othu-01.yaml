    - sol.40
    text: 'இயைபு (649): 21 காரணம்; 22 ''வழக்கினுள்ளே'' — எவை என நூல் பெயரிடவில்லை — ஒருதலை அன்மை.'
    vagai: விலக்கு
    vilakkukkuriyathu:
