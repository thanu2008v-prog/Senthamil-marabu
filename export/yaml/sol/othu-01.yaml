# இக்கோப்பு data_v2-இலிருந்து உருவானது. 'moolam' (சூத்திரம்) திருத்தக் கூடாது (பொருள். 652).
- id: sol.1
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 1
  moolam: |-
    உயர்திணை என்மனார் மக்கட் சுட்டே
    அஃறிணை என்மனார் அவர் அல பிறவே
    ஆயிரு திணையின் இசைக்குமன சொல்லே
  kaandigai:
    porul: மக்களைச் சுட்டுவது உயர்திணை; அவர் அல்லாத பிற அஃறிணை; சொற்கள் இவ்விரு திணையின் வழியே இசைக்கும். திணைப் பகுப்பு நூலில் நேரடியாக.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 'சொல்லதிகாரம் திணையால் தொடங்குவதற்கு ஏது: பால் (சொல். 2–4), வினையின் முடிபு (சொல். 203), விளி (சொல். 122) எல்லாம் திணையைச் சார்ந்தே பிரிகின்றன — "ஆயிரு திணையின் இசைக்குமன சொல்லே". எ.கா. "ஆடூஉ அறி சொல் மகடூஉ அறி சொல்" (சொல். 2) — உயர்திணைப் பால்.'
    eduthukkaattu:
    - text: ஆயிரு திணையின் இசைக்குமன சொல்லே
      from: sol.1
    - text: ஆடூஉ அறி சொல் மகடூஉ அறி சொல்
      from: sol.2
  nilai: நூலில் நேரடியாக
  kanini:
    kind: classification
    class: திணை
    count: 2
    subclasses:
    - name: உயர்திணை
      test: is_human(x)
    - name: அஃறிணை
      test: ¬is_human(x)
    exhaustive: true
    mutually_exclusive: true
  links:
  - sol.2
  - sol.3
  - ezhu.117
  urai:
    iyaipu:
    - sol.2
    - sol.3
    text: 'இயைபு (649): சொல். 2, 3 · சொல்லதிகாரம் திணையால் தொடங்குகிறது: மக்கள் — உயர்திணை; அவர் அல பிற — அஃறிணை. "இசைக்குமன சொல்லே" — எல்லாச் சொல்லும் திணை வழியே. பால் 2–4. கடாஅ (650): பொருள். 1-உம் "திணை" ஏழு என்கிறதே? — விடை: ஒரே சொல், இரு அதிகாரத்தில் இரு பொருள்: சொல்லில் மக்கள் / பிற என இரண்டு; பொருளில் கைக்கிளை முதல் பெருந்திணை வரை ஒழுக்க வகை ஏழு. அதிகார முறையால் (பொருள். 656) ஐயம் நீங்கும்.'
    vagai: விதி
    maruthalai:
    - kadaa: பொருள். 1-உம் "திணை" ஏழு என்கிறதே?
      maattram: '— விடை: ஒரே சொல், இரு அதிகாரத்தில் இரு பொருள்: சொல்லில் மக்கள் / பிற என இரண்டு; பொருளில் கைக்கிளை முதல் பெருந்திணை வரை ஒழுக்க வகை ஏழு. அதிகார முறையால் (பொருள். 656) ஐயம் நீங்கும்.'
      saanru:
      - text: திணை
        from: sol.1
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: வந்தது கொண்டு வாராதது உணர்த்தல்
    saanru: பிறவே
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்மனார்
- id: sol.2
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 2
  moolam: |-
    ஆடூஉ அறி சொல் மகடூஉ அறி சொல்
    பல்லோர் அறியும் சொல்லொடு சிவணி
    அம் முப் பாற்சொல் உயர்திணையவ்வே
  kaandigai:
    porul: ஆடூஉ அறி சொல் (ஆண்பால்), மகடூஉ அறி சொல் (பெண்பால்), பல்லோர் அறி சொல் (பலர்பால்) — மூன்று பாலும் உயர்திணையன.
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: 1 'இரு திணை' என்றது; உயர்திணையுள் பால் வேறுபட வேண்டும். 5–7 ஒற்று/இறுதி வைத்து மூன்று வகையைப் பிரிக்கின்றன; 2 அவற்றுக்கு முன் பொது விதி.
    eduthukkaattu:
    - text: ஆடூஉ மகடூஉ
      from: sol.165
  nilai: நூலில் நேரடியாக
  kanini:
    kind: classification
    class: உயர்திணை_பால்
    count: 3
    items:
    - ஆண்பால்
    - பெண்பால்
    - பலர்பால்
  links:
  - sol.1
  - sol.3
  - sol.10
  urai:
    iyaipu:
    - sol.1
    - sol.5
    - sol.6
    - sol.7
    - sol.164
    text: 'இயைபு (649): ''ஆடூஉ மகடூஉ'' (165), ''அவன் இவன் உவன்'' (164) — மூன்று வகையின் வடிவங்கள். எண்: மூன்று (நூற்பா) = மூன்று (பட்டியல் — ஆடூஉ, மகடூஉ, பல்லோர்).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.3
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 3
  moolam: |-
    ஒன்று அறி சொல்லே பல அறி சொல் என்று
    ஆயிரு பாற்சொல் அஃறிணையவ்வே
  kaandigai:
    porul: ஒன்று அறி சொல் (ஒன்றன்பால்), பல அறி சொல் (பலவின்பால்) — இரண்டும் அஃறிணையன. 2 + 3 = ஐம்பால் (10-இன் "ஐம் பால்" உடன் ஒக்கும்).
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 1 இரு திணை என்றது; அஃறிணையுள் ஒன்று-அறி/பல-அறி என இருவகை வேண்டும் — 2-இன் இணை.
    eduthukkaattu:
    - text: அவை இவை உவை
      from: sol.169
  nilai: நூலில் நேரடியாக
  kanini:
    kind: classification
    class: அஃறிணை_பால்
    count: 2
    items:
    - ஒன்றன்பால்
    - பலவின்பால்
  links:
  - sol.1
  - sol.2
  - sol.10
  urai:
    iyaipu:
    - sol.1
    - sol.2
    - sol.8
    - sol.9
    - sol.51
    text: 'இயைபு (649): 2 உயர்திணையை மூன்று பாலாகப் பிரித்தது; 3 அஃறிணையை இரண்டாக; 8 ஒன்று அறி, 9 பல அறி — ஈற்றால் அறிதல். எடுத்துக்காட்டு: “அவை இவை உவை” (சொல். 169) — பல அறி சொல். எண்: இரண்டு (நூற்பா) = இரண்டு (பட்டியல்).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: ஒன்று
- id: sol.4
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 4
  moolam: |-
    பெண்மை சுட்டிய உயர்திணை மருங்கின்
    ஆண்மை திரிந்த பெயர் நிலைக் கிளவியும்
    தெய்வம் சுட்டிய பெயர் நிலைக் கிளவியும்
    இவ் என அறியும் அந்தம் தமக்கு இலவே
    உயர்திணை மருங்கின் பால் பிரிந்து இசைக்கும்
  kaandigai:
    porul: பெண்மை சுட்டிய உயர்திணையிடத்து ஆண்மை திரிந்த பெயரும், தெய்வம் சுட்டிய பெயரும் தமக்கெனத் தனி ஈறு இல்லாதவை; உயர்திணையின் பால் வழியே பிரிந்து இசைக்கும்.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 5–9 ஈற்றெழுத்தால் பால் அறிதலைச் சொல்லும் முன், ஈற்றால் பால் அறிய இயலாத இரு பெயர்வகையைச் சுட்டுகிறது — ஆண்மை திரிந்த பெண்மைப் பெயரும் தெய்வப் பெயரும்; அவை உயர்திணையிலேயே பால் பிரிந்து இசைக்கும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    classes:
    - பெண்மை_ஆண்மை_திரி
    - தெய்வம்_சுட்டிய_பெயர்
    property: தனி_ஈறு_இல்லை
  links:
  - sol.2
  urai:
    iyaipu:
    - sol.5
    - sol.10
    - sol.12
    text: 'இயைபு (649): 5–9 ஈற்றால் பால் அறிதல்; 10 அவ்வீறு வினையொடு தோன்றும்; 12 ஆண்மை திரிந்த பெயருக்கு ஆண்மை அறி சொல் ஆகாது. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.5
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 5
  moolam: |-
    னஃகான் ஒற்றே ஆடூஉ அறி சொல்
  kaandigai:
    porul: னகர ஒற்று (ன்) ஆண்பால் ஈறு.
    ethu: 2 ஆடூஉ-அறி சொல் என்றது; அதை அறியும் அளவுகோல் வேண்டும் — னகர ஒற்று.
    eduthukkaattu:
    - text: மகன்
      from: sol.165
  nilai: நூலில் நேரடியாக
  kanini:
