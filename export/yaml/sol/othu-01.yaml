- id: sol.8
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 8
  moolam: |-
    ஒன்று அறி கிளவி த ற ட ஊர்ந்த
    குன்றியலுகரத்து இறுதி ஆகும்
  kaandigai:
    porul: த, ற, ட ஊர்ந்த குற்றியலுகர இறுதி (து, று, டு) ஒன்றன்பால் ஈறு.
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: 3 அஃறிணையை ஒன்று-அறி/பல-அறி எனப் பிரித்தது; 8 ஒன்று-அறிக்கு ஈற்றுச் சோதனை — த/ற/ட ஊர்ந்த குற்றியலுகரம்.
    eduthukkaattu:
    - text: அது இது உது
      from: sol.169
  nilai: நூலில் நேரடியாக
