    text: 'இயைபு (649): 53 வினை வேறுபாடு; 55 இரண்டாம் வகை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: ஒன்று
- id: sol.55
  pindam: 1
  padalam: sol
  othu: 1
  sutra: 55
  moolam: |-
    வினை வேறுபடாஅப் பல பொருள் ஒரு சொல்
    நினையும் காலை கிளந்தாங்கு இயலும்
  kaandigai:
    porul: வினை வேறுபடாத பல பொருள் ஒரு சொல் கூறியாங்கு இயலும்.
    ethu: 52 வினை-வேறுபடா வகை என்றது; நினையுங்காலை கிளந்தாங்கு இயலும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: வினை_வேறுபடா
