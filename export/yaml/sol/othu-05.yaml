- id: sol.165
  pindam: 1
  padalam: sol
  othu: 5
  sutra: 165
  moolam: |-
    ஆண்மை அடுத்த மகன் என் கிளவியும்
    பெண்மை அடுத்த மகள் என் கிளவியும்
    பெண்மை அடுத்த இகர இறுதியும்
    நம் ஊர்ந்து வரூஉம் இகர ஐகாரமும்
    முறைமை சுட்டா மகனும் மகளும்
    மாந்தர் மக்கள் என்னும் பெயரும்
    ஆடூஉ மகடூஉ ஆயிரு பெயரும்
    சுட்டு முதல் ஆகிய அன்னும் ஆனும்
    அவை முதல் ஆகிய பெண்டு என் கிளவியும்
    ஒப்பொடு வரூஉம் கிளவியொடு தொகைஇ
    அப் பதினைந்தும் அவற்று ஓரன்ன
  kaandigai:
    porul: 'ஆண்மை அடுத்த மகன், பெண்மை அடுத்த மகள், பெண்மை அடுத்த இகர இறுதி, நம் ஊர்ந்து வரும் இகரம், ஐகாரம், முறைமை சுட்டா மகன், மகள், மாந்தர், மக்கள், ஆடூஉ, மகடூஉ, சுட்டுமுதல் அன், ஆன், பெண்டு, ஒப்பொடு வரும் சொல் — பதினைந்தும் (எண்ணிச் சரிபார்த்தது: 15) அவற்றோடு ஒத்தவை.'
    en:
      kooruvathu: 15
      enniyathu: 15
    ethu: 164 உயர்திணை 15 சொன்னது; இவை அத்திணைச் சுட்டின் மற்ற 15 — மகன்/மகள்/மகடூஉ முதலியன.
    eduthukkaattu:
    - text: ஆடூஉ மகடூஉ
      from: ezhu.271
    - text: தனி மகள் புலம்பிய
      from: porul.77
    - text: மகன் தாய் உயர்பும்
      from: porul.172
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: உயர்திணை_பெயர்_கூடுதல்
    count: 15
    items:
    - மகன்
    - மகள்
    - பெண்மை_இகர_ஈறு
    - நம்_ஊர்ந்த_இகரம்
    - ஐகாரம்
    - முறைமை_மகன்
    - மகள்
    - மாந்தர்
    - மக்கள்
    - ஆடூஉ
    - மகடூஉ
    - சுட்டு_அன்
    - சுட்டு_ஆன்
    - பெண்டு
    - ஒப்பு_வரூஉம்
  links:
  - sol.164
  urai:
    iyaipu:
    - sol.164
    - sol.166
    - sol.178
    text: 'இயைபு (649): 164 உயர்திணை 15; 166 அன்ன இயல; 178 இயற்பெயர். எடுத்துக்காட்டு: ''ஆடூஉ மகடூஉ'' (எழு. 271), ''தனி மகள் புலம்பிய'' (பொருள். 77), ''மகன் தாய் உயர்பும்'' (பொருள். 172). எண்: பதினைந்து (நூற்பா) = பதினைந்து — மகன், மகள், பெண்மை அடுத்த இகர இறுதி, நம் ஊர்ந்த இகரம், ஐகாரம், முறைமை சுட்டா மகன், மகள், மாந்தர், மக்கள், ஆடூஉ, மகடூஉ, அன், ஆன், பெண்டு, ஒப்பொடு வரூஉம் கிளவி.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: முறை பிறழாமை
    saanru: முறைமை
- id: sol.166
  pindam: 1
  padalam: sol
  othu: 5
  sutra: 166
  moolam: |-
    எல்லாரும் என்னும் பெயர்நிலைக் கிளவியும்
    எல்லீரும் என்னும் பெயர்நிலைக் கிளவியும்
    பெண்மை அடுத்த மகன் என் கிளவியும்
    அன்ன இயல என்மனார் புலவர்
  kaandigai:
    porul: '"எல்லாரும்", "எல்லீரும்", பெண்மை அடுத்த "மகன்" — அவ்வியல்பின.'
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: 165 15 என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: எல்லாரும்_வகை
    count: 3
    items:
    - எல்லாரும்
    - எல்லீரும்
    - பெண்மை_மகன்
  links: []
  urai:
    iyaipu:
    - sol.165
    - sol.191
    - sol.192
    text: 'இயைபு (649): 165 பதினைந்து; 191–192 எல்லாரும்/எல்லீரும் இணை. எண்: மூன்று (எல்லாரும், எல்லீரும், பெண்மை அடுத்த மகன்) — நூற்பா எண் கூறவில்லை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்மனார்
- id: sol.167
  pindam: 1
  padalam: sol
  othu: 5
  sutra: 167
  moolam: |-
    நிலப் பெயர் குடிப் பெயர் குழுவின் பெயரே
    வினைப் பெயர் உடைப் பெயர் பண்பு கொள் பெயரே
    பல்லோர்க் குறித்த முறை நிலைப் பெயரே
    பல்லோர்க் குறித்த சினை நிலைப் பெயரே
    பல்லோர்க் குறித்த திணை நிலைப் பெயரே
    கூடி வரு வழக்கின் ஆடு இயற் பெயரே
    இன்றிவர் என்னும் எண்ணியற் பெயரொடு
    அன்றி அனைத்தும் அவற்று இயல்பினவே
  kaandigai:
    porul: 'நிலப்பெயர், குடிப்பெயர், குழுப்பெயர், வினைப்பெயர், உடைப்பெயர், பண்பு கொள் பெயர், பல்லோர் முறைநிலை, சினைநிலை, திணைநிலைப் பெயர், கூடி வரும் வழக்கின் ஆடியற்பெயர், எண்ணியற்பெயர் — அவற்றின் இயல்பின (எண்ணியது: 11; நூல் எண் தரவில்லை).'
    en:
      kooruvathu: 11
      enniyathu: 11
    ethu: 164–166 உயர்திணைப் பெயர் வடிவங்கள்; இனி அவற்றின் இயற்பெயர்/சினை/சினைமுதல்/முறைப் பாகுபாடு.
    eduthukkaattu:
    - text: காடு
      from: porul.5
  nilai: ஒருதலை அன்மை
  kanini:
    kind: enumeration
    class: பெயர்_வகை
    count: 11
    items:
    - நிலப்பெயர்
    - குடிப்பெயர்
    - குழுப்பெயர்
    - வினைப்பெயர்
    - உடைப்பெயர்
    - பண்பு_கொள்_பெயர்
    - பல்லோர்_முறைநிலை
    - சினைநிலை
    - திணைநிலை
    - ஆடியற்பெயர்
    - எண்ணியற்பெயர்
    closed: false
  links: []
  urai:
    iyaipu:
    - sol.164
    - sol.168
    - sol.176
    - sol.177
    text: 'இயைபு (649): ''காடு'' (பொருள். 5) — நிலப்பெயர்; 168 உயர்திணைத் தொடர்; 176-177 வகை எண். ''அன்றி அனைத்தும்'' — எவை என நூல் பெயரிடவில்லை — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'அன்றி அனைத்தும்' ஒருதலை அன்மை
- id: sol.168
  pindam: 1
  padalam: sol
  othu: 5
  sutra: 168
  moolam: |-
    அன்ன பிறவும் உயர்திணை மருங்கின்
    பன்மையும் ஒருமையும் பால் அறி வந்த
    என்ன பெயரும் அத் திணையவ்வே
  kaandigai:
    porul: பிறவும், உயர்திணையில் பன்மையும் ஒருமையும் பால் அறிய வரும் பெயர் எல்லாம் அத்திணையன.
    ethu: 167 உயர்திணை வகைகள் என்றது; இது அதன் தொடர்ச்சி.
    eduthukkaattu:
    - text: பெண்டிரும் மக்களும்
      from: porul.144
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    class: உயர்திணை_பெயர்
    property: அத்திணைய
  links: []
  urai:
    iyaipu:
    - sol.167
    - sol.172
    - sol.163
    text: 'இயைபு (649): 167 உயர்திணை வகைகள்; 172 அஃறிணை இணை; 163 ஐம்பால். எடுத்துக்காட்டு: ''பெண்டிரும் மக்களும்'' (பொருள். 144) — பெண்டிர் (164–167 பட்டியலில் இல்லாத உயர்திணைப் பன்மைப் பெயர்). ''அன்ன பிறவும்'' — எவை என நூல் பெயரிடவில்லை — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'அன்ன பிறவும்' ஒருதலை அன்மை
  utthi:
  - peyar: வந்தது கொண்டு வாராதது உணர்த்தல்
    saanru: பிறவும்
- id: sol.169
  pindam: 1
  padalam: sol
  othu: 5
  sutra: 169
  moolam: |-
    அது இது உது என வரூஉம் பெயரும்
    அவை முதல் ஆகிய ஆய்தப் பெயரும்
    அவை இவை உவை என வரூஉம் பெயரும்
    அவை முதல் ஆகிய வகரப் பெயரும்
    யாது யா யாவை என்னும் பெயரும்
    ஆவயின் மூன்றொடு அப் பதினைந்தும்
    பால் அறி வந்த அஃறிணைப் பெயரே
  kaandigai:
    porul: 'அது, இது, உது; அஃது, இஃது, உஃது (ஆய்தப் பெயர்); அவை, இவை, உவை; அவ், இவ், உவ் (வகரப் பெயர்); யாது, யா, யாவை — பதினைந்தும் (எண்ணிச் சரிபார்த்தது: 15) பால் அறி அஃறிணைப் பெயர். (காண்க 164.)'
    en:
      kooruvathu: 15
      enniyathu: 15
    ethu: 164 உயர்திணை 15 சொன்னது; அஃறிணைக்கு இணையான 15 — அது/இது/உது முதல் யாது/யா/யாவை வரை.
    eduthukkaattu:
    - text: யாது
      from: sol.31
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: அஃறிணை_பால்_அறி_பெயர்
    count: 15
    items:
    - அது
    - இது
    - உது
    - அஃது
    - இஃது
    - உஃது
    - அவை
    - இவை
    - உவை
    - அவ்
    - இவ்
    - உவ்
    - யாது
    - யா
    - யாவை
  links:
  - sol.164
  - sol.162
  urai:
    iyaipu:
    - sol.164
    - sol.168
    - sol.170
    - sol.221
    text: 'இயைபு (649): ''யாது'' (சொல். 31) — வினாப்பெயர் (169-இன் பட்டியலில்); 170 அஃறிணை 9; 221 ''எவன் என் வினாவே''. எண்: 15 (நூற்பா) = 5 வகை × 3.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.170
  pindam: 1
  padalam: sol
  othu: 5
  sutra: 170
  moolam: |-
    பல்ல பல சில என்னும் பெயரும்
    உள்ள இல்ல என்னும் பெயரும்
    வினைப் பெயர்க் கிளவியும் பண்பு கொள் பெயரும்
    இனைத்து எனக் கிளக்கும் எண்ணுக்குறிப் பெயரும்
    ஒப்பின் ஆகிய பெயர்நிலை உளப்பட
    அப் பால் ஒன்பதும் அவற்று ஓரன்ன
  kaandigai:
    porul: 'பல்ல, பல, சில, உள்ள, இல்ல, வினைப்பெயர், பண்பு கொள் பெயர், எண்ணுக்குறிப் பெயர், ஒப்பின் ஆகிய பெயர் — ஒன்பதும் (எண்ணிச் சரிபார்த்தது: 9) அவற்றோடு ஒத்தவை.'
    en:
      kooruvathu: 9
      enniyathu: 9
    ethu: 169 அஃறிணை 15 என்றது; மேலும் ஒன்பது — பல்ல/பல/சில, உள்ள/இல்ல, வினைப்பெயர், பண்பு, இனைத்து, ஒப்பு.
    eduthukkaattu:
    - text: இனைத்து
      from: sol.33
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: அஃறிணை_பெயர்_கூடுதல்
    count: 9
    items:
    - பல்ல
    - பல
    - சில
    - உள்ள
    - இல்ல
    - வினைப்பெயர்
    - பண்பு_கொள்_பெயர்
    - எண்ணுக்குறிப்பு
    - ஒப்பு_பெயர்
  links:
  - sol.169
  urai:
    iyaipu:
    - sol.169
    - sol.33
    - sol.171
    - sol.172
    text: 'இயைபு (649): ''இனைத்து'' (33) — எண்ணுக்குறிப் பெயர்; 171 கள்; 172 அஃறிணை முடிவு. எண்: 9 (நூற்பா) = 3+2+1+1+1+1 = 9.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: ஒன்பதும்
- id: sol.171
  pindam: 1
  padalam: sol
  othu: 5
  sutra: 171
  moolam: |-
    கள்ளொடு சிவணும் அவ் இயற்பெயரே
    கொள் வழி உடைய பல அறி சொற்கே
  kaandigai:
    porul: அஃறிணை இயற்பெயர் கள்ளொடு பொருந்தும்; பலவின்பாலுக்குக் கொள்ளும் வழியுண்டு.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 170 ஒன்பது என்றது; இது அதன் தொடர்ச்சி.
    eduthukkaattu:
    - text: மக்கள்
      from: porul.145
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: அஃறிணை_இயற்பெயர்
    ops:
    - கள்_இணைவு
    - பலவின்பால்_கொள்
  links: []
  urai:
    iyaipu:
    - sol.170
    - sol.172
    text: 'இயைபு (649): ''மக்கள்'' (பொருள். 145) — கள் பெற்ற பன்மை. 170 ஒன்பது; 172 இவற்றின் விரிவு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.172
  pindam: 1
  padalam: sol
  othu: 5
  sutra: 172
  moolam: |-
    அன்ன பிறவும் அஃறிணை மருங்கின்
    பன்மையும் ஒருமையும் பால் அறி வந்த
    என்ன பெயரும் அத் திணையவ்வே
  kaandigai:
    porul: பிறவும், அஃறிணையில் பன்மையும் ஒருமையும் பால் அறிய வரும் பெயர் எல்லாம் அத்திணையன.
    ethu: 170–171 அஃறிணை வகைகள் என்றது; இது அதன் தொடர்ச்சி.
    eduthukkaattu:
    - text: அவைதாம்
      from: ezhu.2
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    class: அஃறிணை_பெயர்
    property: அத்திணைய
  links: []
  urai:
    iyaipu:
    - sol.168
    - sol.171
    - sol.174
    text: 'இயைபு (649): ''அவைதாம்'' (எழு. 2) — அவை + தாம் (அஃறிணைப் பன்மை); 168 உயர்திணை இணை; 174 இரு திணைப் பொது. ''அன்ன பிறவும்'' — எவை என நூல் பெயரிடவில்லை — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'அன்ன பிறவும்' ஒருதலை அன்மை
  utthi:
  - peyar: வந்தது கொண்டு வாராதது உணர்த்தல்
    saanru: பிறவும்
- id: sol.173
  pindam: 1
  padalam: sol
  othu: 5
  sutra: 173
  moolam: |-
    தெரிநிலை உடைய அஃறிணை இயற்பெயர்
    ஒருமையும் பன்மையும் வினையொடு வரினே
  kaandigai:
    porul: தெரிநிலை உடைய அஃறிணை இயற்பெயர் வினையோடு வந்தால் ஒருமையும் பன்மையும் தெரியும்.
    ethu: 172 அஃறிணைப் பெயர் விரி என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: அஃறிணை_இயற்பெயர்
    context: வினை
    property: ஒருமை_பன்மை_தெரிவு
  links: []
  urai:
    iyaipu:
    - sol.172
    - sol.174
    text: 'இயைபு (649): 172 அஃறிணை முடிவு; 174 இரு திணைப் பொது. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.174
  pindam: 1
  padalam: sol
  othu: 5
  sutra: 174
  moolam: |-
    இரு திணைச் சொற்கும் ஓரன்ன உரிமையின்
    திரிபு வேறுபடூஉம் எல்லாப் பெயரும்
    நினையும் காலை தம்தம் மரபின்
    வினையொடு அல்லது பால் தெரிபு இலவே
  kaandigai:
    porul: இரு திணைக்கும் பொதுவான உரிமையால் திரிந்து வேறுபடும் பெயர் எல்லாம் வினையோடல்லாமல் பால் தெரியா.
    ethu: 173 வினையொடு என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: இரு_திணை_பொது_பெயர்
    property: வினையொடு_அல்லது_பால்_தெரிவு_இல
  links: []
  urai:
    iyaipu:
    - sol.173
    - sol.211
    - sol.220
    text: 'இயைபு (649): 211, 220 வினையெஞ்சு பால்-பிரிவு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.175
  pindam: 1
  padalam: sol
  othu: 5
  sutra: 175
  moolam: |-
    நிகழூஉ நின்ற பலர் வரை கிளவியின்
    உயர்திணை ஒருமை தோன்றலும் உரித்தே
    அன்ன மரபின் வினைவயினான
  kaandigai:
    porul: நிகழும் பலர்பால் சொல்லால் உயர்திணை ஒருமை தோன்றுதலும் உண்டு — அம்மரபின் வினையிடத்து.
    ethu: 174 வினையொடே பால் தெரியும் என்றது; இது அதன் தொடர்ச்சி.
    eduthukkaattu:
    - text: பல்லோர் அறியும்
      from: sol.2
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: பலர்பால்_கிளவி
    context: உயர்திணை_வினை
    property: ஒருமை_தோன்றல்
  links: []
  urai:
    iyaipu:
    - sol.174
    - sol.2
    - sol.212
    text: 'இயைபு (649): ''பல்லோர் அறியும்'' (2) — பல்லோர் (பலர்) + அறியும் (வினை) — பலர் → ஒருமை தோன்றும்; 212 யாஅர்-வினா மூவகைக்கும் உரித்து.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: உரித்தே
- id: sol.176
  pindam: 1
  padalam: sol
  othu: 5
  sutra: 176
  moolam: |-
    இயற்பெயர் சினைப்பெயர் சினைமுதற்பெயரே
    முறைப்பெயர்க் கிளவி தாமே தானே
    எல்லாம் நீயிர் நீ எனக் கிளந்து
    சொல்லிய அல்ல பிறவும் ஆஅங்கு
    அன்னவை தோன்றின் அவற்றொடும் கொளலே
  kaandigai:
    porul: 'பொதுப்பெயர்கள்: இயற்பெயர், சினைப்பெயர், சினைமுதற்பெயர், முறைப்பெயர், தாம், தான், எல்லாம், நீயிர், நீ — கூறாத பிறவும் வந்தால் அவற்றோடு கொள்க.'
    en:
      kooruvathu: 9
      enniyathu: 9
    ethu: 174 இரு திணைக்கும் ஓரன்ன உரிமைப் பெயர் என்றது; இது அதன் தொடர்ச்சி.
    eduthukkaattu:
    - text: தாம்நாம் என்னும்
      from: ezhu.188
    - text: தான்யான் என்னும்
      from: ezhu.192
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: பொதுப்பெயர்
    count: 9
    items:
    - இயற்பெயர்
    - சினைப்பெயர்
    - சினைமுதற்பெயர்
    - முறைப்பெயர்
    - தாம்
    - தான்
    - எல்லாம்
    - நீயிர்
    - நீ
    closed: false
  links:
  - sol.177
  urai:
    iyaipu:
    - sol.174
    - sol.177
    - sol.186
    - sol.190
    text: 'இயைபு (649): 174 இரு திணைப் பொது; ''தாம்நாம் என்னும்'' (எழு. 188), ''தான்யான் என்னும்'' (எழு. 192) — தாம், தான் பெயர்கள்; 177 இவற்றின் எண்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: வந்தது கொண்டு வாராதது உணர்த்தல்
    saanru: பிறவும்
  - peyar: கூறிற்று என்றல்
    saanru: கிளந்து
- id: sol.177
  pindam: 1
  padalam: sol
  othu: 5
  sutra: 177
  moolam: |-
    அவற்றுள்
    நான்கே இயற்பெயர் நான்கே சினைப்பெயர்
    நான்கு என மொழிமனார் சினைமுதற்பெயரே
    முறைப்பெயர்க் கிளவி இரண்டு ஆகும்மே
    ஏனைப் பெயரே தம்தம் மரபின
  kaandigai:
    porul: அவற்றுள் இயற்பெயர் 4, சினைப்பெயர் 4, சினைமுதற்பெயர் 4, முறைப்பெயர் 2; ஏனையவை தம் மரபின. (178–181 இவ்வெண்ணை விரிக்கின்றன — எண்ணிச் சரிபார்த்தது.)
    en:
      kooruvathu: 14
      enniyathu: 14
    ethu: 176 நான்கு வகைப் பெயர் என்றது; ஒவ்வொன்றின் எண்ணிக்கை — இயற்பெயர் 4, சினைப்பெயர் 4, சினைமுதற்பெயர் 4, முறைப்பெயர் 2.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: classification
    class: பொதுப்பெயர்_பிரிவு
    counts:
      இயற்பெயர்: 4
      சினைப்பெயர்: 4
      சினைமுதற்பெயர்: 4
      முறைப்பெயர்: 2
  links:
  - sol.178
  - sol.179
  - sol.180
  - sol.181
  urai:
    iyaipu:
    - sol.176
    - sol.178
    - sol.179
    - sol.180
    - sol.181
    text: 'இயைபு (649): 176 பெயர் வகைகள்; 178–181 விரிவு. எண்: 4 + 4 + 4 + 2 = 14 (நூற்பா) = 14 (178–181 பட்டியல்); ஏனைப் பெயர் (தாம், தான், எல்லாம், நீயிர், நீ) ''தம்தம் மரபின''.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: அதிகார முறை
    saanru: அவற்றுள்
  - peyar: தொகுத்துக் கூறல்
    saanru: நான்கே
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிமனார்
- id: sol.178
  pindam: 1
  padalam: sol
  othu: 5
  sutra: 178
  moolam: |-
    அவைதாம்
    பெண்மை இயற்பெயர் ஆண்மை இயற்பெயர்
    பன்மை இயற்பெயர் ஒருமை இயற்பெயர் என்று
    அந் நான்கு என்ப இயற்பெயர் நிலையே
  kaandigai:
    porul: 'இயற்பெயர் நான்கு: பெண்மை, ஆண்மை, பன்மை, ஒருமை.'
    en:
      kooruvathu: 4
      enniyathu: 4
    ethu: 177 இயற்பெயர் 4 என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: இயற்பெயர்
    count: 4
    items:
    - பெண்மை
    - ஆண்மை
    - பன்மை
    - ஒருமை
  links:
  - sol.177
  urai:
    iyaipu:
    - sol.177
    - sol.179
    - sol.180
    - sol.181
