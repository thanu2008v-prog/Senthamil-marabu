    - sol.190
    - sol.192
    - sol.166
    text: 'இயைபு (649): 190 நீயிர்; 192 ஏனை; 166 எல்லாரும்/எல்லீரும். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
