    text: 'இயைபு (649): ''உறு தவ நனி'' (சொல். 301) — மூன்றும் உரிச்சொல்; 251 இடை இயல்; 299 உரிச்சொல் விரிவு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: sol.162
  pindam: 1
  padalam: sol
  othu: 5
  sutra: 162
  moolam: |-
    அவற்றுள்
    பெயர் எனப்படுபவை தெரியும் காலை
    உயர்திணைக்கு உரிமையும் அஃறிணைக்கு உரிமையும்
    ஆயிரு திணைக்கும் ஓரன்ன உரிமையும்
    அம் மூ உருபின தோன்றல் ஆறே
  kaandigai:
    porul: 'பெயர் மூவகை உரிமையின: உயர்திணைக்கு உரியது, அஃறிணைக்கு உரியது, இரு திணைக்கும் பொது.'
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: 160 பெயர் என்றது; இது அதன் தொடர்ச்சி.
    eduthukkaattu:
    - text: மக்கட் சுட்டே
      from: sol.1
  nilai: நூலில் நேரடியாக
  kanini:
    kind: classification
    class: பெயர்_உரிமை
    count: 3
    items:
    - உயர்திணை
    - அஃறிணை
    - இரு_திணை_பொது
