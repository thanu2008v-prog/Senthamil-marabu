- id: sol.193
  pindam: 1
  padalam: sol
  othu: 5
  sutra: 193
  moolam: |-
    ஒருவர் என்னும் பெயர்நிலைக் கிளவி
    இரு பாற்கும் உரித்தே தெரியும் காலை
  kaandigai:
    porul: '"ஒருவர்" இரு பாலுக்கும் (ஆண், பெண்) உரியது.'
    ethu: 190–192 நீ/நீயிர் என்றது; இது அதன் தொடர்ச்சி.
    eduthukkaattu:
    - text: ஒருவரைக் கூறும்
      from: sol.27
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: ஒருவர்
    contexts:
    - ஆண்
    - பெண்
    property: இரு_பால்_உரிமை
  links: []
  urai:
    iyaipu:
    - sol.184
    - sol.190
    - sol.194
    text: 'இயைபு (649): ''ஒருவரைக் கூறும்'' (27); 184 பன்மை-ஒருமை ஒற்றுமை; 194 தன்மை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: உரித்தே
- id: sol.194
  pindam: 1
  padalam: sol
  othu: 5
  sutra: 194
  moolam: |-
    தன்மை சுட்டின் பன்மைக்கு ஏற்கும்
  kaandigai:
    porul: தன்மை சுட்டினால் பன்மைக்கு ஏற்கும்.
    ethu: 193 ஒருவர் என்றது; இது அதன் தொடர்ச்சி.
    eduthukkaattu:
    - text: யான் யாம் நாம்
      from: sol.164
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    context: தன்மை_சுட்டு
    property: பன்மை_ஏற்பு
  links: []
  urai:
    iyaipu:
    - sol.193
    - sol.164
    - sol.57
    text: 'இயைபு (649): ''யான் யாம் நாம்'' (164) — தன்மை மூன்று; 57 ''தன்மை திரி பெயர்''.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.195
  pindam: 1
  padalam: sol
  othu: 5
  sutra: 195
  moolam: |-
    இன்ன பெயரே இவை எனல் வேண்டின்
    முன்னம் சேர்த்தி முறையின் உணர்தல்
  kaandigai:
    porul: இன்ன பெயர் இவை எனக் கொள்ள வேண்டினால் முன்னம் (குறிப்பு) சேர்த்து முறையால் உணர்க.
    ethu: 194 தன்மை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    op: முன்னம்_சேர்த்தி_முறையால்_உணர்
  links: []
  urai:
    iyaipu:
    - sol.194
    - sol.119
    - sol.296
    text: 'இயைபு (649): 194 தன்மை; 119 ''கிளந்தவற்று இயலான் உணர்ந்தனர்'' — இதே போக்கு; 296 ''என்றும் எனவும் ஒடுவும்''. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: முறை பிறழாமை
    saanru: முறையின்
- id: sol.196
  pindam: 1
  padalam: sol
  othu: 5
  sutra: 196
  moolam: |-
    மகடூஉ மருங்கின் பால் திரி கிளவி
    மகடூஉ இயற்கை தொழில்வயினான
  kaandigai:
    porul: மகடூஉ இடத்துப் பால் திரியும் சொல் தொழிலிடத்து மகடூஉ இயல்பினது.
    ethu: 194–195 தன்மை/பன்மை என்றது; மகடூஉ மருங்கின் பால் திரி கிளவி — மகடூஉ இயற்கை தொழில்வயினான் (தொழிலால் மட்டும்).
    eduthukkaattu:
    - text: ஆடூஉ மகடூஉ
      from: ezhu.271
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: மகடூஉ_பால்_திரி
    context: தொழில்
    property: மகடூஉ_இயல்பு
  links: []
  urai:
    iyaipu:
    - sol.194
    - ezhu.303
    - sol.165
    - ezhu.271
    text: 'இயைபு (649): ''ஆடூஉ மகடூஉ'' (எழு. 271); எழு. 303 ''ஆணும் பெண்ணும் அஃறிணை இயற்கை''; 165 மகன்/மகள்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.197
  pindam: 1
  padalam: sol
  othu: 5
  sutra: 197
  moolam: |-
    ஆ ஓ ஆகும் பெயருமார் உளவே
    ஆயிடன் அறிதல் செய்யுளுள்ளே
  kaandigai:
    porul: ஆ, ஓ ஆகும் பெயர்களும் உள; அவ்விடத்தை செய்யுளில் அறிக.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 196 மகடூஉ என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ஆ_ஓ_பெயர்
    context: செய்யுள்
  links: []
  urai:
    iyaipu:
    - sol.196
    text: 'இயைபு (649): 196 மகடூஉ பால் திரி கிளவி. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.198
  pindam: 1
  padalam: sol
  othu: 5
  sutra: 198
  moolam: |-
    இறைச்சிப் பொருள்வயின் செய்யுளுள் கிளக்கும்
    இயற்பெயர்க் கிளவி உயர்திணை சுட்டா
    நிலத்துவழி மருங்கின் தோன்றலான
  kaandigai:
    porul: 'இறைச்சிப் பொருளில் செய்யுளில் கூறும் இயற்பெயர் நிலத்தின் வழியே தோன்றுவதால் உயர்திணையைச் சுட்டாது. (காண்க: பொருள். 225–227.)'
    ethu: 197 ஆ/ஓ என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: இயற்பெயர்
    context: இறைச்சி
    property: உயர்திணை_சுட்டா
  links:
  - porul.225
  - porul.226
  - porul.227
  urai:
    iyaipu:
    - sol.197
    - sol.199
    text: 'இயைபு (649): 197 செய்யுளுள் அறிதல்; 199 திணையொடு பழகிய பெயர். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.199
  pindam: 1
  padalam: sol
  othu: 5
  sutra: 199
  moolam: |-
    திணையொடு பழகிய பெயர் அலங்கடையே
  kaandigai:
    porul: திணையொடு பழகிய பெயர் அல்லாத இடத்து (198 பொருந்தும்).
    ethu: 198 இறைச்சி என்றது; திணையொடு பழகிய (திணையோடு பொருந்திய) பெயர் அலங்கடையே (வேறுபடாது) — பாடல் முடிவில் இதுவே.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: exception
    class: திணை_பழகிய_பெயர்
    property: அலங்கடையே
    othu_end: true
  links:
  - sol.198
  urai:
    iyaipu:
    - sol.198
    - sol.197
    - sol.58
    - sol.174
    text: 'இயைபு (649): 198 இறைச்சி; 58 ''பால் பிரிந்து இசையா உயர்திணை''; 174 இரு திணை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
