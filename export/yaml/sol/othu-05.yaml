    text: 'இயைபு (649): 188 எல்லாம்; 190-191 நீ/ஏனை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.190
  pindam: 1
  padalam: sol
  othu: 5
  sutra: 190
  moolam: |-
    நீயிர் நீ என வரூஉம் கிளவி
    பால் தெரிபு இலவே உடன் மொழிப் பொருள
  kaandigai:
    porul: '"நீயிர்", "நீ" பால் தெரியா; உடன் மொழியால் பொருள் தெரியும்.'
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 188–189 எல்லாம் என்றது; நீயிர் நீ என வருங் கிளவி பால்-தெரிவு இல்லை — உடன் மொழிப் பொருளே.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    items:
    - நீயிர்
    - நீ
    property: பால்_தெரிவு_இல
  links: []
  urai:
    iyaipu:
    - sol.189
    - sol.191
    - sol.192
    text: 'இயைபு (649): 191 நீ; 192 ஏனை; 189 எல்லாம். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப்
- id: sol.191
  pindam: 1
  padalam: sol
  othu: 5
  sutra: 191
  moolam: |-
    அவற்றுள்
    நீ என் கிளவி ஒருமைக்கு உரித்தே
  kaandigai:
    porul: அவற்றுள் "நீ" ஒருமைக்கு உரியது.
    ethu: 190 நீயிர்/நீ என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: நீ
    context: ஒருமை
  links: []
  urai:
