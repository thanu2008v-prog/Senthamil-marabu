  - sol.163
  - sol.164
  - sol.169
  urai:
    iyaipu:
    - sol.160
    - sol.1
    - sol.163
    - sol.168
    - sol.169
    text: 'இயைபு (649): ''மக்கட் சுட்டே'' (சொல். 1) — உயர்திணை வடிவம்; 163 ஐம்பால்; 168 உயர்திணை, 169 அஃறிணை. எண்: மூன்று (நூற்பா) = மூன்று (உயர்திணை, அஃறிணை, பொது).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: அதிகார முறை
    saanru: அவற்றுள்
  - peyar: தொகுத்துக் கூறல்
    saanru: ஆறே
  - peyar: தான் குறியிடுதல்
    saanru: எனப்படுபவை
- id: sol.163
  pindam: 1
  padalam: sol
  othu: 5
  sutra: 163
  moolam: |-
    இரு திணைப் பிரிந்த ஐம் பால் கிளவிக்கும்
    உரியவை உரிய பெயர்வயினான
  kaandigai:
    porul: இரு திணைப் பிரிந்த ஐம்பாலுக்கும் உரியவை உரிய பெயரிடத்து.
    ethu: 162 பெயரின் மூவுரிமை என்றது; இது அதன் தொடர்ச்சி.
    eduthukkaattu:
    - text: இரு திணை மருங்கின் ஐம் பால் அறிய
      from: sol.10
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    classes:
    - உயர்திணை
    - அஃறிணை
    property: 5_பால்_உரிய
  links: []
  urai:
    iyaipu:
    - sol.162
    - sol.10
    - sol.164
    text: 'இயைபு (649): ''இரு திணை மருங்கின் ஐம் பால் அறிய'' (10) — 3 உயர்திணைப் பால் + 2 அஃறிணைப் பால் = 5. எண்: ஐந்து (நூற்பா) = ஐந்து (3 + 2).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: ஐம் பால்
- id: sol.164
  pindam: 1
  padalam: sol
  othu: 5
  sutra: 164
  moolam: |-
    அவ்வழி
    அவன் இவன் உவன் என வரூஉம் பெயரும்
    அவள் இவள் உவள் என வரூஉம் பெயரும்
    அவர் இவர் உவர் என வரூஉம் பெயரும்
    யான் யாம் நாம் என வரூஉம் பெயரும்
    யாவன் யாவள் யாவர் என்னும்
    ஆவயின் மூன்றொடு அப் பதினைந்தும்
    பால் அறி வந்த உயர்திணைப் பெயரே
  kaandigai:
    porul: அவன், இவன், உவன்; அவள், இவள், உவள்; அவர், இவர், உவர்; யான், யாம், நாம்; யாவன், யாவள், யாவர் — பதினைந்தும் (5 × 3 = 15; எண்ணிச் சரிபார்த்தது) பால் அறி உயர்திணைப் பெயர். "ஆவயின் மூன்றொடு" என்பது இறுதி வினா மூன்றைச் சுட்டுவதாக எண்ணினால் 15 பொருந்தும் (ஒருதலை அன்மை).
    en:
      kooruvathu: 15
      enniyathu: 15
    ethu: 163 ஐம்பால் என்றது; உயர்திணையின் மூன்று பாலுக்கும் ஐந்து வகைச் சுட்டு — மொத்தம் 15 உயர்திணைப் பெயர்.
    eduthukkaattu:
    - text: தாம்நாம் என்னும்
      from: ezhu.188
  nilai: நூலில் நேரடியாக
  kanini:
