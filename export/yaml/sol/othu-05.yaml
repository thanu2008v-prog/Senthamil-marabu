    - sol.212
    text: 'இயைபு (649): ''தாம்நாம் என்னும்'' (எழு. 188) — நாம் (164-இன் பட்டியலில்); 165 இன்னொரு 15; 168 இவற்றின் பன்மை/ஒருமை; 212 யாஅர்-வினா. எண்: 15 (நூற்பா) = 5 வகை × 3 பால்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
