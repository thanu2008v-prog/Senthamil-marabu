# இக்கோப்பு data_v2-இலிருந்து உருவானது. 'moolam' (சூத்திரம்) திருத்தக் கூடாது (பொருள். 652).
- id: sol.157
  pindam: 1
  padalam: sol
  othu: 5
  sutra: 157
  moolam: |-
    எல்லாச் சொல்லும் பொருள் குறித்தனவே
  kaandigai:
    porul: எல்லாச் சொல்லும் பொருளைக் குறித்தனவே. சொல்லதிகாரத்தின் அடிப்படை வரையறை — நூலில் நேரடியாக.
    ethu: 'சொல்லுக்குப் பொருள் உண்டு என்பதால் சொல்லால் பொருளும் சொல்லும் அறியப்படும்: "பொருண்மை தெரிதலும் சொன்மை தெரிதலும் / சொல்லின் ஆகும்" (சொல். 158). இடைச்சொல் தனித்துப் பொருள் இல்லாதது போலத் தோன்றினும் "தம்தம் குறிப்பின் பொருள் செய்குநவும்" (சொல். 252).'
    eduthukkaattu:
    - text: பொருண்மை தெரிதலும் சொன்மை தெரிதலும் / சொல்லின் ஆகும்
      from: sol.158
    - text: தம்தம் குறிப்பின் பொருள் செய்குநவும்
      from: sol.252
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    predicate: word(x) → signifies(x, meaning)
  links:
  - sol.158
  - sol.159
  urai:
    iyaipu:
    - sol.252
    text: 'பெயரியலின் நுதலியது, சொல்லதிகாரத்தின் அடிப்படை: "எல்லாச் சொல்லும் பொருள் குறித்தனவே". 158: பொருண்மை தெரிதலும் சொன்மை தெரிதலும் சொல்லால். கடாஅ (650): அசைநிலை, இசைநிறை (சொல். 252) பொருள் குறிக்குமா? — விடை: அவை இடைச்சொல்; "தமக்கு இயல்பு இலவே" (251) — பெயரொடும் வினையொடும் சேர்ந்தே பொருள்; காரணம் "விழிப்பத் தோன்றா" இடமும் உண்டு (394). ஒருதலை அன்மை.'
    vagai: விதி
    maruthalai:
    - kadaa: அசைநிலை, இசைநிறை (சொல். 252) பொருள் குறிக்குமா?
      maattram: '— விடை: அவை இடைச்சொல்; "தமக்கு இயல்பு இலவே" (251) — பெயரொடும் வினையொடும் சேர்ந்தே பொருள்; காரணம் "விழிப்பத் தோன்றா" இடமும் உண்டு (394). ஒருதலை அன்மை.'
      saanru:
      - text: தமக்கு இயல்பு இலவே
        from: sol.251
      - text: விழிப்பத் தோன்றா
        from: sol.394
    thunivu: நூலில் நேரடியாக
- id: sol.158
  pindam: 1
  padalam: sol
  othu: 5
  sutra: 158
  moolam: |-
    பொருண்மை தெரிதலும் சொன்மை தெரிதலும்
    சொல்லின் ஆகும் என்மனார் புலவர்
  kaandigai:
    porul: பொருளைத் தெரிதலும் சொல்லின் தன்மையைத் தெரிதலும் சொல்லால் ஆகும்.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 157 எல்லாச் சொல்லும் பொருள் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    classes:
    - பொருண்மை
    - சொன்மை
    property: சொல்லால்_ஆகும்
  links: []
  urai:
    iyaipu:
    - sol.157
    - sol.159
    - sol.457
    - sol.463
    text: 'இயைபு (649): 457 ''வினையெஞ்சுகிளவியும் வேறு பல் குறிய''; 463 ''மெய் பெறக் கிளந்த கிளவி எல்லாம்''. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்மனார்
- id: sol.159
  pindam: 1
  padalam: sol
  othu: 5
  sutra: 159
  moolam: |-
    தெரிபு வேறு நிலையலும் குறிப்பின் தோன்றலும்
    இரு பாற்று என்ப பொருண்மை நிலையே
  kaandigai:
    porul: 'பொருள் நிலை இருவகை: வெளிப்படத் தெரிந்து நிற்பது, குறிப்பால் தோன்றுவது.'
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 158 பொருண்மை தெரிதல் என்றது; அது தெரிபு வேறு நிலை, குறிப்பின் தோன்றல் — இரு பாறு.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: classification
    class: பொருண்மை_நிலை
    count: 2
    items:
    - தெரிபு_வேறு
    - குறிப்பின்_தோன்றல்
  links:
  - sol.158
  urai:
    iyaipu:
    - sol.158
    - sol.160
    - sol.283
    text: 'இயைபு (649): 160 இதன் விளைவு (பெயர்/வினை); 283 ''குறிப்பின் இசையான்''. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: sol.160
  pindam: 1
  padalam: sol
  othu: 5
  sutra: 160
  moolam: |-
    சொல் எனப்படுப பெயரே வினை என்று
    ஆயிரண்டு என்ப அறிந்திசினோரே
  kaandigai:
    porul: சொல் எனப்படுவன பெயர், வினை என இரண்டு.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 159 பொருண்மை இரு பாறு என்றது; சொல்லுள் முதன்மை இரண்டு — பெயர் (தெரிபு வேறு நிலை), வினை (குறிப்பின் தோன்றல்).
    eduthukkaattu:
    - text: பெயர் ஐ ஒடு கு
      from: sol.65
  nilai: நூலில் நேரடியாக
  kanini:
    kind: classification
    class: சொல்_வகை
    count: 2
    items:
    - பெயர்
    - வினை
  links:
  - sol.161
  urai:
    iyaipu:
    - sol.65
    - sol.157
    - sol.161
    - sol.200
    text: 'இயைபு (649): ''பெயர் ஐ ஒடு கு'' (சொல். 65) — பெயர் இலக்கண முதல்; 161 இடை/உரி விரிவு; 200 ''வினை எனப்படுவது''. எண்: இரண்டு (நூற்பா) = இரண்டு (பெயர், வினை).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: எனப்படுப
- id: sol.161
  pindam: 1
  padalam: sol
  othu: 5
  sutra: 161
  moolam: |-
    இடைச்சொல் கிளவியும் உரிச்சொல் கிளவியும்
    அவற்று வழி மருங்கின் தோன்றும் என்ப
  kaandigai:
    porul: 'இடைச்சொல்லும் உரிச்சொல்லும் அவற்றின் (பெயர், வினை) வழியே தோன்றும். 160–161: சொல் நான்கு வகை, இரண்டு முதன்மை — நூலில் நேரடியாக.'
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 160 பெயர்/வினை என்றது; இடைச்சொல், உரிச்சொல் — இவை பெயர்/வினையின் வழியில் தோன்றுபவை (சார்பு).
    eduthukkaattu:
    - text: உறு தவ நனி
      from: sol.301
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    classes:
    - இடைச்சொல்
    - உரிச்சொல்
    base:
    - பெயர்
