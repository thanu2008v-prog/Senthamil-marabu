    - sol.369
    text: 'இயைபு (649): 367 வாள்; 369 உயாவு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.369
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 369
  moolam: |-
    உயாவே உயங்கல்
  kaandigai:
