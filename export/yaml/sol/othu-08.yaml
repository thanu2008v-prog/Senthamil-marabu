    text: 'இயைபு (649): 306 உவகை; 308 பசப்பு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.308
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 308
  moolam: |-
    பசப்பு நிறன் ஆகும்
  kaandigai:
