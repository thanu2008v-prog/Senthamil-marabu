    - sol.372
    text: 'இயைபு (649): 370 உசாவு; 372 கறுப்பு/சிவப்பு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.372
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 372
  moolam: |-
    கறுப்பும் சிவப்பும் வெகுளிப் பொருள
  kaandigai:
    porul: கறுப்பு, சிவப்பு — வெகுளி.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 371 வேட்கை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: வெகுளி
    count: 2
    items:
    - கறுப்பு
    - சிவப்பு
  links: []
  urai:
    iyaipu:
    - sol.371
    - sol.373
    text: 'இயைபு (649): 371 வயா; 373 கூடுதல் பொருள்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.373
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 373
  moolam: |-
    நிறத்து உரு உணர்த்தற்கும் உரிய என்ப
  kaandigai:
    porul: (அவை) நிறத்தின் உருவை உணர்த்தவும் உரியன.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 372 கறுப்பு, சிவப்பு வெகுளி என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    classes:
    - கறுப்பு
    - சிவப்பு
    property: நிற_உரு_உணர்த்தல்
  links: []
  urai:
    iyaipu:
    - sol.372
    - sol.374
    text: 'இயைபு (649): 372 வெகுளி; 373 ''உரிய'' — கூடுதல் பொருள்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: sol.374
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 374
  moolam: |-
    நொசிவும் நுழைவும் நுணங்கும் நுண்மை
  kaandigai:
    porul: நொசிவு, நுழைவு, நுணங்கு — நுண்மை.
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: 373 என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: நுண்மை
    count: 3
    items:
    - நொசிவு
    - நுழைவு
    - நுணங்கு
  links: []
  urai:
    iyaipu:
    - sol.373
    - sol.375
    text: 'இயைபு (649): 373 நிறம்; 375 புனிறு. நூற்பா எண் கூறவில்லை; பட்டியல் மூன்று.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.375
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 375
  moolam: |-
    புனிறு என் கிளவி ஈன்றணிமைப் பொருட்டே
  kaandigai:
    porul: புனிறு — ஈன்றணிமை (புதிதாக ஈன்ற நிலை).
    ethu: 374 நுண்மை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: புனிறு
    property: ஈன்றணிமை
  links: []
  urai:
    iyaipu:
    - sol.374
    - sol.376
    text: 'இயைபு (649): 374 நுண்மை; 376 நனவு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.376
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 376
  moolam: |-
    நனவே களனும் அகலமும் செய்யும்
  kaandigai:
    porul: நனவு — களமும் அகலமும்.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 375 ஈன்றணிமை என்றது; இது அதன் தொடர்ச்சி.
    eduthukkaattu:
    - text: அன்பினது அகலமும்
      from: porul.44
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: நனவு
    count: 2
    items:
    - களம்
    - அகலம்
  links: []
  urai:
    iyaipu:
    - sol.375
    - sol.377
    text: 'இயைபு (649): ''அகலமும்'' (பொருள். 44) — அகலம் (376-இன் ஒரு பகுதி); 375 புனிறு; 377 மதவு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.377
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 377
  moolam: |-
    மதவே மடனும் வலியும் ஆகும்
  kaandigai:
    porul: மத — மடனும் வலியும்.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 376 அகலம் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: மத
    count: 2
    items:
    - மடன்
    - வலி
  links: []
  urai:
    iyaipu:
    - sol.376
    - sol.378
    text: 'இயைபு (649): 376 அகலம்; 378 கூடுதல் பொருள். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.378
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 378
  moolam: |-
    மிகுதியும் வனப்பும் ஆகலும் உரித்தே
  kaandigai:
    porul: மிகுதியும் வனப்பும் ஆதலும் உண்டு.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 377 மதவு மடனும் வலியும் என்றது; இது அதன் தொடர்ச்சி.
