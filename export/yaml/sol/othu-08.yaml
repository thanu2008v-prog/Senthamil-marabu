    - sol.369
    - sol.371
    text: 'இயைபு (649): 369 உயாவு; 371 வயா.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.371
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 371
  moolam: |-
    வயா என் கிளவி வேட்கைப் பெருக்கம்
  kaandigai:
