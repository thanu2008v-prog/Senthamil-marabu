    - sol.358
    text: 'இயைபு (649): ''கவவொடு மயங்கிய'' (பொருள். 171) — கவவு (தழுவல்); 356 அரி; 358 இசை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.358
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 358
  moolam: |-
    துவைத்தலும் சிலைத்தலும் இயம்பலும் இரங்கலும்
