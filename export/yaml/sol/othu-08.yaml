    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.311
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 311
  moolam: |-
    அலமரல் தெருமரல் ஆயிரண்டும் சுழற்சி
  kaandigai:
    porul: அலமரல், தெருமரல் — இரண்டும் சுழற்சி.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 310 இசை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: சுழற்சி
    count: 2
    items:
    - அலமரல்
    - தெருமரல்
  links: []
  urai:
    iyaipu:
    - sol.310
    - sol.312
    text: 'இயைபு (649): 310 இசை; 312 மழவு/குழவு. எண்: 2 (நூற்பா) = 2 (அலமரல், தெருமரல்).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.312
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 312
  moolam: |-
    மழவும் குழவும் இளமைப் பொருள
  kaandigai:
    porul: மழ, குழ — இளமை.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 311 சுழற்சி என்றது; மழவு, குழவு — இரண்டும் இளமைப் பொருள்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: இளமை
    count: 2
    items:
    - மழ
    - குழ
  links: []
  urai:
    iyaipu:
    - sol.311
    - sol.313
    text: 'இயைபு (649): 311 சுழற்சி; 313 சீர்த்தி.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.313
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 313
  moolam: |-
    சீர்த்தி மிகு புகழ் மாலை இயல்பே
  kaandigai:
    porul: சீர்த்தி — மிகு புகழ்; மாலை — இயல்பு.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 312 இளமை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: உரிச்சொல்_பொருள்
    count: 2
    items:
    - சீர்த்தி→மிகுபுகழ்
    - மாலை→இயல்பு
  links: []
  urai:
    iyaipu:
    - sol.312
    - sol.314
    text: 'இயைபு (649): 312 இளமை; 314 கூர்ப்பு/கழிவு. நூற்பா எண் கூறவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.314
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 314
  moolam: |-
    கூர்ப்பும் கழிவும் உள்ளது சிறக்கும்
  kaandigai:
    porul: கூர்ப்பு, கழிவு — உள்ளது சிறத்தல்.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 313 இயல்பு என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: உள்ளது_சிறத்தல்
    count: 2
    items:
    - கூர்ப்பு
    - கழிவு
  links: []
  urai:
    iyaipu:
    - sol.313
    - sol.315
    text: 'இயைபு (649): 313 இயல்பு; 315 கதழ்வு/துனைவு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.315
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 315
  moolam: |-
    கதழ்வும் துனைவும் விரைவின் பொருள
  kaandigai:
    porul: கதழ்வு, துனைவு — விரைவு.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 314 உள்ளது சிறக்கும் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: விரைவு
    count: 2
    items:
    - கதழ்வு
    - துனைவு
  links: []
  urai:
    iyaipu:
    - sol.314
    - sol.316
    text: 'இயைபு (649): 314 சிறப்பு; 316 அதிர்வு/விதிர்ப்பு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.316
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 316
  moolam: |-
    அதிர்வும் விதிர்ப்பும் நடுக்கம் செய்யும்
  kaandigai:
    porul: அதிர்வு, விதிர்ப்பு — நடுக்கம்.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 315 விரைவு என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: நடுக்கம்
    count: 2
    items:
    - அதிர்வு
    - விதிர்ப்பு
  links: []
  urai:
    iyaipu:
    - sol.315
    - sol.317
    text: 'இயைபு (649): 315 விரைவு; 317 வார்தல்/போகல்/ஒழுகல்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.317
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 317
  moolam: |-
    வார்தல் போகல் ஒழுகல் மூன்றும்
    நேர்பும் நெடுமையும் செய்யும் பொருள
  kaandigai:
    porul: வார்தல், போகல், ஒழுகல் — மூன்றும் நேர்மையும் நெடுமையும்.
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: 316 நடுக்கம் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: நேர்மை_நெடுமை
    count: 3
    items:
    - வார்தல்
    - போகல்
    - ஒழுகல்
  links: []
  urai:
    iyaipu:
    - sol.316
    - sol.318
    text: 'இயைபு (649): 316 நடுக்கம்; 318 தீர்தல்/தீர்த்தல். எண்: 3 (நூற்பா) = 3 (வார்தல், போகல், ஒழுகல்).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: மூன்றும்
- id: sol.318
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 318
  moolam: |-
    தீர்தலும் தீர்த்தலும் விடல் பொருட்டு ஆகும்
  kaandigai:
    porul: தீர்தல், தீர்த்தல் — விடுதல்.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 317 நேர்பு/நெடுமை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: விடுதல்
    count: 2
    items:
    - தீர்தல்
    - தீர்த்தல்
  links: []
  urai:
    iyaipu:
    - sol.317
    - sol.319
    text: 'இயைபு (649): 317 மூன்று; 319 கெடவரல்/பண்ணை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.319
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 319
  moolam: |-
    கெடவரல் பண்ணை ஆயிரண்டும் விளையாட்டு
  kaandigai:
    porul: கெடவரல், பண்ணை — இரண்டும் விளையாட்டு.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 318 விடல் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: விளையாட்டு
    count: 2
    items:
    - கெடவரல்
    - பண்ணை
  links: []
  urai:
    iyaipu:
    - sol.318
    - sol.320
    text: 'இயைபு (649): 318 விடல்; 320 தட/கய/நளி.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.320
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 320
  moolam: |-
    தடவும் கயவும் நளியும் பெருமை
  kaandigai:
    porul: தட, கய, நளி — பெருமை.
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: 319 விளையாட்டு என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: பெருமை
    count: 3
    items:
    - தட
    - கய
    - நளி
  links:
  - sol.321
  - sol.322
  - sol.323
  urai:
    iyaipu:
    - sol.319
    - sol.321
    - sol.322
    - sol.323
    text: 'இயைபு (649): 321–323 இவற்றின் கூடுதல் பொருள். எண்: நூற்பா எண் கூறவில்லை; பட்டியல் மூன்று (தட, கய, நளி).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.321
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 321
  moolam: |-
    அவற்றுள்
    தட என் கிளவி கோட்டமும் செய்யும்
  kaandigai:
    porul: அவற்றுள் "தட" கோட்டமும் (வளைவு) ஆகும்.
    ethu: 320 தட = பெருமை என்றது; தட = கோட்டம் — கூடுதல் பொருள்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: தட
    property: கோட்டமும்
  links: []
  urai:
    iyaipu:
    - sol.320
    - sol.322
    - sol.323
    text: 'இயைபு (649): 320 பொது; 321 ''கோட்டமும்'' — கூடுதல் பொருள்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: அதிகார முறை
    saanru: அவற்றுள்
- id: sol.322
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 322
  moolam: |-
    கய என் கிளவி மென்மையும் செய்யும்
  kaandigai:
    porul: '"கய" மென்மையும் ஆகும்.'
    ethu: 321 தட கோட்டமும் செய்யும் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: கய
    property: மென்மையும்
  links: []
  urai:
    iyaipu:
    - sol.320
    - sol.321
    - sol.323
    text: 'இயைபு (649): 320 கய = பெருமை; 322 மென்மையும் — கூடுதல் பொருள். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.323
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 323
  moolam: |-
    நளி என் கிளவி செறிவும் ஆகும்
  kaandigai:
    porul: '"நளி" செறிவும் ஆகும். (320–323: ஒரு சொல் பல பொருளுக்கு உரியதாகும் நெறி — 299 உடன் ஒப்பு.)'
    ethu: 322 கய = மென்மையும் என்றது; நளி = செறிவு.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: நளி
    property: செறிவும்
  links: []
  urai:
    iyaipu:
    - sol.320
    - sol.322
    text: 'இயைபு (649): 320 நளி = பெருமை; 323 ''செறிவும்'' — கூடுதல் பொருள்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.324
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 324
  moolam: |-
    பழுது பயம் இன்றே
  kaandigai:
    porul: பழுது — பயமின்மை (பயனின்மை).
    ethu: 323 செறிவு என்றது; பழுது = பயம் இன்று.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: பழுது
    property: பயமின்மை
  links: []
  urai:
    iyaipu:
    - sol.323
    - sol.325
    text: 'இயைபு (649): 323 செறிவு; 325 சாயல்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.325
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 325
  moolam: |-
    சாயல் மென்மை
  kaandigai:
    porul: சாயல் — மென்மை.
    ethu: 324 பயம் இன்று என்றது; இது அதன் தொடர்ச்சி.
    eduthukkaattu:
    - text: சாயலும் நாணும்
      from: porul.243
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: சாயல்
    property: மென்மை
  links: []
  urai:
    iyaipu:
    - sol.322
    - sol.324
    - sol.326
    text: 'இயைபு (649): ''சாயலும்'' (பொருள். 243) — சாயல் (மென்மை) அணிகளில்; 322 கய = மென்மை (இணை); 326 முழுது.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.326
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 326
  moolam: |-
    முழுது என் கிளவி எஞ்சாப் பொருட்டே
  kaandigai:
    porul: முழுது — எஞ்சாமை.
    ethu: 325 மென்மை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: முழுது
    property: எஞ்சாமை
  links: []
  urai:
    iyaipu:
    - sol.325
    - sol.327
    text: 'இயைபு (649): 325 மென்மை; 327 வம்பு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.327
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 327
  moolam: |-
    வம்பு நிலை இன்மை
  kaandigai:
    porul: வம்பு — நிலையின்மை.
    ethu: 326 எஞ்சுதல் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: வம்பு
    property: நிலையின்மை
  links: []
  urai:
    iyaipu:
    - sol.326
    - sol.328
    text: 'இயைபு (649): 326 முழுது; 328 மாதர்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.328
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 328
  moolam: |-
    மாதர் காதல்
  kaandigai:
    porul: மாதர் — காதல்.
    ethu: 327 நிலை இன்மை என்றது; இது அதன் தொடர்ச்சி.
    eduthukkaattu:
    - text: காதல் சிறப்பே
      from: sol.57
