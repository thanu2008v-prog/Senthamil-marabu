    - sol.365
    text: 'இயைபு (649): 363 சேர; 365 பேம்/நாம்/உரும்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.365
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 365
  moolam: |-
    பேம் நாம் உரும் என வரூஉம் கிளவி
    ஆ முறை மூன்றும் அச்சப் பொருள
  kaandigai:
    porul: பேம், நாம், உரும் — மூன்றும் அச்சம்.
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: 364 அகலம் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: அச்சம்
    count: 3
    items:
    - பேம்
    - நாம்
    - உரும்
  links: []
  urai:
    iyaipu:
    - sol.364
    - sol.366
    text: 'இயைபு (649): 364 வியல்; 366 வய. எண்: 3 (நூற்பா) = 3.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: மூன்றும்
- id: sol.366
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 366
  moolam: |-
    வய வலி ஆகும்
  kaandigai:
