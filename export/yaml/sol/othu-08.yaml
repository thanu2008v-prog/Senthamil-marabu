  kanini:
    kind: enumeration
    class: மத_விரிவு
    count: 2
    items:
    - மிகுதி
    - வனப்பு
  links: []
  urai:
    iyaipu:
    - sol.377
    - sol.379
    text: 'இயைபு (649): 377 மதவு; 378 ''ஆகலும் உரித்தே'' — கூடுதல் பொருள்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: ஆகலும்
- id: sol.379
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 379
  moolam: |-
    புதிதுபடல் பொருட்டே யாணர்க் கிளவி
  kaandigai:
    porul: யாணர் — புதிதுபடல்.
    ethu: 378 மிகுதி, வனப்பு என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: யாணர்
    property: புதிதுபடல்
  links: []
  urai:
    iyaipu:
    - sol.378
    - sol.380
    text: 'இயைபு (649): 378 மிகுதி; 380 அமர்தல்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.380
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 380
  moolam: |-
    அமர்தல் மேவல்
  kaandigai:
    porul: அமர்தல் — மேவல்.
    ethu: 379 புதிதுபடல் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: அமர்தல்
    property: மேவல்
  links: []
  urai:
    iyaipu:
    - sol.379
    - sol.381
    text: 'இயைபு (649): 379 புதிதுபடல்; 381 யாணுக் கவின்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.381
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 381
  moolam: |-
    யாணுக் கவின் ஆம்
  kaandigai:
    porul: யாணு — கவின் (அழகு).
    ethu: 380 அமர்தல் = மேவல் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: யாணு
    property: கவின்
  links: []
  urai:
    iyaipu:
    - sol.380
    - sol.382
    text: 'இயைபு (649): 380 அமர்தல்; 382 பரவு/பழிச்சு/வழுத்து.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.382
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 382
  moolam: |-
    பரவும் பழிச்சும் வழுத்தின் பொருள
  kaandigai:
    porul: பரவு, பழிச்சு — வழுத்து (வாழ்த்து).
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 381 கவின் என்றது; இது அதன் தொடர்ச்சி.
    eduthukkaattu:
    - text: காடு வாழ்த்தொடு
      from: porul.77
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: வழுத்து
    count: 2
    items:
    - பரவு
    - பழிச்சு
  links: []
  urai:
    iyaipu:
    - sol.381
    - sol.383
    text: 'இயைபு (649): ''காடு வாழ்த்தொடு'' (பொருள். 77) — வாழ்த்து; 381 கவின்; 383 கடி. நூற்பா எண் கூறவில்லை; பட்டியல் மூன்று.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.383
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 383
  moolam: |-
    கடி என் கிளவி
    வரைவே கூர்மை காப்பே புதுமை
    விரைவே விளக்கம் மிகுதி சிறப்பே
    அச்சம் முன்தேற்று ஆயீர் ஐந்தும்
    மெய்ப்படத் தோன்றும் பொருட்டு ஆகும்மே
  kaandigai:
    porul: '"கடி": வரைவு, கூர்மை, காப்பு, புதுமை, விரைவு, விளக்கம், மிகுதி, சிறப்பு, அச்சம், முன்தேற்று — "ஆயீர் ஐந்தும்" (எண்ணிச் சரிபார்த்தது: 10). ஓர் உரிச்சொல்லுக்கு நூல் தரும் மிகப் பல பொருள்கள் இதுவே (உரியியலை எண்ணிச் சரிபார்த்தது).'
    en:
      kooruvathu: 10
      enniyathu: 10
    ethu: '382 வாழ்த்து என்றது; கடி = 10 பொருள்: வரைவு, கூர்மை, காப்பு, புதுமை, விரைவு, விளக்கம், மிகுதி, சிறப்பு, அச்சம், முன்தேற்று.'
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: கடி_பொருள்
    count: 10
    items:
    - வரைவு
    - கூர்மை
    - காப்பு
    - புதுமை
    - விரைவு
    - விளக்கம்
    - மிகுதி
    - சிறப்பு
    - அச்சம்
    - முன்தேற்று
  links:
  - sol.384
  urai:
    iyaipu:
    - sol.382
    - sol.384
    text: 'இயைபு (649): 382 வாழ்த்து; 384 கூடுதல் பொருள். எண்: 10 (நூற்பா ''ஆயீர் ஐந்தும்'' — ஈர் ஐந்து) = 10 (பட்டியல்).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: ஐந்தும்
- id: sol.384
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 384
  moolam: |-
    ஐயமும் கரிப்பும் ஆகலும் உரித்தே
  kaandigai:
    porul: ("கடி") ஐயமும் கரிப்பும் ஆதலும் உண்டு.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 383 கடி பத்துப் பொருள் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: கடி_விரிவு
    count: 2
    items:
    - ஐயம்
    - கரிப்பு
  links: []
  urai:
    iyaipu:
    - sol.383
    - sol.385
    text: 'இயைபு (649): 383 கடி; 384 ''ஆகலும் உரித்தே'' — கூடுதல் பொருள்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: ஆகலும்
- id: sol.385
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 385
  moolam: |-
    ஐ வியப்பு ஆகும்
  kaandigai:
    porul: ஐ — வியப்பு.
    ethu: 384 என்றது; இது அதன் தொடர்ச்சி.
    eduthukkaattu:
    - text: வியப்பொடு
      from: porul.270
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: ஐ
    property: வியப்பு
  links: []
  urai:
    iyaipu:
    - sol.384
    - sol.386
    text: 'இயைபு (649): ''வியப்பொடு'' (பொருள். 270) — வியப்பு (385-இன் பொருள்); 384 கூடுதல் வரவு; 386 முனைவு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.386
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 386
  moolam: |-
    முனைவு முனிவு ஆகும்
  kaandigai:
    porul: முனைவு — முனிவு (வெறுப்பு).
    ethu: 385 வியப்பு என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: முனைவு
    property: முனிவு
  links: []
  urai:
    iyaipu:
    - sol.385
    - sol.387
    text: 'இயைபு (649): 385 ஐ; 387 வையே.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.387
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 387
  moolam: |-
    வையே கூர்மை
  kaandigai:
    porul: வை — கூர்மை.
    ethu: 386 முனிவு என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: வை
    property: கூர்மை
  links: []
  urai:
    iyaipu:
    - sol.386
    - sol.388
    text: 'இயைபு (649): 386 முனைவு; 388 எறுழ்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.388
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 388
  moolam: |-
    எறுழ் வலி ஆகும்
  kaandigai:
    porul: எறுழ் — வலி.
    ethu: 387 கூர்மை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: எறுழ்
    property: வலி
  links: []
  urai:
    iyaipu:
    - sol.387
    - sol.389
    text: 'இயைபு (649): 387 வையே; 389 முடிவு-விதி.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.389
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 389
  moolam: |-
    மெய் பெறக் கிளந்த உரிச்சொல் எல்லாம்
    முன்னும் பின்னும் வருபவை நாடி
    ஒத்த மொழியான் புணர்த்தனர் உணர்த்தல்
    தம்தம் மரபின் தோன்றும்மன் பொருளே
  kaandigai:
    porul: கூறிய உரிச்சொல் எல்லாம் முன்னும் பின்னும் வருவனவற்றை நாடி, ஒத்த மொழியோடு புணர்த்து உணர்த்துக; பொருள் தம் மரபின்படி தோன்றும்.
    ethu: 301–388 உரிச்சொல் வரையறைகள்; மெய்பெறக் கிளந்த எல்லா உரிச்சொல்லும் முன்னும் பின்னும் வருபவை நாடி, ஒத்த மொழியான் புணர்த்தனர் உணர்த்தல் — தம்தம் மரபின் தோன்றும் பொருள்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    contexts:
    - முன்
    - பின்
    op: ஒத்த_மொழியான்_புணர்த்தல்
  links:
  - sol.299
  - sol.390
  urai:
    iyaipu:
    - sol.299
    - sol.390
    - sol.396
    text: 'இயைபு (649): 299 முதல் விதி; 390, 396 முடிவு-விதிகள். எடுத்துக்காட்டு நூல் தரவில்லை — பொது விதி.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: கூறிற்று என்றல்
    saanru: கிளந்த
- id: sol.390
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 390
  moolam: |-
    கூறிய கிளவிப் பொருள் நிலை அல்ல
    வேறு பிற தோன்றினும் அவற்றொடு கொளலே
  kaandigai:
    porul: கூறிய பொருள் அல்லாத வேறு பொருள் தோன்றினும் அவற்றோடு கொள்க.
    ethu: 389 ஒத்த மொழியான் உணர்த்தல் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    context: வேறு_பொருள்
    property: கொள்க
  links: []
  urai:
    iyaipu:
    - sol.389
    - sol.391
    - sol.396
    text: 'இயைபு (649): 389 பொது; 390 கூடுதல் வரவு; 391, 396 வரம்பு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: கூறிற்று என்றல்
    saanru: கூறிய
- id: sol.391
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 391
  moolam: |-
    பொருட்குப் பொருள் தெரியின் அது வரம்பு இன்றே
  kaandigai:
    porul: பொருளுக்குப் பொருள் தெரிய முயன்றால் அதற்கு எல்லையில்லை.
    ethu: 390 வேறு பொருள் கொள்ளலாம் என்றது; இது அதன் தொடர்ச்சி.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    property: வரம்பு_இல
  links: []
  urai:
    iyaipu:
    - sol.390
    - sol.392
    - sol.393
    text: 'இயைபு (649): 390 கூடுதல் வரவு; 392, 393 தொடர். ''வரம்பு இன்றே'' — எவை என நூல் விரிக்கவில்லை — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'வரம்பு இன்றே' — எவை என ஒருதலை அன்மை
- id: sol.392
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 392
  moolam: |-
    பொருட்குத் திரிபு இல்லை உணர்த்த வல்லின்
  kaandigai:
    porul: உணர்த்த வல்லவனிடத்துப் பொருளுக்குத் திரிபில்லை.
    ethu: 391 வரம்பு இல்லை என்றது; பொருட்குத் திரிபு இல்லை — உணர்த்த வல்லின் (சரியாக உணர்த்த முடிந்தால்).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    condition: உணர்த்த_வல்லவன்
    property: பொருள்_திரிபு_இல
  links: []
  urai:
    iyaipu:
    - sol.391
    - sol.393
    text: 'இயைபு (649): 391 வரம்பு; 393 உணர்ச்சி.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.393
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 393
  moolam: |-
    உணர்ச்சி வாயில் உணர்வோர் வலித்தே
  kaandigai:
    porul: உணர்ச்சி வாயில் உணர்வோரின் வலிமையைப் பொறுத்தது.
    ethu: 392 திரிபு இல்லை என்றது; இது அதன் தொடர்ச்சி.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    property: உணர்வோர்_வலி_பொறுத்தது
  links: []
  urai:
    iyaipu:
    - sol.392
    - sol.394
    text: 'இயைபு (649): 392 திரிபு; 394 மொழிப் பொருட் காரணம். ''உணர்வோர்'' — எவர் என நூல் விரிக்கவில்லை — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'உணர்வோர்' எவர் என ஒருதலை அன்மை
- id: sol.394
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 394
  moolam: |-
    மொழிப் பொருட் காரணம் விழிப்பத் தோன்றா
  kaandigai:
    porul: சொல்லின் பொருளுக்குக் காரணம் வெளிப்படத் தோன்றாது. (சொல்-பொருள் தொடர்பு காரணம் காட்ட இயலாதது என்ற கொள்கை — நூலில் நேரடியாக.)
    ethu: 393 உணர்வோர் வலித்தே என்றது; மொழிப் பொருட் காரணம் விழிப்பத் தோன்றா.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    property: காரணம்_வெளிப்படாது
  links: []
  urai:
    iyaipu:
    - sol.393
    - sol.395
    text: 'இயைபு (649): 393 உணர்வோர்; 395 எழுத்துப் பிரிவு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப்
- id: sol.395
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 395
  moolam: |-
    எழுத்துப் பிரிந்து இசைத்தல் இவண் இயல்பு இன்றே
  kaandigai:
    porul: எழுத்துப் பிரித்து (பகுத்துப்) பொருள் இசைத்தல் இங்கு இயல்பில்லை. (உரிச்சொல்லைப் பகுபதமாக்கிப் பொருள் கூறக் கூடாது — நூலில் நேரடியாக.)
    ethu: 394 காரணம் தோன்றா என்றது; எழுத்துப் பிரிந்து இசைத்தல் இவண் இயல்பு இன்றே — விலக்கு.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    property: எழுத்து_பிரித்து_இசைத்தல்_இயல்பில்லை
  links: []
  urai:
    iyaipu:
    - sol.394
    - sol.396
    text: 'இயைபு (649): 394 காரணம்; 395 ''இயல்பு இன்றே'' — விலக்கு; 396 முடிவு.'
    vagai: விலக்கு
    vilakkukkuriyathu:
    - sol.394
    thunivu: நூலில் நேரடியாக
- id: sol.396
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 396
  moolam: |-
    அன்ன பிறவும் கிளந்த அல்ல
    பல் முறையானும் பரந்தன வரூஉம்
    உரிச்சொல் எல்லாம் பொருட்குறை கூட்ட
    இயன்ற மருங்கின் இனைத்து என அறியும்
    வரம்பு தமக்கு இன்மையின் வழி நனி கடைப்பிடித்து
    ஓம்படை ஆணையின் கிளந்தவற்று இயலான்
    பாங்குற உணர்தல் என்மனார் புலவர்
  kaandigai:
    porul: 'ஓத்துப் புறனடை: கூறாதவையும் பலவாறு பரந்து வரும் உரிச்சொல் எல்லாம், எல்லையில்லாமையால், வழியைக் கடைப்பிடித்துக் கூறியவற்றின் இயல்பால் உணர்க.'
    ethu: உரிச்சொல்லுக்கு எல்லை இல்லை — "வரம்பு தமக்கு இன்மையின்"; ஆகவே சொல். 297–395 கிளந்தவற்றின் இயல்பால் பிறவற்றை அறிக. இது சொல். 119, 298 ஓத்துப் புறனடைகளோடு ஒத்த நெறி.
    eduthukkaattu:
    - text: வரம்பு தமக்கு இன்மையின்
      from: sol.396
  nilai: ஒருதலை அன்மை
  kanini:
    kind: exception
    principle: கூறாதவற்றைக்_கூறியவற்றின்_இயல்பால்_உணர்க
    fallback: analogical_inference
    othu_end: true
  links:
  - sol.389
  - sol.390
  urai:
    iyaipu:
    - sol.452
    text: 'உரியியலின் புறனடை: உரிச்சொல்லுக்கு "வரம்பு தமக்கு இன்மையின்" — எண்ணி முடிக்க இயலாது; வழியைக் கடைப்பிடித்து "ஓம்படை ஆணையின்" கிளந்தவற்றின் இயல்பால் உணர்க. புதிதாக வரும் சொல்லுக்கும் இதுவே வழி; சொல். 452 "கடி சொல் இல்லை காலத்துப் படினே" உடன் சேர்ந்து நோக்கத் தக்கது.'
    vagai: விதி
    thunivu: ஒருதலை அன்மை
  utthi:
  - peyar: வந்தது கொண்டு வாராதது உணர்த்தல்
    saanru: பிறவும்
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்மனார்
  - peyar: கூறிற்று என்றல்
    saanru: கிளந்த
