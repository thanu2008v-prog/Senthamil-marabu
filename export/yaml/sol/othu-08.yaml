    text: 'இயைபு (649): 362 கவர்வு; 364 வியல்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.364
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 364
  moolam: |-
    வியல் என் கிளவி அகலப் பொருட்டே
  kaandigai:
