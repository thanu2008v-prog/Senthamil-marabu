    - sol.354
    text: 'இயைபு (649): ''தம் உறு விழுமமும்'' (பொருள். 42) — விழுமம் (துன்பம்/சிறப்பு); 352 வளன்; 354 கருவி.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.354
