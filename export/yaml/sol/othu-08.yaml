    - sol.368
    text: 'இயைபு (649): 366 வய; 368 துய.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.368
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 368
  moolam: |-
    துய என் கிளவி அறிவின் திரிபே
  kaandigai:
