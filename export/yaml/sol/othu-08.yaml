    porul: அவற்றுள் "விறப்பு" அச்சப் பொருளும் ஆகும்.
    ethu: 347 விறப்பு = செறிவு என்றது; விறப்பு = வெரூஉ — கூடுதல் பொருள்.
  nilai: நூலில் நேரடியாக
  kanini:
