    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.353
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 353
  moolam: |-
    விழுமம் சீர்மையும் சிறப்பும் இடும்பையும்
  kaandigai:
    porul: விழுமம் — சீர்மை, சிறப்பு, இடும்பை (மூன்றும்).
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: 352 வளன் என்றது; இது அதன் தொடர்ச்சி.
