    ethu: 368 அறிவின் திரிபு என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: உயா
    property: உயங்கல்
  links: []
  urai:
    iyaipu:
    - sol.368
    - sol.370
    text: 'இயைபு (649): 368 துய; 370 உசாவு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.370
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 370
  moolam: |-
    உசாவே சூழ்ச்சி
