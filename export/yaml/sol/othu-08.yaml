    ethu: 370 சூழ்ச்சி என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    entity: வயா
    property: வேட்கைப்பெருக்கம்
  links: []
  urai:
    iyaipu:
