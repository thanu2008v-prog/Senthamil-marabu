# இக்கோப்பு data_v2-இலிருந்து உருவானது. 'moolam' (சூத்திரம்) திருத்தக் கூடாது (பொருள். 652).
- id: sol.299
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 299
  moolam: |-
    உரிச்சொல் கிளவி விரிக்கும் காலை
    இசையினும் குறிப்பினும் பண்பினும் தோன்றி
    பெயரினும் வினையினும் மெய் தடுமாறி
    ஒரு சொல் பல பொருட்கு உரிமை தோன்றினும்
    பல சொல் ஒரு பொருட்கு உரிமை தோன்றினும்
    பயிலாதவற்றைப் பயின்றவை சார்த்தி
    தம்தம் மரபின் சென்று நிலை மருங்கின்
    எச் சொல் ஆயினும் பொருள் வேறு கிளத்தல்
  kaandigai:
    porul: 'உரிச்சொல்: இசை, குறிப்பு, பண்பு வழியாகத் தோன்றி, பெயரிலும் வினையிலும் வடிவு மாறி வரும்; ஒரு சொல் பல பொருளுக்கும் பல சொல் ஒரு பொருளுக்கும் உரியதாகலாம்; பயிலாதவற்றைப் பயின்றவற்றோடு சார்த்தி, தம் மரபின்படி பொருள் வேறுபடுத்திக் கூறுக.'
    ethu: 'உரிச்சொல் வெளிப்படாத பொருளுடையது — ஆகவே அதன் பொருளை நூல் தனியே கிளக்கிறது: "வெளிப்படு சொல்லே கிளத்தல் வேண்டா / வெளிப்பட வாரா உரிச்சொல் மேன" (சொல். 300). எ.கா. ஒரு பொருளுக்குப் பல சொல் — "உறு தவ நனி என வரூஉம் மூன்றும் / மிகுதி செய்யும்" (சொல். 301).'
    eduthukkaattu:
    - text: வெளிப்படு சொல்லே கிளத்தல் வேண்டா / வெளிப்பட வாரா உரிச்சொல் மேன
      from: sol.300
    - text: உறு தவ நனி என வரூஉம் மூன்றும் / மிகுதி செய்யும்
      from: sol.301
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    entity: உரிச்சொல்
    ways:
    - இசை
    - குறிப்பு
    - பண்பு
    property: பொருள்_வேறுபடுத்தல்
  links:
  - sol.300
  - sol.389
  urai:
    iyaipu:
    - porul.656
    - porul.654
    text: 'உரியியலின் நுதலியது: உரிச்சொல் இசை, குறிப்பு, பண்பு வழித் தோன்றும்; ஒரு சொல் பல பொருட்கும், பல சொல் ஒரு பொருட்கும். "பயிலாதவற்றைப் பயின்றவை சார்த்தி" — அறியாததை அறிந்ததோடு சேர்த்தல் (பொருள். 656 "இனத்தின் சேர்த்தி" உடன் ஒப்பு). 300: வெளிப்படு சொல் கிளக்க வேண்டா — நூல் வெளிப்படாதவற்றையே பொருள் கூறுகிறது (மிகைபடக் கூறல் தவிர்ப்பு — பொருள். 654).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.300
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 300
  moolam: |-
    வெளிப்படு சொல்லே கிளத்தல் வேண்டா
    வெளிப்பட வாரா உரிச்சொல் மேன
  kaandigai:
    porul: வெளிப்படையான சொல்லைக் கூற வேண்டியதில்லை; வெளிப்படாத உரிச்சொல்லின் மேலதே இவ்வோத்து. (ஓத்தின் எல்லையை நூலே வரையறுக்கிறது — நூலில் நேரடியாக.)
    ethu: 299 உரிச்சொல் பொருள் விரிக்க வேண்டும் என்றது; வெளிப்படு சொல் (நேரடிப் பொருள் சொல்) கிளத்தல் வேண்டா — வெளிப்படா உரிச்சொல் மேன.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: உரிச்சொல்
    scope: வெளிப்படா_உரிச்சொல்
  links: []
  urai:
    iyaipu:
    - sol.299
    - sol.301
    text: 'இயைபு (649): 299 பொது; 300 விலக்கு; 301 உரிச்சொல் வகை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விலக்கு
    vilakkukkuriyathu:
    - sol.299
    thunivu: நூலில் நேரடியாக
- id: sol.301
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 301
  moolam: |-
    அவைதாம்
    உறு தவ நனி என வரூஉம் மூன்றும்
    மிகுதி செய்யும் பொருள என்ப
  kaandigai:
    porul: உறு, தவ, நனி — மூன்றும் மிகுதிப் பொருள (எண்ணிச் சரிபார்த்தது).
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: 300 வெளிப்படா உரிச்சொல் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: மிகுதி_பொருள்
    count: 3
    items:
    - உறு
    - தவ
    - நனி
  links: []
  urai:
    iyaipu:
    - sol.299
    - sol.302
    text: 'இயைபு (649): 299 விதி; 302 உரு/புரை. எண்: 3 (நூற்பா) = 3 (உறு, தவ, நனி).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: அதிகார முறை
    saanru: அவைதாம்
  - peyar: தொகுத்துக் கூறல்
    saanru: மூன்றும்
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: sol.302
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 302
  moolam: |-
    உரு உட்கு ஆகும் புரை உயர்பு ஆகும்
  kaandigai:
    porul: உரு — உட்கு (அச்சம்); புரை — உயர்வு.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 301 மிகுதிச் சொல் என்றது; இது அதன் தொடர்ச்சி.
    eduthukkaattu:
    - text: உருவுரு வாகி
      from: ezhu.17
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: உரிச்சொல்_பொருள்
    count: 2
    items:
    - உரு→உட்கு
    - புரை→உயர்வு
  links: []
  urai:
    iyaipu:
    - sol.301
    - sol.303
    text: 'இயைபு (649): ''உருவுரு வாகி'' (எழு. 17) — உரு + உரு (உருவம்); 302 உட்கு எனப் பொருள் வேறுபடுகிறது (உரிச்சொல்). 303 குரு/கெழு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.303
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 303
  moolam: |-
    குருவும் கெழுவும் நிறன் ஆகும்மே
  kaandigai:
    porul: குரு, கெழு — நிறம்.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 302 உரு/புரை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: நிறம்
    count: 2
    items:
    - குரு
    - கெழு
  links: []
  urai:
    iyaipu:
    - sol.302
    - sol.304
    text: 'இயைபு (649): 302 இரு பகுதி; 304 சல்லல்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.304
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 304
  moolam: |-
    சல்லல் இன்னல் இன்னாமையே
  kaandigai:
    porul: சல்லல், இன்னல் — இன்னாமை (துன்பம்). "சல்லல்" சகர அகரத்தால் தொடங்குகிறது; எழு. 62 சகரம் அ, ஐ, ஔவோடு மொழிமுதல் ஆகாது என்கிறது. உரிச்சொல் விலக்கா, பாட வேறுபாடா என்பது ஒருதலை அன்மை (ஆய்வு 14).
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 303 நிறம் என்றது; சல்லல், இன்னல் — இரண்டும் இன்னாமை (துன்பம்).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: இன்னாமை
    count: 2
    items:
    - சல்லல்
    - இன்னல்
  links: []
  urai:
    iyaipu:
    - sol.303
    - sol.305
    text: 'இயைபு (649): 303 நிறம்; 305 மல்லல்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.305
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 305
  moolam: |-
    மல்லல் வளனே ஏ பெற்று ஆகும்
  kaandigai:
    porul: மல்லல் — வளம்; ஏ — பெற்று (பெருக்கம்) ஆகும்.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 304 இன்னாமை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: உரிச்சொல்_பொருள்
    count: 2
    items:
    - மல்லல்→வளம்
    - ஏ→பெற்று
  links: []
  urai:
    iyaipu:
    - sol.304
    - sol.306
    text: 'இயைபு (649): 304 இன்னாமை; 306 உகப்பு/உவப்பு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.306
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 306
  moolam: |-
    உகப்பே உயர்தல் உவப்பே உவகை
  kaandigai:
    porul: உகப்பு — உயர்தல்; உவப்பு — உவகை.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 305 இரு பகுதி என்றது; இது அதன் தொடர்ச்சி.
    eduthukkaattu:
    - text: உவகை நான்கே
      from: porul.255
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: உரிச்சொல்_பொருள்
    count: 2
    items:
    - உகப்பு→உயர்தல்
    - உவப்பு→உவகை
  links: []
  urai:
    iyaipu:
    - sol.305
    - sol.307
    text: 'இயைபு (649): ''உவகை நான்கே'' (பொருள். 255) — உவகை (மகிழ்ச்சி). 305 வளன்; 307 பயப்பு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
