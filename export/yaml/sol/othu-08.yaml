    விறப்பும் உறப்பும் வெறுப்பும் செறிவே
  kaandigai:
    porul: விறப்பு, உறப்பு, வெறுப்பு — செறிவு.
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: 346 பகை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: செறிவு
    count: 3
    items:
    - விறப்பு
    - உறப்பு
    - வெறுப்பு
  links:
  - sol.348
  urai:
    iyaipu:
    - sol.346
    - sol.348
    text: 'இயைபு (649): 346 பகை; 348 விறப்பின் கூடுதல் பொருள். நூற்பா எண் கூறவில்லை; பட்டியல் மூன்று.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.348
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 348
  moolam: |-
