    property: அச்சமும்
  links: []
  urai:
    iyaipu:
    - sol.347
    - sol.349
    text: 'இயைபு (649): 347 விறப்பு; 348 ''ஆகும்'' — கூடுதல் பொருள்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: அதிகார முறை
    saanru: அவற்றுள்
- id: sol.349
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 349
  moolam: |-
