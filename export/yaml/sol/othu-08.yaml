    porul: கம்பலை, சும்மை, கலி, அழுங்கல் — நான்கும் அரவம் (ஒலி).
    en:
      kooruvathu: 4
      enniyathu: 4
    ethu: 348 என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: அரவம்
    count: 4
    items:
    - கம்பலை
    - சும்மை
    - கலி
    - அழுங்கல்
  links:
  - sol.350
  urai:
    iyaipu:
    - sol.348
    - sol.350
    text: 'இயைபு (649): 348 விறப்பு; 350 அழுங்கல் கூடுதல் பொருள். எண்: 4 (நூற்பா) = 4.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
