  kaandigai:
    porul: துவைத்தல், சிலைத்தல், இயம்பல், இரங்கல் — நான்கும் இசைப்பொருள.
    en:
      kooruvathu: 4
      enniyathu: 4
    ethu: 357 அகத்திடும் என்றது; இது அதன் தொடர்ச்சி.
