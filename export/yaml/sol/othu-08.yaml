  kanini:
    kind: enumeration
    class: பரத்தல்
    count: 2
    items:
    - ஞெமிர்தல்
    - பாய்தல்
  links: []
  urai:
    iyaipu:
    - sol.360
    - sol.362
    text: 'இயைபு (649): 360 வறுமை; 362 கவர்வு. நூற்பா எண் கூறவில்லை; பட்டியல் இரண்டு (ஞெமிர்தல், பாய்தல்).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.362
  pindam: 1
  padalam: sol
  othu: 8
  sutra: 362
  moolam: |-
    கவர்வு விருப்பு ஆகும்
  kaandigai:
