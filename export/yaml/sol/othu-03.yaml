- id: sol.103
  pindam: 1
  padalam: sol
  othu: 3
  sutra: 103
  moolam: |-
    உருபு தொடர்ந்து அடுக்கிய வேற்றுமைக் கிளவி
    ஒரு சொல் நடைய பொருள் செல் மருங்கே
  kaandigai:
    porul: உருபு தொடர்ந்து அடுக்கிய வேற்றுமைச் சொல் பொருள் செல்லுமிடத்து ஒரு சொல் நடையது.
    ethu: 102 திரிபிலை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
