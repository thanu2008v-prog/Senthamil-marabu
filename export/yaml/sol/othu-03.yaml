    thunivu: நூலில் நேரடியாக
- id: sol.98
  pindam: 1
  padalam: sol
  othu: 3
  sutra: 98
  moolam: |-
    ஓம்படைக் கிளவிக்கு ஐயும் ஆனும்
    தாம் பிரிவு இலவே தொகை வரு காலை
  kaandigai:
    porul: ஓம்படைச் சொல்லுக்கு (காத்தல்) தொகை வரும்போது ஐயும் ஆனும் பிரிவில்லை.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 97 மெய்-அறி பனுவல் என்றது; ஓம்படைக் கிளவிக்கு ஐ, ஆன் — தொகைவரு காலை பிரிவு இல்லை.
  nilai: நூலில் நேரடியாக
  kanini:
