- id: sol.97
  pindam: 1
  padalam: sol
  othu: 3
  sutra: 97
  moolam: |-
    ஈற்றுப் பெயர் முன்னர் மெய் அறி பனுவலின்
    வேற்றுமை தெரிப உணருமோரே
  kaandigai:
    porul: ஈற்றுப் பெயர் முன், மெய் அறியும் நூலால் (பனுவல்) வேற்றுமையைத் தெரிவர் உணர்ந்தோர்.
    ethu: 95–96 வேற்றுமை-உருபு இயல்கள்; ஈற்றுப் பெயர் முன் மெய்யால் வேற்றுமை அறியப்படும் — மெய் அறி பனுவல்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
