# இக்கோப்பு data_v2-இலிருந்து உருவானது. 'moolam' (சூத்திரம்) திருத்தக் கூடாது (பொருள். 652).
- id: sol.85
  pindam: 1
  padalam: sol
  othu: 3
  sutra: 85
  moolam: |-
    கருமம் அல்லாச் சார்பு என் கிளவிக்கு
    உரிமையும் உடைத்தே கண் என் வேற்றுமை
  kaandigai:
    porul: கருமம் அல்லாத "சார்பு" என்ற சொல்லுக்குக் கண் வேற்றுமையும் உரியது.
    ethu: 'உருபும் பொருளும் ஒன்றோடொன்று ஒத்தே வரும் என்று சொல். 63–84 கூறிய பின், அவை மயங்கும் இடங்கள் இவ்வோத்தில். எ.கா. இதே போல் சினைக்கு ஐயும் கண்ணும் ஒக்கும்: "சினை நிலைக் கிளவிக்கு ஐயும் கண்ணும் / வினை நிலை ஒக்கும்" (சொல். 86).'
    eduthukkaattu:
    - text: சினை நிலைக் கிளவிக்கு ஐயும் கண்ணும் / வினை நிலை ஒக்கும்
      from: sol.86
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: சார்பு_கிளவி
    urupu: கண்
    property: உரிமை
  links:
  - sol.86
  - sol.87
  urai:
    iyaipu:
    - sol.86
    text: 'இயைபு (649): சொல். 86 · வேற்றுமை மயங்கியலின் நுதலியது: ஒரு வேற்றுமைப் பொருள் மற்றோர் உருபால் வருதல். முதற் சூத்திரமே ஒரு மயக்கம் — கருமம் அல்லாத "சார்பு"க்குக் கண் வேற்றுமையும் உரித்து ("உம்" — ஐ ஒழியாமல்). புறனடை 119.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.86
  pindam: 1
  padalam: sol
  othu: 3
  sutra: 86
  moolam: |-
    சினை நிலைக் கிளவிக்கு ஐயும் கண்ணும்
    வினை நிலை ஒக்கும் என்மனார் புலவர்
  kaandigai:
    porul: சினைச்சொல்லுக்கு ஐயும் கண்ணும் வினைநிலையில் ஒக்கும்.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 85 கருமம் அல்லாத சார்புக்கு 7ஆம் சொன்னது; சினை நிலைக் கிளவிக்கு ஐ (2ஆம்), கண் (7ஆம்) — இரண்டும் வினைநிலைக்கு ஒக்கும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: சினை_கிளவி
    urupus:
    - ஐ
    - கண்
    property: வினைநிலை_ஒப்பு
  links: []
  urai:
    iyaipu:
    - sol.72
    - sol.82
    - sol.85
    text: 'இயைபு (649): 72 ஐ; 82 கண்; 85 கருமம் அல்லாத சார்பு — இதன் நீட்சி. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒப்பக் கூறல்
    saanru: ஒக்கும்
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்மனார்
- id: sol.87
  pindam: 1
  padalam: sol
  othu: 3
  sutra: 87
  moolam: |-
    கன்றலும் செலவும் ஒன்றுமார் வினையே
  kaandigai:
    porul: '"கன்றல்", "செலவு" என்ற வினைகளும் அவ்வாறே ஒன்றும்.'
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 85–86 சினை/கருமம் என்றது; கன்றல் (அழிதல்), செலவு (போதல்) — இரண்டும் ஒரே வினை.
    eduthukkaattu:
    - text: செலவின் கன்றலின்
      from: sol.73
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    items:
    - கன்றல்
    - செலவு
    analogy: sol.86
  links: []
  urai:
    iyaipu:
    - sol.73
    - sol.88
    - sol.92
    text: 'இயைபு (649): ''செலவின் கன்றலின்'' (சொல். 73) — ஐ-வகையின் இரண்டு உறுப்புகள்; இவை ஒரே வினையாகக் கொள்ளப்படுகின்றன. 73 இந்நூற்பாவின் இயல்பை முன்னரே காட்டுகிறது.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: ஒன்றுமார்
- id: sol.88
  pindam: 1
  padalam: sol
  othu: 3
  sutra: 88
  moolam: |-
    முதற்சினைக் கிளவிக்கு அது என் வேற்றுமை
    முதற்கண் வரினே சினைக்கு ஐ வருமே
  kaandigai:
    porul: முதல்-சினைச் சொல்லில், முதலில் அது-வேற்றுமை வந்தால் சினைக்கு ஐ வரும்.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 87 வினை-ஒற்றுமை என்றது; முதற்சினைக் கிளவிக்கு அது (6ஆம்) — முதல் முன் வந்தால் சினைக்கு ஐ வரும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: முதல்_சினை
    op: அது→ஐ
    context: முதற்கண்
  links: []
  urai:
    iyaipu:
    - sol.80
    - sol.89
    - sol.90
    text: 'இயைபு (649): 80 அது-உருபு; 89 இதன் மறுதலை; 90 முதல்-சினை சொற்குறிப்பு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.89
  pindam: 1
  padalam: sol
  othu: 3
  sutra: 89
  moolam: |-
    முதல் முன் ஐ வரின் கண் என் வேற்றுமை
    சினை முன் வருதல் தெள்ளிது என்ப
  kaandigai:
    porul: முதல் முன் ஐ வந்தால் சினை முன் கண் வேற்றுமை வருதல் தெளிவு.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 88 முதல் முன் வந்தால் சினைக்கு ஐ என்றது; ஐ முதல் முன் வந்தால் கண் (7ஆம்); சினை முன் வருதல் தெள்ளிது.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    context: முதல்_முன்_ஐ
    op: கண்_வேற்றுமை
  links: []
  urai:
    iyaipu:
    - sol.72
    - sol.82
    - sol.88
    text: 'இயைபு (649): 72 ஐ; 82 கண்; 88 முதல் முன். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: sol.90
  pindam: 1
  padalam: sol
  othu: 3
  sutra: 90
  moolam: |-
    முதலும் சினையும் பொருள் வேறுபடாஅ
    நுவலும் காலை சொற்குறிப்பினவே
  kaandigai:
    porul: முதலும் சினையும் பொருளால் வேறுபடா; கூறும்போது சொற்குறிப்பால் வேறுபடுவன.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 88–89 முதல்-சினை முன்னிலை மாற்றம் சொன்னது; இரண்டும் பொருள் வேறுபடாதபோது சொற்குறிப்பினவே (ஒரு சொல்லாகும்).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    classes:
    - முதல்
    - சினை
    property: சொல்_குறிப்பு_வேறுபாடு
  links: []
  urai:
    iyaipu:
    - sol.88
    - sol.89
    - sol.91
    text: 'இயைபு (649): 88, 89 முன்னிலை மாற்றம்; 91 பிண்டப் பெயர். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.91
  pindam: 1
  padalam: sol
  othu: 3
  sutra: 91
  moolam: |-
    பிண்டப் பெயரும் ஆயியல் திரியா
    பண்டு இயல் மருங்கின் மரீஇய மரபே
  kaandigai:
    porul: பிண்டப் பெயரும் (தொகுதிப் பெயர்) அவ்வியல் திரியா; பண்டு முதல் வழங்கிய மரபு.
    ethu: 90 சொற்குறிப்பு என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: பிண்டப்பெயர்
    property: திரியா_பழைய_மரபு
  links: []
  urai:
    iyaipu:
    - sol.90
    - sol.115
    text: 'இயைபு (649): 90 சொற்குறிப்பு; 115 ''ஆகுபெயர்க் கிளவி'' — பிண்டப்பெயர் ஆகுபெயரின் அடிப்படை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒப்பக் கூறல்
    saanru: ஆயியல்
- id: sol.92
  pindam: 1
  padalam: sol
  othu: 3
  sutra: 92
  moolam: |-
    ஒரு வினை ஒடுச் சொல் உயர்பின் வழித்தே
  kaandigai:
    porul: ஒருவினை ஒடுச்சொல் உயர்ந்ததன் வழியே வரும் (உயர்ந்ததனோடு ஒடு சேரும்).
    ethu: 88–91 முதல்-சினை சொன்னது; ஒரு வினை (ஒற்றைச் செயல்) ஒடு-சொல் உயர்பின் வழித்து (உயர்ந்த பொருளின் பின்னே).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ஒருவினை_ஒடுச்சொல்
    property: உயர்பின்_வழி
  links: []
  urai:
    iyaipu:
    - sol.74
    - sol.93
    - sol.87
    text: 'இயைபு (649): 74 ஒடு-உருபு; 93 3ஆம்/5ஆம்; 87 ஒரே வினை (கன்றல்/செலவு). எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.93
  pindam: 1
  padalam: sol
  othu: 3
  sutra: 93
  moolam: |-
    மூன்றனும் ஐந்தனும் தோன்றக் கூறிய
    ஆக்கமொடு புணர்ந்த ஏதுக் கிளவி
    நோக்கு ஓரனைய என்மனார் புலவர்
  kaandigai:
    porul: மூன்றிலும் ஐந்திலும் கூறிய ஆக்கமொடு புணர்ந்த ஏதுச் சொல் நோக்கில் ஓரனையன.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 92 ஒடு-சொல் என்றது; மூன்றாம் (ஒடு), ஐந்தாம் (இன்) வேற்றுமையில் தோன்றும் ஆக்கத்தோடு புணர்ந்த ஏதுக்கிளவி — நோக்கம் போல.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ஏதுச்சொல்
    contexts:
    - வேற்றுமை_3
    - வேற்றுமை_5
    property: நோக்கு_ஓரனைய
  links: []
  urai:
    iyaipu:
    - sol.74
    - sol.78
    - sol.94
    text: 'இயைபு (649): 74 ஒடு (3ஆம்); 78 இன் (5ஆம்); 94 இதன் மறுதலை (2ஆம்). எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்மனார்
  - peyar: கூறிற்று என்றல்
    saanru: கூறிய
- id: sol.94
  pindam: 1
  padalam: sol
  othu: 3
  sutra: 94
  moolam: |-
    இரண்டன் மருங்கின் நோக்கு அல் நோக்கம் அவ்
    இரண்டன் மருங்கின் ஏதுவும் ஆகும்
  kaandigai:
    porul: இரண்டாம் வேற்றுமையிடத்து "நோக்கு அல் நோக்கம்", அவ்விரண்டிடத்து ஏதுவும் ஆகும்.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 93 3ஆம்/5ஆம் நோக்கம்போல என்றது; 2ஆம் — அதுவே ஏதுவும் ஆகும் (நோக்கமே அல்ல).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: வேற்றுமை_2
    property: நோக்கு_ஏது
  links: []
  urai:
    iyaipu:
    - sol.72
    - sol.93
    text: 'இயைபு (649): 72 ஐ (2ஆம்); 93 3ஆம்/5ஆம் — இதன் இணை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.95
  pindam: 1
  padalam: sol
  othu: 3
  sutra: 95
  moolam: |-
    அது என் வேற்றுமை உயர்திணைத் தொகைவயின்
    அது என் உருபு கெட குகரம் வருமே
  kaandigai:
