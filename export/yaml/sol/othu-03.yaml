    text: 'இயைபு (649): 102 திரிபிலை; 104 வரையார். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: sol.106
  pindam: 1
  padalam: sol
  othu: 3
  sutra: 106
  moolam: |-
    ஐயும் கண்ணும் அல்லாப் பொருள்வயின்
    மெய் உருபு தொகாஅ இறுதியான
  kaandigai:
    porul: ஐயும் கண்ணும் அல்லாத பொருளிடத்து இறுதியில் மெய்யுருபு தொகாது. (ஐ, கண் இறுதியில் தொகும் என நூல் நேரே கூறவில்லை — ஒருதலை அன்மை.)
    ethu: 103–105 உருபு இயல்கள்; ஐ, கண் அல்லாத பொருள்வயில் (அவை அல்லாத இடங்களில்) மெய்-உருபு தொகாமல் இறுதி நிற்கும்.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    exclude:
    - ஐ
    - கண்
    property: மெய்யுருபு_இறுதி_தொகா
  links: []
  urai:
    iyaipu:
    - sol.72
    - sol.82
    - sol.104
    text: 'இயைபு (649): 72 ஐ; 82 கண்; 104 எல்லா உருபும். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக; காண்டிகை சுட்டிய ஐயம் ஒருதலை அன்மை
- id: sol.107
  pindam: 1
  padalam: sol
  othu: 3
  sutra: 107
  moolam: |-
    யாதன் உருபின் கூறிற்று ஆயினும்
    பொருள் செல் மருங்கின் வேற்றுமை சாரும்
  kaandigai:
    porul: எவ்வுருபால் கூறினாலும் பொருள் செல்லும் வழியே வேற்றுமை சாரும். பொருளே வேற்றுமையைத் தீர்மானிக்கும் — நூலில் நேரடியாக.
    ethu: 106 உருபு தொகுதல் என்றது; எந்த உருபு கூறப்பட்டாலும் பொருள் செல்லும் வழியையே வேற்றுமை சாரும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: வேற்றுமை
    property: பொருள்_தீர்மானிக்கும்
  links: []
  urai:
    iyaipu:
    - sol.103
    - sol.108
    - sol.102
    text: 'இயைபு (649): 103 ஒரு சொல் நடை; 108 எதிர்மறையிலும் பொருள் திரியாமை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.108
  pindam: 1
  padalam: sol
  othu: 3
  sutra: 108
  moolam: |-
    எதிர் மறுத்து மொழியினும் தம்தம் மரபின்
    பொருள் நிலை திரியா வேற்றுமைச் சொல்லே
  kaandigai:
    porul: எதிர்மறுத்துக் கூறினாலும் வேற்றுமைச் சொல் தம் மரபின் பொருள் நிலை திரியாது.
    ethu: 107 பொருள் செல்மருங்கு என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: வேற்றுமை_சொல்
    context: எதிர்மறை
    property: பொருள்_நிலை_திரியா
  links: []
  urai:
    iyaipu:
    - sol.107
    - sol.285
    - ezhu.141
    text: 'இயைபு (649): 107 பொருள் செல்மருங்கு; 285 எதிர்மறை உம்மை மயங்கும்; எழு. 141 எழுத்துத் திரியாது இசை திரிதல். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: எதிர் பொருள் உணர்த்தல்
    saanru: எதிர் மறுத்து
- id: sol.109
  pindam: 1
  padalam: sol
  othu: 3
  sutra: 109
  moolam: |-
    கு ஐ ஆன் என வரூஉம் இறுதி
    அவ்வொடு சிவணும் செய்யுளுள்ளே
  kaandigai:
    porul: கு, ஐ, ஆன் என வரும் இறுதி செய்யுளில் அகரத்தோடு பொருந்தும். ("ஆன்" இங்கே உருபாகச் சுட்டப்படுகிறது; 65-இன் எட்டில் இல்லை — காண்க 75; இங்கே எவ்வுருபு என நூல் கூறவில்லை, ஒருதலை அன்மை.)
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: 103–108 உருபு இயல்கள்; கு, ஐ, ஆன் ஆகிய மூன்று ஈற்றும் செய்யுளுள் அவ்வொடு சிவணும்.
    eduthukkaattu:
    - text: கிளவிக்கு
      from: ezhu.244
    - text: ஆனின்
      from: ezhu.124
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    items:
    - கு
    - ஐ
    - ஆன்
    context: செய்யுள்
    op: அகர_இணைவு
  links: []
  urai:
    iyaipu:
    - sol.72
    - sol.76
    - sol.78
    text: 'இயைபு (649): 76 கு (4ஆம்), 72 ஐ (2ஆம்), 78 இன் (5ஆம்) — ஆனின் 6ஆம்/5ஆம் சார்பு. எடுத்துக்காட்டு: ''கிளவிக்கு'' (எழு. 244) — கு-ஈறு; ''ஆனின்'' (எழு. 124) — ஆன்-ஈறு. ஐ-ஈற்றுக்கு ''பெயர் ஐ ஒடு கு'' (சொல். 65) — விதியின் சொல், எடுத்துக்காட்டு அன்று.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக; காண்டிகை சுட்டிய ஐயம் ஒருதலை அன்மை
- id: sol.110
  pindam: 1
  padalam: sol
  othu: 3
  sutra: 110
  moolam: |-
    அ எனப் பிறத்தல் அஃறிணை மருங்கின்
    குவ்வும் ஐயும் இல் என மொழிப
  kaandigai:
    porul: அஃறிணையில் அகரமாகப் பிறத்தல் குவ்வுக்கும் ஐக்கும் இல்லை.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 109 கு/ஐ/ஆன் என்றது; அஃறிணையில் 'அ' மாற்றம் — கு, ஐ 'இல்' ஆகும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: அஃறிணை
    contexts:
    - கு
    - ஐ
    property: அகர_பிறப்பு_இல்லை
  links: []
  urai:
    iyaipu:
    - sol.109
    - sol.72
    - sol.76
    text: 'இயைபு (649): 109 கு/ஐ/ஆன்; 72 ஐ; 76 கு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
  - peyar: தான் குறியிடுதல்
    saanru: என மொழிப
- id: sol.111
  pindam: 1
  padalam: sol
  othu: 3
  sutra: 111
  moolam: |-
    இதனது இது இற்று என்னும் கிளவியும்
    அதனைக் கொள்ளும் பொருள்வயினானும்
    அதனான் செயற்படற்கு ஒத்த கிளவியும்
    முறை கொண்டு எழுந்த பெயர்ச்சொல் கிளவியும்
    பால் வரை கிளவியும் பண்பின் ஆக்கமும்
    காலத்தின் அறியும் வேற்றுமைக் கிளவியும்
    பற்று விடு கிளவியும் தீர்ந்து மொழிக் கிளவியும்
    அன்ன பிறவும் நான்கன் உருபின்
    தொல் நெறி மரபின தோன்றல் ஆறே
  kaandigai:
    porul: '"இதனது இது இற்று" என்பதும், அதனைக் கொள்ளும் பொருளும், அதனால் செயற்படற்கு ஒத்ததும், முறைப்பெயரும், பால்வரை கிளவியும், பண்பின் ஆக்கமும், காலத்தால் அறியும் வேற்றுமையும், பற்றுவிடு கிளவியும், தீர்ந்துமொழிக் கிளவியும் — பிறவும் — நான்காம் உருபில் வரும் தொன்னெறி மரபின (கு-வின் மயக்கம்).'
    en:
      kooruvathu: 8
      enniyathu: 8
    ethu: 109–110 கு/ஐ/ஆன் சொன்னது; 'இதனது', 'இது', 'இற்று' என்னும் கிளவிகளும் — நான்கன் உருபின் (4ஆம் வேற்றுமை) தொல்நெறி வழி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: கு_மயக்கம்
    count: 8
    items:
    - இதனது_இது_இற்று
    - கொள்ளும்_பொருள்
    - செயற்படற்கு_ஒத்த
    - முறைப்பெயர்
    - பால்வரை_கிளவி
    - பண்பின்_ஆக்கம்
    - காலத்தால்_அறியும்
    - பற்றுவிடு_கிளவி
    closed: false
  links: []
  urai:
    iyaipu:
    - sol.76
    - sol.110
    - sol.112
    text: 'இயைபு (649): 76 கு (4ஆம்); 110 அகரம்→இல்; 112 ஏனை உருபு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: ஆறே
  - peyar: வந்தது கொண்டு வாராதது உணர்த்தல்
    saanru: பிறவும்
- id: sol.112
  pindam: 1
  padalam: sol
  othu: 3
  sutra: 112
  moolam: |-
    ஏனை உருபும் அன்ன மரபின
    மானம் இலவே சொல் முறையான
  kaandigai:
    porul: ஏனை உருபுகளும் அம்மரபின; சொல்முறையால் குற்றமில்லை.
    ethu: 111 4ஆம் உருபின் வகைகள் சொன்னது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    analogy: sol.111
    property: சொல்முறை_குற்றமில்லை
  links: []
  urai:
    iyaipu:
    - sol.111
    - sol.104
    text: 'இயைபு (649): 111 4ஆம் உருபு; 104 ''வரையார்''. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.113
  pindam: 1
  padalam: sol
  othu: 3
  sutra: 113
  moolam: |-
    வினையே செய்வது செயப்படுபொருளே
    நிலனே காலம் கருவி என்றா
    இன்னதற்கு இது பயன் ஆக என்னும்
    அன்ன மரபின் இரண்டொடும் தொகைஇ
    ஆயெட்டு என்ப தொழில் முதனிலையே
  kaandigai:
    porul: 'வினை, செய்வது, செயப்படுபொருள், நிலன், காலம், கருவி, இன்னதற்கு, இது பயன் — "ஆயெட்டு" தொழில் முதனிலை (எண்ணிச் சரிபார்த்தது: 8).'
    en:
      kooruvathu: 8
      enniyathu: 8
    ethu: 63–112 வேற்றுமை இயல்கள்; தொழில்-முதனிலை 8 — வினை, செய்வது, செயப்படுபொருள், நிலன், காலம், கருவி, இன்னதற்கு இது பயன், அன்ன மரபு.
    eduthukkaattu:
    - text: செய்வது இல்
      from: sol.244
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: தொழில்_முதனிலை
    count: 8
    items:
    - வினை
    - செய்வது
    - செயப்படுபொருள்
    - நிலன்
    - காலம்
    - கருவி
    - இன்னதற்கு
    - இது_பயன்
  links:
  - sol.114
  urai:
    iyaipu:
    - sol.72
    - sol.74
    - sol.236
    text: 'இயைபு (649): 72 ஐ; 74 ஒடு; 236 ''நிலனும் பொருளும் காலமும் கருவியும்'' — இதே உறுப்புகளின் இணை. எடுத்துக்காட்டு: ''செய்வது இல்'' (சொல். 244) — செய்வது தொழில்-முதனிலையாக. எண்: எட்டு (நூற்பா: ''ஆயெட்டு'') = எட்டு (பட்டியல்: 6 + 2).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: ஆயெட்டு
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: sol.114
  pindam: 1
  padalam: sol
  othu: 3
  sutra: 114
  moolam: |-
    அவைதாம்
    வழங்கு இயல் மருங்கின் குன்றுவ குன்றும்
  kaandigai:
    porul: அவை வழக்கில் குன்றுவன குன்றும் (எல்லாம் எப்போதும் வர வேண்டியதில்லை).
    ethu: 113 தொழில்-முதனிலை 8 என்றது; வழங்கு இயல்மருங்கின் குன்றுவ குன்றும் — பயன்பாடு குறையுமிடத்துக் குறையும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    property: வழக்கில்_குன்றுவன_குன்றும்
  links: []
  urai:
    iyaipu:
    - sol.113
    text: 'இயைபு (649): 113 தொழில்-முதனிலை 8. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: அதிகார முறை
    saanru: அவைதாம்
- id: sol.115
  pindam: 1
  padalam: sol
  othu: 3
  sutra: 115
  moolam: |-
    முதலின் கூறும் சினை அறி கிளவியும்
    சினையின் கூறும் முதல் அறி கிளவியும்
    பிறந்தவழிக் கூறலும் பண்பு கொள் பெயரும்
    இயன்றது மொழிதலும் இருபெயரொட்டும்
    வினைமுதல் உரைக்கும் கிளவியொடு தொகைஇ
    அனை மரபினவே ஆகுபெயர்க் கிளவி
  kaandigai:
    porul: 'ஆகுபெயர்: முதலால் சினையைக் கூறல், சினையால் முதலைக் கூறல், பிறந்தவிடத்தால் கூறல், பண்பு கொள் பெயர், இயன்றதைக் கூறல், இருபெயரொட்டு, வினைமுதலைக் கூறல் — அனைய மரபின (எண்ணியது: 7; நூல் எண் தரவில்லை).'
    en:
      kooruvathu: 7
      enniyathu: 7
    ethu: 113–114 தொழில்-முதனிலை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: ஆகுபெயர்
    count: 7
    items:
    - முதல்_சினை_கூறல்
    - சினை_முதல்_கூறல்
    - பிறந்தவழி_கூறல்
    - பண்பு_கொள்_பெயர்
    - இயன்றது_மொழிதல்
    - இருபெயரொட்டு
    - வினைமுதல்_உரைத்தல்
  links:
  - sol.116
  urai:
    iyaipu:
    - sol.91
    - sol.116
    - sol.117
    text: 'இயைபு (649): 91 பிண்டப் பெயர் (ஆகுபெயரின் அடிப்படை); 116 ஆகுபெயர் இரு இயல்பு; 117 வேற்றுமைப் போற்றல். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.116
  pindam: 1
  padalam: sol
  othu: 3
  sutra: 116
  moolam: |-
    அவைதாம்
    தம்தம் பொருள்வயின் தம்மொடு சிவணலும்
    ஒப்பு இல் வழியான் பிறிது பொருள் சுட்டலும்
    அப் பண்பினவே நுவலும் காலை
  kaandigai:
    porul: அவை தம் பொருளோடு பொருந்துதலும், ஒப்பில்லா வழியால் பிறிது பொருள் சுட்டுதலும் உடையன.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 115 ஆகுபெயர் இயல்கள் சொன்னது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    contexts:
    - தம்_பொருள்
    - ஒப்பில்_வழி
    property: பிறிது_பொருள்_சுட்டல்
  links: []
  urai:
    iyaipu:
    - sol.115
    - sol.117
    - sol.118
    text: 'இயைபு (649): 115 ஆகுபெயர் வகைகள்; 117 வேற்றுமைப் போற்றல்; 118 அளவு/நிறை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: அதிகார முறை
    saanru: அவைதாம்
- id: sol.117
  pindam: 1
  padalam: sol
  othu: 3
  sutra: 117
  moolam: |-
    வேற்றுமை மருங்கின் போற்றல் வேண்டும்
  kaandigai:
    porul: வேற்றுமையிடத்து (ஆகுபெயரைப்) போற்றிக் காண வேண்டும்.
    ethu: 115–116 ஆகுபெயர் சொன்னது; ஆகுபெயர் கையாளும்போது வேற்றுமை மருங்கின் போற்றல் வேண்டும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ஆகுபெயர்
    context: வேற்றுமை
    op: போற்றல்
  links: []
  urai:
    iyaipu:
    - sol.116
    - sol.84
    - sol.119
    text: 'இயைபு (649): 116 ஆகுபெயர் இரு வகை; 84 வேற்றுமை விரி; 119 கிளந்த அல்ல. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஆணை கூறல்
    saanru: வேண்டும்
- id: sol.118
  pindam: 1
  padalam: sol
  othu: 3
  sutra: 118
  moolam: |-
    அளவு நிறையும் அவற்றொடு கொள்வழி
    உள என மொழிப உணர்ந்திசினோரே
  kaandigai:
    porul: அளவும் நிறையும் அவற்றோடு கொள்ளும் இடத்து உள என்பர்.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 117 வேற்றுமைப் போற்றல் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    classes:
    - அளவு
    - நிறை
    property: கொள்ளிடத்து_உள
  links: []
  urai:
    iyaipu:
    - sol.116
    - ezhu.308
    - ezhu.319
    text: 'இயைபு (649): 116 ஆகுபெயர்; எழு. 308 ''எண்ணென் உணவுப்பெயர்'' (அளவு-வகை); எழு. 319 அளவு/நிறை வேற்றுமை இயல. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
  - peyar: தான் குறியிடுதல்
    saanru: என மொழிப
- id: sol.119
  pindam: 1
  padalam: sol
  othu: 3
  sutra: 119
  moolam: |-
    கிளந்த அல்ல வேறு பிற தோன்றினும்
    கிளந்தவற்று இயலான் உணர்ந்தனர் கொளலே
  kaandigai:
    porul: 'ஓத்துப் புறனடை: கூறாத வேறு பிற தோன்றினும் கூறியவற்றின் இயல்பால் உணர்ந்து கொள்க.'
    ethu: 'மயக்கங்கள் எண்ணி முடியாதவை; ஆகவே கூறியவற்றைக் கொண்டு கூறாதவற்றை அறிக என ஓத்தை முடிக்கிறது — "வந்தது கொண்டு வாராதது உணர்த்தல்" (பொருள். 656). இதே சொற்களால் இடையியலும் முடிகிறது: "கிளந்தவற்று இயலான் உணர்ந்தனர் கொளலே" (சொல். 298).'
    eduthukkaattu:
    - text: வந்தது கொண்டு வாராதது உணர்த்தல்
      from: porul.656
    - text: கிளந்தவற்று இயலான் உணர்ந்தனர் கொளலே
      from: sol.298
  nilai: நூலில் நேரடியாக
  kanini:
    kind: exception
    principle: கூறாதவற்றைக்_கூறியவற்றின்_இயல்பால்_உணர்க
    othu_end: true
  links:
  - sol.102
  - sol.463
  urai:
    iyaipu:
    - sol.298
    - porul.656
    text: மயங்கியலின் புறனடை. இதே சூத்திரம் இடையியலையும் முடிக்கிறது (சொல். 298) — ஒப்பக் கூறல் (பொருள். 656). மயக்கம் எல்லையற்றது என்பதால் "கிளந்தவற்று இயலான்" அறிதல்.
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: கூறிற்று என்றல்
    saanru: கிளந்த
