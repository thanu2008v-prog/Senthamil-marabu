- id: sol.102
  pindam: 1
  padalam: sol
  othu: 3
  sutra: 102
  moolam: |-
    அன்ன பிறவும் தொல் நெறி பிழையாது
    உருபினும் பொருளினும் மெய் தடுமாறி
    இரு வயின் நிலையும் வேற்றுமை எல்லாம்
    திரிபு இடன் இலவே தெரியுமோர்க்கே
  kaandigai:
    porul: பிறவும் பழைய நெறி பிழையாமல் உருபிலும் பொருளிலும் மாறி இரு இடத்தும் நிற்கும் வேற்றுமை எல்லாம் தெரிந்தோர்க்குத் திரிபில்லை.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 85–101 வேற்றுமை மயக்க விதிகள்; அன்ன பிறவும் தொல்நெறி பிழையாது — உருபிலும் பொருளிலும் தடுமாறி வந்தாலும், இரு வயின் நிலையிலும் திரிபு இல்லை.
  nilai: நூலில் நேரடியாக
  kanini:
