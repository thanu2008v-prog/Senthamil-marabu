- id: sol.99
  pindam: 1
  padalam: sol
  othu: 3
  sutra: 99
  moolam: |-
    ஆறன் மருங்கின் வாழ்ச்சிக் கிழமைக்கு
    ஏழும் ஆகும் உறை நிலத்தான
  kaandigai:
    porul: ஆறாம் வேற்றுமையின் வாழ்ச்சிக் கிழமைக்கு உறைநிலத்தால் ஏழாம் வேற்றுமையும் ஆகும்.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 98 ஐ/ஆன் என்றது; 6ஆம் வாழ்ச்சிக் கிழமைக்கு 7ஆம் (கண்) — உறைநிலம் வழி.
  nilai: நூலில் நேரடியாக
