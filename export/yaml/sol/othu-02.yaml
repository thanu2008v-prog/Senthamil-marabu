    text: 'இயைபு (649): ''கிளவிக்கு'' (எழு. 244), ''வினைக்கு'' (சொல். 38), ''பொருட்கே'' (எழு. 302) — கு-புணர்ச்சி. 77 கு-வகை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.77
  pindam: 1
  padalam: sol
  othu: 2
  sutra: 77
  moolam: |-
    அதற்கு வினை உடைமையின் அதற்கு உடம்படுதலின்
    அதற்குப் படு பொருளின் அது ஆகு கிளவியின்
    அதற்கு யாப்பு உடைமையின் அதன் பொருட்டு ஆதலின்
    நட்பின் பகையின் காதலின் சிறப்பின் என்று
    அப் பொருட் கிளவியும் அதன் பால என்மனார்
  kaandigai:
    porul: 'கு-வேற்றுமைப் பொருள்கள்: அதற்கு வினையுடைமை, உடம்படுதல், படுபொருள், அது ஆகு கிளவி, யாப்புடைமை, அதன் பொருட்டு ஆதல், நட்பு, பகை, காதல், சிறப்பு — 10 (எண்ணியது).'
    en:
      kooruvathu: 10
      enniyathu: 10
    ethu: 76 கு-உருபு என்றது; இது அதன் தொடர்ச்சி.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: enumeration
    class: கு_பொருள்
    count: 10
    items:
    - அதற்கு_வினையுடைமை
    - உடம்படுதல்
    - படுபொருள்
    - அது_ஆகு_கிளவி
    - யாப்புடைமை
