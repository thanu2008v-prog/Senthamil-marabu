- id: sol.82
  pindam: 1
  padalam: sol
  othu: 2
  sutra: 82
  moolam: |-
    ஏழாகுவதே
    கண் எனப் பெயரிய வேற்றுமை கிளவி
    வினை செய் இடத்தின் நிலத்தின் காலத்தின்
    அனை வகைக் குறிப்பின் தோன்றும் அதுவே
  kaandigai:
    porul: ஏழாம் வேற்றுமை "கண்"; வினை செய் இடம், நிலம், காலம் என்னும் அனைய குறிப்பில் தோன்றும்.
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: 80-81 அது-வகை முடிந்தது; கண்-உருபு (ஏழாம்) — வினைசெய் இடம், நிலம், காலம், அனைவகைக் குறிப்பு.
    eduthukkaattu:
    - text: தொகைநிலைக்கண்ணும்
      from: porul.72
    - text: கண்ணினும் செவியினும்
      from: porul.271
