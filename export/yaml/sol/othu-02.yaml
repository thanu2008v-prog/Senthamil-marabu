    - sol.76
    text: 'இயைபு (649): 74 ஒடு; 76 கு. ''பிறவும்'' — எவை என நூல் பெயரிடவில்லை — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'பிறவும்' ஒருதலை அன்மை
  utthi:
  - peyar: வந்தது கொண்டு வாராதது உணர்த்தல்
    saanru: பிறவும்
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்மனார்
- id: sol.76
  pindam: 1
  padalam: sol
  othu: 2
  sutra: 76
  moolam: |-
    நான்காகுவதே
    கு எனப் பெயரிய வேற்றுமைக் கிளவி
    எப் பொருள் ஆயினும் கொள்ளும் அதுவே
  kaandigai:
    porul: நான்காம் வேற்றுமை "கு"; எப்பொருளாயினும் கொள்ளும்.
    ethu: 74-75 ஒடு-வகை முடிந்தது; கு-உருபு (நான்காம்) — எப்பொருளாயினும் கொள்ளும்.
    eduthukkaattu:
    - text: கிளவிக்கு
      from: ezhu.244
    - text: வினைக்கு
      from: sol.38
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: வேற்றுமை_4
    urupu: கு
    property: எப்பொருள்_கொள்ளும்
  links:
