    text: 'இயைபு (649): 73 ஐ-வகை; 113 தொழில் முதனிலை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.73
  pindam: 1
  padalam: sol
  othu: 2
  sutra: 73
  moolam: |-
    காப்பின் ஒப்பின் ஊர்தியின் இழையின்
    ஒப்பின் புகழின் பழியின் என்றா
    பெறலின் இழவின் காதலின் வெகுளியின்
    செறலின் உவத்தலின் கற்பின் என்றா
    அறுத்தலின் குறைத்தலின் தொகுத்தலின் பிரித்தலின்
    நிறுத்தலின் அளவின் எண்ணின் என்றா
    ஆக்கலின் சார்தலின் செலவின் கன்றலின்
    நோக்கலின் அஞ்சலின் சிதைப்பின் என்றா
    அன்ன பிறவும் அம் முதற் பொருள
    என்ன கிளவியும் அதன் பால என்மனார்
  kaandigai:
    porul: 'ஐ-வேற்றுமைப் பொருள்கள்: காப்பு, ஒப்பு, ஊர்தி, இழை, ஒப்பு, புகழ், பழி; பெறல், இழவு, காதல், வெகுளி, செறல், உவத்தல், கற்பு; அறுத்தல், குறைத்தல், தொகுத்தல், பிரித்தல், நிறுத்தல், அளவு, எண்; ஆக்கல், சார்தல், செலவு, கன்றல், நோக்கல், அஞ்சல், சிதைப்பு — பிறவும். நான்கு அடித்தொகுதி × 7 = 28 (எண்ணியது). "ஒப்பின்" இருமுறை வருகிறது — பாட வேறுபாடா, இருபொருளா என்பது ஒருதலை அன்மை.'
    en:
      kooruvathu: 28
      enniyathu: 28
    ethu: 72 ஐ-உருபு என்றது; இது அதன் தொடர்ச்சி.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: enumeration
    class: ஐ_பொருள்
    count: 28
    groups:
    - - காப்பு
      - ஒப்பு
      - ஊர்தி
      - இழை
      - ஒப்பு
      - புகழ்
      - பழி
    - - பெறல்
      - இழவு
      - காதல்
      - வெகுளி
      - செறல்
      - உவத்தல்
      - கற்பு
    - - அறுத்தல்
      - குறைத்தல்
      - தொகுத்தல்
      - பிரித்தல்
      - நிறுத்தல்
      - அளவு
      - எண்
    - - ஆக்கல்
      - சார்தல்
      - செலவு
      - கன்றல்
      - நோக்கல்
      - அஞ்சல்
      - சிதைப்பு
    closed: false
  links:
  - sol.72
  urai:
    iyaipu:
    - sol.72
    - sol.74
    text: 'இயைபு (649): 74 ஒடு-உருபு. எண் (நூலுள், ஏறக்குறைய): பட்டியலில் 27+ இனம்; ''பிறவும்'' — எவை என நூல் பெயரிடவில்லை — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'பிறவும்' ஒருதலை அன்மை
  utthi:
  - peyar: வந்தது கொண்டு வாராதது உணர்த்தல்
    saanru: பிறவும்
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்மனார்
- id: sol.74
  pindam: 1
  padalam: sol
  othu: 2
  sutra: 74
  moolam: |-
    மூன்றாகுவதே
    ஒடு எனப் பெயரிய வேற்றுமைக் கிளவி
    வினைமுதல் கருவி அனை முதற்று அதுவே
  kaandigai:
    porul: மூன்றாம் வேற்றுமை "ஒடு"; வினைமுதல், கருவி என்னும் அனைய முதலை உடையது.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 73 ஐ-வகை முடிந்தது; ஒடு-உருபு (மூன்றாம்) — வினைமுதல், கருவி, அனைமுதல்.
    eduthukkaattu:
    - text: அறத்தொடு
      from: porul.203
    - text: தெற்கொடு
      from: ezhu.432
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: வேற்றுமை_3
