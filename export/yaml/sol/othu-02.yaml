- id: sol.80
  pindam: 1
  padalam: sol
  othu: 2
  sutra: 80
  moolam: |-
    ஆறாகுவதே
    அது எனப் பெயரிய வேற்றுமைக் கிளவி
    தன்னினும் பிறிதினும் இதனது இது எனும்
    அன்ன கிளவிக் கிழமைத்து அதுவே
  kaandigai:
    porul: ஆறாம் வேற்றுமை "அது"; தன்னினும் பிறிதினும் "இதனது இது" என்னும் கிழமைப் பொருளது.
    ethu: 78-79 இன்-வகை முடிந்தது; அது-உருபு (ஆறாம்) — 'தன்னினும் பிறிதினும் இதனது, இது' எனும் கிளவிக்கு இழமைத்து.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: வேற்றுமை_6
    urupu: அது
    contexts:
    - தன்
    - பிறிது
    property: கிழமை
  links:
  - sol.81
  urai:
