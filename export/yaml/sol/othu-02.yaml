- id: sol.84
  pindam: 1
  padalam: sol
  othu: 2
  sutra: 84
  moolam: |-
    வேற்றுமைப் பொருளை விரிக்கும் காலை
    ஈற்று நின்று இயலும் தொகைவயின் பிரிந்து
    பல் ஆறாகப் பொருள் புணர்ந்து இசைக்கும்
    எல்லாச் சொல்லும் உரிய என்ப
  kaandigai:
    porul: வேற்றுமைப் பொருளை விரிக்கும்போது, ஈற்றில் நின்று இயலும் தொகையிடத்துப் பிரிந்து பல வகையாகப் பொருள் புணர்ந்து இசைக்கும் எல்லாச் சொல்லும் உரியன. ஓத்தின் புறனடை.
    ethu: வேற்றுமை ஏழும் விளியும் (சொல். 63, 64) உருபோடு விரித்துக் கூறிய பின், உருபு மறைந்த தொகையிலும் அப்பொருள் நிற்கும் எனக் கூறி ஓத்தை முடிக்கிறது; அடுத்த ஓத்து ஒரு வேற்றுமைப் பொருள் மற்றோர் உருபால் வருதலைக் கூறுகிறது (சொல். 85).
