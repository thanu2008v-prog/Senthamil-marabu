# இக்கோப்பு data_v2-இலிருந்து உருவானது. 'moolam' (சூத்திரம்) திருத்தக் கூடாது (பொருள். 652).
- id: sol.63
  pindam: 1
  padalam: sol
  othu: 2
  sutra: 63
  moolam: |-
    வேற்றுமைதாமே ஏழ் என மொழிப
  kaandigai:
    porul: வேற்றுமை ஏழு என்பர்.
    en:
      kooruvathu: 7
      enniyathu: 7
    ethu: 'தொகை முதலில் கூறப்பட்டு, பின் விளியொடு எட்டாகவும் (சொல். 64) பெயர்களோடும் விரிக்கப்படுகிறது: "பெயர் ஐ ஒடு கு / இன் அது கண் விளி" (சொல். 65). எழுத்ததிகாரத்தில் உருபு ஆறு எனப் புணர்ச்சிக்காக எண்ணப்பட்டது (எழு. 113) — எழுவாயும் விளியும் உருபு இல்லாதவை.'
    eduthukkaattu:
    - text: பெயர் ஐ ஒடு கு / இன் அது கண் விளி
      from: sol.65
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: வேற்றுமை
    count: 7
    items:
    - 1_எழுவாய்
    - 2_ஐ
    - 3_ஒடு
    - 4_கு
    - 5_இன்
    - 6_அது
    - 7_கண்
  links:
  - sol.64
  - sol.65
  urai:
    iyaipu:
    - ezhu.113
    text: 'வேற்றுமையியலின் நுதலியது: ஏழு; விளியொடு எட்டு (64); பெயர்கள் — பெயர், ஐ, ஒடு, கு, இன், அது, கண், விளி (65); எழுவாய் "பெயர் தோன்று நிலையே" (66). கடாஅ (650): எழு. 113 உருபு ஆறு, இங்கு ஏழு — மாறா? — விடை: உருபு ஆறு; முதல் வேற்றுமைக்கு உருபு இல்லை, பெயரே (66); ஆகவே 6 + 1 = 7; விளியொடு 8. தன் நூலானே தீர்கிறது.'
    vagai: விதி
    maruthalai:
    - kadaa: எழு. 113 உருபு ஆறு, இங்கு ஏழு — மாறா?
      maattram: '— விடை: உருபு ஆறு; முதல் வேற்றுமைக்கு உருபு இல்லை, பெயரே (66); ஆகவே 6 + 1 = 7; விளியொடு 8. தன் நூலானே தீர்கிறது.'
      saanru: []
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
  - peyar: தான் குறியிடுதல்
    saanru: என மொழிப
- id: sol.64
  pindam: 1
  padalam: sol
  othu: 2
  sutra: 64
  moolam: |-
    விளி கொள்வதன்கண் விளியொடு எட்டே
  kaandigai:
    porul: 'விளி கொள்வதோடு சேர்த்தால் எட்டு. (63–64: ஏழும் விளியும் — நூலில் நேரடியாக.)'
    en:
      kooruvathu: 8
      enniyathu: 8
    ethu: 63 ஏழ் வேற்றுமை என்றது; விளி கொள்ளும் இடத்து விளியொடு எட்டாம்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: வேற்றுமை
    op: 7+1_விளி
    total: 8
  links:
  - sol.63
  - sol.65
  urai:
    iyaipu:
    - sol.63
    - sol.65
    - sol.120
    text: 'இயைபு (649): 65-இன் பட்டியலில் ''விளி'' எட்டாம்; 120 விளி இயற்கை. எண்: எட்டு (நூற்பா) = எட்டு (65-இன் பட்டியல்).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: எட்டே
- id: sol.65
  pindam: 1
  padalam: sol
  othu: 2
  sutra: 65
  moolam: |-
    அவைதாம்
    பெயர் ஐ ஒடு கு
    இன் அது கண் விளி என்னும் ஈற்ற
  kaandigai:
    porul: 'அவை: பெயர், ஐ, ஒடு, கு, இன், அது, கண், விளி — எட்டு ஈறுகள் (64-இன் எண்ணோடு ஒக்கும்; எண்ணிச் சரிபார்த்தது). மூன்றாம் வேற்றுமைக்கு நூல் தரும் பெயர் "ஒடு" (74) — நூலில் நேரடியாக.'
    en:
      kooruvathu: 8
      enniyathu: 8
    ethu: 63-64 வேற்றுமை எண்ணிக்கை சொன்னது; வடிவங்கள் எட்டு — பெயர், ஐ, ஒடு, கு, இன், அது, கண், விளி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: வேற்றுமை_உருபு
    count: 8
    items:
    - பெயர்
    - ஐ
    - ஒடு
    - கு
    - இன்
    - அது
    - கண்
    - விளி
  links:
  - sol.66
  - sol.72
  - sol.74
  - sol.76
  - sol.78
  - sol.80
  - sol.82
  urai:
    iyaipu:
    - sol.63
    - sol.64
    - ezhu.113
    - sol.120
    text: 'இயைபு (649): எழு. 113 ஆறு; 66 எழுவாய்; 120 விளி — 6 + 1 + 1 = 8. எண்: எட்டு (64) = எட்டு (பட்டியல்).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: அதிகார முறை
    saanru: அவைதாம்
- id: sol.66
  pindam: 1
  padalam: sol
  othu: 2
  sutra: 66
  moolam: |-
    அவற்றுள்
    எழுவாய் வேற்றுமை பெயர் தோன்று நிலையே
  kaandigai:
    porul: அவற்றுள் எழுவாய் வேற்றுமை பெயர் தோன்றும் நிலை (உருபில்லாத பெயரே).
    ethu: 65 எட்டு வடிவம் சொன்னது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: எழுவாய்_வேற்றுமை
    property: உருபில்லா_பெயர்
  links: []
  urai:
    iyaipu:
    - sol.63
    - sol.65
    - sol.67
    text: 'இயைபு (649): 63 ஏழ் (6 + 1) — இங்கே முதல் உருபிலி என்பது விளங்குகிறது. 67 பெயர்ப்பயனிலை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: அதிகார முறை
    saanru: அவற்றுள்
- id: sol.67
  pindam: 1
  padalam: sol
  othu: 2
  sutra: 67
  moolam: |-
    பொருண்மை சுட்டல் வியங்கொள வருதல்
    வினை நிலை உரைத்தல் வினாவிற்கு ஏற்றல்
    பண்பு கொள வருதல் பெயர் கொள வருதல் என்று
    அன்றி அனைத்தும் பெயர்ப் பயனிலையே
  kaandigai:
    porul: 'பொருண்மை சுட்டல், வியங்கொள வருதல், வினைநிலை உரைத்தல், வினாவுக்கு ஏற்றல், பண்பு கொள வருதல், பெயர் கொள வருதல் — ஆறும் பெயர்ப் பயனிலை (எண்ணியது: 6).'
    en:
      kooruvathu: 6
      enniyathu: 6
    ethu: 63-66 வேற்றுமை வடிவங்கள் சொன்னது; இது அதன் தொடர்ச்சி.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: enumeration
    class: பெயர்_பயனிலை
    count: 6
    items:
    - பொருண்மை_சுட்டல்
    - வியங்கொள_வருதல்
    - வினைநிலை_உரைத்தல்
    - வினாவிற்கு_ஏற்றல்
    - பண்பு_கொள_வருதல்
    - பெயர்_கொள_வருதல்
  links:
  - sol.68
  - sol.69
  urai:
    iyaipu:
    - sol.66
    - sol.68
    - sol.71
    text: 'இயைபு (649): 66 எழுவாய்; 68 பெயர்த் தொகை; 71 பெயர்-தொழில் வேறுபாடு. எண்: ஆறு (பட்டியல்); நூற்பா தொகை எண் கூறவில்லை. ''அன்றி அனைத்தும்'' — எவை என நூல் பெயரிடவில்லை — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'அன்றி அனைத்தும்' ஒருதலை அன்மை
- id: sol.68
  pindam: 1
  padalam: sol
  othu: 2
  sutra: 68
  moolam: |-
    பெயரின் ஆகிய தொகையுமார் உளவே
    அவ்வும் உரிய அப்பாலான
  kaandigai:
    porul: பெயரால் ஆகிய தொகையும் உள; அவையும் அப்பாலுக்கு உரியன.
    ethu: 67 பெயர்ப்பயனிலை சொன்னது; இது அதன் தொடர்ச்சி.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    class: பெயர்த்தொகை
    property: அப்பாலுக்கு_உரிய
  links: []
  urai:
    iyaipu:
    - sol.67
    - sol.412
    text: 'இயைபு (649): 412 ஆறு தொகை வகை. ''அவ்வும் உரிய அப்பாலான'' — எவை என நூல் விரிக்கவில்லை — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'அப்பாலான' ஒருதலை அன்மை
- id: sol.69
  pindam: 1
  padalam: sol
  othu: 2
  sutra: 69
  moolam: |-
    எவ் வயின் பெயரும் வெளிப்படத் தோன்றி
    அவ் இயல் நிலையல் செவ்விது என்ப
  kaandigai:
    porul: எவ்விடத்துப் பெயரும் வெளிப்படத் தோன்றி அவ்வியல்பில் நிற்றல் செவ்விது.
    ethu: 63-68 வேற்றுமை/பயனிலை/தொகை சொன்னது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: பெயர்
    property: வெளிப்பட_தோன்றல்
  links: []
  urai:
    iyaipu:
    - sol.66
    - sol.67
    - sol.70
    text: 'இயைபு (649): 66 எழுவாய்; 67 பயனிலை; 70 உருபுநிலை திரியாமை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: sol.70
  pindam: 1
  padalam: sol
  othu: 2
  sutra: 70
  moolam: |-
    கூறிய முறையின் உருபு நிலை திரியாது
    ஈறு பெயர்க்கு ஆகும் இயற்கைய என்ப
  kaandigai:
    porul: கூறிய முறையில் உருபு நிலை திரியாமல் ஈறு பெயருக்கு ஆகும் இயல்பின.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 69 வெளிப்பட நிலைத்தல் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: வேற்றுமை_உருபு
    property: நிலை_திரியா_ஈறு_ஆகும்
  links: []
  urai:
    iyaipu:
    - sol.69
    - sol.71
    text: 'இயைபு (649): 69 வெளிப்படை; 71 பெயர்நிலைக் கிளவி காலம் தோன்றாது.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: முறை பிறழாமை
    saanru: முறையின்
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: கூறிற்று என்றல்
    saanru: கூறிய
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: sol.71
  pindam: 1
  padalam: sol
  othu: 2
  sutra: 71
  moolam: |-
    பெயர்நிலைக் கிளவி காலம் தோன்றா
    தொழில் நிலை ஒட்டும் ஒன்று அலங்கடையே
  kaandigai:
    porul: பெயர்நிலைச் சொல் காலம் காட்டாது; ஒன்றைத் தவிர (அது இங்கே பெயரிடப்படவில்லை — ஒருதலை அன்மை) தொழில் நிலையோடு ஒட்டாது.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 70 உருபுநிலை இயற்கை என்றது; பெயர்நிலைக் கிளவி காலம் தோன்றாது தொழில்நிலை ஒட்டும்.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    class: பெயர்_நிலை_கிளவி
    ops:
    - காலம்_காட்டா
    - தொழில்_நிலை_ஒட்டா
    exception: not_named
  links: []
  urai:
    iyaipu:
    - sol.70
    - sol.72
    - sol.200
    text: 'இயைபு (649): 72 ஐ வேற்றுமை; 200 வினை வேற்றுமை கொள்ளாது.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக; காண்டிகை சுட்டிய ஐயம் ஒருதலை அன்மை
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: ஒன்று
- id: sol.72
  pindam: 1
  padalam: sol
  othu: 2
  sutra: 72
  moolam: |-
    இரண்டாகுவதே
    ஐ எனப் பெயரிய வேற்றுமைக் கிளவி
    எவ் வழி வரினும் வினையே வினைக்குறிப்பு
    அவ் இரு முதலின் தோன்றும் அதுவே
  kaandigai:
    porul: இரண்டாம் வேற்றுமை "ஐ"; எவ்விடத்து வரினும் வினை, வினைக்குறிப்பு ஆகிய இரண்டின் முதலிலும் தோன்றும்.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 63-71 வேற்றுமை-உருபு-பெயர் இயல்கள்; ஐ-உருபு (இரண்டாம்) வினையே வினைக்குறிப்பு — இரு முதல்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: வேற்றுமை_2
    urupu: ஐ
    contexts:
    - வினை
    - வினைக்குறிப்பு
