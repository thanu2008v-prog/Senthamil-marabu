- id: sol.83
  pindam: 1
  padalam: sol
  othu: 2
  sutra: 83
  moolam: |-
    கண் கால் புறம் அகம் உள் உழை கீழ் மேல்
    பின் சார் அயல் புடை தேவகை எனாஅ
    முன் இடை கடை தலை வலம் இடம் எனாஅ
    அன்ன பிறவும் அதன் பால என்மனார்
  kaandigai:
    porul: 'கண்-வேற்றுமை உருபுச் சொற்கள்: கண், கால், புறம், அகம், உள், உழை, கீழ், மேல்; பின், சார், அயல், புடை, தேவகை; முன், இடை, கடை, தலை, வலம், இடம் — பிறவும் (எண்ணியது: 19).'
    en:
