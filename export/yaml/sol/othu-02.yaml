    - sol.81
    text: 'இயைபு (649): 79 இன்; 81 அது-வகை. நூற்பாவின் ''இதனது'' விதிச் சொல்லே; வேறு எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.81
  pindam: 1
  padalam: sol
  othu: 2
  sutra: 81
  moolam: |-
    இயற்கையின் உடைமையின் முறைமையின் கிழமையின்
    செயற்கையின் முதுமையின் வினையின் என்றா
    கருவியின் துணையின் கலத்தின் முதலின்
    ஒருவழி உறுப்பின் குழுவின் என்றா
    தெரிந்து மொழிச் செய்தியின் நிலையின் வாழ்ச்சியின்
    திரிந்து வேறுபடூஉம் பிறவும் அன்ன
    கூறிய மருங்கின் தோன்றும் கிளவி
    ஆறன் பால என்மனார் புலவர்
  kaandigai:
    porul: 'அது-வேற்றுமைப் பொருள்கள்: இயற்கை, உடைமை, முறைமை, கிழமை, செயற்கை, முதுமை, வினை; கருவி, துணை, கலம், முதல், ஒருவழி உறுப்பு, குழு; தெரிந்துமொழிச் செய்தி, நிலை, வாழ்ச்சி — பிறவும் (எண்ணியது: 16 அல்லது 17, "ஒருவழி உறுப்பு" ஒன்றா இரண்டா என்பதைப் பொறுத்து — ஒருதலை அன்மை).'
