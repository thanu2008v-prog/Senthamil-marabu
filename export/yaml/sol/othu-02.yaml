    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.75
  pindam: 1
  padalam: sol
  othu: 2
  sutra: 75
  moolam: |-
    அதனின் இயறல் அதன் தகு கிளவி
    அதன் வினைப்படுதல் அதனின் ஆதல்
    அதனின் கோடல் அதனொடு மயங்கல்
    அதனொடு இயைந்த ஒரு வினைக் கிளவி
    அதனொடு இயைந்த வேறு வினைக் கிளவி
    அதனொடு இயைந்த ஒப்பு அல் ஒப்பு உரை
    இன் ஆன் ஏது ஈங்கு என வரூஉம்
    அன்ன பிறவும் அதன் பால என்மனார்
  kaandigai:
    porul: 'ஒடு-வேற்றுமைப் பொருள்கள்: அதனின் இயறல், அதன் தகு கிளவி, அதன் வினைப்படுதல், அதனின் ஆதல், அதனின் கோடல், அதனொடு மயங்கல், அதனொடு இயைந்த ஒருவினை, வேறுவினை, ஒப்பல் ஒப்புரை; "இன், ஆன், ஏது, ஈங்கு" என வருவனவும் — பிறவும். "ஆன்" இங்கே பொருள் உருபுகளுள் ஒன்றாக மட்டுமே வருகிறது — நூலில் நேரடியாக.'
    en:
      kooruvathu: 13
      enniyathu: 13
    ethu: 74 ஒடு-உருபு என்றது; வகை — இயறல், தகு-கிளவி, வினைப்படுதல், ஆதல், கோடல், மயங்கல், ஒரு/வேறு வினைக்கிளவி, ஒப்பு, இன்/ஆன்/ஏது/ஈங்கு — அன்ன பிறவும்.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: enumeration
    class: ஒடு_பொருள்
    count: 13
    items:
    - அதனின்_இயறல்
    - அதன்_தகு_கிளவி
    - அதன்_வினைப்படுதல்
    - அதனின்_ஆதல்
    - அதனின்_கோடல்
    - அதனொடு_மயங்கல்
    - ஒரு_வினை
    - வேறு_வினை
    - ஒப்பல்_ஒப்புரை
    - இன்
    - ஆன்
    - ஏது
    - ஈங்கு
    closed: false
  links:
