    text: 'இயைபு (649): ''எழுத்தின் இயலா'' (எழு. 40) — எழுத்து + இன் → எழுத்தின். 79 இன்-வகை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: sol.79
  pindam: 1
  padalam: sol
  othu: 2
  sutra: 79
  moolam: |-
    வண்ணம் வடிவே அளவே சுவையே
    தண்மை வெம்மை அச்சம் என்றா
    நன்மை தீமை சிறுமை பெருமை
    வன்மை மென்மை கடுமை என்றா
    முதுமை இளமை சிறத்தல் இழித்தல்
