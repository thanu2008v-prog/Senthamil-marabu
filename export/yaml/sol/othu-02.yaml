    - sol.78
    text: 'இயைபு (649): 76 கு; 78 இன். ''பிறவும்'' — எவை என நூல் பெயரிடவில்லை — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'பிறவும்' ஒருதலை அன்மை
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்மனார்
- id: sol.78
  pindam: 1
  padalam: sol
  othu: 2
  sutra: 78
  moolam: |-
    ஐந்தாகுவதே
    இன் எனப் பெயரிய வேற்றுமைக் கிளவி
    இதனின் இற்று இது என்னும் அதுவே
  kaandigai:
    porul: ஐந்தாம் வேற்றுமை "இன்"; "இதனின் இற்று இது" (ஒப்பு, எல்லை) என்னும் பொருளது.
    ethu: 76-77 கு-வகை முடிந்தது; இன்-உருபு (ஐந்தாம்) — 'இதனின் இற்று, இது' என்னும் அதுவே.
    eduthukkaattu:
    - text: எழுத்தின் இயலா
      from: ezhu.40
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: வேற்றுமை_5
    urupu: இன்
    contexts:
    - ஒப்பு
