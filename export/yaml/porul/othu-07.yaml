# இக்கோப்பு data_v2-இலிருந்து உருவானது. 'moolam' (சூத்திரம்) திருத்தக் கூடாது (பொருள். 652).
- id: porul.272
  pindam: 1
  padalam: porul
  othu: 7
  sutra: 272
  moolam: |-
    வினை பயன் மெய் உரு என்ற நான்கே
    வகை பெற வந்த உவமத் தோற்றம்
  kaandigai:
    porul: 'உவமம் தோன்றும் வகை நான்கு: வினை, பயன், மெய், உரு.'
    en:
      kooruvathu: 4
      enniyathu: 4
    ethu: உவமம் பொருளோடு ஒப்பது; ஒப்பு எதனால் என்பதை நான்காக வகுக்கிறது. அவை விரவியும் வரும் — "விரவியும் வரூஉம் மரபின என்ப" (பொருள். 273); உவமம் உயர்ந்ததன் மேலது — "உயர்ந்ததன் மேற்றே உள்ளும் காலை" (பொருள். 274).
    eduthukkaattu:
    - text: விரவியும் வரூஉம் மரபின என்ப
      from: porul.273
    - text: உயர்ந்ததன் மேற்றே உள்ளும் காலை
      from: porul.274
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: உவம_தோற்றம்
    count: 4
  links: []
  urai:
    iyaipu:
    - porul.273
    - porul.274
    text: 'இயைபு (649): பொருள். 273, 274 · உவமவியலின் நுதலியது: உவமம் தோன்றும் வகை நான்கு — வினை, பயன், மெய், உரு; 273 இவை விரவியும் வரும். ஓத்து முழுதும் இந்நான்கின் விரி; புறனடை 309.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: நான்கே
- id: porul.273
  pindam: 1
  padalam: porul
  othu: 7
  sutra: 273
  moolam: |-
    விரவியும் வரூஉம் மரபின என்ப
  kaandigai:
    porul: (அவை) கலந்தும் வரும் மரபின என்பர்.
    ethu: 272 நான்கு என்றது; விரவியும் (கலந்தும்) மரபின — பல வகை கலந்து வரும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: உவம_கலவை
  links: []
  urai:
    iyaipu:
    - porul.272
    - porul.282
    text: 'இயைபு (649): 272 வகை; 282 உவம உருபுகள் — இவற்றின் கலப்பு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: porul.274
  pindam: 1
  padalam: porul
  othu: 7
  sutra: 274
  moolam: |-
    உயர்ந்ததன் மேற்றே உள்ளும் காலை
  kaandigai:
    porul: ஆராயுமிடத்து (உவமம்) உயர்ந்ததன் மேலது — உவமம் பொருளினும் உயர்ந்ததாக இருக்கும்.
    ethu: 272–273 என்றது; உவமை எப்பொருளை உயர்த்திக் காட்டுகிறது என உள்ளங்காலை உயர்ந்ததன் மேற்றே (உயர்ந்ததன் மேல்).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: உவம_உயர்வு
  links: []
  urai:
    iyaipu:
    - porul.273
    - porul.275
    text: 'இயைபு (649): 273 விரவியும்; 275 4 பண்பு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.275
  pindam: 1
  padalam: porul
  othu: 7
  sutra: 275
  moolam: |-
    சிறப்பே நலனே காதல் வலியொடு
    அந் நால் பண்பும் நிலைக்களம் என்ப
  kaandigai:
    porul: சிறப்பு, நலன், காதல், வலி என்ற நான்கு பண்பும் (உவமத்தின்) நிலைக்களம் என்பர்.
    en:
      kooruvathu: 4
      enniyathu: 4
    ethu: 274 என்றது; உவமையின் அடிப்படை 4 — சிறப்பு, நலன், காதல், வலி (அந்நால் பண்பும் நிலைக்களம்).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: உவம_நிலைக்களம்
    count: 4
  links: []
  urai:
    iyaipu:
    - porul.274
    - porul.276
    - porul.289
    text: 'இயைபு (649): 274 உயர்ந்தது; 276 5; 289 8. எண்: 4 (நூற்பா) = 4 (சிறப்பு, நலன், காதல், வலி).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: porul.276
  pindam: 1
  padalam: porul
  othu: 7
  sutra: 276
  moolam: |-
    கிழக்கிடு பொருளொடு ஐந்தும் ஆகும்
  kaandigai:
    porul: கிழக்கிடு பொருளோடு (தாழ்ந்ததைக் கொண்டு) ஐந்தும் ஆகும். "கிழக்கிடு" என்பதன் பொருளை நூல் கூறவில்லை.
    en:
      kooruvathu: 5
      enniyathu: 5
    ethu: 275 4 பண்பு என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: நிலைக்களம்_5
    count: 5
  links: []
  urai:
    iyaipu:
    - porul.275
    - porul.277
    text: 'இயைபு (649): 275 4; 277 2 (முதல், சினை). எண்: 5 (நூற்பா ''ஐந்தும்'') = 4 + 1 (கிழக்கிடு). ''கிழக்கிடு'' — இயற்கை நிலை/தானே வரும் நிலை என வாசிக்கலாம்; சொற்பொருள் வாசிப்பு ஐயம்.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'கிழக்கிடு' எது என்பது வாசிப்பு ஐயம்
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: ஐந்தும்
- id: porul.277
  pindam: 1
  padalam: porul
  othu: 7
  sutra: 277
  moolam: |-
    முதலும் சினையும் என்று ஆயிரு பொருட்கும்
    நுதலிய மரபின் உரியவை உரிய
  kaandigai:
    porul: முதல் (முழுப்பொருள்), சினை (உறுப்பு) என்ற இருவகைப் பொருளுக்கும் கருதிய மரபின்படி உரியவை உரியன.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 276 5 என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: உவம_முதல்_சினை
    count: 2
  links: []
  urai:
    iyaipu:
    - porul.276
    - porul.278
    text: 'இயைபு (649): 276 5; 278 சுட்டிக் கூறாத உவமம். எண்: 2 (நூற்பா) = 2 (முதல், சினை).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.278
  pindam: 1
  padalam: porul
  othu: 7
  sutra: 278
  moolam: |-
    சுட்டிக் கூறா உவமம் ஆயின்
    பொருள் எதிர் புணர்த்துப் புணர்த்தன கொளலே
  kaandigai:
    porul: சுட்டிக் கூறாத உவமமானால், பொருளுக்கு எதிர் புணர்த்து, புணர்த்தவற்றைக் கொள்க.
    ethu: 277 முதல்/சினை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: சுட்டா_உவமம்
  links: []
  urai:
    iyaipu:
    - porul.277
    - porul.279
    - porul.305
    text: 'இயைபு (649): 277 முதல்/சினை; 279 ஒத்தல் வேண்டும்; 305 வேறுபட வந்த உவமம். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.279
  pindam: 1
  padalam: porul
  othu: 7
  sutra: 279
  moolam: |-
    உவமமும் பொருளும் ஒத்தல் வேண்டும்
  kaandigai:
    porul: உவமமும் பொருளும் ஒத்திருக்க வேண்டும் (ஆணை கூறல்).
    ethu: 278 என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: உவம_ஒத்தல்
  links: []
  urai:
    iyaipu:
    - porul.278
    - porul.280
    - porul.308
    text: 'இயைபு (649): 278 புணர்த்தல்; 280 பொருளே உவமை; 308 தடுமாறு உவமம். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஆணை கூறல்
    saanru: வேண்டும்
- id: porul.280
  pindam: 1
  padalam: porul
  othu: 7
  sutra: 280
  moolam: |-
    பொருளே உவமம் செய்தனர் மொழியினும்
    மருள் அறு சிறப்பின் அஃது உவமம் ஆகும்
  kaandigai:
    porul: பொருளையே உவமமாகச் செய்து சொன்னாலும், மயக்கமற்ற சிறப்பால் அதுவும் உவமம் ஆகும்.
    ethu: 279 ஒத்தல் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: பொருள்_உவமம்
  links: []
  urai:
    iyaipu:
    - porul.279
    - porul.281
    - porul.295
    text: 'இயைபு (649): 279 ஒத்தல்; 281 பெருமை/சிறுமை; 295 உவமப்போலி. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.281
  pindam: 1
  padalam: porul
  othu: 7
  sutra: 281
  moolam: |-
    பெருமையும் சிறுமையும் சிறப்பின் தீராக்
    குறிப்பின் வரூஉம் நெறிப்பாடு உடைய
  kaandigai:
    porul: பெருமையும் சிறுமையும் சிறப்பின் நீங்காத குறிப்பால் வரும் நெறியுடையன.
    ethu: 280 பொருளே உவமை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: பெருமை_சிறுமை
  links: []
  urai:
    iyaipu:
    - porul.280
    - porul.282
    - porul.290
    text: 'இயைபு (649): 280 பொருளே; 282 36 உருபு; 290 மெய்ப்பாட்டு 8. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.282
  pindam: 1
  padalam: porul
  othu: 7
  sutra: 282
  moolam: |-
    அவைதாம்
    அன்ன ஏய்ப்ப உறழ ஒப்ப
    என்ன மான என்றவை எனாஅ
    ஒன்ற ஒடுங்க ஒட்ட ஆங்க
    என்ற வியப்ப என்றவை எனாஅ
    எள்ள விழைய விறப்ப நிகர்ப்ப
    கள்ள கடுப்ப ஆங்கவை எனாஅ
    காய்ப்ப மதிப்ப தகைய மருள
    மாற்ற மறுப்ப ஆங்கவை எனாஅ
    புல்ல பொருவ பொற்ப போல
    வெல்ல வீழ ஆங்கவை எனாஅ
    நாட நளிய நடுங்க நந்த
    ஓட புரைய என்றவை எனாஅ
    ஆறு ஆறு அவையும் அன்ன பிறவும்
    கூறும் காலைப் பல் குறிப்பினவே
  kaandigai:
    porul: 'உவம உருபுகள்: அன்ன, ஏய்ப்ப, உறழ, ஒப்ப, என்ன, மான … ஓட, புரைய — "ஆறு ஆறு" (முப்பத்தாறு), அன்ன பிறவும்; பல குறிப்புடையன. நூற்பா தானே "ஆறு ஆறு" எனக் கூறுகிறது.'
    en:
      kooruvathu: 36
      enniyathu: 36
    ethu: 281 என்றது; உவம உருபுகள் 36 — அன்ன, ஏய்ப்ப, உறழ, ஒப்ப, என்ன, மான, ஒன்ற, ஒடுங்க, ஒட்ட, ஆங்க, என்ற, வியப்ப, எள்ள, விழைய, விறப்ப, நிகர்ப்ப, கள்ள, கடுப்ப, காய்ப்ப, மதிப்ப, தகைய, மருள, மாற்ற, மறுப்ப, புல்ல, பொருவ, பொற்ப, போல, வெல்ல, வீழ, நாட, நளிய, நடுங்க, நந்த, ஓட, புரைய.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: enumeration
    class: உவம_உருபு
    count: 36
  links: []
  urai:
    iyaipu:
    - porul.281
    - porul.283
    - porul.284
    - porul.285
    - porul.286
    - porul.287
    text: 'இயைபு (649): 281 பொது; 283 வினைப்பால் 8, 285 பயனிலை 8, 286 மெய்ப்பால் 8, 287 உருவின் 8 — இவை 282-இன் 36 உருபுகளின் வகை. எண்: 36 (நூற்பா ''ஆறு ஆறு'' = 6×6) = 36 (பட்டியல்). ''பிறவும்'' — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'அன்ன பிறவும்' ஒருதலை அன்மை
  utthi:
  - peyar: அதிகார முறை
    saanru: அவைதாம்
  - peyar: தொகுத்துக் கூறல்
    saanru: ஆறு
  - peyar: வந்தது கொண்டு வாராதது உணர்த்தல்
    saanru: பிறவும்
  - peyar: ஒப்பக் கூறல்
    saanru: போல
  - peyar: இறந்தது காத்தல்
    saanru: ஆங்கவை
  - peyar: ஒருதலை அன்மை
    saanru: உறழ
- id: porul.283
  pindam: 1
  padalam: porul
  othu: 7
  sutra: 283
  moolam: |-
    அன்ன ஆங்க மான விறப்ப
    என்ன உறழ தகைய நோக்கொடு
    கண்ணிய எட்டும் வினைப்பால் உவமம்
  kaandigai:
    porul: 'வினை உவமத்தின் எட்டு உருபு: அன்ன, ஆங்க, மான, விறப்ப, என்ன, உறழ, தகைய, நோக்க. இவற்றுள் "நோக்க" 282-இன் பட்டியலில் இல்லை.'
    en:
      kooruvathu: 8
      enniyathu: 8
    ethu: 282 உருபுகள் என்றது; 'அன்ன, ஆங்க, மான, விறப்ப, என்ன, உறழ, தகைய, நோக்கு' — எட்டும் வினைப்பால் உவமம்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: வினை_உவம_உருபு
    count: 8
  links: []
  urai:
    iyaipu:
    - porul.282
    - porul.284
    - porul.285
    text: 'இயைபு (649): 282 உருபுகள்; 284 ''அன்ன'' பொது; 285 பயனிலை. எண்: 8 (நூற்பா ''எட்டும்'') = 8 (பட்டியல்).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: எட்டும்
  - peyar: ஒருதலை அன்மை
    saanru: உறழ
- id: porul.284
  pindam: 1
  padalam: porul
  othu: 7
  sutra: 284
  moolam: |-
    அன்ன என் கிளவி பிறவொடும் சிவணும்
  kaandigai:
    porul: '"அன்ன" என்ற உருபு பிற வகையோடும் பொருந்தும்.'
    ethu: 283 வினைப்பால் 8 என்றது; 'அன்ன' என்னும் கிளவி பிறவொடும் சிவணும் — 'அன்ன' எல்லா வகைக்கும் பொது.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: அன்ன_பல்வகை
  links: []
  urai:
    iyaipu:
    - porul.283
    - porul.285
    text: 'இயைபு (649): 283 வினைப்பால்; 285 பயனிலை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.285
  pindam: 1
  padalam: porul
  othu: 7
  sutra: 285
  moolam: |-
    எள்ள விழைய புல்ல பொருவ
    கள்ள மதிப்ப வெல்ல வீழ
    என்று ஆங்கு எட்டே பயனிலை உவமம்
  kaandigai:
    porul: 'பயன் உவமத்தின் எட்டு உருபு: எள்ள, விழைய, புல்ல, பொருவ, கள்ள, மதிப்ப, வெல்ல, வீழ.'
    en:
      kooruvathu: 8
      enniyathu: 8
    ethu: 284 'அன்ன' என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: பயன்_உவம_உருபு
    count: 8
  links: []
  urai:
    iyaipu:
    - porul.284
    - porul.286
    text: 'இயைபு (649): 284 ''அன்ன''; 286 மெய்ப்பால். எண்: 8 (நூற்பா ''எட்டே'') = 8.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: எட்டே
- id: porul.286
  pindam: 1
  padalam: porul
  othu: 7
  sutra: 286
  moolam: |-
    கடுப்ப ஏய்ப்ப மருள புரைய
    ஒட்ட ஒடுங்க ஓட நிகர்ப்ப என்று
    அப் பால் எட்டே மெய்ப்பால் உவமம்
  kaandigai:
    porul: 'மெய் உவமத்தின் எட்டு உருபு: கடுப்ப, ஏய்ப்ப, மருள, புரைய, ஒட்ட, ஒடுங்க, ஓட, நிகர்ப்ப.'
    en:
      kooruvathu: 8
      enniyathu: 8
    ethu: 285 பயனிலை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: மெய்ப்பால்_உவம_உருபு
    count: 8
  links: []
  urai:
    iyaipu:
    - porul.285
    - porul.287
    text: 'இயைபு (649): 285 பயனிலை; 287 உருவின். எண்: 8 (நூற்பா ''எட்டே'') = 8.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: எட்டே
- id: porul.287
  pindam: 1
  padalam: porul
  othu: 7
  sutra: 287
  moolam: |-
    போல மறுப்ப ஒப்ப காய்த்த
    நேர வியப்ப நளிய நந்த என்று
    ஒத்து வரு கிளவி உருவின் உவமம்
  kaandigai:
    porul: 'உரு உவமத்தின் உருபுகள்: போல, மறுப்ப, ஒப்ப, காய்த்த, நேர, வியப்ப, நளிய, நந்த. இவற்றுள் "காய்த்த", "நேர" 282-இன் பட்டியலில் இல்லை (பாட வேறுபாடா என்பது தீர்க்கப்படவில்லை).'
    ethu: 286 மெய்ப்பால் என்றது; 'போல, மறுப்ப, ஒப்ப, காய்த்த, நேர, வியப்ப, நளிய, நந்த' — எட்டும் ஒத்துவரும் கிளவி உருவின் உவமம்.
    eduthukkaattu:
    - text: வேம்பும் கடுவும் போல
      from: porul.417
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: உரு_உவம_உருபு
    count: 8
  links: []
  urai:
    iyaipu:
    - porul.286
    - porul.288
    text: 'இயைபு (649): 286 மெய்ப்பால்; 288 தம்தம் மரபு. எண்: நூற்பா எண் கூறவில்லை; பட்டியல் எட்டு. எடுத்துக்காட்டு: ''வேம்பும் கடுவும் போல'' (பொருள். 417) — ''போல'' உருபு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒப்பக் கூறல்
    saanru: போல
- id: porul.288
  pindam: 1
  padalam: porul
  othu: 7
  sutra: 288
  moolam: |-
    தம்தம் மரபின் தோன்றுமன் பொருளே
  kaandigai:
    porul: பொருள் தத்தம் மரபால் தோன்றும்.
    ethu: 287 உருவின் உவமம் என்றது; தம்தம் மரபின் (ஒவ்வொரு வகையின் இயல்பின்) பொருள் தோன்றும்.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    class: உவம_மரபு
  links: []
  urai:
    iyaipu:
    - porul.287
    - porul.289
    text: 'இயைபு (649): 287 உருவின்; 289 8. ''தோன்றுமன் பொருளே'' — எவ்வாறு என நூல் விரிக்கவில்லை — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'தோன்றுமன்' — பொருள் விளக்கம் எவை என ஒருதலை அன்மை
- id: porul.289
  pindam: 1
  padalam: porul
  othu: 7
  sutra: 289
  moolam: |-
    நால் இரண்டு ஆகும் பாலுமார் உண்டே
  kaandigai:
    porul: '"நால் இரண்டு" (எட்டு) ஆகும் பகுப்பும் உண்டு. அது எட்டு மெய்ப்பாடா என நூற்பா பெயரிடவில்லை (ஒருதலை அன்மை; காண்க 290).'
    ethu: 288 என்றது; உவமையின் நால் இரண்டு (8) — பாலுமார் உண்டே (மேலும் பிரிவுகள் உள).
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    class: நால்_இரண்டு_உவம
    count: 8
    items_not_named: true
  links: []
  urai:
    iyaipu:
    - porul.288
    - porul.290
    text: 'இயைபு (649): 288 தம்தம் மரபு; 290 மெய்ப்பாடு 8. எண்: 8 (நூற்பா ''நால் இரண்டு'' = 4×2). ''பாலுமார் உண்டே'' — கூடுதல் வகைகள் உள — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'பாலுமார் உண்டே' ஒருதலை அன்மை
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: நால் இரண்டு
- id: porul.290
  pindam: 1
  padalam: porul
  othu: 7
  sutra: 290
  moolam: |-
    பெருமையும் சிறுமையும் மெய்ப்பாடு எட்டன்
    வழி மருங்கு அறியத் தோன்றும் என்ப
  kaandigai:
    porul: 'பெருமையும் சிறுமையும் எட்டு மெய்ப்பாட்டின் வழியில் அறியத் தோன்றும் என்பர். மெய்ப்பாடு: பொருள். 247.'
    ethu: 289 8 என்றது; பெருமை/சிறுமை மெய்ப்பாடு எட்டன் வழி மருங்கு அறியத் தோன்றும் — உவமையின் பெருமை/சிறுமை 8 மெய்ப்பாட்டின் வழியில்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: மெய்ப்பாட்டு_வழி
  links: []
  urai:
    iyaipu:
    - porul.247
    - porul.289
    - porul.291
    text: 'இயைபு (649): 247 8 மெய்ப்பாடு; 289 8 உவம வகை; 291 உவமப் பொருள். எண்: 8 (நூற்பா) = 8 (247-இன் மெய்ப்பாடு).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: porul.291
  pindam: 1
  padalam: porul
  othu: 7
  sutra: 291
  moolam: |-
    உவமப் பொருளின் உற்றது உணரும்
    தெளி மருங்கு உளவே திறத்து இயலான
  kaandigai:
    porul: உவமப் பொருளில் உற்றதை உணரும் தெளிந்த வழிகள் உள — திறத்தின் இயல்பால்.
    ethu: 290 என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: உவம_உணர்வு
  links: []
  urai:
    iyaipu:
    - porul.290
    - porul.292
    text: 'இயைபு (649): 290 பெருமை/சிறுமை; 292 வழக்கு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.292
  pindam: 1
  padalam: porul
  othu: 7
  sutra: 292
  moolam: |-
    உவமப் பொருளை உணரும் காலை
    மரீஇய மரபின் வழக்கொடு வருமே
  kaandigai:
    porul: உவமப் பொருளை உணரும்போது பழகிய மரபின் வழக்கோடு வரும்.
    ethu: 291 உற்றது உணர்தல் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: உவம_வழக்கு
  links: []
  urai:
    iyaipu:
    - porul.291
    - porul.293
    text: 'இயைபு (649): 291 தெளிவு; 293 இரட்டைக்கிளவி.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.293
  pindam: 1
  padalam: porul
  othu: 7
  sutra: 293
  moolam: |-
    இரட்டைக்கிளவி இரட்டை வழித்தே
  kaandigai:
    porul: இரட்டைக் கிளவி (உவமம்) இரட்டையின் வழியது.
    ethu: 292 வழக்கு என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: இரட்டை_உவமம்
  links: []
  urai:
    iyaipu:
    - porul.292
    - porul.294
    - sol.48
    text: 'இயைபு (649): 292 வழக்கு; 294 பிறிதொடு படாது; சொல். 48 இரட்டைக்கிளவி.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.294
  pindam: 1
  padalam: porul
  othu: 7
  sutra: 294
  moolam: |-
    பிறிதொடு படாது பிறப்பொடு நோக்கி
    முன்னை மரபின் கூறும் காலை
    துணிவொடு வரூஉம் துணிவினோர் கொளினே
  kaandigai:
    porul: பிறிதொன்றோடு படாமல் பிறப்பை நோக்கி முன்னை மரபில் கூறும்போது, துணிவுடையோர் கொண்டால் துணிவோடு வரும்.
    ethu: 293 இரட்டை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: பிறப்பு_உவமம்
  links: []
  urai:
    iyaipu:
    - porul.293
    - porul.295
    text: 'இயைபு (649): 293 இரட்டை; 295 உவமப்போலி.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.295
  pindam: 1
  padalam: porul
  othu: 7
  sutra: 295
  moolam: |-
    உவமப் போலி ஐந்து என மொழிப
  kaandigai:
    porul: உவமப் போலி ஐந்து என்பர்.
    en:
      kooruvathu: 5
      enniyathu: 5
    ethu: 294 என்றது; உவமப் போலி ஐந்து — உவமம் போலத் தோன்றி உவமையாகாத ஐந்து.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: உவம_போலி
    count: 5
  links: []
  urai:
    iyaipu:
    - porul.294
    - porul.296
    - porul.280
    text: 'இயைபு (649): 294 துணிவு; 296 5 வகை. எண்: 5 (நூற்பா ''ஐந்து'') = 5.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: ஐந்து
  - peyar: ஒப்பக் கூறல்
    saanru: போலி
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
  - peyar: தான் குறியிடுதல்
    saanru: என மொழிப
- id: porul.296
  pindam: 1
  padalam: porul
  othu: 7
  sutra: 296
  moolam: |-
    தவல் அருஞ் சிறப்பின் அத் தன்மை நாடின்
    வினையினும் பயத்தினும் உறுப்பினும் உருவினும்
    பிறப்பினும் வரூஉம் திறத்த என்ப
  kaandigai:
    porul: அதன் தன்மையை ஆராய்ந்தால், வினை, பயன், உறுப்பு, உரு, பிறப்பு ஆகியவற்றால் வரும் திறத்தன (ஐந்து) என்பர்.
    en:
      kooruvathu: 5
      enniyathu: 5
    ethu: 295 5 என்றது; உவமப்போலியின் 5 வகை — வினை, பயன், உறுப்பு, உரு, பிறப்பு.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: உவம_போலி_திறம்
    count: 5
  links: []
  urai:
    iyaipu:
    - porul.295
    - porul.297
    text: 'இயைபு (649): 295 உவமப்போலி; 297 கிழவி சொல். எண்: ஐந்து (295 ''உவமப் போலி ஐந்து'') = ஐந்து (பட்டியல்: வினை, பயன், உறுப்பு, உரு, பிறப்பு).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: porul.297
  pindam: 1
  padalam: porul
  othu: 7
  sutra: 297
  moolam: |-
    கிழவி சொல்லின் அவள் அறி கிளவி
  kaandigai:
    porul: கிழவி சொல்லின் (உவமம்) அவள் அறிந்த பொருளின் கிளவி.
    ethu: 296 உவமப்போலி என்றது; இனி உவமை பயன்படுத்தும் இடம். கிழவி சொல்லின் (தலைவி கூற்றில்) — அவள் அறி கிளவி (அவள் அறிவுக்கு ஏற்ற கிளவி).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: கிழவி_உவமம்
  links: []
  urai:
    iyaipu:
    - porul.296
    - porul.298
    - porul.300
    text: 'இயைபு (649): 296 உவமப்போலி; 298 தோழி; 300 ஏனோர்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.298
  pindam: 1
  padalam: porul
  othu: 7
  sutra: 298
  moolam: |-
    தோழிக்கு ஆயின் நிலம் பெயர்ந்து உரையாது
  kaandigai:
    porul: தோழிக்கு ஆயின் நிலம் பெயர்ந்து (பிற நிலத்துப் பொருளால்) உரையாது.
    ethu: 297 கிழவி என்றது; தோழிக்கு ஆயின் நிலம்பெயர்ந்து உரையாது (தோழி கூற்றில் நிலம் மாற்றிக் கூறாது).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: தோழி_நிலம்
  links: []
  urai:
    iyaipu:
    - porul.297
    - porul.299
    - porul.304
    text: 'இயைபு (649): 297 கிழவி; 299 கிழவோன்; 304 தோழி/செவிலி. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.299
  pindam: 1
  padalam: porul
  othu: 7
  sutra: 299
  moolam: |-
    கிழவோற்கு ஆயின் உரனொடு கிளக்கும்
  kaandigai:
    porul: கிழவோற்கு ஆயின் உரனோடு கூறும்.
    ethu: 298 தோழி என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: கிழவோன்_உரன்
  links: []
  urai:
    iyaipu:
    - porul.298
    - porul.300
    text: 'இயைபு (649): 298 தோழி; 300 ஏனோர்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.300
  pindam: 1
  padalam: porul
  othu: 7
  sutra: 300
  moolam: |-
    ஏனோர்க்கு எல்லாம் இடம் வரைவு இன்றே
  kaandigai:
    porul: பிறர்க்கு எல்லாம் இட வரையறை இல்லை.
    ethu: 299 கிழவோன் என்றது; இது அதன் தொடர்ச்சி.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    class: ஏனோர்_வரையிலை
  links: []
  urai:
    iyaipu:
    - porul.299
    - porul.301
    - porul.303
    text: 'இயைபு (649): 299 கிழவோன்; 301 இனிது/துனி; 303 கிழவோன் இடம். ''வரைவு இன்றே'' — இசைவு (வரையறை இன்மை).'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'வரைவு இன்றே' ஒருதலை அன்மை
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: வரைவு இன்றே
- id: porul.301
  pindam: 1
  padalam: porul
  othu: 7
  sutra: 301
  moolam: |-
    இனிது உறு கிளவியும் துனி உறு கிளவியும்
    உவம மருங்கின் தோன்றும் என்ப
  kaandigai:
    porul: இனிமை உறும் கிளவியும் துனி உறும் கிளவியும் உவமத்தில் தோன்றும் என்பர்.
    ethu: 300 வரைவு என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: இனிது_துனி
  links: []
  urai:
    iyaipu:
    - porul.300
    - porul.302
    text: 'இயைபு (649): 300 ஏனோர்; 302 கிழவோட்கு. எண்: 2 (இனிது, துனி).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: porul.302
  pindam: 1
  padalam: porul
  othu: 7
  sutra: 302
  moolam: |-
    கிழவோட்கு உவமம் ஈர் இடத்து உரித்தே
  kaandigai:
    porul: கிழவோட்கு உவமம் இரண்டு இடத்து உரியது. அவ்விரண்டு எவை என்பது இந்நூற்பாவில் பெயரிடப்படவில்லை; அண்மையிலுள்ள 301 உவமம் தோன்றும் இரண்டு கிளவிகளைக் கூறுகிறது — "இனிது உறு கிளவியும் துனி உறு கிளவியும்". ஆகவே ஈரிடம் = இனிதுறு கிளவி, துனியுறு கிளவி எனக் கொள்ளலாம்; 303 கிழவோனுக்கு "இடம் வரைவு இன்றே" என்பது இவ்வெதிர்நிலையை உறுதிப்படுத்துகிறது (ஆயினும் "ஈரிடம்" எவை என நூற்பா பெயரிடவில்லை — ஒருதலை அன்மை).
    ethu: 301 இனிது/துனி என்றது; கிழவோட்கு உவமம் ஈர் இடத்து உரித்தே.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: enumeration
    class: கிழவோன்_உவம_இடம்
    count: 2
    items_not_named: true
  links: []
  urai:
    iyaipu:
    - porul.301
    - porul.303
    - porul.300
    text: 'இயைபு (649): 301 இனிது/துனி; 303 வரைவில்மை; 300 ஏனோர். எண்: 2 (நூற்பா ''ஈர்''). ''ஈர் இடம்'' — எவை இரண்டு என நூல் இங்கே விரிக்கவில்லை — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'ஈர் இடம்' எவை என ஒருதலை அன்மை
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: உரித்தே
- id: porul.303
  pindam: 1
  padalam: porul
  othu: 7
  sutra: 303
  moolam: |-
    கிழவோற்கு ஆயின் இடம் வரைவு இன்றே
  kaandigai:
    porul: கிழவோற்கு ஆயின் இட வரையறை இல்லை.
    ethu: 302 ஈர் இடம் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: கிழவோன்_வரையிலை
  links: []
  urai:
    iyaipu:
    - porul.302
    - porul.304
    text: 'இயைபு (649): 302 ஈர் இடம்; 304 தோழி/செவிலி.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'வரைவு இன்றே' — இசைவு (வரையறை இன்மை)
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: வரைவு இன்றே
- id: porul.304
  pindam: 1
  padalam: porul
  othu: 7
  sutra: 304
  moolam: |-
    தோழியும் செவிலியும் பொருந்துவழி நோக்கிக்
    கூறுதற்கு உரியர் கொள் வழியான
  kaandigai:
    porul: தோழியும் செவிலியும் பொருந்தும் இடம் நோக்கிக் கூறுதற்கு உரியர்.
    ethu: 303 வரைவில்மை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: தோழி_செவிலி
  links: []
  urai:
    iyaipu:
    - porul.298
    - porul.303
    - porul.305
    text: 'இயைபு (649): 298 தோழி; 303 வரைவு; 305 வேறுபட வந்த.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.305
  pindam: 1
  padalam: porul
  othu: 7
  sutra: 305
  moolam: |-
    வேறுபட வந்த உவமத் தோற்றம்
    கூறிய மருங்கின் கொள் வழிக் கொளாஅல்
  kaandigai:
    porul: வேறுபட வந்த உவமத் தோற்றத்தைக் கூறிய இடத்துக் கொள்ளும் வழியில் கொள்க.
    ethu: 304 தோழி/செவிலி என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: வேறுபடு_உவமம்
  links: []
  urai:
    iyaipu:
    - porul.304
    - porul.278
    - porul.306
    text: 'இயைபு (649): 304 தோழி/செவிலி; 278 புணர்த்தல்; 306 ஒரீஇக் கூறல்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: கூறிற்று என்றல்
    saanru: கூறிய
- id: porul.306
  pindam: 1
  padalam: porul
  othu: 7
  sutra: 306
  moolam: |-
    ஒரீஇக் கூறலும் மரீஇய பண்பே
  kaandigai:
    porul: நீக்கிக் கூறுதலும் பழகிய பண்பு.
    ethu: 305 என்றது; ஒரீஇக் கூறலும் (தனித்துக் கூறலும்) மரீஇய பண்பே — வழக்கத்துக்கு ஒப்ப.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: நீக்கல்_பண்பு
  links: []
  urai:
    iyaipu:
    - porul.305
    - porul.307
    text: 'இயைபு (649): 305 உவமத் தோற்றம்; 307 உவமத் தன்மை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.307
  pindam: 1
  padalam: porul
  othu: 7
  sutra: 307
  moolam: |-
    உவமத் தன்மையும் உரித்து என மொழிப
    பயனிலை புரிந்த வழக்கத்தான
  kaandigai:
    porul: பயனிலை புரிந்த வழக்கத்தால் உவமத் தன்மையும் உரியது என்பர்.
    ethu: 306 என்றது; உவமத் தன்மையும் உரித்து — பயனிலை புரிந்த வழக்கத்தான் (பயனிலை விளங்கிய வழக்கில்).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: உவம_தன்மை
  links: []
  urai:
    iyaipu:
    - porul.306
    - porul.308
    - porul.285
    text: 'இயைபு (649): 306 மரீஇய பண்பு; 308 தடுமாறு; 285 பயனிலை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
  - peyar: தான் குறியிடுதல்
    saanru: என மொழிப
  - peyar: ஒருதலை அன்மை
    saanru: உரித்து
- id: porul.308
  pindam: 1
  padalam: porul
  othu: 7
  sutra: 308
  moolam: |-
    தடுமாறு உவமம் கடி வரை இன்றே
  kaandigai:
    porul: தடுமாறு உவமத்துக்கு விலக்கில்லை.
    ethu: 307 உவமத் தன்மை என்றது; தடுமாறு உவமம் (மாறுகோளான உவமை) கடிவரை இன்றே — வரையறை இல்லை.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: தடுமாறு_உவமம்
  links: []
  urai:
    iyaipu:
    - porul.307
    - porul.309
    - porul.279
    text: 'இயைபு (649): 307 உவமத் தன்மை; 309 3 வகை; 279 ஒத்தல். ''கடிவரை இன்றே'' — தடுமாறு உவமையின் எல்லை வரையறுக்கப்படவில்லை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'கடிவரை இன்றே' — இசைவு (வரையறை இன்மை)
- id: porul.309
  pindam: 1
  padalam: porul
  othu: 7
  sutra: 309
  moolam: |-
    அடுக்கிய தோற்றம் விடுத்தல் பண்பே
    நிரல் நிறுத்து அமைத்தல் நிரல் நிறை சுண்ணம்
    வரன் முறை வந்த மூன்று அலங்கடையே
  kaandigai:
    porul: அடுக்கித் தோற்றுதலை விடுதல் பண்பு — நிரல் நிறுத்து அமைத்தல், நிரல் நிறை, சுண்ணம் என்ற முறையாக வந்த மூன்றும் அல்லாதவிடத்து.
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: 308 தடுமாறு உவமம் என்றது; இது அதன் தொடர்ச்சி.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: enumeration
    class: அடுக்கு_விலக்கு
    count: 3
  links: []
  urai:
    iyaipu:
    - porul.308
    - porul.283
    - porul.272
    text: 'இயைபு (649): 308 தடுமாறு உவமம். எண்: மூன்று (நூற்பா ''மூன்று''); ''நிரல் நிறுத்து அமைத்தல்'', ''நிரல் நிறை'' ஒன்றா இரண்டா என்பதைப் பொறுத்துப் பட்டியல் மூன்று அல்லது நான்கு (''வரன் முறை'' பட்டியலுள் ஒன்றா அடையா என்பதும்) — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; மூன்றின் பிரிப்பு ஒருதலை அன்மை
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: மூன்று
