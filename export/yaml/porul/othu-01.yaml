    - உடைமை_உயர்வு
    - அன்பு_அகலம்
    - அகற்சி_அருமை
    - வாய்_கை_பக்கம்
    - ஊதியம்
    - புகழ்
    - மானம்
    - தூது
    - பாசறைப்_புலம்பல்
    - பாகன்_உரை
    - காவல்_பக்கம்
    - பரத்தை_அகற்சி
