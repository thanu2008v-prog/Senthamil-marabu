    saanru: மொழிந்தது
- id: porul.43
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 43
  moolam: |-
    பொழுதும் ஆறும் உட்கு வரத் தோன்றி
    வழுவின் ஆகிய குற்றம் காட்டலும்
    ஊரது சார்பும் செல்லும் தேயமும்
    ஆர்வ நெஞ்சமொடு செப்பிய வழியினும்
    புணர்ந்தோர் பாங்கின் புணர்ந்த நெஞ்சமொடு
    அழிந்து எதிர் கூறி விடுப்பினும் ஆங்கத்
    தாய் நிலை கண்டு தடுப்பினும் விடுப்பினும்
    சேய் நிலைக்கு அகன்றோர் செலவினும் வரவினும்
    கண்டோர் மொழிதல் கண்டது என்ப
  kaandigai:
    porul: 'கண்டோர் கூற்றுக்குரிய இடங்கள்: பொழுதும் வழியும் அச்சம் தரத் தோன்றுவதையும் வழுவால் வரும் குற்றத்தையும் காட்டல், ஊரின் சார்பும் செல்லும் தேயமும் கூறல், எதிர் கூறி விடுத்தல், தாய் நிலை கண்டு தடுத்தல், விடுத்தல், சென்றோர் செலவும் வரவும் — இவற்றில் கண்டோர் மொழிதல்.'
    en:
      kooruvathu: 6
      enniyathu: 6
    ethu: 42 தோழி என்றது; பொழுதும் ஆறும் உட்கு வரத் தோன்றி குற்றம் காட்டல், ஊர்/தேயம், புணர்ந்தோர் பாங்கு, அழிந்து எதிர் கூறி விடுத்தல், தாய் தடுத்தல் — கண்டோர் மொழிதல் 'கண்டது' என்ப.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: கண்டோர்_கூற்று
    count: 6
    items:
    - பொழுது_ஆறு_உட்கு_காட்டல்
    - வழு_குற்றம்_காட்டல்
    - ஊர்_தேயம்_கூறல்
    - எதிர்_கூறி_விடுத்தல்
    - தாய்_நிலை_தடுப்பு
    - சென்றோர்_செலவு_வரவு
  links: []
  urai:
    iyaipu:
    - porul.39
    - porul.42
    - porul.494
    text: 'இயைபு (649): 39 தோழி; 42 தலைவர்; 494 ''கண்டோர் மொழிதல் கண்டது'' — இதே வாக்கியம்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: ஆறும்
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: porul.44
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 44
  moolam: |-
    ஒன்றாத் தமரினும் பருவத்தும் சுரத்தும்
    ஒன்றிய மொழியொடு வலிப்பினும் விடுப்பினும்
    இடைச் சுர மருங்கின் அவள் தமர் எய்திக்
    கடைக் கொண்டு பெயர்தலின் கலங்கு அஞர் எய்திக்
    கற்பொடு புணர்ந்த கௌவை உளப்பட
    அப் பால் பட்ட ஒரு திறத்தானும்
    நாளது சின்மையும் இளமையது அருமையும்
    தாளாண் பக்கமும் தகுதியது அமைதியும்
    இன்மையது இளிவும் உடைமையது உயர்ச்சியும்
    அன்பினது அகலமும் அகற்சியது அருமையும்
    ஒன்றாப் பொருள்வயின் ஊக்கிய பாலினும்
    வாயினும் கையினும் வகுத்த பக்கமொடு
    ஊதியம் கருதிய ஒரு திறத்தானும்
    புகழும் மானமும் எடுத்து வற்புறுத்தலும்
    தூது இடையிட்ட வகையினானும்
    ஆகித் தோன்றும் பாங்கோர் பாங்கினும்
    மூன்றன் பகுதியும் மண்டிலத்து அருமையும்
    தோன்றல் சான்ற மாற்றோர் மேன்மையும்
    பாசறைப் புலம்பலும் முடிந்த காலத்துப்
    பாகனொடு விரும்பிய வினைத்திற வகையினும்
    காவற் பாங்கின் ஆங்கோர் பக்கமும்
    பரத்தையின் அகற்சியின் பரிந்தோட் குறுகி
    இரத்தலும் தெளித்தலும் என இரு வகையொடு
    உரைத் திற நாட்டம் கிழவோன் மேன
  kaandigai:
    porul: 'கிழவோன் (தலைவன்) கூற்றுக்குரிய இடங்கள்: உடன்படாத உறவினர், பருவம், சுரம் பற்றிய கூற்றுகள்; இடைச்சுரத்தில் அவள் உறவினர் மீட்டுக் கொள்ளுதல்; நாள் சின்மை, இளமை அருமை, முயற்சி, தகுதி, இன்மையின் இழிவு, உடைமையின் உயர்வு, அன்பின் அகலம், பிரிவின் அருமை முதலியன பற்றிப் பொருள்வயின் ஊக்குதல்; புகழ், மானம், தூது, பாசறைப் புலம்பல், பாகனோடு உரைத்தல், பரத்தையிற் பிரிவின்பின் இரத்தலும் தெளித்தலும் — இவை கிழவோனுக்கு உரியன.'
    en:
      kooruvathu: 21
      enniyathu: 21
    ethu: 43 கண்டோர் என்றது; பல சூழல் — ஒன்றாத் தமர், பருவம், சுரம், மடல், மாயம், வரைவு — பல வழிகளில் கிழவோன் மேன (தலைவன் சார்பாக).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: கிழவோன்_கூற்று
