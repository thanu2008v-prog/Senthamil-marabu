    thunivu: நூலில் நேரடியாக
- id: porul.48
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 48
  moolam: |-
    மரபுநிலை திரியா மாட்சிய ஆகி
    விரவும் பொருளும் விரவும் என்ப
  kaandigai:
    porul: 'மரபுநிலை திரியாத மாட்சிமை உடையனவாக, விரவி வரும் பொருள்களும் விரவும் என்பர். மரபு திரியாமை: பொருள். 636, 637.'
    ethu: 47 நிகழ்ந்தது கூறி என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: விரவு_பொருள்
    property: மரபுநிலை_திரியா
  links: []
  urai:
    iyaipu:
    - porul.47
    - porul.49
    text: 'இயைபு (649): 47 நிகழ்ந்தது; 49 உள்ளுறை/உவமம்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: porul.49
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 49
  moolam: |-
    உள்ளுறை உவமம் ஏனை உவமம் எனத்
    தள்ளாது ஆகும் திணை உணர் வகையே
  kaandigai:
    porul: உள்ளுறை உவமம், ஏனை உவமம் என இரண்டும் திணையை உணரும் வகைகளாக விலக்கப்படாது.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 48 விரவும் பொருள் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: திணை_உணர்_வகை
    count: 2
    items:
    - உள்ளுறை_உவமை
    - ஏனை_உவமை
  links:
  - porul.50
  - porul.52
  urai:
    iyaipu:
    - porul.48
    - porul.50
    - porul.51
    - porul.52
    text: 'இயைபு (649): 50 உள்ளுறை தெய்வம், 51 உள்ளுறை உவமம், 52 ஏனை உவமம் — இவற்றின் விரிவு. எண்: நூற்பா எண் கூறவில்லை; பட்டியல் இரண்டு (உள்ளுறை உவமம், ஏனை உவமம்).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.50
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 50
  moolam: |-
    உள்ளுறை தெய்வம் ஒழிந்ததை நிலம் எனக்
    கொள்ளும் என்ப குறி அறிந்தோரே
  kaandigai:
    porul: உள்ளுறை (உவமத்துக்கு) தெய்வம் ஒழிந்த (கருப்பொருள் முதலியவை) நிலமாகக் கொள்ளப்படும் என்பர் குறி அறிந்தோர்.
    ethu: 49 உள்ளுறை என்றது; உள்ளுறையில் தெய்வம் ஒழிந்ததை நிலம் எனக் கொள்ளும்.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    class: உள்ளுறை
    property: தெய்வம்_ஒழிந்தது_நிலம்
  links: []
  urai:
    iyaipu:
    - porul.49
    - porul.51
    - porul.20
    text: 'இயைபு (649): 49 உள்ளுறை; 51 உள்ளுறை உவமம்; 20 கரு (தெய்வம்). ''தெய்வம் ஒழிந்தது'' — எது என நூல் இங்கு விரிக்கவில்லை — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'தெய்வம் ஒழிந்தது' எது என ஒருதலை அன்மை
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: porul.51
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 51
  moolam: |-
    உள்ளுறுத்து இதனொடு ஒத்துப் பொருள் முடிக என
    உள்ளுறுத்து இறுவதை உள்ளுறை உவமம்
  kaandigai:
    porul: '"இதனொடு ஒத்துப் பொருள் முடிக" என உள்ளே வைத்து முடிப்பது உள்ளுறை உவமம். உள்ளுறையின் ஐந்து வகை பொருள். 238-இல்.'
    ethu: 50 உள்ளுறை என்றது; உள்ளுறுத்து இதனொடு ஒத்துப் பொருள் முடிக என்பதே உள்ளுறை உவமம்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    entity: உள்ளுறை_உவமை
    property: ஒத்து_பொருள்_முடிக
  links: []
  urai:
    iyaipu:
    - porul.49
    - porul.50
    - porul.52
    text: 'இயைபு (649): 50 உள்ளுறை தெய்வம்; 52 ஏனை உவமம்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.52
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 52
  moolam: |-
    ஏனை உவமம் தான் உணர் வகைத்தே
  kaandigai:
    porul: ஏனை உவமம் தானே உணரப்படும் வகையது (வெளிப்படையானது). உவம வகைகள் உவமவியலில் (272 முதல்).
    ethu: 51 உள்ளுறை உவமம் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    entity: ஏனை_உவமை
    property: தான்_உணர்_வகை
  links: []
  urai:
    iyaipu:
    - porul.49
    - porul.51
    - porul.272
    text: 'இயைபு (649): 49 உள்ளுறை/ஏனை; 51 உள்ளுறை உவமம்; 272 உவமத்தின் இயல் (பொருள். 272-309).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.53
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 53
  moolam: |-
    காமம் சாலா இளமையோள்வயின்
    ஏமம் சாலா இடும்பை எய்தி
    நன்மையும் தீமையும் என்று இரு திறத்தான்
    தன்னொடும் அவளொடும் தருக்கிய புணர்த்து
    சொல் எதிர் பெறாஅன் சொல்லி இன்புறல்
    புல்லித் தோன்றும் கைக்கிளைக் குறிப்பே
  kaandigai:
    porul: 'கைக்கிளைக் குறிப்பு: காமம் நிறையாத இளமையளிடத்து, தாங்கமுடியாத துன்பமுற்று, நன்மை தீமை இரண்டையும் தன்னோடும் அவளோடும் பொருத்திச் சொல்லி, மறுமொழி பெறாமல் தானே சொல்லி இன்புறுதல். ("ஒருபக்கக் காமம்" என்ற சொல் நூலில் இல்லை.)'
    en:
      kooruvathu: 5
      enniyathu: 5
    ethu: 52 ஏனை உவமம் என்றது; கைக்கிளைக் குறிப்பு — காமம் சாலா இளமையோள்வயின் புல்லித் தோன்றும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    entity: கைக்கிளை_குறிப்பு
    steps:
    - காமம்_சாலா_இளமை
    - ஏமம்_சாலா_இடும்பை
    - நன்மை_தீமை_இரு_திறம்
    - தன்_அவள்_புணர்த்து
    - சொல்_எதிர்_பெறா_இன்புறல்
  links: []
  urai:
    iyaipu:
    - porul.1
    - porul.52
    - porul.54
    - porul.102
    text: 'இயைபு (649): 1 ஏழ் திணை; 54 பெருந்திணை; 102 கைக்கிளை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.54
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 54
  moolam: |-
    ஏறிய மடல் திறம் இளமை தீர் திறம்
    தேறுதல் ஒழிந்த காமத்து மிகு திறம்
    மிக்க காமத்து மிடலொடு தொகைஇ
    செப்பிய நான்கும் பெருந்திணைக் குறிப்பே
  kaandigai:
    porul: 'பெருந்திணைக் குறிப்பு நான்கு: ஏறிய மடல் திறம், இளமை தீர் திறம், தேறுதல் ஒழிந்த காமத்து மிகு திறம், மிக்க காமத்து மிடல் (வலிமை).'
    en:
      kooruvathu: 4
      enniyathu: 4
    ethu: 53 கைக்கிளை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: பெருந்திணை_குறிப்பு
    count: 4
    items:
    - ஏறிய_மடல்_திறம்
    - இளமை_தீர்_திறம்
    - தேறுதல்_ஒழிந்த_காம_மிகு_திறம்
    - மிக்க_காமத்து_மிடல்
  links: []
  urai:
    iyaipu:
    - porul.1
    - porul.53
    - porul.55
    - porul.103
    text: 'இயைபு (649): 1 ஏழ்; 53 கைக்கிளை; 55 முன்னைய நான்கும்; 103 பெருந்திணை. எண்: நான்கு (நூற்பா) = நான்கு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: நான்கும்
- id: porul.55
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 55
  moolam: |-
    முன்னைய நான்கும் முன்னதற்கு என்ப
  kaandigai:
    porul: 'முன் சொன்ன நான்கும் முன்னதற்கு (உரியன) என்பர். எந்த நான்கு, எந்த முன்னது என்பது நூலில் தெளிவாக இல்லை (ஒருதலை அன்மை): 54-இன் நான்கு கைக்கிளைக்கும் எனலாம்; அல்லது முன் கூறிய நால்வகை நிலத்துக்கு எனலாம்.'
    ethu: 54 பெருந்திணைக் குறிப்பு நான்கு என்றது; 'முன்னைய நான்கும் முன்னதற்கு என்ப' — முன் கூறிய நான்கு எவை, 'முன்னது' எது என நூற்பா பெயரிடவில்லை.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    class: நான்கு_முன்னது
    property: உரிய
  links: []
  urai:
    iyaipu:
    - porul.53
    - porul.54
    - porul.102
    - porul.103
    text: 'இயைபு (649): 53 கைக்கிளைக் குறிப்பு; 54 ''செப்பிய நான்கும் பெருந்திணைக் குறிப்பே''; 102 ''முன்னைய மூன்றும் கைக்கிளைக் குறிப்பே'', 103 ''பின்னர் நான்கும் பெருந்திணை பெறுமே'' — இதே முன்/பின் சொல்லாட்சி. ''முன்னைய நான்கு'' 54-இன் நான்கா, ''முன்னது'' 53-இன் கைக்கிளையா என்பது ஒருதலை அன்மை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'முன்னைய நான்கு', 'முன்னது' ஒருதலை அன்மை
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: நான்கும்
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: porul.56
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 56
  moolam: |-
    நாடக வழக்கினும் உலகியல் வழக்கினும்
    பாடல் சான்ற புலனெறி வழக்கம்
    கலியே பரிபாட்டு ஆயிரு பாவினும்
    உரியது ஆகும் என்மனார் புலவர்
  kaandigai:
    porul: 'நாடக வழக்கிலும் உலகியல் வழக்கிலும் பாடலுக்குரிய புலனெறி வழக்கம் கலி, பரிபாட்டு ஆகிய இரு பாவிலும் உரியது என்பர். பா வகை: பொருள். 410.'
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 53-55 கைக்கிளை/பெருந்திணை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: புலனெறி_வழக்கம்
    pavas:
    - கலி
    - பரிபாட்டு
    count: 2
  links: []
  urai:
    iyaipu:
    - porul.53
    - porul.54
    - porul.423
    - porul.424
    text: 'இயைபு (649): 53, 54; 423 வெண்பா வகை; 424 கைக்கிளை வெண்பா. எண்: இரண்டு (நூற்பா: கலி, பரிபாட்டு) = இரண்டு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்மனார்
- id: porul.57
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 57
  moolam: |-
    மக்கள் நுதலிய அகன் ஐந்திணையும்
    சுட்டி ஒருவர்ப் பெயர் கொளப் பெறாஅர்
  kaandigai:
    porul: மக்களைப் பற்றிய அகன் ஐந்திணையிலும் ஒருவரைச் சுட்டிப் பெயர் கொள்ளப் பெறார்.
    ethu: 53-56 கைக்கிளை/பெருந்திணை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: அகன்_ஐந்திணை
    property: ஒருவர்_பெயர்_கொள்ளா
  links: []
  urai:
    iyaipu:
    - porul.1
    - porul.2
    - porul.22
    - porul.58
    text: 'இயைபு (649): 1 ஏழ்; 2 ஐந்து நிலம்; 22 திணை-நிலைப் பெயர்; 58 அகத்திணைக்கும் புறத்திணைக்கும் பொது. ''ஒருவர்ப் பெயர் கொளப் பெறார்'' — சுட்டிப் பெயரிட முடியாது; இது பெயரியல் விலக்கு, ஆனால் தனி விதியாகவே வருகிறது — விதி.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.58
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 58
  moolam: |-
    புறத்திணை மருங்கின் பொருந்தின் அல்லது
    அகத்திணை மருங்கின் அளவுதல் இலவே
  kaandigai:
    porul: புறத்திணையில் பொருந்தினால் அல்லாமல் அகத்திணையில் (பெயர்) அளாவுதல் இல்லை.
    ethu: 57 அகன் ஐந்திணை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: exception
    class: அகத்திணை_பெயர்_அளவு
    property: புறம்_பொருந்தினாலன்றி_இல்லை
    othu_end: true
  links:
  - porul.57
  urai:
    iyaipu:
    - porul.57
    - porul.59
    - porul.89
    text: 'இயைபு (649): 57 அகன் ஐந்திணை; 59 புறத்திணை வெட்சி; 89 அகத்திணைக் களவு. அகத்திணைக்குப் பெயர் இடமுடியாது; புறத்திணையோடு சேரும்போதே பெயர் இடலாம்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
