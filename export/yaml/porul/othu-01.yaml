# இக்கோப்பு data_v2-இலிருந்து உருவானது. 'moolam' (சூத்திரம்) திருத்தக் கூடாது (பொருள். 652).
- id: porul.1
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 1
  moolam: |-
    கைக்கிளை முதலாப் பெருந்திணை இறுவாய்
    முற்படக் கிளந்த எழு திணை என்ப
  kaandigai:
    porul: கைக்கிளை முதலாகவும் பெருந்திணை இறுதியாகவும் முன்னோர் முதற்கண் சொன்ன திணை ஏழு. இடையில் உள்ள ஐந்தின் பெயர்கள் 5, 11-இல் வருகின்றன; கைக்கிளை, பெருந்திணை இலக்கணம் 53, 54-இல்.
    en:
      kooruvathu: 7
      enniyathu: 7
    ethu: 'எழுத்தும் சொல்லும் கூறிய பின் அவற்றால் கூறப்படும் பொருளைத் திணையால் தொடங்குகிறது; தொகை முதலில், பின் விரி: நடுவண் ஐந்திணை (பொருள். 2), அவற்றின் உள்ளுறை "முதல் கரு உரிப்பொருள்" (பொருள். 3). ஐந்திணையின் நிலப்பெயர்கள் "முல்லை குறிஞ்சி மருதம் நெய்தல்" (பொருள். 5).'
    eduthukkaattu:
    - text: முதல் கரு உரிப்பொருள்
      from: porul.3
    - text: முல்லை குறிஞ்சி மருதம் நெய்தல்
      from: porul.5
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: திணை
    count: 7
    items:
    - கைக்கிளை
    - முல்லை
    - குறிஞ்சி
    - மருதம்
    - நெய்தல்
    - பாலை
    - பெருந்திணை
  links:
  - porul.5
  - porul.11
  - porul.53
  - porul.54
  urai:
    iyaipu:
    - porul.2
    - porul.3
    text: 'இயைபு (649): பொருள். 2, 3 · பொருளதிகாரத்தின் நுதலியது: திணை ஏழு — கைக்கிளை முதல், பெருந்திணை இறுதி. "முற்படக் கிளந்த" — முன்னோர் கூறியது (பிறன் உடன்பட்டது தான் உடம்படுதல் — 656). இடை ஐந்து — "நடுவண் ஐந்திணை" (2); கைக்கிளை 53, பெருந்திணை 54. சொல். 1-இன் இரு திணையோடு வேறுபாடு — அச்சூத்திர உரையில்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: கூறிற்று என்றல்
    saanru: கிளந்த
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: porul.2
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 2
  moolam: |-
    அவற்றுள்
    நடுவண் ஐந்திணை நடுவணது ஒழிய
    படு திரை வையம் பாத்திய பண்பே
  kaandigai:
    porul: அவ்வேழனுள் நடுவில் உள்ள ஐந்திணையுள், நடுவில் உள்ள ஒன்றை ஒழித்து, அலை கடல் சூழ்ந்த உலகம் (நிலமாகப்) பகுக்கப்பட்ட இயல்பு. நிலம் பெறாத நடுத்திணை 11-இன் "நடுவுநிலைத் திணை"யா, அது 73-இன் "பாலை"யா என்பதை நூல் கூறவில்லை (ஒருதலை அன்மை).
    ethu: 1 ஏழ் திணை என்றது; அவற்றுள் நடுவண் ஐந்திணை (கைக்கிளை, பெருந்திணை நீங்கிய இடையன ஐந்து) — அவற்றுள்ளும் நடுவணது ஒழிய ஏனைய நான்கும் 'படு திரை வையம்' பங்கிடும். நடுவணது எது என்பதை 11 'நடுவுநிலைத் திணையே நண்பகல் வேனிலொடு' எனத் தானே காட்டுகிறது.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    class: நடுவண்_ஐந்திணை
    property: நடுவணது_ஒழிவு
  links:
  - porul.1
  - porul.11
  urai:
    iyaipu:
    - porul.1
    - porul.5
    - porul.11
    - porul.22
    text: 'இயைபு (649): 5 நான்கு நிலங்களையும் (முல்லை, குறிஞ்சி, மருதம், நெய்தல்) அவற்றின் தெய்வங்களையும் பெயரிடுகிறது — அவற்றுள் நடுவணது இல்லை; 11 ''நடுவுநிலைத் திணை'' நண்பகல் வேனிலொடு முடியும் என்கிறது. ஆகவே 2-இன் ''நடுவணது ஒழிய'' 5-உடனும் 11-உடனும் ஒத்துப் போகிறது; முரண் இல்லை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக; காண்டிகை சுட்டிய ஐயம் ஒருதலை அன்மை
  utthi:
  - peyar: அதிகார முறை
    saanru: அவற்றுள்
- id: porul.3
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 3
  moolam: |-
    முதல் கரு உரிப்பொருள் என்ற மூன்றே
    நுவலும் காலை முறை சிறந்தனவே
    பாடலுள் பயின்றவை நாடும் காலை
  kaandigai:
    porul: பாடலுள் பயின்று வருவனவற்றை ஆராயும்போது முதல், கரு, உரிப்பொருள் என்ற மூன்றே; அவை முறையே சிறப்புடையன. "முறை சிறந்தன" — பின்னது முன்னதினும் சிறந்தது என்பதா, முறைப்படச் சிறந்து நிற்பன என்பதா என்பதை நூல் தீர்க்கவில்லை (ஒருதலை அன்மை).
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: 1–2 திணை பாகுபாடு; ஒவ்வொரு திணைக்கும் மூன்று உறுப்புகள் — முதல் (நிலம்/பொழுது), கரு (தெய்வம் முதலிய), உரிப்பொருள் (செயல்).
  nilai: ஒருதலை அன்மை
  kanini:
    kind: enumeration
    class: பொருள்_மூன்று
    count: 3
    items:
    - முதல்
    - கரு
    - உரிப்பொருள்
  links: []
  urai:
    iyaipu:
    - porul.1
    - porul.4
    - porul.19
    - porul.20
    text: 'இயைபு (649): 4 முதல், 19 முதல்-இரு வகை, 20 கரு — இவற்றின் விரிவு. எண்: மூன்று (நூற்பா) = மூன்று (முதல், கரு, உரிப்பொருள்).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக; காண்டிகை சுட்டிய ஐயம் ஒருதலை அன்மை
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: மூன்றே
- id: porul.4
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 4
  moolam: |-
    முதல் எனப்படுவது நிலம் பொழுது இரண்டின்
    இயல்பு என மொழிப இயல்பு உணர்ந்தோரே
  kaandigai:
    porul: முதற்பொருள் என்பது நிலம், பொழுது ஆகிய இரண்டின் இயல்பு என இயல்பு உணர்ந்தோர் கூறுவர். 19 இதனை மீண்டும் உறுதி செய்கிறது.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: முதல், கரு, உரிப்பொருள் என்ற மூன்றனுள் (பொருள். 3) முதலாவதற்கு இலக்கணம் இது; அதனை மீண்டும் "முதல் எனப்படுவது ஆயிரு வகைத்தே" (பொருள். 19) என உறுதிப்படுத்துகிறது. எ.கா. நிலம் — "முல்லை குறிஞ்சி மருதம் நெய்தல்" (பொருள். 5); பொழுது — "காரும் மாலையும்" (பொருள். 6).
    eduthukkaattu:
    - text: முதல் எனப்படுவது ஆயிரு வகைத்தே
      from: porul.19
    - text: முல்லை குறிஞ்சி மருதம் நெய்தல்
      from: porul.5
    - text: காரும் மாலையும்
      from: porul.6
  nilai: ஒருதலை அன்மை
  kanini:
    kind: definition
    entity: முதற்பொருள்
    components:
    - நிலம்
    - பொழுது
  links: []
  urai:
    iyaipu:
    - porul.3
    - porul.5
    - porul.6
    text: 'இயைபு (649): பொருள். 3, 5, 6 — "முதல் கரு உரிப்பொருள்" (3) — மூன்றனுள் முதல்வதாகிய முதலுக்கு இலக்கணம். "நிலம் பொழுது இரண்டின் இயல்பு" — இடமும் காலமும் இணையாக அடிப்படை. நிலம் 5-இல், பொழுது 6–12-இல் விரிக்கப்படுகின்றன — இச்சூத்திரத்தின் வரிசையே (நிலம், பொழுது). ஐயம்: "பொழுது" என்ற ஒரே சொல்லுள் கார், கூதிர் போன்ற பருவமும் மாலை, யாமம் போன்ற நாட்பொழுதும் அடங்குகின்றன — இரண்டாகப் பகுக்கும் பெயர் நூலில் இல்லை (ஒருதலை அன்மை). மயக்கம்: நிலம் மயங்காது (14); பொழுது மயங்கலாம் (15) — முதலின் இரண்டு கூறுகளும் ஒரே வலிமையவை அல்ல.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக; உரை சுட்டிய ஐயம் ஒருதலை அன்மை
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
  - peyar: தான் குறியிடுதல்
    saanru: எனப்படுவது
- id: porul.5
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 5
  moolam: |-
    மாயோன் மேய காடு உறை உலகமும்
    சேயோன் மேய மை வரை உலகமும்
    வேந்தன் மேய தீம் புனல் உலகமும்
    வருணன் மேய பெரு மணல் உலகமும்
    முல்லை குறிஞ்சி மருதம் நெய்தல் எனச்
    சொல்லிய முறையான் சொல்லவும் படுமே
  kaandigai:
    porul: மாயோன் விரும்பிய காடு, சேயோன் விரும்பிய மை வரை (மலை), வேந்தன் விரும்பிய தீம் புனல், வருணன் விரும்பிய பெரு மணல் — இந்நான்கு உலகமும் முறையே முல்லை, குறிஞ்சி, மருதம், நெய்தல் எனவும் சொல்லப்படும்.
    en:
      kooruvathu: 4
      enniyathu: 4
    ethu: 4 நிலம்/பொழுது என்றது; நான்கு நிலங்கள் (முல்லை, குறிஞ்சி, மருதம், நெய்தல்) மற்றும் அவற்றின் தெய்வங்கள் (மாயோன், சேயோன், வேந்தன், வருணன்).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: நிலம்_தெய்வம்
    count: 4
    pairs:
    - - மாயோன்
      - முல்லை
    - - சேயோன்
      - குறிஞ்சி
    - - வேந்தன்
      - மருதம்
    - - வருணன்
      - நெய்தல்
  links:
  - porul.6
  - porul.7
  - porul.9
  - porul.10
  urai:
    iyaipu:
    - porul.4
    - porul.6
    - porul.7
    - porul.9
    - porul.10
    text: 'இயைபு (649): 6-12 நான்கு நிலங்களின் பொழுதுகள்; 20 தெய்வம் ''கரு'' வகையில். எண்: நூற்பா எண் கூறவில்லை; பட்டியல் நான்கு (முல்லை, குறிஞ்சி, மருதம், நெய்தல்).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: முறை பிறழாமை
    saanru: முறையான்
  - peyar: கூறிற்று என்றல்
    saanru: சொல்லிய
- id: porul.6
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 6
  moolam: |-
    காரும் மாலையும் முல்லை
  kaandigai:
    porul: கார் (பருவம்), மாலை (பொழுது) — முல்லைக்கு உரியன. பருவம்/நாள் பொழுது என்ற இரு வகைப் பகுப்பின் பெயர்கள் (பெரும்பொழுது, சிறுபொழுது) நூலில் இல்லை; பகுப்பை நூல் பெயரிட்டுக் கூறவில்லை.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 'நிலம் கூறிய பின் (பொருள். 5) பொழுது; முல்லை முதலில் வருவது பொருள். 5-இன் வரிசையின்படி ("சொல்லிய முறையான்"). ஒவ்வொரு திணைக்கும் இவ்வாறே பொழுது: "கூதிர் யாமம்" (பொருள். 7), "வைகறை விடியல்" (பொருள். 9), "எற்பாடு" (பொருள். 10).'
    eduthukkaattu:
    - text: கூதிர் யாமம்
      from: porul.7
    - text: வைகறை விடியல்
      from: porul.9
    - text: எற்பாடு
      from: porul.10
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    entity: முல்லை
    components:
    - கார்_பருவம்
    - மாலை_பொழுது
  links: []
  urai:
    iyaipu:
    - sol.289
    text: '"காரும் மாலையும்" — எண்ணும்மை ("உம்மை எண்ணும்" — சொல். 289): ஒரு பருவமும் ஒரு நாட்பொழுதும் — இதுவே பொழுது விரியின் மாதிரி (7, 11 இதையே பின்பற்றுகின்றன). முல்லை முதலில் — 5-இன் "முல்லை குறிஞ்சி மருதம் நெய்தல் … சொல்லிய முறையான்" வரிசையே 6–10-இன் வரிசை. "கார்" பருவம் என்பது 8-இன் "பருவமும்" உம்மையால் — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.7
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 7
  moolam: |-
    குறிஞ்சி
    கூதிர் யாமம் என்மனார் புலவர்
  kaandigai:
    porul: குறிஞ்சிக்குக் கூதிர் (பருவம்), யாமம் (பொழுது) என்பர் புலவர்.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: பொருள். 5-இன் வரிசையில் முல்லைக்கு அடுத்து குறிஞ்சி. முல்லைக்கு "காரும் மாலையும்" (பொருள். 6) போல் இங்கும் ஒரு பருவமும் ஒரு நாட்பொழுதும். "என்மனார் புலவர்" — பிறன் உடன்பட்டது தான் உடம்படுதல் (பொருள். 656).
    eduthukkaattu:
    - text: காரும் மாலையும்
      from: porul.6
    - text: என்மனார் புலவர்
      from: porul.7
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    entity: குறிஞ்சி
    components:
    - கூதிர்
    - யாமம்
  links: []
  urai:
    iyaipu:
    - porul.6
    - porul.8
    - porul.9
    text: 'இயைபு (649): பொருள். 6, 8, 9 · வரிசை மாற்றம்: 6-இல் பொழுது முன், திணை பின்; இங்கு திணை (குறிஞ்சி) முன், பொழுது (கூதிர் — பருவம்; யாமம் — நாட்பொழுது) பின். பொருள் மாறவில்லை. "என்மனார் புலவர்" — இவ்விதி புலவர் மரபாகக் கூறப்படுகிறது. 8 இதன் தொடர்ச்சி.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்மனார்
- id: porul.8
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 8
  moolam: |-
    பனி எதிர் பருவமும் உரித்து என மொழிப
  kaandigai:
    porul: பனி எதிர் பருவமும் உரியது என்பர் — எத்திணைக்கு எனப் பெயர் இல்லை; அண்மை நூற்பா 7 குறிஞ்சி (ஒருதலை அன்மை). "முன்பனி" என்ற பெயர் நூலில் இல்லை.
    ethu: '"பருவமும்" என்ற உம்மை முன் சூத்திரத்தின் கூதிரோடு (பொருள். 7) சேர்க்கிறது. இதே அமைப்பு பொருள். 12-இலும்: "பின்பனிதானும் உரித்து என மொழிப" — நண்பகல் வேனிலோடு (பொருள். 11).'
    eduthukkaattu:
    - text: பருவமும்
      from: porul.8
    - text: பின்பனிதானும் உரித்து என மொழிப
      from: porul.12
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    class: பனி_எதிர்_பருவம்
    property: உரிய
    items_not_named: true
  links: []
  urai:
    iyaipu:
    - porul.7
    - porul.12
    text: 'இயைபு (649): பொருள். 7, 12 · "பருவமும்" — உம்மை: 7-இன் கூதிரோடு இதுவும் குறிஞ்சிக்கு (அதிகாரத்தால் — ஒருதலை அன்மை). கால விரியில் "பருவம்" என்ற சொல் வருவது இங்கு மட்டும் (பிறிடங்கள் 44, 144, 149 வேறு பொருளில்). "பனி எதிர்" — பனி எதிர்ப்படும்; 12-இன் "பின்பனி" இதன் பின்னுள்ளது எனக் கொள்ளல் ஒருதலை அன்மை; "முன்பனி" என்ற பெயர் நூலில் இல்லை.'
    vagai: விதி
    thunivu: ஒருதலை அன்மை
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
  - peyar: தான் குறியிடுதல்
    saanru: என மொழிப
  - peyar: ஒருதலை அன்மை
    saanru: உரித்து
- id: porul.9
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 9
  moolam: |-
    வைகறை விடியல் மருதம்
  kaandigai:
    porul: வைகறை, விடியல் — மருதத்துக்கு உரியன. பருவம் கூறப்படவில்லை.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: பொருள். 5-இன் வரிசையில் மருதம் மூன்றாவது. பருவம் கூறாது பொழுது இரண்டு மட்டும்; திணை மயக்கம் இல்லை என்பதால் — "நிலன் ஒருங்கு மயங்குதல் இல என மொழிப" (பொருள். 14) — ஒவ்வொரு நிலத்துக்கும் உரிய பொழுது தனியே.
    eduthukkaattu:
    - text: நிலன் ஒருங்கு மயங்குதல் இல என மொழிப
      from: porul.14
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    entity: மருதம்
    components:
    - வைகறை
    - விடியல்
  links: []
  urai:
    iyaipu:
    - porul.6
    - porul.10
    text: 'இயைபு (649): பொருள். 6, 10 · இரண்டு நாட்பொழுது; பருவம் இல்லை. கடாஅ (650): மருதத்துக்கு பருவம் இல்லையா? — விடை: நூல் கூறவில்லை; "உரிப்பொருள் அல்லன மயங்கவும் பெறுமே" (15) — பிற திணையின் பருவம் வரலாம் எனக் கொள்ளல் ஒருதலை அன்மை. வைகறை, விடியல் — ஒன்றா இரண்டா என்பதும் ஒருதலை அன்மை (உம்மை இல்லை).'
    vagai: விதி
    maruthalai:
    - kadaa: மருதத்துக்கு பருவம் இல்லையா?
      maattram: '— விடை: நூல் கூறவில்லை; "உரிப்பொருள் அல்லன மயங்கவும் பெறுமே" (15) — பிற திணையின் பருவம் வரலாம் எனக் கொள்ளல் ஒருதலை அன்மை. வைகறை, விடியல் — ஒன்றா இரண்டா என்பதும் ஒருதலை அன்மை (உம்மை இல்லை).'
      saanru:
      - text: உரிப்பொருள் அல்லன மயங்கவும் பெறுமே
        from: porul.15
    thunivu: நூலில் நேரடியாக
- id: porul.10
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 10
  moolam: |-
    எற்பாடு
    நெய்தல் ஆதல் மெய் பெறத் தோன்றும்
  kaandigai:
    porul: எற்பாடு (பொழுது) நெய்தலுக்கு உரியதாதல் உண்மையாகத் தோன்றும். பருவம் கூறப்படவில்லை.
    ethu: பொருள். 5-இன் வரிசையில் நெய்தல் நான்காவது; அதற்கு ஒரு நாட்பொழுது. "மெய் பெறத் தோன்றும்" — நூல் உறுதிப்படுத்தும் சொல்; இதே சொல் எழுத்ததிகாரத்திலும் — "யஃகான் நிற்றல் மெய்பெற் றன்றே" (எழு. 27).
    eduthukkaattu:
    - text: மெய் பெறத் தோன்றும்
      from: porul.10
    - text: யஃகான் நிற்றல் மெய்பெற் றன்றே
      from: ezhu.27
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    entity: நெய்தல்
    components:
    - எற்பாடு
  links: []
  urai:
    iyaipu:
    - porul.9
    - porul.11
    text: 'இயைபு (649): பொருள். 9, 11 · ஒரு நாட்பொழுது; பருவம் இல்லை. "மெய் பெறத் தோன்றும்" — உறுதியாகத் தோன்றும்; 6–9-இல் இல்லாத உறுதிச் சொல் இங்கு மட்டும். நாட்பொழுதுகளின் வரிசை (மாலை → யாமம் → வைகறை → விடியல் → எற்பாடு; நண்பகல் 11) திணை வரிசையோடு சேர்ந்து வருகிறது; இது நாளின் வரிசையே என்பது நூலில் சொல்லப்படவில்லை (ஒருதலை அன்மை).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.11
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 11
  moolam: |-
    நடுவுநிலைத் திணையே நண்பகல் வேனிலொடு
    முடிவு நிலை மருங்கின் முன்னிய நெறித்தே
  kaandigai:
    porul: நடுவுநிலைத் திணைக்கு நண்பகல், வேனில் ஆகியவை. "முடிவு நிலை மருங்கின் முன்னிய நெறித்தே" — அதன் முடிவு நிலைக்கு ஏற்பக் கருதிய நெறி உடையது; இதன் பொருள் நூலால் முழுமையாகத் தெளியவில்லை. நடுவுநிலைத் திணை எது என்பதற்கு நூலின் எண்ணால் மட்டும் சான்று உண்டு (ஆய்வு 15).
    ethu: நிலம் நான்கே பெயரிடப்பட்டன (பொருள். 5); நடுவண் ஐந்திணையுள் (பொருள். 2) ஐந்தாவதான நடுவுநிலைத் திணைக்கு நிலம் இல்லாததால் பொழுதால் மட்டும் கூறப்படுகிறது — "நண்பகல் வேனிலொடு".
    eduthukkaattu:
    - text: நண்பகல் வேனிலொடு
      from: porul.11
  nilai: ஒருதலை அன்மை
  kanini:
    kind: definition
    entity: நடுவுநிலை_திணை
    components:
    - நண்பகல்
    - வேனில்
    clarity: partial
  links: []
  urai:
    iyaipu:
    - porul.10
    - porul.12
    text: 'இயைபு (649): பொருள். 10, 12 · "நடுவுநிலைத் திணை" — 5 நான்கு நிலத்தையே பெயரிடுகிறது; "ஐந்திணை" (2, 57, 89) என்பதால் இது ஐந்தாவது; இதற்கு நிலம் கூறப்படவில்லை. "நண்பகல் வேனிலொடு" — ஒடு: உடனிகழ்ச்சி. நாட்பொழுது முன், பருவம் பின் — 6-இன் மாற்று வரிசை. ஐயம்: "முடிவு நிலை மருங்கின் முன்னிய நெறித்தே" — நூலால் தீரவில்லை; 13 ("இரு வகைப் பிரிவும்") இதன் தொடர்ச்சி — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: ஒருதலை அன்மை
- id: porul.12
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 12
  moolam: |-
    பின்பனிதானும் உரித்து என மொழிப
  kaandigai:
    porul: பின்பனியும் உரியது என்பர் — எத்திணைக்கு எனப் பெயர் இல்லை; அண்மை நூற்பா 11 நடுவுநிலைத் திணை (ஒருதலை அன்மை).
    ethu: '"பின்பனிதானும்" — உம்மை முன் சூத்திரத்தின் வேனிலோடு சேர்க்கிறது (பொருள். 11), பொருள். 8 "பருவமும்" முன் சூத்திரத்தின் கூதிரோடு சேர்த்தது போல். இரண்டும் "உரித்து என மொழிப" என்ற ஒரே சொல்லால் முடிகின்றன.'
    eduthukkaattu:
    - text: பின்பனிதானும்
      from: porul.12
    - text: பருவமும்
      from: porul.8
    - text: உரித்து என மொழிப
      from: porul.12
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    class: பின்பனி
    property: உரிய
    items_not_named: true
  links: []
  urai:
    iyaipu:
    - porul.8
    - porul.11
    text: 'இயைபு (649): பொருள். 8, 11 · "பின்பனிதானும்" — உம்மை: வேனிலோடு இதுவும் நடுவுநிலைத் திணைக்கு. 8-இன் "பருவமும் உரித்து என மொழிப" — 12-இன் "தானும் உரித்து என மொழிப" — இரண்டும் ஒரே வாய்பாடு: கூடுதலாக சேரும் இரண்டாம் பருவம். நூல் தரும் பருவப் பெயர் ஐந்து: கார், கூதிர், பனி எதிர் பருவம், வேனில், பின்பனி — எண்ணியது; தொகை எண் நூலில் இல்லை.'
    vagai: விதி
    thunivu: ஒருதலை அன்மை
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
  - peyar: தான் குறியிடுதல்
    saanru: என மொழிப
  - peyar: ஒருதலை அன்மை
    saanru: உரித்து
- id: porul.13
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 13
  moolam: |-
    இரு வகைப் பிரிவும் நிலை பெறத் தோன்றலும்
    உரியது ஆகும் என்மனார் புலவர்
  kaandigai:
    porul: இரு வகைப் பிரிவும் நிலைபெறத் தோன்றுதலும் (நடுவுநிலைத் திணைக்கு) உரியது. எவை அவ்விரு வகை என்று இங்கே கூறவில்லை; பிரிவு வகைகள் 27, 35-இல் வருகின்றன (காண்க); அவையே இவை என நூல் கூறவில்லை (ஒருதலை அன்மை).
    ethu: 5-12 நிலம்/பொழுது முடிந்தது; இனி 'பிரிவு' — அது இருவகை; இரண்டும் நிலைபெறத் தோன்றலும் உரியது.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    class: இரு_வகை_பிரிவு
    property: நிலைபெற_தோன்றல்_உரிய
  links: []
  urai:
    iyaipu:
    - porul.12
    - porul.27
    - porul.30
    text: 'இயைபு (649): 27 பிரிவுக்கு மூன்று காரணம் (ஓதல்/பகை/தூது); 30 பிழைத்தது பிழையாது ஆகல். ''இரு வகைப் பிரிவு'' எவை என நூல் இங்கு பெயரிடவில்லை — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'இரு வகைப் பிரிவு' எவை என ஒருதலை அன்மை
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: இரு வகைப்
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்மனார்
- id: porul.14
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 14
  moolam: |-
    திணை மயக்குறுதலும் கடி நிலை இலவே
    நிலன் ஒருங்கு மயங்குதல் இல என மொழிப
    புலன் நன்கு உணர்ந்த புலமையோரே
  kaandigai:
    porul: திணைகள் ஒன்றோடொன்று மயங்குதல் விலக்கப்பட்டதன்று; ஆனால் நிலம் ஒருங்கே மயங்குவதில்லை என்பர் புலமையோர்.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 13 பிரிவு என்றது; திணை மயக்கம் எழுதலும் கடிநிலை இல்லை — இசைவு; ஆனால் நிலம் ஒருங்கு மயங்குதல் இல்லை.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: திணை_மயக்கம்
    ops:
    - திணை_மயக்கம்_விலக்கில்லை
    - நிலம்_மயக்கம்_இல்லை
  links: []
  urai:
    iyaipu:
    - porul.3
    - porul.15
    text: 'இயைபு (649): 3 திணை உறுப்புகள்; 15 உரிப்பொருள் அல்லன.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
  - peyar: தான் குறியிடுதல்
    saanru: என மொழிப
  - peyar: ஒருதலை அன்மை
    saanru: கடி நிலை
- id: porul.15
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 15
  moolam: |-
    உரிப்பொருள் அல்லன மயங்கவும் பெறுமே
  kaandigai:
    porul: உரிப்பொருள் அல்லாதவை (பொழுது, கரு) மயங்கவும் பெறும். 14-இன்படி நிலம் மயங்காது; "அல்லன" எவை என நூற்பா பெயரிடவில்லை (ஒருதலை அன்மை).
    ethu: 14 மயக்கம் என்றது; உரிப்பொருள் அல்லனவும் மயங்கிப் பெறும் — இசைவு (வரையறை இன்மை).
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    class: உரிப்பொருள்_அல்லன
    property: மயங்கும்
  links: []
  urai:
    iyaipu:
    - porul.14
    - porul.16
    text: 'இயைபு (649): 14 திணை மயக்கம்; 16 உரிப்பொருள்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக; காண்டிகை சுட்டிய ஐயம் ஒருதலை அன்மை
- id: porul.16
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 16
  moolam: |-
    புணர்தல் பிரிதல் இருத்தல் இரங்கல்
    ஊடல் அவற்றின் நிமித்தம் என்றிவை
    தேரும் காலை திணைக்கு உரிப்பொருளே
  kaandigai:
    porul: புணர்தல், பிரிதல், இருத்தல், இரங்கல், ஊடல், அவற்றின் நிமித்தம் — இவை திணைக்கு உரிப்பொருள். எந்தத் திணைக்கு எந்த உரிப்பொருள் என்ற பொருத்தம் இந்நூற்பாவில் இல்லை; வழக்கில் உள்ள பொருத்தம் பிறன் கோள்.
    en:
      kooruvathu: 6
      enniyathu: 6
    ethu: 3 உரிப்பொருள் என்றது; அது ஐந்து — புணர்தல், பிரிதல், இருத்தல், இரங்கல், ஊடல் — அவற்றின் நிமித்தமும் சேர்ந்து.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: உரிப்பொருள்
    count: 6
    items:
    - புணர்தல்
    - பிரிதல்
    - இருத்தல்
    - இரங்கல்
    - ஊடல்
    - அவற்றின்_நிமித்தம்
  links:
  - porul.17
  urai:
    iyaipu:
    - porul.3
    - porul.15
    - porul.17
    - porul.46
    text: 'இயைபு (649): 3 உரிப்பொருள்; 46 நிகழ்ந்தது நினைத்தல் — உரிப்பொருளின் தொடர்ச்சி. எண்: ஆறு (நூற்பா: 5 + நிமித்தம்) = 6 (பட்டியல்: 5 + 1).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.17
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 17
  moolam: |-
    கொண்டு தலைக்கழிதலும் பிரிந்து அவண் இரங்கலும்
    உண்டு என மொழிப ஓர் இடத்தான
  kaandigai:
    porul: தலைவியைக் கொண்டு (ஊரை விட்டு) நீங்குதலும், பிரிந்து அங்கே இரங்குதலும் ஓரிடத்தில் உண்டு என்பர். "ஓர் இடத்தான" — எத்திணை என்பது கூறப்படவில்லை. "உடன்போக்கு" என்ற சொல் நூலில் இல்லை; கற்பியல் 141 "புணர்ந்து உடன் போகிய" என்கிறது.
    ethu: 16 ஐந்து+நிமித்தம் என்றது; கொண்டு தலைக்கழிதலும் பிரிந்து அவண் இரங்கலும் — சில இடத்து உள.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    class: தலைக்கழிதல்_பிரிவு
    property: ஓர்_இடத்து_உண்டு
  links: []
  urai:
    iyaipu:
    - porul.16
    - porul.18
    text: 'இயைபு (649): 16 ஐந்து; 18 கலந்த பொழுது.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக; காண்டிகை சுட்டிய ஐயம் ஒருதலை அன்மை
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
  - peyar: தான் குறியிடுதல்
    saanru: என மொழிப
- id: porul.18
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 18
  moolam: |-
    கலந்த பொழுதும் காட்சியும் அன்ன
  kaandigai:
    porul: கலந்து வரும் பொழுதும் காட்சியும் அத்தன்மையன (மயங்கியும் வரும்).
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 17 கொண்டு தலைக்கழிதல் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: கலந்த_பொழுது
    property: மயங்கியும்_வரும்
  links: []
  urai:
    iyaipu:
    - porul.16
    - porul.17
    - porul.19
    text: 'இயைபு (649): 16 ஐந்து; 17 கொண்டு செல்லல்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.19
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 19
  moolam: |-
    முதல் எனப்படுவது ஆயிரு வகைத்தே
  kaandigai:
    porul: முதற்பொருள் அவ்விரு வகையே (நிலம், பொழுது) — 4-ஐ மீண்டும் உறுதிசெய்தல் (இறந்தது காத்தல், பொருள். 656).
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 4 முதல் என்றது; அது இருவகை — நிலம், பொழுது (4-இன் விரிவு).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: முதற்பொருள்
    count: 2
  links: []
  urai:
    iyaipu:
    - porul.3
    - porul.4
    - porul.20
    text: 'இயைபு (649): 4 ''நிலம் பொழுது இரண்டின் இயல்பு'' — இங்கே ''ஆயிரு வகைத்தே'' என்பது அதன் விரிவு. 20 கரு. எண்: இரண்டு (நூற்பா) = இரண்டு (நிலம், பொழுது).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தான் குறியிடுதல்
    saanru: எனப்படுவது
- id: porul.20
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 20
  moolam: |-
    தெய்வம் உணாவே மா மரம் புள் பறை
    செய்தி யாழின் பகுதியொடு தொகைஇ
    அவ் வகை பிறவும் கரு என மொழிப
  kaandigai:
    porul: தெய்வம், உணவு, மா (விலங்கு), மரம், புள், பறை, செய்தி (தொழில்), யாழ் — இவற்றின் பகுதியோடு தொகுத்து, அவ்வகைப் பிற பொருள்களும் கருப்பொருள் என்பர்.
    en:
      kooruvathu: 8
      enniyathu: 8
    ethu: 19 முதல் இரு என்றது; 'கரு' (இன்னொரு உறுப்பு) பல — தெய்வம், உணா, மாமரம், புள், பறை, செய்தி, யாழின் பகுதி, பிறவும்.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: enumeration
    class: கருப்பொருள்
    count: 8
    items:
    - தெய்வம்
    - உணவு
    - மா
    - மரம்
    - புள்
    - பறை
    - செய்தி
    - யாழ்
  links:
  - porul.21
  urai:
    iyaipu:
    - porul.3
    - porul.19
    - porul.21
    text: 'இயைபு (649): 3 கரு; 19 முதல். ''அவ் வகை பிறவும்'' — எவை என நூல் விரிக்கவில்லை — ஒருதலை அன்மை. எண்: 6 (தெய்வம், உணா, மாமரம், புள், பறை, செய்தி) + யாழ்-பகுதி + ''பிறவும்''.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'அவ் வகை பிறவும்' ஒருதலை அன்மை
  utthi:
  - peyar: வந்தது கொண்டு வாராதது உணர்த்தல்
    saanru: பிறவும்
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
  - peyar: தான் குறியிடுதல்
    saanru: என மொழிப
- id: porul.21
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 21
  moolam: |-
    எந் நில மருங்கின் பூவும் புள்ளும்
    அந் நிலம் பொழுதொடு வாரா ஆயினும்
    வந்த நிலத்தின் பயத்த ஆகும்
  kaandigai:
    porul: எந்த நிலத்துப் பூவும் புள்ளும், அந்நிலத்துக்குரிய பொழுதோடு வாராவிட்டாலும், வந்த நிலத்தின் பயனுடையனவாகும் (வந்த நிலத்துக்கே உரியனவாகக் கொள்ளப்படும்).
    ethu: 20 கரு என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: பூ_புள்
    property: வந்த_நிலத்தின்_பயன்
  links: []
  urai:
    iyaipu:
    - porul.20
    - porul.5
    text: 'இயைபு (649): 20 கரு; 5 நான்கு நிலம்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.22
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 22
  moolam: |-
    பெயரும் வினையும் என்று ஆயிரு வகைய
    திணைதொறும் மரீஇய திணை நிலைப் பெயரே
  kaandigai:
    porul: திணைதொறும் வழங்கி வரும் திணைநிலைப் பெயர் பெயர், வினை (தொழில்) என இரு வகையன.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 3 மூன்று உறுப்புகள் என்றது; இனி திணை-நிலைப் பெயர் (திணையின் இயல்பான பெயர்) — பெயர், வினை என இருவகை.
    eduthukkaattu:
    - text: ஆயர் வேட்டுவர்
      from: porul.23
  nilai: நூலில் நேரடியாக
  kanini:
    kind: classification
    class: திணைநிலைப்பெயர்
    count: 2
    items:
    - பெயர்
    - வினை
  links: []
  urai:
    iyaipu:
    - porul.23
    - porul.24
    - porul.25
    - porul.26
    text: 'இயைபு (649): ''ஆயர் வேட்டுவர்'' (பொருள். 23) — இரு திணை-நிலைப் பெயர் (ஆடூஉத் திணையின்). 24 ஏனோர்; 25 அடியோர்/வினைவலர்; 26 ஏவல் மரபினர். எண்: இரண்டு (நூற்பா) = இரண்டு (பெயர், வினை).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.23
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 23
  moolam: |-
    ஆயர் வேட்டுவர் ஆடூஉத் திணைப் பெயர்
    ஆவயின் வரூஉம் கிழவரும் உளரே
  kaandigai:
    porul: ஆயர், வேட்டுவர் — ஆண்பால் திணைப்பெயர்கள்; அந்நிலத்து வரும் கிழவரும் (தலைவரும்) உளர்.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 22 திணை-நிலைப் பெயர் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: திணைப்பெயர்
    count: 2
    items:
    - ஆயர்
    - வேட்டுவர்
  links: []
  urai:
    iyaipu:
    - porul.22
    - porul.24
    - sol.164
    text: 'இயைபு (649): 22 திணை-நிலைப் பெயர்; 24 ஏனோர். ''ஆயர் வேட்டுவர்'' (23) 22-இன் எடுத்துக்காட்டு; சொல். 164 உயர்திணைப் பெயர் வரிசை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.24
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 24
  moolam: |-
    ஏனோர் மருங்கினும் எண்ணும் காலை
    ஆனா வகைய திணை நிலைப் பெயரே
  kaandigai:
    porul: பிறர் பக்கத்தும் எண்ணிப் பார்க்கும்போது திணைநிலைப் பெயர்கள் அளவிறந்தன.
    ethu: 23 ஆயர்/வேட்டுவர் என்றது; ஏனோர் மருங்கினும் எண்ணும்காலை ஆனா வகைய திணை-நிலைப் பெயர் உள.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    class: திணைநிலைப்பெயர்
    property: அளவிறந்தன
  links: []
  urai:
    iyaipu:
    - porul.22
    - porul.23
    - porul.25
    text: 'இயைபு (649): 23 ஆயர்/வேட்டுவர்; 25 அடியோர்/வினைவலர். ''ஆனா வகைய'' — எவை என நூல் விரிக்கவில்லை — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'ஆனா வகைய' ஒருதலை அன்மை
- id: porul.25
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 25
  moolam: |-
    அடியோர் பாங்கினும் வினைவலர் பாங்கினும்
    கடிவரை இல புறத்து என்மனார் புலவர்
  kaandigai:
    porul: அடியோர் பக்கத்தும் வினைவலர் பக்கத்தும் (வரும் ஒழுக்கம்) புறத்தே விலக்கப்படாது என்பர். இவர் அகத்தின் தலைமக்களா என்பதை இந்நூற்பா நேரடியாகக் கூறவில்லை; 26 தொடர்ச்சி.
    ethu: 24 ஏனோர் என்றது; அடியோர் பாங்கினும் வினைவலர் பாங்கினும் கடிவரை (கட்டுப்பாடு) இல்லை — புறத்து.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    class: அடியோர்_வினைவலர்
    property: புறம்_விலக்கில்லை
  links: []
  urai:
    iyaipu:
    - porul.24
    - porul.26
    text: 'இயைபு (649): 24 ஏனோர்; 26 ஏவல் மரபு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக; காண்டிகை சுட்டிய ஐயம் ஒருதலை அன்மை
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்மனார்
  - peyar: ஒருதலை அன்மை
    saanru: கடிவரை
- id: porul.26
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 26
  moolam: |-
    ஏவல் மரபின் ஏனோரும் உரியர்
    ஆகிய நிலைமை அவரும் அன்னர்
  kaandigai:
    porul: ஏவல் மரபில் உள்ள பிறரும் உரியர்; அந்நிலைமையில் உள்ளோரும் அத்தன்மையரே.
    ethu: 25 அடியோர்/வினைவலர் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ஏவல்_மரபினர்
    property: உரியர்
  links: []
  urai:
    iyaipu:
    - porul.25
    - porul.27
    text: 'இயைபு (649): 25 அடியோர்/வினைவலர்; 27 ஓதல்/பகை/தூது.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.27
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 27
  moolam: |-
    ஓதல் பகையே தூது இவை பிரிவே
  kaandigai:
    porul: 'பிரிவு: ஓதல், பகை, தூது. பொருள்வயின் பிரிவு 35-இல் தனியே வருகிறது.'
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: 26 ஏவல் மரபு என்றது; இனி 'பிரிவு' — ஓதல், பகை, தூது மூன்றும் பிரிவுக்குக் காரணம்.
    eduthukkaattu:
    - text: தூது இடையிட்ட
      from: porul.44
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: பிரிவு
    count: 3
    items:
    - ஓதல்
    - பகை
    - தூது
  links:
  - porul.28
  - porul.29
  urai:
    iyaipu:
    - porul.13
    - porul.28
    - porul.44
    text: 'இயைபு (649): ''தூது இடையிட்ட'' (பொருள். 44) — தூது பிரிவுக்கு இடையூறாக வருவதைக் காட்டுகிறது. 13 இரு வகைப் பிரிவு; 28 ஓதல்/தூது. எண்: நூற்பா எண் கூறவில்லை; பட்டியல் மூன்று (ஓதல், பகை, தூது).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.28
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 28
  moolam: |-
    அவற்றுள்
    ஓதலும் தூதும் உயர்ந்தோர் மேன
  kaandigai:
    porul: அவற்றுள் ஓதலும் தூதும் உயர்ந்தோர்க்கு உரியன.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 27 மூன்று என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ஓதல்_தூது
    property: உயர்ந்தோர்_உரிமை
  links: []
  urai:
    iyaipu:
    - porul.27
    - porul.29
    text: 'இயைபு (649): 27 மூன்று; 29 வேந்தன்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: அதிகார முறை
    saanru: அவற்றுள்
- id: porul.29
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 29
  moolam: |-
    தானே சேறலும் தன்னொடு சிவணிய
    ஏனோர் சேறலும் வேந்தன் மேற்றே
  kaandigai:
    porul: தானே செல்லுதலும், தன்னோடு பொருந்திய பிறர் செல்லுதலும் வேந்தனுக்கு உரியது. எப்பிரிவு என நூற்பா பெயரிடவில்லை (ஒருதலை அன்மை; காண்க 27, 28).
    ethu: 28 ஓதல்/தூது என்றது; தானே சேறலும் தன்னொடு சிவணிய ஏனோர் சேறலும் வேந்தன் மேற்றே.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    class: வேந்தன்_சேறல்
    property: வேந்தன்_உரிமை
  links: []
  urai:
    iyaipu:
    - porul.27
    - porul.30
    - porul.37
    text: 'இயைபு (649): 27 பிரிவு; 30 மேவிய சிறப்பின் ஏனோர்; 37 முந்நீர் வழக்கம்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக; காண்டிகை சுட்டிய ஐயம் ஒருதலை அன்மை
- id: porul.30
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 30
  moolam: |-
    மேவிய சிறப்பின் ஏனோர் படிமைய
    முல்லை முதலாச் சொல்லிய முறையான்
    பிழைத்தது பிழையாது ஆகல் வேண்டியும்
    இழைத்த ஒண் பொருள் முடியவும் பிரிவே
  kaandigai:
    porul: சிறப்புப் பொருந்திய பிறரும் (அவ்வியல்பின் படிமையர்), முல்லை முதலாகச் சொன்ன முறையில், பிழைத்ததைப் பிழையாததாக்க வேண்டியும், முயன்ற ஒள்ளிய பொருள் முடியவும் பிரிதல் உண்டு.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 29 வேந்தன் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: பிரிவு
    ops:
    - பிழைத்தது_பிழையாதாக்க
    - பொருள்_முடிக்க
  links: []
  urai:
    iyaipu:
    - porul.29
    - porul.13
    - porul.35
    text: 'இயைபு (649): 29 வேந்தன்; 13 இரு வகைப் பிரிவு; 35 பொருள்வயின் பிரிதல்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: முறை பிறழாமை
    saanru: முறையான்
  - peyar: கூறிற்று என்றல்
    saanru: சொல்லிய
- id: porul.31
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 31
  moolam: |-
    மேலோர் முறைமை நால்வர்க்கும் உரித்தே
  kaandigai:
    porul: மேலோர் முறைமை நால்வர்க்கும் உரித்து. "நால்வர்" யார் என இங்கே கூறவில்லை; பொருள். 197, 198, 220-இலும் "நால்வர்" வருகிறது. யார் என்ற அடையாளம் பிறன் கோள்.
    ethu: 30 பிரிவு என்றது; மேலோர் முறைமை நால்வர்க்கும் உரித்து. நால்வர் யார் என இந்நூற்பா பெயரிடவில்லை; மரபியலில் அந்தணர் (615), அரசர் (616), வைசிகன் (622), வேளாண் மாந்தர் (625) என நால்வர் தனித்தனியே வருகின்றனர்.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    class: மேலோர்_முறைமை
    count: 4
    items_not_named: true
  links: []
  urai:
    iyaipu:
    - porul.30
    - porul.32
    - porul.615
    - porul.616
    - porul.622
    - porul.625
    text: 'இயைபு (649): 30 பிரிவு; 32 மன்னர் பாங்கு; 615, 616, 622, 625 — மரபியலில் வரும் நால்வர். 31-இன் ''நால்வர்'' இவரே எனக் கொள்வது ஒருதலை அன்மை — இங்கு நூல் பெயர் சுட்டவில்லை. எண்: நான்கு (நூற்பா ''நால்வர்''). எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; நால்வர் யார் என்பது ஒருதலை அன்மை
  utthi:
  - peyar: முறை பிறழாமை
    saanru: முறைமை
  - peyar: ஒருதலை அன்மை
    saanru: உரித்தே
- id: porul.32
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 32
  moolam: |-
    மன்னர் பாங்கின் பின்னோர் ஆகுப
  kaandigai:
    porul: மன்னர் பக்கத்தில் பின்னிலையில் உள்ளோரும் (அதற்கு) ஆவர்.
    ethu: 31 நால்வர் என்றது; மன்னர் பாங்கின் பின்னோர் ஆகுப — 'பின்னோர்' மன்னர் பக்கத்தராகக் கொள்ளப்படுவர்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: மன்னர்_பங்கு
    property: பின்னோரும்_ஆவர்
  links: []
  urai:
    iyaipu:
    - porul.31
    - porul.33
    text: 'இயைபு (649): 31 நால்வர்; 33 உயர்ந்தோர் ஓத்து.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.33
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 33
  moolam: |-
    உயர்ந்தோர்க்கு உரிய ஓத்தினான
  kaandigai:
    porul: உயர்ந்தோர்க்கு உரிய ஓத்தின் (கல்வியின்) வழியே.
    ethu: 32 பின்னோர் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ஓத்து_வழி
    property: உயர்ந்தோர்_உரிய
  links: []
  urai:
    iyaipu:
    - porul.32
    - porul.34
    text: 'இயைபு (649): 32 பின்னோர்; 34 வேந்து வினை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.34
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 34
  moolam: |-
    வேந்து வினை இயற்கை வேந்தன் ஒரீஇய
    ஏனோர் மருங்கினும் எய்து இடன் உடைத்தே
  kaandigai:
    porul: வேந்தனுக்குரிய வினையின் இயல்பு வேந்தனை ஒழிந்த பிறர் பக்கத்தும் அடையும் இடம் உண்டு.
    ethu: 33 உயர்ந்தோர் என்றது; வேந்து வினை இயற்கை வேந்தன் ஒரீஇ ஏனோர் மருங்கினும் எய்து இடனுடைத்து — அரசன் அல்லாத ஏனோருக்கும் இடம் உண்டு.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: வேந்து_வினை
    property: பிறர்_பக்கமும்_எய்தும்
  links: []
  urai:
    iyaipu:
    - porul.33
    - porul.35
    text: 'இயைபு (649): 33 உயர்ந்தோர்; 35 பொருள்வயின் பிரிதல்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.35
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 35
  moolam: |-
    பொருள்வயின் பிரிதலும் அவர்வயின் உரித்தே
  kaandigai:
    porul: பொருள்வயின் பிரிதலும் அவர்க்கு உரியது.
    ethu: 34 வேந்து வினை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: பொருள்வயின்_பிரிவு
    property: உரிமை
  links: []
  urai:
    iyaipu:
    - porul.34
    - porul.36
    text: 'இயைபு (649): 34 ஏனோர் இடம்; 36 உயர்ந்தோர் ஒழுக்கம்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: உரித்தே
- id: porul.36
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 36
  moolam: |-
    உயர்ந்தோர் பொருள்வயின் ஒழுக்கத்தான
  kaandigai:
    porul: உயர்ந்தோர் பொருள்வயின் (பிரியும்போது) ஒழுக்கத்தின் வழியே.
    ethu: 35 பொருள்வயின் பிரிதல் என்றது; உயர்ந்தோர் பொருள்வயின் ஒழுக்கத்தான — பொருளுக்காகப் பிரிவது அவர் ஒழுக்கம்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: உயர்ந்தோர்_பிரிவு
    property: ஒழுக்க_வழி
  links: []
  urai:
    iyaipu:
    - porul.35
    - porul.37
    text: 'இயைபு (649): 35 பொருள்வயின்; 37 முந்நீர் வழக்கம்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.37
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 37
  moolam: |-
    முந்நீர் வழக்கம் மகடூஉவொடு இல்லை
  kaandigai:
    porul: கடல் கடந்து செல்லும் வழக்கம் மகளிரோடு இல்லை.
    ethu: 36 உயர்ந்தோர் ஒழுக்கம் என்றது; முந்நீர் வழக்கம் (கடல் வழிச் செலவு) மகடூஉவொடு இல்லை — தலைவியொடு கூடிக் கடல் வழிச் செல்லல் இல்லை.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: முந்நீர்_வழக்கம்
    property: மகளிரோடு_இல்லை
  links: []
  urai:
    iyaipu:
    - porul.36
    - porul.30
    text: 'இயைபு (649): 36 உயர்ந்தோர் ஒழுக்கம்; 30 பிரிவின் இயல்பு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.38
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 38
  moolam: |-
    எத்திணை மருங்கினும் மகடூஉ மடல்மேல்
    பொற்புடை நெறிமை இன்மையான
  kaandigai:
    porul: எத்திணையிலும் மகளிர் மடல் ஏறுதல் இல்லை; அது பொற்புடைய நெறி அன்மையால். மடல் ஏறுதல் பெருந்திணைக் குறிப்பு (54).
    ethu: 37 முந்நீர் வழக்கம் என்றது; எத்திணை மருங்கினும் மகடூஉ மடல்மேல் பொற்புடை நெறிமை இல்லை — பெண்கள் மடல் ஏறுதல் இல்லை.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: மடல்_ஏற்றம்
    property: மகளிருக்கு_இல்லை
  links: []
  urai:
    iyaipu:
    - porul.37
    - porul.53
    - porul.54
    text: 'இயைபு (649): 37 முந்நீர் வழக்கம்; 53 கைக்கிளை, 54 பெருந்திணை — மடல் இவற்றின் குறிப்பு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.39
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 39
  moolam: |-
    தன்னும் அவனும் அவளும் சுட்டி
    மன்னும் நிமித்தம் மொழிப் பொருள் தெய்வம்
    நன்மை தீமை அச்சம் சார்தல் என்று
    அன்ன பிறவும் அவற்றொடு தொகைஇ
    முன்னிய காலம் மூன்றுடன் விளக்கி
    தோழி தேஎத்தும் கண்டோர் பாங்கினும்
    போகிய திறத்து நற்றாய் புலம்பலும்
    ஆகிய கிளவியும் அவ் வழி உரிய
  kaandigai:
    porul: '(தலைவி தலைவனோடு) சென்ற நிலையில் நற்றாய் புலம்பல்: தன்னையும் அவனையும் அவளையும் சுட்டி, நிமித்தம், சொல், பொருள், தெய்வம், நன்மை, தீமை, அச்சம், சார்தல் முதலியவற்றோடு, மூன்று காலத்தையும் விளக்கி, தோழியிடத்தும் கண்டோரிடத்தும் கூறும் கிளவிகள் அவ்விடத்துக்கு உரியன.'
    en:
      kooruvathu: 9
      enniyathu: 9
    ethu: 38 மடல் என்றது; தோழி, தாய், கண்டோர் — தலைவன்-தலைவி-செய்தி, தெய்வம், நன்மை-தீமை, அச்சம் — இவற்றின் கூற்று; மூன்று காலமும் விளக்கி தோழி/தேஎம்/கண்டோர்/நற்றாய் — இவற்றின் பங்கு.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: நற்றாய்_புலம்பல்
    contexts:
    - தோழி
    - கண்டோர்
    components:
    - தன்/அவன்/அவள்
    - நிமித்தம்
    - சொல்
    - பொருள்
    - தெய்வம்
    - நன்மை
    - தீமை
    - அச்சம்
    - சார்தல்
  links: []
  urai:
    iyaipu:
    - porul.40
    - porul.42
    - porul.43
    - porul.191
    text: 'இயைபு (649): 40-44 இதன் விரிவு; 191 வாயில்கள்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: மூன்றுடன்
  - peyar: வந்தது கொண்டு வாராதது உணர்த்தல்
    saanru: பிறவும்
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப்
- id: porul.40
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 40
  moolam: |-
    ஏமப் பேரூர்ச் சேரியும் சுரத்தும்
    தாமே செல்லும் தாயரும் உளரே
  kaandigai:
    porul: காவலுடைய பேரூர்ச் சேரியிலும் சுரத்திலும் (தேடித்) தாமே செல்லும் தாயரும் உளர்.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 39 தோழி/கண்டோர் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: தாயர்_செல்லுதல்
    contexts:
    - பேரூர்
    - சுரம்
  links: []
  urai:
    iyaipu:
    - porul.39
    - porul.41
    text: 'இயைபு (649): 39 பங்கு; 41 அயலோர் அகற்சி.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.41
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 41
  moolam: |-
    அயலோர் ஆயினும் அகற்சி மேற்றே
  kaandigai:
    porul: அயலோர் ஆயினும் (அவர் கூற்று) பிரிவு (அகற்சி) பற்றியதே.
    ethu: 40 தாயர் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: அயலோர்_கூற்று
    property: அகற்சி_பற்று
  links: []
  urai:
    iyaipu:
    - porul.40
    - porul.42
    text: 'இயைபு (649): 40 தாயர்; 42 தலைவர்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.42
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 42
  moolam: |-
    தலைவரும் விழும நிலை எடுத்து உரைப்பினும்
    போக்கற்கண்ணும் விடுத்தற்கண்ணும்
    நீக்கலின் வந்த தம் உறு விழுமமும்
    வாய்மையும் பொய்ம்மையும் கண்டோற் சுட்டித்
    தாய் நிலை நோக்கித் தலைப்பெயர்த்துக் கொளினும்
    நோய் மிகப் பெருகித் தன் நெஞ்சு கலுழ்ந்தோளை
    அழிந்தது களை என மொழிந்தது கூறி
    வன்புறை நெருங்கி வந்ததன் திறத்தொடு
    என்று இவை எல்லாம் இயல்புற நாடின்
    ஒன்றித் தோன்றும் தோழி மேன
  kaandigai:
    porul: 'தோழி கூற்றுக்குரிய இடங்கள்: தலைவனுக்கு வரும் துன்ப நிலையை எடுத்துரைத்தல், (தலைவியைப்) போக்குதல், விடுத்தல், நீக்கத்தால் தமக்கு வந்த துன்பம், கண்டோரைச் சுட்டி வாய்மையும் பொய்ம்மையும் கூறல், தாய் நிலை நோக்கி மீட்டுக் கொள்ளல், நோயால் நெஞ்சு கலங்கியவளை ஆற்றுவித்தல், வன்புறை (வலியுறுத்தல்) — இவை எல்லாம் தோழிக்கு உரியன.'
    en:
      kooruvathu: 8
      enniyathu: 8
    ethu: 41 அகற்சி என்றது; தலைவரும் விழும நிலை எடுத்து உரைப்பினும் — தோழி தலைவன் நிலை, தலைவி கையறு நிலை, தாய் நிலை — இவற்றால் தோழிக்கு உரிய.
  nilai: நூலில் நேரடியாக
