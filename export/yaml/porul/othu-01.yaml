    நிகழ்ந்தது நினைத்தற்கு ஏதுவும் ஆகும்
  kaandigai:
    porul: (இக்கூற்றுகள்) நிகழ்ந்ததை நினைப்பதற்குக் காரணமாகவும் ஆகும்.
    ethu: 45 முடிந்தது; நிகழ்ந்தது நினைத்தற்கு ஏதுவும் ஆகும் — பழைய நிகழ்வு நினைவுக்குக் காரணம்.
  nilai: நூலில் நேரடியாக
