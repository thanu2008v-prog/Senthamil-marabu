    saanru: இரு வகையொடு
- id: porul.45
  pindam: 1
  padalam: porul
  othu: 1
  sutra: 45
  moolam: |-
    எஞ்சியோர்க்கும் எஞ்சுதல் இலவே
  kaandigai:
    porul: (இங்குக் கூறாத) எஞ்சியோர்க்கும் (கூற்றுக்குரிய இடம்) எஞ்சுதல் இல்லை — அவர்க்கும் உண்டு.
    ethu: 44 கிழவோன் மேன என்றது; எஞ்சியோர்க்கும் (மீதமான வாயில்களுக்கும்) எஞ்சுதல் இல்லை.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: எஞ்சியோர்
    property: எஞ்சுதல்_இல
  links: []
  urai:
    iyaipu:
    - porul.44
    - porul.46
    text: 'இயைபு (649): 44 கிழவோன்; 46 நிகழ்ந்தது.'
