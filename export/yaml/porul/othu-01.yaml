    iyaipu:
    - porul.42
    - porul.43
    - porul.105
    text: 'இயைபு (649): 42 தலைவர்; 43 கண்டோர்; 105 இரு வகைக் குறி. இஃது நீண்ட நூற்பா (24 அடி); ''ஒரு திறத்தானும்'' இருமுறை வருகிறது.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'ஒரு திறத்தானும்' பல முறை — எவை என்பது விரிவில்
  utthi:
