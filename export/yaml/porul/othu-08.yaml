    saanru: ஒக்கும்
- id: porul.448
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 448
  moolam: |-
    முதல் தொடை பெருகிச் சுருங்குமன் எண்ணே
  kaandigai:
    porul: எண் முதல் தொடை பெருகிப் பின் சுருங்கும்.
    ethu: 447 வாரம் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: en_ilaippu
    count: null
  links: []
  urai:
    iyaipu:
    - porul.444
    - porul.447
    - porul.449
    text: 'இயைபு (649): 444 வண்ணகம்; 447 வாரம்; 449 எண் இடை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.449
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 449
  moolam: |-
    எண் இடை ஒழிதல் ஏதம் இன்றே
    சின்னம் அல்லாக் காலையான
  kaandigai:
    porul: சின்னம் அல்லாத காலத்து எண் இடையே ஒழிதல் குற்றமன்று.
    ethu: 448 எண் என்றது; எண் இடை ஒழிதல் ஏதம் இன்றே — எண் இடையில் விடுபட்டாலும் குற்றமில்லை (வரையறை இன்மை).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: exception
    class: en_ilaippu_vilakku
    count: null
  links: []
  urai:
    iyaipu:
    - porul.448
    - porul.450
    text: 'இயைபு (649): 448 எண்; 450 ஒருபோகு.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'ஏதம் இன்றே' — இசைவு (வரையறை இன்மை)
- id: porul.450
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 450
  moolam: |-
    ஒருபோகு இயற்கையும் இரு வகைத்து ஆகும்
  kaandigai:
    porul: ஒருபோகும் இருவகை.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 449 என்றது; ஒருபோகு 2 வகை — கொச்சக ஒருபோகு, அம்போதரங்கம்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: classification
    class: orupoku_vagai
    count: 2
  links: []
  urai:
    iyaipu:
    - porul.443
    - porul.449
    - porul.451
    text: 'இயைபு (649): 443 ஒருபோகு; 449 எண்; 451 வகை. எண்: 2.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: இரு வகைத்து
- id: porul.451
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 451
  moolam: |-
    கொச்சக ஒருபோகு அம்போதரங்கம் என்று
    ஒப்ப நாடி உணர்தல் வேண்டும்
  kaandigai:
    porul: கொச்சக ஒருபோகு, அம்போதரங்கம் என்று ஆராய்ந்து உணர வேண்டும்.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 450 என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: classification
    class: orupoku_vagai
    count: 2
  links: []
  urai:
    iyaipu:
    - porul.450
    - porul.452
    - porul.454
    text: 'இயைபு (649): 450 2; 452 கொச்சக ஒருபோகு; 454 அம்போதரங்கம்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஆணை கூறல்
    saanru: வேண்டும்
- id: porul.452
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 452
  moolam: |-
    தரவு இன்று ஆகித் தாழிசை பெற்றும்
    தாழிசை இன்றித் தரவு உடைத்து ஆகியும்
    எண் இடை இட்டுச் சின்னம் குன்றியும்
    அடக்கியல் இன்றி அடி நிமிர்ந்து ஒழுகியும்
    யாப்பினும் பொருளினும் வேற்றுமை உடையது
    கொச்சக ஒருபோகு ஆகும் என்ப
  kaandigai:
    porul: தரவின்றித் தாழிசை பெற்றும், தாழிசையின்றித் தரவுடையதாகியும், எண் இடையிட்டுச் சின்னம் குன்றியும், அடக்கியலின்றி அடி நீண்டும், யாப்பிலும் பொருளிலும் வேறுபாடு உடையது கொச்சக ஒருபோகு.
    en:
      kooruvathu: null
      enniyathu: 4
    ethu: 451 கொச்சக ஒருபோகு என்றது; தரவின்றி ஆகித் தாழிசை பெற்றும், தாழிசை இன்றித் தரவுடைத்தாகியும் — பல வழிகளில் வேற்றுமை உடையது.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: meta
    class: kochchaka_orupoku_structure
    count: 4
  links: []
  urai:
    iyaipu:
    - porul.451
    - porul.453
    - porul.457
    text: 'இயைபு (649): 451 ஒப்ப; 453 ஒருபான்; 457 பாநிலை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: porul.453
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 453
  moolam: |-
    ஒருபான் சிறுமை இரட்டி அதன் உயர்பே
  kaandigai:
    porul: அதன் சிறுமை பத்து (ஒருபான்); உயர்வு அதன் இரட்டி (இருபது). அடியா சீரா என்பது நூற்பாவில் இல்லை (ஒருதலை அன்மை).
    ethu: 452 என்றது; ஒருபான் சிறுமை இரட்டி அதன் உயர்பே — 'ஒருபான்' சிறுமை; அதன் இரட்டி உயர்பு.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    class: ambotharangam_alavu
    count: null
  links: []
  urai:
    iyaipu:
    - porul.452
    - porul.454
    text: 'இயைபு (649): 452 வேற்றுமை; 454 அம்போதரங்கம். ''இரட்டி'' — எவ்வாறு என்பது வாசிப்பு ஐயம்.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'இரட்டி' — எண் கணக்கு ஒருதலை அன்மை
- id: porul.454
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 454
  moolam: |-
    அம்போதரங்கம் அறுபதிற்று அடித்தே
    செம்பால் வாரம் சிறுமைக்கு எல்லை
  kaandigai:
    porul: அம்போதரங்கம் அறுபது அடியது; செம்பால் வாரம் சிறுமைக்கு எல்லை.
    en:
      kooruvathu: 60
      enniyathu: 60
    ethu: கொச்சக ஒருபோகும் அம்போதரங்கமும் ஒருங்கே கூறப்பட்டன (பொருள். 451); முன் சூத்திரம் அளவு தந்தது — "ஒருபான் சிறுமை இரட்டி அதன் உயர்பே" (பொருள். 453). அம்போதரங்கத்துக்குத் தனி அளவு இங்கே; செய்யுளுக்கு அடி அளவு "அளவு இயல்" (பொருள். 310) உறுப்பு.
    eduthukkaattu:
    - text: ஒருபான் சிறுமை இரட்டி அதன் உயர்பே
      from: porul.453
    - text: அளவு இயல்
      from: porul.310
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ambotharangam_alavu
    count: 60
  links: []
  urai:
    iyaipu:
    - porul.451
    - porul.453
    - porul.455
    text: 'இயைபு (649): 451 அம்போதரங்கம்; 453 இரட்டி; 455 எருத்து. எண்: 60 அடி.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.455
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 455
  moolam: |-
    எருத்தே கொச்சகம் அராகம் சிற்றெண்
    அடக்கியல் வாரமொடு அந் நிலைக்கு உரித்தே
  kaandigai:
    porul: எருத்து, கொச்சகம், அராகம், சிற்றெண், அடக்கியல் வாரம் ஆகியவை அந்நிலைக்கு உரியன.
    en:
      kooruvathu: null
      enniyathu: 5
    ethu: 454 என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: classification
    class: ambotharangam_uruppu
    count: 5
  links: []
  urai:
    iyaipu:
    - porul.426
    - porul.454
    - porul.456
    text: 'இயைபு (649): 426 எருத்து; 454 அம்போதரங்கம்; 456 கலிவெண்பாட்டு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: உரித்தே
- id: porul.456
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 456
  moolam: |-
    ஒரு பொருள் நுதலிய வெள்ளடி இயலான்
    திரிபு இன்றி வருவது கலிவெண்பாட்டே
  kaandigai:
    porul: ஒரு பொருள் கருதிய வெள்ளடி இயலால் திரிபின்றி வருவது கலிவெண்பாட்டு.
    ethu: 455 எருத்து என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: kalivenpattu
    count: null
  links: []
  urai:
    iyaipu:
    - porul.435
    - porul.455
    - porul.457
    text: 'இயைபு (649): 435 கலிவெண்பாட்டு; 455 எருத்து; 457 பாநிலை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.457
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 457
  moolam: |-
    தரவும் போக்கும் பாட்டு இடை மிடைந்தும்
    ஐஞ் சீர் அடுக்கியும் ஆறு மெய் பெற்றும்
    வெண்பா இயலான் வெளிப்படத் தோன்றும்
    பாநிலை வகையே கொச்சகக் கலி என
    நூல் நவில் புலவர் நுவன்று அறைந்தனரே
  kaandigai:
    porul: தரவும் போக்கும் பாட்டும் இடையிடையே கலந்தும், ஐஞ்சீர் அடுக்கியும், ஆறு மெய் பெற்றும், வெண்பா இயலால் வெளிப்படத் தோன்றும் பாநிலை கொச்சகக் கலி.
    en:
      kooruvathu: null
      enniyathu: 4
    ethu: 456 கலிவெண்பாட்டு என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: meta
    class: kochchak_kali_structure
    count: 4
  links: []
  urai:
    iyaipu:
    - porul.435
    - porul.456
    - porul.458
    text: 'இயைபு (649): 435 கலி 4; 456 கலிவெண்பாட்டு; 458 உறழ்கலி.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: ஆறு
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: புலவர்
- id: porul.458
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 458
  moolam: |-
    கூற்றும் மாற்றமும் இடை இடை மிடைந்தும்
    போக்கு இன்றாகல் உறழ்கலிக்கு இயல்பே
  kaandigai:
    porul: கூற்றும் மாற்றமும் இடையிடையே கலந்து, போக்கு இல்லாதது உறழ்கலியின் இயல்பு.
    ethu: 457 பாநிலை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: urazhkali
    count: null
  links: []
  urai:
    iyaipu:
    - porul.435
    - porul.457
    - porul.459
    text: 'இயைபு (649): 435 கலி; 457 பாநிலை; 459 ஆசிரிய எல்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: உறழ்கலிக்கு
- id: porul.459
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 459
  moolam: |-
    ஆசிரியப் பாட்டின் அளவிற்கு எல்லை
    ஆயிரம் ஆகும் இழிபு மூன்று அடியே
  kaandigai:
    porul: ஆசிரியப்பாவின் அளவு எல்லை ஆயிரம் அடி; இழிபு மூன்று அடி.
    en:
      kooruvathu: 1000
      enniyathu: 1000
    ethu: 458 உறழ்கலி என்றது; ஆசிரியப் பாட்டின் அளவு எல்லை 1000, இழிபு 3 அடி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: aasiriyappa_alavu
    count: 1000
  links: []
  urai:
    iyaipu:
    - porul.365
    - porul.458
    - porul.460
    text: 'இயைபு (649): 365 கலி அடி; 458 உறழ்கலி; 460 நெடுவெண்பா. எண்: 1000, 3.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: மூன்று
- id: porul.460
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 460
  moolam: |-
    நெடுவெண்பாட்டே முந் நால் அடித்தே
    குறுவெண்பாட்டின் அளவு எழு சீரே
  kaandigai:
    porul: நெடுவெண்பாட்டு பன்னிரண்டு (முந்நால்) அடி; குறுவெண்பாட்டின் அளவு ஏழு சீர்.
    en:
      kooruvathu: 12
      enniyathu: 12
    ethu: 459 ஆசிரிய அளவு என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: venpaa_alavu
    count: 12
  links: []
  urai:
    iyaipu:
    - porul.423
    - porul.459
    - porul.461
    text: 'இயைபு (649): 423 வெண்பா; 459 எல்லை; 461 அங்கதம். ''முந் நால்'' = மூன்று நான்கு — பன்னிரண்டு (''முந்நீர்'' (37) போல ''முந்'' = மூன்று).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.461
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 461
  moolam: |-
    அங்கதப் பாட்டு அளவு அவற்றொடு ஒக்கும்
  kaandigai:
    porul: அங்கதப் பாட்டின் அளவும் அவற்றோடு ஒக்கும்.
    ethu: 460 என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: angatham_alavu
    count: null
  links: []
  urai:
    iyaipu:
    - porul.423
    - porul.429
    - porul.460
    text: 'இயைபு (649): 423 வெண்பா; 429 அங்கதம்; 460 அளவு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒப்பக் கூறல்
    saanru: ஒக்கும்
- id: porul.462
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 462
  moolam: |-
    கலிவெண்பாட்டே கைக்கிளைச் செய்யுள்
    செவியறி வாயுறை புறநிலை என்று இவை
    தொகு நிலை மரபின் அடி இல என்ப
  kaandigai:
    porul: கலிவெண்பாட்டு, கைக்கிளைச் செய்யுள், செவியறிவு, வாயுறை, புறநிலை — இவை தொகுநிலை மரபின் அடி வரையறை இல்லாதவை.
    en:
      kooruvathu: null
      enniyathu: 5
    ethu: 461 என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: classification
    class: adivaraivilla_paa
    count: 5
  links: []
  urai:
    iyaipu:
    - porul.435
    - porul.456
    - porul.463
    text: 'இயைபு (649): 435 கலி; 456 கலிவெண்பாட்டு; 463 புறநிலை/வாயுறை/செவியறிவுறூஉ.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'அடி இல' — இசைவு (வரையறை இன்மை)
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: porul.463
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 463
  moolam: |-
    புறநிலை வாயுறை செவியறிவுறூஉ எனத்
    திறநிலை மூன்றும் திண்ணிதின் தெரியின்
    வெண்பா இயலினும் ஆசிரிய இயலினும்
    பண்புற முடியும் பாவின என்ப
  kaandigai:
    porul: புறநிலை, வாயுறை, செவியறிவுறூஉ என்ற மூன்றும் வெண்பா இயலிலும் ஆசிரிய இயலிலும் முடியும் பாவின.
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: 462 கலிவெண்பாட்டு என்றது; புறநிலை, வாயுறை, செவியறிவுறூஉ — திறநிலை 3 — வெண்பா இயலினும் ஆசிரிய இயலினும் பண்புற முடியும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: classification
    class: thiranilai_moonru
    count: 3
  links: []
  urai:
    iyaipu:
    - porul.419
    - porul.462
    - porul.416
    text: 'இயைபு (649): 419 செவியுறை; 462 கலிவெண்பாட்டு; 416 வாயுறை. எண்: 3.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: மூன்றும்
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: porul.464
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 464
  moolam: |-
    பரிபாடல்லே
    நால் ஈர் ஐம்பது உயர்பு அடி ஆக
    ஐ ஐந்து ஆகும் இழிபு அடிக்கு எல்லை
  kaandigai:
    porul: 'பரிபாடல்: உயர்பு அடி "நால் ஈர் ஐம்பது"; இழிபு "ஐ ஐந்து" (இருபத்தைந்து). "நால் ஈர் ஐம்பது" என்பதன் மதிப்பை நூல் கூறவில்லை (ஒருதலை அன்மை).'
    en:
      kooruvathu: null
      enniyathu: 25
    ethu: 463 என்றது; பரிபாடல் — உயர்பு அடி 'நால் ஈர் ஐம்பது'; இழிபு அடிக்கு எல்லை 'ஐ ஐந்து'.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    class: paripatal_alavu
    count: null
  links: []
  urai:
    iyaipu:
    - porul.423
    - porul.425
    - porul.463
    text: 'இயைபு (649): 423 வெண்பா; 425 பரிபாடல்; 463 புறநிலை. ''நால் ஈர் ஐம்பது'' — நான்கு × இரண்டு × ஐம்பது = நானூறு எனப் பெருக்கலாம்; ''ஐ ஐந்து'' = இருபத்தைந்து. சொற்களைப் பெருக்குவதா கூட்டுவதா என்பதை நூல் இங்கு விரிக்கவில்லை — வாசிப்பு ஐயம்.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'நால் ஈர் ஐம்பது' எண் வாசிப்பு ஐயம்; காண்டிகை சுட்டிய ஐயம் ஒருதலை அன்மை
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: ஈர் ஐம்பது
- id: porul.465
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 465
  moolam: |-
    அளவியல் வகையே அனை வகைப்படுமே
  kaandigai:
    porul: அளவியல் வகை அத்தனை வகைப்படும்.
    ethu: 464 என்றது; அளவியல் வகை அனை வகைப்படும் — எல்லா வகையும் அளவியலுள் அடங்கும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: meta
    class: alaviyal_vagaippadu
    count: null
  links: []
  urai:
    iyaipu:
    - porul.464
    - porul.466
    - porul.485
    text: 'இயைபு (649): 464 பரிபாடல்; 466 ஏழ்நிலை; 485 ''அளவியல் வகையே அனை வகைப்படுமே'' — இதே வாக்கியம்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.466
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 466
  moolam: |-
    எழு நிலத்து எழுந்த செய்யுள் தெரியின்
    அடி வரை இல்லன ஆறு என மொழிப
  kaandigai:
    porul: ஏழு நிலத்து எழுந்த செய்யுளில் அடி வரையறை இல்லாதவை ஆறு.
    en:
      kooruvathu: 6
      enniyathu: 6
    ethu: 465 என்றது; ஏழ்நிலை — அடிவரை இல்லன ஆறு.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: classification
    class: adivaraivilla_seyyul
    count: 6
  links: []
  urai:
    iyaipu:
    - porul.384
    - porul.465
    - porul.467
    text: 'இயைபு (649): 384 ஏழ் நிலம்; 465 அளவியல்; 467 6 வகை விரிவு. ''ஆறு'' — 467 ''அவைதாம்'' என அவற்றைப் பட்டியலிடுகிறது.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: ஆறு
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
  - peyar: தான் குறியிடுதல்
    saanru: என மொழிப
- id: porul.467
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 467
  moolam: |-
    அவைதாம்
    நூலினான உரையினான
    நொடியொடு புணர்ந்த பிசியினான
    ஏது நுதலிய முதுமொழியான
    மறை மொழி கிளந்த மந்திரத்தான
    கூற்று இடை வைத்த குறிப்பினான
  kaandigai:
    porul: 'அவை: நூல், உரை, நொடியோடு புணர்ந்த பிசி, ஏது நுதலிய முதுமொழி, மறைமொழி கிளந்த மந்திரம், கூற்றிடை வைத்த குறிப்பு. இப்பட்டியல் 384-இன் ஏழு நிலத்தோடு முழுதும் ஒன்றவில்லை (384: வாய்மொழி, அங்கதம்; 467: மந்திரம், குறிப்பு) — ஒருதலை அன்மை.'
    en:
      kooruvathu: 6
      enniyathu: 6
    ethu: 466 ஆறு என்றது; இது அதன் தொடர்ச்சி.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: classification
    class: adivaraivilla_seyyul_vagai
    count: 6
  links: []
  urai:
    iyaipu:
    - porul.384
    - porul.466
    - porul.468
    text: 'இயைபு (649): 384 7 நிலை; 466 ஆறு; 468 நூலின் இயல்பு. எண்: 6 (நூல், உரை, பிசி, முதுமொழி, மந்திரம், குறிப்பு).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக; காண்டிகை சுட்டிய ஐயம் ஒருதலை அன்மை
  utthi:
  - peyar: அதிகார முறை
    saanru: அவைதாம்
  - peyar: கூறிற்று என்றல்
    saanru: கிளந்த
- id: porul.468
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 468
  moolam: |-
    அவற்றுள்
    நூல் எனப்படுவது நுவலும் காலை
    முதலும் முடிவும் மாறுகோள் இன்றி
    தொகையினும் வகையினும் பொருண்மை காட்டி
    உள் நின்று அகன்ற உரையொடு புணர்ந்து
    நுண்ணிதின் விளக்கல் அது அதன் பண்பே
  kaandigai:
    porul: 'நூல்: முதலும் முடிவும் மாறுகோள் இன்றி, தொகையாலும் வகையாலும் பொருளைக் காட்டி, உள்நின்று அகன்ற உரையொடு புணர்ந்து நுண்ணிதாக விளக்குவது. இது நூலின் இலக்கணம் — செந்தமிழ் மரபு "நூல் மரபு" பகுதியில் அளவுகோலாகக் கொள்ளப்பட்டது.'
    en:
      kooruvathu: null
      enniyathu: 4
    ethu: 467 நூல் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: nool_ilakkanam
    count: 4
  links: []
  urai:
    iyaipu:
    - porul.467
    - porul.469
    text: 'இயைபு (649): 467 6 வகை; 469 நூல் 4.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: அதிகார முறை
    saanru: அவற்றுள்
  - peyar: தான் குறியிடுதல்
    saanru: எனப்படுவது
- id: porul.469
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 469
  moolam: |-
    அதுவேதானும் ஒரு நால் வகைத்தே
  kaandigai:
    porul: அது நான்கு வகை.
    en:
      kooruvathu: 4
      enniyathu: 4
    ethu: 468 நூல் என்றது; நூல் 4 வகை — சூத்திரம், ஓத்து, படலம், பிண்டம்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: classification
    class: nool_vagai
    count: 4
  links: []
  urai:
    iyaipu:
    - porul.468
    - porul.470
    - porul.471
    - porul.472
    - porul.473
    - porul.474
    text: 'இயைபு (649): 468 நூல் இயல்பு; 470-474 நான்கும் விரிவு. எண்: 4.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: நால் வகைத்தே
- id: porul.470
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 470
  moolam: |-
    ஒரு பொருள் நுதலிய சூத்திரத்தானும்
    இன மொழி கிளந்த ஓத்தினானும்
    பொது மொழி கிளந்த படலத்தானும்
    மூன்று உறுப்பு அடக்கிய பிண்டத்தானும் என்று
    ஆங்கு அனை மரபின் இயலும் என்ப
  kaandigai:
    porul: சூத்திரம், ஓத்து, படலம், பிண்டம் — அவ்வகை மரபால் இயலும். இந்நூலின் அமைப்பு (1602 சூத்திரம் → 27 ஓத்து → 3 படலம் → ஒரு பிண்டம்) இதன்படி.
    en:
      kooruvathu: 4
      enniyathu: 4
    ethu: 469 நான்கு என்றது; சூத்திரம் (ஒரு பொருள்), ஓத்து (இனமொழி), படலம் (பொதுமொழி), பிண்டம் (மூன்றுறுப்பு) — வகை.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: classification
    class: nool_uruppu
    count: 4
  links: []
  urai:
    iyaipu:
    - porul.469
    - porul.471
    - porul.472
    - porul.473
    - porul.474
    text: 'இயைபு (649): 469 4 நூல்; 471 சூத்திரம்; 472 ஓத்து; 473 படலம்; 474 பிண்டம். எண்: 4.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: மூன்று
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: கூறிற்று என்றல்
    saanru: கிளந்த
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: porul.471
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 471
  moolam: |-
    அவற்றுள்
    சூத்திரம்தானே
    ஆடி நிழலின் அறியத் தோன்றி
    நாடுதல் இன்றிப் பொருள் நனி விளங்க
    யாப்பினுள் தோன்ற யாத்து அமைப்பதுவே
  kaandigai:
    porul: 'சூத்திரம்: கண்ணாடி நிழல் போல அறியத் தோன்றி, ஆராயாமலே பொருள் நன்கு விளங்க, யாப்பினுள் தோன்றும்படி அமைப்பது.'
    ethu: 470 நூல் 4 வகை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: suthiram
    count: null
  links: []
  urai:
    iyaipu:
    - porul.469
    - porul.470
    - porul.472
    - porul.644
    text: 'இயைபு (649): 470 நூல் 4 வகை; 472 ஓத்து; 644 சூத்திர இயல்பு — இதன் விரிவு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: அதிகார முறை
    saanru: அவற்றுள்
- id: porul.472
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 472
  moolam: |-
    நேர் இன மணியை நிரல்பட வைத்தாங்கு
    ஓர் இனப் பொருளை ஒரு வழி வைப்பது
    ஓத்து என மொழிப உயர் மொழிப் புலவர்
  kaandigai:
    porul: 'ஓத்து: ஒத்த இன மணிகளை வரிசையாக வைத்தாற்போல் ஓரினப் பொருளை ஓரிடத்து வைப்பது.'
    ethu: 471 சூத்திரம் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: oththu
    count: null
  links: []
  urai:
    iyaipu:
    - porul.471
    - porul.473
    - porul.470
    text: 'இயைபு (649): 471 சூத்திரம்; 473 படலம் — இதன் இணை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
  - peyar: தான் குறியிடுதல்
    saanru: என மொழிப
- id: porul.473
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 473
  moolam: |-
    ஒரு நெறி இன்றி விரவிய பொருளான்
    பொது மொழி தொடரின் அது படலம் ஆகும்
  kaandigai:
    porul: 'படலம்: ஒரு நெறியின்றிக் கலந்த பொருளால் பொதுமொழி தொடர்வது.'
    ethu: 472 ஓத்து என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: padalam
    count: null
  links: []
  urai:
    iyaipu:
    - porul.472
    - porul.474
    - porul.469
    text: 'இயைபு (649): 472 ஓத்து; 474 பிண்டம் — இதன் இணை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.474
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 474
  moolam: |-
    மூன்று உறுப்பு அடக்கிய தன்மைத்து ஆயின்
    தோன்று மொழிப் புலவர் அது பிண்டம் என்ப
  kaandigai:
    porul: 'பிண்டம்: மூன்று உறுப்பையும் அடக்கிய தன்மையது.'
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: 473 படலம் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: pindam
    count: 3
  links: []
  urai:
    iyaipu:
    - porul.473
    - porul.469
    - porul.470
    text: 'இயைபு (649): 473 படலம்; 469 4 நூல்; 470 4 வகை விரிவு. எண்: 3 (மூன்று உறுப்பு).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: மூன்று
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப்
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: porul.475
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 475
  moolam: |-
    பாட்டு இடை வைத்த குறிப்பினானும்
    பா இன்று எழுந்த கிளவியானும்
    பொருள் மரபு இல்லாப் பொய்ம்மொழியானும்
    பொருளொடு புணர்ந்த நகைமொழியானும் என்று
    உரை வகை நடையே நான்கு என மொழிப
  kaandigai:
    porul: 'உரை வகை நான்கு: பாட்டிடை வைத்த குறிப்பு, பாவின்றி எழுந்த கிளவி, பொருள் மரபில்லாப் பொய்மொழி, பொருளோடு புணர்ந்த நகைமொழி.'
    en:
      kooruvathu: 4
      enniyathu: 4
    ethu: செய்யுளின் வகையை நூல், உரை என்ற இரு வகையால் கூறுகிறது; நூலின் உறுப்புகள் சூத்திரம், ஓத்து, படலம், பிண்டம் (பொருள். 470–474) — "தோன்று மொழிப் புலவர் அது பிண்டம் என்ப" (பொருள். 474). அதன் பின் உரையின் வகை; அதுவும் பின்னர் இரு வகையாகப் பிரிகிறது (பொருள். 476).
    eduthukkaattu:
    - text: தோன்று மொழிப் புலவர் அது பிண்டம் என்ப
      from: porul.474
  nilai: நூலில் நேரடியாக
  kanini:
    kind: classification
    class: urai_vagai
    count: 4
  links: []
  urai:
    iyaipu:
    - porul.474
    - porul.476
    - porul.477
    - porul.481
    text: 'இயைபு (649): 474 பிண்டம்; 476-477 உரை 2; 481 குறிப்பு மொழி — இவற்றின் தொடர்பு. எண்: 4 (பட்டியல்).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: நான்கு
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
  - peyar: தான் குறியிடுதல்
    saanru: என மொழிப
- id: porul.476
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 476
  moolam: |-
    அதுவேதானும் இரு வகைத்து ஆகும்
  kaandigai:
    porul: அதுவும் இருவகை.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 475 உரை 4 என்றது; உரை இரு வகை — ஒன்று செவிலிக்கு உரியது, ஒன்று யார்க்கும் வரைநிலை இல்லாதது.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: classification
    class: nagaimozhi_vagai
    count: 2
  links: []
  urai:
    iyaipu:
    - porul.475
    - porul.477
    - porul.478
    text: 'இயைபு (649): 475 4 உரை; 477 செவிலி/யார்க்கும்; 478 பிசி. எண்: 2. ''யார்க்கும் வரை நிலை இன்றே'' — இசைவு (வரையறை இன்மை).'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'வரை நிலை இன்றே' — இசைவு (வரையறை இன்மை)
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: இரு வகைத்து
- id: porul.477
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 477
  moolam: |-
    ஒன்றே மற்றும் செவிலிக்கு உரித்தே
    ஒன்றே யார்க்கும் வரை நிலை இன்றே
  kaandigai:
    porul: ஒன்று செவிலிக்கு உரியது; ஒன்று யார்க்கும் வரைவில்லாதது. 476 "அதுவேதானும் இரு வகைத்து" என்பதில் "அது" எதைச் சுட்டுகிறது என நூற்பா பெயரிடவில்லை; அண்மை உறுப்பு 475-இன் "பொருளொடு புணர்ந்த நகைமொழி" (ஒருதலை அன்மை). இருவகையுள் எது செவிலிக்கு என்பதை நூல் சொல்லவில்லை (ஒருதலை அன்மை).
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 476 இருவகை என்றது; செவிலிக்கு உரிய ஒன்று, யார்க்கும் வரைநிலை இல்லாத ஒன்று.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: classification
    class: nagaimozhi_vagai
    count: 2
  links: []
  urai:
    iyaipu:
    - porul.476
    - porul.122
    - porul.151
    text: 'இயைபு (649): 476 உரை 2; 122 தாய்/செவிலி; 151 செவிலிக்கு உரிய.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'வரை நிலை இன்றே' — இசைவு (வரையறை இன்மை); காண்டிகை சுட்டிய ஐயம் ஒருதலை அன்மை
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: உரித்தே
- id: porul.478
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 478
  moolam: |-
    ஒப்பொடு புணர்ந்த உவமத்தானும்
    தோன்றுவது கிளந்த துணிவினானும்
    என்று இரு வகைத்தே பிசி நிலை வகையே
  kaandigai:
    porul: 'பிசி இருவகை: ஒப்போடு புணர்ந்த உவமம், தோன்றுவதைக் கூறிய துணிவு.'
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 477 என்றது; பிசி 2 — ஒப்பொடு புணர்ந்த உவமத்தான், தோன்றுவது கிளந்த துணிவினான்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: classification
    class: pisi_vagai
    count: 2
  links: []
  urai:
    iyaipu:
    - porul.476
    - porul.479
    - porul.480
    text: 'இயைபு (649): 477 உரை வகை; 479 முதுமொழி; 480 மந்திரம். எண்: 2.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: இரு வகைத்தே
  - peyar: கூறிற்று என்றல்
    saanru: கிளந்த
- id: porul.479
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 479
  moolam: |-
    நுண்மையும் சுருக்கமும் ஒளியுடைமையும்
    எண்மையும் என்று இவை விளங்கத் தோன்றி
    குறித்த பொருளை முடித்தற்கு வரூஉம்
    ஏது நுதலிய முதுமொழி என்ப
  kaandigai:
    porul: நுண்மை, சுருக்கம், ஒளியுடைமை, எண்மை விளங்கத் தோன்றி, குறித்த பொருளை முடிக்க வருவது ஏது நுதலிய முதுமொழி.
    en:
      kooruvathu: 4
      enniyathu: 4
    ethu: 478 பிசி என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: muthumozhi
    count: 4
  links: []
  urai:
    iyaipu:
    - porul.478
    - porul.480
    text: 'இயைபு (649): 478 பிசி; 480 மந்திரம். எண்: 4 (நுண்மை, சுருக்கம், ஒளி, எண்மை).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: porul.480
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 480
  moolam: |-
    நிறைமொழி மாந்தர் ஆணையின் கிளக்கும்
    மறைமொழிதானே மந்திரம் என்ப
  kaandigai:
    porul: நிறைமொழி மாந்தர் ஆணையால் கூறும் மறைமொழி மந்திரம்.
    ethu: 479 முதுமொழி என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: manthiram
    count: null
  links: []
  urai:
    iyaipu:
    - porul.479
    - porul.481
    text: 'இயைபு (649): 479 முதுமொழி; 481 குறிப்பு மொழி.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: porul.481
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 481
  moolam: |-
    எழுத்தொடும் சொல்லொடும் புணராதாகி
    பொருட்புறத்ததுவே குறிப்பு மொழியே
  kaandigai:
    porul: எழுத்தோடும் சொல்லோடும் புணராது பொருளுக்குப் புறத்ததாவது குறிப்புமொழி.
    ethu: 480 மந்திரம் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: kurippumozhi
    count: null
  links: []
  urai:
    iyaipu:
    - porul.475
    - porul.480
    - porul.482
    text: 'இயைபு (649): 475 உரை வகை; 480 மந்திரம்; 482 பாட்டு இடைக் கலந்த பொருள்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.482
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 482
  moolam: |-
    பாட்டிடைக் கலந்த பொருள ஆகி
    பாட்டின் இயல பண்ணத்திய்யே
  kaandigai:
    porul: பாட்டிடைக் கலந்த பொருளவாகிப் பாட்டின் இயலுடையது பண்ணத்தி.
    ethu: 481 குறிப்பு மொழி என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: pannathi
    count: null
  links: []
  urai:
    iyaipu:
    - porul.478
    - porul.481
    - porul.483
    text: 'இயைபு (649): 478 பிசி; 481 குறிப்பு மொழி; 483 பிசி இரு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.483
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 483
  moolam: |-
    அதுவேதானும் பிசியொடு மானும்
  kaandigai:
    porul: அதுவும் பிசியோடு ஒக்கும்.
    ethu: 482 பண்ணத்தி என்றது; அதுவும் பிசியொடு மானும் — பிசியோடு ஒக்கும் ('மானும்' — ஒக்கும்).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: pannathi_pisi_oppu
    count: null
  links: []
  urai:
    iyaipu:
    - porul.478
    - porul.482
    text: 'இயைபு (649): 478 பிசி நிலை வகை; 482 பண்ணத்தி. 483 பண்ணத்தியைப் பிசியோடு ஒப்பிடுகிறது; இங்கு எண் கூறப்படவில்லை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.484
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 484
  moolam: |-
    அடி நிமிர் கிளவி ஈர் ஆறு ஆகும்
    அடி இகந்து வரினும் கடி வரை இன்றே
  kaandigai:
    porul: அடிநிமிர் கிளவி பன்னிரண்டு (ஈர் ஆறு); அடி கடந்து வந்தாலும் விலக்கில்லை.
    en:
      kooruvathu: 12
      enniyathu: 12
    ethu: 483 பண்ணத்தி பிசியொடு ஒக்கும் என்றது; அடிநிமிர் கிளவி ஈர் ஆறு ஆகும் (2×6 = 12).
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    class: adinimir_ilakkana
    count: 12
  links: []
  urai:
    iyaipu:
    - porul.483
    - porul.485
    text: 'இயைபு (649): 483 பண்ணத்தி; 485 அளவியல் வகை. எண்: 12 (நூற்பா ''ஈர் ஆறு'' = 2×6) — எவை 12 என நூல் இங்கு விரிக்கவில்லை — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'ஈர் ஆறு' = 12 — எவை என ஒருதலை அன்மை
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: ஆறு
- id: porul.485
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 485
  moolam: |-
    கிளர் இயல் வகையின் கிளந்தன தெரியின்
    அளவியல் வகையே அனை வகைப்படுமே
  kaandigai:
    porul: கிளர் இயல் வகையால் கூறியவற்றை ஆராய்ந்தால் அளவியல் வகை அத்தனை வகைப்படும்.
    ethu: 484 அடிநிமிர் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: meta
    class: alaviyal_vagaippadu
    count: null
  links: []
  urai:
    iyaipu:
    - porul.465
    - porul.484
    - porul.486
    text: 'இயைபு (649): 465 அளவியல் வகை; 484 அடிநிமிர்; 486 ஏழ் திணை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: கூறிற்று என்றல்
    saanru: கிளந்தன
- id: porul.486
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 486
  moolam: |-
    கைக்கிளை முதலா ஏழ் பெருந் திணையும்
    முன் கிளந்தனவே முறையினான
  kaandigai:
    porul: கைக்கிளை முதலிய ஏழு பெருந்திணையும் முன்னரே முறையாகக் கூறப்பட்டன (பொருள். 1).
    en:
      kooruvathu: 7
      enniyathu: 7
    ethu: 485 அளவியல் என்றது; கைக்கிளை முதல் ஏழ் பெருந் திணையும் முன் கிளந்தன — 1-58-இல் கூறப்பட்ட ஏழ் திணை.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: meta
    class: thin_marabu_crossref
    count: 7
  links: []
  urai:
    iyaipu:
    - porul.1
    - porul.485
    - porul.487
    text: 'இயைபு (649): 1 ஏழ் திணை; 485 அளவியல்; 487 களவு 4.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக; காண்டிகை சுட்டிய ஐயம் ஒருதலை அன்மை
  utthi:
  - peyar: கூறிற்று என்றல்
    saanru: கிளந்தனவே
- id: porul.487
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 487
  moolam: |-
    காமப் புணர்ச்சியும் இடம் தலைப்படலும்
    பாங்கொடு தழாஅலும் தோழியின் புணர்வும் என்று
    ஆங்க நால் வகையினும் அடைந்த சார்பொடு
    மறை என மொழிதல் மறையோர் ஆறே
  kaandigai:
    porul: காமப் புணர்ச்சி, இடந்தலைப்படல், பாங்கொடு தழாஅல், தோழியின் புணர்வு என்ற நால்வகையும் சார்பும் மறை (களவு) என்பர்.
    en:
      kooruvathu: 4
      enniyathu: 4
    ethu: 486 ஏழ் திணை என்றது; களவு 4 — காமப்புணர்ச்சி, இடம் தலைப்படல், பாங்கொடு தழாஅல், தோழியின் புணர்வு.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: classification
    class: kalavu_vagai
    count: 4
  links: []
  urai:
    iyaipu:
    - porul.89
    - porul.486
    - porul.488
    text: 'இயைபு (649): 89 களவு; 486 திணை; 488 மறை வெளிப்படுதல். எண்: 4.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: நால் வகையினும்
- id: porul.488
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 488
  moolam: |-
    மறை வெளிப்படுதலும் தமரின் பெறுதலும்
    இவை முதலாகிய இயல் நெறி திரியாது
    மலிவும் புலவியும் ஊடலும் உணர்வும்
    பிரிவொடு புணர்ந்தது கற்பு எனப்படுமே
  kaandigai:
    porul: மறை வெளிப்படுதல், தமரால் பெறுதல் முதலிய இயல்நெறி திரியாமல் மலிவு, புலவி, ஊடல், உணர்வு, பிரிவு ஆகியவற்றோடு புணர்ந்தது கற்பு.
    ethu: 487 களவு 4 என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: karpu_ilakkanam
    count: null
  links: []
  urai:
    iyaipu:
    - porul.487
    - porul.140
    - porul.489
    text: 'இயைபு (649): 487 களவு 4; 140 கற்பு; 489 கைகோள் வகை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தான் குறியிடுதல்
    saanru: எனப்படுமே
- id: porul.489
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 489
  moolam: |-
    மெய் பெறும் அவையே கைகோள் வகையே
  kaandigai:
    porul: அவை (களவும் கற்பும்) மெய்பெறும் கைகோள் வகை. கைகோள் எத்தனை என நூற்பா எண்ணிக் கூறவில்லை (ஒருதலை அன்மை).
    en:
      kooruvathu: null
      enniyathu: 2
    ethu: 487 களவு, 488 கற்பு என்றது; 'மெய் பெறும் அவையே கைகோள் வகையே' — கைகோள் வகை அவையே (களவு, கற்பு).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: kaikol_vagai
    count: 2
  links: []
  urai:
    iyaipu:
    - porul.488
    - porul.490
    - porul.491
    text: 'இயைபு (649): 488 கற்பு; 490 களவின் கிளவி 6; 491 கற்பின் கிளவி 7.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.490
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 490
  moolam: |-
    பார்ப்பான் பாங்கன் தோழி செவிலி
    சீர்த்தகு சிறப்பின் கிழவன் கிழத்தியொடு
    அளவு இயல் மரபின் அறு வகையோரும்
    களவின் கிளவிக்கு உரியர் என்ப
  kaandigai:
    porul: 'களவுக் கிளவிக்கு உரியோர் அறுவர்: பார்ப்பான், பாங்கன், தோழி, செவிலி, கிழவன், கிழத்தி.'
    en:
      kooruvathu: 6
      enniyathu: 6
    ethu: 489 கைகோள் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: classification
    class: kalavuk_kilavi_uriyor
    count: 6
  links: []
  urai:
    iyaipu:
    - porul.489
    - porul.191
    - porul.491
    text: 'இயைபு (649): 489 கைகோள்; 191 வாயில்கள்; 491 கற்பின் கிளவி. எண்: 6 (நூற்பா ''அறு வகையோரும்'').'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: அறு வகையோரும்
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: porul.491
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 491
  moolam: |-
    பாணன் கூத்தன் விறலி பரத்தை
    ஆணம் சான்ற அறிவர் கண்டோர்
    பேணுதகு சிறப்பின் பார்ப்பான் முதலா
    முன்னுறக் கிளந்த அறுவரொடு தொகைஇ
    தொல் நெறி மரபின் கற்பிற்கு உரியர்
  kaandigai:
    porul: 'கற்புக்கு உரியோர்: பாணன், கூத்தன், விறலி, பரத்தை, அறிவர், கண்டோர் — முன் கூறிய அறுவரொடு தொகுத்து. எண்ணினால் பன்னிருவர்; மொத்த எண்ணை நூற்பா கூறவில்லை (ஒருதலை அன்மை).'
    en:
      kooruvathu: null
      enniyathu: 12
    ethu: களவுக்கு உரியோர் அறுவர் (பொருள். 490); கற்பில் அவரொடு பிறரும் கூற்றுக்கு உரியர். கைகோள் இரண்டு — "மெய் பெறும் அவையே கைகோள் வகையே" (பொருள். 489) — களவு, கற்பு; அதனால் இருவகைக் கூற்றாளர் பட்டியல்.
    eduthukkaattu:
    - text: மெய் பெறும் அவையே கைகோள் வகையே
      from: porul.489
  nilai: நூலில் நேரடியாக
  kanini:
    kind: classification
    class: karpuk_kilavi_uriyor
    count: 12
  links: []
  urai:
    iyaipu:
    - porul.490
    - porul.492
    text: 'இயைபு (649): பொருள். 490, 492 — கைகோள் இரண்டு — களவு, கற்பு (489). களவுக் கிளவிக்கு அறுவர் (490); கற்புக்கு அவ்வறுவரொடு பாணன், கூத்தன், விறலி, பரத்தை, அறிவர், கண்டோர் — பன்னிருவர்: ஒருதலை அன்மை — நூலின் எண்ணால் சான்று (6 + 6). வாயில்கள்: "தோழி தாயே பார்ப்பான் பாங்கன் / பாணன் பாட்டி இளையர் விருந்தினர் / கூத்தர் விறலியர் அறிவர் கண்டோர்" (191) — பாணன், கூத்தன், விறலி, அறிவர், கண்டோர் வாயிலாகவும் வருவர்; பரத்தை வாயில் பட்டியலில் இல்லை. கூற்று வரையறை: "பார்ப்பார் அறிவர் என்று இவர் கிளவி / யார்க்கும் வரையார் யாப்பொடு புணர்ந்தே" (498); "பரத்தை வாயில் என இரு வீற்றும் / கிழத்தியைச் சுட்டாக் கிளப்புப் பயன் இலவே" (499); கூத்தர், பாணர்க்கு உரியவை (167). கூற்று இல்லாதோர் — ஊர், அயல், சேரி, நோய் அறிநர், தந்தை, தன்னை (492); நற்றாய் — "கிழவன்தன்னொடும் கிழத்திதன்னொடும் / நற்றாய் கூறல் முற்றத் தோன்றாது" (493). கடாஅ (650): பார்ப்பான் 490-இல் உள்ளான்; 491-இல் மீண்டும் ஏன்? — விடை: "பார்ப்பான் முதலா முன்னுறக் கிளந்த அறுவர்" — 490-இன் அறுவரைச் சுட்டும் அடை; புதியவன் அல்லன். ஆகவே பன்னிருவர், பதின்மூவர்
      அல்லர். 88-இல் வரும் பொருநர் இங்கு இல்லை.'
    vagai: விதி
    maruthalai:
    - kadaa: பார்ப்பான் 490-இல் உள்ளான்; 491-இல் மீண்டும் ஏன்?
      maattram: '— விடை: "பார்ப்பான் முதலா முன்னுறக் கிளந்த அறுவர்" — 490-இன் அறுவரைச் சுட்டும் அடை; புதியவன் அல்லன். ஆகவே பன்னிருவர், பதின்மூவர் அல்லர். 88-இல் வரும் பொருநர் இங்கு இல்லை.'
      saanru: []
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: கூறிற்று என்றல்
    saanru: கிளந்த
- id: porul.492
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 492
  moolam: |-
    ஊரும் அயலும் சேரியோரும்
    நோய் மருங்கு அறிநரும் தந்தையும் தன்னையும்
    கொண்டெடுத்து மொழியப்படுதல் அல்லது
    கூற்று அவண் இன்மை யாப்புறத் தோன்றும்
  kaandigai:
    porul: ஊரார், அயலார், சேரியோர், நோய் அறிவோர், தந்தை, தமையன் — பிறர் எடுத்துக் கூறப்படுவதல்லாமல் இவர்க்குக் கூற்று இல்லை.
    en:
      kooruvathu: null
      enniyathu: 6
    ethu: 491 என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: classification
    class: kurraiyar_uriyor
    count: 6
  links: []
  urai:
    iyaipu:
    - porul.491
    - porul.493
    - porul.494
    text: 'இயைபு (649): 491 கற்பின் கிளவி; 493 நற்றாய்; 494 கண்டோர்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.493
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 493
  moolam: |-
    கிழவன்தன்னொடும் கிழத்திதன்னொடும்
    நற்றாய் கூறல் முற்றத் தோன்றாது
  kaandigai:
    porul: கிழவனோடும் கிழத்தியோடும் நற்றாய் கூறுதல் முழுமையாகத் தோன்றாது.
    ethu: 492 என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: nattrai_kural_ila
    count: null
  links: []
  urai:
    iyaipu:
    - porul.492
    - porul.494
    - porul.191
    text: 'இயைபு (649): 492 ஊர்/சேரி; 494 கண்டோர்; 191 வாயில். ''முற்றத் தோன்றாது'' — நற்றாய் முழுவதும் கூறா.'
    vagai: விலக்கு
    vilakkukkuriyathu:
    - porul.492
    thunivu: நூலில் நேரடியாக
- id: porul.494
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 494
  moolam: |-
    ஒண் தொடி மாதர் கிழவன் கிழத்தியொடு
    கண்டோர் மொழிதல் கண்டது என்ப
  kaandigai:
    porul: கிழவன் கிழத்தியோடு கண்டோர் கூறுவது "கண்டது".
    ethu: 493 நற்றாய் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: kandor_mozhithal
    count: null
  links: []
  urai:
    iyaipu:
    - porul.43
    - porul.492
    - porul.493
    text: 'இயைபு (649): 43 ''கண்டோர் மொழிதல் கண்டது'' — இதே வாக்கியம்; 492 ஊர்; 493 நற்றாய்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: porul.495
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 495
  moolam: |-
    இடைச் சுரமருங்கின் கிழவன் கிழத்தியொடு
    வழக்கியல் ஆணையின் கிளத்தற்கும் உரியன்
  kaandigai:
    porul: இடைச்சுரத்தில் கிழவன் கிழத்தியோடு வழக்கியல் ஆணையால் (கண்டோன்) கூறுதற்கும் உரியன்.
    ethu: 494 கண்டோர் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: idaichuram_kandor
    count: null
  links: []
  urai:
    iyaipu:
    - porul.494
    - porul.496
    text: 'இயைபு (649): 494 கண்டோர்; 496 ஒழிந்தோர்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.496
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 496
  moolam: |-
    ஒழிந்தோர் கிளவி கிழவன் கிழத்தியொடு
    மொழிந்தாங்கு உரியர் முன்னத்தின் எடுத்தே
  kaandigai:
    porul: ஒழிந்தோர் கிளவியும் கிழவன் கிழத்தியோடு முன்னத்தின் எடுத்துக் கூற உரியர்.
    ethu: 495 இடைச்சுரம் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ozhindor_kilavi
    count: null
  links: []
  urai:
    iyaipu:
    - porul.495
    - porul.497
    text: 'இயைபு (649): 495 இடைச்சுரம்; 497 மனையோள்/கிழவன்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: கூறிற்று என்றல்
    saanru: மொழிந்தாங்கு
- id: porul.497
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 497
  moolam: |-
    மனையோள் கிளவியும் கிழவன் கிளவியும்
    நினையும் காலை கேட்குநர் அவரே
  kaandigai:
    porul: மனைவியின் கிளவியையும் கிழவனின் கிளவியையும் கேட்போர் அவரே (ஒருவர்க்கொருவர்).
    ethu: 496 ஒழிந்தோர் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: manaiyol_kilavi
    count: null
  links: []
  urai:
    iyaipu:
    - porul.496
    - porul.498
    text: 'இயைபு (649): 496 ஒழிந்தோர்; 498 பார்ப்பார்/அறிவர்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.498
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 498
  moolam: |-
    பார்ப்பார் அறிவர் என்று இவர் கிளவி
    யார்க்கும் வரையார் யாப்பொடு புணர்ந்தே
  kaandigai:
    porul: பார்ப்பார், அறிவர் — இவர் கிளவி யாப்பொடு புணர்ந்து யார்க்கும் வரையறையின்றி வரும்.
    ethu: 497 கேட்குநர் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: parppar_arivar_kilavi
    count: null
  links: []
  urai:
    iyaipu:
    - porul.497
    - porul.499
    - porul.500
    text: 'இயைபு (649): 497 கேட்குநர்; 499 பரத்தை; 500 வாயில் உசாவு.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'வரையார்' — இசைவு (வரையறை இன்மை)
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: வரையார்
- id: porul.499
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 499
  moolam: |-
    பரத்தை வாயில் என இரு வீற்றும்
    கிழத்தியைச் சுட்டாக் கிளப்புப் பயன் இலவே
  kaandigai:
    porul: பரத்தை, வாயில் என்ற இருவர் கூற்றும் கிழத்தியைச் சுட்டாவிட்டால் பயனில்லை.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 498 என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: parathai_vayil
    count: 2
  links: []
  urai:
    iyaipu:
    - porul.220
    - porul.498
    - porul.500
    text: 'இயைபு (649): 220 பரத்தை வாயில்; 498 அறிவர்; 500 வாயில் உசாவு.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'பயன் இலவே' — இசைவு (வரையறை இன்மை)
- id: porul.500
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 500
  moolam: |-
    வாயில் உசாவே தம்முள் உரிய
  kaandigai:
    porul: வாயிலும் உசாவும் (தோழியர் முதலியோர்) தம்முள் உரியன.
    ethu: 499 பரத்தை என்றது; வாயில் உசாவே தம்முள் உரிய — வாயில்களின் உசாவு.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: vayil_usavu
    count: null
  links: []
  urai:
    iyaipu:
    - porul.147
    - porul.499
    - porul.501
    text: 'இயைபு (649): 147 வாயில் உள்ளுறை; 499 பரத்தை; 501 உசாவும் பொருள்கள்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.501
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 501
  moolam: |-
    ஞாயிறு திங்கள் அறிவே நாணே
    கடலே கானல் விலங்கே மரனே
    புலம்புறு பொழுதே புள்ளே நெஞ்சே
    அவை அல பிறவும் நுதலிய நெறியான்
    சொல்லுந போலவும் கேட்குந போலவும்
    சொல்லியாங்கு அமையும் என்மனார் புலவர்
  kaandigai:
    porul: 'ஞாயிறு, திங்கள், அறிவு, நாண், கடல், கானல், விலங்கு, மரம், புலம்புறு பொழுது, புள், நெஞ்சு — இவையும் பிறவும் சொல்வன போலவும் கேட்பன போலவும் கூறப்படலாம் (கேட்போர் உறுப்பு). காண்க: பொருள். 194 "சொல்லா மரபின் அவற்றொடு கெழீஇ".'
    en:
      kooruvathu: null
      enniyathu: 11
    ethu: 500 உசாவு என்றது; உசாவின் பொருள்கள் — ஞாயிறு, திங்கள், அறிவு, நாண், கடல், கானல், விலங்கு, மரம், புலம்புறு பொழுது, புள், நெஞ்சு — 'அவை அல பிறவும்' உள்ளது.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: classification
    class: ketpor_uruppu
    count: 11
  links: []
  urai:
    iyaipu:
    - porul.500
    - porul.238
    - porul.502
    text: 'இயைபு (649): 500 வாயில் உசாவு; 238 உள்ளுறை 5; 502 இடம். பட்டியலில் 11 உறுப்பு உள்ளது (ஞாயிறு...நெஞ்சு); எண் கூறப்படவில்லை — ''அவை அல பிறவும்'' — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'அவை அல பிறவும்' — எண் கூறப்படவில்லை; ஒருதலை அன்மை
  utthi:
  - peyar: வந்தது கொண்டு வாராதது உணர்த்தல்
    saanru: பிறவும்
  - peyar: ஒப்பக் கூறல்
    saanru: போலவும்
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்மனார்
  - peyar: கூறிற்று என்றல்
    saanru: சொல்லியாங்கு
- id: porul.502
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 502
  moolam: |-
    ஒரு நெறிப்பட்டு ஆங்கு ஓர் இயல் முடியும்
    கரும நிகழ்ச்சி இடம் என மொழிப
  kaandigai:
    porul: ஒரு நெறிப்பட்டு ஓரியல் முடியும் கரும நிகழ்ச்சி இடம் (களன்).
    ethu: 501 உசாவு என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: kalan_ilakkanam
    count: null
  links: []
  urai:
    iyaipu:
    - porul.501
    - porul.503
    text: 'இயைபு (649): 501 உசாவு கருவி; 503 காலம்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
  - peyar: தான் குறியிடுதல்
    saanru: என மொழிப
- id: porul.503
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 503
  moolam: |-
    இறப்பே நிகழ்வே எதிரது என்னும்
    திறத்தியல் மருங்கின் தெரிந்தனர் உணர
    பொருள் நிகழ்வு உரைப்பது காலம் ஆகும்
  kaandigai:
    porul: 'இறப்பு, நிகழ்வு, எதிர்வு என்ற திறத்தால் பொருள் நிகழ்வைக் கூறுவது காலம். காண்க: சொல். 200.'
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: செய்யுள் உறுப்புகளுள் «இடம்» (பொருள். 502), "காலம்", "பயன்" (பொருள். 504) தொடர்ந்து வருகின்றன; காலத்தின் மூன்று பகுப்பு சொல்லதிகாரம் கூறியதே — "இறப்பின் நிகழ்வின் எதிர்வின்" (சொல். 202).
    eduthukkaattu:
    - text: காலம்
      from: porul.503
    - text: பயன்
      from: porul.504
    - text: இறப்பின் நிகழ்வின் எதிர்வின்
      from: sol.202
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: kaalam_ilakkanam
    count: 3
  links: []
  urai:
    iyaipu:
    - sol.290
    text: 'சொல்லுறுப்பு: "இறப்பே நிகழ்வே எதிரது" — ஏகாரம் எண் ("எண் ஏகாரம்" — சொல். 290); "திறத்தியல் மருங்கின் தெரிந்தனர் உணர" — அவ்வகைகளின் இயல்பால் தெரிந்து உணர; "பொருள் நிகழ்வு உரைப்பது" — செய்யுள் கூறும் பொருள் எக்காலத்து நிகழ்வது என உரைப்பது. இயைபு (649): செய்யுள் உறுப்பு வரிசை "கேட்போர் களனே கால வகை எனாஅ / பயனே" (310) — களன் (502), காலம் (503), பயன் (504) — அவ்வரிசையே — நூலில் நேரடியாக. சொல். 202-இன் முக்காலமே, அதே வரிசை. வேறுபாடு: 202 — சொல்லின் (வினையின்) காலம்; 503 — செய்யுள் பொருளின் காலம். சொல் வேறுபாடு: 202 "எதிர்வு", 503 "எதிரது".'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.504
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 504
  moolam: |-
    இது நனி பயக்கும் இதன் மாறு என்னும்
    தொகு நிலைக் கிளவி பயன் எனப்படுமே
  kaandigai:
    porul: '"இது நனி பயக்கும் இதன் மாறு" (பொருள்: இது மிகப் பயன் தரும்; இதன் மாறு இது) எனத் தொகுத்துக் கூறும் கிளவி பயன்.'
    ethu: 503 காலம் என்றது; பயன் — 'இது நனிபயக்கும், இதன் மாறு' என்னும் தொகுநிலைக் கிளவி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: payan_ilakkanam
    count: null
  links: []
  urai:
    iyaipu:
    - porul.503
    - porul.505
    text: 'இயைபு (649): 503 காலம்; 505 மெய்ப்பாடு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தான் குறியிடுதல்
    saanru: எனப்படுமே
- id: porul.505
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 505
  moolam: |-
    உய்த்துணர்வு இன்றி தலைவரு பொருண்மையின்
    மெய்ப் பட முடிப்பது மெய்ப்பாடு ஆகும்
  kaandigai:
    porul: உய்த்துணர வேண்டாமல், தலைவரும் பொருளை மெய்ப்பட முடிப்பது மெய்ப்பாடு.
    ethu: 504 பயன் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: meyppadu_ilakkanam
    count: null
  links: []
  urai:
    iyaipu:
    - porul.504
    - porul.506
    - porul.247
    text: 'இயைபு (649): 504 பயன்; 506 எண் வகை இயல்; 247 8 மெய்ப்பாடு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.506
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 506
  moolam: |-
    எண் வகை இயல் நெறி பிழையாதாகி
    முன்னுறக் கிளந்த முடிவினது அதுவே
  kaandigai:
    porul: 'அது எண்வகை இயல்நெறி பிழையாது, முன் கூறிய முடிவினது. எண்வகை மெய்ப்பாடு: பொருள். 247.'
    en:
      kooruvathu: null
      enniyathu: 8
    ethu: 505 மெய்ப்பாடு என்றது; 8 வகை இயல் நெறி பிழையாதாகி, முன்னுறக் கிளந்த முடிவினது.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: en_vagai_meyppadu
    count: 8
  links: []
  urai:
    iyaipu:
    - porul.247
    - porul.505
    - porul.507
    text: 'இயைபு (649): 247 8 மெய்ப்பாடு; 505 மெய்ப்பாடு பொது; 507 எச்சம். எண்: 8.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: கூறிற்று என்றல்
    saanru: கிளந்த
- id: porul.507
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 507
  moolam: |-
    சொல்லொடும் குறிப்பொடும் முடிவு கொள் இயற்கை
    புல்லிய கிளவி எச்சம் ஆகும்
  kaandigai:
    porul: 'சொல்லாலும் குறிப்பாலும் முடிவு கொள்ளும் இயல்புடைய கிளவி எச்சம். காண்க: சொல். 397–463 (எச்சவியல்).'
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 506 மெய்ப்பாடு என்றது; எச்சம் — சொல்லொடும் குறிப்பொடும் முடிவு கொள்ளும் இயற்கை.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: echcham_ilakkanam
    count: 2
  links: []
  urai:
    iyaipu:
    - porul.430
    - porul.506
    - porul.508
    text: 'இயைபு (649): 430 எச்சம் (சொல். 430); 506 மெய்ப்பாடு; 508 முன்னம்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.508
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 508
  moolam: |-
    இவ் இடத்து இம் மொழி இவர் இவர்க்கு உரிய என்று
    அவ் இடத்து அவர் அவர்க்கு உரைப்பது முன்னம்
  kaandigai:
    porul: '"இவ் இடத்து இம் மொழி இவர் இவர்க்கு உரிய" என்று அவ்விடத்து அவரவர்க்கு உரைப்பது முன்னம்.'
    ethu: 507 எச்சம் என்றது; 'இவ்விடத்து இம்மொழி இவர் இவர்க்கு உரிய' என்பது முன்னம் — முன்னம் இடம்/மொழி/ஆள் உணர்தல்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: munnam_ilakkanam
    count: null
  links: []
  urai:
    iyaipu:
    - porul.507
    - porul.509
    text: 'இயைபு (649): 507 எச்சம்; 509 பொருள் வகை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.509
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 509
  moolam: |-
    இன்பமும் இடும்பையும் புணர்வும் பிரிவும்
    ஒழுக்கமும் என்று இவை இழுக்கு நெறி இன்றி
    இது ஆகு இத் திணைக்கு உரிப் பொருள் என்னாது
    பொதுவாய் நிற்றல் பொருள் வகை என்ப
  kaandigai:
    porul: இன்பம், இடும்பை, புணர்வு, பிரிவு, ஒழுக்கம் — இவை "இத்திணைக்கு உரிப்பொருள்" என்று வரையாமல் பொதுவாய் நிற்றல் பொருள் வகை.
    en:
      kooruvathu: 5
      enniyathu: 5
    ethu: 508 முன்னம் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: classification
    class: porul_vagai
    count: 5
  links: []
  urai:
    iyaipu:
    - porul.508
    - porul.510
    - porul.411
    text: 'இயைபு (649): 508 முன்னம்; 510 துறை; 411 3 முதல் பொருள். எண்: 5 (இன்பம், இடும்பை, புணர்வு, பிரிவு, ஒழுக்கம்).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: porul.510
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 510
  moolam: |-
    அவ் அம் மக்களும் விலங்கும் அன்றிப்
    பிற அவண் வரினும் திறவதின் நாடி
    தம்தம் இயலின் மரபொடு முடியின்
    அத் திறம்தானே துறை எனப்படுமே
  kaandigai:
    porul: மக்களும் விலங்கும் அல்லாத பிறவும் வந்தாலும், திறம்பட ஆராய்ந்து தம்தம் இயல் மரபோடு முடிந்தால் அத்திறம் துறை.
    ethu: 509 பொருள் வகை என்றது; இது அதன் தொடர்ச்சி.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: definition
    class: thurai_ilakkanam
    count: null
  links: []
  urai:
    iyaipu:
    - porul.509
    - porul.39
    - porul.88
    text: 'இயைபு (649): 509 பொருள் வகை; 39 களவு/வாயில்; 88 துயிலெடை. ''பிற அவண் வரினும்'' — எவை என நூல் விரிக்கவில்லை — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'பிற அவண் வரினும்' — எவை என ஒருதலை அன்மை
  utthi:
  - peyar: தான் குறியிடுதல்
    saanru: எனப்படுமே
- id: porul.511
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 511
  moolam: |-
    அகன்று பொருள் கிடப்பினும் அணுகிய நிலையினும்
    இயன்று பொருள் முடிய தந்தனர் உணர்த்தல்
    மாட்டு என மொழிப பாட்டியல் வழக்கின்
  kaandigai:
    porul: பொருள் அகன்று கிடந்தாலும் அணுகி நின்றாலும், இயன்று பொருள் முடியக் கொண்டு வந்து உணர்த்துதல் மாட்டு.
    ethu: 510 துறை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: maattu_ilakkanam
    count: null
  links: []
  urai:
    iyaipu:
    - porul.510
    - porul.512
    - porul.460
    text: 'இயைபு (649): 510 துறை; 512 எச்சம்/நாட்டல்; 460 பாட்டு அளவு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
  - peyar: தான் குறியிடுதல்
    saanru: என மொழிப
- id: porul.512
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 512
  moolam: |-
    மாட்டும் எச்சமும் நாட்டல் இன்றி
    உடனிலை மொழியினும் தொடர்நிலை பெறுமே
  kaandigai:
    porul: மாட்டும் எச்சமும் நாட்டாமல், உடனிலை மொழியிலும் தொடர்நிலை பெறும்.
    ethu: 511 என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: maattu_echcham
    count: null
  links: []
  urai:
    iyaipu:
    - porul.511
    - porul.513
    text: 'இயைபு (649): 511 மாட்டு; 513 வண்ணம்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.513
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 513
  moolam: |-
    வண்ணம்தாமே நால் ஐந்து என்ப
  kaandigai:
    porul: வண்ணம் இருபது (நால் ஐந்து).
    en:
      kooruvathu: 20
      enniyathu: 20
    ethu: 512 என்றது; இனி வண்ணம். வண்ணம் நால் ஐந்து (4×5 = 20).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: classification
    class: varnam_vagai
    count: 20
  links: []
  urai:
    iyaipu:
    - porul.512
    - porul.514
    - porul.310
    text: 'இயைபு (649): 512 மாட்டு; 514 20-வண்ணப்பட்டியல்; 310 வண்ணம் (செய்யுள் உறுப்பில்). எண்: 20 (நூற்பா ''நால் ஐந்து'' = 4×5) = 20 (514-இன் பட்டியல்).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: நால் ஐந்து
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: porul.514
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 514
  moolam: |-
    அவைதாம்
    பாஅ வண்ணம் தாஅ வண்ணம்
    வல்லிசை வண்ணம் மெல்லிசை வண்ணம்
    இயைபு வண்ணம் அளபெடை வண்ணம்
    நெடுஞ்சீர் வண்ணம் குறுஞ்சீர் வண்ணம்
    சித்திர வண்ணம் நலிபு வண்ணம்
    அகப்பாட்டு வண்ணம் புறப்பாட்டு வண்ணம்
    ஒழுகு வண்ணம் ஒரூஉ வண்ணம்
    எண்ணு வண்ணம் அகைப்பு வண்ணம்
    தூங்கல் வண்ணம் ஏந்தல் வண்ணம்
    உருட்டு வண்ணம் முடுகு வண்ணம் என்று
    ஆங்கு என மொழிப அறிந்திசினோரே
  kaandigai:
    porul: 'அவை: பா, தா, வல்லிசை, மெல்லிசை, இயைபு, அளபெடை, நெடுஞ்சீர், குறுஞ்சீர், சித்திர, நலிபு, அகப்பாட்டு, புறப்பாட்டு, ஒழுகு, ஒரூஉ, எண்ணு, அகைப்பு, தூங்கல், ஏந்தல், உருட்டு, முடுகு வண்ணம். எண்ணிப் பார்க்க இருபது — 513-இன் "நால் ஐந்து" (எண்ணிச் சரிபார்த்தது).'
    en:
      kooruvathu: null
      enniyathu: 20
    ethu: 513 நால் ஐந்து என்றது; 20 வண்ணம் — பாஅ, தாஅ, வல்லிசை, மெல்லிசை, இயைபு, அளபெடை, நெடுஞ்சீர், குறுஞ்சீர், சித்திர, நலிபு, அகப்பாட்டு, புறப்பாட்டு, ஒழுகு, ஒரூஉ, எண்ணு, அகைப்பு, தூங்கல், ஏந்தல், உருட்டு, முடுகு.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: varnam_vagai
    count: 20
  links: []
  urai:
    iyaipu:
    - porul.513
    - porul.515
    - porul.535
    text: 'இயைபு (649): 513 20; 515-534 ஒவ்வொன்றின் விரிவு; 535 முடிவு. எண்: 20 (பட்டியல்).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: அதிகார முறை
    saanru: அவைதாம்
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
  - peyar: தான் குறியிடுதல்
    saanru: என மொழிப
- id: porul.515
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 515
  moolam: |-
    அவற்றுள்
    பாஅ வண்ணம்
    சொற்சீர்த்து ஆகி நூற்பால் பயிலும்
  kaandigai:
    porul: பா வண்ணம் சொற்சீர்த்தாகி நூலில் பயிலும்.
    ethu: வண்ணம் இருபது (பொருள். 513); பாஅ வண்ணம் பட்டியலில் முதல் (பொருள். 514). "சொற்சீர்த்து" — சொற்சீரடியின் இயல்பு "சொற்சீர்த்து இறுதல் சொற்சீர்க்கு இயல்பே" (பொருள். 428); "நூற்பால் பயிலும்" — நூல் யாப்பில்.
    eduthukkaattu:
    - text: சொற்சீர்த்து
      from: porul.515
    - text: சொற்சீர்த்து இறுதல் சொற்சீர்க்கு இயல்பே
      from: porul.428
    - text: நூற்பால் பயிலும்
      from: porul.515
  nilai: ஒருதலை அன்மை
  kanini:
    kind: definition
    class: paa_varnam
    count: null
  links: []
  urai:
    iyaipu:
    - porul.428
    text: 'இயைபு (649): "சொற்சீர்த்து இறுதல் சொற்சீர்க்கு இயல்பே" (பொருள். 428); "சொற்சீர் அடியும் முடுகியல் அடியும் / அப் பா நிலைமைக்கு உரிய ஆகும்" (427). ஐயம்: "நூற்பால்" — "நூலின்கண்" எனவும் "நூற்பா" எனவும் கொள்ள இயலும்; "நூற்பா" என்ற வடிவம் நூலுள் வேறெங்கும் இல்லை — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக; உரை சுட்டிய ஐயம் ஒருதலை அன்மை
  utthi:
  - peyar: அதிகார முறை
    saanru: அவற்றுள்
- id: porul.516
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 516
  moolam: |-
    தாஅ வண்ணம்
    இடையிட்டு வந்த எதுகைத்து ஆகும்
  kaandigai:
    porul: தா வண்ணம் இடையிட்டு வந்த எதுகையுடையது.
    ethu: எதுகை தொடை வகை நான்கனுள் ஒன்று — "மோனை எதுகை முரணே இயைபு என" (பொருள். 393); இரண்டாம் எழுத்து ஒன்றுதல் — "அஃது ஒழித்து ஒன்றின் எதுகை ஆகும்" (பொருள். 398). இவ்வண்ணம் அதனை இடையிட்டு வரத் தொடுக்கிறது.
    eduthukkaattu:
    - text: மோனை எதுகை முரணே இயைபு என
      from: porul.393
    - text: அஃது ஒழித்து ஒன்றின் எதுகை ஆகும்
      from: porul.398
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: thaa_varnam
    count: null
  links: []
  urai:
    iyaipu:
    - porul.513
    - porul.514
    text: 'இயைபு (649): பொருள். 513, 514 — எதுகை தொடை நான்கனுள் ஒன்று (393); "அஃது ஒழித்து ஒன்றின் எதுகை ஆகும்" (398). "ஒரு சீர் இடையிட்டு எதுகை ஆயின் / பொழிப்பு" (403); "இரு சீர் இடையிடின் ஒரூஉ" (404). தா வண்ணத்தின் "இடையிட்டு" இவற்றுள் எதைக் குறிக்கும் என நூல் வரையறுக்கவில்லை — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.517
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 517
  moolam: |-
    வல்லிசை வண்ணம் வல்லெழுத்து மிகுமே
  kaandigai:
    porul: வல்லிசை வண்ணத்தில் வல்லெழுத்து மிகும்.
    ethu: எழுத்ததிகாரம் மெய்யை மூவினமாகப் பிரித்தது (எழு. 19–21); வண்ணம் அதே பிரிவால் ஓசையை வகுக்கிறது. எ.கா. வல்லெழுத்து — "வல்லெழுத் தென்ப க ச ட த ப ற" (எழு. 19).
    eduthukkaattu:
    - text: வல்லெழுத் தென்ப க ச ட த ப ற
      from: ezhu.19
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: vallisai_varnam
    count: null
  links: []
  urai:
    iyaipu:
    - ezhu.19
    text: 'இயைபு (649): "வல்லெழுத் தென்ப க ச ட த ப ற" (எழு. 19). எவ்வளவு மிகின் "மிகும்" என்ற எண் நூலில் இல்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.518
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 518
  moolam: |-
    மெல்லிசை வண்ணம் மெல்லெழுத்து மிகுமே
  kaandigai:
    porul: மெல்லிசை வண்ணத்தில் மெல்லெழுத்து மிகும்.
    ethu: முன் சூத்திரத்தின் வல்லிசை வண்ணத்துக்கு இணையாக, எழு. 20-இன் மெல்லினம். எ.கா. "மெல்லெழுத் தென்ப ங ஞ ண ந ம ன" (எழு. 20).
    eduthukkaattu:
    - text: மெல்லெழுத் தென்ப ங ஞ ண ந ம ன
      from: ezhu.20
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: mellisai_varnam
    count: null
  links: []
  urai:
    iyaipu:
    - ezhu.20
    text: 'இயைபு (649): "மெல்லெழுத் தென்ப ங ஞ ண ந ம ன" (எழு. 20). எண் நூலில் இல்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.519
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 519
  moolam: |-
    இயைபு வண்ணம் இடையெழுத்து மிகுமே
  kaandigai:
    porul: இயைபு வண்ணத்தில் இடையெழுத்து மிகும். "இயைபு" என்ற பெயர் தொடையிலும் (401), வனப்பிலும் (541) வேறு பொருளில் வருகிறது.
    ethu: வல்லிசை, மெல்லிசை வண்ணத்தைத் தொடர்ந்து மூன்றாவது இனம் — "இடையெழுத்தென்ப ய ர ல வ ழ ள" (எழு. 21). மூன்றும் எழுத்ததிகாரத்தின் வரிசையிலேயே.
    eduthukkaattu:
    - text: இடையெழுத்தென்ப ய ர ல வ ழ ள
      from: ezhu.21
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: iyiapuv_varnam
    count: null
  links: []
  urai:
    iyaipu:
    - ezhu.21
    - ezhu.19
    - ezhu.20
    text: 'இயைபு (649): "இடையெழுத்தென்ப ய ர ல வ ழ ள" (எழு. 21). 517–519 மூன்றும் மெய்யின் மூவினத்தை (எழு. 19–21) அதே முறையில் பின்பற்றுகின்றன.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.520
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 520
  moolam: |-
    அளபெடை வண்ணம் அளபெடை பயிலும்
  kaandigai:
    porul: அளபெடை வண்ணத்தில் அளபெடை பயிலும்.
    ethu: 'அளபெடை எழுத்ததிகாரம் கூறியது: "நீட்டம் வேண்டின் அவ்வள புடைய / கூட்டி யெழூஉதல்" (எழு. 6). எ.கா. நூலுள் அளபெடைச் சொல் — "ஆடூஉ அறி சொல் மகடூஉ அறி சொல்" (சொல். 2).'
    eduthukkaattu:
    - text: நீட்டம் வேண்டின் அவ்வள புடைய / கூட்டி யெழூஉதல்
      from: ezhu.6
    - text: ஆடூஉ அறி சொல் மகடூஉ அறி சொல்
      from: sol.2
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: alapetai_varnam
    count: null
  links: []
  urai:
    iyaipu:
    - ezhu.41
    - ezhu.6
    text: 'இயைபு (649): "குன்றிசை மொழிவயின் நின்றிசை நிறைக்கும் / நெட்டெழுத் திம்பர் ஒத்தகுற் றெழுத்தே" (எழு. 41); "நீட்டம் வேண்டின் அவ்வள புடைய / கூட்டி யெழூஉதல்" (எழு. 6). தொடையில்: "அளபு எழின் அவையே அளபெடைத் தொடையே" (402). வண்ணம் "பயிலும்" — தொடை "எழின்"; வேறுபாடு மிகுதி எனக் கொள்ளல் ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.521
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 521
  moolam: |-
    நெடுஞ்சீர் வண்ணம் நெட்டெழுத்துப் பயிலும்
  kaandigai:
    porul: நெடுஞ்சீர் வண்ணத்தில் நெட்டெழுத்துப் பயிலும்.
    ethu: நெடில் ஈரளபு (எழு. 4); அது பயின்றால் சீர் நீளும் — ஆகவே "நெடுஞ்சீர்". எ.கா. நெடில் பயிலும் தொடர் — "ஆ ஈ ஊ ஏ ஐ ஓ ஔ" (எழு. 4).
    eduthukkaattu:
    - text: நெடுஞ்சீர்
      from: porul.521
    - text: ஆ ஈ ஊ ஏ ஐ ஓ ஔ
      from: ezhu.4
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: netunchir_varnam
    count: null
  links: []
  urai:
    iyaipu:
    - ezhu.4
    text: 'இயைபு (649): நெட்டெழுத்து "ஆ ஈ ஊ ஏ ஐ ஓ ஔ" (எழு. 4). பெயரில் "சீர்" இருப்பினும் சூத்திரம் எழுத்தையே சொல்கிறது.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.522
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 522
  moolam: |-
    குறுஞ்சீர் வண்ணம் குற்றெழுத்துப் பயிலும்
  kaandigai:
    porul: குறுஞ்சீர் வண்ணத்தில் குற்றெழுத்துப் பயிலும்.
    ethu: குறில் ஓரளபு (எழு. 3); அது பயின்றால் சீர் குறுகும். நெடுஞ்சீர் வண்ணத்தின் (பொருள். 521) மறுதலை. எ.கா. "அ இ உ எ ஒ" (எழு. 3).
    eduthukkaattu:
    - text: அ இ உ எ ஒ
      from: ezhu.3
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: kurunchir_varnam
    count: null
  links: []
  urai:
    iyaipu:
    - ezhu.3
    text: 'இயைபு (649): குற்றெழுத்து "அ இ உ எ ஒ" (எழு. 3). 521, 522, 523 ஒரு தொகுதி: நெடில் பயிலல், குறில் பயிலல், இரண்டும் உடன் வருதல்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.523
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 523
  moolam: |-
    சித்திர வண்ணம்
    நெடியவும் குறியவும் நேர்ந்து உடன் வருமே
  kaandigai:
    porul: சித்திர வண்ணத்தில் நெடியவும் குறியவும் ஒத்து உடன் வரும்.
    ethu: நெடுஞ்சீர் (பொருள். 521), குறுஞ்சீர் (பொருள். 522) வண்ணங்களைத் தொடர்ந்து இரண்டும் உடன் வருவது. குறில், நெடில் இரண்டும் அசையின் அடிப்படை — "குறிலே நெடிலே குறில் இணை குறில் நெடில்" (பொருள். 312).
    eduthukkaattu:
    - text: குறிலே நெடிலே குறில் இணை குறில் நெடில்
      from: porul.312
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    class: sithira_varnam
    count: null
  links: []
  urai:
    iyaipu:
    - ezhu.4
    - ezhu.3
    - porul.310
    text: 'இயைபு (649): நெடியவை — "ஆ ஈ ஊ ஏ ஐ ஓ ஔ", ஈரளபு இசைப்பன (எழு. 4); குறியவை — "அ இ உ எ ஒ", ஓரளபு இசைப்பன (எழு. 3). வண்ணம் செய்யுள் உறுப்புகளுள் ஒன்று (பொருள். 310); நூல் வகுத்த இருபது வண்ணத்துள் (513, 514) இது ஒன்பதாவது. அயல் சூத்திரங்கள்: "நெடுஞ்சீர் வண்ணம் நெட்டெழுத்துப் பயிலும்" (521), "குறுஞ்சீர் வண்ணம் குற்றெழுத்துப் பயிலும்" (522) — சித்திர வண்ணம் அவ்விரண்டும் உடன் வருவது. கடாஅ (650): "நெடிலும் குறிலும் எச்செய்யுளிலும் வருமே; இது எவ்வாறு தனி வண்ணம்?" — விடை (தன் நூலான்): 521, 522 "பயிலும்" என ஒன்று மிகுதலைச் சொல்கின்றன; 523 "நேர்ந்து உடன் வருமே" என இரண்டும் உடன் வருதலைச் சொல்கிறது — இதுவே வேறுபாடு. ஐயம்: "நேர்ந்து" — "ஒத்து" எனவும், நேர் அசையொடு (பொருள். 312) தொடர்புடையது எனவும் கொள்ள இயலும்; நூலுள் இச்சொல் வேறிடத்தில் "நேர்ந்தன பிறவும்" (பொருள். 632) என மட்டும் வருகிறது — ஒருதலை அன்மை. நூலில் இல்லை: நெடில்–குறில் எந்த அளவில் கலக்க வேண்டும் என்ற எண்; "சித்திரம்" என்ற தனிச்சொல் ("சித்திர" இவ்வண்ணப் பெயரில் மட்டும் — 514, 523).'
    vagai: விதி
    maruthalai:
    - kadaa: '"நெடிலும் குறிலும் எச்செய்யுளிலும் வருமே; இது எவ்வாறு தனி வண்ணம்?'
      maattram: '" — விடை (தன் நூலான்): 521, 522 "பயிலும்" என ஒன்று மிகுதலைச் சொல்கின்றன; 523 "நேர்ந்து உடன் வருமே" என இரண்டும் உடன் வருதலைச் சொல்கிறது — இதுவே வேறுபாடு.'
      saanru:
      - text: நேர்ந்து உடன் வருமே
        from: porul.523
    thunivu: நூலில் நேரடியாக; உரை சுட்டிய ஐயம் ஒருதலை அன்மை
- id: porul.524
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 524
  moolam: |-
    நலிபு வண்ணம் ஆய்தம் பயிலும்
  kaandigai:
    porul: நலிபு வண்ணத்தில் ஆய்தம் பயிலும்.
    ethu: ஆய்தம் சார்பெழுத்து (எழு. 2); அது குறிலை அடுத்து வல்லெழுத்தின் மேல் வரும் — "குறியதன் முன்னர் ஆய்தப் புள்ளி" (எழு. 38). எ.கா. நூலுள் ஆய்தச் சொல் — "அஃது ஒழித்து" (பொருள். 398).
    eduthukkaattu:
    - text: குறியதன் முன்னர் ஆய்தப் புள்ளி
      from: ezhu.38
    - text: அஃது ஒழித்து
      from: porul.398
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: nalipu_varnam
    count: null
  links: []
  urai:
    iyaipu:
    - ezhu.2
    - ezhu.38
    text: 'இயைபு (649): ஆய்தம் சார்பெழுத்து மூன்றனுள் ஒன்று (எழு. 2); "குறியதன் முன்னர் ஆய்தப் புள்ளி / உயிரொடு புணர்ந்தவல் லாறன் மிசைத்தே" (எழு. 38). "நலிபு" என்ற சொல்லின் பொருள் நூலில் இல்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.525
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 525
  moolam: |-
    அகப்பாட்டு வண்ணம்
    முடியாத் தன்மையின் முடிந்ததன் மேற்றே
  kaandigai:
    porul: அகப்பாட்டு வண்ணம் முடியாத தன்மையால் முடிந்ததன் மேலது.
    ethu: 'அகப்பாட்டு, புறப்பாட்டு என்ற இரு வண்ணமும் ஒன்றன் மறுதலை ஒன்று: இது "முடியாத் தன்மையின் முடிந்ததன் மேற்றே"; அடுத்தது "முடிந்தது போன்று முடியாதாகும்" (பொருள். 526). எதிர் பொருள் உணர்த்தல் (பொருள். 656) உத்தி.'
    eduthukkaattu:
    - text: முடியாத் தன்மையின் முடிந்ததன் மேற்றே
      from: porul.525
    - text: முடிந்தது போன்று முடியாதாகும்
      from: porul.526
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    class: agappattu_varnam
    count: null
  links: []
  urai:
    iyaipu:
    - porul.513
    - porul.514
    text: 'இயைபு (649): பொருள். 513, 514 · ஐயம்: எது "முடியாது" (பொருளா, ஓசையா) என நூல் சொல்லவில்லை — ஒருதலை அன்மை. 526 இதன் மறுதலை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக; உரை சுட்டிய ஐயம் ஒருதலை அன்மை
- id: porul.526
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 526
  moolam: |-
    புறப்பாட்டு வண்ணம்
    முடிந்தது போன்று முடியாதாகும்
  kaandigai:
    porul: புறப்பாட்டு வண்ணம் முடிந்தது போன்று முடியாதது.
    ethu: முன் சூத்திரத்தின் மறுதலை (பொருள். 525) — "முடிந்தது போன்று முடியா". இரண்டையும் இணைத்து எதிர்மறையால் உணர்த்தல் "எதிர் மறுத்து உணரின் அத் திறத்தவும் அவையே" (பொருள். 655) என்ற நெறிக்கு ஒப்பு.
    eduthukkaattu:
    - text: முடிந்தது போன்று முடியா
      from: porul.526
    - text: எதிர் மறுத்து உணரின் அத் திறத்தவும் அவையே
      from: porul.655
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: purappattu_varnam
    count: null
  links: []
  urai:
    iyaipu:
    - porul.513
    - porul.514
    text: 'இயைபு (649): பொருள். 513, 514 · 525-இன் மறுதலை: அது "முடியாத் தன்மையின் முடிந்தது"; இது "முடிந்தது போன்று முடியாதது". "அகம் / புறம்" என்ற பெயர் அகத்திணை, புறத்திணையோடு தொடர்புடையதா என்பது நூலில் இல்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.527
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 527
  moolam: |-
    ஒழுகு வண்ணம் ஓசையின் ஒழுகும்
  kaandigai:
    porul: ஒழுகு வண்ணம் ஓசையால் ஒழுகும்.
    ethu: வண்ணம் ஓசையின் வகை; ஓசைகளை நூல் பாவால் பகுக்கிறது — "அகவல் என்பது ஆசிரியம்மே" (பொருள். 386), "துள்ளல் ஓசை கலி என மொழிப" (பொருள். 388), "தூங்கல் ஓசை வஞ்சி ஆகும்" (பொருள். 389).
    eduthukkaattu:
    - text: அகவல் என்பது ஆசிரியம்மே
      from: porul.386
    - text: துள்ளல் ஓசை கலி என மொழிப
      from: porul.388
    - text: தூங்கல் ஓசை வஞ்சி ஆகும்
      from: porul.389
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ozhuku_varnam
    count: null
  links: []
  urai:
    iyaipu:
    - porul.513
    - porul.514
    text: 'இயைபு (649): பொருள். 513, 514 — நூல் கூறும் ஓசைகள் — "அகவல் என்பது ஆசிரியம்மே" (386), "துள்ளல் ஓசை கலி என மொழிப" (388), "தூங்கல் ஓசை வஞ்சி ஆகும்" (389). ஒழுகு வண்ணம் எவ்வோசை என்பதை நூல் சுட்டவில்லை — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.528
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 528
  moolam: |-
    ஒரூஉ வண்ணம் ஒரீஇத் தொடுக்கும்
  kaandigai:
    porul: ஒரூஉ வண்ணம் நீக்கித் தொடுக்கும்.
    ethu: ஒரூஉ என்ற பெயர் தொடையிலும் வருகிறது — "இரு சீர் இடையிடின் ஒரூஉ என மொழிப" (பொருள். 404); "பொழிப்பும் ஒரூஉவும் செந்தொடை மரபும்" (பொருள். 395). வண்ணத்திலும் அதே "ஒரீஇ" (நீக்கி) தொடுத்தல்.
    eduthukkaattu:
    - text: இரு சீர் இடையிடின் ஒரூஉ என மொழிப
      from: porul.404
    - text: பொழிப்பும் ஒரூஉவும் செந்தொடை மரபும்
      from: porul.395
    - text: ஒரீஇ
      from: porul.528
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: oruu_varnam
    count: null
  links: []
  urai:
    iyaipu:
    - porul.513
    - porul.514
    text: 'இயைபு (649): பொருள். 513, 514 — தொடையில் "இரு சீர் இடையிடின் ஒரூஉ என மொழிப" (404); "பொழிப்பும் ஒரூஉவும் செந்தொடை மரபும்" (395). வண்ணத்தின் "ஒரீஇ" இத்தொடையோடு ஒன்றா என்பது ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.529
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 529
  moolam: |-
    எண்ணு வண்ணம் எண்ணுப் பயிலும்
  kaandigai:
    porul: எண்ணு வண்ணத்தில் எண்ணுப் பயிலும்.
    ethu: எண் சொல்லதிகாரம் கூறிய இடைச்சொற்களால் வருவது — "உம்மை எண்ணும் என என் எண்ணும்" (சொல். 289), "எண் ஏகாரம்" (சொல். 290). எ.கா. நூலுள் எண்ணு — "நகையே அழுகை இளிவரல் மருட்கை" (பொருள். 247).
    eduthukkaattu:
    - text: உம்மை எண்ணும் என என் எண்ணும்
      from: sol.289
    - text: எண் ஏகாரம்
      from: sol.290
    - text: நகையே அழுகை இளிவரல் மருட்கை
      from: porul.247
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ennu_varnam
    count: null
  links: []
  urai:
    iyaipu:
    - sol.289
    - sol.290
    - sol.291
    - porul.428
    text: 'இயைபு (649): எண் இடைச்சொற்கள் — "உம்மை எண்ணும் என என் எண்ணும்" (சொல். 289); "எண் ஏகாரம்" (சொல். 290); எனா, என்று (சொல். 291); சொற்சீரில் "எண்ணொடு புணர்ந்தும்" (பொருள். 428). எண்ணு வண்ணம் இவற்றால் அமைவது — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.530
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 530
  moolam: |-
    அகைப்பு வண்ணம் அறுத்து அறுத்து ஒழுகும்
  kaandigai:
    porul: அகைப்பு வண்ணம் அறுத்து அறுத்து ஒழுகும்.
    ethu: ஒழுகு வண்ணம் (பொருள். 527) தொடர்ந்து செல்லும் ஓசை; இது அதன் மறுதலை — அறுத்து அறுத்துச் செல்லும். எதை அறுப்பது என்பதை நூல் கூறாததால் ஒருதலை அன்மை.
    eduthukkaattu: []
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: agaippu_varnam
    count: null
  links: []
  urai:
    iyaipu:
    - porul.513
    - porul.514
    text: 'இயைபு (649): பொருள். 513, 514 · "அகைப்பு" இச்சூத்திரத்தில் மட்டும். எதனை அறுத்து அறுத்து ஒழுகுவது (ஓசையா, சொல்லா) — நூலில் இல்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.531
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 531
  moolam: |-
    தூங்கல் வண்ணம் வஞ்சி பயிலும்
  kaandigai:
    porul: 'தூங்கல் வண்ணத்தில் வஞ்சி பயிலும். தூங்கல் ஓசை வஞ்சி: 389.'
    ethu: வஞ்சியின் ஓசை தூங்கல் — "தூங்கல் ஓசை வஞ்சி ஆகும்" (பொருள். 389); ஆகவே வஞ்சி பயிலும் வண்ணம் "தூங்கல்" எனப் பெயர் பெறுகிறது. வஞ்சியின் தூக்கு — "வஞ்சித் தூக்கே செந்தூக்கு இயற்றே" (பொருள். 377).
    eduthukkaattu:
    - text: தூங்கல் ஓசை வஞ்சி ஆகும்
      from: porul.389
    - text: தூங்கல்
      from: porul.531
    - text: வஞ்சித் தூக்கே செந்தூக்கு இயற்றே
      from: porul.377
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: thoongal_varnam
    count: null
  links: []
  urai:
    iyaipu:
    - porul.513
    - porul.514
    text: 'இயைபு (649): பொருள். 513, 514 — "தூங்கல் ஓசை வஞ்சி ஆகும்" (389); "வஞ்சித் தூக்கே செந்தூக்கு இயற்றே" (377). பெயரும் பொருளும் நூலுள்ளே இணைகின்றன — நூலில் நேரடியாக.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.532
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 532
  moolam: |-
    ஏந்தல் வண்ணம்
    சொல்லிய சொல்லின் சொல்லியது சிறக்கும்
  kaandigai:
    porul: ஏந்தல் வண்ணத்தில் சொல்லிய சொல்லால் சொல்லியது சிறக்கும்.
    ethu: நூலின் சிதைவான "கூறியது கூறல்" (பொருள். 654) நூல் யாப்புக்கு; இது செய்யுள் வண்ணம் — "சொல்லப்பட்டன எல்லா மாண்பும் / மறுதலை ஆயினும் மற்று அது சிதைவே" (பொருள். 651) நூலுக்கே கூறப்பட்டது.
    eduthukkaattu:
    - text: கூறியது கூறல்
      from: porul.654
    - text: சொல்லப்பட்டன எல்லா மாண்பும் / மறுதலை ஆயினும் மற்று அது சிதைவே
      from: porul.651
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: enthel_varnam
    count: null
  links: []
  urai:
    iyaipu:
    - porul.654
    text: '"ஏந்தல்" இச்சூத்திரத்தில் மட்டும். கடாஅ (650): "கூறியது கூறல்" சிதைவு அன்றோ (பொருள். 654)? — விடை: 654 நூலின் சிதைவு; 532 செய்யுள் வண்ணம், சொல்லியது சிறக்கும் இடம் — ஒருதலை அன்மை.'
    vagai: விதி
    maruthalai:
    - kadaa: '"கூறியது கூறல்" சிதைவு அன்றோ (பொருள். 654)?'
      maattram: '— விடை: 654 நூலின் சிதைவு; 532 செய்யுள் வண்ணம், சொல்லியது சிறக்கும் இடம் — ஒருதலை அன்மை.'
      saanru:
      - text: கூறியது கூறல்
        from: porul.654
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: கூறிற்று என்றல்
    saanru: சொல்லிய
- id: porul.533
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 533
  moolam: |-
    உருட்டு வண்ணம் அராகம் தொடுக்கும்
  kaandigai:
    porul: உருட்டு வண்ணம் அராகம் தொடுக்கும்.
    ethu: அராகம் கலிப்பாவின் உறுப்பு — "கொச்சகம் அராகம் சுரிதகம் எருத்தொடு" (பொருள். 426); "எருத்தே கொச்சகம் அராகம் சிற்றெண்" (பொருள். 455). அது தொடுக்கப்படும் ஓசை உருட்டு வண்ணம்.
    eduthukkaattu:
    - text: கொச்சகம் அராகம் சுரிதகம் எருத்தொடு
      from: porul.426
    - text: எருத்தே கொச்சகம் அராகம் சிற்றெண்
      from: porul.455
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: uruttu_varnam
    count: null
  links: []
  urai:
    iyaipu:
    - porul.513
    - porul.514
    text: 'இயைபு (649): பொருள். 513, 514 — அராகம் கலியின் உறுப்பு — "கொச்சகம் அராகம் சுரிதகம் எருத்தொடு" (426); "எருத்தே கொச்சகம் அராகம் சிற்றெண்" (455). அராகத்தின் இலக்கணம் நூலில் இல்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.534
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 534
  moolam: |-
    முடுகு வண்ணம்
    அடி இறந்து ஓடி அதன் ஓரற்றே
  kaandigai:
    porul: முடுகு வண்ணம் அடி கடந்து ஓடி அதனோடு ஒக்கும்.
    ethu: கலிக்கு உரிய அடிகளுள் முடுகியல் அடி — "சொற்சீர் அடியும் முடுகியல் அடியும்" (பொருள். 427); அது அடி இறந்து ஓடுவதால் "முடுகு" வண்ணம். வண்ணப் பட்டியலின் இறுதி (பொருள். 514).
    eduthukkaattu:
    - text: சொற்சீர் அடியும் முடுகியல் அடியும்
      from: porul.427
    - text: முடுகு
      from: porul.534
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: mutuku_varnam
    count: null
  links: []
  urai:
    iyaipu:
    - porul.513
    - porul.514
    text: 'இயைபு (649): பொருள். 513, 514 — "சொற்சீர் அடியும் முடுகியல் அடியும்" (427). கடாஅ (650): "அடி உள்ளனவே தளையொடு தொடையே" (341), "அடி இறந்து வருதல் இல் என மொழிப" (342) — தளையும் தொடையும் அடி கடவா; முடுகு வண்ணமோ "அடி இறந்து ஓடி" வரும். "அதன் ஓரற்றே" — அவ்வடியோடு ஒக்கும். இரண்டன் தொடர்பை நூல் தீர்க்கவில்லை — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.535
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 535
  moolam: |-
    வண்ணம்தாமே இவை என மொழிப
  kaandigai:
    porul: வண்ணம் இவை என்பர்.
    ethu: 534 முடுகு என்றது; வண்ணம் இவை என மொழி — 20 வண்ணத்தின் முடிவு.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: meta
    class: varnam_mudivu
    count: null
  links: []
  urai:
    iyaipu:
    - porul.514
    - porul.534
    - porul.536
    text: 'இயைபு (649): 514 20; 534 முடுகு; 536 வனப்பு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
  - peyar: தான் குறியிடுதல்
    saanru: என மொழிப
- id: porul.536
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 536
  moolam: |-
    வனப்பு இயல்தானே வகுக்கும் காலை
    சில் மென் மொழியான் தாய பனுவலின்
    அம்மைதானே அடி நிமிர்வு இன்றே
  kaandigai:
    porul: 'வனப்பியல் — அம்மை: சில மென்மொழியால் தொகுத்த பனுவல்; அடி நிமிர்வு இல்லை.'
    ethu: 535 என்றது; இனி வனப்பு. வனப்பு 8 — முதல் அம்மை — சில் மென்மொழியான் தாய பனுவலின் அம்மை, அடிநிமிர்வு இன்றே.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: ammai_vanappu
    count: null
  links: []
  urai:
    iyaipu:
    - porul.310
    - porul.535
    - porul.537
    text: 'இயைபு (649): 310 ''அம்மை அழகு தொன்மை தோலே'' — 8 வனப்பு; 535 வண்ணம் முடிவு; 537 அழகு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.537
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 537
  moolam: |-
    செய்யுள் மொழியான் சீர் புனைந்து யாப்பின்
    அவ் வகைதானே அழகு எனப்படுமே
  kaandigai:
    porul: 'அழகு: செய்யுள் மொழியால் சீர் புனைந்து யாக்கும் வகை.'
    ethu: 536 அம்மை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: azhaku_vanappu
    count: null
  links: []
  urai:
    iyaipu:
    - porul.536
    - porul.538
    text: 'இயைபு (649): 536 அம்மை; 538 தொன்மை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தான் குறியிடுதல்
    saanru: எனப்படுமே
- id: porul.538
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 538
  moolam: |-
    தொன்மைதானே
    உரையொடு புணர்ந்த யாப்பின் மேற்றே
  kaandigai:
    porul: 'தொன்மை: உரையொடு புணர்ந்த யாப்பின் மேலது.'
    ethu: 537 அழகு என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: thonmai_vanappu
    count: null
  links: []
  urai:
    iyaipu:
    - porul.537
    - porul.539
    text: 'இயைபு (649): 537 அழகு; 539 தோல்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.539
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 539
  moolam: |-
    இழுமென் மொழியான் விழுமியது நுவலினும்
    பரந்த மொழியான் அடி நிமிர்ந்து ஒழுகினும்
    தோல் என மொழிப தொல் மொழிப் புலவர்
  kaandigai:
    porul: 'தோல்: இழுமென் மொழியால் விழுமியதைக் கூறினும், பரந்த மொழியால் அடி நிமிர்ந்து ஒழுகினும்.'
    ethu: 538 தொன்மை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: thol_vanappu
    count: null
  links: []
  urai:
    iyaipu:
    - porul.538
    - porul.540
    text: 'இயைபு (649): 538 தொன்மை; 540 விருந்து.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
  - peyar: தான் குறியிடுதல்
    saanru: என மொழிப
- id: porul.540
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 540
  moolam: |-
    விருந்தேதானும்
    புதுவது புனைந்த யாப்பின் மேற்றே
  kaandigai:
    porul: 'விருந்து: புதுவது புனைந்த யாப்பின் மேலது.'
    ethu: 539 தோல் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: virunthu_vanappu
    count: null
  links: []
  urai:
    iyaipu:
    - porul.539
    - porul.541
    text: 'இயைபு (649): 539 தோல்; 541 இயைபு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.541
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 541
  moolam: |-
    ஞகாரை முதலா ளகாரை ஈற்றுப்
    புள்ளி இறுதி இயைபு எனப்படுமே
  kaandigai:
    porul: 'இயைபு: ஞகாரம் முதல் ளகாரம் ஈறான புள்ளி இறுதியுடையது. எழு. 78 "ஞ ண ந ம ன ய ர ல வ ழ ள என்னும் / அப்பதி னொன்றே புள்ளி யிறுதி" — அப்பட்டியலும் ஞ-வில் தொடங்கி ள-வில் முடிகிறது; இயைபு வனப்பு அப்பதினொரு புள்ளியீற்றுச் சொற்களால் முடிவதா என்பதை நூல் கூறவில்லை (ஒருதலை அன்மை).'
    en:
      kooruvathu: null
      enniyathu: 11
    ethu: 540 விருந்து என்றது; இயைபு — ஞகாரை முதலா ளகாரை ஈற்றுப் புள்ளி இறுதி இயைபு எனப்படும்.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: definition
    class: iyiapu_vanappu
    count: 11
  links: []
  urai:
    iyaipu:
    - porul.540
    - porul.542
    - porul.401
    text: 'இயைபு (649): 540 விருந்து; 542 புலன்; 401 இயைபுத் தொடை — இணை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக; காண்டிகை சுட்டிய ஐயம் ஒருதலை அன்மை
  utthi:
  - peyar: தான் குறியிடுதல்
    saanru: எனப்படுமே
- id: porul.542
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 542
  moolam: |-
    சேரி மொழியான் செவ்விதின் கிளந்து
    தேர்தல் வேண்டாது குறித்தது தோன்றின்
    புலன் என மொழிப புலன் உணர்ந்தோரே
  kaandigai:
    porul: 'புலன்: சேரி மொழியால் செவ்விதாகக் கூறி, ஆராய வேண்டாமல் குறித்தது தோன்றுவது.'
    ethu: 541 இயைபு என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: pulan_vanappu
    count: null
  links: []
  urai:
    iyaipu:
    - porul.541
    - porul.543
    text: 'இயைபு (649): 541 இயைபு; 543 இழைபு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
  - peyar: கூறிற்று என்றல்
    saanru: கிளந்து
  - peyar: தான் குறியிடுதல்
    saanru: என மொழிப
- id: porul.543
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 543
  moolam: |-
    ஒற்றொடு புணர்ந்த வல்லெழுத்து அடங்காது
    குறளடி முதலா ஐந்து அடி ஒப்பித்து
    ஓங்கிய மொழியான் ஆங்கு அவண் மொழியின்
    இழைபின் இலக்கணம் இயைந்ததாகும்
  kaandigai:
    porul: 'இழைபு: ஒற்றொடு புணர்ந்த வல்லெழுத்து அடங்காமல், குறளடி முதல் ஐந்து அடியும் ஒப்பித்து, ஓங்கிய மொழியால் கூறுவது. 536–543 எட்டும் 310-இன் "எட்டொடும் தொகைஇ" என்ற எட்டு வனப்போடு பெயருக்குப் பெயர் ஒத்தன (எண்ணிச் சரிபார்த்தது).'
    ethu: 542 புலன் என்றது; இழைபு — ஒற்றொடு புணர்ந்த வல்லெழுத்து அடங்காது, குறளடி முதல் ஐந்து அடி ஒப்பித்து, ஓங்கிய மொழியான்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: izhaipu_vanappu
    count: null
  links: []
  urai:
    iyaipu:
    - porul.542
    - porul.544
    - porul.340
    text: 'இயைபு (649): 542 புலன்; 544 ஓத்து முடிவு; 340 அடி.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: ஐந்து
- id: porul.544
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 544
  moolam: |-
    செய்யுள் மருங்கின் மெய் பெற நாடி
    இழைத்த இலக்கணம் பிழைத்தன போல
    வருவ உள எனினும் வந்தவற்று இயலான்
    திரிபு இன்றி முடித்தல் தெள்ளியோர் கடனே
  kaandigai:
    porul: 'செய்யுளில் இலக்கணம் பிழைத்தன போல வருவன உளவாயினும், வந்தவற்றின் இயலால் திரிபின்றி முடித்தல் தெளிந்தோர் கடன். இது செய்யுளியலின் புறனடை; காண்க: எழு. 483, சொல். 463.'
    ethu: 'செய்யுளியலின் புறனடை: இலக்கணத்துக்கு மாறு போலத் தோன்றுவனவற்றையும் வந்தவற்றின் இயல்பால் முடிக்க. இதே நெறி எழுத்துக்கும் சொல்லுக்கும் — "வழங்கியல் மருங்கின்" (எழு. 483); "கிளந்தவற்று இயலான் உணர்ந்தனர் கொளலே" (சொல். 298).'
    eduthukkaattu:
    - text: வழங்கியல் மருங்கின்
      from: ezhu.483
    - text: கிளந்தவற்று இயலான் உணர்ந்தனர் கொளலே
      from: sol.298
  nilai: நூலில் நேரடியாக
  kanini:
    kind: meta
    class: porunadai
    count: null
  links: []
  urai:
    iyaipu:
    - ezhu.483
    - sol.463
    text: 'செய்யுளியலின் புறனடை: இலக்கணம் "பிழைத்தன போல" வருவனவற்றை "வந்தவற்று இயலான் திரிபு இன்றி முடித்தல்" — பிழை என முத்திரை குத்தாமல், வந்த வடிவத்தின் இயலால் முடிக்க. பரிசோதனை நெறியின் அடிப்படை இதுவே; எழு. 483, சொல். 463 உடன் ஒப்பு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒப்பக் கூறல்
    saanru: போல
  - peyar: ஆணை கூறல்
    saanru: கடனே
