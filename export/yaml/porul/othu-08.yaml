- id: porul.402
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 402
  moolam: |-
    அளபு எழின் அவையே அளபெடைத் தொடையே
  kaandigai:
    porul: அளபெடை எழுந்தால் அது அளபெடைத் தொடை.
    ethu: 401 இயைபு என்றது; அளபெடைத் தொடை — அளபு எழின் அவையே (அளபெடை வந்தால் அது தொடை).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: அளபெடை_தொடை
  links: []
  urai:
    iyaipu:
    - porul.394
    - porul.401
    text: 'இயைபு (649): 394 அளபெடை; 401 இயைபு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.403
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 403
  moolam: |-
    ஒரு சீர் இடையிட்டு எதுகை ஆயின்
    பொழிப்பு என மொழிதல் புலவர் ஆறே
  kaandigai:
    porul: ஒரு சீர் இடையிட்டு எதுகை வந்தால் பொழிப்பு.
    ethu: 402 அளபெடை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
