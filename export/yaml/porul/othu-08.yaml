    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.387
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 387
  moolam: |-
    அதாஅன்று என்ப வெண்பா யாப்பே
  kaandigai:
    porul: அஃதல்லாதது (செப்பல்) வெண்பா யாப்பு என்பர். "செப்பல்" என்ற பெயர் இந்நூற்பாவில் இல்லை.
    ethu: 386 அகவல் என்றது; வெண்பா யாப்பே — வெண்பா தனி யாப்பு.
