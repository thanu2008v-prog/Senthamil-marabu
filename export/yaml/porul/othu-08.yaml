- id: porul.385
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 385
  moolam: |-
    மரபேதானும்
    நாற் சொல் இயலான் யாப்புவழிப் பட்டன்று
  kaandigai:
    porul: மரபும் நாற்சொல் இயலால் (இயல், திரி, திசை, வட — சொல். 397) யாப்பு வழிப்பட்டது.
    ethu: 384 ஏழ் நிலம் என்றது; மரபு — நாற் சொல் இயலான் யாப்புவழிப் பட்டது (நாற்சொல் மரபின் வழி).
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    class: மரபு_நாற்சொல்
    count: 4
  links: []
  urai:
    iyaipu:
    - porul.384
    - porul.386
    - sol.397
    text: 'இயைபு (649): 384 7 நிலை; 386 அகவல். ''நாற் சொல்'' — சொல். 397 ''இயற்சொல் திரிசொல் திசைச்சொல் வடசொல் என்று அனைத்தே செய்யுள் ஈட்டச் சொல்லே'' — அந்நான்கே எனக் கொள்ளலாம்; இங்கு நூற்பா பெயர் சுட்டாததால் ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'நாற் சொல் இயலான்' — எவை 4 என்பது ஒருதலை அன்மை
- id: porul.386
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 386
  moolam: |-
    அகவல் என்பது ஆசிரியம்மே
  kaandigai:
