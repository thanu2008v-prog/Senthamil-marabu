- id: porul.437
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 437
  moolam: |-
    இடைநிலைப்பாட்டே தரவு போக்கு அடை என
    நடை நவின்று ஒழுகும் ஒன்று என மொழிப
  kaandigai:
    porul: 'ஒன்று: தரவு, இடைநிலைப்பாட்டு (தாழிசை), போக்கு, அடை என நடைபெற்று வருவது.'
    en:
      kooruvathu: null
      enniyathu: 4
    ethu: 436 ஒத்தாழிசை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: meta
    class: oththaazhisaikkali_structure
    count: 4
  links: []
  urai:
    iyaipu:
    - porul.436
    - porul.438
    - porul.440
    - porul.441
    text: 'இயைபு (649): 436 2 வகை; 438 தரவு; 440 அடை; 441 போக்கு. எண்: நூற்பா எண் கூறவில்லை; பெயர்கள் — இடைநிலைப்பாட்டு, தரவு, போக்கு, அடை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
