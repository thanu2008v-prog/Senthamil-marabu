    - porul.403
    - porul.405
    text: 'இயைபு (649): 403 பொழிப்பு; 405 செந்தொடை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
  - peyar: தான் குறியிடுதல்
    saanru: என மொழிப
- id: porul.405
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 405
  moolam: |-
    சொல்லிய தொடையொடு வேறுபட்டு இயலின்
    சொல் இயற் புலவர் அது செந்தொடை என்ப
  kaandigai:
    porul: கூறிய தொடைகளிலிருந்து வேறுபட்டு வந்தால் செந்தொடை.
    ethu: 404 ஒரூஉ என்றது; செந்தொடை — சொல்லிய தொடையொடு வேறுபட்டு இயலின்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: செந்தொடை_வரையறை
  links: []
  urai:
    iyaipu:
    - porul.395
    - porul.404
    - porul.406
    text: 'இயைபு (649): 404 ஒரூஉ; 406 மொத்த எண்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: புலவர்
  - peyar: கூறிற்று என்றல்
    saanru: சொல்லிய
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: porul.406
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 406
  moolam: |-
    மெய் பெறு மரபின் தொடை வகைதாமே
    ஐ ஈர் ஆயிரத்து ஆறு ஐஞ்ஞூற்றொடு
    தொண்டு தலை இட்ட பத்துக் குறை எழுநூற்று
    ஒன்பஃது என்ப உணர்ந்திசினோரே
  kaandigai:
    porul: 'மெய்பெறு மரபின் தொடைவகைகளின் தொகை நூற்பாவில் எண்சொற்களால் தரப்படுகிறது: "ஐ ஈர் ஆயிரத்து ஆறு ஐஞ்ஞூற்றொடு தொண்டு தலை இட்ட பத்துக் குறை எழுநூற்று ஒன்பஃது". இதை ஒரு எண்ணாகக் கணக்கிடுவது வாசிப்பைப் பொறுத்தது; நூலே கூட்டுத் தொகையைத் தரவில்லை. எழு. 103 "மூன்றுதலை யிட்ட முப்பதிற் றெழுத்தின்" — "தலையிட்ட" என்ற சொல்லை நூல் அங்கும் ஆள்கிறது; அதைக் கூட்டல் எனக் கொண்டால் அமைப்பு: \[ஐ ஈர் ஆயிரம்\] + \[ஆறு ஐஞ்ஞூறு\] + \[தொண்டு + (எழுநூற்று ஒன்பஃது − பத்து)\] என அமையலாம் (ஒருதலை அன்மை). ஆனால் "தொண்டு" என்ற எண்ணின் மதிப்பு நூலில் வேறெங்கும் இல்லை; "ஐ ஈர்", "ஆறு ஐஞ்ஞூறு" பெருக்கலா என்பதும் நூலில் இல்லை — ஆகவே இறுதி எண் ஒருதலை அன்மை.'
    ethu: 405 செந்தொடை என்றது; மெய்பெறு மரபின் தொடை வகையின் தொகையை எண் சொற்களால் கூறுகிறது.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: enumeration
    class: தொடை_தொகை
    items_not_named: true
  links: []
  urai:
    iyaipu:
    - porul.405
    - porul.393
    - porul.407
    text: 'இயைபு (649): 405 செந்தொடை; 393 தொடை; 407 விரிப்பின். ''ஐ ஈர் ஆயிரத்து ஆறு ஐஞ்ஞூற்றொடு தொண்டு தலை இட்ட பத்துக் குறை எழுநூற்று ஒன்பஃது'' — இச்சொற்களை எண்ணாக மாற்றும் பிரிப்பு நூலில் விரிக்கப்படவில்லை — வாசிப்பு ஐயம்.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; எண்ணின் பிரிப்பு வாசிப்பு ஐயம்; காண்டிகை சுட்டிய ஐயம் ஒருதலை அன்மை
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: ஆறு
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: porul.407
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 407
  moolam: |-
    தெரிந்தனர் விரிப்பின் வரம்பு இல ஆகும்
  kaandigai:
    porul: ஆராய்ந்து விரித்தால் எல்லையற்றவை ஆகும்.
    ethu: 406 தொடை வகைத் தொகை என்றது; தெரிந்தனர் விரிப்பின் வரம்பில — விரித்தால் முடிவில்லை.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: தொடை_வரம்பில
  links: []
