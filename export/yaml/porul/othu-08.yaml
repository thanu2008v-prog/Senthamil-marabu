    - porul.445
    - porul.446
    - porul.447
    - porul.448
    text: 'இயைபு (649): 443 வண்ணகம்; 445-448 ஒவ்வொன்றின் விரிவு. எண்: 4.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
