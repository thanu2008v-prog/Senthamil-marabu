    saanru: ஆறே
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: புலவர்
- id: porul.404
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 404
  moolam: |-
    இரு சீர் இடையிடின் ஒரூஉ என மொழிப
  kaandigai:
    porul: இரு சீர் இடையிட்டால் ஒரூஉ.
    ethu: 403 பொழிப்பு என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: ஒரூஉ_வரையறை
