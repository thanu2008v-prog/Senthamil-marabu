    text: 'இயைபு (649): 393 நான்கு தொடை; 395 பொழிப்பு/ஒரூஉ/செந்தொடை. எண்: ஐந்து (நூற்பா ''ஐந்தும்'') = நான்கு (393) + அளபெடை; ''தலைப்பெய'' — சேர என்னும் பொருளது, தனி உருப்படி அன்று.'
