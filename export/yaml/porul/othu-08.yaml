    - porul.445
    text: 'இயைபு (649): 437 இடைநிலை; 445 தரவு 4/6/8.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக; காண்டிகை சுட்டிய ஐயம் ஒருதலை அன்மை
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: ஆறு
  - peyar: வந்தது கொண்டு வாராதது உணர்த்தல்
    saanru: பிறவும்
- id: porul.439
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 439
  moolam: |-
    இடைநிலைப்பாட்டே
    தரவு அகப்பட்ட மரபினது என்ப
  kaandigai:
    porul: இடைநிலைப்பாட்டு தரவுக்கு உட்பட்ட (அளவு) மரபினது.
    ethu: 438 தரவு என்றது; இது அதன் தொடர்ச்சி.
