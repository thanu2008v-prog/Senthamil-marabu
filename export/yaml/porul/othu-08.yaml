# இக்கோப்பு data_v2-இலிருந்து உருவானது. 'moolam' (சூத்திரம்) திருத்தக் கூடாது (பொருள். 652).
- id: porul.310
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 310
  moolam: |-
    மாத்திரை எழுத்து இயல் அசை வகை எனாஅ
    யாத்த சீரே அடி யாப்பு எனாஅ
    மரபே தூக்கே தொடை வகை எனாஅ
    நோக்கே பாவே அளவு இயல் எனாஅ
    திணையே கைகோள் கூற்று வகை எனாஅ
    கேட்போர் களனே கால வகை எனாஅ
    பயனே மெய்ப்பாடு எச்ச வகை எனாஅ
    முன்னம் பொருளே துறை வகை எனாஅ
    மாட்டே வண்ணமொடு யாப்பு இயல் வகையின்
    ஆறு தலை இட்ட அந் நால் ஐந்தும்
    அம்மை அழகு தொன்மை தோலே
    விருந்தே இயைபே புலனே இழைபு எனாஅப்
    பொருந்தக் கூறிய எட்டொடும் தொகைஇ
    நல் இசைப் புலவர் செய்யுள் உறுப்பு என
    வல்லிதின் கூறி வகுத்து உரைத்தனரே
  kaandigai:
    porul: 'செய்யுள் உறுப்புகள்: மாத்திரை, எழுத்தியல், அசைவகை, சீர், அடி, யாப்பு, மரபு, தூக்கு, தொடைவகை, நோக்கு, பா, அளவியல், திணை, கைகோள், கூற்றுவகை, கேட்போர், களன், காலவகை, பயன், மெய்ப்பாடு, எச்சவகை, முன்னம், பொருள், துறைவகை, மாட்டு, வண்ணம் — "ஆறு தலை இட்ட அந் நால் ஐந்து" (26); அம்மை, அழகு, தொன்மை, தோல், விருந்து, இயைபு, புலன், இழைபு — எட்டு. மொத்தம் 34; இரு எண்ணும் நூற்பாவிலேயே உள்ளன.'
    ethu: பொருள் கூறிய பின் அது செய்யுளாகும் உறுப்புகளைத் தொகுக்கிறது; முதல் இரண்டும் எழுத்ததிகாரத்தில் கூறியவை — "மாத்திரை வகையும் எழுத்து இயல் வகையும் / மேல் கிளந்தனவே" (பொருள். 311). மூன்றாவது அசை — "நேரும் நிரையும்" (பொருள். 312).
    eduthukkaattu:
    - text: மாத்திரை வகையும் எழுத்து இயல் வகையும் / மேல் கிளந்தனவே
      from: porul.311
    - text: நேரும் நிரையும்
      from: porul.312
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: செய்யுள்_உறுப்பு
    count: 34
  links: []
  urai:
    iyaipu:
    - porul.311
    - porul.312
    - porul.468
    text: 'இயைபு (649): பொருள். 311, 312, 468 · செய்யுளியலின் நுதலியது: உறுப்பு "ஆறு தலை இட்ட அந் நால் ஐந்து" (26) + எட்டு வனப்பு = 34 — இரு எண்ணும் சூத்திரத்தில். 311: மாத்திரை, எழுத்தியல் "மேல் கிளந்தனவே" — எழுத்ததிகாரத்துக்குச் சுட்டல் (இறந்தது காத்தல் — 656). இப்பட்டியலின் வரிசையே பின்வரும் சூத்திர வரிசை (எ.கா. களன் 502, காலம் 503, பயன் 504; ஆய்வு 26).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: ஆறு
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: புலவர்
  - peyar: கூறிற்று என்றல்
    saanru: கூறிய
- id: porul.311
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 311
  moolam: |-
    அவற்றுள்
    மாத்திரை வகையும் எழுத்து இயல் வகையும்
    மேல் கிளந்தனவே என்மனார் புலவர்
  kaandigai:
    porul: 'அவற்றுள் மாத்திரை வகையும் எழுத்தியல் வகையும் முன்னரே (எழுத்ததிகாரத்தில்) கூறப்பட்டன. எ.கா. மாத்திரை: எழு. 3–12.'
    ethu: 310 உறுப்புகளின் பொது அறிமுகம்; மாத்திரை வகையும் எழுத்து இயலும் மேல் (எழுத்ததிகாரத்தில்) கிளந்தனவே — 310-இன் முதல் இரு உறுப்பு, புதிதன்று.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: முன்கூறிய_உறுப்பு
  links: []
  urai:
    iyaipu:
    - porul.310
    - ezhu.3
    - ezhu.19
    - ezhu.103
    text: 'இயைபு (649): 310 உறுப்பு பட்டியல்; எழு. 3-13 (மாத்திரை), எழு. 1-33, 103 (எழுத்து இயல்) — இவை முன்னரே விரிவாகக் கூறப்பட்டன.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: அதிகார முறை
    saanru: அவற்றுள்
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்மனார்
  - peyar: கூறிற்று என்றல்
    saanru: கிளந்தனவே
- id: porul.312
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 312
  moolam: |-
    குறிலே நெடிலே குறில் இணை குறில் நெடில்
    ஒற்றொடு வருதலொடு மெய்ப் பட நாடி
    நேரும் நிரையும் என்றிசின் பெயரே
  kaandigai:
    porul: குறில், நெடில், குறிலிணை, குறில்நெடில் — ஒற்றொடு வருதலும் உட்பட — நேர், நிரை என்ற இரு அசைப் பெயர் பெறும்.
    ethu: 310 அசை வகை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: அசை_வரையறை
    count: 4
  links: []
  urai:
    iyaipu:
    - porul.310
    - porul.313
    - porul.314
    - ezhu.3
    - ezhu.4
    text: 'இயைபு (649): எழு. 3 குறில், எழு. 4 நெடில் — இவை அசையின் அடிப்படை. 313 உகரம், 314 இயலசை/உரியசை. எண்: 5 நிலை (குறில், நெடில், குறிலிணை, குறில்நெடில், ஒற்றொடு) → 2 பெயர் (நேர், நிரை).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.313
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 313
  moolam: |-
    இரு வகை உகரமொடு இயைந்தவை வரினே
    நேர்பும் நிரைபும் ஆகும் என்ப
    குறில் இணை உகரம் அல் வழியான
  kaandigai:
    porul: இருவகை உகரத்தோடு (குற்றியல், முற்றியல்) இயைந்து வந்தால் நேர்பு, நிரைபு ஆகும் — குறிலிணையோடு உகரம் வரும் இடம் அல்லாதவிடத்து.
    ethu: 312 ஐந்து நிலை என்றது; இரு வகை உகரம் (குற்றியலுகரம், முற்றியலுகரம் — 318) இயைந்தவை வரும்போது அவை நேர்பும்/நிரைபும் ஆகும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: உகர_அசை
  links: []
  urai:
    iyaipu:
    - porul.312
    - ezhu.36
    - ezhu.316
    text: 'இயைபு (649): 312 அசை 5 நிலை; 317, 318 முற்றியலுகரம், குற்றியலுகரம் — இரு உகர வகை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: இரு வகை
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: porul.314
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 314
  moolam: |-
    இயலசை முதல் இரண்டு ஏனவை உரியசை
  kaandigai:
    porul: முதல் இரண்டு (நேர், நிரை) இயலசை; மற்றவை (நேர்பு, நிரைபு) உரியசை.
    ethu: 312–313 அசை என்றது; அசையுள் முதல் இரண்டு (நேர், நிரை — 312) இயலசை; ஏனவை (நேர்பு, நிரைபு — 313) உரியசை.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: classification
    class: இயல_உரிய_அசை
    count: 2
  links: []
  urai:
    iyaipu:
    - porul.312
    - porul.315
    - porul.321
    text: 'இயைபு (649): 312 அசை 5; 315 தனிக்குறில்; 321 இயலசை/உரியசை மயக்கம். எண்: 2 (நூற்பா ''முதல் இரண்டு'') = 2 (இயலசை).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: இரண்டு
- id: porul.315
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 315
  moolam: |-
    தனிக் குறில் முதலசை மொழி சிதைந்து ஆகாது
  kaandigai:
    porul: தனிக்குறில் மொழியைச் சிதைத்து முதலசை ஆகாது.
    ethu: 314 இயலசை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: தனிக்குறில்
  links: []
  urai:
    iyaipu:
    - porul.314
    - porul.312
    text: 'இயைபு (649): 314 இயலசை; 312 குறில். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஆணை கூறல்
    saanru: ஆகாது
- id: porul.316
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 316
  moolam: |-
    ஒற்று எழுத்து இயற்றே குற்றியலிகரம்
  kaandigai:
    porul: குற்றியலிகரம் ஒற்றெழுத்தின் இயல்பினது (அசைக்கு எண்ணப்படாது).
    ethu: 314–315 என்றது; குற்றியலிகரம் ஒற்று எழுத்து இயற்றே — அசைக் கணக்கில் ஒற்றெழுத்தின் இயல்பினது.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: குற்றியலிகரம்_அசை
  links: []
  urai:
    iyaipu:
    - porul.313
    - porul.317
    - ezhu.34
    text: 'இயைபு (649): 313 உகரம்; 317 முற்றியலுகரம்; எழு. 34 குற்றியலிகரம். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒப்பக் கூறல்
    saanru: இயற்றே
- id: porul.317
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 317
  moolam: |-
    முற்றியலுகரமும் மொழி சிதைத்துக் கொளாஅ
    நிற்றல் இன்றே ஈற்று அடி மருங்கினும்
  kaandigai:
    porul: முற்றியலுகரமும் மொழியைச் சிதைத்துக் கொள்ளப்படாது; ஈற்றடியிலும் நிற்றல் இல்லை.
    ethu: 316 குற்றியலிகரம் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: முற்றியலுகரம்_விலக்கு
  links: []
  urai:
    iyaipu:
    - porul.316
    - porul.318
    - ezhu.36
    text: 'இயைபு (649): 316 குற்றியலிகரம்; 318 குற்றியலுகரம்; எழு. 36 குற்றியலுகரம். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.318
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 318
  moolam: |-
    குற்றியலுகரமும் முற்றியலுகரமும்
    ஒற்றொடு தோன்றி நிற்கவும் பெறுமே
  kaandigai:
    porul: குற்றியலுகரமும் முற்றியலுகரமும் ஒற்றொடு தோன்றி நிற்கவும் பெறும்.
    ethu: 317 முற்றியலுகரம் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: உகர_ஒற்று
  links: []
  urai:
    iyaipu:
    - porul.316
    - porul.317
    text: 'இயைபு (649): 316 குற்றியலிகரம்; 317 முற்றியலுகரம் — இவற்றின் இணை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.319
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 319
  moolam: |-
    அசையும் சீரும் இசையொடு சேர்த்தி
    வகுத்தனர் உணர்த்தல் வல்லோர் ஆறே
  kaandigai:
    porul: அசையையும் சீரையும் இசையொடு சேர்த்து வகுத்து உணர்த்தல் வல்லோர் வழி.
    ethu: 318 என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: அசை_சீர்_வகை
  links: []
  urai:
    iyaipu:
    - porul.318
    - porul.320
    text: 'இயைபு (649): 318 உகரம்; 320 சீர். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: ஆறே
- id: porul.320
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 320
  moolam: |-
    ஈர் அசை கொண்டும் மூ அசை புணர்த்தும்
    சீர் இயைந்து இற்றது சீர் எனப்படுமே
  kaandigai:
    porul: இரு அசையாலும் மூவசை புணர்த்தும் சீர் அமைவது சீர் எனப்படும்.
    ethu: 319 அசை/சீர் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: சீர்_வரையறை
    count: 3
  links: []
  urai:
    iyaipu:
    - porul.319
    - porul.321
    - porul.340
    text: 'இயைபு (649): 319 அசை-சீர்; 321 இயற்சீர்/உரிச்சீர்; 340 அடி (நாற்சீர்). எண்: 2 (ஈர், மூ) = 2 சீர் வகை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தான் குறியிடுதல்
    saanru: எனப்படுமே
- id: porul.321
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 321
  moolam: |-
    இயலசை மயக்கம் இயற்சீர் ஏனை
    உரியசை மயக்கம் ஆசிரிய உரிச்சீர்
  kaandigai:
    porul: இயலசை மயக்கம் இயற்சீர்; உரியசை மயக்கம் ஆசிரிய உரிச்சீர்.
    ethu: சீர் அசைகளால் ஆவது — "ஈர் அசை கொண்டும் மூ அசை புணர்த்தும்" (பொருள். 320); ஆகவே சீரின் வகை அதில் மயங்கும் அசையின் வகையால் பிரிகிறது. அசை நேர், நிரை (பொருள். 312); அவற்றோடு உகரம் இயைந்தவை நேர்பு, நிரைபு (பொருள். 313).
    eduthukkaattu:
    - text: ஈர் அசை கொண்டும் மூ அசை புணர்த்தும்
      from: porul.320
  nilai: நூலில் நேரடியாக
  kanini:
    kind: classification
    class: சீர்_மயக்கம்
    count: 2
  links: []
  urai:
    iyaipu:
    - porul.320
    - porul.322
    - porul.323
    text: 'இயைபு (649): 320 சீர் பொது; 322 முன்நிரை; 323 நேர். எண்: 2 (இயற்சீர், உரிச்சீர்).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.322
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 322
  moolam: |-
    முன் நிரை உறினும் அன்ன ஆகும்
  kaandigai:
    porul: முன் நிரை வந்தாலும் அவ்வாறே ஆகும்.
    ethu: 321 இயற்சீர் என்றது; முன் நிரை உறினும் (முன்னே நிரை வந்தாலும்) அன்ன ஆகும் — இயற்சீரே.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: முன்நிரை
  links: []
  urai:
    iyaipu:
    - porul.321
    - porul.323
    text: 'இயைபு (649): 321 இயற்சீர்; 323 நேர். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.323
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 323
  moolam: |-
    நேர் அவண் நிற்பின் இயற்சீர்ப் பால
  kaandigai:
    porul: அங்கே நேர் நின்றால் இயற்சீரின் பகுதியாகும்.
    ethu: 322 என்றது; நேர் அவண் நிற்பின் (நேர் அந்த இடத்தில் நின்றால்) இயற்சீர்ப் பால — இயற்சீர் வகை.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: நேர்_இயற்சீர்
  links: []
  urai:
    iyaipu:
    - porul.322
    - porul.324
    text: 'இயைபு (649): 322 முன்நிரை; 324 நிரையசை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.324
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 324
  moolam: |-
    இயலசை ஈற்று முன் உரியசை வரினே
    நிரையசை இயல ஆகும் என்ப
  kaandigai:
    porul: இயலசை ஈற்றின் முன் உரியசை வந்தால் நிரையசையின் இயல்பினவாகும்.
    ethu: 323 இயற்சீர் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: இயல_உரிய_நிரை
  links: []
  urai:
    iyaipu:
    - porul.323
    - porul.325
    text: 'இயைபு (649): 323 நேர்; 325 அளபெடை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: porul.325
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 325
  moolam: |-
    அளபெடை அசைநிலை ஆகலும் உரித்தே
  kaandigai:
    porul: அளபெடை அசைநிலை ஆதலும் உரியது.
    ethu: 324 நிரையசை என்றது; அளபெடை அசைநிலையாகலும் உரித்து — அளபெடை அசையாகக் கொள்ளலாம்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: அளபெடை_அசை
  links: []
  urai:
    iyaipu:
    - porul.324
    - porul.326
    text: 'இயைபு (649): 324 நிரை; 326 ஒற்று அளபெடை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: ஆகலும்
- id: porul.326
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 326
  moolam: |-
    ஒற்று அளபெடுப்பினும் அற்று என மொழிப
  kaandigai:
    porul: ஒற்று அளபெடுத்தாலும் அதுவே என்பர்.
    ethu: 325 அளபெடை என்றது; ஒற்று அளபெடுப்பினும் அற்று என மொழிப — ஒற்று அளபெடுத்தாலும் 325-இன் இயல்பே.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ஒற்று_அளபெடை
  links: []
  urai:
    iyaipu:
    - porul.325
    - porul.327
    text: 'இயைபு (649): 325 அளபெடை; 327 இயற்சீர். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
  - peyar: தான் குறியிடுதல்
    saanru: என மொழிப
- id: porul.327
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 327
  moolam: |-
    இயற்சீர் இறுதி முன் நேர் அவண் நிற்பின்
    உரிச்சீர் வெண்பா ஆகும் என்ப
  kaandigai:
    porul: இயற்சீர் இறுதியின் முன் நேர் நின்றால் வெண்பா உரிச்சீர் ஆகும்.
    ethu: 326 என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: வெண்பா_உரிச்சீர்
  links: []
  urai:
    iyaipu:
    - porul.321
    - porul.326
    - porul.331
    - porul.387
    text: 'இயைபு (649): 321 உரிச்சீர்; 326 அளபெடை; 331 வெண்பா உரிச்சீர்; 387 ''வெண்பா யாப்பே''. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: porul.328
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 328
  moolam: |-
    வஞ்சிச் சீர் என வகை பெற்றனவே
    வெண் சீர் அல்லா மூ அசை என்ப
  kaandigai:
    porul: வெண்சீர் அல்லாத மூவசைச் சீர் வஞ்சிச்சீர் என வகை பெற்றன.
    ethu: 327 வெண்பா உரிச்சீர் என்றது; வஞ்சிச் சீர் என வகைபெற்றனவே — வெண்சீர் அல்லாத மூஅசை (3 அசை) வஞ்சிச் சீர்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: வஞ்சிச்சீர்
    count: 3
  links: []
  urai:
    iyaipu:
    - porul.327
    - porul.330
    - porul.389
    text: 'இயைபு (649): 327 வெண்பா; 330 வஞ்சி மருங்கு; 389 ''தூங்கல் ஓசை வஞ்சி''. எண்: 3 அசை (மூஅசை) — வஞ்சிச் சீர்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: porul.329
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 329
  moolam: |-
    தன் பா அல் வழி தான் அடைவு இன்றே
  kaandigai:
    porul: (அவை) தம் பா அல்லாதவிடத்து அடைதல் இல்லை.
    ethu: 328 வஞ்சிச் சீர் என்றது; தன்பா அல்வழி (தனக்குரிய பாவில் அல்லாத இடத்தில்) தான் அடைவு இன்றே — வேறு பாவில் வஞ்சிச் சீர் வராது.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: தம்பா_வரம்பு
  links: []
  urai:
    iyaipu:
    - porul.328
    - porul.330
    - porul.413
    text: 'இயைபு (649): 328 வஞ்சிச் சீர்; 330 வஞ்சி மருங்கு; 413 ஆசிரிய/வஞ்சி/வெண்பா/கலி நடை. ''தன்பா அல்வழி'' — வஞ்சிச் சீர் வஞ்சிப் பாவிலேயே.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'அடைவு இன்றே' — இசைவு (வரையறை இன்மை)
- id: porul.330
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 330
  moolam: |-
    வஞ்சி மருங்கின் எஞ்சிய உரிய
  kaandigai:
    porul: வஞ்சியிடத்து எஞ்சியவை உரியன.
    ethu: 329 என்றது; வஞ்சி மருங்கின் எஞ்சிய உரிய — வஞ்சிப் பாவில் மீதமான உரிச்சீர் வகைகள் உரிய.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: வஞ்சி_எஞ்சிய
  links: []
  urai:
    iyaipu:
    - porul.328
    - porul.329
    - porul.339
    text: 'இயைபு (649): 328 வஞ்சி 3 அசை; 329 தன்பா; 339 வஞ்சி உரிச்சீர் ஒன்றுதல். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.331
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 331
  moolam: |-
    வெண்பா உரிச்சீர் ஆசிரிய உரிச்சீர்
    இன் பா நேரடிக்கு ஒருங்கு நிலை இலவே
  kaandigai:
    porul: வெண்பா உரிச்சீரும் ஆசிரிய உரிச்சீரும் நேரடிக்கு ஒருங்கே நிற்றல் இல்லை.
    ethu: 330 என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: நேரடி_உரிச்சீர்
  links: []
  urai:
    iyaipu:
    - porul.327
    - porul.330
    - porul.359
    - porul.370
    text: 'இயைபு (649): 327 வெண்பா உரிச்சீர்; 330 வஞ்சி உரிச்சீர்; 359 ஆசிரிய 5 அடி; 370 அறுசீர் அடி. ''ஒருங்கு நிலை இலவே'' — இவை ஒன்றாக நில்லா.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.332
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 332
  moolam: |-
    கலித்தளை மருங்கின் கடியவும் பெறாஅ
  kaandigai:
    porul: கலித்தளையிடத்து நீக்கவும் பெறாது.
    ethu: 331 என்றது; கலித்தளை மருங்கின் கடியவும் பெறாஅ — கலித்தளையில் இவை விலக்கப்படா.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: கலித்தளை
  links: []
  urai:
    iyaipu:
    - porul.331
    - porul.333
    - porul.435
    text: 'இயைபு (649): 331 வெண்பா/ஆசிரிய உரிச்சீர்; 333 கலித்தளை அடி; 435 கலி நால்வகை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'கடியவும் பெறாஅ' — இசைவு (வரையறை இன்மை)
- id: porul.333
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 333
  moolam: |-
    கலித்தளை அடிவயின் நேர் ஈற்று இயற்சீர்
    நிலைக்கு உரித்து அன்றே தெரியுமோர்க்கே
  kaandigai:
    porul: கலித்தளை அடியில் நேர் ஈற்று இயற்சீர் நிற்றற்கு உரியதன்று.
    ethu: 332 கலித்தளை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: கலித்தளை_ஈறு
  links: []
  urai:
    iyaipu:
    - porul.332
    - porul.334
    text: 'இயைபு (649): 332 கலித்தளை; 334 வஞ்சி இறுதி. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: உரித்து
- id: porul.334
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 334
  moolam: |-
    வஞ்சி மருங்கினும் இறுதி நில்லா
  kaandigai:
    porul: வஞ்சியிடத்தும் இறுதியில் நில்லா.
    ethu: 333 என்றது; வஞ்சி மருங்கினும் இறுதி நில்லா — வஞ்சிப் பாவின் இறுதியில் இது நில்லாது.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: வஞ்சி_இறுதி
  links: []
  urai:
    iyaipu:
    - porul.333
    - porul.335
    text: 'இயைபு (649): 333 கலித்தளை; 335 இசைநிலை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.335
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 335
  moolam: |-
    இசைநிலை நிறைய நிற்குவது ஆயின்
    அசைநிலை வரையார் சீர் நிலை பெறவே
  kaandigai:
    porul: இசைநிலை நிறைய நிற்குமானால், சீர்நிலை பெற அசைநிலையை விலக்கார்.
    ethu: 334 என்றது; இசைநிலை நிறைய நிற்குவது ஆயின் அசைநிலை வரையார் — சீர் நிலை பெறவே.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: இசைநிலை_அசைநிலை
  links: []
  urai:
    iyaipu:
    - porul.334
    - porul.336
    - porul.325
    text: 'இயைபு (649): 334 வஞ்சி இறுதி; 336 தளை வகை; 325 அசைநிலை. ''வரையார்'' — அசைநிலைக்கு வரையறை இல்லை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'வரையார்' — இசைவு (வரையறை இன்மை)
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: வரையார்
- id: porul.336
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 336
  moolam: |-
    இயற்சீர்ப் பாற்படுத்து இயற்றினர் கொளலே
    தளை வகை சிதையாத் தன்மையான
  kaandigai:
    porul: தளைவகை சிதையாத தன்மையால் இயற்சீர்ப் பகுதியில் படுத்துக் கொள்க.
    ethu: 335 என்றது; இயற்சீர்ப் பாற்படுத்து இயற்றினர் கொளலே — தளை வகை சிதையாத் தன்மையான்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: தளை_இயற்சீர்
  links: []
  urai:
    iyaipu:
    - porul.335
    - porul.337
    text: 'இயைபு (649): 335 இசைநிலை; 337 வெண்சீர் ஈற்றசை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.337
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 337
  moolam: |-
    வெண்சீர் ஈற்றசை நிரையசை இயற்றே
  kaandigai:
    porul: வெண்சீரின் ஈற்றசை நிரையசை இயல்பினது.
    ethu: 336 என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: வெண்சீர்_ஈற்று
  links: []
  urai:
    iyaipu:
    - porul.336
    - porul.338
    text: 'இயைபு (649): 336 தளை; 338 இன்சீர். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒப்பக் கூறல்
    saanru: இயற்றே
- id: porul.338
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 338
  moolam: |-
    இன் சீர் இயைய வருகுவது ஆயின்
    வெண்சீர் வரையார் ஆசிரிய அடிக்கே
  kaandigai:
    porul: இனிய சீர் இயையும்படி வருமானால் ஆசிரிய அடிக்கு வெண்சீரை விலக்கார்.
    ethu: 337 என்றது; இன்சீர் இயைய வருகுவது ஆயின் வெண்சீர் வரையார் ஆசிரிய அடிக்கே — ஆசிரிய அடியில் வெண்சீருக்கு வரையறை இல்லை.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ஆசிரிய_வெண்சீர்
  links: []
  urai:
    iyaipu:
    - porul.337
    - porul.339
    text: 'இயைபு (649): 337 வெண்சீர் ஈற்றசை; 339 வஞ்சி உரிச்சீர்.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'வரையார்' — இசைவு (வரையறை இன்மை)
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: வரையார்
- id: porul.339
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 339
  moolam: |-
    அந் நிலை மருங்கின் வஞ்சி உரிச்சீர்
    ஒன்றுதல் உடைய ஓர் ஒரு வழியே
  kaandigai:
    porul: அந்நிலையில் வஞ்சி உரிச்சீர் ஓரொரு வழியில் பொருந்துதல் உண்டு.
    ethu: 338 என்றது; அந்நிலை மருங்கின் வஞ்சி உரிச்சீர் ஒன்றுதல் உடைய ஓர் ஒருவழியே — வஞ்சிப் பாவில் ஒரு வழி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: வஞ்சி_ஒருவழி
  links: []
  urai:
    iyaipu:
    - porul.330
    - porul.338
    - porul.352
    - porul.363
    text: 'இயைபு (649): 330 வஞ்சி மருங்கு; 338 ஆசிரிய; 352 வஞ்சி அடி; 363 வஞ்சி 2-4 அடி. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: ஒன்றுதல்
- id: porul.340
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 340
  moolam: |-
    நாற் சீர் கொண்டது அடி எனப்படுமே
  kaandigai:
    porul: நான்கு சீர் கொண்டது அடி எனப்படும்.
    ethu: 339 என்றது; நாற் சீர் கொண்டது அடி எனப்படுமே — 4 சீர் = 1 அடி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: அடி_வரையறை
    count: 4
  links: []
  urai:
    iyaipu:
    - porul.320
    - porul.339
    - porul.341
    - porul.344
    text: 'இயைபு (649): 320 சீர்; 339 வஞ்சி; 341 அடி/தளை/தொடை; 344 குறளடி (4-6 எழுத்து). எண்: 4 சீர் (நூற்பா) = 1 அடி.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தான் குறியிடுதல்
    saanru: எனப்படுமே
- id: porul.341
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 341
  moolam: |-
    அடி உள்ளனவே தளையொடு தொடையே
  kaandigai:
    porul: தளையும் தொடையும் அடிக்குள்ளே உள்ளன.
    ethu: 340 அடி என்றது; அடிக்கு இரு இயல்பு — தளை, தொடை.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: தளை_தொடை
  links: []
  urai:
    iyaipu:
    - porul.340
    - porul.342
    - porul.393
    text: 'இயைபு (649): 340 அடி (4 சீர் = 1 அடி); 342 அடியின் அளவு; 393 தொடை நால் வகை. எண்: 2 (தளை, தொடை). எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.342
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 342
  moolam: |-
    அடி இறந்து வருதல் இல் என மொழிப
  kaandigai:
    porul: அடியைக் கடந்து (தளை, தொடை) வருதல் இல்லை.
    ethu: 341 தளை/தொடை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: அடி_வரம்பு
  links: []
  urai:
    iyaipu:
    - porul.341
    - porul.358
    - porul.350
    text: 'இயைபு (649): 341 அடி; 358 விரிப்பின்; 350 எழுத்து அளவு எஞ்சினும். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
  - peyar: தான் குறியிடுதல்
    saanru: என மொழிப
- id: porul.343
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 343
  moolam: |-
    அடியின் சிறப்பே பாட்டு எனப்படுமே
  kaandigai:
    porul: அடியின் சிறப்பே பாட்டு எனப்படும்.
    ethu: 342 அடி இறந்து வருதல் இல்லை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: பாட்டு_வரையறை
  links: []
  urai:
    iyaipu:
    - porul.342
    - porul.383
    - porul.459
    - porul.460
    text: 'இயைபு (649): 342 அடி; 383 யாப்பு; 459/460 பாட்டு அளவு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தான் குறியிடுதல்
    saanru: எனப்படுமே
- id: porul.344
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 344
  moolam: |-
    நால் எழுத்து ஆதி ஆக ஆறு எழுத்து
    ஏறிய நிலத்தே குறளடி என்ப
  kaandigai:
    porul: நான்கு எழுத்து முதல் ஆறு எழுத்து வரை குறளடி.
    ethu: 343 அடி என்றது; அடியின் அளவுகள் ஐந்து — முதல் குறளடி — 4 எழுத்து முதல் 6 எழுத்து வரை.
