    உயிர்த் திறம் இயக்கம் இன்மையான
  kaandigai:
    porul: உயிரில்லா எழுத்தும் (மெய்) எண்ணப்படாது — உயிரின் இயக்கம் இல்லாததால்.
    ethu: 350 சீர் நிலை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: மெய்_எண்ணா
  links: []
