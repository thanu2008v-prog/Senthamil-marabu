    - porul.444
    - porul.446
    text: 'இயைபு (649): 438 தரவு 4 அடி; 444 வண்ணகம்; 446 ஒத்து 3. எண்: 3 (4/6/8).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
