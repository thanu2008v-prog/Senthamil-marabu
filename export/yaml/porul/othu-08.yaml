- id: porul.440
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 440
  moolam: |-
    அடை நிலைக் கிளவி தாழிசைப் பின்னர்
    நடை நவின்று ஒழுகும் ஆங்கு என் கிளவி
  kaandigai:
    porul: அடைநிலைக் கிளவி தாழிசைக்குப் பின்னர் "ஆங்கு" என்ற சொல்லாக நடைபெறும்.
    ethu: 439 என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: adainilai_ilaippu
    count: null
  links: []
