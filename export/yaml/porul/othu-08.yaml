    - porul.406
    - porul.408
    text: 'இயைபு (649): 406 மொத்த எண்; 408 தொடை நிலை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'வரம்பில' — இசைவு (வரையறை இன்மை)
- id: porul.408
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 408
  moolam: |-
    தொடை வகை நிலையே ஆங்கு என மொழிப
  kaandigai:
    porul: தொடைவகையின் நிலையும் அவ்வாறே என்பர்.
    ethu: 407 என்றது; தொடை வகை நிலையே ஆங்கு — தொடை நிலை முடிவு.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: தொடை_நிலை
  links: []
  urai:
    iyaipu:
    - porul.407
    - porul.409
    text: 'இயைபு (649): 407 வரம்பில; 409 நோக்கு — இது தொடை நிலை முடிவு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
  - peyar: தான் குறியிடுதல்
    saanru: என மொழிப
- id: porul.409
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 409
  moolam: |-
    மாத்திரை முதலா அடிநிலை காறும்
    நோக்குதல் காரணம் நோக்கு எனப்படுமே
  kaandigai:
    porul: மாத்திரை முதல் அடிநிலை வரை (கருதிய பொருளை) நோக்குதற்குக் காரணமாவது நோக்கு.
    ethu: 408 தொடை நிலை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: நோக்கு_வரையறை
  links: []
  urai:
    iyaipu:
    - porul.383
    - porul.408
    - porul.392
    text: 'இயைபு (649): 383 யாப்பு; 408 தொடை; 392 தூக்கு — நோக்கு தொடர்பு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தான் குறியிடுதல்
    saanru: எனப்படுமே
- id: porul.410
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 410
  moolam: |-
    ஆசிரியம் வஞ்சி வெண்பா கலி என
    நால் இயற்று என்ப பா வகை விரியே
  kaandigai:
    porul: 'பாவகை விரி நான்கு: ஆசிரியம், வஞ்சி, வெண்பா, கலி.'
    ethu: 409 நோக்கு என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: பா_வகை
    count: 4
    items:
    - ஆசிரியம்
    - வஞ்சி
    - வெண்பா
    - கலி
  links: []
  urai:
    iyaipu:
    - porul.386
    - porul.387
    - porul.388
    - porul.389
    - porul.409
    text: 'இயைபு (649): 386-389 4 பா; 409 நோக்கு. எண்: 4 (நூற்பா ''நால் இயற்று'') = 4.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: porul.411
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 411
  moolam: |-
    அந் நிலை மருங்கின் அறம் முதல் ஆகிய
    மும் முதல் பொருட்கும் உரிய என்ப
  kaandigai:
    porul: அவை அறம் முதலிய மும்முதற் பொருளுக்கும் (அறம், பொருள், இன்பம்) உரியன. "அறம் முதல் ஆகிய மும் முதல்" என்பதில் மற்ற இரண்டின் பெயர்களை நூற்பா கூறவில்லை (ஒருதலை அன்மை).
    ethu: 410 4 பா என்றது; அந்நிலை மருங்கின் மும் முதல் (அறம், பொருள், இன்பம்) பொருட்கும் உரிய.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    class: மும்முதல்_உரிமை
    count: 3
    items_not_named: true
  links: []
  urai:
    iyaipu:
    - porul.410
    - porul.89
    text: 'இயைபு (649): 410 4 பா; 89 ''இன்பமும் பொருளும் அறனும்''. எண்: மூன்று (நூற்பா ''மும் முதல் பொருட்கும்'') = மூன்று (அறம், பொருள், இன்பம்).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக; காண்டிகை சுட்டிய ஐயம் ஒருதலை அன்மை
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: porul.412
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 412
  moolam: |-
    பா விரி மருங்கினைப் பண்புறத் தொகுப்பின்
    ஆசிரியப்பா வெண்பா என்று ஆங்கு
    ஆயிரு பாவினுள் அடங்கும் என்ப
  kaandigai:
    porul: பாவிரியைத் தொகுத்தால் ஆசிரியப்பா, வெண்பா என்ற இரண்டினுள் அடங்கும்.
    ethu: 411 மும் முதல் பொருள் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: பா_தொகை
    count: 2
  links: []
  urai:
    iyaipu:
    - porul.410
    - porul.386
    - porul.387
    text: 'இயைபு (649): 410 4 பா; 386 அகவல்; 387 வெண்பா. எண்: 2 (ஆசிரியம், வெண்பா).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: porul.413
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 413
  moolam: |-
    ஆசிரிய நடைத்தே வஞ்சி ஏனை
    வெண்பா நடைத்தே கலி என மொழிப
  kaandigai:
    porul: வஞ்சி ஆசிரிய நடையது; கலி வெண்பா நடையது.
    ethu: 412 பா இரண்டினுள் அடங்கும் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: நடை_இணை
    count: 2
  links: []
  urai:
    iyaipu:
    - porul.386
    - porul.388
    - porul.389
    - porul.412
    text: 'இயைபு (649): 386 அகவல்; 388 கலி; 389 வஞ்சி; 412 2 பா. எண்: நூற்பா எண் கூறவில்லை; இரு கூற்று — வஞ்சி ஆசிரிய நடைத்து, கலி வெண்பா நடைத்து — 412-இன் ''ஆயிரு பா'' அடக்கத்தோடு ஒத்தது.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
  - peyar: தான் குறியிடுதல்
    saanru: என மொழிப
- id: porul.414
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 414
  moolam: |-
    வாழ்த்தியல் வகையே நாற்பாக்கும் உரித்தே
  kaandigai:
    porul: வாழ்த்தியல் வகை நான்கு பாவுக்கும் உரியது.
    ethu: 413 நடை என்றது; வாழ்த்தியல் வகை நாற்பாக்கும் (4 பாக்கு) உரிய.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: வாழ்த்தியல்
    count: 4
  links: []
  urai:
    iyaipu:
    - porul.387
    - porul.413
    - porul.416
    text: 'இயைபு (649): 413 நடை; 387 வெண்பா; 416 வாயுறை. எண்: 4 (நூற்பா ''நாற்பாக்கும்'').'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: உரித்தே
- id: porul.415
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 415
  moolam: |-
    வழிபடு தெய்வம் நின் புறங்காப்ப
    பழி தீர் செல்வமொடு வழி வழி சிறந்து
    பொலிமின் என்னும் புறநிலை வாழ்த்தே
    கலி நிலை வகையும் வஞ்சியும் பெறாஅ
  kaandigai:
    porul: '"வழிபடு தெய்வம் நின் புறங்காப்ப / பழி தீர் செல்வமொடு வழி வழி சிறந்து / பொலிமின்" (பொருள்: வழிபடு தெய்வம் உன்னைக் காக்க; குற்றமற்ற செல்வத்தோடு வழிவழியாகச் சிறந்து பொலிக) என்பது புறநிலை வாழ்த்து; அது கலியிலும் வஞ்சியிலும் வாராது.'
    ethu: 414 வாழ்த்தியல் என்றது; புறநிலை வாழ்த்து — வழிபடு தெய்வம், செல்வம், 'பொலிமின்' என்னும் வாழ்த்து — கலி நிலை, வஞ்சி பெறாஅ.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: புறநிலை_வாழ்த்து
  links: []
  urai:
    iyaipu:
    - porul.414
    - porul.416
    - porul.388
    - porul.389
    text: 'இயைபு (649): 414 வாழ்த்தியல்; 416 3 வாயுறை; 388 கலி; 389 வஞ்சி. ''கலி நிலை வகையும் வஞ்சியும் பெறாஅ'' — 414 ''நாற்பாக்கும் உரித்தே'' என்றதற்குப் புறநிலை வாழ்த்தில் விலக்கு.'
    vagai: விதி-விலக்கு
    thunivu: நூலில் நேரடியாக
    vilakkukkuriyathu:
    - porul.414
- id: porul.416
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 416
  moolam: |-
    வாயுறை வாழ்த்தே அவையடக்கியலே
    செவியறிவுறூஉ என அவையும் அன்ன
  kaandigai:
    porul: வாயுறை வாழ்த்து, அவையடக்கியல், செவியறிவுறூஉ ஆகியவையும் அவ்வாறே (கலி, வஞ்சி பெறா).
    ethu: 415 புறநிலை என்றது; வாயுறை வாழ்த்து, அவையடக்கியல், செவியறிவுறூஉ — 3 வகை.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: வாழ்த்து_வகை
    count: 3
    items:
    - வாயுறை
    - அவையடக்கியல்
    - செவியறிவுறூஉ
  links: []
  urai:
    iyaipu:
    - porul.414
    - porul.415
    - porul.417
    - porul.418
    - porul.419
    text: 'இயைபு (649): 415 புறநிலை; 417-419 ஒவ்வொன்றின் விரிவு. எண்: நூற்பா எண் கூறவில்லை; பட்டியல் மூன்று.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.417
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 417
  moolam: |-
    வாயுறை வாழ்த்தே வயங்க நாடின்
    வேம்பும் கடுவும் போல வெஞ் சொல்
    தாங்குதல் இன்றி வழி நனி பயக்கும் என்று
    ஓம்படைக் கிளவியின் வாயுறுத்தற்றே
  kaandigai:
    porul: 'வாயுறை வாழ்த்து: வேம்பும் கடுவும் போலக் கசக்கும் சொல்லாயினும் பின்னர் மிகப் பயன் தரும் என்று ஓம்படைக் கிளவியால் உறுதி கூறுவது.'
    ethu: 416 வாயுறை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: வாயுறை_வரையறை
  links: []
  urai:
    iyaipu:
    - porul.416
    - porul.287
    - porul.418
    text: 'இயைபு (649): 416 வாயுறை; 287 ''போல'' உவம உருபு; 418 அவையடக்கியல். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒப்பக் கூறல்
    saanru: போல
- id: porul.418
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 418
  moolam: |-
    அவையடக்கியலே அரில் தபத் தெரியின்
    வல்லா கூறினும் வகுத்தனர் கொண்மின் என்று
    எல்லா மாந்தர்க்கும் வழி மொழிந்தன்றே
  kaandigai:
    porul: 'அவையடக்கியல்: "வல்லா கூறினும் வகுத்தனர் கொண்மின்" (பொருள்: வல்லாதவற்றைக் கூறினும் வகுத்துக் கொள்க) என்று எல்லா மாந்தர்க்கும் பணிந்து சொல்வது.'
    ethu: 417 வாயுறை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: அவையடக்கியல்_வரையறை
  links: []
  urai:
    iyaipu:
    - porul.416
    - porul.417
    - porul.419
    text: 'இயைபு (649): 417 வாயுறை; 419 செவியுறை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: கூறிற்று என்றல்
    saanru: மொழிந்தன்றே
- id: porul.419
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 419
  moolam: |-
    செவியுறைதானே
    பொங்குதல் இன்றி புரையோர் நாப்பண்
    அவிதல் கடன் எனச் செவியுறுத்தன்றே
  kaandigai:
    porul: 'செவியுறை: பெரியோர் நடுவில் செருக்கின்றி அடங்குதல் கடமை எனச் செவியில் உறுத்துவது.'
    ethu: 418 அவையடக்கியல் என்றது; செவியுறை — பொங்குதல் இன்றி புரையோர் நாப்பண் அவிதல் கடன் என்று செவியுறுத்தன்று.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: செவியுறை_வரையறை
  links: []
  urai:
    iyaipu:
    - porul.416
    - porul.418
    - porul.420
    text: 'இயைபு (649): 418 அவையடக்கம்; 420 ஒத்தாழிசை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.420
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 420
  moolam: |-
    ஒத்தாழிசையும் மண்டில யாப்பும்
    குட்டமும் நேரடிக்கு ஒட்டின என்ப
  kaandigai:
    porul: ஒத்தாழிசை, மண்டில யாப்பு, குட்டம் ஆகியவை நேரடிக்குப் பொருந்தின.
    ethu: 419 செவியுறை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: நேரடி_இணைப்பு
    count: 3
  links: []
  urai:
    iyaipu:
    - porul.419
    - porul.421
    - porul.422
    - porul.444
    text: 'இயைபு (649): 419 செவியுறை; 421 குட்டம்; 422 மண்டிலம்; 444 வண்ணகம். எண்: 3 (ஒத்தாழிசை, மண்டிலம், குட்டம்).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: porul.421
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 421
  moolam: |-
    குட்டம் எருத்தடி உடைத்தும் ஆகும்
  kaandigai:
    porul: குட்டம் எருத்தடி உடையதாகவும் வரும்.
    ethu: 420 ஒத்தாழிசை/மண்டிலம்/குட்டம் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: yappu_ilakkanam
    count: null
  links: []
  urai:
    iyaipu:
    - porul.420
    - porul.422
    - porul.423
    text: 'இயைபு (649): 420 மூன்று; 422 மண்டிலம்/குட்டம்; 423 நெடுவெண்பா.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.422
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 422
  moolam: |-
    மண்டிலம் குட்டம் என்று இவை இரண்டும்
    செந்தூக்கு இயல என்மனார் புலவர்
  kaandigai:
    porul: மண்டிலம், குட்டம் இரண்டும் செந்தூக்கின் இயல்பின.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 421 குட்டம் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: classification
    class: paa_vagai
    count: 2
  links: []
  urai:
    iyaipu:
    - porul.420
    - porul.421
    - porul.377
    text: 'இயைபு (649): 420 மூன்று; 421 குட்டம் எருத்து; 377 வஞ்சித் தூக்கு. எண்: 2 (மண்டிலம், குட்டம்).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: இரண்டும்
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்மனார்
- id: porul.423
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 423
  moolam: |-
    நெடுவெண்பாட்டே குறுவெண்பாட்டே
    கைக்கிளை பரிபாட்டு அங்கதச் செய்யுளொடு
    ஒத்தவை எல்லாம் வெண்பா யாப்பின
  kaandigai:
    porul: நெடுவெண்பாட்டு, குறுவெண்பாட்டு, கைக்கிளை, பரிபாட்டு, அங்கதச் செய்யுள் — இவற்றோடு ஒத்தவை எல்லாம் வெண்பா யாப்பின.
    en:
      kooruvathu: null
      enniyathu: 5
    ethu: 422 என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: classification
    class: paa_vagai
    count: 5
  links: []
  urai:
    iyaipu:
    - porul.422
    - porul.424
    - porul.460
    - porul.461
    text: 'இயைபு (649): 422 மண்டிலம்; 424 கைக்கிளை; 460 நெடுவெண்பா/குறுவெண்பா; 461 அங்கதம். எண்: 5 வகை (நெடு, குறு, கைக்கிளை, பரிபாட்டு, அங்கதம்).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.424
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 424
  moolam: |-
    கைக்கிளைதானே வெண்பா ஆகி
    ஆசிரிய இயலான் முடியவும் பெறுமே
  kaandigai:
    porul: கைக்கிளை வெண்பாவாகி ஆசிரிய இயலால் முடியவும் பெறும்.
    ethu: 423 நெடுவெண்பா என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: yappu_ilakkanam
    count: null
  links: []
  urai:
    iyaipu:
    - porul.423
    - porul.386
    - porul.387
    text: 'இயைபு (649): 423 வெண்பா; 386 அகவல்; 387 வெண்பா.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'பெறுமே' — இசைவு (வரையறை இன்மை)
- id: porul.425
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 425
  moolam: |-
    பரிபாடல்லே தொகை நிலை வகையின்
    இது பா என்னும் இயல் நெறி இன்றி
    பொதுவாய் நிற்றற்கும் உரித்து என மொழிப
  kaandigai:
    porul: பரிபாடல் தொகைநிலை வகையில் "இது பா என்னும் இயல் நெறி" இன்றிப் பொதுவாக நிற்றற்கும் உரியது.
    ethu: 424 கைக்கிளை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: yappu_ilakkanam
    count: null
  links: []
  urai:
    iyaipu:
    - porul.423
    - porul.464
    text: 'இயைபு (649): 423 வெண்பா வகை; 464 அடி அளவு.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'உரித்து' — இசைவு (வரையறை இன்மை)
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
  - peyar: தான் குறியிடுதல்
    saanru: என மொழிப
  - peyar: ஒருதலை அன்மை
    saanru: உரித்து
- id: porul.426
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 426
  moolam: |-
    கொச்சகம் அராகம் சுரிதகம் எருத்தொடு
    செப்பிய நான்கும் தனக்கு உறுப்பு ஆக
    காமம் கண்ணிய நிலைமைத்து ஆகும்
  kaandigai:
    porul: (பரிபாடல்) கொச்சகம், அராகம், சுரிதகம், எருத்து என்ற நான்கும் உறுப்பாக, காமம் கருதிய நிலையினது. "நான்கு" நூற்பாவிலேயே உள்ளது.
    en:
      kooruvathu: 4
      enniyathu: 4
    ethu: 425 பரிபாடல் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: classification
    class: paripatal_uruppu
    count: 4
  links: []
  urai:
    iyaipu:
    - porul.425
    - porul.427
    - porul.455
    text: 'இயைபு (649): 425 பரிபாடல்; 427 சொற்சீர் அடி; 455 எருத்து. எண்: 4 (கொச்சகம், அராகம், சுரிதகம், எருத்து).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: நான்கும்
- id: porul.427
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 427
  moolam: |-
    சொற்சீர் அடியும் முடுகியல் அடியும்
    அப் பா நிலைமைக்கு உரிய ஆகும்
  kaandigai:
    porul: சொற்சீரடியும் முடுகியலடியும் அப்பாவுக்கு உரியன.
    ethu: 426 நான்கு உறுப்பு என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: அடிவகை
    count: null
  links: []
  urai:
    iyaipu:
    - porul.426
    - porul.428
    - porul.371
    text: 'இயைபு (649): 426 பரிபாடல்; 428 கட்டுரை; 371 முடுகியல். எண்: 2 (சொற்சீர் அடி, முடுகியல் அடி).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.428
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 428
  moolam: |-
    கட்டுரை வகையான் எண்ணொடு புணர்ந்தும்
    முட்டடி இன்றிக் குறைவு சீர்த்து ஆகியும்
    மொழி அசை ஆகியும் வழி அசை புணர்ந்தும்
    சொற்சீர்த்து இறுதல் சொற்சீர்க்கு இயல்பே
  kaandigai:
    porul: கட்டுரை வகையால் எண்ணொடு புணர்ந்தும், முட்டடியின்றிக் குறைசீராகியும், மொழி அசையாகியும் வழி அசை புணர்ந்தும் சொற்சீராக முடிதல் சொற்சீரின் இயல்பு.
    en:
      kooruvathu: null
      enniyathu: 4
    ethu: 427 சொற்சீர் அடி என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: சொற்சீர்
    count: 4
  links: []
  urai:
    iyaipu:
    - porul.427
    - porul.429
    text: 'இயைபு (649): 427 அடி; 429 அங்கதம்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.429
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 429
  moolam: |-
    அங்கதம்தானே அரில் தபத் தெரியின்
    செம்பொருள் கரந்தது என இரு வகைத்தே
  kaandigai:
    porul: 'அங்கதம் இருவகை: செம்பொருள், கரந்தது.'
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 428 கட்டுரை என்றது; அங்கதம் இரு வகை — செம்பொருள், கரந்தது (430 வசை, 431 பழிகரப்பு).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: classification
    class: அங்கதம்
    count: 2
  links: []
  urai:
    iyaipu:
    - porul.423
    - porul.428
    - porul.430
    - porul.431
    text: 'இயைபு (649): 423 வெண்பா வகை; 428 கட்டுரை; 430 செம்பொருள்; 431 மொழிகரப்பு. எண்: 2.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: இரு வகைத்தே
- id: porul.430
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 430
  moolam: |-
    செம்பொருள் ஆயின வசை எனப்படுமே
  kaandigai:
    porul: செம்பொருள் அங்கதம் வசை எனப்படும்.
    ethu: 429 இரண்டு வகை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: அங்கதம்-வகை
    count: null
  links: []
  urai:
    iyaipu:
