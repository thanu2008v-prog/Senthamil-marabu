    ஈர் எழுத்து மிகுதலும் இயல்பு என மொழிப
  kaandigai:
    porul: நெடிலடிக்கு அளவு பதினைந்து (மூ ஐந்து) எழுத்து; இரண்டு மிகுதலும் இயல்பு.
    ethu: 346 நேரடி என்றது; நெடிலடி — 15 எழுத்து, ஈர் எழுத்து மிகுதலும் இயல்பு.
