    - porul.377
    text: 'இயைபு (649): 348 கழிநெடில்; 352 வஞ்சி 2 சீர்; 363 வஞ்சி உறழ்நிலை; 377 வஞ்சித் தூக்கு. எண்: 5 எழுத்து குறையா, 6 நேர்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
