- id: porul.390
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 390
  moolam: |-
    மருட்பா ஏனை இரு சார் அல்லது
    தான் இது என்னும் தனிநிலை இன்றே
  kaandigai:
    porul: மருட்பா மற்ற இருசார் (வெண்பா, ஆசிரியம்) கலந்ததே; தனிநிலை இல்லை. "இரு சார்" எவை என நூற்பா பெயரிடவில்லை (ஒருதலை அன்மை; காண்க 386–389).
    ethu: 389 வஞ்சி என்றது; மருட்பா — ஏனை இரு சார் அல்லது ('இரு சார்' — 412-இன் ஆசிரியம், வெண்பா எனக் கொள்ளலாம்; ஒருதலை அன்மை) தான் 'இது' என்னும் தனிநிலை இன்றே.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    class: மருட்பா_கலவை
    count: 2
