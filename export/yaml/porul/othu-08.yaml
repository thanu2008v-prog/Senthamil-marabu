- id: porul.445
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 445
  moolam: |-
    தரவேதானும்
    நான்கும் ஆறும் எட்டும் என்ற
    நேரடி பற்றிய நிலைமைத்து ஆகும்
  kaandigai:
    porul: (வண்ணகத்) தரவு நான்கு, ஆறு, எட்டு நேரடிகளைக் கொண்டது.
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: 444 வண்ணகம் என்றது; தரவு — 4/6/8 நேரடி பற்றிய நிலைமை.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: classification
    class: vannakath_tharavu_neradi
    count: 3
  links: []
