    text: 'இயைபு (649): 436 ஒத்தாழிசை; 445 தரவு; 447 வாரம். எண்: 3.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: மூன்று
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: porul.447
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 447
  moolam: |-
    அடக்கு இயல் வாரம் தரவொடு ஒக்கும்
  kaandigai:
    porul: அடக்கியல் வாரம் தரவோடு ஒக்கும்.
    ethu: 446 ஒத்து 3 என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
