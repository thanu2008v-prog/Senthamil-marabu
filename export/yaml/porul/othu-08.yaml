    மொழிந்தவற்று இயலான் முற்றும் என்ப
  kaandigai:
    porul: நிரல்நிறுத்து அமைத்தலும் இரட்டை யாப்பும் கூறியவற்றின் இயலால் முடியும்.
    ethu: 395 என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
