    அமைத்தனர் தெரியின் அவையுமார் உளவே
  kaandigai:
    porul: பொழிப்பு, ஒரூஉ, செந்தொடை மரபும் உள.
    ethu: 394 ஐந்து என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: தொடை_கூடுதல்
    count: 3
  links: []
  urai:
    iyaipu:
    - porul.394
    - porul.396
    - porul.403
    - porul.404
    - porul.405
    text: 'இயைபு (649): 394 ஐந்து; 396 நிரல்/இரட்டை; 403-405 மூன்றும் விரிவு. எண்: 3 (பொழிப்பு, ஒரூஉ, செந்தொடை). ''உளவே'' — மேலும் உள — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'உளவே' — இசைவு (வரையறை இன்மை)
- id: porul.396
