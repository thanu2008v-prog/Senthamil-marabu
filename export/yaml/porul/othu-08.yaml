- id: porul.446
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 446
  moolam: |-
    ஒத்து மூன்று ஆகும் ஒத்தாழிசையே
    தரவின் சுருங்கித் தோன்றும் என்ப
  kaandigai:
    porul: ஒத்தாழிசை ஒத்த மூன்றாக வரும்; தரவைவிடச் சுருங்கும்.
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: 445 தரவு என்றது; ஒத்து 3 ஆகும் ஒத்தாழிசை — தரவின் சுருங்கித் தோன்றும்.
  nilai: நூலில் நேரடியாக
  kanini:
