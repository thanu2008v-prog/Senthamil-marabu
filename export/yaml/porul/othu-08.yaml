- id: porul.349
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 349
  moolam: |-
    சீர் நிலைதானே ஐந்து எழுத்து இறவாது
    நேர் நிலை வஞ்சிக்கு ஆறும் ஆகும்
  kaandigai:
    porul: சீர் ஐந்து எழுத்தைக் கடவாது; நேர்நிலை வஞ்சிக்கு ஆறும் ஆகும்.
    ethu: 348 கழிநெடில் என்றது; வஞ்சி — சீர் நிலை 5 எழுத்து குறையாது, நேர் 6 ஆகும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: சீர்_எழுத்து
