    - porul.412
    text: 'இயைபு (649): 386-389 4 பா; 391 ''அவ்வியல் அல்லது''; 412 ஆயிரு பா.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'இரு சார்' எவை என்பது ஒருதலை அன்மை
- id: porul.391
  pindam: 1
  padalam: porul
