    குன்றலும் மிகுதலும் இல் என மொழிப
  kaandigai:
    porul: எழுத்தளவு குறைந்தாலும் சீர்நிலை குன்றலும் மிகுதலும் இல்லை.
    ethu: 349 வஞ்சி என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
