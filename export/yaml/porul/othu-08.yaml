- id: porul.444
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 444
  moolam: |-
    வண்ணகம்தானே
    தரவே தாழிசை எண்ணே வாரம் என்று
    அந் நால் வகையின் தோன்றும் என்ப
  kaandigai:
    porul: வண்ணகம் தரவு, தாழிசை, எண், வாரம் என்ற நான்கால் தோன்றும்.
    en:
      kooruvathu: 4
      enniyathu: 4
    ethu: 443 வண்ணகம் என்றது; அதன் 4 வகை — தரவு, தாழிசை, எண், வாரம்.
  nilai: நூலில் நேரடியாக
  kanini:
