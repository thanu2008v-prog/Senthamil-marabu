- id: porul.357
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 357
  moolam: |-
    ஐ வகை அடியும் விரிக்கும் காலை
    மெய் வகை அமைந்த பதினேழ் நிலத்தும்
    எழுபது வகையின் வழு இல ஆகி
    அறுநூற்று இருபத்தைந்து ஆகும்மே
  kaandigai:
    porul: ஐவகை அடியையும் விரிக்கும்போது, பதினேழு நிலத்திலும் எழுபது வகையின் வழுவின்றி அறுநூற்று இருபத்தைந்து (625) ஆகும். எண்கள் (17, 70, 625) நூற்பாவிலேயே உள்ளன; அவற்றுக்கிடையேயான கணக்கு நூலில் விரிக்கப்படவில்லை (ஒருதலை அன்மை).
    ethu: 356 சீர் கூன் என்றது; ஐந்து அடி வகையும் விரிக்கும்காலை பதினேழ் நிலத்தும் எழுபது வகையின் வழுவில ஆகி அறுநூற்று இருபத்தைந்து ஆகும்.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: enumeration
    class: அடி_விரிவு
    count: 625
  links: []
  urai:
    iyaipu:
    - porul.344
    - porul.359
    - porul.358
    text: 'இயைபு (649): 344-348 ஐந்து அடி; 359 ஐந்தும் ஆசிரியம். எண்: பதினேழ் நிலம், எழுபது வகை, அறுநூற்று இருபத்தைந்து — மூன்றும் நூற்பாவிலேயே. இவை எவ்வாறு கணக்கிட்டு 625 ஆகின்றன என்பதை நூல் விரிக்கவில்லை — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 625 வரும் கணக்கு முறை ஒருதலை அன்மை
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: ஐ வகை
- id: porul.358
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 358
  moolam: |-
    ஆங்கனம் விரிப்பின் அளவு இறந்தனவே
    பாங்குற உணர்ந்தோர் பன்னும் காலை
  kaandigai:
    porul: அவ்வாறு விரித்தால் அளவு கடந்தன என்பர் உணர்ந்தோர்.
    ethu: 357 அறுநூற்று இருபத்தைந்து என்றது; ஆங்கனம் விரிப்பின் அளவு இறந்தனவே — விரித்தால் முடிவில.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: அடி_விரிவு_முடிவு
  links: []
  urai:
    iyaipu:
    - porul.357
    - porul.342
    text: 'இயைபு (649): 357 625; 342 அடி இறந்து.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'இறந்தனவே' — இசைவு (வரையறை இன்மை)
- id: porul.359
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 359
  moolam: |-
    ஐ வகை அடியும் ஆசிரியக்கு உரிய
  kaandigai:
    porul: ஐவகை அடியும் ஆசிரியப்பாவுக்கு உரியன.
    ethu: 358 என்றது; ஐந்து அடியும் ஆசிரியத்திற்கு உரிய — ஆசிரியம் 5 அடி வகை.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ஆசிரிய_அடி
    count: 5
  links: []
  urai:
    iyaipu:
    - porul.344
    - porul.357
    - porul.360
    text: 'இயைபு (649): 344-348 ஐந்து அடி; 357 625; 360 விராஅய். எண்: 5.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: ஐ வகை
- id: porul.360
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 360
  moolam: |-
    விராஅய் வரினும் ஒரூஉ நிலை இலவே
  kaandigai:
    porul: கலந்து வந்தாலும் நீங்குதல் இல்லை.
    ethu: 359 ஐந்து ஆசிரியம் என்றது; விராஅய் வரினும் ஒரூஉநிலை இலவே — விரவி வந்தாலும் நீக்கப்படா.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: கலவை_நீங்கா
  links: []
  urai:
    iyaipu:
    - porul.359
    - porul.361
    text: 'இயைபு (649): 359 ஐந்து ஆசிரியம்; 361 தன் சீர்/தளை/இன்சீர்.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'இலவே' — இசைவு (வரையறை இன்மை)
- id: porul.361
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 361
  moolam: |-
    தன் சீர் வகையினும் தளை நிலை வகையினும்
    இன் சீர் வகையின் ஐந்து அடிக்கும் உரிய
    தன் சீர் உள்வழித் தளை வகை வேண்டா
  kaandigai:
    porul: தம் சீர் வகையாலும் தளைவகையாலும் இனிய சீர் வகையால் ஐந்து அடிக்கும் உரியன; தம் சீர் உள்ள இடத்துத் தளைவகை வேண்டா.
    ethu: 360 என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ஐந்து_அடி_உரிமை
    count: 5
  links: []
  urai:
    iyaipu:
    - porul.360
    - porul.362
    - porul.368
    text: 'இயைபு (649): 360 விராஅய்; 362 ஆசிரியத் தளை; 368 இயற்சீர் வெள்ளடி. எண்: 3 (தன் சீர், தளை நிலை, இன்சீர்).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: ஐந்து
- id: porul.362
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 362
  moolam: |-
    சீர் இயை மருங்கின் ஓர் அசை ஒப்பின்
    ஆசிரியத் தளை என்று அறியல் வேண்டும்
  kaandigai:
    porul: சீர் இயையுமிடத்து ஓரசை ஒத்தால் ஆசிரியத் தளை என்று அறிய வேண்டும்.
    ethu: 361 என்றது; சீர் இயை மருங்கின் ஓர் அசை ஒப்பின் ஆசிரியத் தளை — ஆசிரியத் தளையின் அடையாளம்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: ஆசிரியத்_தளை
  links: []
  urai:
    iyaipu:
    - porul.361
    - porul.363
    text: 'இயைபு (649): 361 தளை நிலை; 363 வஞ்சி உறழ்நிலை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஆணை கூறல்
    saanru: வேண்டும்
- id: porul.363
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 363
  moolam: |-
    குறளடி முதலா அளவடி காறும்
    உறழ் நிலை இலவே வஞ்சிக்கு என்ப
  kaandigai:
    porul: குறளடி முதல் அளவடி வரை வஞ்சிக்கு உறழ்நிலை இல்லை.
    ethu: 362 ஆசிரியத் தளை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: வஞ்சி_உறழ்நிலை
  links: []
  urai:
    iyaipu:
    - porul.349
    - porul.362
    - porul.364
    text: 'இயைபு (649): 349 வஞ்சி; 362 ஆசிரியத் தளை; 364 வெள்ளை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'இலவே' — இசைவு (வரையறை இன்மை)
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
  - peyar: ஒருதலை அன்மை
    saanru: உறழ்
- id: porul.364
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 364
  moolam: |-
    அளவும் சிந்தும் வெள்ளைக்கு உரிய
    தளை வகை ஒன்றாத் தன்மையான
  kaandigai:
    porul: அளவடியும் சிந்தடியும் வெண்பாவுக்கு உரியன — தளைவகை ஒன்றாத தன்மையால்.
    ethu: 363 என்றது; அளவும் சிந்தும் வெள்ளைக்கு உரிய — அளவடி, சிந்தடி வெள்ளையின்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: வெண்பா_அளவு_சிந்த
    count: 2
  links: []
  urai:
    iyaipu:
    - porul.363
    - porul.365
    - porul.373
    text: 'இயைபு (649): 363 வஞ்சி; 365 கலி; 373 ஆசிரிய/வெண்பா மூவகை அடி. எண்: 2 (அளவு, சிந்து).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.365
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 365
  moolam: |-
    அளவடி மிகுதி உளப்படத் தோன்றி
    இரு நெடிலடியும் கலியிற்கு உரிய
  kaandigai:
    porul: அளவடி மிகுதி உட்படத் தோன்றி இரு நெடிலடியும் கலிக்கு உரியன.
    ethu: 364 வெள்ளை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: கலி_நெடிலடி
    count: 2
  links: []
  urai:
    iyaipu:
    - porul.364
    - porul.381
    - porul.388
    text: 'இயைபு (649): 364 வெள்ளை; 381 கலி 7 சீர்; 388 ''துள்ளல் ஓசை கலி''. எண்: 2 (அளவடி + இரு நெடிலடி).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.366
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 366
  moolam: |-
    நிரை முதல் வெண்சீர் வந்து நிரை தட்பினும்
    வரை நிலை இன்றே அவ் அடிக்கு என்ப
  kaandigai:
    porul: நிரைமுதல் வெண்சீர் வந்து நிரை தட்டினாலும் அவ்வடிக்கு வரைநிலை இல்லை.
    ethu: 365 கலி என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: நிரை_வரைநிலை
  links: []
  urai:
    iyaipu:
    - porul.365
    - porul.367
    text: 'இயைபு (649): 365 கலி; 367 விராஅய தளை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'வரைநிலை இன்றே' — இசைவு (வரையறை இன்மை)
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
  - peyar: ஒருதலை அன்மை
    saanru: வரை நிலை இன்றே
- id: porul.367
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 367
  moolam: |-
    விராஅய தளையும் ஒரூஉ நிலை இன்றே
  kaandigai:
    porul: கலந்த தளையும் நீங்குநிலை இல்லை.
    ethu: 366 வரைநிலை இன்றே என்றது; விராஅய தளையும் ஒரூஉ நிலை இன்றே — இசைவு (வரையறை இன்மை).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: கலந்த_தளை
  links: []
  urai:
    iyaipu:
    - porul.366
    - porul.368
    text: 'இயைபு (649): 366 வரைநிலை; 368 இயற்சீர் வெள்ளடி.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'இன்றே' — இசைவு (வரையறை இன்மை)
- id: porul.368
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 368
  moolam: |-
    இயற்சீர் வெள்ளடி ஆசிரிய மருங்கின்
    நிலைக்கு உரி மரபின் நிற்கவும் பெறுமே
  kaandigai:
    porul: இயற்சீர் வெள்ளடி ஆசிரியத்திலும் நிலைக்குரிய மரபில் நிற்கப் பெறும்.
    ethu: 367 என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: வெள்ளடி_ஆசிரியம்
  links: []
  urai:
    iyaipu:
    - porul.361
    - porul.367
    - porul.369
    text: 'இயைபு (649): 361 இயற்சீர்; 367 விராஅய; 369 ஐஞ்சீர். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.369
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 369
  moolam: |-
    வெண்தளை விரவியும் ஆசிரியம் விரவியும்
    ஐஞ் சீர் அடியும் உள என மொழிப
  kaandigai:
    porul: வெண்டளை கலந்தும் ஆசிரியம் கலந்தும் ஐஞ்சீரடியும் உள.
    ethu: 368 என்றது; வெண்தளை விரவியும் ஆசிரியம் விரவியும் ஐஞ்சீர் அடியும் உள — 5 சீர் அடி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ஐஞ்சீரடி
    count: 5
  links: []
  urai:
    iyaipu:
    - porul.368
    - porul.370
    - porul.373
    text: 'இயைபு (649): 368 இயற்சீர்; 370 அறுசீர்; 373 மூவகை. எண்: 5 சீர்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
  - peyar: தான் குறியிடுதல்
    saanru: என மொழிப
- id: porul.370
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 370
  moolam: |-
    அறு சீர் அடியே ஆசிரியத் தளையொடு
    நெறி பெற்று வரூஉம் நேரடி முன்னே
  kaandigai:
    porul: அறுசீரடி ஆசிரியத் தளையொடு நேரடிக்கு முன் நெறிப்பட்டு வரும்.
    ethu: 369 ஐஞ்சீர் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: அறுசீரடி
    count: 6
  links: []
  urai:
    iyaipu:
    - porul.369
    - porul.371
    - porul.346
    text: 'இயைபு (649): 369 ஐஞ்சீர்; 371 எழுசீர்; 346 நேரடி 10 எழுத்து. எண்: 6 சீர்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.371
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 371
  moolam: |-
    எழு சீர் அடியே முடுகியல் நடக்கும்
  kaandigai:
    porul: எழுசீரடி முடுகியலில் நடக்கும்.
    ethu: 370 அறுசீர் என்றது; எழுசீர் அடி முடுகியல் நடக்கும் — 7 சீர் அடி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ஏழுசீரடி
    count: 7
  links: []
  urai:
    iyaipu:
    - porul.370
    - porul.372
    - porul.381
    text: 'இயைபு (649): 370 அறுசீர்; 372 முடுகியல் வரையார்; 381 எழுசீர் இறுதி. எண்: 7 சீர்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.372
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 372
  moolam: |-
    முடுகியல் வரையார் முதல் ஈர் அடிக்கும்
  kaandigai:
    porul: முதல் ஈரடிக்கும் முடுகியலை விலக்கார்.
    ethu: 371 எழுசீர் என்றது; முடுகியல் வரையார் முதல் ஈர் அடிக்கும் — முதல் இரு அடிக்கு வரையறை இல்லை (வரையறை இன்மை).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: முடுகியல்_விலக்கா
    count: 2
  links: []
  urai:
    iyaipu:
    - porul.371
    - porul.373
    text: 'இயைபு (649): 371 எழுசீர்; 373 மூவகை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'வரையார்' — இசைவு (வரையறை இன்மை)
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: வரையார்
- id: porul.373
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 373
  moolam: |-
    ஆசிரிய மருங்கினும் வெண்பா மருங்கினும்
    மூ வகை அடியும் முன்னுதல் இலவே
  kaandigai:
    porul: ஆசிரியத்திலும் வெண்பாவிலும் (முடுகியல் முதலிய) மூவகை அடியும் முன் வருதல் இல்லை.
    ethu: 372 என்றது; ஆசிரிய மருங்கினும் வெண்பா மருங்கினும் மூவகை அடியும் முன்னுதல் இலவே — மூன்று அடி வகையும் இரண்டிலும் வரா.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: மூவகை_அடி_வரம்பு
    count: 3
  links: []
  urai:
    iyaipu:
    - porul.364
    - porul.369
    - porul.372
    text: 'இயைபு (649): 364 வெள்ளை; 369 ஐஞ்சீர்; 372 முடுகியல். எண்: 3 (மூவகை அடி).'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'இலவே' — இசைவு (வரையறை இன்மை)
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: மூ வகை
- id: porul.374
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 374
  moolam: |-
    ஈற்று அயல் அடியே ஆசிரிய மருங்கின்
    தோற்றம் முச் சீர்த்து ஆகும் என்ப
  kaandigai:
    porul: ஆசிரியத்தில் ஈற்றயலடி முச்சீரால் தோன்றும்.
    ethu: 373 என்றது; ஈற்று அயல் அடி ஆசிரிய மருங்கின் தோற்றம் மூச் சீர்த்தாகும் — இறுதி அடுத்த அடி 3 சீர்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ஈற்றயலடி
    count: 3
  links: []
  urai:
    iyaipu:
    - porul.373
    - porul.375
    - porul.378
    text: 'இயைபு (649): 373 மூவகை; 375 இடை; 378 வெண்பாட்டு ஈற்று அடி. எண்: 3 சீர்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: porul.375
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 375
  moolam: |-
    இடையும் வரையார் தொடை உணர்வோரே
  kaandigai:
    porul: இடையிலும் (முச்சீரடியை) தொடை உணர்வோர் விலக்கார்.
    ethu: 374 மூச் சீர் என்றது; இடையும் வரையார் தொடை உணர்வோரே — இடை அடியின் தொடைக்கு வரையறை இல்லை (வரையறை இன்மை).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: இடை_தொடை_விலக்கா
  links: []
  urai:
    iyaipu:
    - porul.374
    - porul.376
    - porul.393
    text: 'இயைபு (649): 374 மூச் சீர்; 376 முரற்கை; 393 தொடை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'வரையார்' — இசைவு (வரையறை இன்மை)
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: வரையார்
- id: porul.376
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 376
  moolam: |-
    முச் சீர் முரற்கையுள் நிறையவும் நிற்கும்
  kaandigai:
    porul: முச்சீர் முரற்கையுள் நிறையவும் நிற்கும்.
    ethu: 375 என்றது; முச்சீர் முரற்கையுள் நிறையவும் நிற்கும் — 3 சீர் முரற்கையில் நிறைவு.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: முரற்கை_முச்சீர்
  links: []
  urai:
    iyaipu:
    - porul.375
    - porul.378
    text: 'இயைபு (649): 375 இடை; 378 வெண்பாட்டு ஈற்று.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.377
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 377
  moolam: |-
    வஞ்சித் தூக்கே செந்தூக்கு இயற்றே
  kaandigai:
    porul: வஞ்சித் தூக்கு செந்தூக்கின் இயல்பினது.
    ethu: 376 முச்சீர் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: வஞ்சித்தூக்கு
  links: []
  urai:
    iyaipu:
    - porul.349
    - porul.376
    - porul.389
    text: 'இயைபு (649): 349 வஞ்சி; 376 முச்சீர்; 389 ''தூங்கல் ஓசை வஞ்சி''.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒப்பக் கூறல்
    saanru: இயற்றே
- id: porul.378
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 378
  moolam: |-
    வெண்பாட்டு ஈற்று அடி முச் சீர்த்து ஆகும்
    அசை சீர்த்து ஆகும் அவ் வழியான
  kaandigai:
    porul: வெண்பாவின் ஈற்றடி முச்சீரால் ஆகும்; அவ்வழி அசைச்சீரால் முடியும்.
    ethu: 377 வஞ்சித் தூக்கு என்றது; வெண்பாட்டு ஈற்று அடி மூச் சீர்த்தாகும் — அசை சீர்த்தாகும் அவ்வழியான்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: வெண்பா_ஈற்றடி
    count: 3
  links: []
  urai:
    iyaipu:
    - porul.374
    - porul.377
    - porul.379
    text: 'இயைபு (649): 374 ஆசிரிய ஈற்று; 377 வஞ்சி; 379 நேரீற்று. எண்: 3 சீர்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.379
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 379
  moolam: |-
    நேர் ஈற்று இயற்சீர் நிரையும் நிரைபும்
    சீர் ஏற்று இறூஉம் இயற்கைய என்ப
  kaandigai:
    porul: நேர் ஈற்று இயற்சீர் நிரை, நிரைபு என்ற சீர் ஏற்று முடியும் இயல்பின.
    ethu: 378 வெண்பாட்டு ஈற்று என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: நேரீற்று_இயற்சீர்
  links: []
  urai:
    iyaipu:
    - porul.378
    - porul.380
    - porul.327
    text: 'இயைபு (649): 378 வெண்பாட்டு; 380 நிரை; 327 வெண்பா உரிச்சீர்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: porul.380
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 380
  moolam: |-
    நிரை அவண் நிற்பின் நேரும் நேர்பும்
    வரைவு இன்று என்ப வாய் மொழிப் புலவர்
  kaandigai:
    porul: அங்கே நிரை நின்றால் நேரும் நேர்பும் வரைவில்லை என்பர் வாய்மொழிப் புலவர்.
    ethu: 379 நேரீற்று என்றது; நிரை அவண் நிற்பின் நேரும் நேர்பும் வரைவு இன்று — இசைவு (வரையறை இன்மை).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: நிரை_வரைவிலை
  links: []
  urai:
    iyaipu:
    - porul.379
    - porul.381
    text: 'இயைபு (649): 379 நேர்; 381 எழுசீர் இறுதி.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'வரைவு இன்று' — இசைவு (வரையறை இன்மை)
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
  - peyar: ஒருதலை அன்மை
    saanru: வரைவு இன்று
- id: porul.381
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 381
  moolam: |-
    எழு சீர் இறுதி ஆசிரியம் கலியே
  kaandigai:
    porul: எழுசீர் இறுதியுடையது ஆசிரியம், கலி.
    ethu: 380 என்றது; எழு சீர் இறுதி ஆசிரியம் கலியே — ஏழு சீர் இறுதி ஆசிரியம்/கலி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ஏழுசீர்_இறுதி
    count: 7
  links: []
  urai:
    iyaipu:
    - porul.371
    - porul.380
    - porul.388
    text: 'இயைபு (649): 371 எழுசீர்; 380 நிரை; 388 கலி.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.382
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 382
  moolam: |-
    வெண்பா இயலினும் பண்புற முடியும்
  kaandigai:
    porul: வெண்பா இயலிலும் பண்புற முடியும்.
    ethu: 381 என்றது; வெண்பா இயலினும் பண்புற முடியும் — (381-இன் ஆசிரியமும் கலியும்) வெண்பா இயலினும் பண்புற முடியும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: வெண்பா_இயல்முடிவு
  links: []
  urai:
    iyaipu:
    - porul.381
    - porul.387
    - porul.413
    text: 'இயைபு (649): 381 எழுசீர்; 387 வெண்பா யாப்பே; 413 நடை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.383
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 383
  moolam: |-
    எழுத்து முதலா ஈண்டிய அடியின்
    குறித்த பொருளை முடிய நாட்டல்
    யாப்பு என மொழிப யாப்பு அறி புலவர்
  kaandigai:
    porul: எழுத்து முதலாகத் தொகுத்த அடியால் குறித்த பொருளை முடிய நிறுத்துதல் யாப்பு.
    ethu: 382 வெண்பா இயலினும் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
