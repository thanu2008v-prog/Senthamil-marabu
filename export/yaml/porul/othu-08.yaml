- id: porul.384
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 384
  moolam: |-
    பாட்டு உரை நூலே வாய்மொழி பிசியே
    அங்கதம் முதுசொல் அவ் ஏழ் நிலத்தும்
    வண் புகழ் மூவர் தண் பொழில் வரைப்பின்
    நாற் பெயர் எல்லை அகத்தவர் வழங்கும்
    யாப்பின் வழியது என்மனார் புலவர்
  kaandigai:
    porul: 'பாட்டு, உரை, நூல், வாய்மொழி, பிசி, அங்கதம், முதுசொல் என்ற ஏழு நிலத்திலும் — மூவேந்தர் நாட்டின் நாற்பெயர் எல்லைக்குள் வழங்குவது — யாப்பின் வழியது. காண்க: சொல். 398–400.'
    ethu: 383 யாப்பு என்றது; யாப்பின் 'ஏழ் நிலம்' — பாட்டு, உரை, நூல், வாய்மொழி, பிசி, அங்கதம், முதுசொல்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: ஏழுநிலம்
    count: 7
    context: 4_பெயர்_எல்லை
  links: []
  urai:
    iyaipu:
    - porul.383
    - porul.385
    - porul.467
    text: 'இயைபு (649): 383 யாப்பு பொது; 385 மரபு; 466 ''எழு நிலத்து எழுந்த செய்யுள்''. எண்: 7 (நூற்பா ''ஏழ் நிலத்தும்'') = 7 (பட்டியல்).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
