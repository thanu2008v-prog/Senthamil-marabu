- id: porul.435
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 435
  moolam: |-
    ஒத்தாழிசைக்கலி கலிவெண்பாட்டே
    கொச்சகம் உறழொடு கலி நால் வகைத்தே
  kaandigai:
    porul: 'கலி நான்கு வகை: ஒத்தாழிசைக்கலி, கலிவெண்பாட்டு, கொச்சகம், உறழ்.'
    en:
      kooruvathu: 4
      enniyathu: 4
    ethu: முன் சூத்திரம் அங்கதச் செய்யுளை வரையறுத்தது (பொருள். 434); கலியின் உறுப்புகள் முன்பே கூறப்பட்டன — "கொச்சகம் அராகம் சுரிதகம் எருத்தொடு" (பொருள். 426). இது கலியின் வகைகள்; அவற்றுள் முதலாவது அடுத்து விரிகிறது — "ஒத்தாழிசைக்கலி இரு வகைத்து ஆகும்" (பொருள். 436).
    eduthukkaattu:
    - text: கொச்சகம் அராகம் சுரிதகம் எருத்தொடு
      from: porul.426
    - text: ஒத்தாழிசைக்கலி இரு வகைத்து ஆகும்
      from: porul.436
  nilai: நூலில் நேரடியாக
  kanini:
