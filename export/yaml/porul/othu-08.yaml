    - porul.439
    - porul.444
    text: 'இயைபு (649): 437 இடைநிலை; 439 தரவு; 444 வண்ணகம்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.441
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 441
  moolam: |-
    போக்கு இயல் வகையே வைப்பு எனப்படுமே
    தரவு இயல் ஒத்தும் அதன் அகப்படுமே
    புரை தீர் இறுதி நிலை உரைத்தன்றே
  kaandigai:
    porul: போக்கின் இயல் வைப்பு எனப்படும்; தரவின் இயலோடு ஒத்து அதனுள் அடங்கும்; குற்றமற்ற இறுதிநிலையைக் கூறுவது.
    ethu: 440 அடை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: pokku_ilaippu
    count: null
  links: []
  urai:
    iyaipu:
    - porul.437
    - porul.440
    - porul.444
    text: 'இயைபு (649): 437 இடைநிலை; 440 அடை; 444 வண்ணகம்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தான் குறியிடுதல்
    saanru: எனப்படுமே
- id: porul.442
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 442
  moolam: |-
    ஏனை ஒன்றே
    தேவர்ப் பராஅய முன்னிலைக்கண்ணே
  kaandigai:
    porul: மற்றொன்று தேவரைப் பரவும் முன்னிலையில் வருவது.
    en:
      kooruvathu: 1
      enniyathu: 1
    ethu: 441 போக்கு என்றது; ஏனை ஒன்றே — தேவர்ப் பராஅய முன்னிலைக்கண்.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: classification
    class: oththaazhisaikkali_vagai
    count: 1
  links: []
  urai:
    iyaipu:
    - porul.441
    - porul.443
    - porul.447
    text: 'இயைபு (649): 441 போக்கு; 443 வண்ணகம்; 447 அடக்கு இயல். ''தேவர்'' — எவர் என நூல் இங்கு விரிக்கவில்லை — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'தேவர்' — எவர் என ஒருதலை அன்மை
- id: porul.443
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 443
  moolam: |-
    அதுவே
    வண்ணகம் ஒருபோகு என இரு வகைத்தே
  kaandigai:
    porul: அது வண்ணகம், ஒருபோகு என இருவகை.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 442 என்றது; அதுவே 2 வகை — வண்ணகம், ஒருபோகு.
