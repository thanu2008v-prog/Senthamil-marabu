    saanru: ஒன்று
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
  - peyar: தான் குறியிடுதல்
    saanru: என மொழிப
- id: porul.438
  pindam: 1
  padalam: porul
  othu: 8
  sutra: 438
  moolam: |-
    தரவேதானும் நால் அடி இழிபு ஆய்
    ஆறு இரண்டு உயர்வும் பிறவும் பெறுமே
  kaandigai:
    porul: தரவு இழிபு நான்கடி; உயர்வு பன்னிரண்டு (ஆறு இரண்டு); பிறவும் பெறும்.
    ethu: 437 தரவு என்றது; இது அதன் தொடர்ச்சி.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    class: tharavu_alavu
    count: null
  links: []
  urai:
