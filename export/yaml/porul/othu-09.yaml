    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: porul.627
  pindam: 1
  padalam: porul
  othu: 9
  sutra: 627
  moolam: |-
    அந்தணாளர்க்கு அரசு வரைவு இன்றே
  kaandigai:
    porul: அந்தணர்க்கு அரசு விலக்கில்லை.
    ethu: 626 என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: exception
    class: anthanar_arasu
    count: null
  links: []
  urai:
    iyaipu:
    - porul.615
    - porul.626
    text: 'இயைபு (649): 615 அந்தணர்; 626 வேந்து தொழில்.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'வரைவு இன்றே' — இசைவு (வரையறை இன்மை)
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: வரைவு இன்றே
- id: porul.628
  pindam: 1
  padalam: porul
  othu: 9
  sutra: 628
  moolam: |-
    வில்லும் வேலும் கழலும் கண்ணியும்
    தாரும் மாலையும் தேரும் மாவும்
    மன் பெறு மரபின் ஏனோர்க்கும் உரிய
  kaandigai:
    porul: வில், வேல், கழல், கண்ணி, தார், மாலை, தேர், மா — மன்பெறு மரபின் ஏனோர்க்கும் உரியன.
    en:
      kooruvathu: null
      enniyathu: 8
    ethu: 627 என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: classification
    class: veerar_uriyana
    count: 8
  links: []
  urai:
    iyaipu:
    - porul.616
    - porul.627
    - porul.629
    text: 'இயைபு (649): 616 அரசர்; 627 அந்தணர்; 629 இழிந்தோர். எண்: 8 (வில், வேல், கழல், கண்ணி, தார், மாலை, தேர், மா).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.629
  pindam: 1
  padalam: porul
  othu: 9
  sutra: 629
  moolam: |-
    அன்னர் ஆயினும் இழிந்தோர்க்கு இல்லை
  kaandigai:
    porul: அன்னராயினும் இழிந்தோர்க்கு இல்லை என்கிறது நூல்.
    ethu: 628 என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: exception
    class: izhinthorkku_ila
    count: null
  links: []
  urai:
    iyaipu:
    - porul.628
    - porul.630
    text: 'இயைபு (649): 628 ஏனோர்; 630 புல்.'
    vagai: விலக்கு
    vilakkukkuriyathu:
    - porul.628
    thunivu: நூலில் நேரடியாக
- id: porul.630
  pindam: 1
  padalam: porul
  othu: 9
  sutra: 630
  moolam: |-
    புறக் காழனவே புல் என மொழிப
  kaandigai:
    porul: புறம் வைரமுடையன புல்.
    ethu: 629 இழிந்தோர் என்றது; புறக்காழனவே (வெளிக்காழ் உடையன) — புல் என மொழி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: pul_ilakkanam
    count: null
  links: []
  urai:
    iyaipu:
    - porul.629
    - porul.631
    text: 'இயைபு (649): 629 இழிந்தோர்; 631 மரம்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
  - peyar: தான் குறியிடுதல்
    saanru: என மொழிப
- id: porul.631
  pindam: 1
  padalam: porul
  othu: 9
  sutra: 631
  moolam: |-
    அகக் காழனவே மரம் என மொழிப
  kaandigai:
    porul: அகம் வைரமுடையன மரம்.
    ethu: 630 புல் என்றது; அகக்காழனவே (உட்காழ் உடையன) — மரம் என மொழி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: maram_ilakkanam
    count: null
  links: []
  urai:
    iyaipu:
    - porul.630
    - porul.632
    text: 'இயைபு (649): 630 புல்; 632 புல்லின் உறுப்புகள்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
  - peyar: தான் குறியிடுதல்
    saanru: என மொழிப
- id: porul.632
  pindam: 1
  padalam: porul
  othu: 9
  sutra: 632
  moolam: |-
    தோடே மடலே ஓலை என்றா
    ஏடே இதழே பாளை என்றா
    ஈர்க்கே குலை என நேர்ந்தன பிறவும்
    புல்லொடு வரும் எனச் சொல்லினர் புலவர்
  kaandigai:
    porul: தோடு, மடல், ஓலை, ஏடு, இதழ், பாளை, ஈர்க்கு, குலை முதலியன புல்லொடு வரும் சொற்கள்.
    en:
      kooruvathu: null
      enniyathu: 8
    ethu: 631 மரம் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: classification
    class: pullin_uruppu
    count: 8
  links: []
  urai:
    iyaipu:
    - porul.630
    - porul.631
    - porul.633
    text: 'இயைபு (649): 630 புல்; 631 மரம்; 633 மரத்தின் உறுப்புகள்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: வந்தது கொண்டு வாராதது உணர்த்தல்
    saanru: பிறவும்
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: புலவர்
- id: porul.633
  pindam: 1
  padalam: porul
  othu: 9
  sutra: 633
  moolam: |-
    இலையே தளிரே முறியே தோடே
    சினையே குழையே பூவே அரும்பே
    நனை உள்ளுறுத்த அனையவை எல்லாம்
    மரனொடு வரூஉம் கிளவி என்ப
  kaandigai:
    porul: இலை, தளிர், முறி, தோடு, சினை, குழை, பூ, அரும்பு, நனை முதலியன மரத்தொடு வரும் சொற்கள்.
    en:
      kooruvathu: null
      enniyathu: 9
    ethu: 632 புல் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: classification
    class: marathin_uruppu
    count: 9
  links: []
  urai:
    iyaipu:
    - porul.631
    - porul.632
    - porul.634
    text: 'இயைபு (649): 631 மரம்; 632 புல்; 634 காய்/பழம்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: porul.634
  pindam: 1
  padalam: porul
  othu: 9
  sutra: 634
  moolam: |-
    காயே பழமே தோலே செதிளே
    வீழொடு என்று ஆங்கு அவையும் அன்ன
  kaandigai:
    porul: காய், பழம், தோல், செதிள், வீழ் ஆகியவையும் அவ்வாறே.
    en:
      kooruvathu: null
      enniyathu: 5
    ethu: 633 மரம் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: classification
    class: marathin_vilai
    count: 5
  links: []
  urai:
    iyaipu:
    - porul.633
    - porul.635
    text: 'இயைபு (649): 633 மரம்; 635 ஐம்பூதம். எண்: 5 (காய், பழம், தோல், செதில், வீழ்).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.635
  pindam: 1
  padalam: porul
  othu: 9
  sutra: 635
  moolam: |-
    நிலம் தீ நீர் வளி விசும்பொடு ஐந்தும்
    கலந்த மயக்கம் உலகம் ஆதலின்
    இரு திணை ஐம் பால் இயல் நெறி வழாஅமைத்
    திரிவு இல் சொல்லொடு தழாஅல் வேண்டும்
  kaandigai:
    porul: 'நிலம், தீ, நீர், வளி, விசும்பு — ஐந்தும் கலந்த மயக்கமே உலகம்; ஆகவே இருதிணை ஐம்பால் இயல்நெறி வழுவாமல் திரிவில்லாச் சொல்லால் தழுவ வேண்டும். இருதிணை ஐம்பால்: சொல். 1–4.'
    en:
      kooruvathu: 5
      enniyathu: 5
    ethu: 634 என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ulagam_aimpudal
    count: 5
  links: []
  urai:
    iyaipu:
    - porul.634
    - porul.636
    text: 'இயைபு (649): 634 காய்/பழம்; 636 மரபுநிலை. எண்: 5 (நிலம், தீ, நீர், வளி, விசும்பு).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: ஐந்தும்
  - peyar: ஆணை கூறல்
    saanru: வேண்டும்
- id: porul.636
  pindam: 1
  padalam: porul
  othu: 9
  sutra: 636
  moolam: |-
    மரபுநிலை திரிதல் செய்யுட்கு இல்லை
    மரபு வழிப் பட்ட சொல்லினானே
  kaandigai:
    porul: மரபு வழிப்பட்ட சொல்லால் (வருவதால்) செய்யுளுக்கு மரபுநிலை திரிதல் இல்லை.
    ethu: 635 ஐம்பூதம் என்றது; மரபுநிலை திரிதல் செய்யுட்கு இல்லை — மரபுவழிப்பட்ட சொல்லினால்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: marabu_thiriyamai
    count: null
  links: []
  urai:
    iyaipu:
    - porul.635
    - porul.637
    text: 'இயைபு (649): 635 ஐம்பூதம்; 637 மரபுநிலை திரியின்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.637
  pindam: 1
  padalam: porul
  othu: 9
  sutra: 637
  moolam: |-
    மரபுநிலை திரியின் பிறிது பிறிது ஆகும்
  kaandigai:
    porul: மரபுநிலை திரிந்தால் பொருள் பிறிது பிறிதாகும்.
    ethu: 636 மரபுநிலை என்றது; அது திரியின் பிறிது பிறிது ஆகும் — பொருள் மாறும்.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: marabu_thiri_porul
    count: null
  links: []
  urai:
    iyaipu:
    - porul.636
    - porul.638
    text: 'இயைபு (649): 636 மரபுநிலை; 638 வழக்கு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.638
  pindam: 1
  padalam: porul
  othu: 9
  sutra: 638
  moolam: |-
    வழக்கு எனப்படுவது உயர்ந்தோர் மேற்றே
    நிகழ்ச்சி அவர் கட்டு ஆகலான
  kaandigai:
    porul: வழக்கு என்பது உயர்ந்தோர் மேலது — நிகழ்ச்சி அவர் கட்டுப்பாட்டில் ஆதலால்.
    ethu: நூல் பல இடங்களில் வழக்கைச் சான்றாக்குகிறது — "வழங்கியல் மருங்கின்" (எழு. 483); இயற்சொல் "செந்தமிழ் நிலத்து வழக்கொடு சிவணி" (சொல். 398). ஆகவே எவருடைய வழக்கு என்பதை இங்கே வரையறுக்கிறது.
    eduthukkaattu:
    - text: வழங்கியல் மருங்கின்
      from: ezhu.483
    - text: செந்தமிழ் நிலத்து வழக்கொடு சிவணி
      from: sol.398
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: vazhakku_ilakkanam
    count: null
  links: []
  urai:
    iyaipu:
    - ezhu.171
    - ezhu.483
    - sol.17
    - sol.452
    text: '"வழக்கு எனப்படுவது உயர்ந்தோர் மேற்றே" — காரணம் "நிகழ்ச்சி அவர் கட்டு ஆகலான". நூல் பல இடங்களில் வழக்கைச் சான்றாக்குகிறது (எழு. 171, 483; சொல். 17, 452); எந்த வழக்கு என்பதற்கு இதுவே எல்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தான் குறியிடுதல்
    saanru: எனப்படுவது
- id: porul.639
  pindam: 1
  padalam: porul
  othu: 9
  sutra: 639
  moolam: |-
    மரபுநிலை திரியா மாட்சிய ஆகி
    உரை படு நூல்தாம் இரு வகை இயல
    முதலும் வழியும் என நுதலிய நெறியின
  kaandigai:
    porul: 'மரபுநிலை திரியாத மாட்சியுடைய உரைபடு நூல் இருவகை: முதல், வழி.'
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 638 வழக்கு என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: classification
    class: nool_vagai
    count: 2
  links: []
  urai:
    iyaipu:
    - porul.638
    - porul.640
    - porul.641
    text: 'இயைபு (649): 638 வழக்கு; 640 முதல் நூல்; 641 வழி நூல். எண்: 2 (முதல், வழி).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: இரு வகை
- id: porul.640
  pindam: 1
  padalam: porul
  othu: 9
  sutra: 640
  moolam: |-
    வினையின் நீங்கி விளங்கிய அறிவின்
    முனைவன் கண்டது முதல் நூல் ஆகும்
  kaandigai:
    porul: வினையின் நீங்கி விளங்கிய அறிவுடைய முனைவன் கண்டது முதல்நூல்.
    ethu: நூல் இரு வகை — "முதலும் வழியும் என நுதலிய நெறியின" (பொருள். 639); முதலாவதன் இலக்கணம் இது. அதனால் "சிதைவு இல் என்ப முதல்வன் கண்ணே" (பொருள். 652).
    eduthukkaattu:
    - text: முதலும் வழியும் என நுதலிய நெறியின
      from: porul.639
    - text: சிதைவு இல் என்ப முதல்வன் கண்ணே
      from: porul.652
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: muthal_nool
    count: null
  links: []
  urai:
    iyaipu:
    - porul.639
    - porul.641
    text: 'இயைபு (649): பொருள். 639, 641 · முதல் நூல்: "வினையின் நீங்கி விளங்கிய அறிவின் / முனைவன் கண்டது". 652 "சிதைவு இல் என்ப முதல்வன் கண்ணே" இதன் இணை — முதல் நூலில் சிதைவு இல்லை; வழிநூலில் சிதையலாம் (653).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.641
  pindam: 1
  padalam: porul
  othu: 9
  sutra: 641
  moolam: |-
    வழி எனப்படுவது அதன் வழித்து ஆகும்
  kaandigai:
    porul: அதன் வழியில் வருவது வழிநூல்.
    ethu: முதல்நூலின் இலக்கணம் (பொருள். 640) கூறிய பின் வழிநூல். அதன் வழிகள் நான்கு — "தொகுத்தல் விரித்தல் தொகைவிரி மொழிபெயர்த்து" (பொருள். 643). வழிநூலும் சிதையலாம் — "முதல் வழி ஆயினும் யாப்பினுள் சிதையும்" (பொருள். 653).
    eduthukkaattu:
    - text: தொகுத்தல் விரித்தல் தொகைவிரி மொழிபெயர்த்து
      from: porul.643
    - text: முதல் வழி ஆயினும் யாப்பினுள் சிதையும்
      from: porul.653
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: vazhi_nool
    count: null
  links: []
  urai:
    iyaipu:
    - porul.640
    - porul.642
    - porul.643
    text: 'இயைபு (649): பொருள். 640, 642, 643 · வழிநூல் "அதன் வழித்து" — முதல் நூலின் வழியது. 642 நால் வகை; 643 தொகுத்தல், விரித்தல், தொகைவிரி, மொழிபெயர்த்தல். இவ்வாவணம் செய்த மாற்றங்கள் (புதிய நூல், சுருக்கம், மென்பொருள்) இந்நான்கனுள் அடங்குவன (ஆய்வு 22).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தான் குறியிடுதல்
    saanru: எனப்படுவது
- id: porul.642
  pindam: 1
  padalam: porul
  othu: 9
  sutra: 642
  moolam: |-
    வழியின் நெறியே நால் வகைத்து ஆகும்
  kaandigai:
    porul: வழிநூலின் நெறி நான்கு வகை.
    en:
      kooruvathu: 4
      enniyathu: 4
    ethu: 641 வழி என்றது; அது 4 வகை — தொகுத்தல், விரித்தல், தொகைவிரி, மொழிபெயர்த்து (அதர்ப்பட யாத்தல்).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: classification
    class: vazhi_nool_vagai
    count: 4
  links: []
  urai:
    iyaipu:
    - porul.641
    - porul.643
    text: 'இயைபு (649): 641 வழி; 643 4-ஐ விரிக்கிறது. எண்: 4 (நூற்பா ''நால் வகைத்து'').'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: நால் வகைத்து
- id: porul.643
  pindam: 1
  padalam: porul
  othu: 9
  sutra: 643
  moolam: |-
    தொகுத்தல் விரித்தல் தொகைவிரி மொழிபெயர்த்து
    அதர்ப்பட யாத்தலொடு அனை மரபினவே
  kaandigai:
    porul: தொகுத்தல், விரித்தல், தொகைவிரி, மொழிபெயர்ப்பு — அதர்ப்பட யாத்தலோடு. செந்தமிழ் மரபு இந்நூற்பாவின்படி "வழிநூல் (தொகுத்தல்)" எனத் தன்னைக் குறிக்கிறது.
    en:
      kooruvathu: 4
      enniyathu: 5
    ethu: 642 4 என்றது; இது அதன் தொடர்ச்சி.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: classification
    class: vazhi_nool_vagai
    count: 5
  links: []
  urai:
    iyaipu:
    - porul.642
    - porul.644
    text: 'இயைபு (649): 642 வழி 4; 644 நூல் இயல்பு. எண்: நான்கு (642 ''நால் வகைத்து'') = நான்கு (தொகுத்தல், விரித்தல், தொகைவிரி, மொழிபெயர்த்து). ''அனை மரபினவே'' — மேலும் உள — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'அனை மரபினவே' ஒருதலை அன்மை
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிபெயர்த்து
- id: porul.644
  pindam: 1
  padalam: porul
  othu: 9
  sutra: 644
  moolam: |-
    ஒத்த சூத்திரம் உரைப்பின் காண்டிகை
    மெய்ப்படக் கிளந்த வகையது ஆகி
    ஈர் ஐங் குற்றமும் இன்றி நேரிதின்
    முப்பத்திரு வகை உத்தியொடு புணரின்
    நூல் என மொழிப நுணங்கு மொழிப் புலவர்
  kaandigai:
    porul: ஒத்த சூத்திரத்தைக் காண்டிகையால் மெய்ப்படக் கூறி, பத்துக் குற்றமும் (ஈர் ஐங்குற்றம்) இன்றி, முப்பத்திருவகை உத்தியொடு புணர்ந்தால் அது நூல். 10, 32 என்ற இரு எண்ணும் 654, 656-இன் பட்டியல்களோடு ஒத்தன (எண்ணிச் சரிபார்த்தது).
    en:
      kooruvathu: 32
      enniyathu: 32
    ethu: 'நூலின் கூறுகள் நூலிலேயே விரிக்கப்படுகின்றன: காண்டிகை (பொருள். 647, 648), குற்றம் பத்து (பொருள். 654), உத்தி முப்பத்திரண்டு (பொருள். 656). "நூல் எனப்படுவது" என்ற வரையறையும் உண்டு — "முதலும் முடிவும் மாறுகோள் இன்றி" (பொருள். 468).'
    eduthukkaattu:
    - text: நூல் எனப்படுவது
      from: porul.468
    - text: முதலும் முடிவும் மாறுகோள் இன்றி
      from: porul.468
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: nool_ilakkanam
    count: 32
  links: []
  urai:
    iyaipu:
    - porul.647
    - porul.649
    - porul.654
    - porul.656
    text: 'இயைபு (649): பொருள். 647, 649, 654, 656 · நூலின் இலக்கணம் — நான்கு கூறு: ஒத்த சூத்திரம்; காண்டிகை "மெய்ப்படக் கிளந்த வகையது"; "ஈர் ஐங் குற்றமும் இன்றி" (654-இன் பத்து); "முப்பத்திரு வகை உத்தியொடு" (656). நூலைப் பரிசோதிக்கும் அளவுகோல் இந்நூலே தருகிறது.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: ஈர் ஐங்
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
  - peyar: கூறிற்று என்றல்
    saanru: கிளந்த
  - peyar: தான் குறியிடுதல்
    saanru: என மொழிப
- id: porul.645
  pindam: 1
  padalam: porul
  othu: 9
  sutra: 645
  moolam: |-
    உரை எடுத்து அதன் முன் யாப்பினும் சூத்திரம்
    புரை தப உடன்படக் காண்டிகை புணர்ப்பினும்
    விதித்தலும் விலக்கலும் என இரு வகையொடு
    புரை தப நாடிப் புணர்க்கவும் படுமே
  kaandigai:
    porul: உரையை எடுத்து அதன் முன் சூத்திரம் யாத்தும், குற்றமற உடன்படக் காண்டிகை புணர்த்தும், விதித்தல் விலக்கல் என இருவகையொடு ஆராய்ந்து புணர்க்கவும் படும்.
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 644 32 உத்தி என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: classification
    class: urai_vagai
    count: 2
  links: []
  urai:
    iyaipu:
    - porul.644
    - porul.647
    - porul.648
    - porul.649
    text: 'இயைபு (649): 644 32 உத்தி; 647 காண்டிகை வரையறை; 648 காண்டிகை மேலும்; 649 உரை வரையறை. எண்: 2 (விதித்தல், விலக்கல்).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: இரு வகையொடு
- id: porul.646
  pindam: 1
  padalam: porul
  othu: 9
  sutra: 646
  moolam: |-
    மேற் கிளந்தெடுத்த யாப்பினுள் பொருளொடு
    சில் வகை எழுத்தின் செய்யுட்கு ஆகி
    சொல்லும் காலை உரை அகத்து அடக்கி
    நுண்மையொடு புணர்ந்த ஒண்மைத்து ஆகி
    துளக்கல் ஆகாத் துணைமை எய்தி
    அளக்கல் ஆகா அரும் பொருட்டு ஆகி
    பல வகையானும் பயன் தெரிபு உடையது
    சூத்திரத்து இயல்பு என யாத்தனர் புலவர்
  kaandigai:
    porul: 'சூத்திர இயல்பு: சில எழுத்தால் பொருளோடு செய்யுளாகி, உரையை அகத்து அடக்கி, நுண்மையொடு ஒண்மையுடையதாய், அசைக்க முடியாத துணையாய், அளக்க முடியாத அரும்பொருளதாய், பலவகையாலும் பயன் தெரிவது.'
    en:
      kooruvathu: null
      enniyathu: 6
    ethu: 645 என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: suthiram_ilakkanam
    count: 6
  links: []
  urai:
    iyaipu:
    - porul.645
    - porul.647
    - porul.648
    text: 'இயைபு (649): 645 காண்டிகை விதி; 647 காண்டிகை; 648 காண்டிகை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: புலவர்
  - peyar: கூறிற்று என்றல்
    saanru: கிளந்தெடுத்த
- id: porul.647
  pindam: 1
  padalam: porul
  othu: 9
  sutra: 647
  moolam: |-
    பழிப்பு இல் சூத்திரம் பட்ட பண்பின்
    கரப்பு இன்றி முடிவது காண்டிகை ஆகும்
  kaandigai:
    porul: குற்றமற்ற சூத்திரத்தின் பண்பால் மறைவின்றி முடிவது காண்டிகை. இந்த ஆவணத்தில் ஒவ்வொரு சூத்திரத்தின் கீழும் உள்ள "காண்டிகை" இவ்வரையறையைப் பின்பற்றுகிறது.
    ethu: 'உரை வகைகளுள் காண்டிகை சூத்திரத்தோடு நேரே இயைவது — "சூத்திரம் / புரை தப உடன்படக் காண்டிகை புணர்ப்பினும்" (பொருள். 645). அதன் நெறி அடுத்த சூத்திரத்தில்: "ஏது நடையினும் எடுத்துக்காட்டினும்" (பொருள். 648).'
    eduthukkaattu:
    - text: சூத்திரம் / புரை தப உடன்படக் காண்டிகை புணர்ப்பினும்
      from: porul.645
    - text: ஏது நடையினும் எடுத்துக்காட்டினும்
      from: porul.648
  nilai: ஒருதலை அன்மை
  kanini:
    kind: definition
    class: kandikai_ilakkanam
    count: null
  links: []
  urai:
    iyaipu:
    - porul.644
    - porul.648
    text: 'இயைபு (649): பொருள். 644, 648 · காண்டிகை: "பழிப்பு இல் சூத்திரம் பட்ட பண்பின் / கரப்பு இன்றி முடிவது". 648 அதன் நெறி: விட்டு அகலாது, விரிவொடு, "ஏது நடையினும் எடுத்துக்காட்டினும்". ஐயம்: "உம்" — இரண்டும் வேண்டுமா, இரண்டில் ஒன்றா — ஒருதலை அன்மை; இவ்வாவணக் காண்டிகைகள் நூலில் இல்லாத எடுத்துக்காட்டைச் சேர்க்கவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக; உரை சுட்டிய ஐயம் ஒருதலை அன்மை
- id: porul.648
  pindam: 1
  padalam: porul
  othu: 9
  sutra: 648
  moolam: |-
    விட்டு அகல்வு இன்றி விரிவொடு பொருந்தி
    சுட்டிய சூத்திரம் முடித்தற் பொருட்டா
    ஏது நடையினும் எடுத்துக்காட்டினும்
    மேவாங்கு அமைந்த மெய்ந் நெறித்து அதுவே
  kaandigai:
    porul: 'அது விட்டகலாமல் விரிவொடு பொருந்தி, சுட்டிய சூத்திரத்தை முடிக்க, ஏது நடையாலும் எடுத்துக்காட்டாலும் அமைந்த மெய்ந்நெறியது. குறிப்பு: இந்த ஆவணத்தின் காண்டிகை பெரும்பாலும் ஏதுவும் நூலுள் ஒப்பும் தருகிறது; புறநூல் எடுத்துக்காட்டுகளைத் தரவில்லை (பிறன் கோள் கலவாமைக்காக). எடுத்துக்காட்டு சேர்த்தல் அடுத்த "உரை" நிலையின் பணி.'
    en:
      kooruvathu: 2
      enniyathu: 2
    ethu: 647 என்றது; காண்டிகை — விட்டகல்வின்றி விரிவொடு பொருந்தி, ஏது நடையினும் எடுத்துக்காட்டினும் மெய்ந்நெறித்து.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: kandikai_amaippu
    count: 2
  links: []
  urai:
    iyaipu:
    - porul.645
    - porul.647
    - porul.649
    text: 'இயைபு (649): 647 காண்டிகை முதல் வரையறை; 649 உரை வரையறை. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.649
  pindam: 1
  padalam: porul
  othu: 9
  sutra: 649
  moolam: |-
    சூத்திரத்துட் பொருள் அன்றியும் யாப்புற
    இன்றியமையாது இயைபவை எல்லாம்
    ஒன்ற உரைப்பது உரை எனப்படுமே
  kaandigai:
    porul: சூத்திரத்துப் பொருளல்லாமலும் இன்றியமையாது இயைபவை எல்லாம் பொருந்த உரைப்பது உரை.
    ethu: காண்டிகை சூத்திரப் பொருளை முடிக்கிறது (பொருள். 647); உரை அதற்கு மேல் இயைபவற்றையும் சேர்க்கிறது. உரையின் நெறி அடுத்த சூத்திரத்தில் — "மறுதலைக் கடாஅ மாற்றமும் உடைத்தாய்" (பொருள். 650); நூல் "உள் நின்று அகன்ற உரையொடு புணர்ந்து" (பொருள். 468).
    eduthukkaattu:
    - text: மறுதலைக் கடாஅ மாற்றமும் உடைத்தாய்
      from: porul.650
    - text: உள் நின்று அகன்ற உரையொடு புணர்ந்து
      from: porul.468
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: urai_ilakkanam
    count: null
  links: []
  urai:
    iyaipu:
    - porul.645
    - porul.648
    - porul.650
    text: 'இயைபு (649): பொருள். 645, 648, 650 · உரை: "சூத்திரத்துட் பொருள் அன்றியும் யாப்புற / இன்றியமையாது இயைபவை எல்லாம் / ஒன்ற உரைப்பது". காண்டிகை சூத்திரம் சொன்னதை முடிக்கும் (647); உரை, சொல்லப்படாத ஆனால் இன்றியமையாத இயைபைச் சேர்க்கும். இவ்வாவண உரைகளின் "இயைபு (649)" இதனின்று.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தான் குறியிடுதல்
    saanru: எனப்படுமே
- id: porul.650
  pindam: 1
  padalam: porul
  othu: 9
  sutra: 650
  moolam: |-
    மறுதலைக் கடாஅ மாற்றமும் உடைத்தாய்
    தன் நூலானும் முடிந்த நூலானும்
    ஐயமும் மருட்கையும் செவ்விதின் நீக்கி
    தெற்றென ஒரு பொருள் ஒற்றுமை கொளீஇ
    துணிவொடு நிற்றல் என்மனார் புலவர்
  kaandigai:
    porul: (உரை) மறுதலைக் கடாவும் மாற்றமும் உடையதாய், தன் நூலாலும் முடிந்த நூலாலும் ஐயமும் மருட்கையும் நீக்கி, தெளிவாக ஒரு பொருள் ஒற்றுமை கொண்டு துணிவோடு நிற்றல். இதுவே செந்தமிழ் மரபின் "கேள்வி நெறி" அடிப்படை.
    en:
      kooruvathu: 3
      enniyathu: 3
    ethu: உரையின் இலக்கணம் (பொருள். 649) கூறிய பின் அது எவ்வாறு அமைய வேண்டும் என்பது; ஐயம் நீக்கலின் கருவிகள் உத்திகள் — "மறுதலை சிதைத்துத் தன் துணிபு உரைத்தல்" (பொருள். 656). இவ்வழிநூலின் ஒவ்வொரு உரையும் இதனால் "துணிவு" கொண்டு முடிகிறது.
    eduthukkaattu:
    - text: மறுதலை சிதைத்துத் தன் துணிபு உரைத்தல்
      from: porul.656
  nilai: ஒருதலை அன்மை
  kanini:
    kind: definition
    class: urai_amaippu
    count: 3
  links: []
  urai:
    iyaipu:
    - porul.649
    - porul.656
    text: 'இயைபு (649): பொருள். 649, 656 · உரையின் நெறி: மறுதலைக் கடாஅ, மாற்றம்; "தன் நூலானும் முடிந்த நூலானும்" ஐயமும் மருட்கையும் நீக்கல்; "தெற்றென ஒரு பொருள் ஒற்றுமை கொளீஇ / துணிவொடு நிற்றல்". ஐயம்: "முடிந்த நூல்" — பிற நூலா, இந்நூலின் முடிந்த பகுதியா — ஒருதலை அன்மை; பயனர் ஆணையால் இவ்வாவணம் தன் நூலை மட்டும் சான்றாகக் கொள்கிறது.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக; உரை சுட்டிய ஐயம் ஒருதலை அன்மை
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்மனார்
- id: porul.651
  pindam: 1
  padalam: porul
  othu: 9
  sutra: 651
  moolam: |-
    சொல்லப்பட்டன எல்லா மாண்பும்
    மறுதலை ஆயினும் மற்று அது சிதைவே
  kaandigai:
    porul: சொல்லப்பட்ட எல்லா மாண்பும் மறுதலையானால் அது சிதைவு.
    ethu: 650 மறுதலை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: sithaivu_ilakkanam
    count: null
  links: []
  urai:
    iyaipu:
    - porul.650
    - porul.652
    - porul.653
    text: 'இயைபு (649): 650 மறுதலை; 652 சிதைவு இல்; 653 யாப்பு சிதைவு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.652
  pindam: 1
  padalam: porul
  othu: 9
  sutra: 652
  moolam: |-
    சிதைவு இல் என்ப முதல்வன் கண்ணே
  kaandigai:
    porul: முதல்வனிடத்துச் சிதைவு இல்லை என்பர்.
    ethu: முதல்நூல் "வினையின் நீங்கி விளங்கிய அறிவின் / முனைவன் கண்டது" (பொருள். 640); ஆகவே அதில் சிதைவு இல்லை. வழிநூலுக்கு அது இல்லை — "முதல் வழி ஆயினும் யாப்பினுள் சிதையும்" (பொருள். 653) — ஆகவே இவ்வழிநூல் மூலத்தை மாற்றவில்லை.
    eduthukkaattu:
    - text: வினையின் நீங்கி விளங்கிய அறிவின் / முனைவன் கண்டது
      from: porul.640
    - text: முதல் வழி ஆயினும் யாப்பினுள் சிதையும்
      from: porul.653
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: muthalvan_sithaivu
    count: null
  links: []
  urai:
    iyaipu:
    - porul.640
    - porul.653
    text: 'இயைபு (649): பொருள். 640, 653 · "சிதைவு இல் என்ப முதல்வன் கண்ணே" — முதல்வன் (640) நூலில் சிதைவு இல்லை; 653 "முதல் வழி ஆயினும் யாப்பினுள் சிதையும் / வல்லோன் புணரா வாரம் போன்றே". ஆகவே மாறுபாடு தோன்றும் இடம் பாட ஐயம் / வாசிப்பு ஐயம்; முதல்வன் மேல் பிழை ஏற்றப்படாது — இவ்வாவணத்தின் நிலையான நெறி.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: porul.653
  pindam: 1
  padalam: porul
  othu: 9
  sutra: 653
  moolam: |-
    முதல் வழி ஆயினும் யாப்பினுள் சிதையும்
    வல்லோன் புணரா வாரம் போன்றே
  kaandigai:
    porul: முதல்நூலாயினும் வழிநூலாயினும் யாப்பினுள் சிதையும் — வல்லோன் புணராத வாரம் போல.
    ethu: 652 முதல்வன் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: nool_sithaivu
    count: null
  links: []
  urai:
    iyaipu:
    - porul.287
    - porul.651
    - porul.652
    text: 'இயைபு (649): 652 முதல்வன்; 651 சிதைவு; 287 ''போல'' உவம உருபு. எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.654
  pindam: 1
  padalam: porul
  othu: 9
  sutra: 654
  moolam: |-
    சிதைவு எனப்படுபவை வசை அற நாடின்
    கூறியது கூறல் மாறு கொளக் கூறல்
    குன்றக் கூறல் மிகை படக் கூறல்
    பொருள் இல கூறல் மயங்கக் கூறல்
    கேட்போர்க்கு இன்னா யாப்பிற்று ஆதல்
    பழித்த மொழியான் இழுக்கம் கூறல்
    தன்னான் ஒரு பொருள் கருதிக் கூறல்
    என்ன வகையினும் மனம் கோள் இன்மை
    அன்ன பிறவும் அவற்று விரி ஆகும்
  kaandigai:
    porul: 'சிதைவு: கூறியது கூறல், மாறுகொளக் கூறல், குன்றக் கூறல், மிகைபடக் கூறல், பொருளில கூறல், மயங்கக் கூறல், கேட்போர்க்கு இன்னா யாப்பு, பழித்த மொழியான் இழுக்கம் கூறல், தன்னான் ஒரு பொருள் கருதிக் கூறல், என்ன வகையினும் மனங்கோள் இன்மை — அன்ன பிறவும். எண்ணிப் பார்க்கப் பத்து; 644-இன் "ஈர் ஐங் குற்றம்" உடன் ஒத்தது.'
    en:
      kooruvathu: null
      enniyathu: 10
    ethu: நூலின் மாண்புகளின் மறுதலையே சிதைவு — "சொல்லப்பட்டன எல்லா மாண்பும் / மறுதலை ஆயினும் மற்று அது சிதைவே" (பொருள். 651). நூல் இலக்கணம் "ஈர் ஐங் குற்றமும் இன்றி" (பொருள். 644) எனக் கேட்டதால் பத்தும் இங்கே பெயரிடப்படுகின்றன.
    eduthukkaattu:
    - text: சொல்லப்பட்டன எல்லா மாண்பும் / மறுதலை ஆயினும் மற்று அது சிதைவே
      from: porul.651
    - text: ஈர் ஐங் குற்றமும் இன்றி
      from: porul.644
  nilai: நூலில் நேரடியாக
  kanini:
    kind: classification
    class: sithaivu_vagai
    count: 10
  links: []
  urai:
    iyaipu:
    - porul.651
    - porul.655
    - porul.644
    text: 'இயைபு (649): பொருள். 651, 655, 644 · சிதைவு பத்து: கூறியது கூறல், மாறு கொளக் கூறல், குன்றக் கூறல், மிகை படக் கூறல், பொருள் இல கூறல், மயங்கக் கூறல், கேட்போர்க்கு இன்னா யாப்பு, பழித்த மொழியான் இழுக்கம், தன்னான் ஒரு பொருள் கருதிக் கூறல், மனம் கோள் இன்மை — எண்ணிப் பார்க்கப் பத்து (644 "ஈர் ஐங் குற்றம்" உடன் ஒத்தது); "அன்ன பிறவும் அவற்று விரி". "தன் கோள் வேண்டாம்" என்ற ஆணை ஒன்பதாவது சிதைவின் தவிர்ப்பே.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: வந்தது கொண்டு வாராதது உணர்த்தல்
    saanru: பிறவும்
  - peyar: கூறிற்று என்றல்
    saanru: கூறியது
  - peyar: தான் குறியிடுதல்
    saanru: எனப்படுபவை
- id: porul.655
  pindam: 1
  padalam: porul
  othu: 9
  sutra: 655
  moolam: |-
    எதிர் மறுத்து உணரின் அத் திறத்தவும் அவையே
  kaandigai:
    porul: எதிர்மறுத்து உணர்ந்தால் அத்திறத்தனவும் அவையே — பத்துச் சிதைவின் எதிர் பத்தும் நூலின் அழகா என்பதை நூல் சொல்லால் கூறவில்லை (ஒருதலை அன்மை).
    en:
      kooruvathu: null
      enniyathu: 10
    ethu: 654 சிதைவு 10 என்றது; எதிர் மறுத்து உணரின் அத்திறத்தவும் அவையே — சிதைவுகள்.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    class: sithaivu_ethirmarai
    count: 10
  links: []
  urai:
    iyaipu:
    - porul.654
    text: 'இயைபு (649): 654 சிதைவு 10; 655 முடிவு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக; காண்டிகை சுட்டிய ஐயம் ஒருதலை அன்மை
  utthi:
  - peyar: எதிர் பொருள் உணர்த்தல்
    saanru: எதிர் மறுத்து
- id: porul.656
  pindam: 1
  padalam: porul
  othu: 9
  sutra: 656
  moolam: |-
    ஒத்த காட்சி உத்தி வகை விரிப்பின்
    நுதலியது அறிதல் அதிகார முறையே
    தொகுத்துக் கூறல் வகுத்து மெய்ந் நிறுத்தல்
    மொழிந்த பொருளொடு ஒன்ற அவ்வயின்
    மொழியாததனை முட்டு இன்றி முடித்தல்
    வாராததனான் வந்தது முடித்தல்
    வந்தது கொண்டு வாராதது உணர்த்தல்
    முந்து மொழிந்ததன் தலைதடுமாற்றே
    ஒப்பக் கூறல் ஒருதலை மொழிதல்
    தன் கோள் கூறல் முறை பிறழாமை
    பிறன் உடன்பட்டது தான் உடம்படுதல்
    இறந்தது காத்தல் எதிரது போற்றல்
    மொழிவாம் என்றல் கூறிற்று என்றல்
    தான் குறியிடுதல் ஒருதலை அன்மை
    முடிந்தது காட்டல் ஆணை கூறல்
    பல் பொருட்கு ஏற்பின் நல்லது கோடல்
    தொகுத்த மொழியான் வகுத்தனர் கோடல்
    மறுதலை சிதைத்துத் தன் துணிபு உரைத்தல்
    பிறன் கோள் கூறல் அறியாது உடம்படல்
    பொருள் இடையிடுதல் எதிர் பொருள் உணர்த்தல்
    சொல்லின் எச்சம் சொல்லியாங்கு உணர்த்தல்
    தந்து புணர்ந்து உரைத்தல் ஞாபகம் கூறல்
    உய்த்துக்கொண்டு உணர்த்தலொடு மெய்ப்பட நாடிச்
    சொல்லிய அல்ல பிற அவண் வரினும்
    சொல்லிய வகையான் சுருங்க நாடி
    மனத்தின் எண்ணி மாசு அறத் தெரிந்துகொண்டு
    இனத்தின் சேர்த்தி உணர்த்தல் வேண்டும்
    நுனித்தகு புலவர் கூறிய நூலே
  kaandigai:
    porul: 'முப்பத்திரண்டு உத்தி. (1) நுதலியது அறிதல், (2) அதிகார முறை, (3) தொகுத்துக் கூறல், (4) வகுத்து மெய்ந்நிறுத்தல், (5) மொழிந்த பொருளோடு ஒன்ற மொழியாததை முடித்தல், (6) வாராததனான் வந்தது முடித்தல், (7) வந்தது கொண்டு வாராதது உணர்த்தல், (8) முந்து மொழிந்ததன் தலைதடுமாற்று; (9) ஒப்பக் கூறல், (10) ஒருதலை மொழிதல், (11) தன் கோள் கூறல், (12) முறை பிறழாமை, (13) பிறன் உடன்பட்டது தான் உடம்படுதல், (14) இறந்தது காத்தல், (15) எதிரது போற்றல், (16) மொழிவாம் என்றல்; (17) கூறிற்று என்றல், (18) தான் குறியிடுதல், (19) ஒருதலை அன்மை, (20) முடிந்தது காட்டல், (21) ஆணை கூறல், (22) பல்பொருட்கு ஏற்பின் நல்லது கோடல், (23) தொகுத்த மொழியான் வகுத்தனர் கோடல், (24) மறுதலை சிதைத்துத் தன் துணிபு உரைத்தல்; (25) பிறன் கோள் கூறல், (26) அறியாது உடம்படல், (27) பொருள் இடையிடுதல், (28) எதிர்பொருள் உணர்த்தல், (29) சொல்லின் எச்சம் சொல்லியாங்கு உணர்த்தல், (30) தந்து புணர்ந்து உரைத்தல், (31) ஞாபகம் கூறல், (32) உய்த்துக்கொண்டு உணர்த்தல். சொல்லாதவை வந்தாலும் சொல்லிய வகையால் சுருங்க ஆராய்ந்து, மனத்தால் எண்ணி மாசறத் தெரிந்து, இனத்தோடு
      சேர்த்து உணர்த்த வேண்டும். இக்காண்டிகை முழுதும் பயன்படுத்திய "பிறன் கோள்", "ஒருதலை அன்மை" என்ற குறிகள் இந்நூற்பாவின் உத்திப் பெயர்களே. விரிவு: செந்தமிழ் மரபு "சிந்திக்கும் முறை (32 உத்தி)" பகுதி. — இத்துடன் பொருளதிகாரம் 656 நூற்பாவுக்கும் காண்டிகை நிறைவு.'
    en:
      kooruvathu: 32
      enniyathu: 32
    ethu: நூல் இலக்கணம் "முப்பத்திரு வகை உத்தியொடு புணரின்" (பொருள். 644) எனக் கேட்டதால் இறுதிச் சூத்திரம் அவற்றைப் பெயரிடுகிறது; சொல்லாதவற்றுக்கும் வழி தந்து முடிகிறது — "சொல்லிய அல்ல பிற அவண் வரினும்". இதே நெறி எல்லா அதிகாரப் புறனடைகளிலும் (எழு. 483; சொல். 463).
    eduthukkaattu:
    - text: முப்பத்திரு வகை உத்தியொடு புணரின்
      from: porul.644
    - text: சொல்லிய அல்ல பிற அவண் வரினும்
      from: porul.656
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: utthi_vagai
    count: 32
  links: []
  urai:
    iyaipu:
    - ezhu.483
    - sol.463
    text: 'நூலின் இறுதிச் சூத்திரம் — நூலைப் படிக்கும் கருவியைத் தானே தருகிறது: முப்பத்திரண்டு உத்தி. முதல் இரண்டு — நுதலியது அறிதல், அதிகார முறை — இவ்வாவணத்தின் உரை முறை (ஒவ்வொரு ஓத்தின் முதற் சூத்திர உரையும் "நுதலியது"). இறுதி வரிகள்: "சொல்லிய அல்ல பிற அவண் வரினும் … இனத்தின் சேர்த்தி உணர்த்தல் வேண்டும்" — புதியவற்றுக்கு நூல் தரும் வழி; எழு. 483, சொல். 463 உடன் மூன்றாம் அதிகாரப் புறனடை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: புலவர்
  - peyar: ஆணை கூறல்
    saanru: வேண்டும்
