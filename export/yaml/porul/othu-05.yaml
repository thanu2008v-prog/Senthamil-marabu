# இக்கோப்பு data_v2-இலிருந்து உருவானது. 'moolam' (சூத்திரம்) திருத்தக் கூடாது (பொருள். 652).
- id: porul.193
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 193
  moolam: |-
    இசை திரிந்து இசைப்பினும் இயையுமன் பொருளே
    அசை திரிந்து இசையா என்மனார் புலவர்
  kaandigai:
    porul: 'ஓசை திரிந்து ஒலித்தாலும் பொருள் பொருந்தும்; அசை திரிந்து ஒலிக்கா (அசையின் வடிவம் மாறாது) என்பர் புலவர். அசை: பொருள். 312.'
    ethu: 'பொருளியல் ஒழுக்கங்களைச் சொல்லும் செய்யுளின் பொது நெறியால் தொடங்குகிறது: இசை திரிந்தாலும் பொருள் இயையும். அசை யாப்பின் உறுப்பு — "நேரும் நிரையும் என்றிசின் பெயரே" (பொருள். 312); ஆகவே அது திரியின் செய்யுள் சிதையும்.'
    eduthukkaattu:
    - text: நேரும் நிரையும் என்றிசின் பெயரே
      from: porul.312
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    class: இசை_அசை_திரிபு
  links: []
  urai:
    iyaipu:
    - porul.312
    - sol.252
    text: 'பொருளியலின் நுதலியது: ஓசை திரிந்து இசைப்பினும் பொருள் இயையும்; அசை திரியாது. ஐயம்: இங்கு "அசை" யாப்பின் அசையா (பொருள். 312) அசைச்சொல்லா (சொல். 252 "அசைநிலை") — ஒருதலை அன்மை. 194 முதல் பொருளியல் கூறுகள் (நோயும் இன்பமும், உவமவாயில் …).'
    vagai: விதி-விலக்கு
    thunivu: நூலில் நேரடியாக; உரை சுட்டிய ஐயம் ஒருதலை அன்மை
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்மனார்
- id: porul.194
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 194
  moolam: |-
    நோயும் இன்பமும் இரு வகை நிலையின்
    காமம் கண்ணிய மரபிடை தெரிய
    எட்டன் பகுதியும் விளங்க ஒட்டிய
    உறுப்புடையது போல் உணர்வுடையது போல்
    மறுத்து உரைப்பது போல் நெஞ்சொடு புணர்த்தும்
    சொல்லா மரபின் அவற்றொடு கெழீஇ
    செய்யா மரபின் தொழிற்படுத்து அடக்கியும்
    அவர் அவர் உறு பிணி தம போல் சேர்த்தியும்
    அறிவும் புலனும் வேறுபட நிறீஇ
    இரு பெயர் மூன்றும் உரிய ஆக
    உவமவாயில் படுத்தலும் உவமம்
    ஒன்று இடத்து இருவர்க்கும் உரிய பாற் கிளவி
  kaandigai:
    porul: நோயும் இன்பமும் என்ற இருவகை நிலையில், காமம் கருதிய மரபு தெரிய, உறுப்புடையது போலவும் உணர்வுடையது போலவும் மறுத்துரைப்பது போலவும் நெஞ்சோடு புணர்த்தும், சொல்லாத பொருள்களோடு பேசியும், செய்யாதவற்றைச் செய்வனவாக்கியும், பிறர் துன்பத்தைத் தம் துன்பம் போலச் சேர்த்தியும், உவமவாயில் படுத்தியும் கூறுதல் — இருவர்க்கும் உரிய பாற் கிளவி.
    ethu: 193 இசை/அசை என்றது; நோயும் இன்பமும் ஆகிய இரு நிலைகளின் காம வாழ்க்கை — அதன் எட்டுப் பகுதியும் விளங்க, உறுப்பு போல/உணர்வு போல, மறுத்துரைப்பது போல — பல வகை.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: definition
    class: பாற்கிளவி
  links: []
  urai:
    iyaipu:
    - porul.89
    - porul.193
    - porul.247
    text: 'இயைபு (649): 89 காமக்கூட்டம்; 193 இசை/அசை; 247 மெய்ப்பாடு 8 — இதுவே 194-இன் ''எட்டன் பகுதி'' ஆக இருக்கலாம். ''எட்டன் பகுதியும்'' — எவை என இந்த ஓத்தில் விரியவில்லை — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'எட்டன் பகுதியும்' எவை என ஒருதலை அன்மை
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: இரு வகை
  - peyar: ஒப்பக் கூறல்
    saanru: போல்
- id: porul.195
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 195
  moolam: |-
    கனவும் உரித்தால் அவ் இடத்தான
  kaandigai:
    porul: அவ்விடத்துக் கனவும் உரியது.
    ethu: 194 இரு நிலை என்றது; கனவும் அந்த இடத்திற்கு (காம வாழ்க்கைக்கு) உரித்து.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    class: கனவு_உரிமை
  links: []
  urai:
    iyaipu:
    - porul.194
    - porul.196
    text: 'இயைபு (649): 194 காம வாழ்க்கை; 196 தாய்க்கும். எடுத்துக்காட்டு நூல் தரவில்லை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக; காண்டிகை சுட்டிய ஐயம் ஒருதலை அன்மை
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: உரித்தால்
- id: porul.196
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 196
  moolam: |-
    தாய்க்கும் உரித்தால் போக்கு உடன் கிளப்பின்
  kaandigai:
    porul: போக்கு உடன் கிளக்குமிடத்து (இவ்வகைக் கூற்று) தாய்க்கும் உரியது.
    ethu: 195 கனவு என்றது; தாய்க்கும் (போக்கு உடன் கிளப்பின் — போக்கு அறியும்போது) உரித்து.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: தாய்_கூற்று_நிபந்தனை
  links: []
  urai:
    iyaipu:
    - porul.195
    - porul.197
    text: 'இயைபு (649): 195 கனவு; 197 பால்-கெழு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: உரித்தால்
- id: porul.197
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 197
  moolam: |-
    பால் கெழு கிளவி நால்வர்க்கும் உரித்தே
    நட்பின் நடக்கை ஆங்கு அலங்கடையே
  kaandigai:
    porul: பால் கெழு கிளவி நால்வர்க்கும் உரியது — நட்பின் நடக்கை அங்கு இல்லாதவிடத்து. "நால்வர்" யார் என்பது இங்கும் பெயரிடப்படவில்லை (பொருள். 31 காண்க).
    ethu: 196 தாய் என்றது; இது அதன் தொடர்ச்சி.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: enumeration
    class: பாற்கிளவி_நால்வர்
    count: 4
    items_not_named: true
  links: []
  urai:
    iyaipu:
    - porul.196
    - porul.198
    - porul.191
    text: 'இயைபு (649): 196 தாய்; 198 அதே நால்வர்; 191 12 வாயில் — இவர்களுள் சிலர். ''நால்வர்'' — யார் என இந்த ஓத்தில் விரியவில்லை (தலைவன்/தலைவி/தோழி/செவிலி ஆகலாம்) — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'நால்வர்' யார் என ஒருதலை அன்மை
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: உரித்தே
- id: porul.198
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 198
  moolam: |-
    உயிரும் நாணும் மடனும் என்று இவை
    செயிர் தீர் சிறப்பின் நால்வர்க்கும் உரிய
  kaandigai:
    porul: உயிர், நாண், மடம் ஆகியவை குற்றமற்ற சிறப்புடைய நால்வர்க்கும் உரியன.
    ethu: 197 நால்வர் என்றது; இது அதன் தொடர்ச்சி.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: enumeration
    class: நால்வர்_இயல்பு
    count: 4
    items_not_named: true
  links: []
  urai:
    iyaipu:
    - porul.197
    - porul.96
    - porul.106
    text: 'இயைபு (649): 197 அதே நால்வர்; 96 பெண்பாற்கு ஐந்து (அச்சம்/நாண்/மடன்); 106 பெண்மை. எண்: 3 (உயிர், நாண், மடன்).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக; காண்டிகை சுட்டிய ஐயம் ஒருதலை அன்மை
- id: porul.199
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 199
  moolam: |-
    வண்ணம் பசந்து புலம்புறு காலை
    உணர்ந்த போல உறுப்பினைக் கிழவி
    புணர்ந்த வகையான் புணர்க்கவும் பெறுமே
  kaandigai:
    porul: நிறம் பசந்து புலம்பும் காலத்து, உறுப்புகள் உணர்ந்தன போலக் கிழவி புணர்ந்த வகையால் (அவற்றைப்) புணர்த்துக் கூறவும் பெறும்.
    ethu: 198 மூன்று என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: புலம்பு_புணர்த்தல்
  links: []
  urai:
    iyaipu:
    - porul.198
    - porul.200
    text: 'இயைபு (649): 198 மூன்று; 200 உடம்பு/உயிர் வாடல்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒப்பக் கூறல்
    saanru: போல
- id: porul.200
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 200
  moolam: |-
    உடம்பும் உயிரும் வாடியக்கண்ணும்
    என் உற்றனகொல் இவை எனின் அல்லதை
    கிழவோற் சேர்தல் கிழத்திக்கு இல்லை
  kaandigai:
    porul: உடம்பும் உயிரும் வாடிய நிலையிலும், "என் உற்றனகொல் இவை" என்று கேட்பதல்லாமல் கிழவோனிடம் (தானே) சேர்தல் கிழத்திக்கு இல்லை.
    ethu: 199 புலம்பல் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: கிழத்தி_சேராமை
  links: []
  urai:
    iyaipu:
    - porul.199
    - porul.201
    text: 'இயைபு (649): 199 புலம்பல்; 201 உசாவு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.201
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 201
  moolam: |-
    ஒரு சிறை நெஞ்சமொடு உசாவும் காலை
    உரியதாகலும் உண்டு என மொழிப
  kaandigai:
    porul: ஒருபக்க நெஞ்சோடு உசாவும் காலத்து (அது) உரியதாதலும் உண்டு என்பர்.
    ethu: 200 'என உற்றனகொல்' என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ஒருபக்க_நெஞ்சு
  links: []
  urai:
    iyaipu:
    - porul.200
    - porul.202
    text: 'இயைபு (649): 200 வாடல்; 202 கரத்தல்/வேட்டல்.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'உண்டு' — இசைவு (வரையறை இன்மை)
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
  - peyar: தான் குறியிடுதல்
    saanru: என மொழிப
- id: porul.202
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 202
  moolam: |-
    தன்வயின் கரத்தலும் அவன்வயின் வேட்டலும்
    அன்ன இடங்கள் அல் வழி எல்லாம்
    மடனொடு நிற்றல் கடன் என மொழிப
  kaandigai:
    porul: தன்னிடம் மறைத்தலும் அவனிடம் விரும்புதலும் — அவ்விடங்கள் அல்லாதவிடமெல்லாம் மடத்தோடு நிற்றல் கடமை என்பர்.
    ethu: 201 உசாவு என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: மடன்_கடமை
  links: []
  urai:
    iyaipu:
    - porul.201
    - porul.203
    - porul.96
    text: 'இயைபு (649): 201 உசாவு; 203 அறத்தொடு நிற்றல்; 96 மடன்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
  - peyar: தான் குறியிடுதல்
    saanru: என மொழிப
- id: porul.203
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 203
  moolam: |-
    அறத்தொடு நிற்கும் காலத்து அன்றி
    அறத்து இயல் மரபு இலள் தோழி என்ப
  kaandigai:
    porul: அறத்தொடு நிற்கும் காலம் அல்லாமல், அறத்தியல் மரபு தோழிக்கு இல்லை என்பர்.
    ethu: 202 அல்லாத இடங்கள் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: அறத்தொடு_நிற்றல்
  links: []
  urai:
    iyaipu:
    - porul.202
    - porul.204
    - porul.233
    text: 'இயைபு (649): 202 எல்லா இடங்கள்; 204 தோழி 7 வகை; 233 தோழி நீக்கல். ''அன்றி'' — அறத்தொடு நிற்றல் காலம் தவிர.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: porul.204
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 204
  moolam: |-
    எளித்தல் ஏத்தல் வேட்கை உரைத்தல்
    கூறுதல் உசாஅதல் ஏதீடு தலைப்பாடு
    உண்மை செப்பும் கிளவியொடு தொகைஇ
    அவ் எழு வகைய என்மனார் புலவர்
  kaandigai:
    porul: '(அறத்தொடு நிற்றல்) ஏழு வகை: எளித்தல், ஏத்தல், வேட்கை உரைத்தல், கூறுதல், உசாஅதல், ஏதீடு, தலைப்பாடு — உண்மை செப்பும் கிளவியோடு தொகுத்து. இவை 203-இன் அறத்தொடு நிற்றலின் வகைகள் என நூற்பா பெயரிடவில்லை (ஒருதலை அன்மை).'
    ethu: 203 தோழி என்றது; இது அதன் தொடர்ச்சி.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: enumeration
    class: அறநிலை_வகை
    count: 7
  links: []
  urai:
    iyaipu:
    - porul.203
    - porul.205
    - porul.98
    text: 'இயைபு (649): 203 தோழி; 205 உற்றுழி; 98 தோழி கூற்று (களவியலில்). எண்: ஏழு (நூற்பா ''எழு வகைய''); பட்டியலில் எட்டுப் பெயர் தோன்றுகின்றன (எளித்தல், ஏத்தல், வேட்கை உரைத்தல், கூறுதல், உசாஅதல், ஏதீடு, தலைப்பாடு, உண்மை செப்பும் கிளவி) — எவ்விரண்டு ஒன்றாகக் கொள்ளப்படும் (எ.கா. ''கூறுதல் உசாஅதல்'' அல்லது ''ஏதீடு தலைப்பாடு'') என்பது ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; ஏழு எவ்வாறு பிரியும் என்பது ஒருதலை அன்மை
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்மனார்
- id: porul.205
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 205
  moolam: |-
    உற்றுழி அல்லது சொல்லல் இன்மையின்
    அப் பொருள் வேட்கை கிழவியின் உணர்ப
  kaandigai:
    porul: உற்ற இடத்து அல்லாமல் சொல்லுதல் இல்லாததால், அப்பொருள் வேட்கையைக் கிழவியின் (குறிப்பால்) உணர்வர்.
    ethu: 204 ஏழ் வகை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: கிழவி_குறிப்பு
  links: []
  urai:
    iyaipu:
    - porul.204
    - porul.206
    text: 'இயைபு (649): 204 ஏழ்; 206 பெண்பால்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.206
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 206
  moolam: |-
    செறிவும் நிறைவும் செம்மையும் செப்பும்
    அறிவும் அருமையும் பெண்பாலான
  kaandigai:
    porul: செறிவு, நிறைவு, செம்மை, செப்பு, அறிவு, அருமை — பெண்பாலுக்கு உரியன.
    ethu: 205 உற்றுழி என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: பெண்பால்_இயல்பு_6
    count: 6
  links: []
  urai:
    iyaipu:
    - porul.205
    - porul.96
    - porul.106
    text: 'இயைபு (649): 205 உற்றுழி; 96 பெண்பால் 5; 106 நாண்/மடன். எண்: 6.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.207
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 207
  moolam: |-
    பொழுதும் ஆறும் காப்பும் என்று இவற்றின்
    வழுவின் ஆகிய குற்றம் காட்டலும்
    தன்னை அழிதலும் அவண் ஊறு அஞ்சலும்
    இரவினும் பகலினும் நீ வா என்றலும்
    கிழவோன் தன்னை வாரல் என்றலும்
    நன்மையும் தீமையும் பிறிதினைக் கூறலும்
    புரை பட வந்த அன்னவை பிறவும்
    வரைதல் வேட்கைப் பொருள என்ப
  kaandigai:
    porul: பொழுது, வழி, காவல் ஆகியவற்றின் வழுவால் வரும் குற்றம் காட்டல், தன்னை அழிதல், ஊறு அஞ்சல், "இரவினும் பகலினும் நீ வா" என்றல், "வாரல்" என்றல், நன்மை தீமையைப் பிறிதொன்றின் மேல் கூறல் முதலியன வரைதல் வேட்கைப் பொருளன.
    ethu: 206 பெண்பால் என்றது; இது அதன் தொடர்ச்சி.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    class: வரைதல்_வேட்கை
  links: []
  urai:
    iyaipu:
    - porul.206
    - porul.208
    - porul.110
    text: 'இயைபு (649): 206 பெண்பால்; 208 வேட்கை மறுத்து; 110 வரைவிடை. ''அன்னவை பிறவும்'' — எவை என நூல் பெயரிடவில்லை — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'அன்னவை பிறவும்' ஒருதலை அன்மை
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: ஆறும்
  - peyar: வந்தது கொண்டு வாராதது உணர்த்தல்
    saanru: பிறவும்
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: porul.208
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 208
  moolam: |-
    வேட்கை மறுத்துக் கிளந்தாங்கு உரைத்தல்
    மரீஇய மருங்கின் உரித்து என மொழிப
  kaandigai:
    porul: வேட்கையை மறுத்துக் கூறியவாறே உரைத்தல் பழகிய இடத்து உரியது என்பர்.
    ethu: 207 வரைதல் என்றது; வேட்கை மறுத்துக் கிளந்தாங்கு உரைத்தல் — மரீஇய மருங்கின் உரித்து.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: வேட்கை_மறுப்பு
  links: []
  urai:
    iyaipu:
    - porul.207
    - porul.209
    text: 'இயைபு (649): 207 வரைதல்; 209 ஊர்தல்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
  - peyar: கூறிற்று என்றல்
    saanru: கிளந்தாங்கு
  - peyar: தான் குறியிடுதல்
    saanru: என மொழிப
  - peyar: ஒருதலை அன்மை
    saanru: உரித்து
- id: porul.209
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 209
  moolam: |-
    தேரும் யானையும் குதிரையும் பிறவும்
    ஊர்ந்தனர் இயங்கலும் உரியர் என்ப
  kaandigai:
    porul: தேர், யானை, குதிரை முதலியவற்றில் ஊர்ந்து செல்லுதலும் உரியர் என்பர்.
    ethu: 208 உரைத்தல் என்றது; இது அதன் தொடர்ச்சி.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    class: வாகன_உரிமை
  links: []
  urai:
    iyaipu:
    - porul.208
    - porul.210
    text: 'இயைபு (649): 208 உரைத்தல்; 210 உண்டல். ''பிறவும்'' — எவை என நூல் பெயரிடவில்லை — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'பிறவும்' ஒருதலை அன்மை
  utthi:
  - peyar: வந்தது கொண்டு வாராதது உணர்த்தல்
    saanru: பிறவும்
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: porul.210
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 210
  moolam: |-
    உண்டற்கு உரிய அல்லாப் பொருளை
    உண்டன போலக் கூறலும் மரபே
  kaandigai:
    porul: உண்ணத் தகாத பொருளை உண்டன போலக் கூறுதலும் மரபு.
    ethu: 209 ஊர்ந்தனர் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: உணவு_மரபு
  links: []
  urai:
    iyaipu:
    - porul.209
    - porul.211
    text: 'இயைபு (649): 209 ஊர்தல்; 211 பொருள் என.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒப்பக் கூறல்
    saanru: போலக்
- id: porul.211
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 211
  moolam: |-
    பொருள் என மொழிதலும் வரை நிலை இன்றே
    காப்புக் கைம்மிகுதல் உண்மையான
    அன்பே அறனே இன்பம் நாணொடு
    துறந்த ஒழுக்கம் பழித்து அன்று ஆகலின்
    ஒன்றும் வேண்டா காப்பினுள்ளே
  kaandigai:
    porul: பொருள் (தேடல்) என்று கூறுதலும் விலக்கில்லை — காவல் மிகுதலால். அன்பு, அறம், இன்பம், நாணம் ஆகியவற்றோடு துறந்த ஒழுக்கம் பழிக்கத்தக்கதன்று ஆதலால், காவலுள் வேறொன்றும் வேண்டா.
    ethu: 210 உண்டனபோல என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: காவல்_பொருள்
  links: []
  urai:
    iyaipu:
    - porul.210
    - porul.212
    - porul.220
    text: 'இயைபு (649): 210 உண்டல்; 212 சுரம்; 220 பரத்தை. ''வரை நிலை இன்றே'' — வரையறை இல்லை (வரையறை இன்மை).'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'வரை நிலை இன்றே' — இசைவு (வரையறை இன்மை)
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: ஒன்றும்
  - peyar: ஒருதலை அன்மை
    saanru: வரை நிலை இன்றே
- id: porul.212
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 212
  moolam: |-
    சுரம் என மொழிதலும் வரை நிலை இன்றே
  kaandigai:
    porul: சுரம் (வழியின் அருமை) என்று கூறுதலும் விலக்கில்லை.
    ethu: 211 பொருள் என்றது; 'சுரம்' என மொழிதலும் வரைநிலை இன்றே — இசைவு (வரையறை இன்மை).
  nilai: நூலில் நேரடியாக
  kanini:
