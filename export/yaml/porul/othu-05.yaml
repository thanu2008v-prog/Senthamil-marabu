    saanru: வரை நிலை இன்றே
- id: porul.213
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 213
  moolam: |-
    உயர்ந்தோர் கிளவி வழக்கொடு புணர்தலின்
    வழக்கு வழிப்படுதல் செய்யுட்குக் கடனே
  kaandigai:
    porul: 'உயர்ந்தோர் கிளவி வழக்கோடு பொருந்துவதால், வழக்கின் வழிப்படுதல் செய்யுளுக்குக் கடமை. வழக்கு: பொருள். 638.'
    ethu: 212 சுரம் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: வழக்கு_கடமை
  links: []
  urai:
    iyaipu:
    - porul.212
    - porul.214
    text: 'இயைபு (649): 212 சுரம்; 214 அறக்கழிவு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஆணை கூறல்
    saanru: கடனே
- id: porul.214
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 214
  moolam: |-
    அறக் கழிவு உடையன பொருட் பயம் பட வரின்
    வழக்கு என வழங்கலும் பழித்து அன்று என்ப
  kaandigai:
    porul: அறத்தைக் கடந்தவை பொருள் பயன் தருமாயின் வழக்கு என வழங்குதலும் பழிக்கத்தக்கதன்று என்பர்.
    ethu: 213 வழக்கு என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: அறக்கழிவு
  links: []
  urai:
    iyaipu:
    - porul.213
    - porul.215
    text: 'இயைபு (649): 213 வழக்கு; 215 பொருள் வகை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: porul.215
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 215
  moolam: |-
    மிக்க பொருளினுள் பொருள் வகை புணர்க்க
    நாணுத் தலைப்பிரியா நல்வழிப் படுத்தே
  kaandigai:
    porul: மிக்க பொருளுள் பொருள் வகையைப் புணர்க்க — நாணம் நீங்காத நல்வழிப்படுத்தி.
    ethu: 214 அறக்கழிவு என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: பொருள்_நாண்
  links: []
  urai:
    iyaipu:
    - porul.214
    - porul.216
    text: 'இயைபு (649): 214 அறக்கழிவு; 216 முறைப்பெயர்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.216
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 216
  moolam: |-
    முறைப்பெயர் மருங்கின் கெழுதகைப் பொதுச் சொல்
    நிலைக்கு உரி மரபின் இரு வீற்றும் உரித்தே
  kaandigai:
    porul: முறைப்பெயர்களுள் உரிமையுடைய பொதுச் சொல் நிலைக்குரிய மரபால் இருபாலுக்கும் உரியது.
    ethu: 215 பொருள் வகை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: பொதுச்சொல்_இருபால்
  links: []
  urai:
    iyaipu:
    - porul.215
    - porul.217
    - sol.83
    text: 'இயைபு (649): 215 பொருள் வகை; 217 தாயம்; சொல். 83 கண்-வகை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: உரித்தே
- id: porul.217
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 217
  moolam: |-
    தாயத்தின் அடையா ஈயச் செல்லா
    வினைவயின் தங்கா வீற்றுக் கொளப்படா
    எம் என வரூஉம் கிழமைத் தோற்றம்
    அல்லாவாயினும் புல்லுவ உளவே
  kaandigai:
    porul: தாயமாக அடையாத, ஈயச் செல்லாத, வினையில் தங்காத, பிரித்துக் கொள்ளப்படாத "எம்" என வரும் உரிமைத் தோற்றம் — அல்லாதவையானாலும் பொருந்துவன உள.
    ethu: 216 இரு வீறு என்றது; இது அதன் தொடர்ச்சி.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: rule
    class: எம்_உரிமை
  links: []
  urai:
    iyaipu:
    - porul.216
    - porul.218
    - sol.204
    text: 'இயைபு (649): 216 பொதுச்சொல்; 218 ஒரு பால்; சொல். 204 ''எம்'' — வடிவம். ''உளவே'' — எவை என நூல் பெயரிடவில்லை — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'உளவே' ஒருதலை அன்மை
- id: porul.218
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 218
  moolam: |-
    ஒரு பால் கிளவி எனைப் பாற்கண்ணும்
    வரு வகைதானே வழக்கு என மொழிப
  kaandigai:
    porul: 'ஒருபால் கிளவி எப்பாலிலும் வரும் வகை வழக்கு என்பர். காண்க: சொல். 27.'
    ethu: 217 கிழமை என்றது; ஒரு பால் கிளவி எனைப் பாற்கண்ணும் வருவகைதானே வழக்கு — இசைவு (வரையறை இன்மை).
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ஒருபால்_வழக்கு
  links: []
  urai:
    iyaipu:
    - porul.217
    - porul.219
    text: 'இயைபு (649): 217 கிழமை; 219 எல்லா உயிர்க்கும்.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'எனைப் பாற்கண்ணும்' — இசைவு (வரையறை இன்மை)
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
  - peyar: தான் குறியிடுதல்
    saanru: என மொழிப
- id: porul.219
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 219
  moolam: |-
    எல்லா உயிர்க்கும் இன்பம் என்பது
    தான் அமர்ந்து வரூஉம் மேவற்று ஆகும்
  kaandigai:
    porul: எல்லா உயிர்க்கும் இன்பம் என்பது தான் அமர்ந்து வரும் விருப்பத்தினது.
    ethu: 218 வழக்கு என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: இன்ப_வரையறை
  links: []
  urai:
    iyaipu:
    - porul.218
    - porul.220
    text: 'இயைபு (649): 218 வழக்கு; 220 பரத்தை.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.220
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 220
  moolam: |-
    பரத்தை வாயில் நால்வர்க்கும் உரித்தே
    நிலத் திரிபு இன்று அஃது என்மனார் புலவர்
  kaandigai:
    porul: பரத்தை வாயில் நால்வர்க்கும் உரியது; அதற்கு நிலத் திரிபு இல்லை என்பர் புலவர்.
    ethu: 219 இன்பம் என்றது; இது அதன் தொடர்ச்சி.
  nilai: ஒருதலை அன்மை
  kanini:
    kind: enumeration
    class: பரத்தை_வாயில்_நால்வர்
    count: 4
    items_not_named: true
  links: []
  urai:
    iyaipu:
    - porul.219
    - porul.221
    - porul.191
    text: 'இயைபு (649): 219 இன்பம்; 221 ஒருதலை உரிமை; 191 வாயில் பட்டியல் (அதில் பரத்தை பெயர் இல்லை). ''நால்வர்'' — யார் என நூல் இங்கு விரிக்கவில்லை — ஒருதலை அன்மை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'நால்வர்' யார் என ஒருதலை அன்மை
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்மனார்
  - peyar: ஒருதலை அன்மை
    saanru: உரித்தே
- id: porul.221
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 221
  moolam: |-
    ஒருதலை உரிமை வேண்டினும் மகடூஉப்
    பிரிதல் அச்சம் உண்மையானும்
    அம்பலும் அலரும் களவு வெளிப்படுக்கும் என்று
    அஞ்ச வந்த ஆங்கு இரு வகையினும்
    நோக்கொடு வந்த இடையூறு பொருளினும்
    போக்கும் வரைவும் மனைவிகண் தோன்றும்
  kaandigai:
    porul: ஒருதலை உரிமை வேண்டினும், பிரிதல் அச்சத்தாலும், அம்பலும் அலரும் களவை வெளிப்படுத்தும் என்ற அச்சத்தாலும், நோக்கோடு வந்த இடையூற்றாலும் — போக்கும் வரைவும் மனைவியிடம் தோன்றும்.
    ethu: 220 பரத்தை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: மனைவி_போக்கு
  links: []
  urai:
    iyaipu:
    - porul.220
    - porul.222
    - porul.229
    text: 'இயைபு (649): 220 பரத்தை; 222 வருத்தம்; 229 கற்புவழிப்பட்டவள்.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: இரு வகையினும்
- id: porul.222
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 222
  moolam: |-
    வருத்த மிகுதி சுட்டும் காலை
    உரித்து என மொழிப வாழ்க்கையுள் இரக்கம்
  kaandigai:
    porul: வருத்த மிகுதியைச் சுட்டும்போது வாழ்க்கையுள் இரக்கம் உரியது என்பர்.
    ethu: 221 இரு வகை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: இரக்கம்_வாழ்க்கை
  links: []
  urai:
    iyaipu:
    - porul.221
    - porul.223
    text: 'இயைபு (649): 221 இரு வகை; 223 மனைவி உயர்வு.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'உரித்து' — இசைவு (வரையறை இன்மை)
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
  - peyar: தான் குறியிடுதல்
    saanru: என மொழிப
  - peyar: ஒருதலை அன்மை
    saanru: உரித்து
- id: porul.223
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 223
  moolam: |-
    மனைவி உயர்வும் கிழவோன் பணிவும்
    நினையும் காலை புலவியுள் உரிய
  kaandigai:
    porul: மனைவியின் உயர்வும் கிழவோனின் பணிவும் புலவியுள் உரியன.
    ethu: 222 இரக்கம் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: புலவி_மனைவி
  links: []
  urai:
    iyaipu:
    - porul.222
    - porul.224
    - porul.154
    text: 'இயைபு (649): 222 இரக்கம்; 224 வேட்கை மிகுதி; 154 புலத்தல்.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக
- id: porul.224
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 224
  moolam: |-
    நிகழ் தகை மருங்கின் வேட்கை மிகுதியின்
    புகழ் தகை வரையார் கற்பினுள்ளே
  kaandigai:
    porul: நிகழத்தக்க இடத்து வேட்கை மிகுதியால் புகழ்தலைக் கற்பினுள் விலக்கார்.
    ethu: 223 புலவி என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: கற்பு_புகழ்
  links: []
  urai:
    iyaipu:
    - porul.223
    - porul.225
    text: 'இயைபு (649): 223 புலவி; 225 இறைச்சி.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'வரையார்' — இசைவு (வரையறை இன்மை)
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: வரையார்
- id: porul.225
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 225
  moolam: |-
    இறைச்சிதானே உரிப் புறத்ததுவே
  kaandigai:
    porul: இறைச்சி உரிப்பொருளுக்குப் புறத்தது.
    ethu: 224 கற்பு என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: definition
    class: இறைச்சி_வரையறை
  links: []
  urai:
    iyaipu:
    - porul.224
    - porul.226
    - porul.146
    text: 'இயைபு (649): 224 கற்பு; 226 இறைச்சியின் பிறக்கும்; 146 இறைச்சி (பொருள். 146-இல் முதல் வருகை).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.226
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 226
  moolam: |-
    இறைச்சியின் பிறக்கும் பொருளுமார் உளவே
    திறத்து இயல் மருங்கின் தெரியுமோர்க்கே
  kaandigai:
    porul: இறைச்சியால் பிறக்கும் பொருளும் உண்டு — திறம் அறிந்து ஆராய்வோர்க்குத் தெரியும்.
    ethu: 225 இறைச்சி என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: இறைச்சி_விளைவு
  links: []
  urai:
    iyaipu:
    - porul.225
    - porul.227
    text: 'இயைபு (649): 225 இறைச்சி; 227 வன்புறை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'உளவே' — இசைவு (வரையறை இன்மை)
- id: porul.227
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 227
  moolam: |-
    அன்புறு தகுவன இறைச்சியுள் சுட்டலும்
    வன்புறை ஆகும் வருந்திய பொழுதே
  kaandigai:
    porul: அன்புறு தகுவனவற்றை இறைச்சியுள் சுட்டுதலும் வருந்திய பொழுது வன்புறை ஆகும்.
    ethu: 226 இறைச்சி என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: இறைச்சி_வன்புறை
  links: []
  urai:
    iyaipu:
    - porul.226
    - porul.228
    text: 'இயைபு (649): 226 பொருள்; 228 கிழவி பாராட்டு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.228
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 228
  moolam: |-
    செய் பொருள் அச்சமும் வினைவயின் பிரிவும்
    மெய்பெற உணர்த்தும் கிழவி பாராட்டே
  kaandigai:
    porul: செய்பொருள் அச்சமும் வினைவயிற் பிரிவும் உண்மை பெற உணர்த்துவது கிழவி பாராட்டு.
    ethu: 227 வன்புறை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: கிழவி_பாராட்டு
  links: []
  urai:
    iyaipu:
    - porul.227
    - porul.229
    - porul.146
    text: 'இயைபு (649): 227 வன்புறை; 229 கற்புவழிப்பட்டவள்; 146 மனையில் இருந்து (பிரிவு).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.229
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 229
  moolam: |-
    கற்புவழிப் பட்டவள் பரத்தைமை ஏத்தினும்
    உள்ளத்து ஊடல் உண்டு என மொழிப
  kaandigai:
    porul: கற்பு வழிப்பட்டவள் பரத்தைமையைப் புகழ்ந்தாலும் உள்ளத்தில் ஊடல் உண்டு என்பர்.
    ethu: 228 கிழவி பாராட்டு என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: உள்ளூடல்_கற்பு
  links: []
  urai:
    iyaipu:
    - porul.228
    - porul.230
    text: 'இயைபு (649): 228 கிழவி; 230 கிழவோள்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: மொழிப
  - peyar: தான் குறியிடுதல்
    saanru: என மொழிப
- id: porul.230
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 230
  moolam: |-
    கிழவோள் பிறள் குணம் இவை எனக் கூறி
    கிழவோன் குறிப்பினை உணர்தற்கும் உரியள்
  kaandigai:
    porul: கிழவோள் "பிறள் குணம் இவை" எனக் கூறிக் கிழவோன் குறிப்பை உணர்தற்கும் உரியள்.
    ethu: 229 ஊடல் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: கிழவோள்_குறிப்பு
  links: []
  urai:
    iyaipu:
    - porul.229
    - porul.231
    text: 'இயைபு (649): 229 ஊடல்; 231 பரத்தையர்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.231
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 231
  moolam: |-
    தம் உறு விழுமம் பரத்தையர் கூறினும்
    மெய்ம்மையாக அவர்வயின் உணர்ந்தும்
    தலைத்தாட் கழறல் தம் எதிர்ப்பொழுது இன்றே
    மலிதலும் ஊடலும் அவை அலங்கடையே
  kaandigai:
    porul: பரத்தையர் தம் துன்பத்தைக் கூறினும், அவரிடம் உண்மையாக உணர்ந்தும், அவர் எதிர்ப்பொழுதில் (மனைவி) முன்னின்று கழறல் இல்லை; அவை அல்லாதவிடத்து மகிழ்தலும் ஊடலும் உண்டு.
    ethu: 230 கிழவோன் குறிப்பு என்றது; தம் உறு விழுமம் பரத்தையர் கூறினும் — மெய்ம்மையாக அவர்வயின் உணர்ந்தும் தலைத்தாட் கழறல் தம் எதிர்ப்பொழுது இன்றே; மலிதலும் ஊடலும் அவை அலங்கடையே.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: தலைவி_கழறல்
  links: []
  urai:
    iyaipu:
    - porul.230
    - porul.232
    text: 'இயைபு (649): 230 கிழவோள்; 232 கையறு.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.232
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 232
  moolam: |-
    பொழுது தலைவைத்த கையறு காலை
    இறந்த போலக் கிளக்கும் கிளவி
    மடனே வருத்தம் மருட்கை மிகுதியொடு
    அவை நாற் பொருட்கண் நிகழும் என்ப
  kaandigai:
    porul: பொழுது முன்வந்த கையறு காலத்து, இறந்தது போலக் கூறும் கிளவி மடம், வருத்தம், மருட்கை, மிகுதி என்ற நான்கு பொருளில் நிகழும் என்பர்.
    en:
      kooruvathu: 4
      enniyathu: 4
    ethu: 231 மலிதல்/ஊடல் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: கையறு_பொருள்
    count: 4
  links: []
  urai:
    iyaipu:
    - porul.231
    - porul.233
    text: 'இயைபு (649): 231 மலிதல்; 233 இரந்து. எண்: 4 (மடன், வருத்தம், மருட்கை, மிகுதி).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒப்பக் கூறல்
    saanru: போலக்
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: porul.233
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 233
  moolam: |-
    இரந்து குறையுற்ற கிழவனைத் தோழி
    நிரம்ப நீக்கி நிறுத்தல் அன்றியும்
    வாய்மை கூறலும் பொய் தலைப்பெய்தலும்
    நல் வகையுடைய நயத்தின் கூறியும்
    பல் வகையானும் படைக்கவும் பெறுமே
  kaandigai:
    porul: இரந்து குறையுற்ற கிழவனைத் தோழி முழுதும் நீக்கி நிறுத்தலும், வாய்மை கூறலும், பொய் கலத்தலும், நயத்தோடு கூறலும் — பல வகையாலும் படைக்கவும் பெறும்.
    ethu: 232 நான்கு பொருள் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: தோழி_நீக்கம்
  links: []
  urai:
    iyaipu:
    - porul.232
    - porul.234
    - porul.204
    text: 'இயைபு (649): 232 கையறு; 234 உயர்மொழி; 204 தோழி 7.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: கூறிற்று என்றல்
    saanru: கூறியும்
- id: porul.234
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 234
  moolam: |-
    உயர் மொழிக் கிளவி உறழும் கிளவி
    ஐயக் கிளவி ஆடூஉவிற்கு உரித்தே
  kaandigai:
    porul: உயர்மொழிக் கிளவி, உறழும் கிளவி, ஐயக் கிளவி ஆண்பாலுக்கு உரியன.
    ethu: 233 தோழி என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: ஆண்பால்_கிளவி
    count: 3
  links: []
  urai:
    iyaipu:
    - porul.233
    - porul.235
    - porul.95
    text: 'இயைபு (649): 233 தோழி; 235 தோழிகண்; 95 ஆண்பால் (பெருமை/உரன்). எண்: 3 (உயர்மொழி, உறழும், ஐயம்).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஒருதலை அன்மை
    saanru: உறழும்
- id: porul.235
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 235
  moolam: |-
    உறுகண் ஓம்பல் தன் இயல்பு ஆகலின்
    உரியதாகும் தோழிகண் உரனே
  kaandigai:
    porul: துன்பம் காத்தல் தன் இயல்பு ஆதலால் தோழியிடம் உரன் உரியதாகும்.
    ethu: 234 ஆண்பாற்கு என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: தோழி_உரன்
  links: []
  urai:
    iyaipu:
    - porul.234
    - porul.236
    text: 'இயைபு (649): 234 ஆண்பாற்கு; 236 உயர்மொழி.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: ஆணை கூறல்
    saanru: ஓம்பல்
- id: porul.236
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 236
  moolam: |-
    உயர் மொழிக் கிளவியும் உரியவால் அவட்கே
  kaandigai:
    porul: உயர்மொழிக் கிளவியும் அவளுக்கு (தோழிக்கு) உரியன.
    ethu: 235 தோழிகண் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: தோழி_உயர்மொழி
  links: []
  urai:
    iyaipu:
    - porul.234
    - porul.235
    - porul.237
    text: 'இயைபு (649): 235 தோழி; 234 உயர்மொழி; 237 வாயில்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.237
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 237
  moolam: |-
    வாயிற் கிளவி வெளிப்படக் கிளத்தல்
    தா இன்று உரிய தம்தம் கூற்றே
  kaandigai:
    porul: வாயிற் கிளவியை வெளிப்படக் கூறுதல் குற்றமின்றித் தத்தம் கூற்றுக்கு உரியது.
    ethu: 236 தோழி என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: வாயில்_வெளிப்படை
  links: []
  urai:
    iyaipu:
    - porul.236
    - porul.238
    text: 'இயைபு (649): 236 தோழி; 238 உள்ளுறை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'தா இன்று உரிய' — இசைவு (வரையறை இன்மை)
- id: porul.238
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 238
  moolam: |-
    உடனுறை உவமம் சுட்டு நகை சிறப்பு எனக்
    கெடல் அரு மரபின் உள்ளுறை ஐந்தே
  kaandigai:
    porul: 'உள்ளுறை ஐந்து: உடனுறை, உவமம், சுட்டு, நகை, சிறப்பு. உள்ளுறை உவமம்: பொருள். 49–51.'
    en:
      kooruvathu: 5
      enniyathu: 5
    ethu: 237 வாயில் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: உள்ளுறை_வகை
    count: 5
  links: []
  urai:
    iyaipu:
    - porul.237
    - porul.239
    - porul.49
    text: 'இயைபு (649): 237 வாயில்; 239 இன்பம்; 49 உள்ளுறை (பொருள். 49-51). எண்: 5 (நூற்பா ''ஐந்தே'') = 5 (பட்டியல்).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: ஐந்தே
- id: porul.239
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 239
  moolam: |-
    அந்தம் இல் சிறப்பின் ஆகிய இன்பம்
    தன்வயின் வருதலும் வகுத்த பண்பே
  kaandigai:
    porul: முடிவில்லாச் சிறப்பால் ஆகிய இன்பம் தன்னிடம் வருதலும் வகுத்த பண்பு.
    ethu: 238 உள்ளுறை ஐந்து என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: இன்பம்_தன்வயின்
  links: []
  urai:
    iyaipu:
    - porul.238
    - porul.240
    text: 'இயைபு (649): 238 உள்ளுறை; 240 மங்கலம்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
- id: porul.240
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 240
  moolam: |-
    மங்கல மொழியும் வைஇய மொழியும்
    மாறு இல் ஆண்மையின் சொல்லிய மொழியும்
    கூறிய மருங்கின் கொள்ளும் என்ப
  kaandigai:
    porul: மங்கல மொழியும், வைதல் மொழியும், மாறில்லா ஆண்மையால் சொல்லிய மொழியும் கூறிய இடத்து (மரபாகக்) கொள்ளப்படும் என்பர்.
    ethu: 239 இன்பம் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: மொழி_வகை
  links: []
  urai:
    iyaipu:
    - porul.239
    - porul.241
    text: 'இயைபு (649): 239 இன்பம்; 241 நான்கு வகை.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'கொள்ளும்' — இசைவு (வரையறை இன்மை)
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: கூறிற்று என்றல்
    saanru: சொல்லிய
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: porul.241
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 241
  moolam: |-
    சினனே பேதைமை நிம்பிரி நல்குரவு
    அனை நால் வகையும் சிறப்பொடு வருமே
  kaandigai:
    porul: சினம், பேதைமை, நிம்பிரி (பொறாமை), நல்குரவு ஆகிய நான்கும் சிறப்போடு வரும். "நிம்பிரி" என்பதன் பொருளை நூல் கூறவில்லை.
    en:
      kooruvathu: 4
      enniyathu: 4
    ethu: 240 மங்கலம் என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: சிறப்பு_4
    count: 4
  links: []
  urai:
    iyaipu:
    - porul.240
    - porul.242
    text: 'இயைபு (649): 240 மங்கலம்; 242 அன்னை/என்னை. எண்: 4 (நூற்பா ''நால் வகையும்'') = 4 (பட்டியல்).'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
  utthi:
  - peyar: தொகுத்துக் கூறல்
    saanru: நால் வகையும்
- id: porul.242
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 242
  moolam: |-
    அன்னை என்னை என்றலும் உளவே
    தொல் நெறி முறைமை சொல்லினும் எழுத்தினும்
    தோன்றா மரபின என்மனார் புலவர்
  kaandigai:
    porul: '"அன்னை", "என்னை" என்றலும் உண்டு; தொன்னெறி முறைமை சொல்லிலும் எழுத்திலும் தோன்றாத மரபின என்பர் புலவர்.'
    ethu: 241 நான்கு வகை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: அன்னை_வழக்கு
  links: []
  urai:
    iyaipu:
    - porul.241
    - porul.243
    text: 'இயைபு (649): 241 நான்கு; 243 ஒப்பு/உரு.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'உளவே' — இசைவு (வரையறை இன்மை)
  utthi:
  - peyar: முறை பிறழாமை
    saanru: முறைமை
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்மனார்
- id: porul.243
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 243
  moolam: |-
    ஒப்பும் உருவும் வெறுப்பும் என்றா
    கற்பும் ஏரும் எழிலும் என்றா
    சாயலும் நாணும் மடனும் என்றா
    நோயும் வேட்கையும் நுகர்வும் என்று ஆங்கு
    ஆவயின் வரூஉம் கிளவி எல்லாம்
    நாட்டு இயல் மரபின் நெஞ்சு கொளின் அல்லது
    காட்டலாகாப் பொருள என்ப
  kaandigai:
    porul: ஒப்பு, உரு, வெறுப்பு; கற்பு, ஏர், எழில்; சாயல், நாண், மடம்; நோய், வேட்கை, நுகர்வு — இவை பற்றி வரும் கிளவியெல்லாம் நாட்டு இயல் மரபால் நெஞ்சு கொண்டாலல்லாமல் காட்ட இயலாப் பொருளன.
    ethu: 242 அன்னை/என்னை என்றது; இது அதன் தொடர்ச்சி.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: enumeration
    class: காட்டலாகாப்_பொருள்
    count: 12
  links: []
  urai:
    iyaipu:
    - porul.242
    - porul.244
    text: 'இயைபு (649): 242 அன்னை; 244 இமையோர். எண்: 12 (4×3) — நூற்பாவில் எண் கூறப்படவில்லை. ''அல்லது'' — நாட்டு இயல்மரபின் நெஞ்சு கொள்ளாவிட்டால் காட்டலாகா.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'அல்லது' — வரையறை
  utthi:
  - peyar: பிறன் உடன்பட்டது தான் உடம்படுதல்
    saanru: என்ப
  - peyar: தான் குறியிடுதல்
    saanru: என்ப
- id: porul.244
  pindam: 1
  padalam: porul
  othu: 5
  sutra: 244
  moolam: |-
    இமையோர் தேஎத்தும் எறி கடல் வரைப்பினும்
    அவை இல் காலம் இன்மையான
  kaandigai:
    porul: தேவர் உலகிலும் கடல் சூழ் உலகிலும் அவை இல்லாத காலம் இல்லாததால். (243-இன் தொடர்ச்சி.)
    ethu: 243 இயல்மரபு என்றது; இமையோர் தேஎத்தும் எறிகடல் வரைப்பினும் அவை இல் காலம் இன்மையான — இறுதி வரையறை.
  nilai: நூலில் நேரடியாக
  kanini:
    kind: rule
    class: ஓத்து_புறனடை
  links: []
  urai:
    iyaipu:
    - porul.243
    - porul.89
    text: 'இயைபு (649): 243 இயல்மரபு; 89 காம வாழ்க்கை — முழு ஓத்தின் தொடக்கமும் முடிவும்.'
    vagai: விதி
    thunivu: நூலில் நேரடியாக
