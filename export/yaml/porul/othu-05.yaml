    - porul.211
    - porul.213
    text: 'இயைபு (649): 211 பொருள்; 213 உயர்ந்தோர்.'
    vagai: விதி
    thunivu: விதி நூலில் நேரடியாக; 'வரை நிலை இன்றே' — இசைவு (வரையறை இன்மை)
  utthi:
