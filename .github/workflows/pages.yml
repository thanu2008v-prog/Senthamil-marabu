name: Site (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /alavai/
            /app/
            /book/
            /data/
            /data_v2/
            /docs/
            /examples/
            /fonts/
            /karuvi/
            /kuriyaakkam/
            /orunguri/
            /pirankol/
            /pothu/
            /punarchi/
            /rules/
            /schema/
            /scripts/
            /senthamil_marabu/
            /seyali/
            /sources/
            !/sources/ *
            /tests/
            /urai_kit/
            /.gitattributes
            /.gitignore
            /.zenodo.json
            /CHANGES.md
            /CITATION.cff
            /CONTRIBUTING.md
            /datapackage.json
            /ai_console.py
            /hfst-3.12.2.4b0.tar.gz
            /index.html
            /install_tamil_font.bat
            /install_tamil_font.ps1
            /LICENSE.md
            /Makefile
            /pyproject.toml
            /README.md
            /requirements.txt
            /run_aakkam.bat
            /run_ai.bat
            /senthamil_app.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt pillow
      - name: Check (data, book rules, tests)
        run: make check
      - name: Build tools and site
        run: |
          python karuvi/build.py
          python scripts/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
